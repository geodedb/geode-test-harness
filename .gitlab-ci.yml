# Diagnostic branch only: never merge this reduced pipeline.
workflow:
  auto_cancel:
    on_new_commit: interruptible
    on_job_failure: all
  rules:
    - when: always
stages: [test]
pool-fixture-real-server:
  stage: test
  image: alpine:3.24
  tags: [company, dedicated, linux, x86, docker]
  timeout: 10m
  interruptible: true
  retry: 0
  variables:
    GIT_DEPTH: "1"
  before_script:
    - apk add --no-cache bash curl coreutils openssl python3 py3-pip procps
    - mkdir -p .ci-artifacts reports
    - |
      for artifact in geode geode.sha256 geode-source.sha; do
        curl --fail --silent --show-error --location --header "JOB-TOKEN: $CI_JOB_TOKEN" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/jobs/17529373963/artifacts/.ci-artifacts/$artifact" \
          --output ".ci-artifacts/$artifact"
      done
    - test "$(cat .ci-artifacts/geode-source.sha)" = "e2976dadb7923cd899652a2d308f701952d653bc"
    - sha256sum -c .ci-artifacts/geode.sha256
    - chmod +x .ci-artifacts/geode
    - export GEODE_BINARY="$CI_PROJECT_DIR/.ci-artifacts/geode"
    - export GEODE_SOURCE_DIR="$CI_PROJECT_DIR"
    - export PATH="$CI_PROJECT_DIR/.ci-artifacts:$PATH"
    - python3 -m venv .venv
    - . .venv/bin/activate
    - pip install -q -e ./geodetestlab-cli
  script:
    - python -m geodetestlab run --spec geodetestlab-cli/specs/shell_plain_mode.yml --max-cases 0 --geode-binary "$GEODE_BINARY" --report-json reports/shell.json --failure-file reports/shell-failures.md
    - python -m geodetestlab run --spec geodetestlab-cli/specs/connection_pool_rejection.yml --max-cases 0 --geode-binary "$GEODE_BINARY" --report-json reports/pool.json --failure-file reports/pool-failures.md
  artifacts:
    when: always
    paths: [reports/]
    expire_in: 1 week
