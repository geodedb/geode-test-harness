stages:
  - build
  - integration
  - triage
  - analyze
  - report
  - pages

variables:
  GEODE_IMAGE: geodedb/geode:latest
  GEODE_PORT: "3141"
  # Disable quic-go receive buffer warning in CI
  QUIC_GO_DISABLE_RECEIVE_BUFFER_WARNING: "true"
  # GitLab API token for creating issues (set in CI/CD variables)
  # GITLAB_TOKEN should be a project access token with api scope
  # Docker registry authentication
  DOCKER_AUTH_CONFIG: '{"auths":{"registry.gitlab.com":{"auth":"${CI_REGISTRY_AUTH}"}}}'

.build-template:
  stage: build
  tags:
    - company
    - linux
  allow_failure: true
  artifacts:
    paths:
      - runners/zig_runner
      - runners/go_runner
      - runners/rust_runner/target/release/rust_runner
    expire_in: 1 hour

build-zig:
  extends: .build-template
  image: alpine:latest
  before_script:
    - apk add --no-cache curl xz tar
    # Use Zig 0.14.0 (latest stable available)
    - curl -L https://ziglang.org/download/0.14.0/zig-linux-x86_64-0.14.0.tar.xz | tar xJ
    - export PATH="$PWD/zig-linux-x86_64-0.14.0:$PATH"
    - zig version
  script:
    - export PATH="$PWD/zig-linux-x86_64-0.14.0:$PATH"
    - cd runners
    - zig build -Doptimize=ReleaseSafe || echo "Zig build failed - may need Zig 0.15+"
    - cp zig-out/bin/zig_runner ./zig_runner 2>/dev/null || echo "Zig runner not built"
  rules:
    - exists:
        - runners/build.zig

build-go:
  extends: .build-template
  image: golang:1.24
  allow_failure: true
  before_script:
    # Clone the Go client repo using CI job token
    # Note: Requires "Allow access to this project with a CI_JOB_TOKEN" enabled in geode-client-go settings
    - git clone --depth 1 https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/devnw/codepros/geode/geode-client-go.git ../geode-client-go
  script:
    - cd runners
    - go mod edit -replace geodedb.com/geode=../../geode-client-go
    - GONOSUMCHECK=geodedb.com/geode go build -o go_runner go_runner.go
  rules:
    - exists:
        - runners/go_runner.go

build-rust:
  extends: .build-template
  image: rust:1.85
  before_script:
    # Clone the Rust client repo using CI job token for auth
    - apt-get update -qq && apt-get install -y -qq git
    - git clone --depth 1 https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/devnw/codepros/geode/geode-client-rust.git ../geode-client-rust || echo "Client clone failed"
  script:
    - cd runners/rust_runner
    # Override git dependency to use locally cloned repo
    - mkdir -p .cargo
    - printf '[patch."https://gitlab.com/devnw/codepros/geode/geode-client-rust.git"]\ngeode-client = { path = "../../../geode-client-rust" }\n' > .cargo/config.toml
    - cargo build --release
  rules:
    - exists:
        - runners/rust_runner/Cargo.toml

build-python:
  extends: .build-template
  image: python:3.11
  script:
    - pip install pyyaml
    - python3 -c "import yaml; print('Python dependencies installed')"
  artifacts:
    paths: []

build-nodejs:
  extends: .build-template
  image: node:20
  script:
    - cd runners
    - npm install yaml || echo "Node.js dependencies installed"
  artifacts:
    paths: []

# NOTE: Integration tests require Geode server. The Kubernetes executor cannot pull
# the private Geode registry image for services. Integration tests should be run locally:
#   make docker-start && make test-all
#
# To enable CI integration tests:
# 1. Make the Geode Docker image public, OR
# 2. Configure imagePullSecrets in the Kubernetes namespace, OR
# 3. Use a shell executor runner with Docker access

.integration-template:
  stage: integration
  tags:
    - company
    - linux
  image: python:3.11
  # Service-based approach disabled due to private registry auth issues
  # services:
  #   - name: $GEODE_IMAGE
  #     alias: geode
  #     command: ["serve", "--listen", "0.0.0.0:3141", "--log-level", "info"]
  variables:
    GEODE_HOST: "127.0.0.1"
    GEODE_PORT: "3141"
  before_script:
    - pip install pyyaml --quiet
    - mkdir -p reports
  artifacts:
    paths:
      - reports/
    reports:
      junit: reports/junit-*.xml
    expire_in: 1 week
    when: always
  # Allow failures until Geode image auth is configured
  allow_failure: true

test-all:
  extends: .integration-template
  dependencies:
    - build-zig
    - build-go
    - build-rust
    - build-python
    - build-nodejs
  script:
    - echo "NOTE - Integration tests skipped in CI (Geode server not available)"
    - echo "Run integration tests locally with - make docker-start && make test-all"
    - python3 -c "import json; d={'summary':{'total':0,'passed':0,'failed':0,'skipped':1,'errors':0},'results':[{'test':'ci-placeholder','status':'skipped','skip_reason':'Geode server not available in CI'}]}; print(json.dumps(d))" > reports/results.json
    - cat reports/results.json
  rules:
    - when: always

# Individual language tests are disabled - use test-all instead
# These jobs require a Geode server but can't easily run Docker-in-Docker
# Uncomment and configure if you need per-language CI jobs

