[package]
name = "rust_runner"
version = "0.1.0"
edition = "2021"

[dependencies]
# Geode Rust client
geode-client = { path = "../../../geode-client-rust" }

# Async runtime
tokio = { version = "1.53", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yml = "0.0.13"

# CLI
clap = { version = "4.6", features = ["derive"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

[[bin]]
name = "rust_runner"
path = "src/main.rs"
