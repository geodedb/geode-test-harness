version: '1.0'
name: Geode CLI-Only Tests (No Server)
description: Test Geode CLI commands that don't require a running server
cli:
  binary: ./zig-out/bin/geode
  working_dir: null
  env:
    GEODE_LOG_LEVEL: info
  server:
    enabled: false
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    server_address: 127.0.0.1:3141
    timeout_ms: 30000
    tls_verify: false
    format: json
secrets: {}
invariants: []
fuzz:
  enabled: false
tests:
- name: help-command
  description: Test basic help command
  args:
  - --help
  expect:
    exit_code: 0
    stderr_contains:
    - 'Usage:'
    - 'Subcommands:'
  tags:
  - basic
  - help
- name: server-help
  description: Test server subcommand help
  args:
  - serve
  - --help
  expect:
    exit_code: 0
    stderr_contains:
    - serve
    - Start
  tags:
  - server
  - help
- name: shell-help
  description: Test shell subcommand help
  args:
  - shell
  - --help
  expect:
    exit_code: 0
    stderr_contains:
    - shell
    - Interactive
  tags:
  - shell
  - help
- name: query-help
  description: Test query subcommand help
  args:
  - query
  - --help
  expect:
    exit_code: 0
    stderr_contains:
    - query
    - Execute
  tags:
  - query
  - help
- name: backup-help
  description: Test backup subcommand help
  args:
  - backup
  - --help
  expect:
    exit_code: 0
    stderr_contains:
    - backup
  tags:
  - backup
  - help
- name: restore-help
  description: Test restore subcommand help
  args:
  - restore
  - --help
  expect:
    exit_code: 0
    stderr_contains:
    - restore
  tags:
  - restore
  - help
- name: auth-help
  description: Test auth subcommand help
  args:
  - auth
  - --help
  expect:
    exit_code: 0
    stderr_contains:
    - auth
    - commands
  tags:
  - auth
  - help
- name: user-help
  description: Test user management help
  args:
  - user
  - --help
  expect:
    exit_code: 0
    stderr_contains:
    - user
  tags:
  - user
  - help
- name: invalid-command
  description: Test error handling with invalid command
  args:
  - nonexistent-command
  expect:
    status: error
    exit_code: 2
    stderr_contains:
    - Error
    - unknown
  tags:
  - error
tags:
- cli
- no-server
- geode
