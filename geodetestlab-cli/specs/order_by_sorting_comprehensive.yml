version: "1.0"
name: "ORDER BY Sorting Comprehensive Tests"
description: "Tests for ORDER BY clause with heap sort algorithm (O(n log n) performance)"

cli:
  binary: "./zig-out/bin/geode"
  working_dir: null
  env:
    GEODE_LOG_LEVEL: "info"
  server:
    enabled: true
    port: null
    data_dir: null
    startup_timeout_ms: 60000
    cleanup: true
    args: ["--log-level", "info"]
    env: {}
  client:
    server_address: "127.0.0.1:3141"
    timeout_ms: 30000
    tls_verify: false
    format: "json"

secrets:
  admin_password:
    source: "env"
    key: "GEODE_ADMIN_PASSWORD"
    required: false

invariants:
  - type: "server_running"

fuzz:
  enabled: false

setup:
  # Create test data for ORDER BY tests
  - args: ["query", "-"]
    stdin: |
      CREATE (:OrderTestInt {val: 5})
      CREATE (:OrderTestInt {val: 2})
      CREATE (:OrderTestInt {val: 8})
      CREATE (:OrderTestInt {val: 1})
      CREATE (:OrderTestInt {val: 9})
      CREATE (:OrderTestInt {val: 3})
    expect:
      exit_code: 0

  - args: ["query", "-"]
    stdin: |
      CREATE (:OrderTestStr {name: 'zebra'})
      CREATE (:OrderTestStr {name: 'apple'})
      CREATE (:OrderTestStr {name: 'mango'})
      CREATE (:OrderTestStr {name: 'banana'})
    expect:
      exit_code: 0

  - args: ["query", "-"]
    stdin: |
      CREATE (:OrderTestNull {val: 3})
      CREATE (:OrderTestNull {val: NULL})
      CREATE (:OrderTestNull {val: 1})
      CREATE (:OrderTestNull {val: NULL})
      CREATE (:OrderTestNull {val: 2})
    expect:
      exit_code: 0

  - args: ["query", "-"]
    stdin: |
      CREATE (:OrderTestPerson {name: 'Alice', age: 30})
      CREATE (:OrderTestPerson {name: 'Bob', age: 25})
      CREATE (:OrderTestPerson {name: 'Alice', age: 25})
    expect:
      exit_code: 0

  - args: ["query", "-"]
    stdin: |
      CREATE (:OrderTestDec {val: 3.14})
      CREATE (:OrderTestDec {val: 2.71})
      CREATE (:OrderTestDec {val: 1.41})
      CREATE (:OrderTestDec {val: 1.73})
    expect:
      exit_code: 0

  - args: ["query", "-"]
    stdin: |
      CREATE (:OrderTestBool {val: true})
      CREATE (:OrderTestBool {val: false})
      CREATE (:OrderTestBool {val: true})
      CREATE (:OrderTestBool {val: false})
    expect:
      exit_code: 0

tests:
  # Basic ORDER BY tests
  - name: "order-by-asc-integers"
    description: "Test ORDER BY with ascending integer sort"
    args: ["query", "-"]
    stdin: "MATCH (n:OrderTestInt) RETURN n.val AS val ORDER BY n.val ASC"
    expect:
      exit_code: 0
      stdout_contains: ["1", "2", "3", "5", "8", "9"]
    tags: ["order-by", "sorting", "basic"]

  - name: "order-by-desc-integers"
    description: "Test ORDER BY with descending integer sort"
    args: ["query", "-"]
    stdin: "MATCH (n:OrderTestInt) RETURN n.val AS val ORDER BY n.val DESC"
    expect:
      exit_code: 0
      stdout_contains: ["9", "8", "5", "3", "2", "1"]
    tags: ["order-by", "sorting", "basic"]

  - name: "order-by-strings"
    description: "Test ORDER BY with string sorting"
    args: ["query", "-"]
    stdin: "MATCH (n:OrderTestStr) RETURN n.name AS name ORDER BY n.name"
    expect:
      exit_code: 0
      stdout_contains: ["apple", "banana", "mango", "zebra"]
    tags: ["order-by", "sorting", "strings"]

  - name: "order-by-strings-desc"
    description: "Test ORDER BY with descending string sorting"
    args: ["query", "-"]
    stdin: "MATCH (n:OrderTestStr) RETURN n.name AS name ORDER BY n.name DESC"
    expect:
      exit_code: 0
      stdout_contains: ["zebra", "mango", "banana", "apple"]
    tags: ["order-by", "sorting", "strings"]

  # NULL handling tests
  - name: "order-by-nulls-first"
    description: "Test ORDER BY with NULLS FIRST"
    args: ["query", "-"]
    stdin: "MATCH (n:OrderTestNull) RETURN n.val AS val ORDER BY n.val NULLS FIRST"
    expect:
      exit_code: 0
      stdout_contains: ["null", "1", "2", "3"]
    tags: ["order-by", "sorting", "nulls"]

  - name: "order-by-nulls-last"
    description: "Test ORDER BY with NULLS LAST"
    args: ["query", "-"]
    stdin: "MATCH (n:OrderTestNull) RETURN n.val AS val ORDER BY n.val NULLS LAST"
    expect:
      exit_code: 0
      stdout_contains: ["1", "2", "3", "null"]
    tags: ["order-by", "sorting", "nulls"]

  - name: "order-by-desc-nulls-last"
    description: "Test ORDER BY DESC with NULLS LAST"
    args: ["query", "-"]
    stdin: "MATCH (n:OrderTestNull) RETURN n.val AS val ORDER BY n.val DESC NULLS LAST"
    expect:
      exit_code: 0
      stdout_contains: ["3", "2", "1", "null"]
    tags: ["order-by", "sorting", "nulls"]

  - name: "order-by-desc-nulls-first"
    description: "Test ORDER BY DESC with NULLS FIRST"
    args: ["query", "-"]
    stdin: "MATCH (n:OrderTestNull) RETURN n.val AS val ORDER BY n.val DESC NULLS FIRST"
    expect:
      exit_code: 0
      stdout_contains: ["null", "3", "2", "1"]
    tags: ["order-by", "sorting", "nulls"]

  # Multiple sort keys
  - name: "order-by-multiple-keys"
    description: "Test ORDER BY with multiple sort keys"
    args: ["query", "-"]
    stdin: "MATCH (n:OrderTestPerson) RETURN n.name AS name, n.age AS age ORDER BY n.name, n.age"
    expect:
      exit_code: 0
      stdout_contains: ["Alice", "Bob", "25", "30"]
    tags: ["order-by", "sorting", "multiple-keys"]

  - name: "order-by-mixed-directions"
    description: "Test ORDER BY with mixed ASC/DESC"
    args: ["query", "-"]
    stdin: "MATCH (n:OrderTestPerson) RETURN n.name AS name, n.age AS age ORDER BY n.name ASC, n.age DESC"
    expect:
      exit_code: 0
      stdout_contains: ["Alice", "Bob"]
    tags: ["order-by", "sorting", "multiple-keys"]

  # Ordinal sort keys
  - name: "order-by-ordinal"
    description: "Test ORDER BY with ordinal column reference"
    args: ["query", "-"]
    stdin: "MATCH (n:OrderTestInt) RETURN n.val AS val ORDER BY 1"
    expect:
      exit_code: 0
      stdout_contains: ["1", "2", "3"]
    tags: ["order-by", "sorting", "ordinal"]

  # Decimal sorting
  - name: "order-by-decimals"
    description: "Test ORDER BY with decimal values"
    args: ["query", "-"]
    stdin: "MATCH (n:OrderTestDec) RETURN n.val AS val ORDER BY n.val"
    expect:
      exit_code: 0
      stdout_contains: ["1.41", "1.73", "2.71", "3.14"]
    tags: ["order-by", "sorting", "decimals"]

  # Boolean sorting
  - name: "order-by-booleans"
    description: "Test ORDER BY with boolean values"
    args: ["query", "-"]
    stdin: "MATCH (n:OrderTestBool) RETURN n.val AS val ORDER BY n.val"
    expect:
      exit_code: 0
      stdout_contains: ["false", "true"]
    tags: ["order-by", "sorting", "booleans"]

  # SKIP and LIMIT with ORDER BY
  - name: "order-by-skip-limit"
    description: "Test ORDER BY with SKIP and LIMIT"
    args: ["query", "-"]
    stdin: "MATCH (n:OrderTestInt) RETURN n.val AS val ORDER BY n.val SKIP 2 LIMIT 3"
    expect:
      exit_code: 0
      stdout_contains: ["3", "5", "8"]
    tags: ["order-by", "sorting", "pagination"]

  # Aliased expressions in ORDER BY
  - name: "order-by-alias"
    description: "Test ORDER BY with aliased column"
    args: ["query", "-"]
    stdin: "MATCH (n:OrderTestInt) WHERE n.val <= 3 RETURN n.val AS value ORDER BY value"
    expect:
      exit_code: 0
      stdout_contains: ["1", "2", "3"]
    tags: ["order-by", "sorting", "alias"]

  # Expression in ORDER BY
  - name: "order-by-expression"
    description: "Test ORDER BY with expression"
    args: ["query", "-"]
    stdin: "MATCH (n:OrderTestInt) WHERE n.val <= 3 RETURN n.val AS val, n.val * 2 AS doubled ORDER BY n.val * 2 DESC"
    expect:
      exit_code: 0
      stdout_contains: ["6", "4", "2"]
    tags: ["order-by", "sorting", "expression"]
