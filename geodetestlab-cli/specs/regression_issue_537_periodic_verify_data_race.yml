# --- Server must be alive after the bulk ingest ---
- name: issue-537-server-alive-after-bulk
  description: >
    Critical regression guard: after the back-to-back bulk MERGE batches,
    the server must still respond. Before the fix this query would time out
    because the server had crashed with a GPF in periodicVerifyLoop.
  args:
  - query
  - RETURN 'server alive' AS status
  expect:
    exit_code: 0
    stdout_contains:
    - server alive
  tags:
  - regression
  - issue-537
  - server-alive

# --- Verify node counts are correct (data integrity after concurrent access) ---
- name: issue-537-node-count-batch1
  description: All 60 nodes from batch 1 must be present.
  args:
  - query
  - MATCH (n:Reg537Node) RETURN count(n) AS total
  - --format
  - json
  expect:
    exit_code: 0
    stdout_contains:
    - total
    - '60'
  tags:
  - regression
  - issue-537
  - verification

- name: issue-537-node-count-batch2
  description: All 50 nodes from batch 2 must be present.
  args:
  - query
  - MATCH (n:Reg537Node2) RETURN count(n) AS total
  - --format
  - json
  expect:
    exit_code: 0
    stdout_contains:
    - total
    - '50'
  tags:
  - regression
  - issue-537
  - verification

# --- Cleanup ---
- name: issue-537-cleanup
  description: Remove all Reg537* nodes created by this regression spec.
  args:
  - query
  - '-'
  stdin: |
    MATCH (n:Reg537Node) DETACH DELETE n;
    MATCH (n:Reg537Node2) DETACH DELETE n;
  expect:
    exit_code: 0
  tags:
  - regression
  - issue-537
  - cleanup
