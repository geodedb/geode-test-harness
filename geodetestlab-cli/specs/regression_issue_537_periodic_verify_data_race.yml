version: '1.0'
name: regression-issue-537-periodic-verify-data-race
description: >
  Regression test for GitLab issue #537: data race in periodicVerifyLoop.

  periodicVerifyLoop called verifyChain() — which reads label_index via
  getNodesByLabel() and reads node properties via getNodeProperty() — without
  holding any lock. QUIC query handlers hold g_store_rwlock.lockShared()
  while executing MERGE statements that call addNodeLabel() → label_index.getOrPut().
  When a MERGE triggers a HashMap rehash (reallocating its internal backing
  array), the verify thread's concurrent lock-free read accesses freed memory,
  causing a General Protection Fault (SIGILL/IOT instruction).

  Fix: acquire acquireStoreLock() around the verifyChain() call in
  periodicVerifyLoop so it participates in the same shared-lock protocol
  used by query handlers.

  This spec verifies that the server survives rapid bulk MERGE ingestion
  (170+ nodes in rapid batches, mirroring the CMMC ingest that triggered
  the crash) and remains responsive immediately after — which it did NOT
  before the fix.
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    startup_timeout_ms: 60000
    cleanup: true
    args:
    - --log-level
    - error
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 120000
    tls_verify: false
    format: json
tests:
# --- Rapid bulk MERGE: 60 nodes in one batch ---
# The key trigger is fast successive MERGE batches that force HashMap
# rehashes while the periodic verify thread is concurrently reading.
- name: issue-537-bulk-merge-batch1
