version: '1.0'
name: Query and MERGE semantics fixed in the SONNY-738 sweep (SONNY-6433, SONNY-2796, SONNY-2847, SONNY-3241, SONNY-6281, SONNY-2811, SONNY-6499)
description: |
  Black-box proofs, over the real wire, for the engine-semantics bugs in the crypto/storage lane:

  SONNY-6433 (1): keys(n) / keys(r) kept listing a property after REMOVE while the value read
  null. (2): MERGE with a null key created a node (now 22004); MERGE on a list key never matched
  (a duplicate every time).
  SONNY-2796 (1): .hour/.minute of a zoned datetime before 1970 were negative (@rem vs @mod).
  SONNY-2847: the MERGE property index held ONE node per key, so with two value-equal nodes (CREATE
  can make them) deleting the indexed one hid the other and MERGE created a duplicate.
  SONNY-3241: MERGE ... ON CREATE SET ... SET ... on an existing node wrongly applied the ON CREATE
  action through the fast path, and MATCH...CREATE made 1 edge where the key has 2 holders.
  SONNY-6281: NOT NULL / EXISTS / NODE KEY constraints were recorded but never enforced.
  SONNY-2811: an ORDER BY key that is not projected did not sort.
  SONNY-2807: '=' on DECIMAL vs DOUBLE compares exact values. SONNY-2699: GROUP BY q HAVING EXISTS {...} works again.
    SONNY-6351 (5): CREATE ... RETURN n.i ORDER BY n.i parses. SONNY-3135 (N7a): PROFILE/EXPLAIN allowlist.
    SONNY-6499: CAST to STRING returned NULL for a DOUBLE; ORDER BY ... LIMIT fast paths dropped rows
  lacking the sort key.

  CANARY: REQ=REQ-SONNY-738-QUERY-SEMANTICS-BLACKBOX; FEATURE="QuerySemantics"; ASPECT=SweepRegressions; STATUS=TESTED; TEST=self; OWNER=engine; UPDATED=2026-11-17

    Execution note: the server is a private scratch server started by the first step (own port and
    data dir under /tmp/sonny738-crypto-*, outside the harness-managed lifecycle), so these steps are not
    affected by concurrent harness runs on a shared machine.
single_node_only: true
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: false
  client:
    timeout_ms: 60000
    tls_verify: false
    format: json
invariants: []
tests:
- name: scratch-server-start
  description: Starts a private geode server (own data dir and port, outside the harness-managed lifecycle) for the steps below.
  type: bash
  timeout_ms: 300000
  command: |
    set -u
    ST="/tmp/sonny738-crypto-6433"
    rm -rf "$ST"; mkdir -p "$ST"
    PORT=$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1",0)); print(s.getsockname()[1]); s.close()')
    cat > "$ST/env.sh" <<'ENVEOF'
    export GEODE_ALLOW_INSECURE_TLS=1
    export ST="/tmp/sonny738-crypto-6433"
    export D="$ST/data"
    export GEODE_DATA_DIR="$D"
    export GEODE_CLIENT_TLS="--insecure-tls-skip-verify"
    export ADMINPW="Sonny Harness Admin Passphrase 738"
    SRV_ENV=(
      'GEODE_ADMIN_PASSWORD=Sonny Harness Admin Passphrase 738'
      GEODE_ALLOW_TEST_AUDIT_KEYS=1
      GEODE_LSP_PORT=0
    )
    SRV_ARGS=()
    gq_as() { local u="$1" p="$2"; shift 2; "$GEODE_BINARY" query -U "$u" -P "$p" "$@" --server "$GEODE_SERVER_ADDRESS" $GEODE_CLIENT_TLS; }
    gq() { gq_as geode "$ADMINPW" "$@"; }
    start_srv() {
      env "${SRV_ENV[@]}" setsid nohup "$GEODE_BINARY" serve --listen "$GEODE_SERVER_ADDRESS" --data-dir "$D" --log-level warn "${SRV_ARGS[@]}" </dev/null >>"$ST/server.log" 2>&1 &
      echo $! > "$ST/pid"
      local i
      for i in $(seq 1 400); do
        gq "RETURN 1 AS x" >/dev/null 2>&1 && return 0
        kill -0 "$(cat "$ST/pid")" 2>/dev/null || { echo "SERVER_EXITED"; tail -20 "$ST/server.log"; return 1; }
        sleep 0.5
      done
      echo "SERVER_NOT_READY"; tail -20 "$ST/server.log"; return 1
    }
    stop_srv() {
      [ -f "$ST/pid" ] || return 0
      local p; p=$(cat "$ST/pid")
      kill "$p" 2>/dev/null
      local i; for i in $(seq 1 200); do kill -0 "$p" 2>/dev/null || break; sleep 0.3; done
      kill -9 "$p" 2>/dev/null; rm -f "$ST/pid"
    }
    restart_srv() { stop_srv; start_srv; }
    ENVEOF
    echo "export GEODE_SERVER_ADDRESS=127.0.0.1:$PORT" >> "$ST/env.sh"
    . "$ST/env.sh"
    mkdir -p "$D"
    start_srv && echo "SCRATCH_SERVER_READY"
  expect:
    exit_code: 0
    stdout_contains:
    - SCRATCH_SERVER_READY
  tags:
  - setup
- name: keys-setup
  expect:
    exit_code: 0
    stdout_json_assert:
    - expression: results[0].c
      equals: 3
  tags:
  - query
  - sonny-738
