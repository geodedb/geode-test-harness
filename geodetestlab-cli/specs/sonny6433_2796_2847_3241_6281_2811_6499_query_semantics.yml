  timeout_ms: 300000
- name: decimal-vs-double-equality-is-exact
  description: "SONNY-2807: '=' compares numbers by exact value (the rule GROUP BY/inline maps/MERGE use): DECIMAL 0.1 is not the DOUBLE nearest 0.1; a value both hold exactly (0.5) is equal"
  type: bash
  timeout_ms: 300000
  command: |
    . "/tmp/sonny738-crypto-6433/env.sh"
    gq 'RETURN 0.1 = 0.1e0 AS eq, 0.5 = 0.5e0 AS eq2'
  expect:
    exit_code: 0
    stdout_contains:
    - '"eq":false'
    - '"eq2":true'
  tags:
  - query
  - sonny-738
- name: grouped-having-exists-setup
  type: bash
  timeout_ms: 300000
  command: |
    . "/tmp/sonny738-crypto-6433/env.sh"
    gq 'CREATE (:Q2699 {k: 1})-[:S2699]->(:Y2699), (:Q2699 {k: 2})'
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
  tags:
  - query
  - sonny-738
- name: grouped-having-exists-binds-group-key
  description: 'SONNY-2699: GROUP BY q HAVING EXISTS {(q)-[:S]->()} was refused 0A000; the pattern variable is bound to the group key'
  type: bash
  timeout_ms: 300000
  command: |
    . "/tmp/sonny738-crypto-6433/env.sh"
    gq 'MATCH (q:Q2699) RETURN q.k AS k, count(*) AS c GROUP BY q HAVING EXISTS { (q)-[:S2699]->() }'
  expect:
    exit_code: 0
    stdout_contains:
    - '"k":1'
    stdout_not_contains:
    - '"k":2'
    - 0A000
  tags:
  - query
  - sonny-738
- name: create-return-order-by-property
  description: 'SONNY-6351 (5): CREATE ... RETURN n.i AS i ORDER BY n.i was an UnexpectedToken parse error'
  type: bash
  timeout_ms: 300000
  command: |
    . "/tmp/sonny738-crypto-6433/env.sh"
    gq 'CREATE (n:W6351 {i: 1}) RETURN n.i AS i ORDER BY n.i'
  expect:
    exit_code: 0
    stdout_contains:
    - '"i":1'
  tags:
  - query
  - sonny-738
- name: profile-control-query-allowed
