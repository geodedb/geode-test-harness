  - sonny-738
- name: profile-refuses-profile-call-geode-tenant-backfill-edge
  description: 'SONNY-3135 N7a: EXPLAIN/PROFILE wrap only a listed statement class; the unlisted one is refused at once (PROFILE of the self-locking backfill procedure used to block up to 120 s on its own lock)'
  type: bash
  timeout_ms: 300000
  command: |
    . "/tmp/sonny738-crypto-6433/env.sh"
    gq 'PROFILE CALL geode.tenant.backfill_edge_tags()'
  expect:
    exit_code: 1
    stdout_contains:
    - 0A000
    - EXPLAIN and PROFILE take
  tags:
  - query
  - sonny-738
