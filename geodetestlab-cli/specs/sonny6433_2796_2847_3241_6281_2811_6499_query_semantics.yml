  command: |
    . "/tmp/sonny738-crypto-6433/env.sh"
    gq_as geode 'Sonny Harness Admin Passphrase 738' 'CREATE (n:K6433 {a: 1, b: 2, p: 3}) RETURN size(keys(n)) AS c'
