- name: orderby-limit-keeps-null-key-rows
  description: 'SONNY-6499 (1): ORDER BY ... LIMIT must include the node lacking the key'
  expect:
    exit_code: 0
    stdout_contains:
    - 'null'
  tags:
  - query
  - sonny-738
  type: bash
  command: |
    . "/tmp/sonny738-crypto-6433/env.sh"
    gq_as geode 'Sonny Harness Admin Passphrase 738' 'MATCH (n:ON6499) RETURN n.k AS k ORDER BY n.k LIMIT 3'
  timeout_ms: 300000
- name: orderby-limit-row-count
  expect:
