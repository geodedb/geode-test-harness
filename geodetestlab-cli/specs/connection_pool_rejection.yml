version: '1.0'
name: 'GAP-0327: Connection Pool Explicit Rejection'
description: |
  CANARY: REQ=REQ-CONN-POOL-REJECTION-001; FEATURE="ConnectionPool"; ASPECT=AdmissionRejection; STATUS=TESTED; TEST=geodetestlab/specs/connection_pool_rejection.yml; OWNER=qa; UPDATED=2026-10-28

  Hold both slots of a --max-connections 2 server with real authenticated
  plain-mode shell sessions. Each sends a cheap query every second until
  explicitly released, so admission pressure is independent of CPU speed.
  The former 18^5 cross joins timed out on two-CPU CI workers, leaving the
  server executing queries after their clients exited; that did not test
  graceful connection release.

  An over-cap client must time out cleanly within its own deadline while
  both holders remain connected. After both receive the normal shell quit
  command and exit successfully, a fresh query must succeed promptly.
  This covers bounded backpressure and graceful recovery, not abrupt peer
  loss or long-query cancellation. Holder loops have an independent
  60-second ceiling so an interrupted spec cannot keep them alive forever.
single_node_only: true
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port: null
    data_dir: null
    startup_timeout_ms: 30000
    cleanup: true
    args:
    - --log-level
    - info
    - --idle-timeout
    - '8000'
    - --max-connections
    - '2'
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 90000
    tls_verify: false
    format: json
invariants:
- type: server_running
tests:
- name: 'P21-SAT-001: saturate a --max-connections 2 server with two continuously-busy holders'
  description: Authenticate two real shell sessions and wait for an acknowledged heartbeat from each before probing the occupied pool.
  type: bash
  command: |
    SERVER="${GEODE_SERVER_ADDRESS}"
    PW="${GEODE_ADMIN_PASSWORD:-GeodeTestPassword123!}"
    P21_STATE="${TMPDIR:-/tmp}/p21_conn_reject_${SERVER##*:}.state"
    P21_DIR=$(cat "${P21_STATE}" 2>/dev/null || true)
    if [ -n "${P21_DIR}" ] && [ -d "${P21_DIR}" ]; then touch "${P21_DIR}/release"; fi
    P21_DIR=$(mktemp -d "${TMPDIR:-/tmp}/p21_conn_reject_${SERVER##*:}.XXXXXX")
    printf '%s\n' "${P21_DIR}" > "${P21_STATE}"
    for holder in 1 2; do
      (
        # Capture the real client's exit code; no expensive query is used to
        # hold a slot. The bounded writer also closes clients after an abort.
        {
          for tick in $(seq 1 60); do
            [ -f "${P21_DIR}/release" ] && break
            printf "RETURN 104729 + %s AS p21_ack;\n" "${holder}"
            sleep 1
          done
          printf '\\q\n'
        } | geode shell --plain --server "${SERVER}" ${GEODE_CLIENT_TLS} \
              -U geode -P "${PW}" > "${P21_DIR}/holder${holder}.out" 2>&1
        client_rc=${PIPESTATUS[1]}
        printf '%s\n' "${client_rc}" > "${P21_DIR}/holder${holder}.exit"
      ) </dev/null >/dev/null 2>&1 &
      echo $! > "${P21_DIR}/holder${holder}.pid"
      disown
      # Admit and authenticate one holder before opening the next.
      DEADLINE=$(( $(date +%s) + 7 ))
      while ! grep -q "$((104729 + holder))" "${P21_DIR}/holder${holder}.out"; do
        if [ -f "${P21_DIR}/holder${holder}.exit" ] || [ "$(date +%s)" -ge "${DEADLINE}" ]; then
          cat "${P21_DIR}/holder${holder}.out"
          touch "${P21_DIR}/release"
          exit 1
        fi
        sleep 0.2
      done
      test ! -f "${P21_DIR}/holder${holder}.exit" || exit 1
      kill -0 "$(cat "${P21_DIR}/holder${holder}.pid")" || exit 1
      echo "p21_holder${holder}_alive=yes"
    done
  timeout_ms: 20000
  expect:
    exit_code: 0
    stdout_contains:
    - p21_holder1_alive=yes
    - p21_holder2_alive=yes
  tags:
  - gap-0327
  - quic
  - connection-pool
  - rejection
  - saturate
  - p21
- name: 'P21-OVERCAP-001: over-cap query gets a clean bounded failure, not a hang (KEY negative)'
  description: The third real client must reach its own eight-second deadline before the fifteen-second outer guard while both authenticated holders stay connected.
  type: bash
  command: |
    SERVER="${GEODE_SERVER_ADDRESS}"
    PW="${GEODE_ADMIN_PASSWORD:-GeodeTestPassword123!}"
    P21_STATE="${TMPDIR:-/tmp}/p21_conn_reject_${SERVER##*:}.state"
    P21_DIR=$(cat "${P21_STATE}" 2>/dev/null || true)
    test -n "${P21_DIR}" && test -d "${P21_DIR}" || exit 1
    START=$(date +%s%N)
    OUT=$(timeout 15 geode query --server "${SERVER}" ${GEODE_CLIENT_TLS} \
          -U geode -P "${PW}" --timeout 8 \
          "RETURN 'p21_over_cap_probe' AS status" 2>&1)
    EC=$?
    END=$(date +%s%N)
    ELAPSED_MS=$(( (END - START) / 1000000 ))

    echo "p21_overcap_ec=${EC} p21_overcap_elapsed_ms=${ELAPSED_MS}"
    echo "p21_overcap_output=${OUT}"

    # Must return within the outer bash `timeout 15` guard -- i.e. the
    # client's own --timeout fired the deadline, the outer guard never
    # had to intervene. 15000ms would mean the outer guard killed it
    # (a real hang); this asserts strictly less.
    [ "${ELAPSED_MS}" -lt 15000 ] && echo "p21_bounded=true" || echo "p21_bounded=false"

    # Real observed signal: non-zero exit with a client-side timeout
    # message, not a silent hang and not a success.
    if [ "${EC}" -ne 0 ] && echo "${OUT}" | grep -qi "timed out"; then
      echo "p21_explicit_failure=true"
    else
      echo "p21_explicit_failure=false"
    fi

    [ "${ELAPSED_MS}" -lt 15000 ] && [ "${EC}" -ne 0 ] && echo "${OUT}" | grep -qi "timed out" || exit 1

    for holder in 1 2; do
      test ! -f "${P21_DIR}/holder${holder}.exit" || exit 1
      kill -0 "$(cat "${P21_DIR}/holder${holder}.pid")" || exit 1
      echo "p21_holder${holder}_still_alive=yes"
    done
  timeout_ms: 20000
  expect:
    exit_code: 0
    stdout_contains:
    - p21_bounded=true
    - p21_explicit_failure=true
    - p21_holder1_still_alive=yes
    - p21_holder2_still_alive=yes
  tags:
  - gap-0327
  - quic
  - connection-pool
  - rejection
  - over-cap
  - negative
  - p21
- name: 'P21-RECOVER-001: draining background holders restores capacity for a new query (positive)'
  description: Release both heartbeat writers, require both shell clients to acknowledge normal quit with exit 0, then admit a new real query. No forced kill or server restart satisfies recovery.
  type: bash
  command: |
    SERVER="${GEODE_SERVER_ADDRESS}"
    PW="${GEODE_ADMIN_PASSWORD:-GeodeTestPassword123!}"
    P21_STATE="${TMPDIR:-/tmp}/p21_conn_reject_${SERVER##*:}.state"
    P21_DIR=$(cat "${P21_STATE}" 2>/dev/null || true)
    test -n "${P21_DIR}" && test -d "${P21_DIR}" || exit 1
    touch "${P21_DIR}/release"
    DEADLINE=$(( $(date +%s) + 15 ))
    for holder in 1 2; do
      while [ ! -f "${P21_DIR}/holder${holder}.exit" ]; do
        if [ "$(date +%s)" -ge "${DEADLINE}" ]; then
          echo "p21_holder${holder}_drain_timeout=true"
          cat "${P21_DIR}/holder${holder}.out"
          exit 1
        fi
        sleep 0.2
      done
      client_rc=$(cat "${P21_DIR}/holder${holder}.exit")
      echo "p21_holder${holder}_exit=${client_rc}"
      [ "${client_rc}" -eq 0 ] || { cat "${P21_DIR}/holder${holder}.out"; exit 1; }
    done
    echo "p21_drain_polled=true"
    OUT=$(geode query --server "${SERVER}" ${GEODE_CLIENT_TLS} \
            -U geode -P "${PW}" --timeout 15 \
            "RETURN 'p21_recovered_ok' AS status" 2>&1)
    EC=$?
    echo "${OUT}"
    echo "p21_recover_ec=${EC}"
    [ "${EC}" -eq 0 ] && echo "${OUT}" | grep -q p21_recovered_ok || exit 1
    rm -rf "${P21_DIR}"
    rm -f "${P21_STATE}"
  timeout_ms: 35000
  expect:
    exit_code: 0
    stdout_contains:
    - p21_drain_polled=true
    - p21_holder1_exit=0
    - p21_holder2_exit=0
    - p21_recovered_ok
    - p21_recover_ec=0
  tags:
  - gap-0327
  - quic
  - connection-pool
  - rejection
  - recovery
  - p21
- name: 'P21-CLEANUP-001: release any remaining holders and confirm server health'
  description: The explicit release signal is harmless after successful recovery; real query success verifies that the fixture leaves a usable server.
  type: bash
  expect:
    exit_code: 0
    stdout_contains:
    - p21_cleanup_ok
  tags:
  - gap-0327
  - cleanup
  - p21
  command: |
    SERVER="${GEODE_SERVER_ADDRESS}"
    PW="${GEODE_ADMIN_PASSWORD:-GeodeTestPassword123!}"
    P21_STATE="${TMPDIR:-/tmp}/p21_conn_reject_${SERVER##*:}.state"
    P21_DIR=$(cat "${P21_STATE}" 2>/dev/null || true)
    if [ -d "${P21_DIR}" ]; then touch "${P21_DIR}/release"; fi
    geode query --server "${SERVER}" ${GEODE_CLIENT_TLS} \
      -U geode -P "${PW}" --timeout 15 "RETURN 'p21_cleanup_ok' AS status"
  timeout_ms: 20000
tags:
- gap-0327
- quic
- connection-pool
- rejection
- admission-control
- transport
