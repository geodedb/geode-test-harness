version: "1.0"
name: "Geode Basic Tests"
description: "Basic Geode functionality tests without server dependency"

cli:
  binary: "/usr/local/bin/geode"
  client:
    timeout_ms: 5000
    tls_verify: false
    format: "json"

tests:
  # Test that help command works
  - name: "help-command"
    description: "Test that geode help command works"
    args: ["--help"]
    expect:
      exit_code: 0
      stderr_contains: ["geode", "Usage", "subcommand"]
    tags: ["basic", "help"]

  # Test that serve help works
  - name: "serve-help"
    description: "Test that geode serve help works"
    args: ["serve", "--help"]
    expect:
      exit_code: 0
      stderr_contains: ["serve", "Start", "server"]
    tags: ["basic", "serve"]

  # Test that query help works
  - name: "query-help"
    description: "Test that geode query help works"
    args: ["query", "--help"]
    expect:
      exit_code: 0
      stderr_contains: ["query", "Execute", "GQL"]
    tags: ["basic", "query"]

tags: ["basic", "no-server"]
