# --- Phase 2: Verify responsiveness AFTER bulk ingest ---
# Before the fix, queries after 670+ nodes would stall for 3.5 minutes
- name: persist-stall-responsive-after-bulk
  description: >
    Critical regression check: after creating 700+ nodes, the server must
    respond within the normal timeout. Before the fix, this query would
    stall for 3.5 minutes due to persistence lock contention.
  args:
  - query
  - RETURN 'responsive' AS status
  expect:
    exit_code: 0
    stdout_contains:
    - responsive
  tags:
  - regression
  - persistence
  - responsiveness

- name: persist-stall-query-during-persist
  description: >
    Verify a read query completes promptly while persistence thread
    is actively serializing 700+ nodes to disk.
  args:
  - query
  - MATCH (n:PersistTest) RETURN count(n) AS total
  expect:
    exit_code: 0
    stdout_contains:
    - total
  tags:
  - regression
  - persistence
  - responsiveness

- name: persist-stall-write-during-persist
  description: >
    Verify a MERGE write query completes while persistence is ongoing.
    Before the fix, writes would block behind the exclusive persistence lock.
  args:
  - query
  - "MERGE (:PersistTest4 {id: 'late-write', data: 'written-during-persist'}) RETURN 'write-ok' AS status"
  expect:
    exit_code: 0
    stdout_contains:
    - write-ok
  tags:
  - regression
  - persistence
  - responsiveness

# --- Phase 3: Verify data integrity ---
- name: persist-stall-verify-counts
  description: Verify all created nodes are present and accessible.
  args:
  - query
  - '-'
  stdin: |
    MATCH (n:PersistTest) RETURN count(n) AS pt1_count
    MATCH (n:PersistTest2) RETURN count(n) AS pt2_count
    MATCH (n:PersistTest3) RETURN count(n) AS pt3_count
  expect:
    exit_code: 0
  tags:
  - regression
  - persistence
  - verification

# --- Cleanup ---
- name: persist-stall-cleanup
  description: Remove all test nodes.
  args:
  - query
  - '-'
  stdin: |
    MATCH (n:PersistTest) DETACH DELETE n
    MATCH (n:PersistTest2) DETACH DELETE n
    MATCH (n:PersistTest3) DETACH DELETE n
    MATCH (n:PersistTest4) DETACH DELETE n
  expect:
    exit_code: 0
  tags:
  - regression
  - persistence
  - cleanup
