---
# Advanced Types Integration Tests
# Converted from legacy format to compatible schema
version: "1.0"
name: "Advanced Types Basic Tests"
description: "Testing Vector, Geographic, and other advanced types"

cli:
  binary: "./zig-out/bin/geode"
  server:
    enabled: true
    port: null
    data_dir: null
    startup_timeout_ms: 60000
    cleanup: true
    args: ["--log-level", "warn"]
    env: {}
  client:
    timeout_ms: 30000
    tls_verify: false
    format: "json"

tests:
  # Vector Type Tests
  - name: vector-f32-construction
    description: Test VectorF32 construction
    args: ["query", "-"]
    stdin: "RETURN vectorf32('[1.0, 2.0, 3.0]') AS vec"
    expect:
      exit_code: 0
      stdout_contains: ["vec"]
    tags: [vector, basic]

  - name: vector-i32-construction
    description: Test VectorI32 construction
    args: ["query", "-"]
    stdin: "RETURN vectori32('[1, 2, 3]') AS vec"
    expect:
      exit_code: 0
      stdout_contains: ["vec"]
    tags: [vector, basic]

  - name: vector-distance-l2
    description: Test L2 distance between vectors
    args: ["query", "-"]
    stdin: "RETURN vector_l2(vectorf32('[3.0, 4.0]'), vectorf32('[0.0, 0.0]')) AS dist"
    expect:
      exit_code: 0
      stdout_contains: ["dist"]
    tags: [vector, distance]

  - name: vector-node-storage
    description: Test storing vectors in nodes
    args: ["query", "-"]
    stdin: "CREATE (n:VecNode {embedding: vectorf32('[0.5, 0.5]')}) RETURN n.embedding AS emb"
    expect:
      exit_code: 0
    tags: [vector, storage]

  # Temporal Tests
  - name: temporal-date-basic
    description: Test DATE type
    args: ["query", "-"]
    stdin: "RETURN DATE('2025-01-15') AS d"
    expect:
      exit_code: 0
      stdout_contains: ["d"]
    tags: [temporal, basic]

  - name: temporal-datetime-basic
    description: Test DATETIME type
    args: ["query", "-"]
    stdin: "RETURN current_timestamp() AS ts"
    expect:
      exit_code: 0
      stdout_contains: ["ts"]
    tags: [temporal, basic]

  - name: temporal-duration-basic
    description: Test DURATION type
    args: ["query", "-"]
    stdin: "RETURN DURATION('P1D') AS dur"
    expect:
      exit_code: 0
      stdout_contains: ["dur"]
    tags: [temporal, basic]

  # List and Map Tests
  - name: list-construction
    description: Test list construction
    args: ["query", "-"]
    stdin: "RETURN [1, 2, 3] AS nums"
    expect:
      exit_code: 0
      stdout_contains: ["nums"]
    tags: [list, basic]

  - name: map-construction
    description: Test map construction
    args: ["query", "-"]
    stdin: "RETURN {name: 'test', value: 42} AS m"
    expect:
      exit_code: 0
      stdout_contains: ["name", "test"]
    tags: [map, basic]

tags: [advanced-types, integration]
