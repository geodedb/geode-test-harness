version: "1.0"
name: "Geode Functions Comprehensive Tests"
description: "Comprehensive test suite for all mathematical, string, and graph functions"

cli:
  binary: "./zig-out/bin/geode"
  server:
    enabled: true
    port: null
    data_dir: null
    startup_timeout_ms: 30000
    cleanup: true
    args: ["--log-level", "error"]
  client:
    timeout_ms: 30000
    tls_verify: false
    format: "json"

tests:
  # Mathematical Functions - Basic
  - name: "abs-function-integer"
    description: "ABS function with integer"
    args: ["query", "-"]
    stdin: "RETURN abs(-42) AS result"
    expect:
      exit_code: 0
      stdout_contains: ["42"]
    tags: ["math", "abs"]

  - name: "abs-function-decimal"
    description: "ABS function with decimal"
    args: ["query", "-"]
    stdin: "RETURN abs(CAST(-3.14 AS DECIMAL(10,2))) AS result"
    expect:
      exit_code: 0
      stdout_contains: ["3.14"]
    tags: ["math", "abs"]

  - name: "sqrt-function"
    description: "SQRT function"
    args: ["query", "-"]
    stdin: "RETURN sqrt(16) AS result"
    expect:
      exit_code: 0
      stdout_contains: ["4"]
    tags: ["math", "sqrt"]

  - name: "pow-function"
    description: "POW function"
    args: ["query", "-"]
    stdin: "RETURN pow(2, 3) AS result"
    expect:
      exit_code: 0
      stdout_contains: ["8"]
    tags: ["math", "pow"]

  # Trigonometric Functions
  - name: "sin-function"
    description: "SIN function"
    args: ["query", "-"]
    stdin: "RETURN sin(0) AS result"
    expect:
      exit_code: 0
      stdout_contains: ["0"]
    tags: ["math", "trig"]

  - name: "cos-function"
    description: "COS function"
    args: ["query", "-"]
    stdin: "RETURN cos(0) AS result"
    expect:
      exit_code: 0
      stdout_contains: ["1"]
    tags: ["math", "trig"]

  - name: "tan-function"
    description: "TAN function"
    args: ["query", "-"]
    stdin: "RETURN tan(0) AS result"
    expect:
      exit_code: 0
      stdout_contains: ["0"]
    tags: ["math", "trig"]

  # Logarithmic and Exponential Functions
  - name: "log-function"
    description: "LOG function"
    skip: true  # Debug output in stdout interferes with regex matching
    args: ["query", "-"]
    stdin: "RETURN log(2.71828) AS result"
    expect:
      exit_code: 0
      stdout_regex: ["0\\.99"]
    tags: ["math", "log"]

  - name: "exp-function"
    description: "EXP function"
    args: ["query", "-"]
    stdin: "RETURN exp(0) AS result"
    expect:
      exit_code: 0
      stdout_contains: ["1"]
    tags: ["math", "exp"]

  # Rounding Functions
  - name: "ceil-function"
    description: "CEIL function"
    args: ["query", "-"]
    stdin: "RETURN ceil(3.14) AS result"
    expect:
      exit_code: 0
      stdout_contains: ["4"]
    tags: ["math", "ceil"]

  - name: "floor-function"
    description: "FLOOR function"
    args: ["query", "-"]
    stdin: "RETURN floor(3.14) AS result"
    expect:
      exit_code: 0
      stdout_contains: ["3"]
    tags: ["math", "floor"]

  - name: "round-function"
    description: "ROUND function"
    args: ["query", "-"]
    stdin: "RETURN round(3.14159, 2) AS result"
    expect:
      exit_code: 0
      stdout_contains: ["3.14"]
    tags: ["math", "round"]

  # String Functions - Basic
  - name: "length-function"
    description: "LENGTH function"
    args: ["query", "-"]
    stdin: "RETURN length('hello world') AS result"
    expect:
      exit_code: 0
      stdout_contains: ["11"]
    tags: ["string", "length"]

  - name: "substring-function"
    description: "SUBSTRING function"
    args: ["query", "-"]
    stdin: "RETURN substring('hello world', 1, 5) AS result"
    expect:
      exit_code: 0
      stdout_contains: ["hello"]
    tags: ["string", "substring"]

  - name: "substring-without-length"
    description: "SUBSTRING without length"
    args: ["query", "-"]
    stdin: "RETURN substring('hello world', 7) AS result"
    expect:
      exit_code: 0
      stdout_contains: ["world"]
    tags: ["string", "substring"]

  - name: "upper-function"
    description: "UPPER function"
    args: ["query", "-"]
    stdin: "RETURN upper('hello world') AS result"
    expect:
      exit_code: 0
      stdout_contains: ["HELLO WORLD"]
    tags: ["string", "upper"]

  - name: "lower-function"
    description: "LOWER function"
    args: ["query", "-"]
    stdin: "RETURN lower('HELLO WORLD') AS result"
    expect:
      exit_code: 0
      stdout_contains: ["hello world"]
    tags: ["string", "lower"]

  - name: "trim-function"
    description: "TRIM function"
    args: ["query", "-"]
    stdin: "RETURN trim('  hello  ') AS result"
    expect:
      exit_code: 0
      stdout_contains: ["hello"]
    tags: ["string", "trim"]

  - name: "replace-function"
    description: "REPLACE function"
    args: ["query", "-"]
    stdin: "RETURN replace('hello world', 'world', 'geode') AS result"
    expect:
      exit_code: 0
      stdout_contains: ["hello geode"]
    tags: ["string", "replace"]

  # String Functions - Advanced
  - name: "left-function"
    description: "LEFT function"
    args: ["query", "-"]
    stdin: "RETURN left('hello world', 5) AS result"
    expect:
      exit_code: 0
      stdout_contains: ["hello"]
    tags: ["string", "left"]

  - name: "right-function"
    description: "RIGHT function"
    args: ["query", "-"]
    stdin: "RETURN right('hello world', 5) AS result"
    expect:
      exit_code: 0
      stdout_contains: ["world"]
    tags: ["string", "right"]

  - name: "reverse-function"
    description: "REVERSE function"
    args: ["query", "-"]
    stdin: "RETURN reverse('hello') AS result"
    expect:
      exit_code: 0
      stdout_contains: ["olleh"]
    tags: ["string", "reverse"]

  # Complex Nested Functions
  - name: "nested-math-functions"
    description: "Nested math functions"
    args: ["query", "-"]
    stdin: "RETURN sqrt(pow(3, 2) + pow(4, 2)) AS result"
    expect:
      exit_code: 0
      stdout_contains: ["5"]
    tags: ["math", "nested"]

  - name: "nested-string-functions"
    description: "Nested string functions"
    args: ["query", "-"]
    stdin: "RETURN upper(trim('  hello  ')) AS result"
    expect:
      exit_code: 0
      stdout_contains: ["HELLO"]
    tags: ["string", "nested"]

  - name: "combined-math-and-string"
    description: "Combined math and string"
    args: ["query", "-"]
    stdin: "RETURN length(upper('test')) + abs(-10) AS result"
    expect:
      exit_code: 0
      stdout_contains: ["14"]
    tags: ["mixed", "nested"]

  # Graph Functions with Data
  - name: "create-test-graph-data"
    description: "Create test graph data"
    args: ["query", "-"]
    stdin: |
      CREATE (p1:FuncPerson {name: 'Alice', age: 30, score: 95.5})
      CREATE (p2:FuncPerson {name: 'Bob', age: 25, score: 87.3})
      CREATE (p3:FuncPerson {name: 'Charlie', age: 35, score: 92.1})
      CREATE (pr1:FuncProduct {name: 'Laptop', price: 999.99, quantity: 5})
      CREATE (pr2:FuncProduct {name: 'Phone', price: 599.99, quantity: 10})
    expect:
      exit_code: 0
    tags: ["setup", "graph"]

  # Aggregation Functions
  - name: "count-function"
    description: "COUNT function"
    args: ["query", "-"]
    stdin: "MATCH (p:FuncPerson) RETURN count(p) AS person_count"
    expect:
      exit_code: 0
      stdout_contains: ["3"]
    tags: ["aggregation", "count"]

  - name: "avg-function"
    description: "AVG function"
    args: ["query", "-"]
    stdin: "MATCH (p:FuncPerson) RETURN avg(p.age) AS avg_age"
    expect:
      exit_code: 0
      stdout_contains: ["30"]
    tags: ["aggregation", "avg"]

  - name: "min-function"
    description: "MIN function"
    args: ["query", "-"]
    stdin: "MATCH (p:FuncPerson) RETURN min(p.age) AS min_age"
    expect:
      exit_code: 0
      stdout_contains: ["25"]
    tags: ["aggregation", "min"]

  - name: "max-function"
    description: "MAX function"
    args: ["query", "-"]
    stdin: "MATCH (p:FuncPerson) RETURN max(p.age) AS max_age"
    expect:
      exit_code: 0
      stdout_contains: ["35"]
    tags: ["aggregation", "max"]

  # Date/Time Functions
  - name: "current-date"
    description: "Current date"
    args: ["query", "-"]
    stdin: "RETURN current_date() AS today"
    expect:
      exit_code: 0
      stdout_regex: ["\\d{4}-\\d{2}-\\d{2}"]
    tags: ["date", "time"]

  - name: "current-time"
    description: "Current time"
    args: ["query", "-"]
    stdin: "RETURN current_time() AS now"
    expect:
      exit_code: 0
      stdout_regex: ["\\d{2}:\\d{2}:\\d{2}"]
    tags: ["date", "time"]

  - name: "current-timestamp"
    description: "Current timestamp"
    args: ["query", "-"]
    stdin: "RETURN current_timestamp() AS now"
    expect:
      exit_code: 0
      stdout_regex: ["\\d{4}-\\d{2}-\\d{2}"]
    tags: ["date", "time"]

  # Type Conversion Functions
  - name: "cast-to-integer"
    description: "CAST to integer"
    args: ["query", "-"]
    stdin: "RETURN CAST('42' AS INTEGER) AS result"
    expect:
      exit_code: 0
      stdout_contains: ["42"]
    tags: ["type", "cast"]

  - name: "cast-to-decimal"
    description: "CAST to decimal"
    args: ["query", "-"]
    stdin: "RETURN CAST('3.14159' AS DECIMAL(10,2)) AS result"
    expect:
      exit_code: 0
      stdout_contains: ["3.14"]
    tags: ["type", "cast"]

  - name: "cast-to-string"
    description: "CAST to string"
    args: ["query", "-"]
    stdin: "RETURN CAST(42 AS STRING) AS result"
    expect:
      exit_code: 0
      stdout_contains: ["42"]
    tags: ["type", "cast"]

  # Complex Queries with Functions
  - name: "complex-math-in-where"
    description: "Complex math in WHERE clause"
    args: ["query", "-"]
    stdin: "MATCH (p:FuncPerson) WHERE abs(p.score - 90) < 5 RETURN p.name"
    expect:
      exit_code: 0
      stdout_contains: ["Charlie"]
    tags: ["function", "where"]

  - name: "string-function-in-where"
    description: "String function in WHERE clause"
    args: ["query", "-"]
    stdin: "MATCH (p:FuncPerson) WHERE length(p.name) > 5 RETURN p.name ORDER BY p.name"
    expect:
      exit_code: 0
      stdout_contains: ["Charlie"]
    tags: ["function", "where"]

  # Edge Cases and Error Handling
  - name: "sqrt-of-negative"
    description: "SQRT of negative number"
    args: ["query", "-"]
    stdin: "RETURN sqrt(-1) AS result"
    expect:
      exit_code: 0
      geode_query:
        status_class: "00000"
    tags: ["error", "math"]

  - name: "division-by-zero"
    description: "Division by zero"
    args: ["query", "-"]
    stdin: "RETURN 10 / 0 AS result"
    expect:
      exit_code: 0
      geode_query:
        status_class: "00000"
    tags: ["error", "math"]

  - name: "substring-out-of-bounds"
    description: "SUBSTRING out of bounds"
    args: ["query", "-"]
    stdin: "RETURN substring('hello', 10, 5) AS result"
    expect:
      exit_code: 0
    tags: ["error", "string"]

  - name: "null-handling-in-functions"
    description: "NULL handling in functions"
    args: ["query", "-"]
    stdin: "RETURN abs(NULL) AS result"
    expect:
      exit_code: 0
      stdout_contains: ["null"]
    tags: ["null", "handling"]

invariants:
  - type: "server_running"

tags: ["functions", "math", "string", "comprehensive"]
