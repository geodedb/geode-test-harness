version: '1.0'
name: TDE Plaintext Verification - Edge Cases
description: "SECURITY CRITICAL TEST SUITE - EDGE CASES\n\nVerifies TDE handles edge cases properly, ensuring NO plaintext escapes\nencryption even in unusual or boundary conditions. Tests include:\n\n1. Large data (potential buffer overflow in encryption)\n2. Unicode and special characters (encoding issues)\n3. Binary data patterns (might confuse encryption)\n4. Empty strings and null-like values\n5. Extremely long field names\n6. Special characters that might escape encryption\n7. Data at page boundaries\n8. Repeated patterns (compression might leak)\n\nCANARY: REQ=REQ-TDE-ENFORCE-004; FEATURE=TDEEnforcement; ASPECT=EdgeCases; STATUS=TESTED; OWNER=security; UPDATED=2026-01-28\n"
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 30000
    cleanup: false
    args:
    - --log-level
    - info
    - --enable-tde
    # SONNY-6422/6442: --enable-wal-encryption was removed; the WAL is encrypted by the engine under GEODE_TDE_KEY
    - --tde-provider
    - MockKms
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 30000
    tls_verify: false
    format: json
env:
  GEODE_TDE_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  # SONNY-6422: GEODE_WAL_KEY removed (server refuses it); the WAL is encrypted by GEODE_TDE_KEY
  GEODE_TDE_ENABLED: 'true'
  GEODE_WAL_ENCRYPTION_ENABLED: 'true'
tests:
- name: tde-edge-unicode-chinese
  description: Test encryption of Chinese characters
  args:
  - query
  - "CREATE (n:EdgeTest_Unicode { type: 'Chinese', content: 'EDGETEST_CHINESE_中文秘密_SECRET', description: '这是一个秘密测试' }) RETURN n.content AS content"
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
  tags:
  - tde
  - edge
  - unicode
  - chinese
- name: tde-edge-unicode-arabic
  description: Test encryption of Arabic characters (RTL)
  args:
  - query
  - "CREATE (n:EdgeTest_Arabic { type: 'Arabic', content: 'EDGETEST_ARABIC_سري_SECRET', description: 'هذا اختبار سري' }) RETURN n.content AS content"
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
  tags:
  - tde
  - edge
  - unicode
  - arabic
- name: tde-edge-unicode-mixed
  description: Test encryption of mixed unicode scripts
  args:
  - query
  - "CREATE (n:EdgeTest_Mixed { type: 'MixedScript', content: 'EDGETEST_MIXED_Hello世界Мирこんにちは_SECRET', marker: 'MixedUnicode' }) RETURN n.content AS content"
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
  tags:
  - tde
  - edge
  - unicode
  - mixed
- name: tde-edge-special-null-bytes
  description: Test encryption with null byte patterns
  args:
  - query
  - "CREATE (n:EdgeTest_NullPattern { type: 'NullBytes', content: 'EDGETEST_NULLBYTE_before\\x00after_SECRET', pattern: 'NullBytePattern' }) RETURN n.content AS content"
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
  tags:
  - tde
  - edge
  - special
  - nullbyte
- name: tde-edge-special-newlines
