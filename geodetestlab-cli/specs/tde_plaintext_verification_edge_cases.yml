- name: tde-edge-repeated-many-nodes
  description: Test encryption consistency across many nodes
  args:
  - query
  - "CREATE (:EdgeTest_ManyNodes { index: 1, secret: 'EDGETEST_MANY_NODE_SECRET_1' }), (:EdgeTest_ManyNodes { index: 2, secret: 'EDGETEST_MANY_NODE_SECRET_2' }), (:EdgeTest_ManyNodes { index: 3, secret: 'EDGETEST_MANY_NODE_SECRET_3' }), (:EdgeTest_ManyNodes { index: 4, secret: 'EDGETEST_MANY_NODE_SECRET_4' }), (:EdgeTest_ManyNodes { index: 5, secret: 'EDGETEST_MANY_NODE_SECRET_5' }), (:EdgeTest_ManyNodes { index: 6, secret: 'EDGETEST_MANY_NODE_SECRET_6' }), (:EdgeTest_ManyNodes { index: 7, secret: 'EDGETEST_MANY_NODE_SECRET_7' }), (:EdgeTest_ManyNodes { index: 8, secret: 'EDGETEST_MANY_NODE_SECRET_8' }), (:EdgeTest_ManyNodes { index: 9, secret: 'EDGETEST_MANY_NODE_SECRET_9' }), (:EdgeTest_ManyNodes { index: 10, secret: 'EDGETEST_MANY_NODE_SECRET_10' }), (:EdgeTest_ManyNodes { index: 11, secret: 'EDGETEST_MANY_NODE_SECRET_11' }), (:EdgeTest_ManyNodes { index: 12, secret: 'EDGETEST_MANY_NODE_SECRET_12' }), (:EdgeTest_ManyNodes { index: 13, secret: 'EDGETEST_MANY_NODE_SECRET_13' }), (:EdgeTest_ManyNodes { index: 14, secret: 'EDGETEST_MANY_NODE_SECRET_14' }), (:EdgeTest_ManyNodes { index: 15, secret: 'EDGETEST_MANY_NODE_SECRET_15' }), (:EdgeTest_ManyNodes { index: 16, secret: 'EDGETEST_MANY_NODE_SECRET_16' }), (:EdgeTest_ManyNodes { index: 17, secret: 'EDGETEST_MANY_NODE_SECRET_17' }), (:EdgeTest_ManyNodes { index: 18, secret: 'EDGETEST_MANY_NODE_SECRET_18' }), (:EdgeTest_ManyNodes { index: 19, secret: 'EDGETEST_MANY_NODE_SECRET_19' }), (:EdgeTest_ManyNodes { index: 20, secret: 'EDGETEST_MANY_NODE_SECRET_20' }) RETURN 1 AS created"
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
  tags:
  - tde
  - edge
  - repeated
  - manynodes
- name: tde-edge-boundary-empty-adjacent
  description: Test encryption with empty string adjacent to secret
  args:
  - query
  - "CREATE (n:EdgeTest_Empty { empty_field: '', secret_field: 'EDGETEST_EMPTY_ADJACENT_SECRET', another_empty: '' }) RETURN n.secret_field AS secret"
