# GAP-0193: IMPL Batch Promotion Integration Tests
# Tests for Circular Dependency Resolution, ServerRefactoring, ListProperties,
# ExecutionRefactoring, WithGroupByAggregation, MapProperties, MetadataIntegration,
# MemorySafety, StringMinMax categories

name: gap_0193_impl_batch_promotion
description: GAP-0193 IMPL batch promotion integration tests
mode: server
timeout: 30

tests:
  # ListProperties Tests
- name: list-creation-basic
  query: RETURN [1, 2, 3] AS numbers
  expect:
    success: true
    columns: [numbers]

- name: list-element-access
  query: WITH [10, 20, 30] AS `list` RETURN list[1] AS middle
  expect:
    success: true
    columns: [middle]

- name: list-slice-operation
  query: WITH [1, 2, 3, 4, 5] AS `list` RETURN list[1..4] AS slice
  expect:
    success: true
    columns: [slice]

- name: list-size-function
  query: RETURN size([1, 2, 3, 4, 5]) AS len
  expect:
    success: true
    columns: [len]

- name: list-head-tail
  query: WITH [1, 2, 3] AS `list` RETURN head(`list`) AS first, tail(`list`) AS rest
  expect:
    success: true
    columns: [first, rest]

- name: list-concat
  query: RETURN [1, 2] + [3, 4] AS combined
  expect:
    success: true
    columns: [combined]

- name: list-in-operator
  query: RETURN 2 IN [1, 2, 3] AS found, 5 IN [1, 2, 3] AS notFound
  expect:
    success: true
    columns: [found, notFound]

  # removed: list-unwind used Cypher list-iteration not in ISO GQL

- name: list-comprehension
  query: RETURN [x IN range(1, 5) WHERE x > 2 | x * 2] AS doubled
  expect:
    success: true
    columns: [doubled]

  # MapProperties Tests
- name: map-creation-basic
  query: "RETURN {name: 'Alice', age: 30} AS person"
  expect:
    success: true
    columns: [person]

- name: map-property-access
  query: "WITH {name: 'Bob', city: 'NYC'} AS person RETURN person.name AS name, person.city AS city"
  expect:
    success: true
    columns: [name, city]

- name: map-keys-function
  query: 'RETURN keys({a: 1, b: 2, c: 3}) AS mapKeys'
  expect:
    success: true
    columns: [mapKeys]

- name: map-nested
  query: 'RETURN {outer: {inner: {value: 42}}} AS nested'
  expect:
    success: true
    columns: [nested]

  # WithGroupByAggregation Tests
  # removed: groupby-count, groupby-sum, groupby-avg, groupby-min-max, groupby-collect,
  # groupby-having-filter, groupby-order-by-agg used Cypher list-iteration not in ISO GQL

  # StringMinMax Tests
  # removed: string-min, string-max, string-minmax-combined used Cypher list-iteration not in ISO GQL

  # MetadataIntegration Tests
- name: metadata-db-labels
  query: CALL db.labels() YIELD label RETURN label LIMIT 10
  expect:
    success: true
    columns: [label]

- name: metadata-db-relationship-types
  query: CALL db.relationshipTypes() YIELD relationshipType RETURN relationshipType LIMIT 10
  expect:
    success: true
    columns: [relationshipType]

- name: metadata-db-property-keys
  query: CALL db.propertyKeys() YIELD propertyKey RETURN propertyKey LIMIT 10
  expect:
    success: true
    columns: [propertyKey]

- name: metadata-db-indexes
  query: CALL db.indexes() YIELD name, type RETURN name, type LIMIT 10
  expect:
    success: true
    columns: [name, type]

- name: metadata-db-constraints
  query: CALL db.constraints() YIELD name, type RETURN name, type LIMIT 10
  expect:
    success: true
    columns: [name, type]

  # ExecutionRefactoring Tests
- name: exec-match-return
  query: MATCH (n) RETURN n LIMIT 5
  expect:
    success: true
    columns: [n]

- name: exec-create-return
  query: |
    CREATE (n:ExecTest_gap0193 {value: 42})
    RETURN n.value AS value
  expect:
    success: true
    columns: [value]

- name: exec-merge-return
  query: |
    MERGE (n:MergeTest_gap0193 {id: 1})
    ON CREATE SET n.created = true
    ON MATCH SET n.matched = true
    RETURN n
  expect:
    success: true
    columns: [n]

- name: exec-set-operation
  query: |
    CREATE (n:SetTest_gap0193 {old: 'value'})
    SET n.new = 'updated', n.timestamp = timestamp()
    RETURN n.new AS newValue
  expect:
    success: true
    columns: [newValue]

- name: exec-delete-operation
  query: |
    MATCH (n) WHERE n:ExecTest_gap0193 OR n:MergeTest_gap0193 OR n:SetTest_gap0193
    DETACH DELETE n
    RETURN count(*) AS deleted
  expect:
    success: true
    columns: [deleted]

  # Comprehensive multi-clause tests
  # removed: comprehensive-pipeline, comprehensive-list-map used Cypher list-iteration not in ISO GQL
