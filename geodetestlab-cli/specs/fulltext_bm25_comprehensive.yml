- name: bm25-comp-count
  description: Total document count is 100
  args: [query, '-']
  stdin: MATCH (d:BM25Comp) RETURN count(d) AS cnt
  expect:
    exit_code: 0
    stdout_contains:
    - cnt
  tags: [bm25, count]

  # ------------------------------------------- single-token search --
- name: bm25-comp-single-token-database
