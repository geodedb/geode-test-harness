  args: [query, '-']
  stdin: MATCH (d:BM25Comp) WHERE d.content =~ 'machine' RETURN count(d) AS cnt
  expect:
    exit_code: 0
    stdout_contains:
    - cnt
  tags: [bm25, single-token, specialized]

- name: bm25-comp-single-token-no-match
