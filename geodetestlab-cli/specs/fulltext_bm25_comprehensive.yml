  args: [query, '-']
  stdin: MATCH (d:BM25Comp) WHERE d.content =~ 'query performance' RETURN count(d) AS cnt
  expect:
    exit_code: 0
    stdout_contains:
    - cnt
  tags: [bm25, phrase]

  # ----------------------------------------------- CONTAINS consistency --
- name: bm25-comp-contains-consistent
  description: CONTAINS 'performance' and =~ 'performance' return same count
  args: [query, '-']
  stdin: |
    MATCH (d1:BM25Comp) WHERE d1.content CONTAINS 'performance'
    MATCH (d2:BM25Comp) WHERE d2.content =~ 'performance'
    RETURN count(d1) AS cnt_contains, count(d2) AS cnt_regex
  expect:
    exit_code: 0
    stdout_contains:
    - cnt_contains
    - cnt_regex
  tags: [bm25, contains, consistency]

  # ------------------------------------------- BM25 ranking (fts.search) --
  # A per-row scalar bm25_score(prop, query) never existed and is
  # mathematically ill-posed (BM25 needs corpus IDF + avg doc length, which
  # live in the index, not in the row). The real, documented BM25 surface is
  # CALL geode.fts.search('<index>', '<query>'[, max]) YIELD node, score.
- name: bm25-comp-bm25-score-returns
  description: geode.fts.search returns real BM25 scores for matching docs
  args: [query, '-']
  stdin: >-
    CALL geode.fts.search('bm25_comp', 'performance', 5)
    YIELD node, score RETURN node, score
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    - '"score":'
    - '"node":'
  tags: [bm25, scoring]

- name: bm25-comp-bm25-score-ordering
  description: >
    geode.fts.search results carry a numeric BM25 score column; ORDER BY
    score DESC over the yielded rows succeeds (engine returns ranked hits).
  args: [query, '-']
  stdin: >-
    CALL geode.fts.search('bm25_comp', 'database', 10)
    YIELD node, score RETURN node, score ORDER BY score DESC
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    - '"score":'
  tags: [bm25, scoring, ordering]

- name: bm25-comp-bm25-score-multi-token
  description: geode.fts.search with a multi-token query returns scored hits
  args: [query, '-']
  stdin: >-
    CALL geode.fts.search('bm25_comp', 'graph database', 5)
    YIELD node, score RETURN node, score
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    - '"score":'
  tags: [bm25, scoring, multi-token]

  # ----------------------------------------------- ranking determinism --
- name: bm25-comp-ranking-first-run-ids
  description: First ranking run — top-5 scored hits for 'performance' (baseline)
  args: [query, '-']
  stdin: >-
    CALL geode.fts.search('bm25_comp', 'performance', 5)
    YIELD node, score RETURN node, score ORDER BY score DESC, node ASC
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    - '"score":'
  tags: [bm25, determinism]

- name: bm25-comp-ranking-second-run-ids
  description: Second identical query — same ranked surface answers again (determinism smoke)
  args: [query, '-']
  stdin: >-
    CALL geode.fts.search('bm25_comp', 'performance', 5)
    YIELD node, score RETURN node, score ORDER BY score DESC, node ASC
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    - '"score":'
  tags: [bm25, determinism]

  # ----------------------------------------------- drop / re-create --
- name: bm25-comp-drop-idx
  description: DROP INDEX bm25_comp succeeds
  args: [query, '-']
  stdin: DROP INDEX bm25_comp
  expect:
    exit_code: 0
  tags: [bm25, drop]

- name: bm25-comp-search-after-drop
  description: Search still works after index drop (falls back to scan)
  args: [query, '-']
  stdin: MATCH (d:BM25Comp) WHERE d.content CONTAINS 'database' RETURN count(d) AS cnt
  expect:
    exit_code: 0
    stdout_contains:
    - cnt
  tags: [bm25, drop, fallback]

- name: bm25-comp-recreate-idx
  description: Re-create fulltext index after DROP (documented DDL form)
  args: [query, '-']
  stdin: CREATE INDEX bm25_comp FOR (n:BM25Comp) ON (n.content) USING fulltext
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
  tags: [bm25, recreate]

- name: bm25-comp-search-after-recreate
  description: Search after re-create returns same count as before drop
  args: [query, '-']
  stdin: MATCH (d:BM25Comp) WHERE d.content =~ 'performance' RETURN count(d) AS cnt
  expect:
    exit_code: 0
    stdout_contains:
    - cnt
  tags: [bm25, recreate, determinism]

  # ----------------------------------------------- edge / boundary --
- name: bm25-comp-empty-corpus-search
  description: Search on non-existent label returns empty (no crash)
  args: [query, '-']
  stdin: MATCH (d:BM25CompNonExistent) WHERE d.content =~ 'database' RETURN count(d) AS cnt
  expect:
    exit_code: 0
    stdout_contains:
    - cnt
  tags: [bm25, edge, empty-corpus]

  # ---------------------------------------------------------------- GAP-0869 --
  # Real positional phrase + proximity over a persisted FTS index.
  # These exercise CALL geode.fts.phrase / geode.fts.proximity — the GAP-0869
  # surface that runs adjacency/NEAR against the engine's per-(term,doc) token
  # POSITIONS (not the bag-of-words =~ predicate above). A real fulltext index
  # is built via `CREATE INDEX ... USING fulltext` over pre-existing nodes
  # (nodes-first ordering indexes the existing rows deterministically). Each
  # test is a MATCH-vs-NO-MATCH discriminator that a positional-postings
  # implementation passes and a bag-of-words stub fails.
- name: bm25-comp-adv-setup-nodes
  description: GAP-0869 — seed 3 docs (nodes-first so the fulltext index picks them up)
  args: [query, '-']
  stdin: |
    CREATE (:Bm25Adv869 {content: 'alpha beta gamma delta epsilon'}),
           (:Bm25Adv869 {content: 'graph database index performance'}),
           (:Bm25Adv869 {content: 'machine learning neural deep classification'})
  expect:
    exit_code: 0
    stdout_contains: ['"status_class":"00000"']
  tags: [bm25, gap0869, setup]

- name: bm25-comp-adv-create-idx
  description: GAP-0869 — build a REAL fulltext index (USING fulltext) over the seeded docs
  args: [query, '-']
  stdin: CREATE INDEX bm25adv869 ON Bm25Adv869 (content) USING fulltext
  expect:
    exit_code: 0
    stdout_contains: ['"status_class":"00000"']
  tags: [bm25, gap0869, index]

- name: bm25-comp-adv-phrase-adjacent-match
  description: >
    GAP-0869 — phrase 'beta gamma' (tokens adjacent in doc 1) MATCHES. The
    node column is typed INTEGER (a real hit) and the BM25 score is present.
  args: [query, '-']
  stdin: CALL geode.fts.phrase('bm25adv869', 'beta gamma') YIELD node, score RETURN node, score
  expect:
    exit_code: 0
    stdout_contains: ['"status_class":"00000"']
    stdout_regex:
    - '"name":"node","type":"INTEGER"'
  tags: [bm25, gap0869, phrase, match]

- name: bm25-comp-adv-phrase-reversed-nomatch
  description: >
    GAP-0869 — phrase 'gamma beta' (reversed order) does NOT match: no doc has
    those tokens ADJACENT in that order. Empty binding table (node type NULL,
    rows []) — the discriminator proving true positional adjacency, not
    bag-of-words. A stub that ignored positions would (wrongly) match here.
  args: [query, '-']
  stdin: CALL geode.fts.phrase('bm25adv869', 'gamma beta') YIELD node, score RETURN node, score
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    - '"rows":[]'
    stdout_regex:
    - '"name":"node","type":"NULL"'
  tags: [bm25, gap0869, phrase, no-match]

- name: bm25-comp-adv-proximity-within-match
  description: >
    GAP-0869 — proximity 'alpha delta' within distance 3 MATCHES (alpha@0,
    delta@3 in doc 1; window = 3). Real token-window NEAR over persisted
    positions.
  args: [query, '-']
  stdin: CALL geode.fts.proximity('bm25adv869', 'alpha delta', 3) YIELD node, score RETURN node, score
  expect:
    exit_code: 0
    stdout_contains: ['"status_class":"00000"']
    stdout_regex:
    - '"name":"node","type":"INTEGER"'
  tags: [bm25, gap0869, proximity, match]

- name: bm25-comp-adv-proximity-outside-nomatch
  description: >
    GAP-0869 — proximity 'alpha delta' within distance 2 does NOT match: the
    covering window (3) exceeds 2. Empty binding table — proves the distance
    bound is enforced against real positions, not a constant.
  args: [query, '-']
  stdin: CALL geode.fts.proximity('bm25adv869', 'alpha delta', 2) YIELD node, score RETURN node, score
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    - '"rows":[]'
    stdout_regex:
    - '"name":"node","type":"NULL"'
  tags: [bm25, gap0869, proximity, no-match]

- name: bm25-comp-adv-teardown
  description: GAP-0869 — drop the advanced fulltext index and its nodes
  args: [query, '-']
  stdin: DROP INDEX bm25adv869
  expect:
    exit_code: 0
  tags: [bm25, gap0869, cleanup]

- name: bm25-comp-adv-teardown-nodes
  description: GAP-0869 — remove the advanced FTS test nodes
  args: [query, '-']
  stdin: MATCH (n:Bm25Adv869) DETACH DELETE n
  expect:
    exit_code: 0
  tags: [bm25, gap0869, cleanup]

  # ---------------------------------------------------------------- cleanup --
- name: bm25-comp-teardown
  description: Remove all BM25 test nodes (CANARY idempotent teardown)
  args: [query, '-']
  stdin: MATCH (n:BM25Comp) DETACH DELETE n
  expect:
    exit_code: 0
  tags: [bm25, cleanup, canary]
