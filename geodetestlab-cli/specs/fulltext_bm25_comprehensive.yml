  args: [query, '-']
  stdin: MATCH (d:BM25Comp) WHERE d.content =~ 'graph database' RETURN count(d) AS cnt
  expect:
    exit_code: 0
    stdout_contains:
    - cnt
  tags: [bm25, multi-token]

