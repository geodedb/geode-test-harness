version: '1.0'
name: Fulltext BM25 Comprehensive Tests
description: >
  GAP-0330 — Fulltext BM25 index comprehensive coverage.
  Invariants: 100 documents inserted via explicit CREATE list (ISO GQL, no UNWIND); single-token search
  returns matching docs; multi-token search covers all token-bearing docs;
  phrase search via =~ operator works; BM25 ranking surfaced via the real
  CALL geode.fts.search('<index>', '<query>'[, max]) procedure (the former
  scalar bm25_score() spelling never existed in geode — the scalar FTS
  value-function surface was deliberately retired);
  CONTAINS predicate consistent with =~; re-index determinism
  verified via DROP + recreate + same query = same result count.
  Known gap: SHOW INDEXES does NOT expose FULLTEXT index names — asserted
  and documented with skip_reason. CANARY tokens ensure idempotent teardown.
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 60000
    cleanup: true
    args:
    - --log-level
    - warn
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 120000
    tls_verify: false
    format: json
tags:
- fulltext
- bm25
- comprehensive
tests:

  # ------------------------------------------------------------------ setup --
- name: bm25-comp-teardown-canary
  description: Idempotent pre-teardown so reruns start clean (CANARY)
  args: [query, '-']
  stdin: MATCH (n:BM25Comp) DETACH DELETE n
  expect:
    exit_code: 0
  tags: [bm25, setup, canary]

- name: bm25-comp-create-idx
  description: >
    Create fulltext index on content property (documented DDL form; the
    former `CREATE FULLTEXT INDEX ...` spelling was a 42000 parse error
    that false-passed on exit_code alone — geode query exits 0 on query
    errors).
  args: [query, '-']
  stdin: CREATE INDEX bm25_comp FOR (n:BM25Comp) ON (n.content) USING fulltext
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
  tags: [bm25, index, create]

  # The former "KNOWN GAP — fulltext indexes not surfaced in SHOW INDEXES"
  # pin was an artifact: the old `CREATE FULLTEXT INDEX ...` DDL was a 42000
  # parse error that false-passed on exit_code, so no index ever existed to
  # show. With the real `USING fulltext` DDL the index IS visible.
- name: bm25-comp-show-idx-visible
  description: >
    SHOW INDEXES surfaces the fulltext index created above (supersedes the
    stale GAP-0330 "not visible" pin, which only reproduced because the
    index-creation DDL silently failed to parse).
  args: [query, '-']
  stdin: SHOW INDEXES
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    - bm25_comp
  tags: [bm25, show]

