           (p3:SpatComp {id: 3, grid: 'inner', geo: ST_Point(3.5, 3.5)}),
           (p4:SpatComp {id: 4, grid: 'inner', geo: ST_Point(4.5, 4.5)}),
           (p5:SpatComp {id: 5, grid: 'inner', geo: ST_Point(5.5, 5.5)}),
