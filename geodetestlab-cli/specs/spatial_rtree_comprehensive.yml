           (p18:SpatComp {id: 18, grid: 'inner', geo: ST_Point(8.5, 8.5)}),
           (p19:SpatComp {id: 19, grid: 'inner', geo: ST_Point(9.5, 9.5)}),
           (p20:SpatComp {id: 20, grid: 'inner', geo: ST_Point(0.5, 0.5)}),
