           (p65:SpatComp {id: 65, grid: 'outer', geo: ST_Point(55.0, 55.0)}),
           (p66:SpatComp {id: 66, grid: 'outer', geo: ST_Point(56.0, 56.0)}),
           (p67:SpatComp {id: 67, grid: 'outer', geo: ST_Point(57.0, 57.0)}),
           (p68:SpatComp {id: 68, grid: 'outer', geo: ST_Point(58.0, 58.0)}),
           (p69:SpatComp {id: 69, grid: 'outer', geo: ST_Point(59.0, 59.0)}),
           (p70:SpatComp {id: 70, grid: 'outer', geo: ST_Point(50.0, 50.0)}),
           (p71:SpatComp {id: 71, grid: 'outer', geo: ST_Point(51.0, 51.0)}),
           (p72:SpatComp {id: 72, grid: 'outer', geo: ST_Point(52.0, 52.0)}),
           (p73:SpatComp {id: 73, grid: 'outer', geo: ST_Point(53.0, 53.0)}),
           (p74:SpatComp {id: 74, grid: 'outer', geo: ST_Point(54.0, 54.0)}),
           (p75:SpatComp {id: 75, grid: 'outer', geo: ST_Point(55.0, 55.0)}),
           (p76:SpatComp {id: 76, grid: 'outer', geo: ST_Point(56.0, 56.0)}),
           (p77:SpatComp {id: 77, grid: 'outer', geo: ST_Point(57.0, 57.0)}),
           (p78:SpatComp {id: 78, grid: 'outer', geo: ST_Point(58.0, 58.0)}),
           (p79:SpatComp {id: 79, grid: 'outer', geo: ST_Point(59.0, 59.0)}),
           (p80:SpatComp {id: 80, grid: 'outer', geo: ST_Point(50.0, 50.0)}),
           (p81:SpatComp {id: 81, grid: 'outer', geo: ST_Point(51.0, 51.0)}),
           (p82:SpatComp {id: 82, grid: 'outer', geo: ST_Point(52.0, 52.0)}),
           (p83:SpatComp {id: 83, grid: 'outer', geo: ST_Point(53.0, 53.0)}),
           (p84:SpatComp {id: 84, grid: 'outer', geo: ST_Point(54.0, 54.0)}),
           (p85:SpatComp {id: 85, grid: 'outer', geo: ST_Point(55.0, 55.0)}),
           (p86:SpatComp {id: 86, grid: 'outer', geo: ST_Point(56.0, 56.0)}),
           (p87:SpatComp {id: 87, grid: 'outer', geo: ST_Point(57.0, 57.0)}),
           (p88:SpatComp {id: 88, grid: 'outer', geo: ST_Point(58.0, 58.0)}),
           (p89:SpatComp {id: 89, grid: 'outer', geo: ST_Point(59.0, 59.0)}),
           (p90:SpatComp {id: 90, grid: 'outer', geo: ST_Point(50.0, 50.0)}),
           (p91:SpatComp {id: 91, grid: 'outer', geo: ST_Point(51.0, 51.0)}),
           (p92:SpatComp {id: 92, grid: 'outer', geo: ST_Point(52.0, 52.0)}),
           (p93:SpatComp {id: 93, grid: 'outer', geo: ST_Point(53.0, 53.0)}),
           (p94:SpatComp {id: 94, grid: 'outer', geo: ST_Point(54.0, 54.0)}),
           (p95:SpatComp {id: 95, grid: 'outer', geo: ST_Point(55.0, 55.0)}),
           (p96:SpatComp {id: 96, grid: 'outer', geo: ST_Point(56.0, 56.0)}),
           (p97:SpatComp {id: 97, grid: 'outer', geo: ST_Point(57.0, 57.0)}),
           (p98:SpatComp {id: 98, grid: 'outer', geo: ST_Point(58.0, 58.0)}),
           (p99:SpatComp {id: 99, grid: 'outer', geo: ST_Point(59.0, 59.0)}),
           (p100:SpatComp {id: 100, grid: 'outer', geo: ST_Point(50.0, 50.0)})
