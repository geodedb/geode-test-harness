           (p40:SpatComp {id: 40, grid: 'inner', geo: ST_Point(0.5, 0.5)}),
           (p41:SpatComp {id: 41, grid: 'inner', geo: ST_Point(1.5, 1.5)}),
           (p42:SpatComp {id: 42, grid: 'inner', geo: ST_Point(2.5, 2.5)}),
           (p43:SpatComp {id: 43, grid: 'inner', geo: ST_Point(3.5, 3.5)}),
           (p44:SpatComp {id: 44, grid: 'inner', geo: ST_Point(4.5, 4.5)}),
           (p45:SpatComp {id: 45, grid: 'inner', geo: ST_Point(5.5, 5.5)}),
           (p46:SpatComp {id: 46, grid: 'inner', geo: ST_Point(6.5, 6.5)}),
           (p47:SpatComp {id: 47, grid: 'inner', geo: ST_Point(7.5, 7.5)}),
           (p48:SpatComp {id: 48, grid: 'inner', geo: ST_Point(8.5, 8.5)}),
           (p49:SpatComp {id: 49, grid: 'inner', geo: ST_Point(9.5, 9.5)}),
           (p50:SpatComp {id: 50, grid: 'inner', geo: ST_Point(0.5, 0.5)})
  expect:
    exit_code: 0
  tags: [rtree, bulk-load, inner]

- name: rtree-comp-insert-outer-50
  description: Insert 50 outer-grid geo points (downscaled from 500 to use ISO GQL multi-pattern CREATE).
  args: [query, '-']
  stdin: |
    CREATE (p51:SpatComp {id: 51, grid: 'outer', geo: ST_Point(51.0, 51.0)}),
           (p52:SpatComp {id: 52, grid: 'outer', geo: ST_Point(52.0, 52.0)}),
           (p53:SpatComp {id: 53, grid: 'outer', geo: ST_Point(53.0, 53.0)}),
           (p54:SpatComp {id: 54, grid: 'outer', geo: ST_Point(54.0, 54.0)}),
           (p55:SpatComp {id: 55, grid: 'outer', geo: ST_Point(55.0, 55.0)}),
           (p56:SpatComp {id: 56, grid: 'outer', geo: ST_Point(56.0, 56.0)}),
           (p57:SpatComp {id: 57, grid: 'outer', geo: ST_Point(57.0, 57.0)}),
           (p58:SpatComp {id: 58, grid: 'outer', geo: ST_Point(58.0, 58.0)}),
