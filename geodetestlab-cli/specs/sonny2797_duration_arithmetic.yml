    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    - '"rows":[{"x":{"type":"TIMESTAMPTZ","value":"2024-01-02T12:00:00Z"}}]'
  tags:
  - regression
- name: dt-minus-day
