# SONNY-2797: GQL defines datetime +/- duration, duration +/- duration and duration * or / number, but the
# engine returned a type mismatch for all of them. ISO/IEC 39075:2024 20.26 / 20.28 (datetime and duration
# arithmetic): month and day-time components stay separate, the day is clamped at month end, a fractional
# number of months is refused (22023), divide by zero is 22012, an overflow is 22003 and instant - instant
# is a duration. BEHAVIOUR CHANGE: date + PT48H used to return the same date; it is two days later now.
version: '1.0'
name: SONNY-2797 datetime/duration arithmetic
description: datetime and duration arithmetic over the wire
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 60000
    cleanup: true
    args:
    - --log-level
    - warn
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 60000
    tls_verify: false
    format: json
tests:
- name: dt-plus-month-leap
  description: datetime('2024-01-31T10:00:00Z') + duration('P1M')
  args:
  - query
  - '-'
  stdin: |
    RETURN datetime('2024-01-31T10:00:00Z') + duration('P1M') AS x
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    - '"rows":[{"x":{"type":"TIMESTAMPTZ","value":"2024-02-29T10:00:00Z"}}]'
  tags:
  - regression
- name: dt-plus-month
  description: datetime('2023-01-31T10:00:00Z') + duration('P1M')
