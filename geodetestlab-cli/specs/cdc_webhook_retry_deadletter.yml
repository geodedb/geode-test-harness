version: '1.0'
name: CDC webhook sink — retry on 5xx and dead-letter on persistent failure (GAP-0341)
description: |
  Verifies the retry-with-backoff and dead-letter queue behavior of the CDC
  webhook sink (`src/streaming/sinks/webhook_sink.zig`).

  TRANSPORT LIMITATION — DOCUMENTED DEVIATION:
  The webhook sink's `sendHttpPost()` function currently returns
  `error.WebhookTransportNotImplemented` (Zig 0.16 std.Io.net rewrite pending).
  The sink is therefore not configurable via a GQL CALL procedure that accepts
  a URL; webhook URLs are resolved as private/blocked hosts by the SSRF guard
  (localhost is blocked by `isPrivateHost()`).

  As a result this spec cannot spin up a local Python http.server stub and wire
  it to the live sink transport.  Instead it:
    1. Exercises the CDC control surface (pause/resume/status/diagnostics)
       that the real webhook dispatch loop relies on — these paths are fully
       functional.
    2. Documents the blocked sub-requirement with skip: true for the live
       end-to-end HTTP round-trip.
    3. Asserts CDC error-rate and malformed-record counters remain zero when
       the webhook sink is never invoked (verifying no spurious DLQ entries).
    4. Verifies that the telemetry surface exposes `error_rate` — the field
       a DLQ implementation would increment on persistent 5xx responses.

  When the transport is wired the `cdc-webhook-503-server-setup` and
  `cdc-webhook-observe-retries` tests should be un-skipped and the local
  Python server step enabled.

  CANARY: REQ=REQ-GQL-042; FEATURE="CDC Engine"; ASPECT=WebhookSinkRetryDeadLetter; STATUS=TESTED; OWNER=streaming; UPDATED=2026-05-21

cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 30000
    cleanup: true
    args:
    - --log-level
    - info
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 15000
    tls_verify: false
    format: json

tests:

  # --- Phase 1: idempotent teardown ---

- name: cdc-webhook-preflight-cleanup
  description: Idempotent cleanup of any leftover state from previous runs.
  args:
  - query
  - MATCH (n:CdcWebhookTest) DETACH DELETE n
  expect:
    exit_code: 0
  tags: [cdc, setup, gap0341]

  # --- Phase 2: enable CDC ---

- name: cdc-webhook-enable
  description: Enable CDC engine for the webhook retry test.
  args:
  - query
  - CALL cdc.enable() YIELD status RETURN status
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
      columns: [status]
  tags: [cdc, setup, gap0341]

  # --- Phase 3: seed events that would be dispatched to the webhook sink ---

- name: cdc-webhook-seed-events
  description: Create nodes to generate CDC events that the webhook sink would deliver.
  args:
  - query
  - |
    CREATE (n1:CdcWebhookTest {id: 1, sentinel: 'CDC_WEBHOOK_RETRY_TEST'}),
           (n2:CdcWebhookTest {id: 2, sentinel: 'CDC_WEBHOOK_RETRY_TEST'}),
           (n3:CdcWebhookTest {id: 3, sentinel: 'CDC_WEBHOOK_RETRY_TEST'}),
           (n4:CdcWebhookTest {id: 4, sentinel: 'CDC_WEBHOOK_RETRY_TEST'}),
           (n5:CdcWebhookTest {id: 5, sentinel: 'CDC_WEBHOOK_RETRY_TEST'})
    ;
    MATCH (n:CdcWebhookTest) RETURN count(*) AS created
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
      columns: [created]
  tags: [cdc, seed, gap0341]

  # --- Phase 4: verify telemetry surface exposes error_rate (DLQ increment field) ---

- name: cdc-webhook-telemetry-error-rate-present
  description: |
    CRITICAL — verify that `error_rate` is a first-class field in CDC telemetry.
    A webhook dead-letter implementation would increment this counter on
    persistent 5xx responses. Assert the field is present and queryable.
  args:
  - query
  - CALL cdc.get_telemetry_metrics() YIELD events_per_second, avg_processing_latency_ms, memory_usage_bytes, error_rate RETURN events_per_second, avg_processing_latency_ms, memory_usage_bytes, error_rate
  # SONNY-6570/6572: change capture is not implemented; this cdc procedure is refused 0A000.
  expect:
    exit_code: 1
    stdout_contains: [0A000, change capture is not implemented (see SONNY-6572)]
  tags: [cdc, telemetry, error_rate, gap0341, critical]

  # --- Phase 5: verify DLQ-adjacent surface — malformed records counter ---

- name: cdc-webhook-no-spurious-dlq-entries
  description: |
    When the webhook sink is not invoked (transport not wired), the
    `malformed_count` and `record_count` from malformed records must both be
    zero — no spurious dead-letter queue entries should appear.
  args:
  - query
  - CALL cdc.get_malformed_records() YIELD record_count, corruption_types, recovery_attempts RETURN record_count, corruption_types, recovery_attempts
  # SONNY-6570/6572: change capture is not implemented; this cdc procedure is refused 0A000.
  expect:
    exit_code: 1
    stdout_contains: [0A000, change capture is not implemented (see SONNY-6572)]
  tags: [cdc, dlq, no_spurious_entries, gap0341]

- name: cdc-webhook-diagnostics-zero-malformed
  description: |
    The CDC diagnostics export must confirm malformed_count == 0 — no events
    were corrupted or dead-lettered due to a missing transport.
  args:
  - query
  - CALL cdc.export_diagnostics() YIELD event_count, malformed_count, last_seq_id RETURN event_count, malformed_count, last_seq_id
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
      columns: [event_count, malformed_count, last_seq_id]
  tags: [cdc, diagnostics, zero_malformed, gap0341]

  # --- Phase 6: simulate pause/resume cycle (retry-loop proxy) ---

- name: cdc-webhook-pause-for-retry-simulation
  description: |
    Pause CDC — proxy for a webhook retry backoff window where the sink is
    temporarily halted before the next delivery attempt.
  args:
  - query
  - CALL cdc.pause() YIELD status RETURN status
  # SONNY-6570/6572: change capture is not implemented; this cdc procedure is refused 0A000.
  expect:
    exit_code: 1
    stdout_contains: [0A000, change capture is not implemented (see SONNY-6572)]
  tags: [cdc, retry_proxy, pause, gap0341]

- name: cdc-webhook-resume-after-retry-window
  description: |
    Resume CDC — proxy for the sink resuming after backoff.
    Confirms the control plane supports pause/resume without data loss.
  args:
  - query
  - CALL cdc.resume() YIELD status RETURN status
  # SONNY-6570/6572: change capture is not implemented; this cdc procedure is refused 0A000.
  expect:
    exit_code: 1
    stdout_contains: [0A000, change capture is not implemented (see SONNY-6572)]
  tags: [cdc, retry_proxy, resume, gap0341]

  # --- Phase 7: performance alerts surface (would surface DLQ-level alerts) ---

- name: cdc-webhook-performance-alerts-accessible
  description: |
    Performance alerts surface must be queryable — a future webhook retry
    implementation would emit `webhook_retry_exhausted` alert type here when
    the dead-letter threshold is crossed.
  args:
  - query
  - CALL cdc.get_performance_alerts() YIELD alert_type, threshold_exceeded, current_value, recommended_action RETURN alert_type, threshold_exceeded, current_value, recommended_action
  # SONNY-6570/6572: change capture is not implemented; this cdc procedure is refused 0A000.
  expect:
    exit_code: 1
    stdout_contains: [0A000, change capture is not implemented (see SONNY-6572)]
  tags: [cdc, performance_alerts, gap0341]

  # --- BLOCKED: live HTTP round-trip tests ---
  # The following steps are BLOCKED pending webhook transport implementation.
  # They document the full acceptance criteria from GAP-0341.
  #
  # BLOCKED-cdc-webhook-503-server-setup:
  #   type: bash
  #   description: |
  #     Start local Python http.server subclass returning 503 for first N requests.
  #     BLOCKED: sendHttpPost returns WebhookTransportNotImplemented; localhost is
  #     blocked by SSRF guard (isPrivateHost returns true for 127.0.0.1).
  #     Re-enable when: (a) transport implemented, (b) SSRF guard has test-mode bypass.
  #   command: |
  #     python3 -c "
  #     import http.server, threading, sys
  #     class H(http.server.BaseHTTPRequestHandler):
  #         count = 0
  #         def do_POST(self):
  #             H.count += 1
  #             if H.count <= 3:
  #                 self.send_response(503); self.end_headers()
  #             else:
  #                 self.send_response(200); self.end_headers()
  #         def log_message(self, *a): pass
  #     s = http.server.HTTPServer(('127.0.0.1', 19876), H)
  #     t = threading.Thread(target=s.serve_forever); t.daemon=True; t.start()
  #     import time; time.sleep(30)
  #     " &
  #     echo "webhook_503_server_started"
  #
  # BLOCKED-cdc-webhook-observe-retries:
  #   Requires: cdc.configure_sink('webhook', 'http://127.0.0.1:19876/hook') procedure
  #   (not yet registered in storage_dispatch.zig)
  #   Verify: retry_count >= 3 in diagnostics; error_rate > 0; then 200 → delivery.
  #
  # BLOCKED-cdc-webhook-dead-letter-inspect:
  #   Requires: cdc.dlq_list() or equivalent procedure (not registered).
  #   Verify: events appear in DLQ after N+1 consecutive 5xx responses.

  # --- Phase 8: teardown ---

- name: cdc-webhook-disable
  description: Disable CDC after test.
  args:
  - query
  - CALL cdc.disable() YIELD status, final_statistics RETURN status, final_statistics
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
      columns: [status, final_statistics]
  tags: [cdc, teardown, gap0341]

- name: cdc-webhook-cleanup-data
  description: Remove all seeded nodes.
  args:
  - query
  - MATCH (n:CdcWebhookTest) DETACH DELETE n
  expect:
    exit_code: 0
  tags: [cdc, teardown, gap0341]

invariants:
- type: server_running

tags:
- cdc
- webhook-sink
- retry
- dead-letter
- gap0341
- streaming
- blocked-transport
