version: '1.0'
name: GQL Parameter Binding in Mutations
description: 'Tests that CREATE and MERGE resolve $param and --param references in property maps (GAP #54)'
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 30000
    cleanup: true
    args:
    - --log-level
    - info
  client:
    timeout_ms: 15000
    tls_verify: false
    format: json
tests:
- name: create-with-cli-param-string
  description: CREATE should resolve --param in property map
  args:
  - query
  - --param
  - name
  - '"Alice"'
  - 'CREATE (n:ParamBind {name: $name}) RETURN n.name AS name'
  expect:
    exit_code: 0
    stdout_json_assert:
    - expression: results[0].name
      equals: Alice
  tags:
  - parameter-binding
  - create

- name: create-with-cli-param-int
  description: CREATE should resolve --param integer in property map
  args:
  - query
  - --param
  - age
  - '30'
  - 'CREATE (n:ParamBindInt {age: $age}) RETURN n.age AS age'
  expect:
    exit_code: 0
    stdout_json_assert:
    - expression: results[0].age
      equals: 30
  tags:
  - parameter-binding
  - create

- name: merge-with-cli-param
  description: MERGE should resolve --param in property map for matching and creation
  args:
  - query
  - --param
  - id
  - '"mp1"'
  - 'MERGE (n:ParamMerge {id: $id}) RETURN n.id AS id'
  expect:
    exit_code: 0
    stdout_json_assert:
    - expression: results[0].id
      equals: mp1
  tags:
  - parameter-binding
  - merge

- name: merge-with-cli-param-idempotent
  description: MERGE with same param should not create duplicate
  args:
  - query
  - --param
  - id
  - '"mp2"'
  - '-'
  stdin: |
    MERGE (n:ParamMergeIdem {id: $id});
    MERGE (n:ParamMergeIdem {id: $id});
    MATCH (n:ParamMergeIdem) RETURN count(n) AS c
  expect:
    exit_code: 0
    stdout_json_assert:
    - expression: results[0].c
      equals: 1
  tags:
  - parameter-binding
  - merge
  - idempotent
