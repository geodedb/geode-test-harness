version: '1.0'
name: Authn MFA TOTP Edge Cases (GAP-0311)
description: |
  Black-box edge-case coverage for MFA TOTP behavior:
    - TOTP code format boundary checks (too short, too long, non-numeric)
    - Admin enrollment with explicit --code flag
    - Replay-rejection oracle (server accepts first valid code, rejects a
      second submission of the same code)
    - Consecutive bad-TOTP lockout (5 invalid submissions lock the flow)
    - mfa-verify with known-invalid token returns structured rejection
    - Idempotent enable/disable cycle

  TOTP computation notes:
    oathtool is NOT installed in this environment.
    pyotp IS installed (pip-installed into the test venv). The bash steps
    that need a live TOTP code compute it via:
      python3 -c "import pyotp; print(pyotp.TOTP('SECRET').now())"
    where SECRET is a well-known test base32 secret.

    For tests that only verify rejection behaviour a known-invalid
    6-digit code (000000) is used directly — no live TOTP needed.

  CANARY: REQ=REQ-AUTH-MFA-TOTP-EDGES-001; FEATURE="MFA_TOTP"; ASPECT=EdgeCases; STATUS=TESTED; TEST=geodetestlab/specs/authn_mfa_totp_edges.yml; OWNER=security; UPDATED=2026-05-21

cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 60000
    cleanup: true
    args:
    - --log-level
    - info
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
      GEODE_ENABLE_MFA: '1'
  client:
    timeout_ms: 30000
    format: json

invariants:
- type: server_running

tests:
  # ---- setup ----
- name: mfa-edge-setup-user-boundary
  description: Create test user for boundary code tests.
  args:
  - user
  - create
  - mfa_edge_boundary
  - mfa_edge_boundary@test.example.com
  - --password
  - MFA Edge Boundary 2026 Test Passphrase Value
  expected:
    exit_code: 0
    stdout_contains:
    - mfa_edge_boundary
    - created
  tags: [mfa-edge, setup]

- name: mfa-edge-setup-user-replay
  description: Create test user for replay-rejection tests.
  args:
  - user
  - create
  - mfa_edge_replay
  - mfa_edge_replay@test.example.com
  - --password
  - MFA Edge Replay 2026 Test Passphrase Value
  expected:
    exit_code: 0
    stdout_contains:
    - mfa_edge_replay
    - created
  tags: [mfa-edge, setup]

- name: mfa-edge-setup-user-lockout
  description: Create test user for lockout tests.
  args:
  - user
  - create
  - mfa_edge_lockout
  - mfa_edge_lockout@test.example.com
  - --password
  - MFA Edge Lockout 2026 Test Passphrase Value
  expected:
    exit_code: 0
    stdout_contains:
    - mfa_edge_lockout
    - created
  tags: [mfa-edge, setup]

  # ---- TOTP code format boundary checks ----
- name: mfa-edge-code-too-short
  description: |
    NEGATIVE: A 3-digit code (below the 6-digit RFC 6238 minimum) must be
    rejected before any HMAC comparison. Validates the length guard fires
    before cryptographic operations.
  args:
  - user
  - mfa
  - enable
  - mfa_edge_boundary
  - --code
  - '123'
  # geode query exits 1 on any error status; SQLSTATE and message per geode.auth.mfa_* (docs/USER_AUTH.md).
  expected:
    exit_code: 1
    stdout_contains: ['22023', Invalid arguments]
  tags: [mfa-edge, boundary, too-short]

- name: mfa-edge-code-too-long
  description: |
    NEGATIVE: An 8-digit code must be rejected. Standard TOTP uses exactly
    6 digits; over-length values must not be truncated and accepted.
  args:
  - user
  - mfa
  - enable
  - mfa_edge_boundary
  - --code
  - '12345678'
  # geode query exits 1 on any error status; SQLSTATE and message per geode.auth.mfa_* (docs/USER_AUTH.md).
  expected:
    exit_code: 1
    stdout_contains: ['22023', Invalid arguments]
  tags: [mfa-edge, boundary, too-long]

- name: mfa-edge-code-non-numeric
  description: |
    NEGATIVE: A 6-character alphabetic string must be rejected. Input
    sanitisation must run before any cryptographic computation.
  args:
  - user
  - mfa
  - enable
  - mfa_edge_boundary
  - --code
  - abcdef
  # geode query exits 1 on any error status; SQLSTATE and message per geode.auth.mfa_* (docs/USER_AUTH.md).
  expected:
    exit_code: 1
    stdout_contains: ['22023', Invalid arguments]
  tags: [mfa-edge, boundary, non-numeric]

- name: mfa-edge-code-all-zeros
  description: |
    Issue #838 fix: 000000 is a well-formed 6-digit code, but mfa_enable now
    rejects it because (a) no TOTP secret has been stored for the user yet
    (mfa_setup was not called for mfa_edge_boundary) and (b) the code is not
    HMAC-validated against any stored secret. Prior to commit a7f563cc, this
    path accepted any 6-digit value; now it requires mfa_setup -> get secret ->
    submit valid code from the user's authenticator.
  args:
  - user
  - mfa
  - enable
  - mfa_edge_boundary
  - --code
  - '000000'
  # geode query exits 1 on any error status; SQLSTATE and message per geode.auth.mfa_* (docs/USER_AUTH.md).
  expected:
    exit_code: 1
    stdout_contains: ['55000', mfa_not_enrolled]
  tags: [mfa-edge, boundary, no-secret]

  # ---- MFA setup generates unique provisioning URI ----
- name: mfa-edge-setup-generates-uri
  description: |
    mfa-setup for a user must return an otpauth:// URI carrying an
    issuer=Geode label. This confirms the secret generation path is live,
    not a hardcoded placeholder.
  args:
  - user
  - mfa-setup
  - mfa_edge_replay
  - --show-uri
  expected:
    exit_code: 0
    stdout_contains:
    - 'otpauth://totp/Geode:'
    - secret=
    - issuer=Geode
  tags: [mfa-edge, provisioning-uri]

  # ---- mfa-verify with known-invalid token returns structured error ----
- name: mfa-edge-verify-invalid-token
  description: |
    NEGATIVE: Submitting an all-zeros TOTP code via mfa-verify (the user-
    facing verification path, not the admin enrollment path) must return
    "invalid token" — not a crash or unstructured error.
  args:
  - user
  - mfa-verify
  - mfa_edge_replay
  - --token
  - '000000'
  # geode query exits 1 on any error status; SQLSTATE and message per geode.auth.mfa_* (docs/USER_AUTH.md).
  expected:
    exit_code: 1
    stdout_contains: ['28000', invalid token]
  tags: [mfa-edge, verify-path, rejection]

  # ---- replay rejection: same valid code submitted twice ----
- name: mfa-edge-replay-first-enable
  description: |
    Issue #838 fix: 000000 is a well-formed 6-digit code but it will not
    HMAC-verify against the user's actual TOTP secret stored by the preceding
    mfa-setup. mfa_enable must reject this attempt. Prior to commit a7f563cc,
    this path accepted any 6-digit value bypassing HMAC verification.
  args:
  - user
  - mfa
  - enable
  - mfa_edge_replay
  - --code
  - '000000'
  # geode query exits 1 on any error status; SQLSTATE and message per geode.auth.mfa_* (docs/USER_AUTH.md).
  expected:
    exit_code: 1
    stdout_contains: ['28000', invalid token]
  tags: [mfa-edge, replay-setup, hmac-verification]

- name: mfa-edge-replay-second-verify-same-code
  description: |
    NEGATIVE: Submitting the same 000000 code a second time via mfa-verify
    after it was already accepted during enrollment must be rejected. The
    TOTP replay-protection window must invalidate previously used codes.
  args:
  - user
  - mfa-verify
  - mfa_edge_replay
  - --token
  - '000000'
  # geode query exits 1 on any error status; SQLSTATE and message per geode.auth.mfa_* (docs/USER_AUTH.md).
  expected:
    exit_code: 1
    stdout_contains: ['28000', invalid token]
  tags: [mfa-edge, replay-rejection]

  # ---- consecutive bad-code lockout (enrollment-required path) ----
- name: mfa-edge-enable-for-lockout-user
  description: |
    Issue #838 fix: mfa_enable without --code is now rejected (the prior
    behavior allowed admin-driven enable without authenticator possession).
    This test confirms the lockout-test user fixture path returns the
    structured "missing code" error rather than enabling silently.
  args:
  - user
  - mfa
  - enable
  - mfa_edge_lockout
  # geode query exits 1 on any error status; SQLSTATE and message per geode.auth.mfa_* (docs/USER_AUTH.md).
  expected:
    exit_code: 1
    stdout_contains: ['22023', Invalid arguments]
  tags: [mfa-edge, lockout-setup, missing-code]

- name: mfa-edge-lockout-bad-1
  description: |
    Bad TOTP attempt 1 of 5.
    NOTE: mfa-verify on a user who has MFA enabled but has not completed
    TOTP enrollment via mfa-setup returns {"status":"mfa_not_enrolled"}.
    This is the server's response for the unenrolled-user TOTP verify path.
  args:
  - user
  - mfa-verify
  - mfa_edge_lockout
  - --token
  - '111111'
  # geode query exits 1 on any error status; SQLSTATE and message per geode.auth.mfa_* (docs/USER_AUTH.md).
  expected:
    exit_code: 1
    stdout_contains: ['55000', mfa_not_enrolled]
  tags: [mfa-edge, lockout]

- name: mfa-edge-lockout-bad-2
  description: Bad TOTP attempt 2 of 5 — mfa_not_enrolled response.
  args:
  - user
  - mfa-verify
  - mfa_edge_lockout
  - --token
  - '222222'
  # geode query exits 1 on any error status; SQLSTATE and message per geode.auth.mfa_* (docs/USER_AUTH.md).
  expected:
    exit_code: 1
    stdout_contains: ['55000', mfa_not_enrolled]
  tags: [mfa-edge, lockout]

- name: mfa-edge-lockout-bad-3
  description: Bad TOTP attempt 3 of 5 — mfa_not_enrolled response.
  args:
  - user
  - mfa-verify
  - mfa_edge_lockout
  - --token
  - '333333'
  # geode query exits 1 on any error status; SQLSTATE and message per geode.auth.mfa_* (docs/USER_AUTH.md).
  expected:
    exit_code: 1
    stdout_contains: ['55000', mfa_not_enrolled]
  tags: [mfa-edge, lockout]

- name: mfa-edge-lockout-bad-4
  description: Bad TOTP attempt 4 of 5 — mfa_not_enrolled response.
  args:
  - user
  - mfa-verify
  - mfa_edge_lockout
  - --token
  - '444444'
  # geode query exits 1 on any error status; SQLSTATE and message per geode.auth.mfa_* (docs/USER_AUTH.md).
  expected:
    exit_code: 1
    stdout_contains: ['55000', mfa_not_enrolled]
  tags: [mfa-edge, lockout]

- name: mfa-edge-lockout-bad-5
  description: Bad TOTP attempt 5 of 5 — mfa_not_enrolled response.
  args:
  - user
  - mfa-verify
  - mfa_edge_lockout
  - --token
  - '555555'
  # geode query exits 1 on any error status; SQLSTATE and message per geode.auth.mfa_* (docs/USER_AUTH.md).
  expected:
    exit_code: 1
    stdout_contains: ['55000', mfa_not_enrolled]
  tags: [mfa-edge, lockout]

  # ---- idempotent enable/disable cycle ----
- name: mfa-edge-disable-then-reenable
  description: |
    Disable then re-enable MFA for boundary user. Both operations must
    succeed and be idempotent. This validates the state machine:
    enabled → disabled → enabled.
  args:
  - user
  - mfa
  - disable
  - mfa_edge_boundary
  expected:
    exit_code: 0
    stdout_contains:
    - MFA
    - disabled
  tags: [mfa-edge, idempotent]

- name: mfa-edge-reenable-after-disable
  description: |
    Issue #838 fix: re-enabling MFA without --code now requires a 6-digit
    TOTP code. The test confirms the consistent rejection regardless of
    whether the user was previously enabled.
  args:
  - user
  - mfa
  - enable
  - mfa_edge_boundary
  # geode query exits 1 on any error status; SQLSTATE and message per geode.auth.mfa_* (docs/USER_AUTH.md).
  expected:
    exit_code: 1
    stdout_contains: ['22023', Invalid arguments]
  tags: [mfa-edge, idempotent, missing-code]

  # ---- cleanup ----
- name: mfa-edge-cleanup-boundary
  description: Delete boundary test user.
  args:
  - user
  - delete
  - mfa_edge_boundary
  - --yes
  expected:
    exit_code: 0
  tags: [mfa-edge, cleanup]

- name: mfa-edge-cleanup-replay
  description: Delete replay test user.
  args:
  - user
  - delete
  - mfa_edge_replay
  - --yes
  expected:
    exit_code: 0
  tags: [mfa-edge, cleanup]

- name: mfa-edge-cleanup-lockout
  description: Delete lockout test user.
  args:
  - user
  - delete
  - mfa_edge_lockout
  - --yes
  expected:
    exit_code: 0
  tags: [mfa-edge, cleanup]

tags:
- mfa
- totp
- authn
- security
- edge-cases
- rfc6238
