version: '1.0'
name: Large Transaction Rollback Tests
description: Testing transaction rollback with various sizes of transactions
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 120000
    cleanup: true
    args:
    - --log-level
    - warn
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 120000
    tls_verify: false
    format: json
tests:
- name: rollback-small-transaction
  description: Test rollback of small transaction (10 statements)
  args:
  - query
  - '-'
  stdin: "BEGIN;\nCREATE (n1:RollbackTest {id: 1});\nCREATE (n2:RollbackTest {id: 2});\nCREATE (n3:RollbackTest {id: 3});\nCREATE (n4:RollbackTest {id: 4});\nCREATE (n5:RollbackTest {id: 5});\nCREATE (n6:RollbackTest {id: 6});\nCREATE (n7:RollbackTest {id: 7});\nCREATE (n8:RollbackTest {id: 8});\nCREATE (n9:RollbackTest {id: 9});\nCREATE (n10:RollbackTest {id: 10});\nROLLBACK;\nMATCH (n:RollbackTest) RETURN count(n) AS cnt;\n"
  expect:
    exit_code: 0
    stdout_contains:
    - '0'
  tags:
  - transaction
  - rollback
  - small
- name: rollback-medium-transaction
  description: Test rollback of medium transaction (50 CREATE statements)
  args:
  - query
  - '-'
  stdin: "BEGIN;\nCREATE (n:MediumRollback {batch: 1});\nCREATE (n:MediumRollback {batch: 2});\nCREATE (n:MediumRollback {batch: 3});\nCREATE (n:MediumRollback {batch: 4});\nCREATE (n:MediumRollback {batch: 5});\nCREATE (n:MediumRollback {batch: 6});\nCREATE (n:MediumRollback {batch: 7});\nCREATE (n:MediumRollback {batch: 8});\nCREATE (n:MediumRollback {batch: 9});\nCREATE (n:MediumRollback {batch: 10});\nCREATE (n:MediumRollback {batch: 11});\nCREATE (n:MediumRollback {batch: 12});\nCREATE (n:MediumRollback {batch: 13});\nCREATE (n:MediumRollback {batch: 14});\nCREATE (n:MediumRollback {batch: 15});\nCREATE (n:MediumRollback {batch: 16});\nCREATE (n:MediumRollback {batch: 17});\nCREATE (n:MediumRollback {batch: 18});\nCREATE (n:MediumRollback {batch: 19});\nCREATE (n:MediumRollback {batch: 20});\nCREATE (n:MediumRollback {batch: 21});\nCREATE (n:MediumRollback {batch: 22});\nCREATE (n:MediumRollback {batch: 23});\nCREATE (n:MediumRollback {batch: 24});\nCREATE (n:MediumRollback {batch: 25});\nCREATE (n:MediumRollback {batch: 26});\nCREATE (n:MediumRollback {batch: 27});\nCREATE (n:MediumRollback {batch: 28});\nCREATE (n:MediumRollback {batch: 29});\nCREATE (n:MediumRollback {batch: 30});\nCREATE (n:MediumRollback {batch: 31});\nCREATE (n:MediumRollback {batch: 32});\nCREATE (n:MediumRollback {batch: 33});\nCREATE (n:MediumRollback {batch: 34});\nCREATE (n:MediumRollback {batch: 35});\nCREATE (n:MediumRollback {batch: 36});\nCREATE (n:MediumRollback {batch: 37});\nCREATE (n:MediumRollback {batch: 38});\nCREATE (n:MediumRollback {batch: 39});\nCREATE (n:MediumRollback {batch: 40});\nCREATE (n:MediumRollback {batch: 41});\nCREATE (n:MediumRollback {batch: 42});\nCREATE (n:MediumRollback {batch: 43});\nCREATE (n:MediumRollback {batch: 44});\nCREATE (n:MediumRollback {batch: 45});\nCREATE (n:MediumRollback {batch: 46});\nCREATE (n:MediumRollback {batch: 47});\nCREATE (n:MediumRollback {batch: 48});\nCREATE (n:MediumRollback {batch: 49});\nCREATE (n:MediumRollback {batch: 50});\nROLLBACK;\nMATCH (n:MediumRollback) RETURN count(n) AS cnt;\n"
  expect:
    exit_code: 0
    stdout_contains:
    - '0'
  tags:
  - transaction
  - rollback
  - medium
- name: rollback-verify-atomicity
  description: Verify no partial data after rollback
  args:
  - query
  - '-'
  stdin: "BEGIN;\nCREATE (a:AtomicTest {id: 1});\nCREATE (b:AtomicTest {id: 2});\nCREATE (a)-[:RELATES_TO]->(b);\nCREATE (c:AtomicTest {id: 3});\nROLLBACK;\nMATCH (n:AtomicTest) RETURN count(n) AS node_cnt;\nMATCH ()-[r:RELATES_TO]->() RETURN count(r) AS edge_cnt;\n"
  expect:
    exit_code: 0
    stdout_contains:
    - '0'
  tags:
  - transaction
  - rollback
  - atomicity
- name: rollback-preserves-previous-data-seed
  description: |
    Issue #830 (2026-05-21): the CLI now rejects multi-statement
    programs that contain BEGIN+mutation+ROLLBACK because the server
    cannot honor ROLLBACK semantics when statements are bundled.
    Split the original three-phase test into separate CLI invocations
    so each session sees one logical action.

    Phase 1: seed a committed row outside any transaction.
  args:
  - query
  - '-'
  stdin: |
    CREATE (p:PreserveTest {id: 'committed'});
  expect:
    exit_code: 0
  tags:
  - transaction
  - rollback
  - isolation
- name: rollback-preserves-previous-data-txn
  description: Phase 2 — open transaction, mutate, rollback in a separate session.
  args:
  - query
  - '-'
  stdin: |
    BEGIN;
    CREATE (n:PreserveTest {id: 'uncommitted'});
    ROLLBACK;
  expect:
    exit_code: 0
  tags:
  - transaction
  - rollback
  - isolation
- name: rollback-preserves-previous-data
  description: Phase 3 — verify the committed row survives, uncommitted does not.
  args:
  - query
  - '-'
  stdin: |
    MATCH (n:PreserveTest) RETURN n.id AS id;
  expect:
    exit_code: 0
    stdout_contains:
    - committed
    stdout_not_contains:
    - uncommitted
  tags:
  - transaction
  - rollback
  - isolation
- name: rollback-nested-structures
  description: Test rollback with complex nested structures
  args:
  - query
  - '-'
  stdin: "BEGIN;\nCREATE (a:Nested {level: 1})-[:CHILD]->(b:Nested {level: 2})-[:CHILD]->(c:Nested {level: 3});\nCREATE (b)-[:SIBLING]->(d:Nested {level: 2});\nCREATE (d)-[:CHILD]->(e:Nested {level: 3});\nROLLBACK;\nMATCH (n:Nested) RETURN count(n) AS cnt;\n"
  expect:
    exit_code: 0
    stdout_contains:
    - '0'
  tags:
  - transaction
  - rollback
  - nested
- name: rollback-empty-transaction
  description: Test rollback of empty transaction (no-op)
  args:
  - query
  - '-'
  stdin: "BEGIN;\nROLLBACK;\nRETURN 'success' AS status;\n"
  expect:
    exit_code: 0
    stdout_contains:
    - success
  tags:
  - transaction
  - rollback
  - edge-case
- name: rollback-only-queries
  description: Test rollback with only read queries (no modifications)
  args:
  - query
  - '-'
  stdin: "CREATE (n:QueryOnly {id: 1});\nBEGIN;\nMATCH (n:QueryOnly) RETURN n.id AS id;\nMATCH (n:QueryOnly) WHERE n.id = 1 RETURN count(n) AS cnt;\nROLLBACK;\nMATCH (n:QueryOnly) RETURN n.id AS id;\n"
  expect:
    exit_code: 0
    stdout_contains:
    - '1'
  tags:
  - transaction
  - rollback
  - read-only
- name: rollback-without-begin
  description: Test ROLLBACK without active transaction (no-op)
  args:
  - query
  - '-'
  stdin: ROLLBACK
  expect:
    exit_code: 0
    stdout_contains:
    - no transaction active
  tags:
  - transaction
  - rollback
  - edge-case
tags:
- transaction
- rollback
- gql-compliance
- large-data
