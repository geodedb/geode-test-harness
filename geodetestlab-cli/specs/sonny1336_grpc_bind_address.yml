    stdout_not_contains: [server_died]
  tags: [grpc, bind, sonny-1336, regression]

- name: unbindable-address-or-bad-port-is-refused-at-startup
  description: IPv6, a host name, a non-numeric port and an out-of-range port exit 2 naming --listen-grpc, and nothing listens
  type: bash
  timeout_ms: 240000
  command: |
    set -u
    BIN="${GEODE_BINARY:-geode}"
    export GEODE_ADMIN_PASSWORD="${GEODE_ADMIN_PASSWORD:-Geode Test Admin Passphrase}"
    GP=$(python3 -c "import socket;t=socket.socket();t.bind(('127.0.0.1',0));print(t.getsockname()[1])")
    FAIL=0
    for ARG in "[::1]:$GP" "grpc.example.invalid:$GP" "127.0.0.1:${GP}x" "127.0.0.1:70000"; do
      D=$(mktemp -d)
      timeout 60 "$BIN" serve --data-dir "$D/data" --log-level info --listen-grpc "$ARG" > "$D/log" 2>&1
      RC=$?
      LISTEN=$(python3 -c "
    gp = $GP; n = 0
    for line in open('/proc/net/tcp').read().splitlines()[1:]:
        f = line.split()
        if f[3] == '0A' and int(f[1].split(':')[1], 16) == gp: n += 1
    print(n)")
      if [ "$RC" = "2" ] && grep -qF -- "--listen-grpc" "$D/log" && grep -qF -- "$ARG" "$D/log" && [ "$LISTEN" = "0" ]; then
        echo "REFUSED_OK $ARG"
      else
        echo "REFUSED_BAD $ARG rc=$RC listeners=$LISTEN"; tail -n 8 "$D/log"; FAIL=1
      fi
      rm -rf "$D"
    done
    exit $FAIL
  expect:
    exit_code: 0
    stdout_contains:
    - 'REFUSED_OK [::1]:'
    - 'REFUSED_OK grpc.example.invalid:'
    - REFUSED_OK 127.0.0.1:70000
    stdout_not_contains: [REFUSED_BAD]
  tags: [grpc, bind, sonny-1336, regression, negative]
