version: '1.0'
name: Advanced Transaction Chunking Tests
description: Advanced black-box tests for savepoints, nested transactions, and edge
  cases in chunked execution
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    startup_timeout_ms: 30000
    args:
    - --disable-auth
    - --insecure
    - --log-level
    - error
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
secrets: {}
invariants:
- type: server_running
fuzz:
  enabled: false
tests:
- name: setup-advanced-txn-graph
  description: Create graph for advanced transaction tests
  args:
  - query
  - --insecure
  - CREATE GRAPH IF NOT EXISTS txn_advanced_test
  expect:
    exit_code: 0
  tags:
  - setup
- name: txn-savepoint-basic
  description: Test SAVEPOINT and ROLLBACK TO across chunk boundaries
  skip: true
  setup:
    script: "#!/bin/bash\ncat > /tmp/geode_txn_savepoint.gql << 'EOF'\nUSE GRAPH txn_advanced_test;\n\
      START TRANSACTION;\nEOF\n# First batch\nfor i in {1..300}; do\n  echo \"CREATE\
      \ (n:SavepointTest {id: $i, batch: 1, description: 'Before savepoint with extended\
      \ data.'});\" >> /tmp/geode_txn_savepoint.gql\ndone\necho \"SAVEPOINT sp1;\"\
      \ >> /tmp/geode_txn_savepoint.gql\n\n# Second batch (will be rolled back)\n\
      for i in {301..600}; do\n  echo \"CREATE (n:SavepointTest {id: $i, batch: 2,\
      \ description: 'After savepoint - will rollback.'});\" >> /tmp/geode_txn_savepoint.gql\n\
      done\necho \"ROLLBACK TO SAVEPOINT sp1;\" >> /tmp/geode_txn_savepoint.gql\n\n\
      # Third batch\nfor i in {601..900}; do\n  echo \"CREATE (n:SavepointTest {id:\
      \ $i, batch: 3, description: 'After rollback to savepoint.'});\" >> /tmp/geode_txn_savepoint.gql\n\
      done\necho \"COMMIT;\" >> /tmp/geode_txn_savepoint.gql\n"
  args:
  - query
  - --insecure
  - --file
  - /tmp/geode_txn_savepoint.gql
  expect:
    exit_code: 0
    stdout_contains:
    - Large file detected
    - chunked execution
  verify:
  - args:
    - query
    - --insecure
    - USE GRAPH txn_advanced_test; MATCH (n:SavepointTest) RETURN count(n) AS cnt
    expect:
      stdout_contains:
      - '600'
  - args:
    - query
    - --insecure
    - 'USE GRAPH txn_advanced_test; MATCH (n:SavepointTest {batch: 2}) RETURN count(n)
      AS cnt'
    expect:
      stdout_contains:
      - '0'
  cleanup:
  - - query
    - --insecure
    - USE GRAPH txn_advanced_test; MATCH (n:SavepointTest) DELETE n
  tags:
  - transaction
  - savepoint
  - chunked
  - advanced
- name: txn-nested-savepoints
  description: Test nested savepoints across chunks
  skip: true
  setup:
    script: "#!/bin/bash\ncat > /tmp/geode_txn_nested_savepoint.gql << 'EOF'\nUSE\
      \ GRAPH txn_advanced_test;\nSTART TRANSACTION;\nEOF\nfor i in {1..200}; do\n\
      \  echo \"CREATE (n:NestedSP {id: $i, level: 0, description: 'Base level data.'});\"\
      \ >> /tmp/geode_txn_nested_savepoint.gql\ndone\necho \"SAVEPOINT outer;\" >>\
      \ /tmp/geode_txn_nested_savepoint.gql\n\nfor i in {201..400}; do\n  echo \"\
      CREATE (n:NestedSP {id: $i, level: 1, description: 'Outer savepoint data.'});\"\
      \ >> /tmp/geode_txn_nested_savepoint.gql\ndone\necho \"SAVEPOINT inner;\" >>\
      \ /tmp/geode_txn_nested_savepoint.gql\n\nfor i in {401..600}; do\n  echo \"\
      CREATE (n:NestedSP {id: $i, level: 2, description: 'Inner savepoint data - will\
      \ rollback.'});\" >> /tmp/geode_txn_nested_savepoint.gql\ndone\necho \"ROLLBACK\
      \ TO SAVEPOINT inner;\" >> /tmp/geode_txn_nested_savepoint.gql\n\nfor i in {601..800};\
      \ do\n  echo \"CREATE (n:NestedSP {id: $i, level: 1, description: 'After inner\
      \ rollback.'});\" >> /tmp/geode_txn_nested_savepoint.gql\ndone\necho \"COMMIT;\"\
      \ >> /tmp/geode_txn_nested_savepoint.gql\n"
  args:
  - query
  - --insecure
  - --file
  - /tmp/geode_txn_nested_savepoint.gql
  expect:
    exit_code: 0
  verify:
  - args:
    - query
    - --insecure
    - USE GRAPH txn_advanced_test; MATCH (n:NestedSP) RETURN count(n) AS cnt
    expect:
      stdout_contains:
      - '600'
  - args:
    - query
    - --insecure
    - 'USE GRAPH txn_advanced_test; MATCH (n:NestedSP {level: 2}) RETURN count(n)
      AS cnt'
    expect:
      stdout_contains:
      - '0'
  cleanup:
  - - query
    - --insecure
    - USE GRAPH txn_advanced_test; MATCH (n:NestedSP) DELETE n
  tags:
  - transaction
  - savepoint
  - nested
  - chunked
- name: txn-release-savepoint
  description: Test RELEASE SAVEPOINT across chunks
  skip: true
  setup:
    script: "#!/bin/bash\ncat > /tmp/geode_txn_release_savepoint.gql << 'EOF'\nUSE\
      \ GRAPH txn_advanced_test;\nSTART TRANSACTION;\nEOF\nfor i in {1..300}; do\n\
      \  echo \"CREATE (n:ReleaseSP {id: $i, description: 'Data before savepoint.'});\"\
      \ >> /tmp/geode_txn_release_savepoint.gql\ndone\necho \"SAVEPOINT sp1;\" >>\
      \ /tmp/geode_txn_release_savepoint.gql\n\nfor i in {301..600}; do\n  echo \"\
      CREATE (n:ReleaseSP {id: $i, description: 'Data after savepoint.'});\" >> /tmp/geode_txn_release_savepoint.gql\n\
      done\necho \"RELEASE SAVEPOINT sp1;\" >> /tmp/geode_txn_release_savepoint.gql\n\
      \nfor i in {601..900}; do\n  echo \"CREATE (n:ReleaseSP {id: $i, description:\
      \ 'Data after release.'});\" >> /tmp/geode_txn_release_savepoint.gql\ndone\n\
      echo \"COMMIT;\" >> /tmp/geode_txn_release_savepoint.gql\n"
  args:
  - query
  - --insecure
  - --file
  - /tmp/geode_txn_release_savepoint.gql
  expect:
    exit_code: 0
  verify:
  - args:
    - query
    - --insecure
    - USE GRAPH txn_advanced_test; MATCH (n:ReleaseSP) RETURN count(n) AS cnt
    expect:
      stdout_contains:
      - '900'
  cleanup:
  - - query
    - --insecure
    - USE GRAPH txn_advanced_test; MATCH (n:ReleaseSP) DELETE n
  tags:
  - transaction
  - savepoint
  - release
  - chunked
- name: txn-concurrent-read-chunked
  description: Test read visibility during chunked transaction (if isolation supported)
  setup:
    script: "#!/bin/bash\n# Create baseline data\ncat > /tmp/geode_txn_baseline.gql\
      \ << 'EOF'\nUSE GRAPH txn_advanced_test;\nCREATE (n:IsolationTest {id: 0, value:\
      \ 'baseline'});\nEOF\n# Main transaction file\ncat > /tmp/geode_txn_isolation.gql\
      \ << 'EOF'\nUSE GRAPH txn_advanced_test;\nSTART TRANSACTION;\nEOF\nfor i in\
      \ {1..800}; do\n  echo \"CREATE (n:IsolationTest {id: $i, value: 'in-transaction',\
      \ description: 'Data created within transaction.'});\" >> /tmp/geode_txn_isolation.gql\n\
      done\n# Add a deliberate delay comment to simulate long transaction\necho \"\
      -- Long running transaction\" >> /tmp/geode_txn_isolation.gql\necho \"COMMIT;\"\
      \ >> /tmp/geode_txn_isolation.gql\n"
  args:
  - query
  - --insecure
  - --file
  - /tmp/geode_txn_baseline.gql
  expect:
    exit_code: 0
  verify:
  - args:
    - query
    - --insecure
    - --file
    - /tmp/geode_txn_isolation.gql
    expect:
      exit_code: 0
  - args:
    - query
    - --insecure
    - USE GRAPH txn_advanced_test; MATCH (n:IsolationTest) RETURN count(n) AS cnt
    expect:
      stdout_contains:
      - '801'
  cleanup:
  - - query
    - --insecure
    - USE GRAPH txn_advanced_test; MATCH (n:IsolationTest) DELETE n
  tags:
  - transaction
  - isolation
  - chunked
- name: txn-very-long-transaction
  description: Test very long transaction across many chunks (stress test)
  skip: true
  setup:
    script: "#!/bin/bash\ncat > /tmp/geode_txn_very_long.gql << 'EOF'\nUSE GRAPH txn_advanced_test;\n\
      START TRANSACTION;\nEOF\n# Create 10000 statements to test transaction limits\n\
      for i in {1..10000}; do\n  echo \"CREATE (n:LongTxn {id: $i, description: 'Very\
      \ long transaction test.'});\" >> /tmp/geode_txn_very_long.gql\ndone\necho \"\
      COMMIT;\" >> /tmp/geode_txn_very_long.gql\n"
  args:
  - query
  - --insecure
  - --file
  - /tmp/geode_txn_very_long.gql
  expect:
    exit_code: 0
  verify:
  - args:
    - query
    - --insecure
    - USE GRAPH txn_advanced_test; MATCH (n:LongTxn) RETURN count(n) AS cnt
    expect:
      stdout_contains:
      - '10000'
  cleanup:
  - - query
    - --insecure
    - USE GRAPH txn_advanced_test; MATCH (n:LongTxn) DELETE n
  tags:
  - transaction
  - stress
  - chunked
- name: txn-graph-switching-within-transaction
  description: Test if USE GRAPH within transaction is allowed/works correctly
  setup:
    script: "#!/bin/bash\ncat > /tmp/geode_txn_graph_switch.gql << 'EOF'\nCREATE GRAPH\
      \ IF NOT EXISTS txn_graph_a;\nCREATE GRAPH IF NOT EXISTS txn_graph_b;\nUSE GRAPH\
      \ txn_graph_a;\nSTART TRANSACTION;\nEOF\nfor i in {1..300}; do\n  echo \"CREATE\
      \ (n:GraphA {id: $i, description: 'Data in graph A within transaction.'});\"\
      \ >> /tmp/geode_txn_graph_switch.gql\ndone\n# Try to switch graphs mid-transaction\
      \ (may not be allowed)\necho \"USE GRAPH txn_graph_b;\" >> /tmp/geode_txn_graph_switch.gql\n\
      for i in {1..300}; do\n  echo \"CREATE (n:GraphB {id: $i, description: 'Data\
      \ in graph B within transaction.'});\" >> /tmp/geode_txn_graph_switch.gql\n\
      done\necho \"COMMIT;\" >> /tmp/geode_txn_graph_switch.gql\n"
  args:
  - query
  - --insecure
  - --file
  - /tmp/geode_txn_graph_switch.gql
  expect:
    exit_code:
    - 0
    - 1
  verify:
  - args:
    - query
    - --insecure
    - USE GRAPH txn_graph_a; MATCH (n:GraphA) RETURN count(n) AS cnt
    expect:
      exit_code: 0
  - args:
    - query
    - --insecure
    - USE GRAPH txn_graph_b; MATCH (n:GraphB) RETURN count(n) AS cnt
    expect:
      exit_code: 0
  cleanup:
  - - query
    - --insecure
    - USE GRAPH txn_graph_a; MATCH (n:GraphA) DELETE n
  - - query
    - --insecure
    - USE GRAPH txn_graph_b; MATCH (n:GraphB) DELETE n
  - - query
    - --insecure
    - DROP GRAPH IF EXISTS txn_graph_a
  - - query
    - --insecure
    - DROP GRAPH IF EXISTS txn_graph_b
  tags:
  - transaction
  - graph-switching
  - chunked
- name: txn-atomicity-all-or-nothing-large
  description: Verify all-or-nothing semantics with very large transaction
  skip: true
  setup:
    script: "#!/bin/bash\ncat > /tmp/geode_txn_atomicity.gql << 'EOF'\nUSE GRAPH txn_advanced_test;\n\
      START TRANSACTION;\nEOF\nfor i in {1..2000}; do\n  echo \"CREATE (n:AtomicTest\
      \ {id: $i, value: $i, description: 'Atomicity test data.'});\" >> /tmp/geode_txn_atomicity.gql\n\
      done\n# Add constraint that might fail at the very end\necho \"CREATE (n:AtomicTest\
      \ {id: 2001, value: 2001, constraint_test: true});\" >> /tmp/geode_txn_atomicity.gql\n\
      echo \"COMMIT;\" >> /tmp/geode_txn_atomicity.gql\n"
  args:
  - query
  - --insecure
  - --file
  - /tmp/geode_txn_atomicity.gql
  expect:
    exit_code: 0
  verify:
  - args:
    - query
    - --insecure
    - USE GRAPH txn_advanced_test; MATCH (n:AtomicTest) RETURN count(n) AS cnt
    expect:
      stdout_contains:
      - '2001'
  cleanup:
  - - query
    - --insecure
    - USE GRAPH txn_advanced_test; MATCH (n:AtomicTest) DELETE n
  tags:
  - transaction
  - atomicity
  - chunked
- name: txn-rollback-after-many-chunks
  description: Test rollback works correctly after data spans many chunks
  skip: true
  setup:
    script: "#!/bin/bash\ncat > /tmp/geode_txn_rollback_many.gql << 'EOF'\nUSE GRAPH\
      \ txn_advanced_test;\nSTART TRANSACTION;\nEOF\nfor i in {1..3000}; do\n  echo\
      \ \"CREATE (n:RollbackMany {id: $i, data: 'should-not-persist', description:\
      \ 'Data that should be rolled back.'});\" >> /tmp/geode_txn_rollback_many.gql\n\
      done\necho \"ROLLBACK;\" >> /tmp/geode_txn_rollback_many.gql\n"
  args:
  - query
  - --insecure
  - --file
  - /tmp/geode_txn_rollback_many.gql
  expect:
    exit_code: 0
  verify:
  - args:
    - query
    - --insecure
    - USE GRAPH txn_advanced_test; MATCH (n:RollbackMany) RETURN count(n) AS cnt
    expect:
      stdout_contains:
      - '0'
  tags:
  - transaction
  - rollback
  - chunked
- name: txn-state-consistency-across-chunks
  description: Verify transaction state remains consistent across all chunks
  skip: true
  setup:
    script: "#!/bin/bash\ncat > /tmp/geode_txn_state_consistency.gql << 'EOF'\nUSE\
      \ GRAPH txn_advanced_test;\nSTART TRANSACTION;\nEOF\n# Create data with dependencies\
      \ to test consistency\nfor i in {1..500}; do\n  echo \"CREATE (n:StateTest {id:\
      \ $i, seq: $i, description: 'State consistency test.'});\" >> /tmp/geode_txn_state_consistency.gql\n\
      done\n# Update all nodes to verify state is maintained\nfor i in {1..500}; do\n\
      \  echo \"MATCH (n:StateTest {id: $i}) SET n.updated = true, n.update_seq =\
      \ $i;\" >> /tmp/geode_txn_state_consistency.gql\ndone\n# Verify updates within\
      \ transaction\nfor i in {1..100}; do\n  echo \"MATCH (n:StateTest {id: $i, updated:\
      \ true}) SET n.verified = true;\" >> /tmp/geode_txn_state_consistency.gql\n\
      done\necho \"COMMIT;\" >> /tmp/geode_txn_state_consistency.gql\n"
  args:
  - query
  - --insecure
  - --file
  - /tmp/geode_txn_state_consistency.gql
  expect:
    exit_code: 0
  verify:
  - args:
    - query
    - --insecure
    - USE GRAPH txn_advanced_test; MATCH (n:StateTest) RETURN count(n) AS cnt
    expect:
      stdout_contains:
      - '500'
  - args:
    - query
    - --insecure
    - 'USE GRAPH txn_advanced_test; MATCH (n:StateTest {updated: true}) RETURN count(n)
      AS cnt'
    expect:
      stdout_contains:
      - '500'
  - args:
    - query
    - --insecure
    - 'USE GRAPH txn_advanced_test; MATCH (n:StateTest {verified: true}) RETURN count(n)
      AS cnt'
    expect:
      stdout_contains:
      - '100'
  cleanup:
  - - query
    - --insecure
    - USE GRAPH txn_advanced_test; MATCH (n:StateTest) DELETE n
  tags:
  - transaction
  - state
  - consistency
  - chunked
- name: txn-mixed-auto-and-explicit
  description: Test mixing auto-commit statements with explicit transactions in large
    file
  skip: true
  setup:
    script: "#!/bin/bash\ncat > /tmp/geode_txn_mixed_mode.gql << 'EOF'\nUSE GRAPH\
      \ txn_advanced_test;\nEOF\n# Auto-commit statements\nfor i in {1..200}; do\n\
      \  echo \"CREATE (n:MixedAuto {id: $i, mode: 'auto', description: 'Auto-commit\
      \ mode data.'});\" >> /tmp/geode_txn_mixed_mode.gql\ndone\n\n# Explicit transaction\n\
      echo \"START TRANSACTION;\" >> /tmp/geode_txn_mixed_mode.gql\nfor i in {1..300};\
      \ do\n  echo \"CREATE (n:MixedExplicit {id: $i, mode: 'explicit', description:\
      \ 'Explicit transaction data.'});\" >> /tmp/geode_txn_mixed_mode.gql\ndone\n\
      echo \"COMMIT;\" >> /tmp/geode_txn_mixed_mode.gql\n\n# More auto-commit\nfor\
      \ i in {201..400}; do\n  echo \"CREATE (n:MixedAuto {id: $i, mode: 'auto', description:\
      \ 'More auto-commit data.'});\" >> /tmp/geode_txn_mixed_mode.gql\ndone\n"
  args:
  - query
  - --insecure
  - --file
  - /tmp/geode_txn_mixed_mode.gql
  expect:
    exit_code: 0
  verify:
  - args:
    - query
    - --insecure
    - USE GRAPH txn_advanced_test; MATCH (n:MixedAuto) RETURN count(n) AS cnt
    expect:
      stdout_contains:
      - '400'
  - args:
    - query
    - --insecure
    - USE GRAPH txn_advanced_test; MATCH (n:MixedExplicit) RETURN count(n) AS cnt
    expect:
      stdout_contains:
      - '300'
  cleanup:
  - - query
    - --insecure
    - USE GRAPH txn_advanced_test; MATCH (n) WHERE n:MixedAuto OR n:MixedExplicit
      DELETE n
  tags:
  - transaction
  - mixed-mode
  - chunked
- name: txn-continue-after-failed-transaction
  description: Test that new transactions can start after a failed transaction in
    chunked file
  setup:
    script: "#!/bin/bash\ncat > /tmp/geode_txn_recovery.gql << 'EOF'\nUSE GRAPH txn_advanced_test;\n\
      EOF\n# First transaction - will fail\necho \"START TRANSACTION;\" >> /tmp/geode_txn_recovery.gql\n\
      for i in {1..200}; do\n  echo \"CREATE (n:RecoveryFail {id: $i, description:\
      \ 'Should not persist.'});\" >> /tmp/geode_txn_recovery.gql\ndone\necho \"CREATE\
      \ (n:BadNode {id: SYNTAX ERROR});\" >> /tmp/geode_txn_recovery.gql\necho \"\
      COMMIT;\" >> /tmp/geode_txn_recovery.gql\n\n# Second transaction - should succeed\n\
      echo \"START TRANSACTION;\" >> /tmp/geode_txn_recovery.gql\nfor i in {1..300};\
      \ do\n  echo \"CREATE (n:RecoverySuccess {id: $i, description: 'Should persist\
      \ after recovery.'});\" >> /tmp/geode_txn_recovery.gql\ndone\necho \"COMMIT;\"\
      \ >> /tmp/geode_txn_recovery.gql\n"
  args:
  - query
  - --insecure
  - --file
  - /tmp/geode_txn_recovery.gql
  expect:
    exit_code:
    - 0
    - 1
  verify:
  - args:
    - query
    - --insecure
    - USE GRAPH txn_advanced_test; MATCH (n:RecoveryFail) RETURN count(n) AS cnt
    expect:
      stdout_contains:
      - '0'
  - args:
    - query
    - --insecure
    - USE GRAPH txn_advanced_test; MATCH (n:RecoverySuccess) RETURN count(n) AS cnt
    expect:
      exit_code: 0
  cleanup:
  - - query
    - --insecure
    - USE GRAPH txn_advanced_test; MATCH (n) WHERE n:RecoveryFail OR n:RecoverySuccess
      DELETE n
  tags:
  - transaction
  - error-recovery
  - chunked
- name: cleanup-advanced-txn-graph
  description: Drop advanced transaction test graph
  args:
  - query
  - --insecure
  - DROP GRAPH IF EXISTS txn_advanced_test
  expect:
    exit_code: 0
  tags:
  - cleanup
- name: cleanup-advanced-temp-files
  description: 'Note: Temporary files will be cleaned up by OS'
  skip: true
  args:
  - --help
  tags:
  - cleanup
