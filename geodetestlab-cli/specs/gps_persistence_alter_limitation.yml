version: '1.0'
name: GPS ALTER POLICY persists across restart (GAP-0858)
description: |
  GAP-0858 (landed 2026-06-09) made ALTER POLICY durable: the
  WriteThroughHooks struct on policy_catalog.zig now carries an `alter`
  hook that write-throughs the altered policy state to __geode_security,
  and the catalog is hydrated from that store at startup. An ALTER POLICY
  ... SET ENABLED false now SURVIVES a server restart.

  Contract evidence (geode repo): src/execution.zig:2255-2278,
  src/security/policy_catalog.zig:242-246,
  tests/test_gap0858_alter_policy_persist.zig, docs/GQL_AUTH_DDL.md.

  This is a SECURITY IMPROVEMENT over the old Phase 7 behaviour, where the
  ALTER lived only in memory and a write-granting policy silently
  re-enabled itself on restart (a fail-open footgun). This spec now PINS
  the durable, fail-closed behaviour.

  PHASE 1 (pre-restart):
  - Create alice (readonly)
  - Create universal `true` policy granting WRITE → alice can write
  - ALTER POLICY ... SET ENABLED false → alice denied

  RESTART

  PHASE 2 (post-restart): the policy is hydrated with ENABLED=false (its
  persisted state from the ALTER's write-through). alice REMAINS denied —
  the disabled state survived restart.

  CANARY: REQ=GAP-0858; FEATURE="GPS ALTER POLICY"; ASPECT=PersistenceAcrossRestart; STATUS=TESTED; OWNER=security; UPDATED=2026-06-12
cli:
  binary: ./zig-out/bin/geode
  working_dir:
  env:
    GEODE_LOG_LEVEL: warn
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 60000
    cleanup: false
    args: [--log-level, warn]
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 30000
    format: json
secrets:
  admin_password:
    source: env
    key: GEODE_ADMIN_PASSWORD
    required: false
    default: GeodeTestPassword123!
invariants:
- type: server_running
fuzz:
  enabled: false
tests:
  # ============================================================================
  # PHASE 1
  # ============================================================================
- name: alterlim-preflight
  args: [query, -U, geode, -P, '${secret:admin_password}', '-']
  stdin: |
    DROP POLICY IF EXISTS alterlim_global;
    DROP USER IF EXISTS alterlim_alice;
  expect: {exit_code: 0}
  tags: [persistence, alter, setup]

- name: alterlim-create-alice
  args: [query, -U, geode, -P, '${secret:admin_password}', CREATE USER alterlim_alice SET PASSWORD 'alterlim-pass-1234 Strong Horse Battery' ROLE readonly]
  expect: {exit_code: 0}
  tags: [persistence, alter, setup]

- name: alterlim-create-policy
  description: Create the universal policy granting WRITE.
  args: [query, -U, geode, -P, '${secret:admin_password}', CREATE POLICY alterlim_global ON GRAPH * FOR WRITE USING true]
  expect:
    exit_code: 0
    stdout_contains: [Policy created]
  tags: [persistence, alter, phase1]

- name: alterlim-alice-write-pre-alter
  description: POSITIVE — alice can write while the policy is enabled.
  args: [query, -U, alterlim_alice, -P, "alterlim-pass-1234 Strong Horse Battery", '-']
  stdin: 'CREATE (n:AlterLimPre {v: 1}) RETURN n'
  expect:
    exit_code: 0
    stdout_contains: [AlterLimPre]
    stdout_not_contains: ['42501']
  tags: [persistence, alter, phase1, positive]

- name: alterlim-disable-policy
  description: ALTER POLICY SET ENABLED false (write-through to __geode_security — persists across restart, GAP-0858).
  args: [query, -U, geode, -P, '${secret:admin_password}', ALTER POLICY alterlim_global SET ENABLED false]
  expect:
    exit_code: 0
    stdout_contains: [Policy altered]
  tags: [persistence, alter, phase1]

- name: alterlim-alice-denied-after-alter
  description: |
    NEGATIVE — alice is denied AFTER ALTER (the disabled policy now
    fails closed within the same server lifetime, before restart).
  args: [query, -U, alterlim_alice, -P, "alterlim-pass-1234 Strong Horse Battery", '-']
  stdin: 'CREATE (n:AlterLimMid {v: 1}) RETURN n'
  expect:
    exit_code: 0
    stdout_contains: ['42501', Permission denied]
  tags: [persistence, alter, phase1, negative]

  # ============================================================================
  # RESTART
  # ============================================================================
- name: alterlim-restart-checkpoint
  description: |
    Stop + restart the server. The ALTER's `enabled=false` flip was
    written through to __geode_security (GAP-0858), so the catalog
    re-hydrates with enabled=false — the disabled state survives.
  type: bash
  command: echo 'ALTER POLICY persistence restart checkpoint'
  restart_server: true
  expect:
    exit_code: 0
  tags: [persistence, alter, restart]

  # ============================================================================
  # PHASE 2: the ALTER persisted (GAP-0858), so the policy re-hydrates
  # DISABLED and alice STAYS denied across restart. This is the durable,
  # fail-closed behaviour — a previously write-granting policy that was
  # disabled does NOT silently re-enable itself on restart.
  # ============================================================================
- name: alterlim-alice-denied-post-restart
  description: |
    NEGATIVE (GAP-0858) — alice REMAINS denied post-restart. The ALTER's
    `enabled=false` was written through to __geode_security and the
    hydrated policy is DISABLED, so the write is refused (42501). This
    asserts ALTER POLICY durability across the restart boundary.
  args: [query, -U, alterlim_alice, -P, "alterlim-pass-1234 Strong Horse Battery", '-']
  stdin: 'CREATE (n:AlterLimPost {v: 1}) RETURN n'
  expect:
    exit_code: 0
    stdout_contains: ['42501', Permission denied]
  tags: [persistence, alter, phase2, negative]

  # ============================================================================
  # POSITIVE follow-up: re-issuing the ALTER post-restart is an idempotent
  # no-op flip (the policy is already disabled) and must still succeed,
  # proving the ALTER procedure path is restored from policy_catalog
  # hydration and behaves correctly after restart.
  # ============================================================================
- name: alterlim-disable-again-post-restart
  description: |
    POSITIVE — ALTER POLICY works after restart (the procedure path is
    restored from policy_catalog hydration). The policy is already
    disabled, so this is an idempotent re-disable that must still succeed.
  args: [query, -U, geode, -P, '${secret:admin_password}', ALTER POLICY alterlim_global SET ENABLED false]
  expect:
    exit_code: 0
    stdout_contains: [Policy altered]
  tags: [persistence, alter, phase2]

- name: alterlim-alice-denied-again-after-second-alter
  description: |
    NEGATIVE — alice stays denied after the idempotent re-disable,
    confirming the disabled policy continues to fail closed across the
    restart boundary and the re-ALTER did not re-open the policy.
  args: [query, -U, alterlim_alice, -P, "alterlim-pass-1234 Strong Horse Battery", '-']
  stdin: 'CREATE (n:AlterLimPost2 {v: 1}) RETURN n'
  expect:
    exit_code: 0
    stdout_contains: ['42501', Permission denied]
  tags: [persistence, alter, phase2, negative]

  # ============================================================================
  # TEARDOWN
  # ============================================================================
- name: alterlim-cleanup
  args: [query, -U, geode, -P, '${secret:admin_password}', '-']
  stdin: |
    DROP POLICY IF EXISTS alterlim_global;
    DROP USER IF EXISTS alterlim_alice;
    MATCH (n:AlterLimPre) DELETE n;
    MATCH (n:AlterLimPost) DELETE n;
  expect: {exit_code: 0}
  tags: [persistence, alter, teardown]

tags:
- persistence
- alter_policy
- gap-0858
- restart
- security
