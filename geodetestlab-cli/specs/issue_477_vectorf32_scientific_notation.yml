version: '1.0'
name: 'Issue #477: vectorf32() scientific notation support'
description: Verify vectorf32() accepts IEEE 754 scientific notation float literals
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port: null
    data_dir: null
    startup_timeout_ms: 60000
    cleanup: true
    args:
    - --log-level
    - warn
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 30000
    tls_verify: false
    format: json
tests:
- name: sci-notation-standalone
  description: Scientific notation as standalone expression
  args:
  - query
  - '-'
  stdin: RETURN 1.23e-7 AS v
  expect:
    exit_code: 0
    stdout_contains:
    - v
  tags:
  - parser
  - issue-477
- name: sci-notation-positive-exponent
  description: Positive exponent in standalone expression
  args:
  - query
  - '-'
  stdin: RETURN 1.5e2 AS v
  expect:
    exit_code: 0
    stdout_contains:
    - '150'
  tags:
  - parser
  - issue-477
- name: vectorf32-array-sci-notation
  description: vectorf32 array literal with scientific notation
  args:
  - query
  - '-'
  stdin: RETURN vectorf32([1.23e-7, 0.5, 0.3]) AS v
  expect:
    exit_code: 0
    stdout_contains:
    - v
  tags:
  - vector
  - issue-477
- name: vectorf32-negative-exponent
  description: vectorf32 with negative exponent values (sentence-transformer output)
  args:
  - query
  - '-'
  stdin: RETURN vectorf32([1.23e-7, -4.85e-33, 0.5]) AS v
  expect:
    exit_code: 0
    stdout_contains:
    - v
  tags:
  - vector
  - issue-477
- name: vectorf32-string-sci-notation
  description: vectorf32 string literal with scientific notation
  args:
  - query
  - '-'
  stdin: "RETURN vectorf32('[1.23e-7, -4.85e-10, 0.5]') AS v"
  expect:
    exit_code: 0
    stdout_contains:
    - v
  tags:
  - vector
  - issue-477
- name: vectorf32-large-positive-exponent
  description: vectorf32 with large positive exponent values
  args:
  - query
  - '-'
  stdin: RETURN vectorf32([1.5e2, 2.5e3, 3.5e1]) AS v
  expect:
    exit_code: 0
    stdout_contains:
    - v
  tags:
  - vector
  - issue-477
- name: vectorf32-cosine-sci-notation
  description: vector_cosine with scientific notation values
  args:
  - query
  - '-'
  stdin: >
    RETURN vector_cosine(
      vectorf32([1.23e-7, -4.85e-10, 0.5]),
      vectorf32([2.34e-7, -5.96e-10, 0.6])
    ) AS score
  expect:
    exit_code: 0
    stdout_contains:
    - score
  tags:
  - vector
  - issue-477
- name: vectorf32-mixed-notation
  description: vectorf32 mixing standard and scientific notation
  args:
  - query
  - '-'
  stdin: RETURN vectorf32([0.1, 2.5e-3, 100.0, 1e-5]) AS v
  expect:
    exit_code: 0
    stdout_contains:
    - v
  tags:
  - vector
  - issue-477
- name: vectorf32-store-and-retrieve-sci
  description: Store vector with scientific notation and retrieve it
  args:
  - query
  - '-'
  stdin: >
    CREATE (n:SciTest477 {name: 'embedding_node', vec: vectorf32([1.23e-7, -4.85e-10, 0.5])})
    RETURN n.name AS name
  expect:
    exit_code: 0
    stdout_contains:
    - embedding_node
  tags:
  - vector
  - issue-477
  - setup
- name: vectorf32-similarity-with-sci-stored
  description: Compute cosine similarity against stored vector with scientific notation values
  args:
  - query
  - '-'
  stdin: >
    MATCH (n:SciTest477)
    RETURN n.name AS name, vector_cosine(n.vec, vectorf32([1.23e-7, -4.85e-10, 0.5])) AS score
  expect:
    exit_code: 0
    stdout_contains:
    - name
    - score
  tags:
  - vector
  - issue-477
