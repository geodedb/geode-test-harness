version: '1.0'
name: 'GAP-0323: QUIC PollSync Stress'
description: |
  CANARY: REQ=REQ-TRANSPORT-QUIC-POLLSYNC-001; FEATURE="QUIC PollSync Stress"; ASPECT=ConcurrentStreamStability; STATUS=TESTED; OWNER=transport; UPDATED=2026-05-21

  Stress-tests the QUIC PollSync machinery by opening many concurrent query
  streams against a single server.  Validates that the server remains stable
  (no SIGABRT, no panic) and that every stream either completes or cancels
  cleanly within a bounded window.

  Strategy:
  - Phase 1: Warm-up — 10 sequential queries verify baseline connectivity.
  - Phase 2: Medium concurrency — 20 parallel short queries via `parallel: true`.
  - Phase 3: Shell-based burst — 50 background subprocesses fired from bash,
    all waited, server health probe asserted after.
  - Phase 4: Post-stress data-integrity check — a mutation + verification
    confirms the server did not corrupt state under load.
  - Cleanup.

  NOTE: "1000 concurrent" is out of scope for the in-process harness runner
  (TIME_BUDGET 300 s, process-per-query model).  50 concurrent bash
  sub-processes stress the PollSync ring sufficiently for a black-box
  integration test; a dedicated load-test harness (e.g. `make loadtest`)
  covers the 1000-stream case.

cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 30000
    cleanup: true
    args:
    - --log-level
    - info
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 60000
    tls_verify: false
    format: json

invariants:
- type: server_running

tests:

# ---------------------------------------------------------------------------
# Phase 1: Warm-up — sequential baseline
# ---------------------------------------------------------------------------

- name: 'GAP-0323-WU-001: warm-up baseline query'
  description: Confirm server is reachable before stress begins
  args:
  - query
  - RETURN 'gap0323-canary' AS canary
  expect:
    exit_code: 0
    stdout_contains:
    - gap0323-canary
  tags:
  - gap-0323
  - quic
  - warmup

- name: 'GAP-0323-WU-002: sequential rapid queries x10'
  description: 10 rapid sequential queries to exercise PollSync baseline throughput
  type: bash
  command: |
    PASS=0; FAIL=0
    for i in $(seq 1 10); do
      OUT=$(geode query --server "${GEODE_SERVER_ADDRESS}" ${GEODE_CLIENT_TLS} \
            -U geode -P "${GEODE_ADMIN_PASSWORD:-GeodeTestPassword123!}" \
            "RETURN $i AS seq_id" 2>&1)
      echo "$OUT" | grep -q "seq_id" && PASS=$((PASS+1)) || FAIL=$((FAIL+1))
    done
    echo "sequential_pass=$PASS sequential_fail=$FAIL"
    [ "$FAIL" -eq 0 ]
  expect:
    exit_code: 0
    stdout_contains:
    - sequential_pass=10
    - sequential_fail=0
  tags:
  - gap-0323
  - quic
  - sequential

# ---------------------------------------------------------------------------
# Phase 2: Medium concurrency — 20 parallel streams (harness-native)
# ---------------------------------------------------------------------------

- name: 'GAP-0323-CONC-001: 20 concurrent RETURN queries'
  description: |
    Fire 20 parallel query instances via bash background jobs.
    Each writes a distinct label so we can verify all 20 completed.
  type: bash
  command: |
    TMPDIR=$(mktemp -d)
    PIDS=""
    for i in $(seq 1 20); do
      (
        OUT=$(geode query --server "${GEODE_SERVER_ADDRESS}" ${GEODE_CLIENT_TLS} \
              -U geode -P "${GEODE_ADMIN_PASSWORD:-GeodeTestPassword123!}" \
              "RETURN $i AS slot" 2>&1)
        echo "$OUT" | grep -q '"slot"' && echo "ok_$i" > "${TMPDIR}/${i}.result" \
                                       || echo "fail_$i" > "${TMPDIR}/${i}.result"
      ) &
      PIDS="$PIDS $!"
    done
    wait $PIDS
    OK=$(ls "${TMPDIR}"/*.result 2>/dev/null | xargs grep -l "^ok_" | wc -l)
    FAIL=$(ls "${TMPDIR}"/*.result 2>/dev/null | xargs grep -l "^fail_" | wc -l)
    rm -rf "${TMPDIR}"
    echo "concurrent_ok=$OK concurrent_fail=$FAIL"
    [ "$FAIL" -eq 0 ]
  timeout_ms: 60000
  expect:
    exit_code: 0
    stdout_contains:
    - concurrent_ok=20
    - concurrent_fail=0
  tags:
  - gap-0323
  - quic
  - concurrent

# ---------------------------------------------------------------------------
# Phase 3: Burst — 50 background subprocesses
# ---------------------------------------------------------------------------

- name: 'GAP-0323-BURST-001: 50-stream burst + server-alive probe'
  description: |
    Fire 50 concurrent queries via bash background jobs, wait for all, then
    immediately verify the server is still answering queries (no panic/SIGABRT).
  type: bash
  command: |
    TMPDIR=$(mktemp -d)
    for i in $(seq 1 50); do
      (
        geode query --server "${GEODE_SERVER_ADDRESS}" ${GEODE_CLIENT_TLS} \
              -U geode -P "${GEODE_ADMIN_PASSWORD:-GeodeTestPassword123!}" \
              --timeout 20 \
              "RETURN $i AS burst_id" >/dev/null 2>&1 \
          && echo "ok" > "${TMPDIR}/${i}.r" \
          || echo "err" > "${TMPDIR}/${i}.r"
      ) &
    done
    wait
    OK=$(grep -rl "^ok$" "${TMPDIR}" 2>/dev/null | wc -l)
    ERR=$(grep -rl "^err$" "${TMPDIR}" 2>/dev/null | wc -l)
    rm -rf "${TMPDIR}"
    # Server health probe
    HEALTH=$(geode query --server "${GEODE_SERVER_ADDRESS}" ${GEODE_CLIENT_TLS} \
              -U geode -P "${GEODE_ADMIN_PASSWORD:-GeodeTestPassword123!}" \
              "RETURN 'server_alive' AS status" 2>&1)
    echo "$HEALTH" | grep -q "server_alive" && ALIVE=1 || ALIVE=0
    echo "burst_ok=$OK burst_err=$ERR server_alive=$ALIVE"
    # Require server alive; allow up to 5 stream failures (transient under load)
    [ "$ALIVE" -eq 1 ] && [ "$ERR" -le 5 ]
  timeout_ms: 120000
  expect:
    exit_code: 0
    stdout_contains:
    - server_alive=1
  tags:
  - gap-0323
  - quic
  - burst
  - stress

# ---------------------------------------------------------------------------
# Phase 4: Post-stress data integrity
# ---------------------------------------------------------------------------

- name: 'GAP-0323-INTEG-001: post-stress CREATE survives'
  description: Verify mutations still work after PollSync burst
  args:
  - query
  - "CREATE (n:PollSyncProbe {run: 'gap0323', ts: current_timestamp()}) RETURN n.run AS run"
  expect:
    exit_code: 0
    stdout_contains:
    - gap0323
  tags:
  - gap-0323
  - quic
  - integrity

- name: 'GAP-0323-INTEG-002: post-stress MATCH reads back'
  description: Read back the node created under post-stress conditions
  args:
  - query
  - "MATCH (n:PollSyncProbe {run: 'gap0323'}) RETURN count(n) AS probe_count"
  expect:
    exit_code: 0
    stdout_contains:
    - probe_count
  tags:
  - gap-0323
  - quic
  - integrity

# ---------------------------------------------------------------------------
# Cleanup
# ---------------------------------------------------------------------------

- name: 'GAP-0323-CLEANUP-001: remove probe nodes'
  description: Idempotent teardown — remove PollSyncProbe nodes
  args:
  - query
  - "MATCH (n:PollSyncProbe {run: 'gap0323'}) DETACH DELETE n RETURN count(n) AS deleted"
  expect:
    exit_code: 0
  tags:
  - gap-0323
  - cleanup

tags:
- gap-0323
- quic
- transport
- stress
- pollsync
