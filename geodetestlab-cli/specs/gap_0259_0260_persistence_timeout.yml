name: "GAP-0259/0260: QUIC idle timeout and deferred persistence"
description: "Verify configurable idle timeout and deferred write coalescing"
mode: server
server_args: []
tests:
  - name: "GAP-0259-001: serve help shows idle-timeout flag"
    command: "zig-out/bin/geode serve --help"
    expected:
      exit_code: 0
      stdout_contains:
        - "--idle-timeout"

  - name: "GAP-0260-001: serve help shows persist-interval flag"
    command: "zig-out/bin/geode serve --help"
    expected:
      exit_code: 0
      stdout_contains:
        - "--persist-interval"

  - name: "GAP-0260-002: create test graph"
    query: "CREATE GRAPH gap260test"
    expected:
      exit_code: 0

  - name: "GAP-0260-003: bulk INSERT completes without error"
    query: "USE GRAPH gap260test INSERT (a:Node {idx: 1}) INSERT (b:Node {idx: 2}) INSERT (c:Node {idx: 3}) INSERT (d:Node {idx: 4}) INSERT (e:Node {idx: 5})"
    expected:
      exit_code: 0

  - name: "GAP-0260-004: sequential INSERT queries succeed"
    query: "USE GRAPH gap260test INSERT (f:Node {idx: 6})"
    expected:
      exit_code: 0

  - name: "GAP-0260-005: second sequential INSERT"
    query: "USE GRAPH gap260test INSERT (g:Node {idx: 7})"
    expected:
      exit_code: 0

  - name: "GAP-0260-006: third sequential INSERT"
    query: "USE GRAPH gap260test INSERT (h:Node {idx: 8})"
    expected:
      exit_code: 0

  - name: "GAP-0260-007: verify all nodes exist"
    query: "USE GRAPH gap260test MATCH (n:Node) RETURN count(n) AS cnt"
    expected:
      exit_code: 0
      stdout_contains:
        - "cnt"

  - name: "GAP-0260-008: transaction COMMIT persistence"
    query: "USE GRAPH gap260test BEGIN INSERT (t:TxnNode {val: 'committed_data'}) COMMIT"
    expected:
      exit_code: 0

  - name: "GAP-0260-009: verify committed data is readable"
    query: "USE GRAPH gap260test MATCH (t:TxnNode) RETURN t.val"
    expected:
      exit_code: 0
      stdout_contains:
        - "committed_data"

  - name: "GAP-0260-010: cleanup"
    query: "DROP GRAPH gap260test"
    expected:
      exit_code: 0
