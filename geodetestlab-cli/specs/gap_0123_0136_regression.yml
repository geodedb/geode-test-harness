version: '1.0'
name: Gap Analysis Fixes - GAP-0123 to GAP-0136 Regression Tests
description: 'Regression tests for January 2026 gap fixes: CSR property offset, decimal overflow, ORDER BY federation, subquery imports, metadata handling, and statement error messages'
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 30000
    cleanup: true
    args:
    - --log-level
    - error
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 30000
    tls_verify: false
    format: json
setup:
- args:
  - query
  - '-'
  stdin: "CREATE (:DecTest {val: 1.5})\nCREATE (:DecTest {val: 2.5})\nCREATE (:DecTest {val: 3.0})\n"
  expect:
    exit_code: 0
- args:
  - query
  - '-'
  stdin: "CREATE (:AvgTest {val: 10})\nCREATE (:AvgTest {val: 20})\nCREATE (:AvgTest {val: 30})\n"
  expect:
    exit_code: 0
- args:
  - query
  - '-'
  stdin: "CREATE (:BigTest {val: 999999999999})\nCREATE (:BigTest {val: 888888888888})\nCREATE (:BigTest {val: 777777777777})\n"
  expect:
    exit_code: 0
- args:
  - query
  - '-'
  stdin: "CREATE (:OrdTest {val: 3})\nCREATE (:OrdTest {val: 1})\nCREATE (:OrdTest {val: 4})\nCREATE (:OrdTest {val: 5})\nCREATE (:OrdTest {val: 2})\n"
  expect:
    exit_code: 0
- args:
  - query
  - '-'
  stdin: "CREATE (:AggReg {val: 1})\nCREATE (:AggReg {val: 2})\nCREATE (:AggReg {val: 3})\nCREATE (:AggReg {val: 4})\nCREATE (:AggReg {val: 5})\n"
  expect:
    exit_code: 0
tests:
- name: gap-0124-decimal-sum-normal
  description: Decimal SUM aggregation works for normal values
  args:
  - query
  - '-'
  stdin: MATCH (n:DecTest) RETURN sum(n.val) AS total
  expect:
    exit_code: 0
    stdout_contains:
    - total
    - '7'
  tags:
  - gap-0124
  - decimal
  - aggregation
- name: gap-0124-decimal-avg-normal
  description: Decimal AVG aggregation works for normal values
  args:
  - query
  - '-'
  stdin: MATCH (n:AvgTest) RETURN avg(n.val) AS average
  expect:
    exit_code: 0
    stdout_contains:
    - average
    - '20'
  tags:
  - gap-0124
  - decimal
  - aggregation
- name: gap-0124-decimal-large-values
  description: Decimal aggregation handles large values without corruption
  args:
  - query
  - '-'
  stdin: MATCH (n:BigTest) RETURN sum(n.val) AS total
  expect:
    exit_code: 0
    stdout_contains:
    - total
  tags:
  - gap-0124
  - decimal
  - overflow
- name: gap-0125-call-subquery-basic
  description: CALL subquery basic execution
  args:
  - query
  - '-'
  stdin: "WITH 1 AS x\nCALL {\n  RETURN 2 AS y\n}\nRETURN x, y\n"
  expect:
    exit_code: 0
    stdout_contains:
    - x
    - y
  tags:
  - gap-0125
  - subquery
  - call
- name: gap-0125-nested-return
  description: CALL subquery with nested RETURN
  args:
  - query
  - '-'
  stdin: "CALL {\n  RETURN 'nested' AS result\n}\nRETURN result\n"
  expect:
    exit_code: 0
    stdout_contains:
    - result
    - nested
  tags:
  - gap-0125
  - subquery
- name: gap-0130-order-by-asc
  description: ORDER BY ascending works correctly
  args:
  - query
  - '-'
  stdin: MATCH (n:OrdTest) RETURN n.val AS v ORDER BY n.val ASC
  expect:
    exit_code: 0
    stdout_contains:
    - '1'
    - '2'
    - '3'
    - '4'
    - '5'
  tags:
  - gap-0130
  - order-by
- name: gap-0130-order-by-desc
  description: ORDER BY descending works correctly
  args:
  - query
  - '-'
  stdin: MATCH (n:OrdTest) RETURN n.val AS v ORDER BY n.val DESC
  expect:
    exit_code: 0
    stdout_contains:
    - '5'
    - '4'
    - '3'
    - '2'
    - '1'
  tags:
  - gap-0130
  - order-by
- name: gap-0130-order-by-multiple-keys
  description: ORDER BY with multiple keys
  args:
  - query
  - '-'
  stdin: "CREATE (a:Item {category: 'A', value: 2});\nCREATE (b:Item {category: 'A', value: 1});\nCREATE (c:Item {category: 'B', value: 3});\nMATCH (n:Item) RETURN n.category AS cat, n.value AS val ORDER BY cat ASC, val ASC\n"
  expect:
    exit_code: 0
    stdout_contains:
    - cat
    - val
  tags:
  - gap-0130
  - order-by
  - multi-key
- name: gap-0130-order-by-with-limit
  description: ORDER BY with LIMIT for top-K selection
  args:
  - query
  - '-'
  stdin: MATCH (n:OrdTest) RETURN n.val AS v ORDER BY n.val DESC LIMIT 3
  expect:
    exit_code: 0
    stdout_contains:
    - '5'
    - '4'
    - '3'
  tags:
  - gap-0130
  - order-by
  - limit
  - top-k
- name: gap-0134-shell-insecure-warning
  description: Shell with --insecure shows warning
  args:
  - shell
  - --insecure
  - --help
  expect:
    exit_code: 0
  tags:
  - gap-0134
  - shell
  - tls
- name: regression-basic-return
  description: Basic RETURN statement works
  args:
  - query
  - '-'
  stdin: "RETURN 1 AS x, 'hello' AS y, true AS z\n"
  expect:
    exit_code: 0
    stdout_contains:
    - x
    - y
    - z
    - '1'
    - hello
    - 'true'
  tags:
  - regression
  - basic
- name: regression-create-node
  description: CREATE node works
  args:
  - query
  - '-'
  stdin: "CREATE (n:TestGap {id: 123}) RETURN n.id AS id\n"
  expect:
    exit_code: 0
    stdout_contains:
    - id
    - '123'
  tags:
  - regression
  - create
- name: regression-match-return
  description: MATCH and RETURN work together
  args:
  - query
  - '-'
  stdin: "CREATE (a:GapTest {name: 'Alice'});\nCREATE (b:GapTest {name: 'Bob'});\nMATCH (n:GapTest) RETURN n.name AS name ORDER BY name\n"
  expect:
    exit_code: 0
    stdout_contains:
    - Alice
    - Bob
  tags:
  - regression
  - match
- name: regression-aggregation
  description: Aggregation functions work
  args:
  - query
  - '-'
  stdin: MATCH (n:AggReg) RETURN count(n) AS cnt, sum(n.val) AS total, avg(n.val) AS average
  expect:
    exit_code: 0
    stdout_contains:
    - cnt
    - '5'
    - total
    - average
  tags:
  - regression
  - aggregation
- name: regression-where-filter
  description: WHERE filtering works
  args:
  - query
  - '-'
  stdin: "CREATE (a:FilterTest {value: 10});\nCREATE (b:FilterTest {value: 20});\nCREATE (c:FilterTest {value: 30});\nMATCH (n:FilterTest) WHERE n.value > 15 RETURN n.value AS val ORDER BY val\n"
  expect:
    exit_code: 0
    stdout_contains:
    - '20'
    - '30'
  tags:
  - regression
  - where
- name: regression-relationship
  description: Relationship creation and matching works
  args:
  - query
  - '-'
  stdin: "CREATE (a:Person {name: 'Alice'})-[:KNOWS {since: 2020}]->(b:Person {name: 'Bob'});\nMATCH (a:Person)-[r:KNOWS]->(b:Person) RETURN a.name AS `from`, b.name AS to, r.since AS since\n"
  expect:
    exit_code: 0
    stdout_contains:
    - Alice
    - Bob
    - '2020'
  tags:
  - regression
  - relationship
