version: '1.0'
name: SONNY-6271 offline user CLI names the password-policy rule it enforces
description: |
  Ticket: SONNY-6271.
  Bug: `geode user reset-password geode --new-password resetpass12345` answered
  "password does not meet policy requirements (min 8 chars, letters and
  numbers)" although the CLI enforces the unified passphrase policy (20+
  characters, upper and lower case, 3+ words); the message contradicted itself.
  `--generate-password` on reset-password was also refused by that policy.
  Spec proves, against the real `geode user` offline CLI on a bootstrapped data
  directory: each weak password is refused with the exact rule it breaks, the
  stale "min 8 chars" text is gone, the password is never echoed, a compliant
  passphrase is accepted, and `reset-password --generate-password` succeeds.

single_node_only: true  # each step starts its own private geode server / offline CLI: no harness server

cli:
  binary: ./zig-out/bin/geode
  env:
    GEODE_LOG_LEVEL: warn
  server:
    enabled: false
  client:
    timeout_ms: 420000
    tls_verify: false
    format: json

invariants: []

fuzz:
  enabled: false

tests:

- name: sonny6271-weak-passwords-name-the-rule
  description: reset-password and user create refuse weak passwords naming the broken rule, never echoing the password
  type: bash
  command: |
    set -u
    BIN="${GEODE_BINARY:-geode}"
    D=$(mktemp -d); trap 'rm -rf "$D"' EXIT
    GEODE_ADMIN_PASSWORD='Reset Breadcrumb Admin Passphrase' "$BIN" auth init --data-dir "$D" >/dev/null 2>&1 || { echo "FAIL init"; exit 1; }
    check() { # args: expected-rule password-to-try cmd...
      rule="$1"; pw="$2"; shift 2
      OUT=$("$@" 2>&1); RC=$?
      [ "$RC" -ne 0 ] || { echo "FAIL rc=0 for '$rule'"; echo "$OUT"; exit 1; }
      echo "$OUT" | grep -q "password does not meet policy requirements" || { echo "FAIL no policy msg ($rule)"; echo "$OUT"; exit 1; }
      echo "$OUT" | grep -qF "$rule" || { echo "FAIL missing rule '$rule'"; echo "$OUT"; exit 1; }
      echo "$OUT" | grep -q "min 8 chars" && { echo "FAIL stale min 8 text"; exit 1; }
      [ -n "$pw" ] && echo "$OUT" | grep -qF "$pw" && { echo "FAIL password echoed"; echo "$OUT"; exit 1; }
      return 0
    }
    check "Password too short (minimum 20 characters)" resetpass12345 "$BIN" user reset-password geode --new-password resetpass12345 --data-dir "$D"
    check "Password must contain at least one uppercase letter" "correct horse battery staple" "$BIN" user create alice alice@example.com --password "correct horse battery staple" --data-dir "$D"
    check "Password must contain at least one lowercase letter" "CORRECT HORSE BATTERY STAPLE" "$BIN" user create alice alice@example.com --password "CORRECT HORSE BATTERY STAPLE" --data-dir "$D"
    check "Password must be a passphrase with at least 3 words" "Supercalifragilistic" "$BIN" user create alice alice@example.com --password "Supercalifragilistic" --data-dir "$D"
    echo "WEAK_RULES_OK"
  timeout_ms: 420000
  expect:
    exit_code: 0
    stdout_contains: [WEAK_RULES_OK]
  tags: [auth, cli, offline, sonny6271]

- name: sonny6271-compliant-and-generated-accepted
  description: a compliant passphrase resets the admin password; --generate-password is not refused by the passphrase policy
  type: bash
  command: |
    set -u
    BIN="${GEODE_BINARY:-geode}"
    D=$(mktemp -d); trap 'rm -rf "$D"' EXIT
    GEODE_ADMIN_PASSWORD='Reset Breadcrumb Admin Passphrase' "$BIN" auth init --data-dir "$D" >/dev/null 2>&1 || { echo "FAIL init"; exit 1; }
    OUT=$("$BIN" user reset-password geode --new-password "Reset Breadcrumb Test Passphrase" --data-dir "$D" 2>&1); RC=$?
    [ "$RC" -eq 0 ] || { echo "FAIL compliant reset rc=$RC"; echo "$OUT"; exit 1; }
    echo "$OUT" | grep -q "policy requirements" && { echo "FAIL compliant refused"; echo "$OUT"; exit 1; }
    OUT=$("$BIN" user reset-password geode --generate-password --data-dir "$D" 2>&1); RC=$?
    [ "$RC" -eq 0 ] || { echo "FAIL generate rc=$RC"; echo "$OUT"; exit 1; }
    echo "$OUT" | grep -q "Generated password:" || { echo "FAIL no generated password"; echo "$OUT"; exit 1; }
    echo "$OUT" | grep -q "policy requirements" && { echo "FAIL generated refused by policy"; exit 1; }
    echo "ACCEPTED_OK"
  timeout_ms: 420000
  expect:
    exit_code: 0
    stdout_contains: [ACCEPTED_OK]
  tags: [auth, cli, offline, sonny6271]
