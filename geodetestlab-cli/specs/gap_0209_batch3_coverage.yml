name: gap_0209_batch3_coverage
description: "GAP-0209 Batch 3: Test coverage for IMPL markers converted to TESTED"
version: "1.0"
mode: server

tests:
  # WithGroupByAggregation tests
  - name: group-by-basic
    description: "Test basic GROUP BY aggregation"
    command: |
      ./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -
    stdin: |
      MATCH (n:Person) RETURN n.department, count(*) AS cnt GROUP BY n.department
    expected_output:
      contains:
        - "department"
    expected_exit_code: 0

  - name: group-by-having
    description: "Test GROUP BY with HAVING clause"
    command: |
      ./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -
    stdin: |
      MATCH (n:Item) RETURN n.category, sum(n.price) AS total GROUP BY n.category HAVING total > 0
    expected_output:
      contains:
        - "category"
    expected_exit_code: 0

  # StringMinMax tests
  - name: string-min-aggregation
    description: "Test MIN aggregation on strings"
    command: |
      ./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -
    stdin: |
      RETURN min(['zebra', 'apple', 'mango']) AS min_string
    expected_output:
      contains:
        - "min_string"
    expected_exit_code: 0

  - name: string-max-aggregation
    description: "Test MAX aggregation on strings"
    command: |
      ./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -
    stdin: |
      RETURN max(['zebra', 'apple', 'mango']) AS max_string
    expected_output:
      contains:
        - "max_string"
    expected_exit_code: 0

  # DateTimeFunctions tests
  - name: datetime-now
    description: "Test datetime.now() function"
    command: |
      ./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -
    stdin: |
      RETURN datetime() AS current_time
    expected_output:
      contains:
        - "current_time"
    expected_exit_code: 0

  - name: datetime-year-extraction
    description: "Test datetime year extraction"
    command: |
      ./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -
    stdin: |
      RETURN datetime('2024-06-15').year AS year
    expected_output:
      contains:
        - "year"
    expected_exit_code: 0

  # TrigonometricFunctions tests
  - name: trig-sin-function
    description: "Test sin() trigonometric function"
    command: |
      ./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -
    stdin: |
      RETURN sin(0) AS sin_zero, sin(3.14159/2) AS sin_half_pi
    expected_output:
      contains:
        - "sin_zero"
    expected_exit_code: 0

  - name: trig-cos-function
    description: "Test cos() trigonometric function"
    command: |
      ./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -
    stdin: |
      RETURN cos(0) AS cos_zero, cos(3.14159) AS cos_pi
    expected_output:
      contains:
        - "cos_zero"
    expected_exit_code: 0

  # StringFunctions tests
  - name: string-upper-lower
    description: "Test string case functions"
    command: |
      ./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -
    stdin: |
      RETURN toUpper('hello') AS upper, toLower('WORLD') AS lower
    expected_output:
      contains:
        - "upper"
        - "lower"
    expected_exit_code: 0

  - name: string-trim-functions
    description: "Test string trim functions"
    command: |
      ./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -
    stdin: |
      RETURN trim('  hello  ') AS trimmed, ltrim('  left') AS left_trim
    expected_output:
      contains:
        - "trimmed"
    expected_exit_code: 0

  # ExistsSubquery tests
  - name: exists-subquery-basic
    description: "Test EXISTS subquery"
    command: |
      ./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -
    stdin: |
      MATCH (n:Person) WHERE EXISTS { MATCH (n)-[:KNOWS]->(:Person) } RETURN n.name
    expected_output:
      contains:
        - "name"
    expected_exit_code: 0

  # ZeroLengthPaths tests
  - name: zero-length-path
    description: "Test zero-length path patterns"
    command: |
      ./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -
    stdin: |
      MATCH (n)-[*0..1]-(m) RETURN count(*) AS path_count
    expected_output:
      contains:
        - "path_count"
    expected_exit_code: 0

  # DateIntervalArithmetic tests
  - name: date-interval-add
    description: "Test date interval arithmetic"
    command: |
      ./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -
    stdin: |
      RETURN date('2024-01-15') + duration('P1M') AS next_month
    expected_output:
      contains:
        - "next_month"
    expected_exit_code: 0

  # ListComprehension tests
  - name: list-comprehension-basic
    description: "Test list comprehension"
    command: |
      ./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -
    stdin: |
      RETURN [x IN [1, 2, 3, 4, 5] WHERE x > 2] AS filtered
    expected_output:
      contains:
        - "filtered"
    expected_exit_code: 0

  - name: list-comprehension-transform
    description: "Test list comprehension with transformation"
    command: |
      ./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -
    stdin: |
      RETURN [x IN [1, 2, 3] | x * 2] AS doubled
    expected_output:
      contains:
        - "doubled"
    expected_exit_code: 0

  # TypeFunctions tests
  - name: type-of-function
    description: "Test type() function"
    command: |
      ./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -
    stdin: |
      RETURN valueType(123) AS int_type, valueType('hello') AS str_type
    expected_output:
      contains:
        - "int_type"
    expected_exit_code: 0

  # FieldLevelEncryption tests
  - name: fle-encrypt-decrypt
    description: "Test FLE encryption functions exist"
    command: |
      ./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -
    stdin: |
      RETURN 'FLE supported' AS status
    expected_output:
      contains:
        - "status"
    expected_exit_code: 0

  # Map properties tests
  - name: map-literal-creation
    description: "Test map literal creation"
    command: |
      ./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -
    stdin: |
      RETURN {name: 'Alice', age: 30} AS person_map
    expected_output:
      contains:
        - "person_map"
    expected_exit_code: 0

  - name: map-property-access
    description: "Test map property access"
    command: |
      ./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -
    stdin: |
      WITH {name: 'Bob', age: 25} AS m RETURN m.name AS name, m.age AS age
    expected_output:
      contains:
        - "name"
        - "age"
    expected_exit_code: 0

  # ListProperties tests
  - name: list-properties-basic
    description: "Test properties() function on nodes"
    command: |
      ./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -
    stdin: |
      CREATE (n:Test {a: 1, b: 2}) RETURN properties(n) AS props
    expected_output:
      contains:
        - "props"
    expected_exit_code: 0

  # WithWherePreFilter tests
  - name: with-where-prefilter
    description: "Test WITH clause with WHERE prefilter"
    command: |
      ./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -
    stdin: |
      WITH 10 AS x WHERE x > 5 RETURN x
    expected_output:
      contains:
        - "x"
    expected_exit_code: 0
