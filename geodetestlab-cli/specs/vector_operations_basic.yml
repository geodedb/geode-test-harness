---
# Vector Operations Test Specification
# Converted from legacy format to compatible schema
version: "1.0"
name: "Vector Operations Basic Tests"
description: "Basic vector type operations and distance metrics"

cli:
  binary: "./zig-out/bin/geode"
  server:
    enabled: true
    port: null
    data_dir: null
    startup_timeout_ms: 60000
    cleanup: true
    args: ["--log-level", "warn"]
    env: {}
  client:
    timeout_ms: 30000
    tls_verify: false
    format: "json"

tests:
  - name: vector-f32-basic
    description: Test VectorF32 type creation
    args: ["query", "-"]
    stdin: "RETURN vectorf32('[1.0, 2.0, 3.0]') AS vec"
    expect:
      exit_code: 0
      stdout_contains: ["vec"]
    tags: [vector, basic]

  - name: vector-i32-basic
    description: Test VectorI32 type creation
    args: ["query", "-"]
    stdin: "RETURN vectori32('[1, 2, 3]') AS vec"
    expect:
      exit_code: 0
      stdout_contains: ["vec"]
    tags: [vector, basic]

  - name: vector-l2-distance
    description: Test L2 distance calculation
    args: ["query", "-"]
    stdin: "RETURN vector_l2(vectorf32('[1.0, 0.0]'), vectorf32('[0.0, 1.0]')) AS dist"
    expect:
      exit_code: 0
      stdout_contains: ["dist"]
    tags: [vector, distance]

  - name: vector-cosine-similarity
    description: Test cosine similarity calculation
    args: ["query", "-"]
    stdin: "RETURN vector_cosine(vectorf32('[1.0, 0.0]'), vectorf32('[1.0, 0.0]')) AS sim"
    expect:
      exit_code: 0
      stdout_contains: ["sim"]
    tags: [vector, similarity]

  - name: vector-dot-product
    description: Test dot product calculation
    args: ["query", "-"]
    stdin: "RETURN vector_dot(vectorf32('[1.0, 2.0, 3.0]'), vectorf32('[4.0, 5.0, 6.0]')) AS dot"
    expect:
      exit_code: 0
      stdout_contains: ["dot"]
    tags: [vector, math]

  - name: vector-node-property
    description: Test storing vectors as node properties
    args: ["query", "-"]
    stdin: "CREATE (doc:VectorDoc {embedding: vectorf32('[0.1, 0.2, 0.3]')}) RETURN doc.embedding AS emb"
    expect:
      exit_code: 0
    tags: [vector, storage]

  - name: vector-similarity-filter
    description: Test vector similarity in WHERE clause
    args: ["query", "-"]
    stdin: |
      CREATE (d1:Doc {v: vectorf32('[1.0, 0.0]')})
      CREATE (d2:Doc {v: vectorf32('[0.9, 0.1]')})
      MATCH (d:Doc) WHERE vector_cosine(d.v, vectorf32('[1.0, 0.0]')) > 0.8
      RETURN count(d) AS similar_count
    expect:
      exit_code: 0
      stdout_contains: ["similar_count"]
    tags: [vector, query]

tags: [vector, types, advanced]
