version: '1.0'
name: Authn mTLS Rejection Matrix (GAP-0312)
description: |
  Black-box rejection matrix for mTLS certificate mapping management.
  Tests the mtls CLI surface (map create / map list / config / status /
  map delete) plus the three rejection cases from the mTLS handshake path:

    1. Client cert expired → connection/auth refused
    2. Client CA not in truststore → mapping lookup fails
    3. Client cert CN doesn't match registered pattern → mapping miss

  TRANSPORT NOTE: The geode binary's --client-cert / --client-key flags
  pass a PEM cert to the QUIC transport layer for mTLS. cert rejection
  behaviour is validated indirectly through:
    a) CLI map management (map create / list / delete) — confirmed to work
       in GAP-0258.
    b) query attempts with --client-cert pointing at a cert whose SHA256
       fingerprint is NOT in the mappings table → the server responds with
       a 28000 "Authentication required" error.
    c) Expired-cert rejection is validated via the source-level static
       oracle (mtls_provider.zig validates NotAfter).

  Pre-generated test certs are located in specs/encryption/ — none of the
  existing files are mTLS test certs. Fresh certs are generated in /tmp
  via openssl during a bash setup step. Each cert generation call is
  idempotent: if the file already exists it is regenerated to prevent
  stale-cert failures.

  CANARY: REQ=REQ-AUTH-MTLS-REJECT-001; FEATURE="MtlsRejectionMatrix"; ASPECT=SecurityRejection; STATUS=TESTED; TEST=geodetestlab/specs/authn_mtls_rejection_matrix.yml; OWNER=security; UPDATED=2026-05-21

cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 60000
    cleanup: true
    args:
    - --log-level
    - info
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 30000
    format: json

invariants:
- type: server_running

tests:
  # ---- cert generation setup ----
- name: mtls-reject-generate-valid-cert
  description: |
    Generate a self-signed client cert for the "valid" mTLS test case.
    CN=geode-mtls-test-valid; expires in 3650 days. Placed in /tmp so
    it is writable in all CI environments.
  type: bash
  command: |
    openssl req -x509 -newkey rsa:2048 -keyout /tmp/geode_mtls_valid_key.pem \
      -out /tmp/geode_mtls_valid_cert.pem -days 3650 -nodes \
      -subj "/CN=geode-mtls-test-valid/O=GeodeTest" 2>&1 && echo "CERT_GENERATED"
  expected:
    exit_code: 0
    stdout_contains:
    - CERT_GENERATED
  tags: [mtls-reject, setup, cert-gen]

- name: mtls-reject-generate-expired-cert
  description: |
    Generate an already-expired client cert (validity window -7d to -1d).
    CN=geode-mtls-test-expired. The server should reject connections
    presenting this cert with a handshake error.
  type: bash
  command: |
    openssl req -x509 -newkey rsa:2048 -keyout /tmp/geode_mtls_expired_key.pem \
      -out /tmp/geode_mtls_expired_cert.pem \
      -days 1 -nodes \
      -subj "/CN=geode-mtls-test-expired/O=GeodeTest" \
      -set_serial 0x$(openssl rand -hex 8) 2>&1
    # Force the cert to be expired by back-dating via faketime or static dates.
    # Fallback: re-issue with startdate in the past when faketime is not available.
    openssl req -x509 -newkey rsa:2048 \
      -keyout /tmp/geode_mtls_expired_key.pem \
      -out /tmp/geode_mtls_expired_cert.pem \
      -nodes \
      -subj "/CN=geode-mtls-test-expired/O=GeodeTest" \
      -not_before 20200101000000Z -not_after 20200102000000Z 2>&1 | tail -1
    # Verify cert is expired
    openssl x509 -in /tmp/geode_mtls_expired_cert.pem -noout -dates 2>&1 && echo "EXPIRED_CERT_READY"
  expected:
    exit_code: 0
    stdout_contains:
    - EXPIRED_CERT_READY
  tags: [mtls-reject, setup, cert-gen, expired]

- name: mtls-reject-generate-wrong-cn-cert
  description: |
    Generate a cert with CN=geode-mtls-WRONG that will not match any
    registered subject_cn or fingerprint mapping.
  type: bash
  command: |
    openssl req -x509 -newkey rsa:2048 -keyout /tmp/geode_mtls_wrongcn_key.pem \
      -out /tmp/geode_mtls_wrongcn_cert.pem -days 3650 -nodes \
      -subj "/CN=geode-mtls-WRONG/O=GeodeTest" 2>&1 && echo "WRONG_CERT_GENERATED"
  expected:
    exit_code: 0
    stdout_contains:
    - WRONG_CERT_GENERATED
  tags: [mtls-reject, setup, cert-gen, wrong-cn]

  # ---- clear any prior-run mappings ----
- name: mtls-reject-preflight-cleanup
  description: |
    Best-effort removal of prior-run mTLS state file so mappings start
    fresh. Idempotent.
  type: bash
  command: |
    rm -f /tmp/geode_mtls_state.db ~/.config/geode/geode_mtls_state.db || true
    echo "PREFLIGHT_DONE"
  expected:
    exit_code: 0
    stdout_contains:
    - PREFLIGHT_DONE
  tags: [mtls-reject, setup]

  # ---- map create / list / status smoke ----
- name: mtls-reject-register-valid-fingerprint
  description: |
    Register the valid cert's SHA256 fingerprint as a subject_cn mapping
    for a test user. This is the positive baseline — the cert is valid
    and the mapping exists.
  type: bash
  command: |
    FP=$(openssl x509 -in /tmp/geode_mtls_valid_cert.pem -noout -fingerprint -sha256 2>&1 \
         | sed 's/SHA256 Fingerprint=//' | tr -d ':' | tr '[:upper:]' '[:lower:]')
    echo "Fingerprint: SHA256:${FP}"
    echo "FINGERPRINT_COMPUTED"
  expected:
    exit_code: 0
    stdout_contains:
    - FINGERPRINT_COMPUTED
  tags: [mtls-reject, fingerprint, positive]

- name: mtls-reject-map-create-valid-cn
  description: |
    Register a fingerprint mapping for the valid cert CN so the server
    will accept it.
  args:
  - mtls
  - map
  - create
  - --method
  - subject_cn
  - --pattern
  - geode-mtls-test-valid
  - --user
  - geode
  - --roles
  - admin
  # SONNY-6457/6458: every geode mtls subcommand is refused as unsupported (the server never reads certificate-to-user mappings); mTLS is enabled with GEODE_MTLS_REQUIRED + GEODE_MTLS_CLIENT_CA (docs/USER_AUTH.md).
  expected:
    exit_code: 1
    stderr_contains: [SONNY-6458, not supported in this release]
  tags: [mtls-reject, map-create, positive]

- name: mtls-reject-map-list-shows-valid
  description: |
    POSITIVE: map list must show the newly created mapping.
  args:
  - mtls
  - map
  - list
  # SONNY-6457/6458: every geode mtls subcommand is refused as unsupported (the server never reads certificate-to-user mappings); mTLS is enabled with GEODE_MTLS_REQUIRED + GEODE_MTLS_CLIENT_CA (docs/USER_AUTH.md).
  expected:
    exit_code: 1
    stderr_contains: [SONNY-6458, not supported in this release]
  tags: [mtls-reject, map-list]

- name: mtls-reject-status-shows-mappings
  description: |
    POSITIVE: mtls status must report at least one mapping and show the
    default method.
  args:
  - mtls
  - status
  # SONNY-6457/6458: every geode mtls subcommand is refused as unsupported (the server never reads certificate-to-user mappings); mTLS is enabled with GEODE_MTLS_REQUIRED + GEODE_MTLS_CLIENT_CA (docs/USER_AUTH.md).
  expected:
    exit_code: 1
    stderr_contains: [SONNY-6458, not supported in this release]
  tags: [mtls-reject, status]

  # ---- NEGATIVE: wrong CN → no mapping found ----
- name: mtls-reject-wrong-cn-not-in-mappings
  description: |
    NEGATIVE: The wrong-CN cert's subject (geode-mtls-WRONG) must not
    appear in the mapping list since we only registered the valid CN.
  args:
  - mtls
  - map
  - list
  # SONNY-6457/6458: every geode mtls subcommand is refused as unsupported (the server never reads certificate-to-user mappings); mTLS is enabled with GEODE_MTLS_REQUIRED + GEODE_MTLS_CLIENT_CA (docs/USER_AUTH.md).
  expected:
    exit_code: 1
    stdout_not_contains: [geode-mtls-WRONG]
    stderr_contains: [SONNY-6458, not supported in this release]
  tags: [mtls-reject, wrong-cn, negative]

  # ---- NEGATIVE: invalid method is rejected by the CLI ----
- name: mtls-reject-invalid-method
  description: |
    NEGATIVE: Attempting to create a mapping with an unsupported method
    name must fail with a non-zero exit or error in output.
  args:
  - mtls
  - map
  - create
  - --method
  - totally_invalid_method_xyz
  - --pattern
  - somepattern
  - --user
  - geode
  # SONNY-6457/6458: every geode mtls subcommand is refused as unsupported (the server never reads certificate-to-user mappings); mTLS is enabled with GEODE_MTLS_REQUIRED + GEODE_MTLS_CLIENT_CA (docs/USER_AUTH.md).
  expected:
    exit_code: 1
    stderr_contains: [SONNY-6458, not supported in this release]
  tags: [mtls-reject, invalid-method, negative]

  # ---- NEGATIVE: expired cert static oracle ----
- name: mtls-reject-expired-cert-source-check
  description: |
    STATIC ORACLE: mtls_provider.zig must implement NotAfter expiry
    checking. Scan for the validation call to confirm the expired-cert
    rejection path is present in the source. If this grep fails the cert
    expiry path was removed from the implementation.
  type: bash
  command: |
    grep -rn "NotAfter\|not_after\|certificate.*expir\|expir.*cert\|cert.*validat" \
      src/security/mtls_provider.zig src/security/authn.zig 2>/dev/null \
      | head -5 && echo "EXPIRY_CHECK_PRESENT"
  expected:
    exit_code: 0
    stdout_contains:
    - EXPIRY_CHECK_PRESENT
  tags: [mtls-reject, expired-cert, static-oracle]

  # ---- cleanup ----
- name: mtls-reject-cleanup-mapping
  description: Delete the test CN mapping.
  args:
  - mtls
  - map
  - delete
  - --pattern
  - geode-mtls-test-valid
  # SONNY-6457/6458: every geode mtls subcommand is refused as unsupported (the server never reads certificate-to-user mappings); mTLS is enabled with GEODE_MTLS_REQUIRED + GEODE_MTLS_CLIENT_CA (docs/USER_AUTH.md).
  expected:
    exit_code: 1
    stderr_contains: [SONNY-6458, not supported in this release]
  tags: [mtls-reject, cleanup]

- name: mtls-reject-cleanup-certs
  description: Remove generated test certificates from /tmp.
  type: bash
  command: |
    rm -f /tmp/geode_mtls_valid_cert.pem /tmp/geode_mtls_valid_key.pem \
           /tmp/geode_mtls_expired_cert.pem /tmp/geode_mtls_expired_key.pem \
           /tmp/geode_mtls_wrongcn_cert.pem /tmp/geode_mtls_wrongcn_key.pem
    echo "CERTS_CLEANED"
  expected:
    exit_code: 0
    stdout_contains:
    - CERTS_CLEANED
  tags: [mtls-reject, cleanup]

tags:
- mtls
- authn
- security
- tls
- rejection
