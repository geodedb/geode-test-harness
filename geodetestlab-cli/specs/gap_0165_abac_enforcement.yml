# CANARY: REQ=REQ-ABAC-WIRE-005; FEATURE="ABAC Enforcement Testing"; ASPECT=Integration; STATUS=EXEMPT; OWNER=security; UPDATED=2026-01-14
# GAP-0165: ABAC enforcement wired into server execution paths
# This spec tests that ABAC policies are enforced in query execution

name: gap_0165_abac_enforcement
description: Tests for GAP-0165 ABAC enforcement wiring into server execution paths
version: '1.0'

cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    startup_timeout_ms: 30000
    args:
    - --log-level
    - error
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'

tests:
  # Test 1: Verify basic query returns expected result
- name: abac-basic-query
  description: Basic query execution should work
  args:
  - query
  - '-'
  stdin: RETURN 1 AS x
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
      row_count: 1
  tags:
  - abac
  - basic

  # Test 2: Verify readonly operations work
- name: abac-readonly-query
  description: Read-only query execution should succeed
  args:
  - query
  - '-'
  stdin: RETURN 1 + 1 AS result
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
      row_count: 1
  tags:
  - abac
  - readonly

  # Test 3: Verify data operations (CREATE) work
- name: abac-create-node
  description: Create node operation should succeed
  args:
  - query
  - '-'
  stdin: |
    CREATE (n:ABACTest {name: 'test'});
    MATCH (n:ABACTest) RETURN n.name AS name
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
  tags:
  - abac
  - create

  # Test 4: Verify MATCH operations work
- name: abac-match-query
  description: Match query should succeed
  args:
  - query
  - '-'
  stdin: MATCH (n) RETURN n LIMIT 1
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
  tags:
  - abac
  - match

  # Test 5: Verify version/status accessible
- name: abac-public-resources
  description: Public resources like simple queries should be accessible
  args:
  - query
  - '-'
  stdin: RETURN 'version' AS resource
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
      row_count: 1
  tags:
  - abac
  - public

tags:
- security
- abac
- gap-analysis
