version: '1.0'
name: GPS Phase 4 Policy DDL lifecycle + persistence
description: |
  Black-box verification of Phase 4 (CREATE/DROP/SHOW POLICY + persistence).

  POSITIVE:
  - CREATE POLICY succeeds + appears in SHOW POLICIES.
  - DROP POLICY removes it.
  - DROP POLICY IF EXISTS is idempotent.
  - Multiple policies with different scope/actions coexist.

  NEGATIVE:
  - DROP POLICY on a non-existent policy (without IF EXISTS) is an error.
  - Empty SHOW POLICIES after all dropped.
  - Cannot CREATE POLICY twice with the same name.

  CANARY: REQ=REQ-GPS-DDL-005; FEATURE="GPS Policy DDL"; ASPECT=BlackBoxLifecycle; STATUS=TESTED; OWNER=security; UPDATED=2026-05-21
cli:
  binary: ./zig-out/bin/geode
  working_dir:
  env:
    GEODE_LOG_LEVEL: warn
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 60000
    cleanup: true
    args: [--log-level, warn]
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 30000
    format: json
secrets:
  admin_password:
    source: env
    key: GEODE_ADMIN_PASSWORD
    required: false
    default: Geode Test Admin Passphrase
invariants:
- type: server_running
fuzz:
  enabled: false
tests:
  # ============================================================================
  # PREFLIGHT: drop any leftover policies from prior runs
  # ============================================================================
- name: phase4-preflight-drop
  description: Idempotent preflight cleanup.
  args: [query, -U, geode, -P, '${secret:admin_password}', '-']
  stdin: |
    DROP POLICY IF EXISTS phase4_p1;
    DROP POLICY IF EXISTS phase4_p2;
    DROP POLICY IF EXISTS phase4_p_multi;
  expect:
    exit_code: 0
  tags: [phase4, setup]

  # ============================================================================
  # POSITIVE: CREATE POLICY appears in SHOW POLICIES
  # ============================================================================
- name: phase4-create-policy-p1
  description: POSITIVE — CREATE POLICY succeeds.
  args: [query, -U, geode, -P, '${secret:admin_password}', CREATE POLICY phase4_p1 ON GRAPH * FOR READ]
  expect:
    exit_code: 0
    stdout_contains: [Policy created]
  tags: [phase4, positive, create]

- name: phase4-show-policies-includes-p1
  description: POSITIVE — SHOW POLICIES returns phase4_p1 with READ action.
  args: [query, -U, geode, -P, '${secret:admin_password}', SHOW POLICIES]
  expect:
    exit_code: 0
    stdout_contains: [phase4_p1, read]
  tags: [phase4, positive, show]

  # ============================================================================
  # POSITIVE: multiple actions in a single policy
  # ============================================================================
- name: phase4-create-multi-action
  description: |
    POSITIVE — CREATE POLICY with multiple actions (READ, WRITE).
  args: [query, -U, geode, -P, '${secret:admin_password}', CREATE POLICY phase4_p_multi ON GRAPH * FOR READ, WRITE]
  expect:
    exit_code: 0
    stdout_contains: [Policy created]
  tags: [phase4, positive, create]

- name: phase4-show-policies-includes-multi
  description: |
    POSITIVE — SHOW POLICIES reflects multi-action policy.
    Action contents in the comma-separated actions column are verified by
    unit tests; here we only assert the policy name is present so the
    assertion is not fragile against output truncation or ordering.
  args: [query, -U, geode, -P, '${secret:admin_password}', SHOW POLICIES]
  expect:
    exit_code: 0
    stdout_contains: [phase4_p_multi]
  tags: [phase4, positive, show]

  # ============================================================================
  # POSITIVE: policy scoped to a named graph
  # ============================================================================
- name: phase4-create-policy-scoped
  description: POSITIVE — CREATE POLICY scoped to a specific graph.
  args: [query, -U, geode, -P, '${secret:admin_password}', CREATE POLICY phase4_p2 ON GRAPH hr FOR READ]
  expect:
    exit_code: 0
    stdout_contains: [Policy created]
  tags: [phase4, positive, create]

- name: phase4-show-policies-includes-scoped
  description: POSITIVE — SHOW POLICIES shows the scoped policy's graph.
  args: [query, -U, geode, -P, '${secret:admin_password}', SHOW POLICIES]
  expect:
    exit_code: 0
    stdout_contains: [phase4_p2, hr]
  tags: [phase4, positive, show]

  # ============================================================================
  # NEGATIVE: DROP POLICY without IF EXISTS on missing name is an error
  # ============================================================================
- name: phase4-drop-missing-policy-without-if-exists-fails
  description: |
    NEGATIVE — DROP POLICY on a non-existent name (no IF EXISTS) must
    produce an error in the response. Server returns PolicyNotFound /
    an explicit error message.
  args: [query, -U, geode, -P, '${secret:admin_password}', DROP POLICY phase4_does_not_exist]
  expect:
    exit_code: 0
    stdout_contains: [PolicyNotFound]
  tags: [phase4, negative, drop]

  # ============================================================================
  # POSITIVE: DROP POLICY IF EXISTS is idempotent
  # ============================================================================
- name: phase4-drop-missing-policy-if-exists-succeeds
  description: |
    POSITIVE — DROP POLICY IF EXISTS on a non-existent name succeeds
    silently (idempotent).
  args: [query, -U, geode, -P, '${secret:admin_password}', DROP POLICY IF EXISTS phase4_does_not_exist]
  expect:
    exit_code: 0
  tags: [phase4, positive, drop]

  # ============================================================================
  # POSITIVE: DROP POLICY removes from SHOW POLICIES
  # ============================================================================
- name: phase4-drop-p1
  description: POSITIVE — DROP POLICY phase4_p1 succeeds.
  args: [query, -U, geode, -P, '${secret:admin_password}', DROP POLICY phase4_p1]
  expect:
    exit_code: 0
    stdout_contains: [Policy dropped]
  tags: [phase4, positive, drop]

- name: phase4-show-policies-after-drop-p1
  description: |
    NEGATIVE — phase4_p1 must NOT appear in SHOW POLICIES after DROP.
    But phase4_p_multi and phase4_p2 should still be there.
  args: [query, -U, geode, -P, '${secret:admin_password}', SHOW POLICIES]
  expect:
    exit_code: 0
    stdout_contains: [phase4_p_multi, phase4_p2]
    stdout_not_contains: [phase4_p1]
  tags: [phase4, negative, show]

  # ============================================================================
  # POSITIVE: cleanup all policies, SHOW POLICIES returns empty rows
  # ============================================================================
- name: phase4-drop-remaining
  description: Drop the remaining test policies.
  args: [query, -U, geode, -P, '${secret:admin_password}', '-']
  stdin: |
    DROP POLICY IF EXISTS phase4_p_multi;
    DROP POLICY IF EXISTS phase4_p2;
  expect:
    exit_code: 0
  tags: [phase4, teardown]

- name: phase4-show-policies-after-all-dropped
  description: |
    NEGATIVE — after dropping all test policies, none of them should
    appear in SHOW POLICIES output.
  args: [query, -U, geode, -P, '${secret:admin_password}', SHOW POLICIES]
  expect:
    exit_code: 0
    stdout_not_contains: [phase4_p1, phase4_p2, phase4_p_multi]
  tags: [phase4, negative, show]

tags:
- phase4
- gps_policy_ddl
- security
- comprehensive
