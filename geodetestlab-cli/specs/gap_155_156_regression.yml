version: '1.0'
name: GAP-0155 and GAP-0156 Security Regression Tests
description: "Regression tests for security gaps:\n- GAP-0155: WAL encryption key hex parsing security fix\n- GAP-0156: MFA toggle command output security fix\n"
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 30000
    cleanup: true
    args:
    - --log-level
    - error
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 30000
    tls_verify: false
    format: json
secrets:
  admin_password:
    source: env
    key: GEODE_ADMIN_PASSWORD
    required: false
    default: GeodeTestPassword123!
tests:
- name: gap-0156-create-test-user
  description: |
    Create a user via GQL DDL (server-routed) rather than the
    `geode user create` CLI which opens a local data store and
    cannot see the harness-managed server.
  args: [query, -U, geode, -P, '${secret:admin_password}', CREATE USER mfatestuser156 SET PASSWORD 'SecurePass123! Strong Horse Battery' ROLE readonly]
  expect:
    exit_code: 0
  tags:
  - gap-0156
  - mfa-security
  - setup
- name: gap-0156-mfa-enable-no-hardcoded-secret
  description: |
    Issue #838 (2026-05-21): mfa enable without --code now errors
    with `missing code` (anti-CVE). The test verifies the secure-by-
    default error path AND the GAP-0156 invariant that the literal
    hardcoded '123456' must never appear in any mfa output.
  args:
  - user
  - mfa
  - enable
  - mfatestuser156
  expect:
    exit_code: 0
    stdout_contains:
    - missing code
    stdout_not_contains:
    - '123456'
  tags:
  - gap-0156
  - mfa-security
  - security-838
- name: gap-0156-mfa-disable-no-secret
  description: |
    mfa disable must succeed against a server-side user and must never
    output the literal hardcoded '123456' secret (GAP-0156).
  args:
  - user
  - mfa
  - disable
  - mfatestuser156
  expect:
    exit_code: 0
    stdout_not_contains:
    - '123456'
    - 'Secret:'
  tags:
  - gap-0156
  - mfa-security
- name: gap-0156-delete-test-user
  description: Clean up test user via GQL DDL.
  args: [query, -U, geode, -P, '${secret:admin_password}', DROP USER mfatestuser156]
  expect:
    exit_code: 0
  tags:
  - gap-0156
  - mfa-security
  - cleanup
- name: gap-0155-basic-query-works
  description: Verify basic query works (encryption not enabled by default)
  query: RETURN 1 AS x
  expect:
    success: true
    result_contains:
    - '1'
  tags:
  - gap-0155
  - wal-security
- name: gap-0155-server-healthy
  description: Server should be running and healthy
  query: RETURN 'healthy' AS status
  expect:
    success: true
    result_contains:
    - healthy
  tags:
  - gap-0155
  - wal-security
- name: mfa-setup-create-user
  description: Create user for mfa-setup test via GQL DDL (server-routed).
  args: [query, -U, geode, -P, '${secret:admin_password}', CREATE USER mfasetupuser156 SET PASSWORD 'SecurePass456! Strong Horse Battery' ROLE readonly]
  expect:
    exit_code: 0
  tags:
  - mfa-setup
  - setup
- name: mfa-setup-cleanup
  description: Clean up mfa-setup test user via GQL DDL.
  args: [query, -U, geode, -P, '${secret:admin_password}', DROP USER mfasetupuser156]
  expect:
    exit_code: 0
  tags:
  - mfa-setup
  - cleanup
metadata:
  gaps_covered:
  - id: GAP-0155
    title: WAL Encryption Key Hex Parsing Uses Silent catch 0
    severity: High
    gitlab_issue: 237
  - id: GAP-0156
    title: MFA Toggle Command Displays Hardcoded Secret '123456'
    severity: Medium
    gitlab_issue: 238
  created: '2026-01-14'
  author: security-audit
