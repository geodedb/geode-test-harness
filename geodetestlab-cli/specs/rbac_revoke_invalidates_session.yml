version: '1.0'
name: RBAC — REVOKE permission invalidates subsequent queries (GAP-0290)
description: |
  Verifies that revoking a per-graph READ grant or downgrading a role via
  ALTER USER SET ROLE immediately affects the enforcement decision for
  subsequent queries by that user.

  Session isolation caveat: the geodetestlab-cli harness issues each test
  step as a short-lived `geode query` invocation — it does not hold a
  persistent QUIC connection open across steps. Therefore this spec tests
  the "new connection after revoke" model rather than "held session
  invalidated mid-flight". The mid-flight session-invalidation case
  (holding a shell session open, revoking on a parallel connection, then
  sending a new command on the held session) requires the interactive shell
  runner pattern and is documented below with skip: true.

  What is tested here (all verifiable without a persistent shell):
    A. Admin revokes bob's per-graph READ grant; bob's next fresh connection
       to that graph results in a 42501 on a write attempt (bob was never
       allowed to write via the grant anyway — this tests grant absence
       doesn't confer write).
    B. Admin ALTERs carol from readwrite → readonly; carol's next fresh
       connection write attempt returns 42501.
    C. Revoke is reflected immediately — no cached permission window.

  CANARY: REQ=GAP-0290; FEATURE="RBAC REVOKE session invalidation"; ASPECT=PostRevokeDenial; STATUS=TESTED; OWNER=security; UPDATED=2026-05-21
cli:
  binary: ./zig-out/bin/geode
  working_dir:
  env:
    GEODE_LOG_LEVEL: warn
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 60000
    cleanup: false
    args: [--log-level, warn]
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 30000
    format: json
secrets:
  admin_password:
    source: env
    key: GEODE_ADMIN_PASSWORD
    required: false
    default: Geode Test Admin Passphrase
invariants:
- type: server_running
fuzz:
  enabled: false
tests:

- name: revoke-preflight-cleanup
  description: Idempotent cleanup of any leftover state.
  args: [query, -U, geode, -P, '${secret:admin_password}', --batch, '-']
  stdin: |
    DROP USER IF EXISTS rbac_revoke_bob;
    DROP USER IF EXISTS rbac_revoke_carol;
    DROP GRAPH IF EXISTS rbac_revoke_graph;
  expect: {exit_code: 0}
  tags: [rbac, setup]

- name: revoke-create-graph
  args: [query, -U, geode, -P, '${secret:admin_password}', CREATE GRAPH rbac_revoke_graph]
  expect: {exit_code: 0}
  tags: [rbac, setup]

- name: revoke-create-bob-readonly
  args: [query, -U, geode, -P, '${secret:admin_password}', CREATE USER rbac_revoke_bob SET PASSWORD 'RbacRevoke Bob 1234 Passphrase' ROLE readonly]
  expect:
    exit_code: 0
    stdout_contains: [rbac_revoke_bob]
  tags: [rbac, setup]

- name: revoke-create-carol-readwrite
  args: [query, -U, geode, -P, '${secret:admin_password}', CREATE USER rbac_revoke_carol SET PASSWORD 'RbacRevoke Carol 1234 Passphrase' ROLE readwrite]
  expect:
    exit_code: 0
    stdout_contains: [rbac_revoke_carol]
  tags: [rbac, setup]

# --- Part A: per-graph READ grant, then revoke ---

- name: revoke-grant-bob-read-on-graph
  description: Grant bob READ on rbac_revoke_graph (widening his BIND access).
  args: [query, -U, geode, -P, '${secret:admin_password}', GRANT READ ON GRAPH rbac_revoke_graph TO rbac_revoke_bob]
  expect:
    exit_code: 0
    stdout_contains: [Granted]
  tags: [rbac, setup, grant]

- name: revoke-bob-can-read-before-revoke
  description: |
    POSITIVE — the READ grant lets readonly bob bind rbac_revoke_graph and
    read it. This also puts bob's bind_graph ALLOW into geode's GPS decision
    cache, which the post-revoke read below must not be served from.
  args: [query, -U, rbac_revoke_bob, -P, RbacRevoke Bob 1234 Passphrase, '-']
  stdin: |
    USE GRAPH rbac_revoke_graph;
    RETURN 1 AS x;
  expect:
    exit_code: 0
    stdout_contains: ['"x":1']
    stdout_not_contains: [Access denied]
  tags: [rbac, positive, pre_revoke, grant]

- name: revoke-bob-write-still-denied-before-revoke
  description: |
    NEGATIVE — bob is readonly globally; READ grant does not confer write.
    A write attempt before the grant revoke must still fail with 42501.
  args: [query, -U, rbac_revoke_bob, -P, RbacRevoke Bob 1234 Passphrase, '-']
  stdin: |
    USE GRAPH rbac_revoke_graph;
    CREATE (n:RbacRevokeBobPre {v: 1}) RETURN n;
  expect:
    exit_code: 1
    stdout_contains: ['42501', Permission denied]
  tags: [rbac, negative, pre_revoke]

- name: revoke-revoke-bob-read-grant
  description: Revoke bob's per-graph READ grant.
  args: [query, -U, geode, -P, '${secret:admin_password}', REVOKE READ ON GRAPH rbac_revoke_graph FROM rbac_revoke_bob]
  expect:
    exit_code: 0
    stdout_contains: [Revoked]
  tags: [rbac, revoke]

- name: revoke-bob-write-still-denied-after-revoke
  description: |
    NEGATIVE — after the grant revoke, bob's next fresh connection write
    attempt must still fail. With the READ grant gone bob may not bind
    rbac_revoke_graph at all, so the USE GRAPH is refused (exit 3, "Access
    denied") before the CREATE is reached. This confirms the revoke was
    applied immediately to the enforcement layer (no stale grant cache);
    a stale cached bind ALLOW would instead reach the write gate (42501).
  args: [query, -U, rbac_revoke_bob, -P, RbacRevoke Bob 1234 Passphrase, '-']
  stdin: |
    USE GRAPH rbac_revoke_graph;
    CREATE (n:RbacRevokeBobPost {v: 1}) RETURN n;
  expect:
    exit_code: 3
    stdout_contains: [Access denied, insufficient permissions for graph]
    stdout_not_contains: [RbacRevokeBobPost]
  tags: [rbac, negative, post_revoke, gap0290]

- name: revoke-bob-read-denied-after-revoke
  description: |
    NEGATIVE — after REVOKE READ ON GRAPH, bob may no longer bind
    rbac_revoke_graph. geode cached bob's earlier bind_graph ALLOW, and a
    grant change bumped neither his auth_version nor the policy version,
    so the revoked grant kept working until restart. A grant change now
    bumps the policy version and invalidates the cached decision.
  args: [query, -U, rbac_revoke_bob, -P, RbacRevoke Bob 1234 Passphrase, '-']
  stdin: |
    USE GRAPH rbac_revoke_graph;
    RETURN 1 AS x;
  expect:
    exit_code: 3
    stdout_contains: [Access denied, insufficient permissions for graph]
    stdout_not_contains: ['"x":1']
  tags: [rbac, negative, post_revoke, gap0290]

# --- Part B: ALTER USER role downgrade invalidates write ---

- name: revoke-carol-can-write-before-downgrade
  description: POSITIVE — carol (readwrite) can write before downgrade.
  args: [query, -U, rbac_revoke_carol, -P, RbacRevoke Carol 1234 Passphrase, '-']
  stdin: 'CREATE (n:RbacRevokeCarolPre {v: 1}) RETURN n'
  expect:
    exit_code: 0
    stdout_contains: [RbacRevokeCarolPre]
    stdout_not_contains: ['42501']
  tags: [rbac, positive, pre_downgrade]

- name: revoke-alter-carol-to-readonly
  description: Downgrade carol from readwrite to readonly via ALTER USER.
  args: [query, -U, geode, -P, '${secret:admin_password}', ALTER USER rbac_revoke_carol SET ROLE readonly]
  expect: {exit_code: 0}
  tags: [rbac, alter_user]

- name: revoke-carol-write-denied-after-downgrade
  description: |
    NEGATIVE — after ALTER USER SET ROLE readonly, carol's next fresh
    connection write attempt must fail with 42501. This verifies that
    role downgrade is applied immediately — no caching window.
  args: [query, -U, rbac_revoke_carol, -P, RbacRevoke Carol 1234 Passphrase, '-']
  stdin: 'CREATE (n:RbacRevokeCarolPost {v: 1}) RETURN n'
  expect:
    exit_code: 1
    stdout_contains: ['42501', Permission denied]
  tags: [rbac, negative, post_downgrade, gap0290]

# --- Mid-flight session invalidation (skip: documented limitation) ---
# NOTE: The scenario where an admin revokes a role WHILE a session is
# actively held open (persistent QUIC connection) cannot be tested with
# the current harness, which issues each step as a fresh query invocation.
# The interactive shell runner (geode shell) could hold a connection but
# the harness does not support interleaving two parallel sessions within a
# single spec. This case is left as a manual test or future shell-runner
# spec. See: shell_session_stability.yml for the interactive session pattern.

- name: revoke-cleanup
  args: [query, -U, geode, -P, '${secret:admin_password}', --batch, '-']
  stdin: |
    DROP USER IF EXISTS rbac_revoke_bob;
    DROP USER IF EXISTS rbac_revoke_carol;
    DROP GRAPH IF EXISTS rbac_revoke_graph;
  expect: {exit_code: 0}
  tags: [rbac, teardown]

tags:
- rbac
- revoke
- session_invalidation
- security
- gap0290
