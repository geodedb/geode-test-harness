version: '1.0'
name: Query Output Format Tests
description: 'Tests for --format flag options: json, table, csv, dot'
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port: null
    data_dir: null
    startup_timeout_ms: 30000
    cleanup: true
    args:
    - --log-level
    - warn
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 10000
    tls_verify: false
    format: json
tests:
- name: query-help-shows-formats
  description: Verify query --help shows all format options
  args:
  - query
  - --help
  expect:
    exit_code: 0
    stderr_contains:
    - --format
    - json
    - table
    - csv
    - dot
  tags:
  - help
  - formats
- name: query-help-dot-example
  description: Verify query --help shows DOT format example
  args:
  - query
  - --help
  expect:
    exit_code: 0
    stderr_contains:
    - --format dot
    - dot -Tpng
  tags:
  - help
  - dot
- name: json-format-explicit
  description: Test explicit JSON format output
  args:
  - query
  - --format
  - json
  - RETURN 42 AS answer
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
      columns:
      - answer
  tags:
  - format
  - json
- name: json-format-default
  description: Test default format is JSON
  args:
  - query
  - RETURN 'hello' AS greeting
  expect:
    exit_code: 0
    stdout_contains:
    - '"type":'
    - '"rows":'
  tags:
  - format
  - json
  - default
- name: table-format-basic
  description: Test table format with simple data
  args:
  - query
  - --format
  - table
  - RETURN 1 AS num, 'test' AS str
  expect:
    exit_code: 0
    stdout_contains:
    - num
    - str
    - '|'
    - +
    - '1'
    - test
  tags:
  - format
  - table
- name: table-format-row-count-singular
  description: Test table format shows '1 row' for single row
  args:
  - query
  - --format
  - table
  - RETURN 1 AS x
  expect:
    exit_code: 0
    stdout_contains:
    - (1 row)
  tags:
  - format
  - table
- name: csv-format-basic
  description: Test CSV format with simple data
  args:
  - query
  - --format
  - csv
  - RETURN 1 AS a, 2 AS b, 3 AS c
  expect:
    exit_code: 0
    stdout_contains:
    - a,b,c
    - 1,2,3
  tags:
  - format
  - csv
- name: csv-format-quoting
  description: Test CSV format properly quotes values with commas
  args:
  - query
  - --format
  - csv
  - RETURN 'hello, world' AS greeting
  expect:
    exit_code: 0
    stdout_contains:
    - greeting
    - '"hello, world"'
  tags:
  - format
  - csv
  - quoting
- name: dot-format-empty-graph
  description: Test DOT format with no nodes
  args:
  - query
  - --format
  - dot
  - RETURN 1 AS x
  expect:
    exit_code: 0
    stdout_contains:
    - digraph G {
    - rankdir=LR
    - '}'
  tags:
  - format
  - dot
- name: dot-format-single-node
  description: Test DOT format with single node
  args:
  - query
  - --format
  - dot
  - 'CREATE (n:Person {name: ''Alice''}) RETURN n'
  expect:
    exit_code: 0
    stdout_contains:
    - digraph G {
    - Person
    - Alice
    - '}'
  tags:
  - format
  - dot
  - node
- name: dot-format-node-with-label
  description: Test DOT format shows node labels
  args:
  - query
  - --format
  - dot
  - 'CREATE (n:User {username: ''bob''}) RETURN n'
  expect:
    exit_code: 0
    stdout_contains:
    - digraph G {
    - User
  tags:
  - format
  - dot
  - label
- name: dot-format-relationship
  description: Test DOT format with relationship
  args:
  - query
  - --format
  - dot
  - 'CREATE (a:Person {name: ''A''})-[r:KNOWS]->(b:Person {name: ''B''}) RETURN a, r, b'
  expect:
    exit_code: 0
    stdout_contains:
    - digraph G {
    - ->
    - KNOWS
    - '}'
  tags:
  - format
  - dot
  - relationship
- name: dot-format-edge-label
  description: Test DOT format shows relationship type as edge label
  args:
  - query
  - --format
  - dot
  - CREATE (a:Person)-[r:FRIENDS_WITH]->(b:Person) RETURN a, r, b
  expect:
    exit_code: 0
    stdout_contains:
    - label="FRIENDS_WITH"
  tags:
  - format
  - dot
  - edge
- name: dot-format-graph-attributes
  description: Test DOT format includes graph attributes
  args:
  - query
  - --format
  - dot
  - CREATE (n:Node) RETURN n
  expect:
    exit_code: 0
    stdout_contains:
    - digraph G {
    - rankdir=LR
    - node [
    - edge [
  tags:
  - format
  - dot
  - attributes
- name: dot-format-multiple-nodes
  description: Test DOT format with multiple nodes
  args:
  - query
  - --format
  - dot
  - CREATE (a:A), (b:B), (c:C) RETURN a, b, c
  expect:
    exit_code: 0
    stdout_contains:
    - digraph G {
    - '}'
  tags:
  - format
  - dot
  - multiple
- name: dot-format-chain
  description: Test DOT format with chain of nodes
  args:
  - query
  - --format
  - dot
  - CREATE (a:Start)-[r1:NEXT]->(b:Middle)-[r2:NEXT]->(c:End) RETURN a, r1, b, r2, c
  expect:
    exit_code: 0
    stdout_contains:
    - digraph G {
    - NEXT
    - ->
  tags:
  - format
  - dot
  - chain
- name: dot-format-dedup-nodes
  description: Test DOT format deduplicates nodes
  args:
  - query
  - --format
  - dot
  - 'CREATE (n:Person {name: ''Test''}) WITH n MATCH (m:Person) RETURN n, m'
  expect:
    exit_code: 0
    stdout_contains:
    - digraph G {
    - '}'
  tags:
  - format
  - dot
  - dedup
- name: format-with-syntax-error
  description: Test format handling with query syntax error
  args:
  - query
  - --format
  - table
  - INVALID SYNTAX
  expect:
    exit_code: 0
  tags:
  - format
  - error
- name: dot-format-with-properties
  description: Test DOT format preserves node properties in display
  args:
  - query
  - --format
  - dot
  - 'CREATE (n:Person {name: ''John'', age: 30}) RETURN n'
  expect:
    exit_code: 0
    stdout_contains:
    - digraph G {
    - John
  tags:
  - format
  - dot
  - properties
- name: table-format-null-values
  description: Test table format with null values
  args:
  - query
  - --format
  - table
  - RETURN null AS empty
  expect:
    exit_code: 0
    stdout_contains:
    - empty
    - 'null'
  tags:
  - format
  - table
  - 'null'
- name: csv-format-null-values
  description: Test CSV format with null values
  args:
  - query
  - --format
  - csv
  - RETURN null AS empty
  expect:
    exit_code: 0
    stdout_contains:
    - empty
    - 'null'
  tags:
  - format
  - csv
  - 'null'
- name: dot-format-full-graph
  description: Test DOT format with full graph pattern
  setup:
  - 'CREATE (a:Person {name: ''Alice''})'
  - 'CREATE (b:Person {name: ''Bob''})'
  - 'MATCH (a:Person {name: ''Alice''}), (b:Person {name: ''Bob''}) CREATE (a)-[:KNOWS]->(b)'
  args:
  - query
  - --format
  - dot
  - MATCH (a)-[r]->(b) RETURN a, r, b
  expect:
    exit_code: 0
    stdout_contains:
    - digraph G {
    - ->
    - '}'
  tags:
  - format
  - dot
  - integration
