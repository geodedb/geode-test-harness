version: '1.0'
name: Geode Enterprise Comprehensive Tests
description: "Comprehensive test suite for Geode's enterprise-grade features including:\n- Multi-graph security and isolation\n- Transaction operations\n- Basic aggregations\n- Query chaining with WITH clause\n"
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 30000
    cleanup: true
    args:
    - --log-level
    - warn
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 10000
    tls_verify: false
    format: json
invariants:
- type: server_running
tests:
- name: mg-01-create-production-graph
  description: Create production graph
  args:
  - query
  - '-'
  stdin: CREATE GRAPH IF NOT EXISTS production
  expect:
    exit_code: 0
  tags:
  - multi-graph
  - setup
- name: mg-02-create-analytics-graph
  description: Create analytics graph
  args:
  - query
  - '-'
  stdin: CREATE GRAPH IF NOT EXISTS analytics
  expect:
    exit_code: 0
  tags:
  - multi-graph
  - setup
- name: mg-03-production-data
  description: Add data to production graph
  args:
  - query
  - '-'
  stdin: "USE GRAPH production;\nCREATE (u1:User {name: 'Alice', role: 'admin'}),\n       (u2:User {name: 'Bob', role: 'developer'}),\n       (u3:User {name: 'Carol', role: 'analyst'})\nRETURN u1, u2, u3\n"
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
  tags:
  - multi-graph
  - data
- name: mg-04-analytics-data
  description: Add data to analytics graph
  args:
  - query
  - '-'
  stdin: "USE GRAPH analytics;\nCREATE (m1:Metric {name: 'users', value: 1000}),\n       (m2:Metric {name: 'requests', value: 50000})\nRETURN m1, m2\n"
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
  tags:
  - multi-graph
  - data
- name: mg-05-verify-production
  description: Query production graph
  args:
  - query
  - '-'
  stdin: "USE GRAPH production;\nMATCH (u:User) RETURN count(u) AS user_count\n"
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
  tags:
  - multi-graph
  - verify
- name: mg-06-verify-analytics
  description: Query analytics graph
  args:
  - query
  - '-'
  stdin: "USE GRAPH analytics;\nMATCH (m:Metric) RETURN count(m) AS metric_count\n"
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
  tags:
  - multi-graph
  - verify
- name: mg-07-graph-isolation
  description: Verify users not in analytics
  args:
  - query
  - '-'
  stdin: "USE GRAPH analytics;\nMATCH (u:User) RETURN count(u) AS user_count\n"
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
      rows:
      - user_count: 0
  tags:
  - multi-graph
  - isolation
- name: agg-01-basic-count
  description: Count nodes
  args:
  - query
  - '-'
  stdin: "USE GRAPH production;\nMATCH (n) RETURN count(n) AS total\n"
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
  tags:
  - aggregation
- name: agg-02-count-by-label
  description: Count users
  args:
  - query
  - '-'
  stdin: "USE GRAPH production;\nMATCH (u:User) RETURN count(*) AS users\n"
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
  tags:
  - aggregation
- name: agg-03-group-by
  description: Group by role
  args:
  - query
  - '-'
  stdin: "USE GRAPH production;\nMATCH (u:User) RETURN u.role AS role, count(*) AS cnt GROUP BY u.role ORDER BY role\n"
  expect:
    exit_code: 0
    geode_query:
      min_rows: 1
  tags:
  - aggregation
  - group-by
- name: with-01-projection
  description: WITH for projection
  args:
  - query
  - '-'
  stdin: "USE GRAPH production;\nMATCH (u:User)\nWITH u.name AS name\nRETURN name ORDER BY name\n"
  expect:
    exit_code: 0
    geode_query:
      min_rows: 1
  tags:
  - with-clause
- name: with-02-filter
  description: WITH with filter
  args:
  - query
  - '-'
  stdin: "USE GRAPH production;\nMATCH (u:User)\nWITH u WHERE u.role = 'admin'\nRETURN u.name AS admin\n"
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
  tags:
  - with-clause
- name: with-03-order-limit
  description: WITH ORDER BY LIMIT
  args:
  - query
  - '-'
  stdin: "USE GRAPH production;\nMATCH (u:User)\nWITH u ORDER BY u.name LIMIT 2\nRETURN u.name AS name\n"
  expect:
    exit_code: 0
    geode_query:
      row_count: 2
  tags:
  - with-clause
- name: opt-01-setup-relationships
  description: Create relationships for optional match
  args:
  - query
  - '-'
  stdin: "USE GRAPH production;\nMATCH (a:User {name: 'Alice'}), (b:User {name: 'Bob'})\nCREATE (a)-[:MANAGES]->(b)\nRETURN count(*) AS created\n"
  expect:
    exit_code: 0
  tags:
  - optional-match
  - setup
- name: opt-02-basic-optional
  description: Basic optional match
  args:
  - query
  - '-'
  stdin: "USE GRAPH production;\nMATCH (u:User)\nOPTIONAL MATCH (u)-[:MANAGES]->(sub:User)\nRETURN u.name AS manager, sub.name AS subordinate ORDER BY manager\n"
  expect:
    exit_code: 0
    geode_query:
      min_rows: 1
  tags:
  - optional-match
- name: opt-03-count-optional
  description: Count with optional
  args:
  - query
  - '-'
  stdin: "USE GRAPH production;\nMATCH (u:User)\nOPTIONAL MATCH (u)-[r:MANAGES]->()\nRETURN u.name AS user, count(r) AS manages GROUP BY u.name ORDER BY user\n"
  expect:
    exit_code: 0
    geode_query:
      min_rows: 1
  tags:
  - optional-match
- name: expr-01-arithmetic
  description: Arithmetic expressions
  args:
  - query
  - '-'
  stdin: RETURN 1 + 2 AS total, 10 - 3 AS diff, 4 * 5 AS prod
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
      rows:
      - total: 3
        diff: 7
        prod: 20
  tags:
  - expression
- name: expr-02-comparison
  description: Comparison expressions
  args:
  - query
  - '-'
  stdin: RETURN 5 > 3 AS gt, 2 < 1 AS lt, 4 = 4 AS eq
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
      rows:
      - gt: true
        lt: false
        eq: true
  tags:
  - expression
- name: expr-03-string-ops
  description: String operations
  args:
  - query
  - '-'
  stdin: RETURN 'hello' + ' ' + 'world' AS greeting
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
      rows:
      - greeting: hello world
  tags:
  - expression
- name: expr-04-case
  description: CASE expression
  args:
  - query
  - '-'
  stdin: "USE GRAPH production;\nMATCH (u:User)\nRETURN u.name,\n       CASE WHEN u.role = 'admin' THEN 'Administrator'\n            ELSE 'Staff' END AS title\nORDER BY u.name\n"
  expect:
    exit_code: 0
    geode_query:
      min_rows: 1
  tags:
  - expression
  - case
- name: txn-01-setup
  description: Setup transaction test data
  args:
  - query
  - '-'
  stdin: "USE GRAPH production;\nCREATE (a:Account {id: 'A1', balance: 1000}),\n       (b:Account {id: 'A2', balance: 500})\nRETURN a, b\n"
  expect:
    exit_code: 0
  tags:
  - transaction
  - setup
- name: txn-02-read-accounts
  description: Read account balances
  args:
  - query
  - '-'
  stdin: "USE GRAPH production;\nMATCH (a:Account) RETURN a.id AS id, a.balance AS balance ORDER BY a.id\n"
  expect:
    exit_code: 0
    geode_query:
      row_count: 2
  tags:
  - transaction
- name: cleanup-01-production
  description: Clean production graph
  args:
  - query
  - '-'
  stdin: "USE GRAPH production;\nMATCH (n) DETACH DELETE n\n"
  expect:
    exit_code: 0
  tags:
  - cleanup
- name: cleanup-02-analytics
  description: Clean analytics graph
  args:
  - query
  - '-'
  stdin: "USE GRAPH analytics;\nMATCH (n) DETACH DELETE n\n"
  expect:
    exit_code: 0
  tags:
  - cleanup
- name: cleanup-03-drop-graphs
  description: Drop test graphs
  args:
  - query
  - --batch
  - '-'
  stdin: "DROP GRAPH IF EXISTS production;\nDROP GRAPH IF EXISTS analytics\n"
  expect:
    exit_code: 0
  tags:
  - cleanup
