version: '1.0'
name: Geode Audit & Security Advanced Test Suite
description: Advanced verification of audit logging integrity, security edge cases, and high-volume throughput.

cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 30000
    cleanup: true
    args: [--log-level, info, --audit, --audit-file, /tmp/geode_audit_advanced.jsonl]
  client:
    timeout_ms: 15000
    tls_verify: false
    format: json

tests:
  # ===============================
  # SETUP
  # ===============================
- name: adv-audit-setup
  description: Initialize environment
  args: [query, "CALL audit.configure(enabled => true, file_path => '/tmp/geode_audit_advanced.jsonl')"]
  expect:
    exit_code: 0
  tags: [setup]

  # ===============================
  # INTEGRITY & DIGESTS (High Volume)
  # ===============================
  # removed: adv-audit-digest-trigger used Cypher list-iteration not in ISO GQL
  # (it looped 105 times to trigger the 100-event Merkle digest interval).
  # adv-audit-verify-chain depended on that 105-event corpus and is also removed.
  # Merkle-chain regression coverage lives in the Zig audit unit tests.

  # ===============================
  # SECURITY EDGE CASES (Injection)
  # ===============================
- name: adv-audit-injection-newline
  description: Attempt log injection with newlines in string fields
    # Should be escaped to \n in JSON, keeping it on one line.
  args: [query, "CALL audit.log_generic('security_test', 1, 'res_newline', 'inject\nnewline', {})"]
  expect:
    exit_code: 0
  tags: [security, injection]

- name: adv-audit-injection-json
  description: Attempt log injection with JSON control chars
  args: [query, "CALL audit.log_generic('security_test', 1, 'res_json', 'inject\"},{\"fake\":\"entry\"', {})"]
  expect:
    exit_code: 0
  tags: [security, injection]

- name: adv-audit-payload-size
  description: Log a large payload in details map
    # 4KB string
  args: [query, "WITH 'x' * 4096 AS big_str CALL audit.log_generic('stress_test', 1, 'res_big', 'write', {payload: big_str}) RETURN true"]
  expect:
    exit_code: 0
  tags: [security, payload]

  # ===============================
  # FEATURE INTEGRATION (RLS & Auth)
  # ===============================

  # 1. RLS Denial
- name: adv-audit-rls-denial
  description: Verify access_denied log with policy_id checks
    # Setup: Create policy, create user, try access, expect failure.
  args: [query, "CALL policy.create('deny_all_test', 'test_node', 'false'); MATCH (n:test_node) RETURN n;"]
  expect:
      # Expect query failure (RLS denied) OR empty result, but IMPORTANTLY check audit log later
    exit_code: 0
  tags: [integration, rls]

- name: adv-audit-verify-rls-log
  description: Check if RLS denial was logged with correct policy_id
  args: [query, "CALL audit.get_recent_events(5) YIELD event_type, policy_id WHERE event_type = 'access_denied' RETURN event_type, policy_id"]
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
  tags: [integration, rls, verify]

  # 2. Schema Change
- name: adv-audit-schema-change
  description: Verify schema modification logging
  args: [query, CREATE INDEX ON :User(email)]
  expect:
    exit_code: 0
  tags: [integration, schema]

- name: adv-audit-verify-schema-log
  description: Check schema_change log
  args: [query, "CALL audit.get_recent_events(5) YIELD event_type, action WHERE event_type = 'schema_change' RETURN event_type, action"]
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
  tags: [integration, schema, verify]

  # ===============================
  # CLEANUP
  # ===============================
- name: adv-audit-cleanup
  description: Clean up
  args: [query, CALL audit.cleanup_test_artifacts(); CALL policy.delete('deny_all_test');]
  expect:
    exit_code: 0
  tags: [cleanup]

tags: [audit, advanced, security, integrity]
