# SONNY-6570: CDC procedures answer from the engine or refuse (0A000), Admin only
#
# Bug: no write path feeds the CDC engine (change capture is not implemented,
# SONNY-6572), yet CALL cdc.* answered as if it were: cdc.get_events returned one
# invented event (seq 1, insert, 2025-10-25T00:00:00Z, {}), get_ordered_events /
# get_corruption_analysis / get_pending_events / get_flush_metrics /
# get_telemetry_metrics returned fixed rows, pause / resume / set_guardrail /
# configure_* / set_retention_policy / cleanup_expired_events changed nothing and
# reported success, cdc.start/stop/reset_guardrails answered success with CDC not
# enabled, and a readwrite or readonly user could read cdc.status() and run
# cdc.enable() / cdc.disable().
#
# Fixed behaviour:
#   * every procedure that cannot answer truthfully fails with SQLSTATE 0A000
#     whose message names the procedure and "SONNY-6572"
#   * cdc.start() / cdc.stop() / cdc.reset_guardrails() with CDC not enabled
#     fail 55000
#   * the honest procedures answer the engine's state: cdc.status() reports
#     enabled=false / streaming=false / event_count=0 before enable, enabled=true
#     after, and drops the old last_checkpoint column
#   * every cdc.* procedure is Admin only (42501 for readwrite / readonly)
#   * writes performed with CDC enabled are NOT captured, so cdc.status keeps
#     event_count 0 (the honest answer; nothing invents events)
#
# What this spec proves: real server, real users over the QUIC wire; no fixed
# invented rows can appear because every refusal is asserted by SQLSTATE.

version: '1.0'
name: SONNY-6570 CDC procedures answer truthfully or refuse, Admin only
description: cdc.* procedures that cannot answer truthfully fail 0A000 naming SONNY-6572, start/stop/reset need CDC enabled (55000), and all are Admin only (SONNY-6570)
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 60000
    cleanup: true
    args:
    - --log-level
    - warn
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
      GEODE_LSP_PORT: '0'
  client:
    timeout_ms: 30000
    tls_verify: false
    format: json
tests:
- name: s6570-create-users
  description: Create a readwrite and a readonly user
  args:
  - query
  - '-'
  stdin: "DROP USER IF EXISTS cdc6570_rw;\nDROP USER IF EXISTS cdc6570_ro;\nCREATE USER cdc6570_rw SET PASSWORD 'Cdc6570 Readwrite Passphrase 2026' ROLE readwrite;\nCREATE USER cdc6570_ro SET PASSWORD 'Cdc6570 Readonly Passphrase 2026' ROLE readonly"
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
  tags:
  - cdc
  - setup
  - sonny6570
- name: s6570-status-before-enable
  description: cdc.status() before enable reports the engine's state, not a made-up row
  args:
  - query
  - '-'
  stdin: CALL cdc.status()
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    - '"enabled":false'
    - '"streaming":false'
    - '"event_count":0'
    stdout_not_contains:
    - last_checkpoint
  tags:
  - cdc
  - sonny6570
- name: s6570-start-without-enable
  description: CALL cdc.start() with CDC not enabled fails 55000 (it used to report success)
  args:
  - query
  - '-'
  stdin: CALL cdc.start()
  expect:
    exit_code: 1
    stdout_contains:
    - '"status_class":"55000"'
    stdout_not_contains:
    - '"status_class":"00000"'
  tags:
  - cdc
  - sonny6570
- name: s6570-stop-without-enable
