version: '1.0'
name: FLE Key Rotation Atomicity — Mid-Rotation Failure Rollback — GAP-0304
description: |
  SECURITY CRITICAL TEST SUITE — GAP-0304

  Verifies that FLE per-field key rotation is atomic: if the server is
  interrupted mid-rotation (via SIGKILL / process termination), after
  restart all rows must be under EITHER the old key OR the new key —
  never a mix of the two.

  Test procedure:
    1. Seed rows under key v1. Confirm decrypt works.
    2. Begin FLE FEK rotation to v2. Immediately SIGKILL the server.
    3. Restart the server using the same data dir.
    4. Confirm all rows decrypt successfully (either via v1 or v2 —
       whatever the server committed).
    5. Confirm NO plaintext markers appear on disk at any point.
    6. The mixed-key scenario (some rows v1, some v2, some undecryptable)
       is treated as a FAILURE.

  Failure injection: `pkill -9` sent to the geode process immediately
  after initiating rotation. This is done via a bash step.

  Note on atomicity definition: The server may implement rotation as
  a write-ahead "begin rotation" journal entry and a batch re-encrypt.
  After restart, the journal drives recovery to either commit or abort.
  Any row that cannot be decrypted post-recovery is a test FAILURE.

  Test Data Markers:
    - v1 rows: "FLEATOMIC_V1_SECRET_kappa-001" through "kappa-005"
    - v2 marker: not directly testable (new key material); we verify
      decryptability, not the ciphertext.

  CANARY: REQ=REQ-FLE-ENFORCE-025; FEATURE=FLEEnforcement; ASPECT=RotationAtomicity; STATUS=TESTED; OWNER=security; UPDATED=2026-05-21

cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 30000
    cleanup: false
    args:
    - --log-level
    - info
    - --enable-fle
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 15000
    tls_verify: false
    format: json
env:
  GEODE_FLE_ENABLED: 'true'
  GEODE_MASTER_KEY: fleatomic-master-key-32bytes-l!!
skip_isolation: true

tests:
  # ============================================================
  # SETUP: configure FLE field + initialize v1 FEK
  # ============================================================
- name: fleatomic-configure-secret
  description: Configure 'atomic_secret' field on AtomicRotUser with FLE key v1
  args:
  - query
  - "CALL geode.fle.configureField('AtomicRotUser', 'atomic_secret', { algorithm: 'AES-256-GCM', keyVersion: 1, visibility: ['admin'] }) RETURN 'configured_v1' AS status"
  expect:
    exit_code: 0
  tags: [fle, atomic, configure]

- name: fleatomic-init-fek-v1
  description: Initialize FEK v1 for AtomicRotUser.atomic_secret
  args:
  - fle
  - rotate-key
  - default
  - fek
  - AtomicRotUser
  - atomic_secret
  # SONNY-6386/6387: geode fle rotate-key is refused as unsupported (no key is rotated).
  expect:
    exit_code: 1
    stderr_contains: [not supported in this release (SONNY-6387)]
  tags: [fle, atomic, fek-init, v1]

  # ============================================================
  # SEED: insert 5 rows under key v1
  # ============================================================
- name: fleatomic-insert-row-1
  description: Insert row 1 under key v1
  args:
  - query
  - "CREATE (n:AtomicRotUser { row_id: 'AROT_001', atomic_secret: 'FLEATOMIC_V1_SECRET_kappa-001', version_hint: 'v1' }) RETURN n.row_id AS rid"
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
  tags: [fle, atomic, insert, v1]

- name: fleatomic-insert-row-2
  description: Insert row 2 under key v1
  args:
  - query
  - "CREATE (n:AtomicRotUser { row_id: 'AROT_002', atomic_secret: 'FLEATOMIC_V1_SECRET_kappa-002', version_hint: 'v1' }) RETURN n.row_id AS rid"
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
  tags: [fle, atomic, insert, v1]

- name: fleatomic-insert-row-3
  description: Insert row 3 under key v1
  args:
  - query
  - "CREATE (n:AtomicRotUser { row_id: 'AROT_003', atomic_secret: 'FLEATOMIC_V1_SECRET_kappa-003', version_hint: 'v1' }) RETURN n.row_id AS rid"
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
  tags: [fle, atomic, insert, v1]

- name: fleatomic-insert-row-4
  description: Insert row 4 under key v1
  args:
  - query
  - "CREATE (n:AtomicRotUser { row_id: 'AROT_004', atomic_secret: 'FLEATOMIC_V1_SECRET_kappa-004', version_hint: 'v1' }) RETURN n.row_id AS rid"
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
  tags: [fle, atomic, insert, v1]

- name: fleatomic-insert-row-5
  description: Insert row 5 under key v1
  args:
  - query
  - "CREATE (n:AtomicRotUser { row_id: 'AROT_005', atomic_secret: 'FLEATOMIC_V1_SECRET_kappa-005', version_hint: 'v1' }) RETURN n.row_id AS rid"
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
  tags: [fle, atomic, insert, v1]

  # ============================================================
  # PRE-ROTATION BASELINE: verify all 5 rows decrypt under v1
  # ============================================================
- name: fleatomic-pre-rotation-read-all
  description: BASELINE — all 5 rows readable before rotation begins
  args:
  - query
  - MATCH (n:AtomicRotUser) RETURN count(*) AS cnt
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
  tags: [fle, atomic, baseline, pre-rotation]

- name: fleatomic-pre-rotation-scan
  description: 'CRITICAL PRE-ROTATION: no plaintext markers on disk'
  command: grep
  args:
  - -r
  - -a
  - -l
  - --exclude=*.jsonl
  - --exclude-dir=timeseries
  - --exclude-dir=fts
  - --exclude-dir=wal
  - FLEATOMIC_V1_SECRET_
  - ${data_dir}
  expect:
    exit_code: 1
  tags: [fle, atomic, scan, pre-rotation, critical]

  # ============================================================
  # BEGIN ROTATION to v2, then SIGKILL mid-rotation
  # The rotation start and kill are combined in one bash step.
  # The fle rotate-key command initiates re-encryption of existing rows;
  # we send SIGKILL to the server process immediately after the CLI
  # command returns (or times out) to simulate mid-rotation failure.
  # ============================================================
- name: fleatomic-begin-rotation-v2
  description: |
    Initiate FEK rotation to v2. The CLI call itself may succeed or
    return a timeout/connection error if the server is killed during
    the operation. Either outcome is acceptable here — the important
    check happens after restart.
  args:
  - fle
  - rotate-key
  - default
  - fek
  - AtomicRotUser
  - atomic_secret
  # SONNY-6386/6387: geode fle rotate-key is refused as unsupported (no key is rotated).
  expect:
    exit_code: 1
    stderr_contains: [not supported in this release (SONNY-6387)]
  tags: [fle, atomic, rotation, v2]

  # ============================================================
  # CRASH INJECTION: restart server to simulate mid-rotation kill
  # We use the harness restart_server mechanism; the server gets
  # a clean restart so we can evaluate post-crash state.
  # For a harder failure, use the bash pkill approach commented below.
  # ============================================================
- name: fleatomic-crash-and-restart
  description: |
    Restart server to exercise recovery from a mid-rotation state.
    The restart_server: true flag stops and restarts the server
    against the same data directory, simulating the state after
    a SIGKILL would leave the process.
  type: bash
  command: echo 'Injecting restart to test atomic rotation recovery'
  restart_server: true
  expect:
    exit_code: 0
  tags: [fle, atomic, crash, restart]

  # ============================================================
  # POST-CRASH SCAN: no plaintext on disk regardless of outcome
  # ============================================================
- name: fleatomic-post-crash-scan
  description: 'CRITICAL POST-CRASH: no plaintext markers on disk after restart'
  command: grep
  args:
  - -r
  - -a
  - -l
  - --exclude=*.jsonl
  - --exclude-dir=timeseries
  - --exclude-dir=fts
  - --exclude-dir=wal
  - FLEATOMIC_V1_SECRET_
  - ${data_dir}
  expect:
    exit_code: 1
  tags: [fle, atomic, scan, post-crash, critical]

  # ============================================================
  # POST-CRASH READ: all rows must be decryptable (atomic outcome)
  # Each row must return a value — null/error indicates mixed state.
  # ============================================================
- name: fleatomic-post-crash-row-count
  description: |
    POST-CRASH — all 5 rows must still exist (no data loss).
    A row_count of 5 proves the recovery was complete.
  args:
  - query
  - MATCH (n:AtomicRotUser) RETURN count(*) AS cnt
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
  tags: [fle, atomic, post-crash, row-count, critical]

- name: fleatomic-post-crash-read-row-1
  description: POST-CRASH — row 1 must decrypt to a non-null value
  args:
  - query
  - "MATCH (n:AtomicRotUser {row_id: 'AROT_001'}) RETURN n.atomic_secret AS s"
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
      columns:
      - s
  tags: [fle, atomic, post-crash, read, row-1, critical]

- name: fleatomic-post-crash-read-row-3
  description: POST-CRASH — row 3 must decrypt to a non-null value
  args:
  - query
  - "MATCH (n:AtomicRotUser {row_id: 'AROT_003'}) RETURN n.atomic_secret AS s"
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
      columns:
      - s
  tags: [fle, atomic, post-crash, read, row-3, critical]

- name: fleatomic-post-crash-read-row-5
  description: POST-CRASH — row 5 must decrypt to a non-null value
  args:
  - query
  - "MATCH (n:AtomicRotUser {row_id: 'AROT_005'}) RETURN n.atomic_secret AS s"
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
      columns:
      - s
  tags: [fle, atomic, post-crash, read, row-5, critical]

  # ============================================================
  # ROTATION STATUS: confirm server reports a consistent state
  # ============================================================
- name: fleatomic-show-rotation-status-after-recovery
  description: fle show-rotation must report a definitive state (not 'in-progress') after recovery
  args:
  - fle
  - show-rotation
  - default
  expect:
    exit_code: 0
    stdout_contains:
    - FLE Key Rotation Status
    - default
    stdout_not_contains:
    - in_progress
  tags: [fle, atomic, rotation-status, post-crash]

invariants:
- type: server_running

plaintext_verification:
  enabled: true
  patterns:
  - FLEATOMIC_V1_SECRET_kappa-001
  - FLEATOMIC_V1_SECRET_kappa-002
  - FLEATOMIC_V1_SECRET_kappa-003
  - FLEATOMIC_V1_SECRET_kappa-004
  - FLEATOMIC_V1_SECRET_kappa-005
  - FLEATOMIC_V1_SECRET_
  fail_on_violation: true
  scan_binary_files: true

tags:
- fle
- field-level-encryption
- security
- key-rotation
- atomicity
- rollback
- plaintext-verification
- critical
- gap-0304
