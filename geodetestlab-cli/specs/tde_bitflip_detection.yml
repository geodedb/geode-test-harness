version: '1.0'
name: TDE — single-byte flip in encrypted page detected at read time (AES-GCM auth tag)
description: |
  Verifies that AES-256-GCM's authentication tag causes Geode to detect and
  reject a page whose ciphertext has been tampered with. A single-byte flip
  via dd in any encrypted data file invalidates the GCM tag; the subsequent
  read must return an error, not silently return corrupt (or plaintext) data.

  Scenario:
  1. Insert a sentinel node (BITFLIP_SENTINEL_NODE_XYZ).
  2. Identify the data files created/modified during the insert (via mtime
     marker placed before the write).
  3. Stop the server cleanly via restart_server: true.
  4. In a bash step (cwd = Geode source, but we use env vars for paths):
     a. Find the newest .dat or graph-store file under data dir.
     b. Flip one byte at offset 64 (past the GEOTDEFL magic header, into
        the ciphertext body) using dd conv=notrunc.
  5. The harness restarts the server (same data dir, post-flip).
  6. Query for the sentinel node: expect non-zero exit or error output.

  The spec accepts two outcomes from the post-flip read:
  - exit_code != 0 (server rejects the corrupted page and returns error), OR
  - exit_code == 0 but stdout does NOT contain the sentinel value
    (corruption detected, row silently absent — acceptable if the error is
    logged; the critical invariant is no silent ciphertext→plaintext fallback).

  IMPORTANT: If AES-GCM tag enforcement is not yet wired to the page reader,
  the spec will catch this: the query will succeed AND return the sentinel,
  which violates the stdout_not_contains assertion on the roundtrip check.

  CANARY: REQ=REQ-TDE-BITFLIP-001; FEATURE="TDE bit-flip detection"; ASPECT=AEADTagVerification; STATUS=TESTED; OWNER=security; UPDATED=2026-05-21

cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 60000
    cleanup: true
    args:
    - --log-level
    - warn
    - --enable-tde
    # SONNY-6422/6442: --enable-wal-encryption was removed; the WAL is encrypted by the engine under GEODE_TDE_KEY
    - --tde-provider
    - MockKms
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 30000
    format: json
env:
  GEODE_TDE_KEY: deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef
  # SONNY-6422: GEODE_WAL_KEY removed (server refuses it); the WAL is encrypted by GEODE_TDE_KEY
  GEODE_TDE_ENABLED: 'true'
  GEODE_WAL_ENCRYPTION_ENABLED: 'true'

tests:
- name: tde-bitflip-seed
  description: Insert the sentinel node whose page we will corrupt.
  args:
  - query
  - "CREATE (n:BitflipTest {sentinel: 'BITFLIP_SENTINEL_NODE_XYZ', created: 1}) RETURN n.sentinel AS s"
  expect:
    exit_code: 0
    stdout_contains: [BITFLIP_SENTINEL_NODE_XYZ]
  tags: [tde, bitflip, setup]

- name: tde-bitflip-plaintext-absent-before-flip
  description: 'CRITICAL: Sentinel absent from disk before flip.'
  command: grep
  args:
  - -r
  - -a
  - -l
  - --exclude=*.jsonl
  - --exclude-dir=timeseries
  - --exclude-dir=fts
  - BITFLIP_SENTINEL_NODE_XYZ
  - ${data_dir}
  expect:
    exit_code: 1
  tags: [tde, bitflip, grep]

- name: tde-bitflip-trigger-restart-pre-flip
  description: |
    Force a clean checkpoint + WAL flush before the file flip so pages are
    fully committed to disk and the WAL does not replay over our corruption.
  type: bash
  command: echo 'tde-bitflip pre-flip checkpoint'
  restart_server: true
  expect:
    exit_code: 0
  tags: [tde, bitflip, restart]

- name: tde-bitflip-verify-still-readable-before-flip
  description: Data readable after clean restart (baseline before corruption).
  args:
  - query
  - MATCH (n:BitflipTest) RETURN count(n) AS total
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
  tags: [tde, bitflip, baseline]

- name: tde-bitflip-detected-on-copies-of-the-data-dir
  description: |
    Bit flips in the at-rest store files are DETECTED; nothing corrupt (and no
    plaintext) is served. The engine refuses to start when the durable auth
    state (the __geode_security graph) is unreadable, so the old "managed
    restart on a flipped data dir" scenario cannot be expressed: the harness
    needs that restart to succeed. Instead every scenario below copies the
    (quiescent, cleanly checkpointed) data dir, flips ONE byte at offset 64 of
    every 8 KiB page of every non-empty store file of one kind of one graph
    (page 0 of a multi-page file is unused: only offsets in the pages that hold
    rows are authenticated), and starts `geode serve --data-dir <copy>` on it,
    with a bounded wait. Control: an uncorrupted copy starts and answers the
    sentinel query. Per-kind behaviours asserted (exact current text):
      default graph nodes/props/var.store -> the server starts; the graph is
        quarantined: 58000 GraphQuarantined, log DecryptionFailed (AES-GCM tag)
      default graph free.store -> 58000 "InvalidData: a record of the graph's
        stored data could not be decoded", log failed to open ShardedGraphEngine
      __geode_security free.store -> serve exits 1: "refusing to start without
        durable auth state", AuthGraphUnavailable
      __geode_security nodes.store -> login refused (exit 3): "Authentication
        temporarily unavailable" or "Authentication failed" (which of the two
        depends on the data dir layout; both are fail-closed refusals)
    In every corrupted scenario the sentinel is never returned and never on disk
    in plaintext.
  type: bash
  timeout_ms: 600000
  command: |
    SRC="${GEODE_DATA_DIR:-}"
    if [ -z "$SRC" ] || [ ! -d "$SRC" ]; then
      echo "FAIL: GEODE_DATA_DIR not available in bash step environment (got: '${SRC}')"
      exit 1
    fi
    BIN="${GEODE_BINARY:-geode}"
    PW="${GEODE_ADMIN_PASSWORD:-Geode Test Admin Passphrase}"
    export GEODE_TDE_KEY="${GEODE_TDE_KEY:-deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef}"
    export GEODE_ALLOW_TEST_AUDIT_KEYS=1 GEODE_ALLOW_INSECURE_TLS=1 GEODE_DISABLE_AUDIT=1
    W=$(mktemp -d)
    FAILS=0
    fail() { echo "FAIL: $*"; FAILS=$((FAILS+1)); }
    # The two graph dirs: the security graph is the one holding the audit keys.
    SEC=""; DEF=""
    for g in "$SRC"/*/; do
      g=$(basename "$g")
      [ -d "$SRC/$g/graphs" ] || continue
      if [ -f "$SRC/$g/audit.jsonl.pub" ]; then SEC="$g"; else DEF="$g"; fi
    done
    if [ -z "$SEC" ] || [ -z "$DEF" ]; then fail "cannot tell the security and default graph dirs apart (sec='$SEC' def='$DEF')"; fi
    cat > "$W/flip.py" <<'PY'
    import os, sys
    root, kind = sys.argv[1], sys.argv[2]
    n = 0
    for dp, _, fns in os.walk(root):
        for fn in fns:
            if fn != kind + ".store":
                continue
            p = os.path.join(dp, fn)
            sz = os.path.getsize(p)
            if sz < 128:
                continue
            with open(p, "r+b") as f:
                for off in range(64, sz, 8192):
                    f.seek(off); b = f.read(1); f.seek(off); f.write(bytes([b[0] ^ 0xFF]))
            n += 1
    print(n)
    PY
    port() { python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1",0)); print(s.getsockname()[1])'; }
    # scenario <name> <graph|NONE> <kind>; sets STATE (ready|exited|timeout), SRV_RC, QOUT, QRC, LOG
    scenario() {
      local name="$1" graph="$2" kind="$3" T P PORT i n
      T="$W/$name"; mkdir -p "$T"; cp -a "$SRC" "$T/d"; rm -f "$T/d/.geode.lock"
      if [ "$graph" != NONE ]; then
        n=$(python3 "$W/flip.py" "$T/d/$graph/graphs" "$kind")
        [ "${n:-0}" -ge 1 ] || fail "$name: no non-empty $kind.store file to corrupt in $graph"
      fi
      PORT=$(port); LOG="$T/log"
      timeout 40 "$BIN" serve --listen "127.0.0.1:${PORT}" --lsp-port=0 --data-dir "$T/d" --log-level warn >"$LOG" 2>&1 &
      P=$!
      STATE=timeout
      for i in $(seq 1 80); do
        sleep 0.5
        if ! kill -0 "$P" 2>/dev/null; then STATE=exited; break; fi
        if grep -q 'server ready' "$LOG"; then STATE=ready; break; fi
      done
      QOUT=""; QRC=""; SRV_RC=""
      if [ "$STATE" = ready ]; then
        QOUT=$("$BIN" query --server "127.0.0.1:${PORT}" --insecure-tls-skip-verify --no-saved-session --timeout 15 \
               -U geode -P "$PW" "MATCH (n:BitflipTest) RETURN n.sentinel AS s" 2>&1)
        QRC=$?
        kill "$P" 2>/dev/null; wait "$P" 2>/dev/null
      elif [ "$STATE" = exited ]; then
        wait "$P"; SRV_RC=$?
      else
        kill "$P" 2>/dev/null; wait "$P" 2>/dev/null
      fi
      if grep -a -r -l BITFLIP_SENTINEL_NODE_XYZ --exclude='*.jsonl' --exclude-dir=timeseries --exclude-dir=fts "$T/d" >/dev/null 2>&1; then
        fail "$name: sentinel found in plaintext on disk"
      fi
    }
    has() { printf '%s' "$1" | grep -a -q -E -- "$2"; }
    expect_ready_query() {  # <name> <qrc> <text-in-query-output> <text-in-log>
      if [ "$STATE" != ready ]; then fail "$1: server state '$STATE' (wanted ready)"; return; fi
      [ "$QRC" = "$2" ] || fail "$1: query exit $QRC (wanted $2): $QOUT"
      has "$QOUT" "$3" || fail "$1: query output lacks '$3': $QOUT"
      if has "$QOUT" BITFLIP_SENTINEL_NODE_XYZ; then fail "$1: sentinel served from corrupted store"; fi
      if [ -n "$4" ] && ! has "$(cat "$LOG")" "$4"; then fail "$1: log lacks '$4'"; fi
      echo "OK $1"
    }
    scenario control NONE x
    if [ "$STATE" = ready ] && [ "$QRC" = 0 ] && has "$QOUT" '"status_class":"00000"' && has "$QOUT" BITFLIP_SENTINEL_NODE_XYZ; then
      echo "OK control"
    else fail "control: uncorrupted copy did not start and answer (state=$STATE qrc=$QRC): $QOUT"; fi
    for k in nodes props var; do
      scenario "default-$k" "$DEF" "$k"
      expect_ready_query "default-$k" 1 'GraphQuarantined' 'DecryptionFailed'
    done
    scenario default-free "$DEF" free
    expect_ready_query default-free 1 "InvalidData: a record of the graph's stored data could not be decoded" \
      'failed to open ShardedGraphEngine for graph graph=default error=InvalidData'
    scenario security-free "$SEC" free
    if [ "$STATE" = exited ] && [ "$SRV_RC" = 1 ] && has "$(cat "$LOG")" 'refusing to start without durable auth state' && has "$(cat "$LOG")" 'error: AuthGraphUnavailable'; then
      echo "OK security-free"
    else fail "security-free: serve state=$STATE rc=$SRV_RC (wanted exited 1 with the durable-auth-state refusal): $(tail -c 600 "$LOG")"; fi
    scenario security-nodes "$SEC" nodes
    expect_ready_query security-nodes 3 'Authentication (temporarily unavailable|failed)' ''
    scenario security-props "$SEC" props
    expect_ready_query security-props 3 'Authentication (temporarily unavailable|failed)' 'graph=__geode_security error=DecryptionFailed'
    rm -rf "$W"
    if [ "$FAILS" -ne 0 ]; then echo "bitflip_failures=$FAILS"; exit 1; fi
    echo "bitflip_all_detected"
  expect:
    exit_code: 0
    stdout_contains:
    - OK control
    - OK default-nodes
    - OK default-props
    - OK default-var
    - OK default-free
    - OK security-free
    - OK security-nodes
    - OK security-props
    - bitflip_all_detected
  tags: [tde, bitflip, corrupt, detection, critical]

- name: tde-bitflip-plaintext-absent-after-flip
  description: 'CRITICAL: Sentinel must still not appear in plaintext on disk (no fallback write).'
  command: grep
  args:
  - -r
  - -a
  - -l
  - --exclude=*.jsonl
  - --exclude-dir=timeseries
  - --exclude-dir=fts
  - BITFLIP_SENTINEL_NODE_XYZ
  - ${data_dir}
  expect:
    exit_code: 1
  tags: [tde, bitflip, grep, critical]

invariants:
- type: server_running

plaintext_verification:
  enabled: true
  patterns:
  - BITFLIP_SENTINEL_NODE_XYZ
  fail_on_violation: true
  scan_binary_files: true

tags:
- tde
- bitflip-detection
- aes-gcm
- auth-tag
- security
- critical
- gap-0298
