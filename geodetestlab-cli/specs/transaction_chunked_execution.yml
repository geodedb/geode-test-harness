version: '1.0'
name: Transaction Handling with Chunked Execution
description: Black-box tests verifying transaction semantics across chunk boundaries
  in --file execution mode
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    startup_timeout_ms: 30000
    args:
    - --disable-auth
    - --insecure
    - --log-level
    - error
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
secrets: {}
invariants:
- type: server_running
fuzz:
  enabled: false
tests:
- name: setup-transaction-chunked-graph
  description: Create graph for transaction chunking tests
  args:
  - query
  - --insecure
  - CREATE GRAPH IF NOT EXISTS txn_chunked_test
  expect:
    exit_code: 0
  tags:
  - setup
- name: txn-within-single-chunk
  description: Transaction BEGIN and COMMIT within same chunk (< 32KB) should work
    normally
  setup:
    script: '#!/bin/bash

      cat > /tmp/geode_txn_single_chunk.gql << ''EOF''

      USE GRAPH txn_chunked_test;

      START TRANSACTION;

      CREATE (n:SingleChunk {id: 1, type: ''baseline''});

      CREATE (n:SingleChunk {id: 2, type: ''baseline''});

      CREATE (n:SingleChunk {id: 3, type: ''baseline''});

      COMMIT;

      EOF

      '
  args:
  - query
  - --insecure
  - --file
  - /tmp/geode_txn_single_chunk.gql
  expect:
    exit_code: 0
    stdout_not_contains:
    - Large file detected
    - chunked execution
  verify:
  - args:
    - query
    - --insecure
    - USE GRAPH txn_chunked_test; MATCH (n:SingleChunk) RETURN count(n) AS cnt
    expect:
      stdout_contains:
      - '3'
  cleanup:
  - - query
    - --insecure
    - USE GRAPH txn_chunked_test; MATCH (n:SingleChunk) DELETE n
  tags:
  - transaction
  - baseline
  - single-chunk
- name: txn-rollback-single-chunk
  description: Transaction ROLLBACK within single chunk should discard changes
  setup:
    script: '#!/bin/bash

      cat > /tmp/geode_txn_rollback_single.gql << ''EOF''

      USE GRAPH txn_chunked_test;

      START TRANSACTION;

      CREATE (n:RollbackSingle {id: 1, data: ''should-not-persist''});

      CREATE (n:RollbackSingle {id: 2, data: ''should-not-persist''});

      ROLLBACK;

      EOF

      '
  args:
  - query
  - --insecure
  - --file
  - /tmp/geode_txn_rollback_single.gql
  expect:
    exit_code: 0
  verify:
  - args:
    - query
    - --insecure
    - USE GRAPH txn_chunked_test; MATCH (n:RollbackSingle) RETURN count(n) AS cnt
    expect:
      stdout_contains:
      - '0'
  tags:
  - transaction
  - rollback
  - single-chunk
- name: txn-spanning-chunks-commit
  description: BEGIN in chunk 1, work in middle chunks, COMMIT in final chunk - all
    data should persist
  setup:
    script: "#!/bin/bash\ncat > /tmp/geode_txn_spanning_chunks.gql << 'EOF'\nUSE GRAPH\
      \ txn_chunked_test;\nSTART TRANSACTION;\nEOF\n# Generate enough CREATE statements\
      \ to span multiple 32KB chunks\nfor i in {1..1000}; do\n  echo \"CREATE (n:SpanningChunks\
      \ {id: $i, description: 'Transaction spanning multiple chunks with extended\
      \ property data to ensure chunking occurs. This tests transaction state persistence\
      \ across RUN_GQL requests on the same connection. Node $i.'});\" >> /tmp/geode_txn_spanning_chunks.gql\n\
      done\necho \"COMMIT;\" >> /tmp/geode_txn_spanning_chunks.gql\n"
  args:
  - query
  - --insecure
  - --file
  - /tmp/geode_txn_spanning_chunks.gql
  expect:
    exit_code: 0
  verify:
  - args:
    - query
    - --insecure
    - USE GRAPH txn_chunked_test; MATCH (n:SpanningChunks) RETURN count(n) AS cnt
    expect:
      stdout_contains:
      - '1000'
  cleanup:
  - - query
    - --insecure
    - USE GRAPH txn_chunked_test; MATCH (n:SpanningChunks) DELETE n
  tags:
  - transaction
  - chunked
  - spanning
  - commit
- name: txn-spanning-chunks-verify-all-data
  description: Verify specific nodes exist across chunk boundaries
  skip: true
  setup:
    script: "#!/bin/bash\ncat > /tmp/geode_txn_verify_data.gql << 'EOF'\nUSE GRAPH\
      \ txn_chunked_test;\nSTART TRANSACTION;\nEOF\nfor i in {1..800}; do\n  echo\
      \ \"CREATE (n:VerifyData {id: $i, chunk_marker: 'chunk-test', description: 'Extended\
      \ property to ensure file exceeds 32KB threshold for chunked execution testing.'});\"\
      \ >> /tmp/geode_txn_verify_data.gql\ndone\necho \"COMMIT;\" >> /tmp/geode_txn_verify_data.gql\n"
  args:
  - query
  - --insecure
  - --file
  - /tmp/geode_txn_verify_data.gql
  expect:
    exit_code: 0
  verify:
  - args:
    - query
    - --insecure
    - 'USE GRAPH txn_chunked_test; MATCH (n:VerifyData {id: 1}) RETURN n.id AS first'
    expect:
      stdout_contains:
      - '1'
  - args:
    - query
    - --insecure
    - 'USE GRAPH txn_chunked_test; MATCH (n:VerifyData {id: 400}) RETURN n.id AS middle'
    expect:
      stdout_contains:
      - '400'
  - args:
    - query
    - --insecure
    - 'USE GRAPH txn_chunked_test; MATCH (n:VerifyData {id: 800}) RETURN n.id AS last'
    expect:
      stdout_contains:
      - '800'
  cleanup:
  - - query
    - --insecure
    - USE GRAPH txn_chunked_test; MATCH (n:VerifyData) DELETE n
  tags:
  - transaction
  - chunked
  - verification
- name: txn-spanning-chunks-rollback
  description: BEGIN in chunk 1, work in chunks 2-3, ROLLBACK in chunk 4 - no data
    should persist
  skip: true
  setup:
    script: "#!/bin/bash\ncat > /tmp/geode_txn_rollback_chunks.gql << 'EOF'\nUSE GRAPH\
      \ txn_chunked_test;\nSTART TRANSACTION;\nEOF\nfor i in {1..1000}; do\n  echo\
      \ \"CREATE (n:RollbackChunks {id: $i, data: 'should-not-persist', description:\
      \ 'This data should not persist after rollback across chunks. Extended property\
      \ for chunking. Node $i.'});\" >> /tmp/geode_txn_rollback_chunks.gql\ndone\n\
      echo \"ROLLBACK;\" >> /tmp/geode_txn_rollback_chunks.gql\n"
  args:
  - query
  - --insecure
  - --file
  - /tmp/geode_txn_rollback_chunks.gql
  expect:
    exit_code: 0
  verify:
  - args:
    - query
    - --insecure
    - USE GRAPH txn_chunked_test; MATCH (n:RollbackChunks) RETURN count(n) AS cnt
    expect:
      stdout_contains:
      - '0'
  tags:
  - transaction
  - chunked
  - rollback
- name: txn-partial-failure-syntax-error
  description: Syntax error in middle chunk should cause transaction to fail
  setup:
    script: "#!/bin/bash\ncat > /tmp/geode_txn_partial_error.gql << 'EOF'\nUSE GRAPH\
      \ txn_chunked_test;\nSTART TRANSACTION;\nEOF\n# Create 400 valid statements\n\
      for i in {1..400}; do\n  echo \"CREATE (n:PartialFail {id: $i, description:\
      \ 'Valid statement before error with extended data.'});\" >> /tmp/geode_txn_partial_error.gql\n\
      done\n# Insert syntax error\necho \"CREATE (n:BadSyntax {id: INVALID SYNTAX\
      \ ERROR});\" >> /tmp/geode_txn_partial_error.gql\n# Create 400 more valid statements\n\
      for i in {401..800}; do\n  echo \"CREATE (n:PartialFail {id: $i, description:\
      \ 'Valid statement after error.'});\" >> /tmp/geode_txn_partial_error.gql\n\
      done\necho \"COMMIT;\" >> /tmp/geode_txn_partial_error.gql\n"
  args:
  - query
  - --insecure
  - --file
  - /tmp/geode_txn_partial_error.gql
  expect:
    exit_code:
    - 0
    - 1
  verify:
  - args:
    - query
    - --insecure
    - USE GRAPH txn_chunked_test; MATCH (n:PartialFail) RETURN count(n) AS cnt
    expect:
      stdout_contains:
      - '0'
  tags:
  - transaction
  - chunked
  - error
  - rollback
- name: txn-partial-failure-constraint-violation
  description: Constraint violation in middle chunk should fail transaction
  skip: true
  setup:
    script: "#!/bin/bash\ncat > /tmp/geode_txn_constraint_error.gql << 'EOF'\nUSE\
      \ GRAPH txn_chunked_test;\nCREATE (n:ConstraintTest {unique_id: 999, description:\
      \ 'Pre-existing node for constraint test'});\nSTART TRANSACTION;\nEOF\nfor i\
      \ in {1..500}; do\n  echo \"CREATE (n:ConstraintFail {id: $i, unique_id: $i,\
      \ description: 'Statement with unique ID to test constraint handling across\
      \ chunks.'});\" >> /tmp/geode_txn_constraint_error.gql\ndone\n# Try to create\
      \ duplicate unique_id (constraint violation)\necho \"CREATE (n:ConstraintFail\
      \ {id: 999, unique_id: 999, description: 'Duplicate unique_id'});\" >> /tmp/geode_txn_constraint_error.gql\n\
      for i in {501..800}; do\n  echo \"CREATE (n:ConstraintFail {id: $i, unique_id:\
      \ $i, description: 'Statement after constraint violation.'});\" >> /tmp/geode_txn_constraint_error.gql\n\
      done\necho \"COMMIT;\" >> /tmp/geode_txn_constraint_error.gql\n"
  args:
  - query
  - --insecure
  - --file
  - /tmp/geode_txn_constraint_error.gql
  expect:
    exit_code:
    - 0
    - 1
  verify:
  - args:
    - query
    - --insecure
    - USE GRAPH txn_chunked_test; MATCH (n:ConstraintFail) RETURN count(n) AS cnt
    expect:
      stdout_contains:
      - '0'
      - '800'
  cleanup:
  - - query
    - --insecure
    - USE GRAPH txn_chunked_test; MATCH (n:ConstraintTest) DELETE n
  - - query
    - --insecure
    - USE GRAPH txn_chunked_test; MATCH (n:ConstraintFail) DELETE n
  tags:
  - transaction
  - chunked
  - error
  - constraint
- name: txn-multiple-transactions-chunked
  description: Multiple complete transactions in one large file should all succeed
  skip: true
  setup:
    script: "#!/bin/bash\ncat > /tmp/geode_txn_multiple.gql << 'EOF'\nUSE GRAPH txn_chunked_test;\n\
      EOF\n# Transaction 1\necho \"START TRANSACTION;\" >> /tmp/geode_txn_multiple.gql\n\
      for i in {1..300}; do\n  echo \"CREATE (n:MultipleTxn1 {id: $i, txn: 1, description:\
      \ 'First transaction with extended data.'});\" >> /tmp/geode_txn_multiple.gql\n\
      done\necho \"COMMIT;\" >> /tmp/geode_txn_multiple.gql\n\n# Transaction 2\necho\
      \ \"START TRANSACTION;\" >> /tmp/geode_txn_multiple.gql\nfor i in {1..300};\
      \ do\n  echo \"CREATE (n:MultipleTxn2 {id: $i, txn: 2, description: 'Second\
      \ transaction with extended data.'});\" >> /tmp/geode_txn_multiple.gql\ndone\n\
      echo \"COMMIT;\" >> /tmp/geode_txn_multiple.gql\n\n# Transaction 3\necho \"\
      START TRANSACTION;\" >> /tmp/geode_txn_multiple.gql\nfor i in {1..300}; do\n\
      \  echo \"CREATE (n:MultipleTxn3 {id: $i, txn: 3, description: 'Third transaction\
      \ with extended data.'});\" >> /tmp/geode_txn_multiple.gql\ndone\necho \"COMMIT;\"\
      \ >> /tmp/geode_txn_multiple.gql\n"
  args:
  - query
  - --insecure
  - --file
  - /tmp/geode_txn_multiple.gql
  expect:
    exit_code: 0
  verify:
  - args:
    - query
    - --insecure
    - USE GRAPH txn_chunked_test; MATCH (n:MultipleTxn1) RETURN count(n) AS cnt
    expect:
      stdout_contains:
      - '300'
  - args:
    - query
    - --insecure
    - USE GRAPH txn_chunked_test; MATCH (n:MultipleTxn2) RETURN count(n) AS cnt
    expect:
      stdout_contains:
      - '300'
  - args:
    - query
    - --insecure
    - USE GRAPH txn_chunked_test; MATCH (n:MultipleTxn3) RETURN count(n) AS cnt
    expect:
      stdout_contains:
      - '300'
  cleanup:
  - - query
    - --insecure
    - USE GRAPH txn_chunked_test; MATCH (n) WHERE n:MultipleTxn1 OR n:MultipleTxn2
      OR n:MultipleTxn3 DELETE n
  tags:
  - transaction
  - chunked
  - multiple
- name: txn-multiple-mixed-success-failure
  description: Multiple transactions, some succeed, some fail - verify isolation
  setup:
    script: "#!/bin/bash\ncat > /tmp/geode_txn_mixed.gql << 'EOF'\nUSE GRAPH txn_chunked_test;\n\
      EOF\n# Transaction 1: Success\necho \"START TRANSACTION;\" >> /tmp/geode_txn_mixed.gql\n\
      for i in {1..200}; do\n  echo \"CREATE (n:MixedSuccess {id: $i, description:\
      \ 'Successful transaction data.'});\" >> /tmp/geode_txn_mixed.gql\ndone\necho\
      \ \"COMMIT;\" >> /tmp/geode_txn_mixed.gql\n\n# Transaction 2: Will fail\necho\
      \ \"START TRANSACTION;\" >> /tmp/geode_txn_mixed.gql\nfor i in {1..200}; do\n\
      \  echo \"CREATE (n:MixedFail {id: $i, description: 'This should not persist.'});\"\
      \ >> /tmp/geode_txn_mixed.gql\ndone\necho \"CREATE (n:BadNode {id: SYNTAX ERROR});\"\
      \ >> /tmp/geode_txn_mixed.gql\necho \"COMMIT;\" >> /tmp/geode_txn_mixed.gql\n"
  args:
  - query
  - --insecure
  - --file
  - /tmp/geode_txn_mixed.gql
  expect:
    exit_code:
    - 0
    - 1
  verify:
  - args:
    - query
    - --insecure
    - USE GRAPH txn_chunked_test; MATCH (n:MixedSuccess) RETURN count(n) AS cnt
    expect:
      stdout_contains:
      - '200'
  - args:
    - query
    - --insecure
    - USE GRAPH txn_chunked_test; MATCH (n:MixedFail) RETURN count(n) AS cnt
    expect:
      exit_code: 0
  cleanup:
  - - query
    - --insecure
    - USE GRAPH txn_chunked_test; MATCH (n:MixedSuccess) DELETE n
  tags:
  - transaction
  - chunked
  - multiple
  - isolation
- name: txn-auto-commit-chunked
  description: Statements without BEGIN/COMMIT should auto-commit per chunk
  skip: true
  setup:
    script: "#!/bin/bash\ncat > /tmp/geode_txn_autocommit.gql << 'EOF'\nUSE GRAPH\
      \ txn_chunked_test;\nEOF\n# No BEGIN/COMMIT - should auto-commit\nfor i in {1..1000};\
      \ do\n  echo \"CREATE (n:AutoCommit {id: $i, description: 'Auto-commit mode\
      \ statement with extended property data to trigger chunking.'});\" >> /tmp/geode_txn_autocommit.gql\n\
      done\n"
  args:
  - query
  - --insecure
  - --file
  - /tmp/geode_txn_autocommit.gql
  expect:
    exit_code: 0
  verify:
  - args:
    - query
    - --insecure
    - USE GRAPH txn_chunked_test; MATCH (n:AutoCommit) RETURN count(n) AS cnt
    expect:
      stdout_contains:
      - '1000'
  cleanup:
  - - query
    - --insecure
    - USE GRAPH txn_chunked_test; MATCH (n:AutoCommit) DELETE n
  tags:
  - transaction
  - auto-commit
  - chunked
- name: txn-auto-commit-partial-failure
  description: In auto-commit mode, error should not roll back previous auto-committed
    statements
  skip: true
  setup:
    script: "#!/bin/bash\ncat > /tmp/geode_txn_autocommit_fail.gql << 'EOF'\nUSE GRAPH\
      \ txn_chunked_test;\nEOF\n# First chunk of auto-commit statements (should succeed)\n\
      for i in {1..400}; do\n  echo \"CREATE (n:AutoCommitPartial {id: $i, description:\
      \ 'Auto-commit statement before error with extended data.'});\" >> /tmp/geode_txn_autocommit_fail.gql\n\
      done\n# Syntax error\necho \"CREATE (n:BadSyntax {id: INVALID});\" >> /tmp/geode_txn_autocommit_fail.gql\n\
      # More statements after error\nfor i in {401..800}; do\n  echo \"CREATE (n:AutoCommitPartial\
      \ {id: $i, description: 'Auto-commit after error.'});\" >> /tmp/geode_txn_autocommit_fail.gql\n\
      done\n"
  args:
  - query
  - --insecure
  - --file
  - /tmp/geode_txn_autocommit_fail.gql
  expect:
    exit_code:
    - 0
    - 1
  verify:
  - args:
    - query
    - --insecure
    - USE GRAPH txn_chunked_test; MATCH (n:AutoCommitPartial) RETURN count(n) AS cnt
    expect:
      stdout_contains:
      - '0'
      - '400'
  cleanup:
  - - query
    - --insecure
    - USE GRAPH txn_chunked_test; MATCH (n:AutoCommitPartial) DELETE n
  tags:
  - transaction
  - auto-commit
  - error
  - chunked
- name: txn-complex-operations-chunked
  description: Transaction with CREATE, MATCH, SET, DELETE across chunks
  skip: true
  setup:
    script: "#!/bin/bash\ncat > /tmp/geode_txn_complex.gql << 'EOF'\nUSE GRAPH txn_chunked_test;\n\
      START TRANSACTION;\nEOF\n# Create nodes\nfor i in {1..300}; do\n  echo \"CREATE\
      \ (n:ComplexOps {id: $i, value: 0, status: 'initial', description: 'Complex\
      \ operations test with extended data.'});\" >> /tmp/geode_txn_complex.gql\n\
      done\n# Update nodes\nfor i in {1..300}; do\n  echo \"MATCH (n:ComplexOps {id:\
      \ $i}) SET n.value = $i * 10, n.status = 'updated';\" >> /tmp/geode_txn_complex.gql\n\
      done\n# Delete some nodes\nfor i in {1..100}; do\n  echo \"MATCH (n:ComplexOps\
      \ {id: $i}) DELETE n;\" >> /tmp/geode_txn_complex.gql\ndone\necho \"COMMIT;\"\
      \ >> /tmp/geode_txn_complex.gql\n"
  args:
  - query
  - --insecure
  - --file
  - /tmp/geode_txn_complex.gql
  expect:
    exit_code: 0
  verify:
  - args:
    - query
    - --insecure
    - USE GRAPH txn_chunked_test; MATCH (n:ComplexOps) RETURN count(n) AS cnt
    expect:
      stdout_contains:
      - '200'
  - args:
    - query
    - --insecure
    - 'USE GRAPH txn_chunked_test; MATCH (n:ComplexOps {id: 150}) RETURN n.value AS
      val, n.status AS st'
    expect:
      stdout_contains:
      - '1500'
      - updated
  cleanup:
  - - query
    - --insecure
    - USE GRAPH txn_chunked_test; MATCH (n:ComplexOps) DELETE n
  tags:
  - transaction
  - chunked
  - complex
- name: txn-relationships-chunked
  description: Transaction creating nodes and relationships across chunks
  skip: true
  setup:
    script: "#!/bin/bash\ncat > /tmp/geode_txn_relationships.gql << 'EOF'\nUSE GRAPH\
      \ txn_chunked_test;\nSTART TRANSACTION;\nEOF\n# Create nodes\nfor i in {1..500};\
      \ do\n  echo \"CREATE (n:RelNode {id: $i, description: 'Node for relationship\
      \ test with extended data.'});\" >> /tmp/geode_txn_relationships.gql\ndone\n\
      # Create relationships\nfor i in {1..250}; do\n  j=$((i + 1))\n  echo \"MATCH\
      \ (a:RelNode {id: $i}), (b:RelNode {id: $j}) CREATE (a)-[:CONNECTS {weight:\
      \ $i}]->(b);\" >> /tmp/geode_txn_relationships.gql\ndone\necho \"COMMIT;\" >>\
      \ /tmp/geode_txn_relationships.gql\n"
  args:
  - query
  - --insecure
  - --file
  - /tmp/geode_txn_relationships.gql
  expect:
    exit_code: 0
  verify:
  - args:
    - query
    - --insecure
    - USE GRAPH txn_chunked_test; MATCH (n:RelNode) RETURN count(n) AS cnt
    expect:
      stdout_contains:
      - '500'
  - args:
    - query
    - --insecure
    - USE GRAPH txn_chunked_test; MATCH ()-[r:CONNECTS]->() RETURN count(r) AS cnt
    expect:
      stdout_contains:
      - '250'
  cleanup:
  - - query
    - --insecure
    - USE GRAPH txn_chunked_test; MATCH (n:RelNode) DETACH DELETE n
  tags:
  - transaction
  - chunked
  - relationships
- name: txn-exactly-32kb-boundary
  description: Transaction file exactly at 32KB threshold
  setup:
    script: "#!/bin/bash\n# Calculate to get close to 32KB (32768 bytes)\ncat > /tmp/geode_txn_32kb.gql\
      \ << 'EOF'\nUSE GRAPH txn_chunked_test;\nSTART TRANSACTION;\nEOF\n# Each statement\
      \ ~160 bytes, so ~200 statements = ~32KB\nfor i in {1..200}; do\n  echo \"CREATE\
      \ (n:Boundary32KB {id: $i, data: 'exactly-32kb-test-value-with-padding-to-reach-threshold-abcdefghijklmnopqrstuvwxyz'});\"\
      \ >> /tmp/geode_txn_32kb.gql\ndone\necho \"COMMIT;\" >> /tmp/geode_txn_32kb.gql\n"
  args:
  - query
  - --insecure
  - --file
  - /tmp/geode_txn_32kb.gql
  expect:
    exit_code: 0
  verify:
  - args:
    - query
    - --insecure
    - USE GRAPH txn_chunked_test; MATCH (n:Boundary32KB) RETURN count(n) AS cnt
    expect:
      stdout_contains:
      - '200'
  cleanup:
  - - query
    - --insecure
    - USE GRAPH txn_chunked_test; MATCH (n:Boundary32KB) DELETE n
  tags:
  - transaction
  - chunked
  - boundary
- name: txn-empty-transaction-chunked
  description: Empty transaction (BEGIN immediately followed by COMMIT) in chunked
    file
  setup:
    script: "#!/bin/bash\ncat > /tmp/geode_txn_empty.gql << 'EOF'\nUSE GRAPH txn_chunked_test;\n\
      EOF\n# First real transaction\necho \"START TRANSACTION;\" >> /tmp/geode_txn_empty.gql\n\
      for i in {1..300}; do\n  echo \"CREATE (n:EmptyTxnTest {id: $i, description:\
      \ 'Before empty transaction.'});\" >> /tmp/geode_txn_empty.gql\ndone\necho \"\
      COMMIT;\" >> /tmp/geode_txn_empty.gql\n\n# Empty transaction\necho \"START TRANSACTION;\"\
      \ >> /tmp/geode_txn_empty.gql\necho \"COMMIT;\" >> /tmp/geode_txn_empty.gql\n\
      \n# Another real transaction\necho \"START TRANSACTION;\" >> /tmp/geode_txn_empty.gql\n\
      for i in {301..600}; do\n  echo \"CREATE (n:EmptyTxnTest {id: $i, description:\
      \ 'After empty transaction.'});\" >> /tmp/geode_txn_empty.gql\ndone\necho \"\
      COMMIT;\" >> /tmp/geode_txn_empty.gql\n"
  args:
  - query
  - --insecure
  - --file
  - /tmp/geode_txn_empty.gql
  expect:
    exit_code: 0
  verify:
  - args:
    - query
    - --insecure
    - USE GRAPH txn_chunked_test; MATCH (n:EmptyTxnTest) RETURN count(n) AS cnt
    expect:
      stdout_contains:
      - '600'
  cleanup:
  - - query
    - --insecure
    - USE GRAPH txn_chunked_test; MATCH (n:EmptyTxnTest) DELETE n
  tags:
  - transaction
  - chunked
  - edge-case
- name: txn-very-large-transaction
  description: Very large transaction (5000 statements) spanning many chunks
  skip: true
  setup:
    script: "#!/bin/bash\ncat > /tmp/geode_txn_very_large.gql << 'EOF'\nUSE GRAPH\
      \ txn_chunked_test;\nSTART TRANSACTION;\nEOF\nfor i in {1..5000}; do\n  echo\
      \ \"CREATE (n:VeryLarge {id: $i, description: 'Very large transaction test with\
      \ extended property data.'});\" >> /tmp/geode_txn_very_large.gql\ndone\necho\
      \ \"COMMIT;\" >> /tmp/geode_txn_very_large.gql\n"
  args:
  - query
  - --insecure
  - --file
  - /tmp/geode_txn_very_large.gql
  expect:
    exit_code: 0
  verify:
  - args:
    - query
    - --insecure
    - USE GRAPH txn_chunked_test; MATCH (n:VeryLarge) RETURN count(n) AS cnt
    expect:
      stdout_contains:
      - '5000'
  - args:
    - query
    - --insecure
    - 'USE GRAPH txn_chunked_test; MATCH (n:VeryLarge {id: 1}) RETURN n.id AS first'
    expect:
      stdout_contains:
      - '1'
  - args:
    - query
    - --insecure
    - 'USE GRAPH txn_chunked_test; MATCH (n:VeryLarge {id: 2500}) RETURN n.id AS middle'
    expect:
      stdout_contains:
      - '2500'
  - args:
    - query
    - --insecure
    - 'USE GRAPH txn_chunked_test; MATCH (n:VeryLarge {id: 5000}) RETURN n.id AS last'
    expect:
      stdout_contains:
      - '5000'
  cleanup:
  - - query
    - --insecure
    - USE GRAPH txn_chunked_test; MATCH (n:VeryLarge) DELETE n
  tags:
  - transaction
  - chunked
  - stress
- name: cleanup-transaction-chunked-graph
  description: Drop transaction chunked test graph
  args:
  - query
  - --insecure
  - DROP GRAPH IF EXISTS txn_chunked_test
  expect:
    exit_code: 0
  tags:
  - cleanup
- name: cleanup-transaction-temp-files
  description: 'Note: Temporary files in /tmp will be cleaned up by OS'
  skip: true
  tags:
  - cleanup
