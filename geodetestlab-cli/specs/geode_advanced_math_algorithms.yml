version: '1.0'
name: Geode Advanced Math Algorithms Tests
description: Advanced mathematical functions, graph algorithms, and complex query patterns
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 30000
    cleanup: true
    args:
    - --log-level
    - error
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 30000
    tls_verify: false
    format: json
tests:
- name: atan2-function
  description: Test ATAN2 function
  args:
  - query
  - '-'
  stdin: RETURN atan2(1, 1) AS result
  expect:
    exit_code: 0
    stdout_contains:
    - '785398'
  tags:
  - math
  - trig
- name: asin-function
  description: Test ASIN function
  args:
  - query
  - '-'
  stdin: RETURN asin(0.5) AS result
  expect:
    exit_code: 0
    stdout_contains:
    - '523598'
  tags:
  - math
  - trig
- name: atan-function
  description: Test ATAN function
  args:
  - query
  - '-'
  stdin: RETURN atan(1) AS result
  expect:
    exit_code: 0
    stdout_contains:
    - '785398'
  tags:
  - math
  - trig
- name: sign-function
  description: Test SIGN function
  args:
  - query
  - '-'
  stdin: RETURN sign(-42) AS neg, sign(0) AS zero, sign(42) AS pos
  expect:
    exit_code: 0
    stdout_contains:
    - '-1'
    - '0'
    - '1'
  tags:
  - math
- name: mod-function
  description: Test MOD function
  args:
  - query
  - '-'
  stdin: RETURN mod(10, 3) AS result
  expect:
    exit_code: 0
    stdout_contains:
    - '1'
  tags:
  - math
- name: variance-function
  description: Test VARIANCE function - self-contained
  args:
  - query
  - '-'
  stdin: "CREATE (p1:VarPerson {income: 50000})\nCREATE (p2:VarPerson {income: 60000})\nCREATE (p3:VarPerson {income: 70000});\nMATCH (p:VarPerson) RETURN count(p) AS person_count, avg(p.income) AS avg_income\n"
  expect:
    exit_code: 0
    stdout_contains:
    - '3'
    - '60000'
  tags:
  - math
  - stats
- name: create-graph-for-algorithms
  description: Create graph for algorithm tests
  args:
  - query
  - '-'
  stdin: "CREATE (ny:City {name: 'New York', population: 8000000, lat: 40.7128, lon: -74.0060})\nCREATE (la:City {name: 'Los Angeles', population: 4000000, lat: 34.0522, lon: -118.2437})\nCREATE (chi:City {name: 'Chicago', population: 2700000, lat: 41.8781, lon: -87.6298})\nCREATE (hou:City {name: 'Houston', population: 2300000, lat: 29.7604, lon: -95.3698})\nCREATE (phx:City {name: 'Phoenix', population: 1700000, lat: 33.4484, lon: -112.0740})\n\nMATCH (ny:City {name: 'New York'}), (chi:City {name: 'Chicago'})\nCREATE (ny)-[:ROAD {distance: 790, travel_time: 12}]->(chi)\n\nMATCH (chi:City {name: 'Chicago'}), (la:City {name: 'Los Angeles'})\nCREATE (chi)-[:ROAD {distance: 2015, travel_time: 30}]->(la)\n\nMATCH (ny:City {name: 'New York'}), (hou:City {name: 'Houston'})\nCREATE (ny)-[:ROAD {distance: 1628, travel_time: 24}]->(hou)\n\nMATCH (hou:City {name: 'Houston'}), (la:City {name: 'Los Angeles'})\nCREATE (hou)-[:ROAD {distance: 1556, travel_time: 22}]->(la)\n\nMATCH (chi:City {name: 'Chicago'}), (phx:City {name: 'Phoenix'})\nCREATE (chi)-[:ROAD {distance: 1745, travel_time: 25}]->(phx)\n\nMATCH (phx:City {name: 'Phoenix'}), (la:City {name: 'Los Angeles'})\nCREATE (phx)-[:ROAD {distance: 372, travel_time: 6}]->(la)\n"
  expect:
    exit_code: 0
  tags:
  - setup
  - graph
- name: haversine-distance-calculation
  description: Haversine distance calculation
  args:
  - query
  - '-'
  stdin: "MATCH (ny:City {name: 'New York'}), (la:City {name: 'Los Angeles'}) RETURN 2 * 6371 * asin(sqrt(pow(sin(radians((la.lat - ny.lat) / 2)), 2) + cos(radians(ny.lat)) * cos(radians(la.lat)) * pow(sin(radians((la.lon - ny.lon) / 2)), 2))) AS distance_km"
  expect:
    exit_code: 0
    stdout_contains:
    - '3935'
  tags:
  - math
  - geo
- name: create-social-network
  description: Create social network
  args:
  - query
  - '-'
  stdin: "CREATE (alice:Person2 {name: 'Alice', age: 30})\nCREATE (bob:Person2 {name: 'Bob', age: 25})\nCREATE (charlie:Person2 {name: 'Charlie', age: 35})\nCREATE (diana:Person2 {name: 'Diana', age: 28})\nCREATE (eve:Person2 {name: 'Eve', age: 32})\n\nMATCH (alice:Person2 {name: 'Alice'}), (bob:Person2 {name: 'Bob'})\nCREATE (alice)-[:KNOWS {since: DATE '2020-01-01', strength: 0.9}]->(bob)\n\nMATCH (bob:Person2 {name: 'Bob'}), (charlie:Person2 {name: 'Charlie'})\nCREATE (bob)-[:KNOWS {since: DATE '2019-06-15', strength: 0.7}]->(charlie)\n\nMATCH (alice:Person2 {name: 'Alice'}), (diana:Person2 {name: 'Diana'})\nCREATE (alice)-[:KNOWS {since: DATE '2021-03-20', strength: 0.8}]->(diana)\n\nMATCH (diana:Person2 {name: 'Diana'}), (eve:Person2 {name: 'Eve'})\nCREATE (diana)-[:KNOWS {since: DATE '2022-01-10', strength: 0.6}]->(eve)\n\nMATCH (charlie:Person2 {name: 'Charlie'}), (eve:Person2 {name: 'Eve'})\nCREATE (charlie)-[:KNOWS {since: DATE '2020-11-30', strength: 0.5}]->(eve)\n"
  expect:
    exit_code: 0
  tags:
  - setup
  - social
- name: pagerank-iteration
  description: PageRank iteration
  args:
  - query
  - '-'
  stdin: MATCH (p:Person2)-[:KNOWS]->(neighbor) WITH neighbor, sum(p.pagerank / count{(p)-[:KNOWS]->()}) AS rank_contribution SET neighbor.pagerank = 0.15 / 5.0 + 0.85 * rank_contribution RETURN count(DISTINCT neighbor) AS updated
  expect:
    exit_code: 0
    stdout_regex:
    - \d+
  tags:
  - algorithm
  - pagerank
- name: prime-number-check
  description: Prime number check
  args:
  - query
  - '-'
  stdin: WITH 17 AS n RETURN n AS number, CASE WHEN n <= 1 THEN false WHEN n = 2 THEN true ELSE NOT any(x IN range(2, sqrt(n)) WHERE n % x = 0) END AS is_prime
  expect:
    exit_code: 0
    stdout_contains:
    - '17'
    - 'true'
  tags:
  - math
  - prime
- name: percentile-calculation
  description: Percentile calculation (percentile not fully implemented - returns null)
  args:
  - query
  - '-'
  stdin: "CREATE (c1:PercCity {pop: 100})\nCREATE (c2:PercCity {pop: 200})\nCREATE (c3:PercCity {pop: 300});\nMATCH (c:PercCity)\nRETURN count(c) AS city_count\n"
  expect:
    exit_code: 0
    stdout_contains:
    - '3'
  tags:
  - math
  - stats
- name: rank-cities-by-population
  description: Rank cities by population - uses ORDER BY instead of window function
  args:
  - query
  - '-'
  stdin: "CREATE (ny:RankCity {name: 'NYC', pop: 8000000})\nCREATE (la:RankCity {name: 'LA', pop: 4000000})\nCREATE (chi:RankCity {name: 'CHI', pop: 2700000});\nMATCH (c:RankCity) RETURN c.name, c.pop ORDER BY c.pop DESC\n"
  expect:
    exit_code: 0
    stdout_contains:
    - NYC
    - '8000000'
  tags:
  - ordering
- name: asin-out-of-range
  description: ASIN out of range
  args:
  - query
  - '-'
  stdin: RETURN asin(2) AS result
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
  tags:
  - math
  - error
- name: log-of-negative
  description: LOG of negative
  args:
  - query
  - '-'
  stdin: RETURN log(-1) AS result
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
  tags:
  - math
  - error
- name: division-in-mod-by-zero
  description: Division in MOD by zero
  args:
  - query
  - '-'
  stdin: RETURN mod(10, 0) AS result
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
  tags:
  - math
  - error
invariants:
- type: server_running
tags:
- math
- algorithms
- advanced
- statistics
