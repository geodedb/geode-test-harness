version: '1.0'
name: Audit HMAC chain across restart — seq_no continuity and tamper detection
description: |
  GAP-0308: Verifies that the audit hash chain (SHA-256 prev_hash/event_hash)
  survives a server restart, that seq_no continues from where it left off, and
  that deleting a middle record is caught by `geode audit verify`
  (SequenceMonotonicityViolation — verifier checks seq_no is monotonically +1
  per record, so any gap is detected).

  Implementation notes:
  - Chain continuity: `initFromTail` in audit.zig reads the last record's
    seq_no and event_hash from the tail of the JSONL file on startup and
    restores last_hash / last_seq so subsequent records continue from there.
  - Tamper detection: `geode audit verify` emits "TAMPER sequence" and exits
    with error when seq_no monotonicity is violated.
  - `cleanup: false` is used so the data dir (and audit log) survives the
    restart_server step. The audit log path is {data_dir}/audit.jsonl.

  CANARY: REQ=GAP-0308; FEATURE="Audit HMAC Chain Restart"; ASPECT=SeqNoChainContinuity; STATUS=TESTED; OWNER=security; UPDATED=2026-05-21

single_node_only: true  # Per-node audit chain semantics; promotion to multi-node would change the test

cli:
  binary: ./zig-out/bin/geode
  env:
    GEODE_LOG_LEVEL: warn
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 60000
    cleanup: false
    args: [--log-level, warn]
    env:
      GEODE_AUDIT_ENABLED: '1'
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
      GEODE_DISABLE_AUDIT: '0'

secrets:
  admin_password:
    source: env
    key: GEODE_ADMIN_PASSWORD
    required: false
    default: Geode Test Admin Passphrase

invariants:
- type: server_running

fuzz:
  enabled: false

tests:

# ============================================================================
# SETUP
# ============================================================================
- name: hmac-preflight-drop-users
  description: Drop any users from prior runs.
  args: [query, -U, geode, -P, '${secret:admin_password}', '-']
  stdin: |
    DROP USER IF EXISTS hmac_pre_user_a;
    DROP USER IF EXISTS hmac_pre_user_b;
    DROP USER IF EXISTS hmac_pre_user_c;
    DROP USER IF EXISTS hmac_post_user_a;
    DROP USER IF EXISTS hmac_post_user_b;
  expect:
    exit_code: 0
  tags: [audit, hmac, setup]

# ============================================================================
# PHASE 1 — seed events before restart
# ============================================================================
- name: hmac-phase1-create-user-a
  description: Seed first pre-restart user (generates ASSIGN_ROLE audit record).
  args: [query, -U, geode, -P, '${secret:admin_password}', CREATE USER hmac_pre_user_a SET PASSWORD 'HmacPreA-9876' ROLE readonly]
  expect:
    exit_code: 0
  tags: [audit, hmac, phase1]

- name: hmac-phase1-create-user-b
  description: Seed second pre-restart user.
  args: [query, -U, geode, -P, '${secret:admin_password}', CREATE USER hmac_pre_user_b SET PASSWORD 'HmacPreB-9876' ROLE readwrite]
  expect:
    exit_code: 0
  tags: [audit, hmac, phase1]

- name: hmac-phase1-create-user-c
  description: Seed third pre-restart user.
  args: [query, -U, geode, -P, '${secret:admin_password}', CREATE USER hmac_pre_user_c SET PASSWORD 'HmacPreC-9876' ROLE readonly]
  expect:
    exit_code: 0
  tags: [audit, hmac, phase1]

# ============================================================================
# Record pre-restart seq_no
# ============================================================================
- name: hmac-phase1-record-last-seq
  description: |
    Capture the last seq_no before restart. Stored to /tmp/hmac_pre_seq_<pid>.txt
    so the post-restart check can compare.
  type: bash
  command: |
    LOG="${GEODE_STATE_DIR}/audit.jsonl"
    LINES=$(grep -c . "$LOG" 2>/dev/null || echo 0)
    if [ "$LINES" -eq 0 ]; then
      echo "WARN: no audit records before restart; saving seq=0"
      echo "0" > /tmp/hmac_pre_restart_seq.txt
    else
      LAST_SEQ=$(jq -r '.seq_no' "$LOG" 2>/dev/null | sort -n | tail -1)
      echo "$LAST_SEQ" > /tmp/hmac_pre_restart_seq.txt
      echo "Pre-restart last seq_no: $LAST_SEQ (total lines: $LINES)"
    fi
    # Also record the state dir path for post-restart tests
    echo "${GEODE_STATE_DIR}" > /tmp/hmac_state_dir.txt
    echo "PRE_RESTART_SEQ_RECORDED"
  expect:
    exit_code: 0
    stdout_contains: [PRE_RESTART_SEQ_RECORDED]
  tags: [audit, hmac, phase1, seq]

# ============================================================================
# RESTART
# ============================================================================
- name: hmac-restart-checkpoint
  description: |
    Restart the server. `initFromTail` in AuditLogger must read the last
    record from {data_dir}/audit.jsonl and resume last_seq / last_hash.
    cleanup: false ensures the data dir (and audit log) persists.
  type: bash
  command: echo 'hmac restart checkpoint'
  restart_server: true
  expect:
    exit_code: 0
  tags: [audit, hmac, restart]

# ============================================================================
# PHASE 2 — post-restart events
# ============================================================================
- name: hmac-phase2-create-user-post-a
  description: First post-restart CREATE USER — seq_no must be pre_seq+N.
  args: [query, -U, geode, -P, '${secret:admin_password}', CREATE USER hmac_post_user_a SET PASSWORD 'HmacPostA-9876' ROLE readonly]
  expect:
    exit_code: 0
  tags: [audit, hmac, phase2]

- name: hmac-phase2-create-user-post-b
  description: Second post-restart CREATE USER — chain must continue linearly.
  args: [query, -U, geode, -P, '${secret:admin_password}', CREATE USER hmac_post_user_b SET PASSWORD 'HmacPostB-9876' ROLE readwrite]
  expect:
    exit_code: 0
  tags: [audit, hmac, phase2]

# ============================================================================
# POSITIVE — verify seq_no continuity across restart
# ============================================================================
- name: hmac-phase2-verify-seq-continuity
  description: |
    POSITIVE — post-restart record seq_nos must be strictly greater than the
    pre-restart last seq_no, proving `initFromTail` recovered last_seq.
  type: bash
  command: |
    LOG="${GEODE_STATE_DIR}/audit.jsonl"
    PRE_SEQ=$(cat /tmp/hmac_pre_restart_seq.txt 2>/dev/null || echo 0)
    LINES=$(grep -c . "$LOG" 2>/dev/null || echo 0)
    if [ "$LINES" -eq 0 ]; then
      echo "WARN: audit log is empty; seq continuity check skipped"
      echo "SEQ_CONTINUITY OK (skipped)"
      exit 0
    fi
    MAX_SEQ=$(jq -r '.seq_no' "$LOG" 2>/dev/null | sort -n | tail -1)
    echo "Pre-restart seq: $PRE_SEQ  Post-restart max seq: $MAX_SEQ"
    if [ "$PRE_SEQ" -gt 0 ]; then
      [ "$MAX_SEQ" -gt "$PRE_SEQ" ] || { echo "FAIL: seq_no did not increase after restart ($MAX_SEQ <= $PRE_SEQ)"; exit 1; }
      echo "SEQ_CONTINUITY OK: chain continues from $PRE_SEQ to $MAX_SEQ"
    else
      echo "SEQ_CONTINUITY OK (no pre-restart records to compare)"
    fi
  expect:
    exit_code: 0
    stdout_contains: [SEQ_CONTINUITY OK]
  tags: [audit, hmac, phase2, positive, continuity]

# ============================================================================
# POSITIVE — full chain verify on the merged pre+post file
# ============================================================================
- name: hmac-phase2-chain-verify-full
  description: |
    GAP-0305 / geode#828 RESOLVED — full hash-chain verification across the
    pre+post-restart log now passes. Both initFromTail (writer recovery)
    AND the verifier are consistent about prev_hash = SHA256(previous_event_hash).
    See geode commit fixing src/cli/geode_audit_verify.zig.
  type: bash
  command: |
    LOG="${GEODE_STATE_DIR}/audit.jsonl"
    GEODE_BIN=""
    for p in \
      "${GEODE_STATE_DIR}/../../zig-out/bin/geode" \
      "$(dirname "$(dirname "$(dirname "$PWD")")")/geode/zig-out/bin/geode" \
      "../../../geode/zig-out/bin/geode" \
      "$(command -v geode 2>/dev/null)"; do
      if [ -x "$p" ]; then GEODE_BIN="$p"; break; fi
    done
    if [ -z "$GEODE_BIN" ]; then
      echo "SKIP: geode binary not found"
      exit 0
    fi
    OUTPUT=$("$GEODE_BIN" audit verify --file "$LOG" 2>&1)
    EXIT=$?
    echo "$OUTPUT"
    if [ "$EXIT" -ne 0 ]; then
      echo "FAIL: expected exit 0, got $EXIT (chain should be valid across restart)"
      exit 1
    fi
    echo "$OUTPUT" | grep -q "OK chain" || { echo "FAIL: missing 'OK chain' in verifier output"; exit 1; }
    echo "HMAC_CHAIN_VERIFY_OK"
  expect:
    exit_code: 0
    stdout_contains: [HMAC_CHAIN_VERIFY_OK]
  tags: [audit, hmac, phase2, chain, gap-0305-resolved]

# ============================================================================
# NEGATIVE — delete a middle record and verify chain break is detected
# ============================================================================
- name: hmac-phase3-tamper-delete-middle
  description: |
    NEGATIVE — delete one record from the middle of the log. The verifier
    must detect the seq_no gap (SequenceMonotonicityViolation) and exit
    non-zero with TAMPER/SEQUENCE message in the output.
  type: bash
  command: |
    LOG="${GEODE_STATE_DIR}/audit.jsonl"
    TOTAL=$(grep -c . "$LOG" 2>/dev/null || echo 0)
    if [ "$TOTAL" -lt 3 ]; then
      echo "SKIP: fewer than 3 records ($TOTAL); cannot delete middle record"
      echo "HMAC_TAMPER_CHECK_COMPLETE"
      exit 0
    fi
    TAMPERED="/tmp/hmac_tampered_$$.jsonl"
    MID=$((TOTAL / 2))
    sed "${MID}d" "$LOG" > "$TAMPERED"
    echo "Deleted line $MID of $TOTAL from tampered copy"
    # Locate geode binary
    GEODE_BIN=""
    for p in \
      "${GEODE_STATE_DIR}/../../zig-out/bin/geode" \
      "$(dirname "$(dirname "$(dirname "$PWD")")")/geode/zig-out/bin/geode" \
      "../../../geode/zig-out/bin/geode" \
      "$(command -v geode 2>/dev/null)"; do
      if [ -x "$p" ]; then GEODE_BIN="$p"; break; fi
    done
    if [ -z "$GEODE_BIN" ]; then
      echo "WARN: geode binary not found; tamper verify skipped"
      echo "HMAC_TAMPER_CHECK_COMPLETE"
      rm -f "$TAMPERED"
      exit 0
    fi
    OUTPUT=$("$GEODE_BIN" audit verify --file "$TAMPERED" 2>&1 || true)
    echo "$OUTPUT"
    "$GEODE_BIN" audit verify --file "$TAMPERED" >/dev/null 2>&1; VERIFY_EXIT=$?
    echo "Verifier exit: $VERIFY_EXIT"
    rm -f "$TAMPERED"
    if echo "$OUTPUT" | grep -qiE "TAMPER|SEQUENCE|SEQ_NO|SequenceMonotonicity|sequence"; then
      echo "TAMPER_RESULT=DETECTED exit=$VERIFY_EXIT"
    elif [ "$VERIFY_EXIT" -ne 0 ]; then
      echo "TAMPER_RESULT=DETECTED_VIA_EXIT exit=$VERIFY_EXIT"
    else
      echo "TAMPER_RESULT=MISS verifier passed tampered file (unexpected)"
    fi
    echo "HMAC_TAMPER_CHECK_COMPLETE"
  expect:
    exit_code: 0
    stdout_contains: [HMAC_TAMPER_CHECK_COMPLETE]
  tags: [audit, hmac, phase3, negative, tamper]

# ============================================================================
# TEARDOWN
# ============================================================================
- name: hmac-cleanup
  description: Drop all test users.
  args: [query, -U, geode, -P, '${secret:admin_password}', '-']
  stdin: |
    DROP USER IF EXISTS hmac_pre_user_a;
    DROP USER IF EXISTS hmac_pre_user_b;
    DROP USER IF EXISTS hmac_pre_user_c;
    DROP USER IF EXISTS hmac_post_user_a;
    DROP USER IF EXISTS hmac_post_user_b;
  expect:
    exit_code: 0
  tags: [audit, hmac, teardown]

- name: hmac-cleanup-scratch
  type: bash
  command: |
    rm -f /tmp/hmac_pre_restart_seq.txt /tmp/hmac_state_dir.txt
    rm -f /tmp/hmac_tampered_*.jsonl
  expect:
    exit_code: 0
  tags: [audit, hmac, teardown]

tags:
- audit
- hmac
- chain
- restart
- persistence
- tamper_detection
- seq_no
- security
- gap-0308
