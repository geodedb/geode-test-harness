- name: seed-create-index-rg12-k
  description: |
    CREATE INDEX on RG12_P.k using the FOR (n:Label) ON (n.prop) form,
    probed to succeed against a scratch server on this build.
  query: "CREATE INDEX rg12_p_k_idx FOR (n:RG12_P) ON (n.k)"
  expected:
    exit_code: 0
  tags: [index-reload, reopen, setup]

- name: warm-eq-seek-before-restart
  description: |
    Warm check before restart — WHERE n.k='key42' RETURN n.grp must be
    correct (key42 -> grp 42 mod 5 = 2).
  query: "MATCH (n:RG12_P) WHERE n.k='key42' RETURN n.grp"
  expected:
    exit_code: 0
    stdout_contains:
    - '"grp":2'
  tags: [index-reload, reopen, positive-baseline]

- name: warm-distinct-before-restart
  description: |
    Warm check before restart — RETURN DISTINCT n.grp must yield exactly
    5 rows (grp values 0..4).
  query: "MATCH (n:RG12_P) RETURN DISTINCT n.grp"
  expected:
    exit_code: 0
    stdout_contains:
    - '"grp":0'
    - '"grp":1'
    - '"grp":2'
    - '"grp":3'
    - '"grp":4'
  tags: [index-reload, reopen, positive-baseline]

- name: restart-server-for-index-reload
  description: |
    Graceful (clean) shutdown + reopen of the managed server against the
    SAME data dir (cleanup: false above). This is NOT a crash — it is
    the clean-checkpoint + reopen path that the GAP-ENT-0048 /
    GAP-0064/0065 contract targets: index-served reads must be correct
    on the first query after reopen, and must not wedge/hang.
  type: bash
  command: echo RESTART
  restart_server: true
  expected:
    exit_code: 0
    stdout_contains:
    - RESTART
  tags: [index-reload, reopen, restart]

- name: first-read-eq-seek-after-reopen
  description: |
    KEY ASSERTION — this is the FIRST query test after the restart
    marker above; no warm-up query precedes it. Under a live
    GAP-ENT-0048/GAP-0064 regression this read could be served by a
    not-yet-hydrated index and return a wrong/empty result, or wedge.
    A 15s timeout enforces the prompt-response contract: a wedge must
    fail as a timeout, not hang forever. Must return grp:2 (key42 ->
    42 mod 5 = 2).
  query: "MATCH (n:RG12_P) WHERE n.k='key42' RETURN n.grp"
  timeout_ms: 15000
  expected:
    exit_code: 0
    stdout_contains:
    - '"grp":2'
  tags: [index-reload, reopen, key-assertion]

- name: groupby-post-reopen
  description: |
    KEY ASSERTION — GROUP BY over the indexed label must return exactly
    5 groups, each with count 100. Each assertion binds the group value
    to its count (e.g. '"g":0,"c":100') rather than asserting an
    unbound '"c":100' substring, so a regression that shuffled counts
    between groups (rather than losing them outright) would still be
    caught.
  query: "MATCH (n:RG12_P) RETURN n.grp AS g, count(*) AS c GROUP BY g"
  timeout_ms: 15000
  expected:
    exit_code: 0
    stdout_contains:
    - '"g":0,"c":100'
    - '"g":1,"c":100'
    - '"g":2,"c":100'
    - '"g":3,"c":100'
    - '"g":4,"c":100'
  tags: [index-reload, reopen, key-assertion]

- name: distinct-post-reopen
  description: |
    KEY ASSERTION — RETURN DISTINCT n.grp must still return exactly 5
    rows post-reopen.
  query: "MATCH (n:RG12_P) RETURN DISTINCT n.grp"
  timeout_ms: 15000
  expected:
    exit_code: 0
    stdout_contains:
    - '"grp":0'
    - '"grp":1'
    - '"grp":2'
    - '"grp":3'
    - '"grp":4'
  tags: [index-reload, reopen, key-assertion]

- name: point-seek-post-reopen
  description: |
    KEY ASSERTION — property-pattern point seek MATCH (n:RG12_P
    {k:'key7'}) RETURN count(n) must return exactly 1 post-reopen.
    Probed column name for this query shape is "count" (not
    "count(n)") — the assertion matches the actual observed output.
  query: "MATCH (n:RG12_P {k:'key7'}) RETURN count(n)"
  timeout_ms: 15000
  expected:
    exit_code: 0
    stdout_contains:
    - '"count":1'
  tags: [index-reload, reopen, key-assertion]

