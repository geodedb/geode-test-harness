version: '1.0'
name: Regression — index-served reads correct + prompt on FIRST post-reopen query (geode GAP-ENT-0048 / GAP-0064/0065)
description: |
  Pins the contract that after CREATE INDEX + a clean (graceful) shutdown +
  reopen, index-served reads — WHERE equality, GROUP BY, DISTINCT, and
  property-pattern point seek — return CORRECT results on the VERY FIRST
  post-reopen query and do not wedge/hang. This targets the geode
  GAP-ENT-0048 family and the GAP-0064/0065 reopen-reload behavior: an
  index that has not yet finished rehydrating after reopen must either
  serve a correct answer immediately or fall back correctly — it must
  never silently serve a stale/empty/partial answer, and it must never
  block indefinitely (a wedge must surface as a timeout, not a hang).

  This is a CLEAN shutdown reopen (graceful restart_server: true, not a
  crash) — the contract under test is reload-on-reopen correctness, which
  a graceful checkpoint + reopen exercises directly.

  Scenario:
    1. Seed exactly 500 RG12_P nodes via 500 individual CREATE statements
       (k: 'key<i>', grp: i mod 5 — UNWIND/FOREACH range-seeding is not a
       supported clause on this build per prior probes for sibling specs,
       so a script-generated CREATE batch is used instead). CREATE INDEX
       on RG12_P.k using the FOR (n:Label) ON (n.prop) form.
    2. Warm checks before restart: WHERE n.k='key42' RETURN n.grp is
       correct (key42 -> grp 42 mod 5 = 2); RETURN DISTINCT n.grp yields
       exactly 5 rows.
    3. Restart the managed server against the SAME data dir (cleanup:
       false + restart_server: true) — a graceful shutdown + reopen.
    4. KEY: MATCH (n:RG12_P) WHERE n.k='key42' RETURN n.grp is the FIRST
       query test that runs after the restart marker — no warm-up query
       precedes it. Must return grp:2, within a 15s timeout (a wedge must
       fail as a timeout, not hang forever).
    5. GROUP BY over the index-backed label: RETURN n.grp AS g,
       count(*) AS c GROUP BY g must return exactly 5 groups, each with
       count 100, with the group value bound to its count in the
       assertion (avoiding an unbound-substring pitfall where a lone
       '"c":100' could match any group).
    6. DISTINCT over the same label: RETURN DISTINCT n.grp must still
       return exactly 5 rows.
    7. Point seek via inline property pattern: MATCH (n:RG12_P
       {k:'key7'}) RETURN count(n) must return exactly 1. (Probed output
       column name for this pattern is "count", not "count(n)" — the
       assertion below matches the actual observed column name.)

  Probed against a scratch server (geode serve --listen 127.0.0.1:4454
  --data-dir /tmp/probe-r12, with GEODE_ADMIN_PASSWORD set on FIRST boot
  so no ALTER USER password-reset dance is needed) before/after a manual
  graceful SIGTERM + restart on the same data dir: CREATE INDEX ... FOR
  (n:RG12_P) ON (n.k) succeeded; count(n) held at 500; the eq-seek for
  key42 returned grp:2 as the literal first post-restart query; GROUP BY
  returned all 5 groups at count 100 each; DISTINCT returned exactly 5
  rows; the point-seek pattern returned count:1 with column name "count".
  No live regression was observed on this build.

  CANARY: REQ=REQ-INDEX-RELOAD-REOPEN-001; FEATURE="IndexReload"; ASPECT=FirstReadAfterReopen; STATUS=TESTED; TEST=geodetestlab/specs/regression_index_reload_after_reopen.yml; OWNER=qa; UPDATED=2026-07-09

cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 60000
    cleanup: false
    args:
    - --log-level
    - info

  client:
    timeout_ms: 30000
    format: json

invariants:
- type: server_running

