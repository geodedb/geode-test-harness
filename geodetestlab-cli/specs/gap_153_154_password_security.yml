version: '1.0'
name: Password Security Regression Tests (GAP-0153, GAP-0154)
description: "Regression tests for GAP-0153 and GAP-0154 security fixes.\n\nGAP-0153: auth_state.zig uses cryptographic random passwords in production builds\ninstead of hardcoded \"admin\" and \"testpass\" defaults.\n\nGAP-0154: user_mgmt_cli.zig requires explicit passwords or --generate-password flag\ninstead of using hardcoded defaults like \"changeme123!\" or \"testpass123\".\n"
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 30000
    cleanup: true
    args:
    - --log-level
    - error
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 30000
    tls_verify: false
    format: json
tests:
- name: gap-0154-user-create-with-explicit-password
  description: User creation with explicit --password flag should succeed
  args:
  - user
  - create
  - gap154test
  - gap154@test.com
  - --password
  - SecurePass123!
  expect:
    exit_code: 0
    stdout_contains:
    - created gap154test
  tags:
  - gap-0154
  - password-security
  - user-create
- name: gap-0154-user-verify-created
  description: Verify user was created
  args:
  - user
  - show
  - gap154test
  expect:
    exit_code: 0
    stdout_contains:
    - gap154test
  tags:
  - gap-0154
  - password-security
  - user-show
- name: gap-0154-user-delete-test
  description: Clean up test user
  args:
  - user
  - delete
  - gap154test
  - --yes
  expect:
    exit_code: 0
  tags:
  - gap-0154
  - password-security
  - cleanup
- name: gap-0154-user-create-generate-password
  description: User creation with --generate-password flag should succeed and output generated password
  args:
  - user
  - create
  - gap154gen
  - gap154gen@test.com
  - --generate-password
  expect:
    exit_code: 0
    stdout_contains:
    - created gap154gen
    - generated_password
  tags:
  - gap-0154
  - password-security
  - generate-password
- name: gap-0154-cleanup-generated
  description: Clean up generated password user
  args:
  - user
  - delete
  - gap154gen
  - --yes
  expect:
    exit_code: 0
  tags:
  - gap-0154
  - cleanup
- name: gap-0154-password-strength-weak
  description: Weak passwords should be rejected
  args:
  - user
  - create
  - weakuser
  - weak@test.com
  - --password
  - abc
  expect:
    exit_code: 0
    stdout_contains:
    - password does not meet policy requirements
  tags:
  - gap-0154
  - password-strength
- name: gap-0154-password-strength-no-digits
  description: Passwords without digits should be rejected
  args:
  - user
  - create
  - nodigits
  - nodigits@test.com
  - --password
  - abcdefgh
  expect:
    exit_code: 0
    stdout_contains:
    - password does not meet policy requirements
  tags:
  - gap-0154
  - password-strength
- name: gap-0154-password-strength-no-letters
  description: Passwords without letters should be rejected
  args:
  - user
  - create
  - noletters
  - noletters@test.com
  - --password
  - '12345678'
  expect:
    exit_code: 0
    stdout_contains:
    - password does not meet policy requirements
  tags:
  - gap-0154
  - password-strength
- name: gap-0154-password-strength-valid
  description: Strong passwords should be accepted
  args:
  - user
  - create
  - stronguser
  - strong@test.com
  - --password
  - StrongP4ss!
  expect:
    exit_code: 0
    stdout_contains:
    - created stronguser
  tags:
  - gap-0154
  - password-strength
- name: gap-0154-cleanup-stronguser
  description: Clean up strong password user
  args:
  - user
  - delete
  - stronguser
  - --yes
  expect:
    exit_code: 0
  tags:
  - gap-0154
  - cleanup
- name: gap-0154-change-password-setup
  description: Create user for password change tests
  args:
  - user
  - create
  - pwchangetest
  - pwchange@test.com
  - --password
  - InitialPass1!
  expect:
    exit_code: 0
  tags:
  - gap-0154
  - change-password
  - setup
- name: gap-0154-change-password-generate
  description: Change password with --generate-password should work
  args:
  - user
  - change-password
  - pwchangetest
  - --generate-password
  expect:
    exit_code: 0
    stdout_contains:
    - Password changed for pwchangetest
  tags:
  - gap-0154
  - change-password
- name: gap-0154-reset-password-explicit
  description: Reset password with explicit --new-password should work
  args:
  - user
  - reset-password
  - pwchangetest
  - --new-password
  - NewSecure123!
  expect:
    exit_code: 0
    stdout_contains:
    - Password reset for pwchangetest
  tags:
  - gap-0154
  - reset-password
- name: gap-0154-cleanup-pwchange
  description: Clean up password change test user
  args:
  - user
  - delete
  - pwchangetest
  - --yes
  expect:
    exit_code: 0
  tags:
  - gap-0154
  - cleanup
- name: gap-0154-mfa-setup-requires-user
  description: MFA setup should require existing user
  args:
  - user
  - mfa-setup
  - nonexistentuser
  expect:
    exit_code: 0
    stdout_contains:
    - does not exist
  tags:
  - gap-0154
  - mfa
- name: gap-0154-mfa-enable-requires-user
  description: MFA enable should require existing user
  args:
  - user
  - mfa
  - enable
  - nonexistentmfa
  expect:
    exit_code: 0
    stdout_contains:
    - does not exist
  tags:
  - gap-0154
  - mfa
- name: password-strength-minimum-length
  description: Password must be at least 8 characters
  args:
  - user
  - create
  - shortpw
  - short@test.com
  - --password
  - Pass1!
  expect:
    exit_code: 0
    stdout_contains:
    - password does not meet policy requirements
  tags:
  - password-strength
- name: password-strength-exactly-8-chars
  description: Password with exactly 8 chars including letters and digits should pass
  args:
  - user
  - create
  - exact8
  - exact8@test.com
  - --password
  - Exactly8
  expect:
    exit_code: 0
    stdout_contains:
    - created exact8
  tags:
  - password-strength
- name: password-strength-cleanup
  description: Clean up exact8 user
  args:
  - user
  - delete
  - exact8
  - --yes
  expect:
    exit_code: 0
  tags:
  - cleanup
