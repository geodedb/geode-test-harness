version: '1.0'
name: Password Security Regression Tests (GAP-0153, GAP-0154)
description: "Regression tests for GAP-0153 and GAP-0154 security fixes.\n\nGAP-0153: auth_state.zig uses cryptographic random passwords in production builds\ninstead of hardcoded \"admin\" and \"testpass\" defaults.\n\nGAP-0154: user_mgmt_cli.zig requires explicit passwords or --generate-password flag\ninstead of using hardcoded defaults like \"changeme123!\" or \"testpass123\".\n"
single_node_only: true  # Test exercises single-node-targeted behavior (DSN binding, single-server password retry)

cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 30000
    cleanup: true
    args:
    - --log-level
    - error
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 30000
    tls_verify: false
    format: json

tests:
- name: gap-0154-user-create-with-explicit-password
  description: User creation with explicit --password flag should succeed
  args:
  - user
  - create
  - gap154test
  - gap154@test.com
  - --password
  - Gap154 Secure Test Passphrase Value
  expect:
    exit_code: 0
    stdout_contains:
    - created gap154test
  tags:
  - gap-0154
  - password-security
  - user-create
- name: gap-0154-user-verify-created
  description: Verify user was created
  args:
  - user
  - show
  - gap154test
  expect:
    exit_code: 0
    stdout_contains:
    - gap154test
  tags:
  - gap-0154
  - password-security
  - user-show
- name: gap-0154-user-delete-test
  description: Clean up test user
  args:
  - user
  - delete
  - gap154test
  - --yes
  expect:
    exit_code: 0
  tags:
  - gap-0154
  - password-security
  - cleanup
- name: gap-0154-user-create-generate-password
  description: |
    `geode user create --generate-password` creates the user with a generated password,
    prints it, and the generated password satisfies the password policy (20+ chars, 3+
    words). Runs the real CLI offline against a scratch data directory (the CLI refuses
    to change a data directory a live server holds open).
  type: bash
  command: |
    set -eu
    D=$(mktemp -d); trap 'rm -rf "$D"' EXIT
    DD="$D/data"
    quiet() { grep -v -E 'INFO|^info\(|WARN|^\[' || true; }
    "$GEODE_BINARY" auth init --data-dir "$DD" >/dev/null 2>&1
    OUT=$("$GEODE_BINARY" user create gap154gen gap154gen@test.com --generate-password --data-dir "$DD" 2>&1 | quiet)
    echo "$OUT"
    PW=$(printf '%s\n' "$OUT" | sed -n 's/^Generated password: //p')
    WORDS=$(printf '%s' "$PW" | wc -w)
    echo "GENERATED_PASSWORD_LEN=${#PW}"
    echo "GENERATED_PASSWORD_WORDS=$WORDS"
    [ "${#PW}" -ge 20 ] && [ "$WORDS" -ge 3 ] && echo GENERATED_PASSWORD_MEETS_POLICY
    "$GEODE_BINARY" user list --data-dir "$DD" 2>&1 | quiet
  expect:
    exit_code: 0
    stdout_contains:
    - 'Generated password: '
    - User 'gap154gen' created successfully
    - GENERATED_PASSWORD_MEETS_POLICY
    - '- gap154gen (role: user)'
  tags:
  - gap-0154
  - password-security
  - generate-password
- name: gap-0154-password-strength-weak
  description: Weak passwords should be rejected
  args:
  - user
  - create
  - weakuser
  - weak@test.com
  - --password
  - abc
  # Password policy (docs/USER_AUTH.md): 20+ chars, 3+ words, upper and lower case; a rejection is 22000 and geode query exits 1.
  expect:
    exit_code: 1
    stdout_contains: ['22000', Password too short]
  tags:
  - gap-0154
  - password-strength
- name: gap-0154-password-strength-no-uppercase
  description: Passwords without digits should be rejected
  args:
  - user
  - create
  - nodigits
  - nodigits@test.com
  - --password
  - abcdefgh abcdefgh abcdefgh
  # Password policy (docs/USER_AUTH.md): 20+ chars, 3+ words, upper and lower case; a rejection is 22000 and geode query exits 1.
  expect:
    exit_code: 1
    stdout_contains: ['22000', at least one uppercase letter]
  tags:
  - gap-0154
  - password-strength
- name: gap-0154-password-strength-no-letters-or-uppercase
  description: Passwords without letters should be rejected
  args:
  - user
  - create
  - noletters
  - noletters@test.com
  - --password
  - 12345678 12345678 12345678
  # Password policy (docs/USER_AUTH.md): 20+ chars, 3+ words, upper and lower case; a rejection is 22000 and geode query exits 1.
  expect:
    exit_code: 1
    stdout_contains: ['22000', at least one uppercase letter]
  tags:
  - gap-0154
  - password-strength
- name: gap-0154-password-strength-valid
  description: Strong passwords should be accepted
  args:
  - user
  - create
  - stronguser
  - strong@test.com
  - --password
  - Strong Test Passphrase Value Four
  expect:
    exit_code: 0
    stdout_contains:
    - created stronguser
  tags:
  - gap-0154
  - password-strength
- name: gap-0154-cleanup-stronguser
  description: Clean up strong password user
  args:
  - user
  - delete
  - stronguser
  - --yes
  expect:
    exit_code: 0
  tags:
  - gap-0154
  - cleanup
- name: gap-0154-change-password-setup
  description: Create user for password change tests
  args:
  - user
  - create
  - pwchangetest
  - pwchange@test.com
  - --password
  - Initial Test Passphrase Value One
  expect:
    exit_code: 0
  tags:
  - gap-0154
  - change-password
  - setup
- name: gap-0154-change-password-generate
  description: |
    `geode user change-password <user> --generate-password` generates a new policy-compliant
    password, prints it and reports the change. Real CLI, offline, scratch data directory.
  type: bash
  command: |
    set -eu
    D=$(mktemp -d); trap 'rm -rf "$D"' EXIT
    DD="$D/data"
    quiet() { grep -v -E 'INFO|^info\(|WARN|^\[' || true; }
    "$GEODE_BINARY" auth init --data-dir "$DD" >/dev/null 2>&1
    "$GEODE_BINARY" user create pwchangetest pwchange@test.com --password "Initial Test Passphrase Value One" --data-dir "$DD" 2>&1 | quiet
    OUT=$("$GEODE_BINARY" user change-password pwchangetest --generate-password --data-dir "$DD" 2>&1 | quiet)
    echo "$OUT"
    PW=$(printf '%s\n' "$OUT" | sed -n 's/^Generated password: //p')
    [ "$(printf '%s' "$PW" | wc -w)" -ge 3 ] && echo GENERATED_PASSWORD_HAS_WORDS
  expect:
    exit_code: 0
    stdout_contains:
    - 'Generated password: '
    - Password changed for user 'pwchangetest'
    - GENERATED_PASSWORD_HAS_WORDS
  tags:
  - gap-0154
  - change-password
- name: gap-0154-reset-password-explicit
  description: Reset password with explicit --new-password should work
  args:
  - user
  - reset-password
  - pwchangetest
  - --new-password
  - New Secure Test Passphrase Value
  expect:
    exit_code: 0
    stdout_contains:
    - Password reset for pwchangetest
  tags:
  - gap-0154
  - reset-password
- name: gap-0154-cleanup-pwchange
  description: Clean up password change test user
  args:
  - user
  - delete
  - pwchangetest
  - --yes
  expect:
    exit_code: 0
  tags:
  - gap-0154
  - cleanup
- name: gap-0154-mfa-setup-requires-user
  description: MFA setup should require existing user
  args:
  - user
  - mfa-setup
  - nonexistentuser
  # geode query exits 1 on an error status.
  expect:
    exit_code: 1
    stdout_contains: ['42002', User does not exist]
  tags:
  - gap-0154
  - mfa
- name: gap-0154-mfa-enable-requires-user
  description: MFA enable should require existing user
  args:
  - user
  - mfa
  - enable
  - nonexistentmfa
  # geode query exits 1 on an error status.
  expect:
    exit_code: 1
    stdout_contains: ['42002', User does not exist]
  tags:
  - gap-0154
  - mfa
- name: password-strength-minimum-length
  description: Password must be at least 8 characters
  args:
  - user
  - create
  - shortpw
  - short@test.com
  - --password
  - Pass1!
  # Password policy (docs/USER_AUTH.md): 20+ chars, 3+ words, upper and lower case; a rejection is 22000 and geode query exits 1.
  expect:
    exit_code: 1
    stdout_contains: ['22000', Password too short]
  tags:
  - password-strength
- name: password-strength-exactly-20-chars
  description: Password with exactly 8 chars including letters and digits should pass
  args:
  - user
  - create
  - exact8
  - exact8@test.com
  - --password
  - Abcdefg Abcdefg Abcd
  expect:
    exit_code: 0
    stdout_contains:
    - created exact8
  tags:
  - password-strength
- name: password-strength-cleanup
  description: Clean up exact8 user
  args:
  - user
  - delete
  - exact8
  - --yes
  expect:
    exit_code: 0
  tags:
  - cleanup
