# GAP-0153 and GAP-0154 Password Security Regression Tests
# Tests that hardcoded default passwords are not used and proper password handling is enforced
#
# CANARY: REQ=REQ-GAP-0153-REGRESSION; FEATURE="Password Security"; ASPECT=Security; STATUS=TESTED; TEST=geodetestlab/specs/gap_153_154_password_security.yml; OWNER=security; UPDATED=2026-01-14
# CANARY: REQ=REQ-GAP-0154-REGRESSION; FEATURE="CLI Password Security"; ASPECT=Security; STATUS=TESTED; TEST=geodetestlab/specs/gap_153_154_password_security.yml; OWNER=security; UPDATED=2026-01-14

version: "1.0"
name: "Password Security Regression Tests (GAP-0153, GAP-0154)"
description: |
  Regression tests for GAP-0153 and GAP-0154 security fixes.

  GAP-0153: auth_state.zig uses cryptographic random passwords in production builds
  instead of hardcoded "admin" and "testpass" defaults.

  GAP-0154: user_mgmt_cli.zig requires explicit passwords or --generate-password flag
  instead of using hardcoded defaults like "changeme123!" or "testpass123".

cli:
  binary: "./zig-out/bin/geode"
  server:
    enabled: true
    port: null
    data_dir: null
    startup_timeout_ms: 30000
    cleanup: true
    args: ["--log-level", "error"]
  client:
    timeout_ms: 30000
    tls_verify: false
    format: "json"

tests:
  # =============================================================================
  # GAP-0154 Tests: CLI Password Requirements
  # =============================================================================

  - name: "gap-0154-user-create-with-explicit-password"
    description: "User creation with explicit --password flag should succeed"
    args: ["user", "create", "gap154test", "gap154@test.com", "--password", "SecurePass123!"]
    expect:
      exit_code: 0
      stdout_contains: ["User 'gap154test' created successfully"]
    tags: ["gap-0154", "password-security", "user-create"]

  - name: "gap-0154-user-verify-created"
    description: "Verify user was created"
    args: ["user", "show", "gap154test"]
    expect:
      exit_code: 0
      stdout_contains: ["User: gap154test", "Email: gap154@test.com"]
    tags: ["gap-0154", "password-security", "user-show"]

  - name: "gap-0154-user-delete-test"
    description: "Clean up test user"
    args: ["user", "delete", "gap154test", "--yes"]
    expect:
      exit_code: 0
    tags: ["gap-0154", "password-security", "cleanup"]

  - name: "gap-0154-user-create-generate-password"
    description: "User creation with --generate-password flag should succeed and output password"
    args: ["user", "create", "gap154gen", "gap154gen@test.com", "--generate-password"]
    expect:
      exit_code: 0
      stdout_contains: ["User 'gap154gen' created successfully"]
      stderr_contains: ["Generated password:"]
    tags: ["gap-0154", "password-security", "generate-password"]

  - name: "gap-0154-cleanup-generated"
    description: "Clean up generated password user"
    args: ["user", "delete", "gap154gen", "--yes"]
    expect:
      exit_code: 0
    tags: ["gap-0154", "cleanup"]

  - name: "gap-0154-password-strength-weak"
    description: "Weak passwords should be rejected"
    args: ["user", "create", "weakuser", "weak@test.com", "--password", "abc"]
    expect:
      exit_code: 1
      stderr_contains: ["password does not meet policy requirements"]
    tags: ["gap-0154", "password-strength"]

  - name: "gap-0154-password-strength-no-digits"
    description: "Passwords without digits should be rejected"
    args: ["user", "create", "nodigits", "nodigits@test.com", "--password", "abcdefgh"]
    expect:
      exit_code: 1
      stderr_contains: ["password does not meet policy requirements"]
    tags: ["gap-0154", "password-strength"]

  - name: "gap-0154-password-strength-no-letters"
    description: "Passwords without letters should be rejected"
    args: ["user", "create", "noletters", "noletters@test.com", "--password", "12345678"]
    expect:
      exit_code: 1
      stderr_contains: ["password does not meet policy requirements"]
    tags: ["gap-0154", "password-strength"]

  - name: "gap-0154-password-strength-valid"
    description: "Strong passwords should be accepted"
    args: ["user", "create", "stronguser", "strong@test.com", "--password", "StrongP4ss!"]
    expect:
      exit_code: 0
      stdout_contains: ["User 'stronguser' created successfully"]
    tags: ["gap-0154", "password-strength"]

  - name: "gap-0154-cleanup-stronguser"
    description: "Clean up strong password user"
    args: ["user", "delete", "stronguser", "--yes"]
    expect:
      exit_code: 0
    tags: ["gap-0154", "cleanup"]

  # =============================================================================
  # GAP-0154 Tests: Change Password Requirements
  # =============================================================================

  - name: "gap-0154-change-password-setup"
    description: "Create user for password change tests"
    args: ["user", "create", "pwchangetest", "pwchange@test.com", "--password", "InitialPass1!"]
    expect:
      exit_code: 0
    tags: ["gap-0154", "change-password", "setup"]

  - name: "gap-0154-change-password-generate"
    description: "Change password with --generate-password should work"
    args: ["user", "change-password", "pwchangetest", "--generate-password"]
    expect:
      exit_code: 0
      stdout_contains: ["Password changed for user 'pwchangetest'"]
      stderr_contains: ["Generated password:"]
    tags: ["gap-0154", "change-password"]

  - name: "gap-0154-reset-password-explicit"
    description: "Reset password with explicit --new-password should work"
    args: ["user", "reset-password", "pwchangetest", "--new-password", "NewSecure123!"]
    expect:
      exit_code: 0
      stdout_contains: ["Password reset for user 'pwchangetest'"]
    tags: ["gap-0154", "reset-password"]

  - name: "gap-0154-cleanup-pwchange"
    description: "Clean up password change test user"
    args: ["user", "delete", "pwchangetest", "--yes"]
    expect:
      exit_code: 0
    tags: ["gap-0154", "cleanup"]

  # =============================================================================
  # GAP-0154 Tests: MFA Commands Don't Set Hardcoded Passwords
  # =============================================================================

  - name: "gap-0154-mfa-setup-requires-user"
    description: "MFA setup should require existing user"
    args: ["user", "mfa-setup", "nonexistentuser"]
    expect:
      exit_code: 1
      stderr_contains: ["does not exist"]
    tags: ["gap-0154", "mfa"]

  - name: "gap-0154-mfa-enable-requires-user"
    description: "MFA enable should require existing user"
    args: ["user", "mfa", "enable", "nonexistentmfa"]
    expect:
      exit_code: 1
      stderr_contains: ["does not exist"]
    tags: ["gap-0154", "mfa"]

  # =============================================================================
  # Password Strength Validation Tests
  # =============================================================================

  - name: "password-strength-minimum-length"
    description: "Password must be at least 8 characters"
    args: ["user", "create", "shortpw", "short@test.com", "--password", "Pass1!"]
    expect:
      exit_code: 1
      stderr_contains: ["password does not meet policy requirements"]
    tags: ["password-strength"]

  - name: "password-strength-exactly-8-chars"
    description: "Password with exactly 8 chars including letters and digits should pass"
    args: ["user", "create", "exact8", "exact8@test.com", "--password", "Exactly8"]
    expect:
      exit_code: 0
      stdout_contains: ["User 'exact8' created successfully"]
    tags: ["password-strength"]

  - name: "password-strength-cleanup"
    description: "Clean up exact8 user"
    args: ["user", "delete", "exact8", "--yes"]
    expect:
      exit_code: 0
    tags: ["cleanup"]
