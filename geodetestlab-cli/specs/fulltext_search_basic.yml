---
# Full-Text Search Basic Tests
# Converted from legacy format
version: "1.0"
name: "Full-Text Search Basic Tests"
description: "Testing full-text search capabilities with BM25"

cli:
  binary: "./zig-out/bin/geode"
  server:
    enabled: true
    port: null
    data_dir: null
    startup_timeout_ms: 60000
    cleanup: true
    args: ["--log-level", "warn"]
    env: {}
  client:
    timeout_ms: 30000
    tls_verify: false
    format: "json"

tests:
  - name: fts-create-document
    description: Create a document for full-text search
    args: ["query", "-"]
    stdin: "CREATE (doc:Document {title: 'Test Document', content: 'This is a test document with searchable content'}) RETURN doc.title AS title"
    expect:
      exit_code: 0
      stdout_contains: ["title"]
    tags: [fts, create]

  - name: fts-match-query
    description: Test MATCH query with text
    args: ["query", "-"]
    stdin: "MATCH (n:Document) WHERE n.content CONTAINS 'searchable' RETURN n.title AS found"
    expect:
      exit_code: 0
    tags: [fts, query]

  - name: fts-string-contains
    description: Test CONTAINS predicate
    args: ["query", "-"]
    stdin: "RETURN 'hello world' CONTAINS 'world' AS contains_result"
    expect:
      exit_code: 0
      stdout_contains: ["contains_result"]
    tags: [fts, string]

  - name: fts-index-creation
    description: Test creating a text index
    args: ["query", "-"]
    stdin: "CREATE (n:SearchNode {text: 'indexable content'}) RETURN n.text AS indexed"
    expect:
      exit_code: 0
    tags: [fts, index]

tags: [fulltext, search, bm25]
