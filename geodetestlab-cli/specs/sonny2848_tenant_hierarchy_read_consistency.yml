version: '1.0'
name: 'SONNY-2848 / SONNY-2820 / SONNY-2693 / SONNY-1326: tenant-hierarchy reads agree with MATCH on every path'
description: |
  Tickets: SONNY-2848, SONNY-2820, SONNY-2693, SONNY-1326.
  A tenant-scoped session sees the rows tagged with its tenant and, when the tenant is registered
  in the hierarchy, those of its descendants (a child does not see its parent's rows, siblings
  and unrelated tenants see nothing of each other). Every read must obey that one rule.
  SONNY-2848: COUNT {}, EXISTS {}, IN (subquery), comprehensions and aggregates after WITH
  saw none of the session's own nodes (or returned 0) on a tenant session.
  SONNY-1326: shortestPath(), COUNT {}, EXISTS {} and pattern comprehensions read across
  tenants.
  SONNY-2820: knn() compared tenant tags exactly, so a parent missed its children's rows; and a
  property no visible row carries raised UnknownProperty instead of an empty list.
  SONNY-2693: one rule for edges on every path: an edge is visible only when its OWN tenant tag
  (hierarchy-aware) and both endpoints are visible (an edge a parent wrote between its child's
  nodes is invisible to the child on every path, single hop, undirected, variable length,
  COUNT {}, EXISTS {}, comprehensions).
  How the sessions are made: the geode CLI sends no tenant, so each statement batch goes through
  `geode mcp --stdio` whose backend endpoint carries tenant=<id> in its HELLO, against the real
  server (GEODE_PERMISSIVE_TENANCY=1 only so the managed server accepts the admin's tenant-less
  setup calls). Tenants: P with children C1 and C2, and an unrelated root U.

cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 60000
    cleanup: true
    args: [--log-level, warn]
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
      GEODE_PERMISSIVE_TENANCY: '1'
  client:
    timeout_ms: 60000
    format: json
secrets:
  admin_password:
    source: env
    key: GEODE_ADMIN_PASSWORD
    required: false
    default: Geode Test Admin Passphrase
invariants:
- type: server_running
fuzz:
  enabled: false

tests:
- name: s6338-tenant-t6338_p
  description: Register tenant t6338_p.
  args: [query, -U, geode, -P, '${secret:admin_password}', CALL geode.tenant.create('t6338_p')]
  expect:
    exit_code: 0
    stdout_contains: ['"created":true']
  tags: [tenant, setup]

- name: s6338-tenant-t6338_c1
  description: Register tenant t6338_c1 under t6338_p.
  args: [query, -U, geode, -P, '${secret:admin_password}', "CALL geode.tenant.create('t6338_c1', 't6338_p')"]
  expect:
    exit_code: 0
    stdout_contains: ['"created":true']
  tags: [tenant, setup]

- name: s6338-tenant-t6338_c2
  description: Register tenant t6338_c2 under t6338_p.
  args: [query, -U, geode, -P, '${secret:admin_password}', "CALL geode.tenant.create('t6338_c2', 't6338_p')"]
  expect:
    exit_code: 0
    stdout_contains: ['"created":true']
  tags: [tenant, setup]

- name: s6338-tenant-t6338_u
  description: Register tenant t6338_u.
  args: [query, -U, geode, -P, '${secret:admin_password}', CALL geode.tenant.create('t6338_u')]
  expect:
    exit_code: 0
    stdout_contains: ['"created":true']
  tags: [tenant, setup]

- name: s6338-seed-c1
  description: C1 writes s1 -T-> s2.
  type: bash
  timeout_ms: 120000
  command: |
    H=$(mktemp --suffix=.py)
    cat > "$H" <<'PYEOF'
    import json, os, subprocess, sys, urllib.parse
    tenant, stmts = sys.argv[1], sys.argv[2:]
    addr = os.environ["GEODE_SERVER_ADDRESS"]
    pw = urllib.parse.quote(os.environ.get("GEODE_ADMIN_PASSWORD", "Geode Test Admin Passphrase"))
    dsn = "quic://%s?insecure=true&user=geode&pass=%s&tenant=%s" % (addr, pw, tenant)
    msgs = [{"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {"protocolVersion": "2025-11-25", "capabilities": {}, "clientInfo": {"name": "harness", "version": "1"}}},
            {"jsonrpc": "2.0", "method": "notifications/initialized"}]
    for i, s in enumerate(stmts):
        msgs.append({"jsonrpc": "2.0", "id": 10 + i, "method": "tools/call", "params": {"name": "query", "arguments": {"query": s}}})
    env = dict(os.environ); env["GEODE_ALLOW_INSECURE_TLS"] = "1"
    r = subprocess.run([os.environ.get("GEODE_BINARY", "geode"), "mcp", "--stdio", "--no-auth", "--endpoint", dsn], input="\n".join(json.dumps(m) for m in msgs) + "\n", capture_output=True, text=True, timeout=120, env=env)
    by_id = {}
    for line in r.stdout.splitlines():
        line = line.strip()
        if line.startswith("{"):
            try: m = json.loads(line)
            except Exception: continue
            if "id" in m: by_id[m["id"]] = m
    for i, s in enumerate(stmts):
        tag = "Q%02d" % (i + 1)
        m = by_id.get(10 + i)
        if m is None: print(tag, "ERR no response"); continue
        if "error" in m: print(tag, "ERR", json.dumps(m["error"])[:300]); continue
        res = m["result"]; text = "".join(c.get("text", "") for c in res.get("content", []))
        if res.get("isError"): print(tag, "ERR", text[:300]); continue
        try: print(tag, "OK", json.dumps(json.loads(text).get("rows"), separators=(",", ":")))
        except Exception: print(tag, "OK", text[:300])
    PYEOF
    python3 "$H" t6338_c1 'CREATE (a:S {who: '\''s1'\'', k: 1})-[:T]->(b:S {who: '\''s2'\'', k: 2})'
    rm -f "$H"
  expect:
    exit_code: 0
    stdout_contains: ['Q01 OK []']
    stdout_not_contains: [ERR]
  tags: [tenant]

