- name: s6338-subqueries-t6338_c1
  description: "SONNY-2848/1326: every subquery / expression-path / aggregate form returns what the session's own MATCH sees (tenant t6338_c1: 2 nodes, 1 sources; s1 visible: True)."
  type: bash
  timeout_ms: 120000
  command: |
    H=$(mktemp --suffix=.py)
    cat > "$H" <<'PYEOF'
    import json, os, subprocess, sys, urllib.parse
    tenant, stmts = sys.argv[1], sys.argv[2:]
    addr = os.environ["GEODE_SERVER_ADDRESS"]
    pw = urllib.parse.quote(os.environ.get("GEODE_ADMIN_PASSWORD", "Geode Test Admin Passphrase"))
    dsn = "quic://%s?insecure=true&user=geode&pass=%s&tenant=%s" % (addr, pw, tenant)
    msgs = [{"jsonrpc": "2.0", "id": 1, "method": "initialize", "params": {"protocolVersion": "2025-11-25", "capabilities": {}, "clientInfo": {"name": "harness", "version": "1"}}},
            {"jsonrpc": "2.0", "method": "notifications/initialized"}]
    for i, s in enumerate(stmts):
        msgs.append({"jsonrpc": "2.0", "id": 10 + i, "method": "tools/call", "params": {"name": "query", "arguments": {"query": s}}})
    env = dict(os.environ); env["GEODE_ALLOW_INSECURE_TLS"] = "1"
    r = subprocess.run([os.environ.get("GEODE_BINARY", "geode"), "mcp", "--stdio", "--no-auth", "--endpoint", dsn], input="\n".join(json.dumps(m) for m in msgs) + "\n", capture_output=True, text=True, timeout=120, env=env)
    by_id = {}
    for line in r.stdout.splitlines():
        line = line.strip()
        if line.startswith("{"):
            try: m = json.loads(line)
            except Exception: continue
            if "id" in m: by_id[m["id"]] = m
    for i, s in enumerate(stmts):
        tag = "Q%02d" % (i + 1)
        m = by_id.get(10 + i)
        if m is None: print(tag, "ERR no response"); continue
        if "error" in m: print(tag, "ERR", json.dumps(m["error"])[:300]); continue
        res = m["result"]; text = "".join(c.get("text", "") for c in res.get("content", []))
        if res.get("isError"): print(tag, "ERR", text[:300]); continue
        try: print(tag, "OK", json.dumps(json.loads(text).get("rows"), separators=(",", ":")))
        except Exception: print(tag, "OK", text[:300])
    PYEOF
    python3 "$H" t6338_c1 'MATCH (n:S) RETURN count(n) AS c' 'MATCH (a:S)-[:T]->(b:S) RETURN count(a) AS c' 'RETURN COUNT { (n:S) } AS c' 'MATCH (a:S) WHERE EXISTS { (a)-[:T]->(b) } RETURN count(a) AS c' 'MATCH (a:S) WHERE COUNT { (n:S) } > 0 RETURN count(a) AS c' 'RETURN size([(a:S)-[:T]->(b:S) | b.who]) AS c' 'MATCH (x:S) WHERE x.k IN (MATCH (y:S) RETURN y.k) RETURN count(x) AS c' 'MATCH (a:S)-[:T]->(b:S) RETURN count(shortestPath((a)-[*]-(b))) AS c' 'MATCH (a:S) WITH count(a) AS c RETURN c' 'MATCH (a:S) WHERE EXISTS { (a)-[:T]->() } RETURN count(*) AS c' 'MATCH (a:S)-[:T]->(b:S) WHERE b.k IN (MATCH (y:S) RETURN y.k) RETURN count(a) AS c' 'MATCH (a:S) WITH a, COUNT { (a)-[:T]->() } AS d WHERE d > 0 RETURN count(a) AS c' 'MATCH (a:S) WITH a WHERE EXISTS { (a)-[:T]->() } RETURN count(a) AS c' 'MATCH (a:S) WITH a, size([(a)-[:T]->(x) | x.k]) AS d WHERE d > 0 RETURN count(a) AS c' 'MATCH (a:S) RETURN sum(COUNT { (a)-[:T]->() }) AS c' 'MATCH (a:S) WITH a RETURN count(a) AS c' 'RETURN shortestPath((a:S {who: '\''s1'\''})-[*]-(b:S {who: '\''s2'\''})) IS NULL AS np' 'RETURN COUNT { (a:S {who: '\''s1'\''}) } AS c' 'RETURN EXISTS { (a:S {who: '\''s1'\''}) } AS e'
    rm -f "$H"
  expect:
    exit_code: 0
    stdout_contains: ['Q01 OK [{"c":2}]', 'Q02 OK [{"c":1}]', 'Q03 OK [{"c":2}]', 'Q04 OK [{"c":1}]', 'Q05 OK [{"c":2}]', 'Q06 OK [{"c":1}]', 'Q07 OK [{"c":2}]', 'Q08 OK [{"c":1}]', 'Q09 OK [{"c":2}]', 'Q10 OK [{"c":1}]', 'Q11 OK [{"c":1}]', 'Q12 OK [{"c":1}]', 'Q13 OK [{"c":1}]', 'Q14 OK [{"c":1}]', 'Q15 OK [{"c":1}]', 'Q16 OK [{"c":2}]', 'Q17 OK [{"np":false}]', 'Q18 OK [{"c":1}]', 'Q19 OK [{"e":true}]']
    stdout_not_contains: [ERR]
  tags: [tenant]

