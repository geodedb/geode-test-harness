version: "1.0"
name: "GAP-384/391/392 Graph Persistence and Source File Tests"
description: |
  Tests for:
  - GAP-384: Named graph data persistence across server restarts
  - GAP-391: Source file performance with multiple executions
  - GAP-392: Data consistency when sourcing files multiple times

  CANARY: REQ=REQ-GRAPH-PERSIST-TEST-001; FEATURE="NamedGraphPersistence"; ASPECT=IntegrationTest; STATUS=TESTED; OWNER=storage; UPDATED=2026-01-29

cli:
  binary: "./zig-out/bin/geode"
  server:
    enabled: true
    port: null
    data_dir: null
    startup_timeout_ms: 30000
    cleanup: false  # Keep data for persistence tests
    args: ["--log-level", "info"]
  client:
    timeout_ms: 30000
    tls_verify: false
    format: "json"

tests:
  # =============================================================================
  # GAP-384: Named Graph Persistence Tests
  # =============================================================================

  - name: "gap384-create-named-graph"
    description: "Create a named graph for persistence test"
    args: ["query", "CREATE GRAPH IF NOT EXISTS test_persist"]
    expect:
      exit_code: 0
    tags: ["gap384", "graph", "create"]

  - name: "gap384-use-named-graph"
    description: "Switch to the named graph"
    args: ["query", "USE GRAPH test_persist"]
    expect:
      exit_code: 0
    tags: ["gap384", "graph", "use"]

  - name: "gap384-create-test-node"
    description: "Create a test node in the named graph"
    args: ["query",
           "CREATE (n:PersistTest {
              id: 'GAP384_TEST_NODE_1',
              name: 'TestNode',
              created_at: timestamp()
            })
            RETURN n.id AS id"]
    expect:
      exit_code: 0
      stdout_contains: "GAP384_TEST_NODE_1"
    tags: ["gap384", "node", "create"]

  - name: "gap384-create-second-node"
    description: "Create a second test node"
    args: ["query",
           "CREATE (n:PersistTest {
              id: 'GAP384_TEST_NODE_2',
              name: 'SecondNode'
            })
            RETURN n.id AS id"]
    expect:
      exit_code: 0
      stdout_contains: "GAP384_TEST_NODE_2"
    tags: ["gap384", "node", "create"]

  - name: "gap384-create-test-edge"
    description: "Create a test edge between nodes"
    args: ["query",
           "MATCH (a:PersistTest {id: 'GAP384_TEST_NODE_1'})
            MATCH (b:PersistTest {id: 'GAP384_TEST_NODE_2'})
            CREATE (a)-[r:PERSIST_LINK {created: 'test'}]->(b)
            RETURN type(r) AS type"]
    expect:
      exit_code: 0
      stdout_contains: "PERSIST_LINK"
    tags: ["gap384", "edge", "create"]

  - name: "gap384-verify-node-count"
    description: "Verify node count before restart"
    args: ["query",
           "MATCH (n:PersistTest)
            RETURN count(n) AS total"]
    expect:
      exit_code: 0
      stdout_contains: "2"
    tags: ["gap384", "verify"]

  - name: "gap384-list-graphs"
    description: "Verify graph is listed"
    args: ["query", "SHOW GRAPHS"]
    expect:
      exit_code: 0
      stdout_contains: "test_persist"
    tags: ["gap384", "graph", "list"]

  # =============================================================================
  # GAP-391/392: Source File Tests
  # =============================================================================

  - name: "gap391-create-source-test-graph"
    description: "Create a graph for source file testing"
    args: ["query", "CREATE GRAPH IF NOT EXISTS source_test"]
    expect:
      exit_code: 0
    tags: ["gap391", "graph", "create"]

  - name: "gap391-use-source-test-graph"
    description: "Use the source test graph"
    args: ["query", "USE GRAPH source_test"]
    expect:
      exit_code: 0
    tags: ["gap391", "graph", "use"]

  - name: "gap392-create-unique-node"
    description: "Create a unique node with IF NOT EXISTS semantics"
    args: ["query",
           "CREATE (n:SourceTest {
              id: 'SOURCE_UNIQUE_1',
              name: 'UniqueNode'
            })
            RETURN n.id AS id"]
    expect:
      exit_code: 0
    tags: ["gap392", "node", "create"]

  - name: "gap392-duplicate-create-should-not-duplicate"
    description: "Creating same ID again should handle gracefully"
    # Use property-only match to avoid label suffix inconsistency in test runner
    args: ["query", "MATCH (n {id: 'SOURCE_UNIQUE_1'}) RETURN count(n) AS count"]
    expect:
      exit_code: 0
      stdout_contains: "1"
    tags: ["gap392", "verify", "duplicate"]

  - name: "gap392-create-multiple-nodes"
    description: "Create multiple nodes for count verification"
    args: ["query",
           "CREATE (a:SourceBatch {id: 'BATCH_1'})
            CREATE (b:SourceBatch {id: 'BATCH_2'})
            CREATE (c:SourceBatch {id: 'BATCH_3'})
            RETURN count(*) AS created"]
    expect:
      exit_code: 0
    tags: ["gap392", "node", "batch"]

  - name: "gap392-verify-batch-count"
    description: "Verify exact count of batch created nodes"
    args: ["query",
           "MATCH (n:SourceBatch)
            RETURN count(n) AS total"]
    expect:
      exit_code: 0
      stdout_contains: "3"
    tags: ["gap392", "verify", "count"]

  # =============================================================================
  # Multi-graph Operations
  # =============================================================================

  - name: "multi-graph-create-second"
    description: "Create a second named graph"
    args: ["query", "CREATE GRAPH IF NOT EXISTS second_graph"]
    expect:
      exit_code: 0
    tags: ["multi", "graph", "create"]

  - name: "multi-graph-use-second"
    description: "Switch to second graph"
    args: ["query", "USE GRAPH second_graph"]
    expect:
      exit_code: 0
    tags: ["multi", "graph", "use"]

  - name: "multi-graph-create-node-in-second"
    description: "Create node in second graph"
    args: ["query",
           "CREATE (n:SecondGraphNode {
              id: 'SECOND_GRAPH_NODE',
              graph_name: 'second_graph'
            })
            RETURN n.id AS id"]
    expect:
      exit_code: 0
      stdout_contains: "SECOND_GRAPH_NODE"
    tags: ["multi", "node", "create"]

  - name: "multi-graph-verify-isolation"
    description: "Verify graphs are isolated - second graph should have 1 node"
    args: ["query",
           "MATCH (n:SecondGraphNode)
            RETURN count(n) AS count"]
    expect:
      exit_code: 0
      stdout_contains: "1"
    tags: ["multi", "verify", "isolation"]

  - name: "multi-graph-switch-back"
    description: "Switch back to first graph"
    args: ["query", "USE GRAPH source_test"]
    expect:
      exit_code: 0
    tags: ["multi", "graph", "use"]

  - name: "multi-graph-verify-first-unchanged"
    description: "Verify first graph data unchanged"
    args: ["query",
           "MATCH (n:SourceBatch)
            RETURN count(n) AS count"]
    expect:
      exit_code: 0
      stdout_contains: "3"
    tags: ["multi", "verify", "isolation"]

  # =============================================================================
  # Edge Cases
  # =============================================================================

  - name: "edge-case-empty-graph"
    description: "Create and verify empty graph"
    args: ["query", "CREATE GRAPH IF NOT EXISTS empty_graph"]
    expect:
      exit_code: 0
    tags: ["edge", "graph", "create"]

  - name: "edge-case-use-empty"
    description: "Use empty graph"
    args: ["query", "USE GRAPH empty_graph"]
    expect:
      exit_code: 0
    tags: ["edge", "graph", "use"]

  - name: "edge-case-query-empty"
    description: "Query empty graph returns zero"
    args: ["query",
           "MATCH (n)
            RETURN count(n) AS count"]
    expect:
      exit_code: 0
      stdout_contains: "0"
    tags: ["edge", "verify", "empty"]

  - name: "edge-case-drop-if-exists"
    description: "Drop graph with IF EXISTS"
    args: ["query", "DROP GRAPH IF EXISTS empty_graph"]
    expect:
      exit_code: 0
    tags: ["edge", "graph", "drop"]

  - name: "edge-case-final-list"
    description: "Final list of graphs"
    args: ["query", "SHOW GRAPHS"]
    expect:
      exit_code: 0
    tags: ["edge", "graph", "list"]

invariants:
  - type: "server_running"
