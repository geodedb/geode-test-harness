version: "1.0"
name: "Working Geode Integration Tests"
description: "Verified working integration tests for Geode CLI"

cli:
  binary: "./zig-out/bin/geode"

tests:
  - name: "help-basic"
    description: "Basic help test"
    args: ["--help"]
    expect:
      exit_code: 0

  - name: "query-help-basic"
    description: "Query help basic test"
    args: ["query", "--help"]
    expect:
      exit_code: 0

  - name: "help-contains-geode"
    description: "Help contains geode"
    args: ["--help"]
    expect:
      exit_code: 0
      stdout_contains: ["geode"]

  - name: "query-help-contains-query"
    description: "Query help contains query"
    args: ["query", "--help"]
    expect:
      exit_code: 0
      stdout_contains: ["query"]
