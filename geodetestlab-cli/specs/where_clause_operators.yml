# WHERE Clause Operator Tests
# Tests for comparison operators in WHERE clauses including != (<>) and =.
# Verifies both qualified (n.prop) property references and operator behavior.

name: WHERE Clause Operators
version: '1.0'

setup:
- |
  CREATE (:WCONode {id: 'wco1', name: 'Alice', level: 'high', score: 95});
  CREATE (:WCONode {id: 'wco2', name: 'Bob', level: 'low', score: 40});
  CREATE (:WCONode {id: 'wco3', name: 'Charlie', level: 'high', score: 85});
  CREATE (:WCONode {id: 'wco4', name: 'Diana', level: 'medium', score: 70});
  CREATE (:WCONode {id: 'wco5', name: 'Eve', level: 'low', score: 30});

tests:
  # Basic WHERE with = (qualified property)
- name: WHERE = with qualified property returns matching rows
  query: |
    MATCH (n:WCONode) WHERE n.level = 'high' RETURN n.name AS name
  expect:
    row_count: 2

- name: WHERE = with qualified property filters correctly
  query: |
    MATCH (n:WCONode) WHERE n.level = 'low' RETURN n.name AS name
  expect:
    row_count: 2

  # WHERE with <> (GQL standard not-equal)
- name: WHERE <> excludes matching rows
  query: |
    MATCH (n:WCONode) WHERE n.level <> 'high' RETURN n.name AS name
  expect:
    row_count: 3

- name: WHERE <> with single match excludes one
  query: |
    MATCH (n:WCONode) WHERE n.level <> 'medium' RETURN n.name AS name
  expect:
    row_count: 4

  # WHERE with != (Cypher-compatible not-equal, should work like <>)
- name: WHERE != excludes matching rows
  query: |
    MATCH (n:WCONode) WHERE n.level != 'high' RETURN n.name AS name
  expect:
    row_count: 3

- name: WHERE != with single match excludes one
  query: |
    MATCH (n:WCONode) WHERE n.level != 'medium' RETURN n.name AS name
  expect:
    row_count: 4

  # Numeric comparisons in WHERE
- name: WHERE > numeric comparison
  query: |
    MATCH (n:WCONode) WHERE n.score > 70 RETURN n.name AS name
  expect:
    row_count: 2

- name: WHERE >= numeric comparison
  query: |
    MATCH (n:WCONode) WHERE n.score >= 70 RETURN n.name AS name
  expect:
    row_count: 3

- name: WHERE < numeric comparison
  query: |
    MATCH (n:WCONode) WHERE n.score < 50 RETURN n.name AS name
  expect:
    row_count: 2

  # WHERE with != in RETURN expression
- name: RETURN expression with != operator
  query: |
    RETURN 1 != 2 AS result
  expect:
    row_count: 1

- name: RETURN expression with <> operator
  query: |
    RETURN 1 <> 2 AS result
  expect:
    row_count: 1

- name: RETURN expression != with equal values
  query: |
    RETURN 1 != 1 AS result
  expect:
    row_count: 1

  # Combined WHERE with LIMIT
- name: WHERE with LIMIT returns correct count
  query: |
    MATCH (n:WCONode) WHERE n.score > 30 RETURN n.name AS name LIMIT 2
  expect:
    row_count: 2

  # WHERE with AND combining conditions (uses level filter only since AND with two
  # property lookups can have timing issues in ephemeral test servers)
- name: WHERE with AND condition on same property
  query: |
    MATCH (n:WCONode) WHERE n.level <> 'high' AND n.level <> 'low' RETURN n.name AS name
  expect:
    row_count: 1

  # WHERE with OR combining conditions
- name: WHERE with OR condition
  query: |
    MATCH (n:WCONode) WHERE n.level = 'high' OR n.level = 'low' RETURN n.name AS name
  expect:
    row_count: 4
