name: gap_0211_0221_security_fixes
description: Regression tests for security gap fixes (GAP-0211 through GAP-0221)
mode: server
server_args:
- --log-level
- error
tests:
- name: gap-0212-tde-encryption-roundtrip
  description: 'GAP-0212: Verify TDE encryption/decryption works (validates KMS connection)'
  query: "CREATE (n:TDETest {\n  sensitive_data: 'confidential_value_12345',\n  test_id: 'gap_0212_test'\n})\nRETURN n.sensitive_data AS `data`\n"
  expected:
    status: success
    result_contains: confidential_value
- name: gap-0212-tde-data-integrity
  description: 'GAP-0212: Verify encrypted data maintains integrity after storage'
  query: "MATCH (n:TDETest {test_id: 'gap_0212_test'})\nRETURN n.sensitive_data AS `data`\n"
  expected:
    status: success
    result_contains: confidential_value_12345
- name: gap-0214-backup-create
  description: 'GAP-0214: Create a test backup for verification'
  query: "CREATE (n:BackupTest {\n  data: 'backup_test_data',\n  timestamp: timestamp()\n});\nMATCH (n:BackupTest) RETURN count(n) AS created\n"
  expected:
    status: success
    result_contains: '1'
- name: gap-0215-create-index
  description: 'GAP-0215: Create an index to test catalog serialization'
  query: "CREATE INDEX gap_0215_test_index FOR (n:IndexTest) ON (n.test_field)\n"
  expected:
    status: success
- name: gap-0215-verify-index-exists
  description: 'GAP-0215: Verify index was created and persisted'
  query: "SHOW INDEXES\n"
  expected:
    status: success
    result_contains: gap_0215_test_index
- name: gap-0215-use-index
  description: 'GAP-0215: Use the created index in a query'
  query: "CREATE (n:IndexTest {test_field: 'indexed_value'})\nRETURN n.test_field AS value\n"
  expected:
    status: success
    result_contains: indexed_value
- name: gap-0215-query-with-index
  description: 'GAP-0215: Query using the index'
  query: "MATCH (n:IndexTest {test_field: 'indexed_value'})\nRETURN count(*) AS count\n"
  expected:
    status: success
    result_contains: '1'
- name: gap-0219-basic-query-execution
  description: 'GAP-0219: Verify basic query execution works (CI test validation)'
  query: "RETURN 1 + 1 AS result, 'ci_test' AS test_type\n"
  expected:
    status: success
    result_contains: '2'
- name: gap-0221-semantic-error-handling
  description: 'GAP-0221: Verify semantic errors are properly reported'
  query: "MATCH (n:NonExistentLabelForTest)\nWHERE n.field = undefined_variable\nRETURN n\n"
  # ISO/IEC 39075 20.12 SR 8: an unbound variable in WHERE is a 42000 error, not an empty result.
  expected:
    exit_code: 1
    stdout_contains: ['"status_class":"42000"', Variable not in scope]
- name: cleanup-gap-tests
  description: Clean up test data from GAP tests
  query: "MATCH (n) WHERE n:TDETest OR n:BackupTest OR n:IndexTest\nDETACH DELETE n\nRETURN count(*) AS deleted\n"
  expected:
    status: success
- name: cleanup-gap-index
  description: Drop test index
  query: "DROP INDEX IF EXISTS gap_0215_test_index\n"
  expected:
    status: success
