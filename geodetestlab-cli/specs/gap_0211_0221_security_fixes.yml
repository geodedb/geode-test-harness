# GAP-0211 through GAP-0221 Security Fixes Regression Tests
# Tests to ensure security fixes do not regress
# Created: January 16, 2026

name: gap_0211_0221_security_fixes
description: Regression tests for security gap fixes (GAP-0211 through GAP-0221)
mode: server
server_args: ["--log-level", "error"]

tests:
  # GAP-0212: KMS Connection Test (via TDE encryption/decryption)
  - name: gap-0212-tde-encryption-roundtrip
    description: "GAP-0212: Verify TDE encryption/decryption works (validates KMS connection)"
    query: |
      CREATE (n:TDETest {
        sensitive_data: 'confidential_value_12345',
        test_id: 'gap_0212_test'
      })
      RETURN n.sensitive_data AS data
    expected:
      status: success
      result_contains: "confidential_value"

  - name: gap-0212-tde-data-integrity
    description: "GAP-0212: Verify encrypted data maintains integrity after storage"
    query: |
      MATCH (n:TDETest {test_id: 'gap_0212_test'})
      RETURN n.sensitive_data AS data
    expected:
      status: success
      result_contains: "confidential_value_12345"

  # GAP-0214: Backup File Reading (via backup verify command)
  - name: gap-0214-backup-create
    description: "GAP-0214: Create a test backup for verification"
    query: |
      CREATE (n:BackupTest {
        data: 'backup_test_data',
        timestamp: timestamp()
      })
      RETURN count(*) AS created
    expected:
      status: success
      result_contains: "1"

  # GAP-0215: Catalog Index Serialization
  - name: gap-0215-create-index
    description: "GAP-0215: Create an index to test catalog serialization"
    query: |
      CREATE INDEX gap_0215_test_index FOR (n:IndexTest) ON (n.test_field)
    expected:
      status: success

  - name: gap-0215-verify-index-exists
    description: "GAP-0215: Verify index was created and persisted"
    query: |
      SHOW INDEXES
    expected:
      status: success
      result_contains: "gap_0215_test_index"

  - name: gap-0215-use-index
    description: "GAP-0215: Use the created index in a query"
    query: |
      CREATE (n:IndexTest {test_field: 'indexed_value'})
      RETURN n.test_field AS value
    expected:
      status: success
      result_contains: "indexed_value"

  - name: gap-0215-query-with-index
    description: "GAP-0215: Query using the index"
    query: |
      MATCH (n:IndexTest {test_field: 'indexed_value'})
      RETURN count(*) AS count
    expected:
      status: success
      result_contains: "1"

  # GAP-0219: CI Tests (verify basic test execution)
  - name: gap-0219-basic-query-execution
    description: "GAP-0219: Verify basic query execution works (CI test validation)"
    query: |
      RETURN 1 + 1 AS result, 'ci_test' AS test_type
    expected:
      status: success
      result_contains: "2"

  - name: gap-0219-complex-query-execution
    description: "GAP-0219: Verify complex queries work (CI test validation)"
    query: |
      UNWIND range(1, 5) AS i
      RETURN collect(i) AS numbers, size(collect(i)) AS count
    expected:
      status: success
      result_contains: "5"

  # GAP-0221: Error Handling (verify proper error responses)
  - name: gap-0221-syntax-error-handling
    description: "GAP-0221: Verify syntax errors are properly reported"
    query: |
      INVALID QUERY SYNTAX HERE
    expected:
      status: error
      error_contains: "syntax"

  - name: gap-0221-semantic-error-handling
    description: "GAP-0221: Verify semantic errors are properly reported"
    query: |
      MATCH (n:NonExistentLabelForTest)
      WHERE n.field = undefined_variable
      RETURN n
    expected:
      status: success
      result_contains: "[]"

  # Cleanup tests
  - name: cleanup-gap-tests
    description: "Clean up test data from GAP tests"
    query: |
      MATCH (n) WHERE n:TDETest OR n:BackupTest OR n:IndexTest
      DETACH DELETE n
      RETURN count(*) AS deleted
    expected:
      status: success

  - name: cleanup-gap-index
    description: "Drop test index"
    query: |
      DROP INDEX gap_0215_test_index IF EXISTS
    expected:
      status: success
