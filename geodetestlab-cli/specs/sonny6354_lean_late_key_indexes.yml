# SONNY-6354: residuals of SONNY-6268 and SONNY-3056 in the storage layer.
#   (1) setNodeProperty failing on bit-63 reserved ids: an internal id invariant, covered by the
#       in-process store test (not reachable from a client; such an id is refused at creation).
#   (2) Lean index mode (GEODE_INDEX_MERGE_KEYS_ONLY=1): the exact node-property index held a
#       key only once registered by the first MERGE on it; nodes written earlier were never
#       added, yet every seek trusted the index as complete, so a WHERE / inline-map seek and the
#       bulk edge-endpoint resolvers missed them, and the index saved at shutdown carried the
#       hole across a reopen.
#   (3) A composite MERGE key registered at runtime was backfilled from resident (cached) nodes
#       only, so an evicted holder had no composite entry and the composite probe's
#       authoritative miss lost it (a MERGE then created a duplicate).
#
# This spec starts a real `geode serve` in lean index mode with a 32-entry node cache
# (GEODE_INDEX_MERGE_KEYS_ONLY=1, GEODE_NODE_CACHE_ENTRIES=32), writes 300 nodes before their
# key is registered, and proves seeks, edge-endpoint resolution and composite MERGE find the old
# nodes before and after a SIGKILL + reopen.

version: '1.0'
name: SONNY-6354 lean index late keys and composite MERGE backfill
description: Late-registered MERGE keys in lean index mode with a small node cache
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 240000
    cleanup: false
    args:
    - --log-level
    - warn
    env:
      GEODE_ADMIN_PASSWORD: Correct Horse Battery Staple 42!
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
      GEODE_INDEX_MERGE_KEYS_ONLY: '1'
      GEODE_NODE_CACHE_ENTRIES: '32'
  client:
    timeout_ms: 30000
    tls_verify: false
    format: json
default_timeout_ms: 120000
tests:
- name: seed-late-key-nodes
  description: '300 nodes (far more than the 32-entry node cache) carrying a key `j` written BEFORE it is a MERGE key (lean index mode: j is not in the exact index)'
