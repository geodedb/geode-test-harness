- name: sigkill
  description: SIGKILL and reopen (the index is rebuilt/reloaded from what is on disk)
  type: bash
  command: |-
    set -e
    [ -n "${GEODE_DATA_DIR}" ] || { echo "GEODE_DATA_DIR unset"; exit 1; }
    BN="$(basename "${GEODE_BINARY:-geode}")"
    pkill -9 -f "$BN serve.*--data-dir ${GEODE_DATA_DIR} " || true
    sleep 1
    echo CRASH_KILL_DONE
  restart_server: true
  expect:
    exit_code: 0
    stdout_contains:
    - CRASH_KILL_DONE
  tags:
  - storage
  - sonny738
  - crash
