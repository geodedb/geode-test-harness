- name: composite-merge-matches
  description: A composite MERGE on (src, sid) registered at runtime resolves an old, evicted holder instead of creating a duplicate
  args:
  - query
  - '-'
  stdin: "MERGE (n:C6354 {src: 'gbif', sid: 3}) RETURN n.t AS t"
  expect:
    exit_code: 0
    stdout_contains:
    - '"rows":[{"t":"c3"}]'
  tags:
  - storage
  - sonny738
- name: composite-merge-no-duplicate
  description: Still one node for that key
  args:
  - query
  - '-'
  stdin: "MATCH (n:C6354 {src: 'gbif', sid: 3}) RETURN count(n) AS c"
  expect:
    exit_code: 0
    stdout_contains:
