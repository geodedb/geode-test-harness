version: '1.0'
name: GPS auth state transitions — policy decisions across enable/disable/role/self-password + restart
description: |
  Exercises the GPS decision cache invalidation contract across the
  auth_version bump points and verifies persistence of every change
  across a real server restart. The cache key
  (auth_version, policy_version, action_tag, resource_hash, principal_hash)
  is the integrity boundary: ANY of those five components shifting
  must cause a fresh policy decision, and persistent layers must
  re-hydrate the new values after restart.

  PHASE 1 (pre-restart):
    1. Create alice (readonly) and a policy granting alice WRITE
    2. alice writes — ALLOW (positive baseline)
    3. alice self-rotates her password via ALTER USER (GAP-0284 wire path
       enforces self-service only — admin cannot reset other users'
       passwords through this path)
        - OLD password is rejected (auth_version bumped)
        - NEW password is accepted (fresh policy decision)
    4. Admin disables alice via ALTER USER alice DISABLE
        - alice cannot authenticate at all
    5. Admin re-enables alice via ALTER USER alice ENABLE
        - alice can write again
    6. Admin changes alice's ROLE via ALTER USER alice SET ROLE admin
        - auth_version bumps, alice's session can no longer reuse cached
          decisions; she is allowed under the new role
    7. DROP POLICY → alice denied (the policy gate is gone; her role still
       allows but the GPS layer enforces deny without a matching policy
       since GPS sits in front of the role gate)
       NOTE: With role=admin, the role-based DEFAULT path may allow WRITE
       even with no policy. We test policy-deny only while alice is on
       the readonly role.
    8. Re-create the policy and verify ALLOW resumes

  RESTART (real SIGTERM + reopen against same data dir)

  PHASE 2 (post-restart):
    9. alice's rotated password is still valid (persisted hash + bumped
       auth_version)
    10. alice's OLD password remains rejected (no rollback)
    11. SHOW POLICIES still lists the re-created policy
    12. DROP USER alice and verify she cannot authenticate
    13. Policy survives user-drop (deliberate decoupling of USER and POLICY
        lifecycles)

  Verifies persistent + in-memory consistency for:
    1. user_storage.persistPasswordChange → auth_version bump
    2. user_storage.persistActiveChange → auth_version bump
    3. user_storage.persistRoleChange → auth_version bump
    4. policy_persistence.persistPolicy/dropPolicy → policy_version bump
    5. decision_cache invalidation by auth_version/policy_version key components
    6. __geode_security HMAC-chained graph survives restart

  KNOWN LIMITATION: admin cannot reset another user's password via
  ALTER USER ... SET PASSWORD. The wire intercept in
  src/server/quic_connection_handler.zig parseAlterUserSetPassword
  routes ALL such statements to handleAlterUserSetPassword which
  enforces self-only at line 2581: `if (!std.mem.eql(u8, auth_user,
  username))`. This is by design (GAP-0284) — password resets happen
  in the forced-reset flow. The admin path through admin_ddl is
  blocked by the wire intercept.

  CANARY: REQ=REQ-GPS-CACHE-002; FEATURE="GPS Auth State Transitions"; ASPECT=DecisionCacheInvalidationAcrossRestart; STATUS=TESTED; OWNER=security; UPDATED=2026-05-21
cli:
  binary: ./zig-out/bin/geode
  working_dir:
  env:
    GEODE_LOG_LEVEL: warn
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 60000
    cleanup: false
    args: [--log-level, warn]
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 30000
    format: json
secrets:
  admin_password:
    source: env
    key: GEODE_ADMIN_PASSWORD
    required: false
    default: GeodeTestPassword123!
invariants:
- type: server_running
fuzz:
  enabled: false
tests:
  # ============================================================================
  # PHASE 1 SETUP
  # ============================================================================
- name: authxn-preflight
  description: Idempotent preflight cleanup for repeatable reruns.
  args: [query, -U, geode, -P, '${secret:admin_password}', '-']
  stdin: |
    DROP POLICY IF EXISTS authxn_alice_write;
    DROP USER IF EXISTS authxn_alice;
  expect: {exit_code: 0}
  tags: [persistence, authxn, setup]

- name: authxn-create-alice
  description: Create alice with the initial password.
  args: [query, -U, geode, -P, '${secret:admin_password}', CREATE USER authxn_alice SET PASSWORD 'AuthXnAlice-Initial-1234' ROLE readonly]
  expect:
    exit_code: 0
    stdout_contains: [authxn_alice]
  tags: [persistence, authxn, setup]

- name: authxn-create-policy
  description: Policy granting alice WRITE.
  args: [query, -U, geode, -P, '${secret:admin_password}', CREATE POLICY authxn_alice_write ON GRAPH * FOR WRITE USING current_user() = 'authxn_alice']
  expect:
    exit_code: 0
    stdout_contains: [Policy created]
  tags: [persistence, authxn, setup]

  # ============================================================================
  # PHASE 1.1: baseline — alice can write with her initial password
  # ============================================================================
- name: phase1-baseline-alice-write
  description: POSITIVE baseline — alice writes with her initial password.
  args: [query, -U, authxn_alice, -P, AuthXnAlice-Initial-1234, '-']
  stdin: 'CREATE (n:AuthXnBaseline {v: 1}) RETURN n'
  expect:
    exit_code: 0
    stdout_contains: [AuthXnBaseline]
    stdout_not_contains: ['42501']
  tags: [persistence, authxn, phase1, positive]

  # ============================================================================
  # PHASE 1.2: SELF password change → auth_version bumps
  # alice authenticates as herself and rotates her own password.
  # ============================================================================
- name: phase1-self-rotate-password
  description: |
    alice rotates her OWN password. The GAP-0284 wire intercept
    enforces self-service only (auth_user must match the target
    username). The ALTER itself succeeds with a status-only 00000
    response (payload = null, so the client issues no follow-up
    PULL — the old exit-3/"Authentication failed" expectation
    pinned a client-side artifact, not a server contract). The
    security contract — session invalidated (28000 on the next
    statement over the same connection), old password rejected,
    new password accepted — is asserted by
    phase1-alice-old-password-rejected and
    phase1-alice-new-password-allowed below.
  args: [query, -U, authxn_alice, -P, AuthXnAlice-Initial-1234, '-']
  stdin: ALTER USER authxn_alice SET PASSWORD 'AuthXnAlice-Rotated-9999'
  expect:
    exit_code: 0
    stdout_contains: ['"status_class":"00000"']
  tags: [persistence, authxn, phase1, session_invalidation]

- name: phase1-alice-old-password-rejected
  description: |
    NEGATIVE — alice cannot auth with the OLD password after rotation.
    The auth layer rejects before any policy decision is even attempted.
  args: [query, -U, authxn_alice, -P, AuthXnAlice-Initial-1234, '-']
  stdin: 'CREATE (n:AuthXnShouldNeverExist {v: 1}) RETURN n'
  expect:
    exit_code: 3
    stderr_contains: [Authentication failed]
  tags: [persistence, authxn, phase1, negative]

- name: phase1-alice-new-password-allowed
  description: |
    POSITIVE — alice can auth with the NEW password and the WRITE
    policy still applies (current_user='authxn_alice' is unchanged).
  args: [query, -U, authxn_alice, -P, AuthXnAlice-Rotated-9999, '-']
  stdin: 'CREATE (n:AuthXnAfterPwdRotate {v: 1}) RETURN n'
  expect:
    exit_code: 0
    stdout_contains: [AuthXnAfterPwdRotate]
    stdout_not_contains: ['42501']
  tags: [persistence, authxn, phase1, positive]

  # ============================================================================
  # PHASE 1.3: ENABLE/DISABLE — admin path, auth_version bumps
  # ============================================================================
- name: phase1-disable-alice
  description: |
    Admin disables alice via ALTER USER alice DISABLE. auth_version
    bumps; the user cannot authenticate regardless of password.
  args: [query, -U, geode, -P, '${secret:admin_password}', ALTER USER authxn_alice DISABLE]
  expect:
    exit_code: 0
  tags: [persistence, authxn, phase1]

- name: phase1-alice-disabled-cannot-auth
  description: NEGATIVE — disabled alice fails authentication.
  args: [query, -U, authxn_alice, -P, AuthXnAlice-Rotated-9999, '-']
  stdin: 'CREATE (n:AuthXnDisabled {v: 1}) RETURN n'
  expect:
    exit_code: 3
    stderr_contains: [Authentication failed]
  tags: [persistence, authxn, phase1, negative]

- name: phase1-enable-alice
  description: Re-enable alice via ALTER USER alice ENABLE.
  args: [query, -U, geode, -P, '${secret:admin_password}', ALTER USER authxn_alice ENABLE]
  expect:
    exit_code: 0
  tags: [persistence, authxn, phase1]

- name: phase1-alice-enabled-can-write
  description: POSITIVE — re-enabled alice can write again.
  args: [query, -U, authxn_alice, -P, AuthXnAlice-Rotated-9999, '-']
  stdin: 'CREATE (n:AuthXnEnabled {v: 1}) RETURN n'
  expect:
    exit_code: 0
    stdout_contains: [AuthXnEnabled]
    stdout_not_contains: ['42501']
  tags: [persistence, authxn, phase1, positive]

  # ============================================================================
  # PHASE 1.4: policy drop → policy_version bumps, cache invalidates
  # ============================================================================
- name: phase1-drop-policy
  description: Drop alice's policy → policy_version bumps.
  args: [query, -U, geode, -P, '${secret:admin_password}', DROP POLICY authxn_alice_write]
  expect:
    exit_code: 0
    stdout_contains: [Policy dropped]
  tags: [persistence, authxn, phase1]

- name: phase1-alice-denied-no-policy
  description: |
    NEGATIVE — alice still authenticates but no policy matches → DENY.
    A stale cached ALLOW from before the drop would let this through;
    the policy_version component of the cache key prevents that.
  args: [query, -U, authxn_alice, -P, AuthXnAlice-Rotated-9999, '-']
  stdin: 'CREATE (n:AuthXnNoPolicy {v: 1}) RETURN n'
  expect:
    exit_code: 0
    stdout_contains: ['42501', Permission denied]
  tags: [persistence, authxn, phase1, negative]

- name: phase1-recreate-policy
  description: |
    Re-create the policy → policy_version bumps again. A stale cached
    DENY from the previous policy gap would block alice incorrectly;
    the version bump invalidates it.
  args: [query, -U, geode, -P, '${secret:admin_password}', CREATE POLICY authxn_alice_write ON GRAPH * FOR WRITE USING current_user() = 'authxn_alice']
  expect:
    exit_code: 0
    stdout_contains: [Policy created]
  tags: [persistence, authxn, phase1]

- name: phase1-alice-allowed-after-policy-recreated
  description: POSITIVE — alice is allowed again after the policy comes back.
  args: [query, -U, authxn_alice, -P, AuthXnAlice-Rotated-9999, '-']
  stdin: 'CREATE (n:AuthXnPolicyRecreated {v: 1}) RETURN n'
  expect:
    exit_code: 0
    stdout_contains: [AuthXnPolicyRecreated]
    stdout_not_contains: ['42501']
  tags: [persistence, authxn, phase1, positive]

  # ============================================================================
  # SERVER RESTART
  # ============================================================================
- name: authxn-restart-checkpoint
  description: |
    Stop + restart the server. Persistent layers must restore:
    - alice's current password (rotated)
    - alice's active=true
    - alice's auth_version (>= the bumped value)
    - the re-created policy and its policy_version
  type: bash
  command: echo 'auth state transition restart checkpoint'
  restart_server: true
  expect: {exit_code: 0}
  tags: [persistence, authxn, restart]

  # ============================================================================
  # PHASE 2: post-restart enforcement using the rotated password
  # ============================================================================
- name: phase2-alice-new-password-works
  description: |
    POSITIVE — alice can auth with the rotated password after restart.
    Both the password hash and the active flag were re-hydrated from
    __geode_security.
  args: [query, -U, authxn_alice, -P, AuthXnAlice-Rotated-9999, '-']
  stdin: 'CREATE (n:AuthXnPostRestartGood {v: 1}) RETURN n'
  expect:
    exit_code: 0
    stdout_contains: [AuthXnPostRestartGood]
    stdout_not_contains: ['42501']
  tags: [persistence, authxn, phase2, positive]

- name: phase2-alice-old-password-still-rejected
  description: |
    NEGATIVE — the OLD password is not rolled back across restart;
    it remains rejected.
  args: [query, -U, authxn_alice, -P, AuthXnAlice-Initial-1234, '-']
  stdin: 'CREATE (n:AuthXnPostRestartBad {v: 1}) RETURN n'
  expect:
    exit_code: 3
    stderr_contains: [Authentication failed]
  tags: [persistence, authxn, phase2, negative]

- name: phase2-policy-survived
  description: |
    POSITIVE — the re-created policy survived restart and is hydrated
    into the catalog.
  args: [query, -U, geode, -P, '${secret:admin_password}', SHOW POLICIES]
  expect:
    exit_code: 0
    stdout_contains: [authxn_alice_write]
  tags: [persistence, authxn, phase2, positive]

  # ============================================================================
  # PHASE 2.1: drop the user — auth must fail post-deletion
  # ============================================================================
- name: phase2-drop-alice
  description: Admin drops alice entirely. User record removed from store.
  args: [query, -U, geode, -P, '${secret:admin_password}', DROP USER authxn_alice]
  expect:
    exit_code: 0
  tags: [persistence, authxn, phase2]

- name: phase2-alice-dropped-cannot-auth
  description: |
    NEGATIVE — dropped user cannot authenticate at all. The user is
    gone from both in-memory and persistent stores.
  args: [query, -U, authxn_alice, -P, AuthXnAlice-Rotated-9999, '-']
  stdin: 'CREATE (n:AuthXnDropped {v: 1}) RETURN n'
  expect:
    exit_code: 3
    stderr_contains: [Authentication failed]
  tags: [persistence, authxn, phase2, negative]

- name: phase2-orphan-policy-survives-user-drop
  description: |
    POSITIVE — the policy still exists; it's just orphaned (no user
    matches current_user='authxn_alice' anymore). This documents the
    deliberate decoupling between USER and POLICY lifecycles.
  args: [query, -U, geode, -P, '${secret:admin_password}', SHOW POLICIES]
  expect:
    exit_code: 0
    stdout_contains: [authxn_alice_write]
  tags: [persistence, authxn, phase2, positive, decoupling]

  # ============================================================================
  # TEARDOWN
  # ============================================================================
- name: authxn-cleanup
  description: Drop test policy and any leftover state.
  args: [query, -U, geode, -P, '${secret:admin_password}', '-']
  stdin: |
    DROP POLICY IF EXISTS authxn_alice_write;
    DROP USER IF EXISTS authxn_alice;
    MATCH (n) WHERE n:AuthXnBaseline OR n:AuthXnAfterPwdRotate OR n:AuthXnEnabled OR n:AuthXnPolicyRecreated OR n:AuthXnPostRestartGood DELETE n;
  expect: {exit_code: 0}
  tags: [persistence, authxn, teardown]

tags:
- persistence
- auth_state_transitions
- decision_cache
- auth_version
- policy_version
- restart
- security
- comprehensive
