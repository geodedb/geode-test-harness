version: '1.0'
name: GAP-0137 Backup/Migrate TLS Tests
description: Tests for TLS certificate verification in backup and migrate CLI commands
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: false
    port: null
    data_dir: null
    startup_timeout_ms: 60000
    cleanup: true
    args: []
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 30000
    tls_verify: false
    format: json
tests:
- name: backup-create-help-shows-tls
  description: Test backup create help shows TLS certificate options
  args:
  - backup
  - create
  - --help
  expect:
    exit_code: 0
    stderr_contains:
    - --insecure
    - --ca-cert
    - --client-cert
    - --client-key
  tags:
  - backup
  - tls
  - help
  - gap-0137
- name: restore-help-shows-tls-options
  description: Test restore help shows TLS certificate options
  args:
  - restore
  - --help
  expect:
    exit_code: 0
    stderr_contains:
    - --insecure
    - --ca-cert
    - --client-cert
    - --client-key
  tags:
  - restore
  - tls
  - help
  - gap-0137
- name: migrate-run-help-shows-tls-options
  description: Test migrate run help shows TLS certificate options
  args:
  - migrate
  - run
  - --help
  expect:
    exit_code: 0
    stderr_contains:
    - --insecure
    - --ca-cert
    - --client-cert
    - --client-key
  tags:
  - migrate
  - tls
  - help
  - gap-0137
tags:
- backup
- restore
- migrate
- tls
- security
- gap-0137
