---
# GAP-0137: TLS Certificate Verification for Backup/Migrate CLI
# CANARY: REQ=REQ-TLS-BACKUP-TEST-001; FEATURE="Backup TLS"; ASPECT=TestCoverage; STATUS=TESTED; TEST=geodetestlab/specs/gap_137_backup_tls.yml; OWNER=testing; UPDATED=2026-01-13
version: "1.0"
name: "GAP-0137 Backup/Migrate TLS Tests"
description: "Tests for TLS certificate verification in backup and migrate CLI commands"

cli:
  binary: "./zig-out/bin/geode"
  server:
    enabled: false
    port: null
    data_dir: null
    startup_timeout_ms: 60000
    cleanup: true
    args: []
    env: {}
  client:
    timeout_ms: 30000
    tls_verify: false
    format: "json"

tests:
  # Help output tests to verify TLS options are documented
  - name: backup-create-help-shows-tls
    description: Test backup create help shows TLS certificate options
    args: ["backup", "create", "--help"]
    expect:
      exit_code: 0
      stdout_contains: ["--insecure", "--ca-cert", "--client-cert", "--client-key"]
    tags: [backup, tls, help, gap-0137]

  - name: restore-help-shows-tls-options
    description: Test restore help shows TLS certificate options
    args: ["restore", "--help"]
    expect:
      exit_code: 0
      stdout_contains: ["--insecure", "--ca-cert", "--client-cert", "--client-key"]
    tags: [restore, tls, help, gap-0137]

  - name: migrate-run-help-shows-tls-options
    description: Test migrate run help shows TLS certificate options
    args: ["migrate", "run", "--help"]
    expect:
      exit_code: 0
      stdout_contains: ["--insecure", "--ca-cert", "--client-cert", "--client-key"]
    tags: [migrate, tls, help, gap-0137]

tags: [backup, restore, migrate, tls, security, gap-0137]
