version: '1.0'
name: GQL MERGE Bare SET
description: 'Tests that MERGE supports bare SET (without ON CREATE/MATCH prefix) (GAP #59)'
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 30000
    cleanup: true
    args:
    - --log-level
    - info
  client:
    timeout_ms: 15000
    tls_verify: false
    format: json
tests:
- name: merge-bare-set-create-path
  description: MERGE with bare SET should apply on create path
  args:
  - query
  - "MERGE (n:BareSet {key: 'k1'}) SET n.value = 'hello' RETURN n.value AS v"
  expect:
    exit_code: 0
    stdout_json_assert:
    - expression: results[0].v
      equals: hello
  tags:
  - merge
  - bare-set

- name: merge-bare-set-match-path
  description: MERGE with bare SET should apply on match path too
  args:
  - query
  - "MERGE (n:BareSet2 {key: 'k2'}) SET n.value = 'first'"
  - --
  - query
  - "MERGE (n:BareSet2 {key: 'k2'}) SET n.value = 'second' RETURN n.value AS v"
  expect:
    exit_code: 0
    stdout_json_assert:
    - expression: results[0].v
      equals: second
  tags:
  - merge
  - bare-set

- name: merge-bare-set-no-parse-error
  description: MERGE with bare SET should not return parse error
  args:
  - query
  - "MERGE (n:BareSet3 {id: '1'}) SET n.status = 'active'"
  expect:
    exit_code: 0
  tags:
  - merge
  - bare-set
  - parse
