name: 'GAP-0257: ISO/IEC 39075:2024 conformance verification'
description: Comprehensive verification of GQL standard compliance across all feature areas
mode: server
server_args: []
tests:
  # === Setup ===
- name: 'ISO-SETUP-001: create test graph'
  query: CREATE GRAPH iso257
  expected:
    exit_code: 0

- name: 'ISO-SETUP-002: insert test nodes'
  query: "USE GRAPH iso257 CREATE (n:Person {name: 'Alice', age: 30})"
  expected:
    exit_code: 0

- name: 'ISO-SETUP-003: insert second node'
  query: "USE GRAPH iso257 INSERT (m:Person {name: 'Bob', age: 25})"
  expected:
    exit_code: 0

- name: 'ISO-SETUP-004: insert edge'
  query: "USE GRAPH iso257 MATCH (a:Person {name: 'Alice'}) MATCH (b:Person {name: 'Bob'}) CREATE (a)-[:Knows {since: 2020}]->(b)"
  expected:
    exit_code: 0

  # === Pattern Matching (ISO 15.1-15.3) ===
- name: 'ISO-PM-001: MATCH node with label'
  query: USE GRAPH iso257 MATCH (n:Person) RETURN n.name
  expected:
    exit_code: 0
    stdout_contains:
    - Alice
    - Bob

- name: 'ISO-PM-002: MATCH with property predicate'
  query: "USE GRAPH iso257 MATCH (n:Person {name: 'Alice'}) RETURN n.age"
  expected:
    exit_code: 0
    stdout_contains:
    - '30'

- name: 'ISO-PM-003: MATCH edge pattern'
  query: USE GRAPH iso257 MATCH (a:Person)-[r:Knows]->(b:Person) RETURN a.name AS src_name, b.name AS dst_name
  expected:
    exit_code: 0
    stdout_contains:
    - Alice
    - Bob

- name: 'ISO-PM-004: OPTIONAL MATCH'
  query: USE GRAPH iso257 MATCH (n:Person) OPTIONAL MATCH (n)-[r:WorksWith]->(m) RETURN n.name, m.name
  expected:
    exit_code: 0
    stdout_contains:
    - Alice
    - 'null'

- name: 'ISO-PM-005: variable-length path'
  query: USE GRAPH iso257 MATCH (a:Person)-[:Knows*1..2]->(b:Person) RETURN a.name, b.name
  expected:
    exit_code: 0
    stdout_contains:
    - Alice

  # === DML Operations (ISO 12.1-12.5) ===
- name: 'ISO-DML-001: INSERT node'
  query: "USE GRAPH iso257 INSERT (c:Person {name: 'Charlie', age: 35})"
  expected:
    exit_code: 0

- name: 'ISO-DML-002: SET property'
  query: "USE GRAPH iso257 MATCH (n:Person {name: 'Charlie'}) SET n.age = 36 RETURN n.age"
  expected:
    exit_code: 0
    stdout_contains:
    - '36'

- name: 'ISO-DML-003: REMOVE property'
  query: "USE GRAPH iso257 MATCH (n:Person {name: 'Charlie'}) REMOVE n.age RETURN n.name"
  expected:
    exit_code: 0
    stdout_contains:
    - Charlie

- name: 'ISO-DML-004: DELETE node'
  query: "USE GRAPH iso257 MATCH (n:Person {name: 'Charlie'}) DELETE n"
  expected:
    exit_code: 0

- name: 'ISO-DML-005: MERGE node'
  query: "USE GRAPH iso257 MERGE (n:Person {name: 'Diana'}) RETURN n.name"
  expected:
    exit_code: 0
    stdout_contains:
    - Diana

  # === Expressions (ISO 10.1-10.5) ===
- name: 'ISO-EXPR-001: arithmetic expressions'
  query: RETURN 2 + 3 AS sum, 10 - 4 AS diff, 3 * 7 AS product, 15 / 3 AS quotient
  expected:
    exit_code: 0
    stdout_contains:
    - '5'
    - '6'
    - '21'

- name: 'ISO-EXPR-002: comparison operators'
  query: RETURN 5 > 3 AS gt, 2 < 8 AS lt, 4 >= 4 AS gte, 3 <= 5 AS lte, 1 = 1 AS eq, 1 <> 2 AS neq
  expected:
    exit_code: 0
    stdout_contains:
    - 'true'

- name: 'ISO-EXPR-003: CASE expression'
  query: RETURN CASE WHEN 1 > 0 THEN 'positive' ELSE 'negative' END AS result
  expected:
    exit_code: 0
    stdout_contains:
    - positive

- name: 'ISO-EXPR-004: NULL handling'
  query: RETURN null IS NULL AS is_null, 1 IS NOT NULL AS not_null
  expected:
    exit_code: 0
    stdout_contains:
    - 'true'

- name: 'ISO-EXPR-005: boolean logic'
  query: RETURN true AND true AS and_true, true OR false AS or_true, NOT false AS not_false
  expected:
    exit_code: 0
    stdout_contains:
    - 'true'

  # === Type System (ISO 5.1-5.4) ===
- name: 'ISO-TYPE-001: integer type'
  query: RETURN 42 AS i
  expected:
    exit_code: 0
    stdout_contains:
    - '42'

- name: 'ISO-TYPE-002: float type'
  query: RETURN 3.14 AS f
  expected:
    exit_code: 0
    stdout_contains:
    - '3.14'

- name: 'ISO-TYPE-003: string type'
  query: RETURN 'hello world' AS s
  expected:
    exit_code: 0
    stdout_contains:
    - hello world

- name: 'ISO-TYPE-004: boolean type'
  query: RETURN true AS b
  expected:
    exit_code: 0
    stdout_contains:
    - 'true'

- name: 'ISO-TYPE-005: list type'
  query: RETURN [1, 2, 3] AS lst
  expected:
    exit_code: 0
    stdout_contains:
    - '1'
    - '2'
    - '3'

  # === Aggregations (ISO 11.1) ===
- name: 'ISO-AGG-001: COUNT aggregation'
  query: USE GRAPH iso257 MATCH (n:Person) RETURN count(n) AS cnt
  expected:
    exit_code: 0
    stdout_contains:
    - cnt

- name: 'ISO-AGG-002: SUM aggregation'
  query: USE GRAPH iso257 MATCH (n:Person) WHERE n.age IS NOT NULL RETURN sum(n.age) AS total
  expected:
    exit_code: 0
    stdout_contains:
    - total

- name: 'ISO-AGG-003: AVG aggregation'
  query: USE GRAPH iso257 MATCH (n:Person) WHERE n.age IS NOT NULL RETURN avg(n.age) AS average
  expected:
    exit_code: 0
    stdout_contains:
    - average

- name: 'ISO-AGG-004: MIN/MAX aggregation'
  query: USE GRAPH iso257 MATCH (n:Person) WHERE n.age IS NOT NULL RETURN min(n.age) AS youngest, max(n.age) AS oldest
  expected:
    exit_code: 0
    stdout_contains:
    - youngest
    - oldest

  # === Set Operations (ISO 14.1) ===
- name: 'ISO-SET-001: UNION ALL'
  query: RETURN 1 AS x UNION ALL RETURN 1 AS x
  expected:
    exit_code: 0
    stdout_contains:
    - '1'

- name: 'ISO-SET-002: UNION DISTINCT'
  query: RETURN 1 AS x UNION DISTINCT RETURN 1 AS x
  expected:
    exit_code: 0
    stdout_contains:
    - '1'

  # === Query Clauses (ISO 13.1-13.4) ===
- name: 'ISO-QC-001: WHERE clause'
  query: USE GRAPH iso257 MATCH (n:Person) WHERE n.age > 20 RETURN n.name
  expected:
    exit_code: 0
    stdout_contains:
    - name

- name: 'ISO-QC-002: ORDER BY clause'
  query: USE GRAPH iso257 MATCH (n:Person) WHERE n.age IS NOT NULL RETURN n.name, n.age ORDER BY n.age
  expected:
    exit_code: 0
    stdout_contains:
    - name

- name: 'ISO-QC-003: LIMIT and OFFSET'
  query: USE GRAPH iso257 MATCH (n:Person) RETURN n.name LIMIT 1
  expected:
    exit_code: 0
    stdout_contains:
    - name

- name: 'ISO-QC-004: WITH clause'
  query: USE GRAPH iso257 MATCH (n:Person) WITH n.name AS personName WHERE personName = 'Alice' RETURN personName
  expected:
    exit_code: 0
    stdout_contains:
    - Alice

  # === Transactions (ISO 16.1-16.3) ===
- name: 'ISO-TXN-001: BEGIN and COMMIT'
  query: "USE GRAPH iso257 BEGIN INSERT (t:TxnTest {val: 'committed'}) COMMIT"
  expected:
    exit_code: 0

- name: 'ISO-TXN-002: BEGIN and ROLLBACK'
  query: "USE GRAPH iso257 BEGIN INSERT (t:TxnRollback {val: 'rolled_back'}) ROLLBACK"
  expected:
    exit_code: 0

  # === Functions (ISO 10.6) ===
- name: 'ISO-FUNC-001: string functions'
  query: RETURN upper('hello') AS up, lower('WORLD') AS lo, trim('  hi  ') AS trimmed
  expected:
    exit_code: 0
    stdout_contains:
    - HELLO
    - world
    - hi

- name: 'ISO-FUNC-002: math functions'
  query: RETURN abs(-5) AS absolute, ceil(3.2) AS ceiling, floor(3.8) AS floored
  expected:
    exit_code: 0
    stdout_contains:
    - '5'

- name: 'ISO-FUNC-003: COALESCE function'
  query: RETURN COALESCE(null, null, 'found') AS result
  expected:
    exit_code: 0
    stdout_contains:
    - found

  # === EXPLAIN/PROFILE (ISO 17.1) ===
- name: 'ISO-EP-001: EXPLAIN query plan'
  query: USE GRAPH iso257 EXPLAIN MATCH (n:Person) RETURN n
  expected:
    exit_code: 0
    stdout_contains:
    - Scan

- name: 'ISO-EP-002: PROFILE execution stats'
  query: USE GRAPH iso257 PROFILE MATCH (n:Person) RETURN n
  expected:
    exit_code: 0

  # === Catalog Operations (ISO 18.1) ===
- name: 'ISO-CAT-001: CREATE GRAPH'
  query: CREATE GRAPH iso257_temp
  expected:
    exit_code: 0

- name: 'ISO-CAT-002: USE GRAPH'
  query: USE GRAPH iso257_temp RETURN 1 AS x
  expected:
    exit_code: 0
    stdout_contains:
    - '1'

- name: 'ISO-CAT-003: DROP GRAPH'
  query: DROP GRAPH iso257_temp
  expected:
    exit_code: 0

  # === Cleanup ===
- name: 'ISO-CLEANUP-001: delete Diana node'
  query: "USE GRAPH iso257 MATCH (n:Person {name: 'Diana'}) DELETE n"
  expected:
    exit_code: 0

- name: 'ISO-CLEANUP-002: drop test graph'
  query: DROP GRAPH iso257
  expected:
    exit_code: 0
