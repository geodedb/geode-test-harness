---
# Backup Operations Basic Tests
# Converted from legacy format
version: "1.0"
name: "Backup Operations Basic Tests"
description: "Testing backup-related commands"

cli:
  binary: "./zig-out/bin/geode"
  server:
    enabled: true
    port: null
    data_dir: null
    startup_timeout_ms: 60000
    cleanup: true
    args: ["--log-level", "warn"]
    env: {}
  client:
    timeout_ms: 30000
    tls_verify: false
    format: "json"

tests:
  - name: backup-help
    description: Test backup help command
    args: ["backup", "--help"]
    expect:
      exit_code: 0
      stdout_contains: ["backup"]
    tags: [backup, help]

  - name: data-persistence
    description: Test data can be created
    args: ["query", "-"]
    stdin: "CREATE (n:BackupTest {id: 1}) RETURN n.id AS id"
    expect:
      exit_code: 0
      stdout_contains: ["id"]
    tags: [backup, data]

  - name: verify-data
    description: Verify data exists
    args: ["query", "-"]
    stdin: "MATCH (n:BackupTest) RETURN count(n) AS cnt"
    expect:
      exit_code: 0
    tags: [backup, verify]

tags: [backup, wal, enterprise]
