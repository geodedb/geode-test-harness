version: "1.0"
name: "Geode Server Only Tests"
description: "Test Geode server startup and management without client queries"

cli:
  binary: "./zig-out/bin/geode"
  server:
    enabled: true
    port: null
    data_dir: null
    startup_timeout_ms: 15000  # Reduced timeout
    cleanup: true
    args: ["--log-level", "info"]
  client:
    timeout_ms: 5000
    tls_verify: false
    format: "json"

tests:
  # Test server startup and basic operation
  - name: "server-management"
    description: "Test that server can start and stop properly"
    args: ["serve", "--help"]  # Just test help, server will be started by framework
    expect:
      exit_code: 0
      stderr_contains: ["serve", "Start", "server"]
    tags: ["server", "management"]

  # Test server info commands
  - name: "version-info"
    description: "Test version information"
    args: ["--help"]
    expect:
      exit_code: 0
      stderr_contains: ["Property graph database", "GQL"]
    tags: ["info", "version"]

invariants:
  - type: "server_running"

tags: ["server", "basic"]
