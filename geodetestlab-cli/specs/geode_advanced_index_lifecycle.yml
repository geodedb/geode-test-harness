version: "1.0"
name: "Geode Advanced Index Lifecycle Test Suite"
description: "Lifecycle testing of advanced indexes (Interval, JSONB, Domain) including creation, usage, and persistence verification"

cli:
  binary: "./zig-out/bin/geode"
  server:
    enabled: true
    port: null
    data_dir: null
    startup_timeout_ms: 30000
    cleanup: true
    args: ["--log-level", "info"]
  client:
    timeout_ms: 15000
    tls_verify: false
    format: "json"

tests:
  # ===============================
  # INTERVAL INDEX LIFECYCLE
  # ===============================

  - name: "interval-index-lifecycle-create"
    description: "Create Interval Index and data"
    args: ["query",
           "CREATE INDEX IF NOT EXISTS lifecycle_interval ON Schedule USING IntervalTree (period); CREATE (s1:Schedule {name: 'Morning', period: IntRange(8, 12, true, false)}), (s2:Schedule {name: 'Afternoon', period: IntRange(13, 17, true, false)}), (s3:Schedule {name: 'FullDay', period: IntRange(9, 17, true, true)})"]
    expect:
      exit_code: 0
    tags: ["interval", "lifecycle", "create"]

  - name: "interval-index-lifecycle-query"
    description: "Query Interval Index for overlaps"
    args: ["query",
           "MATCH (s:Schedule) WHERE range_overlaps(s.period, IntRange(11, 14, true, false)) RETURN s.name AS overlapping ORDER BY s.name"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 3
        columns: ["overlapping"]
        rows:
          - ["Afternoon"]
          - ["FullDay"]
          - ["Morning"]
    tags: ["interval", "lifecycle", "query"]

  # ===============================
  # JSONB INDEX LIFECYCLE
  # ===============================

  - name: "jsonb-index-lifecycle-create"
    description: "Create JSONB Index and data"
    args: ["query",
           "CREATE INDEX IF NOT EXISTS lifecycle_jsonb ON Config USING JsonbInverted (data); CREATE (c1:Config {name: 'Server', data: Jsonb('{\"os\": \"linux\", \"ports\": [80, 443], \"active\": true}')}), (c2:Config {name: 'Database', data: Jsonb('{\"os\": \"linux\", \"ports\": [5432], \"active\": true}')}), (c3:Config {name: 'Cache', data: Jsonb('{\"os\": \"windows\", \"ports\": [6379], \"active\": false}')})"]
    expect:
      exit_code: 0
    tags: ["jsonb", "lifecycle", "create"]

  - name: "jsonb-index-lifecycle-query-path"
    description: "Query JSONB Index for path existence"
    args: ["query",
           "MATCH (c:Config) WHERE jsonb_exists(c.data, 'ports') RETURN c.name AS has_ports ORDER BY c.name"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 3
    tags: ["jsonb", "lifecycle", "query"]

  - name: "jsonb-index-lifecycle-query-value"
    description: "Query JSONB Index for specific value"
    args: ["query",
           "MATCH (c:Config) WHERE jsonb_get(c.data, 'os') = 'linux' RETURN c.name AS linux_box ORDER BY c.name"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 2
        columns: ["linux_box"]
        rows:
          - ["Database"]
          - ["Server"]
    tags: ["jsonb", "lifecycle", "query"]

  # ===============================
  # DOMAIN INDEX LIFECYCLE
  # ===============================

  - name: "domain-index-lifecycle-create"
    description: "Create Domain Index and data"
    args: ["query",
           "CREATE INDEX IF NOT EXISTS lifecycle_domain ON Endpoint USING DomainTrie (url); CREATE (e1:Endpoint {name: 'Google', url: Domain('google.com')}), (e2:Endpoint {name: 'Maps', url: Domain('maps.google.com')}), (e3:Endpoint {name: 'Mail', url: Domain('mail.google.com')}), (e4:Endpoint {name: 'Bing', url: Domain('bing.com')})"]
    expect:
      exit_code: 0
    tags: ["domain", "lifecycle", "create"]

  - name: "domain-index-lifecycle-query-suffix"
    description: "Query Domain Index for suffix match"
    args: ["query",
           "MATCH (e:Endpoint) WHERE domain_suffix_match(e.url, 'google.com') RETURN e.name AS google_service ORDER BY e.name"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 3
        columns: ["google_service"]
        rows:
          - ["Google"]
          - ["Mail"]
          - ["Maps"]
    tags: ["domain", "lifecycle", "query"]

invariants:
  - type: "server_running"

tags: ["advanced", "index", "lifecycle", "persistence"]
