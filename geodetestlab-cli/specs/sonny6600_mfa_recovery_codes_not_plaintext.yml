version: '1.0'
name: SONNY-6600 MFA recovery codes are stored as digests, never in plaintext
description: |
  Ticket: SONNY-6600 (item 2: recovery codes compared in non-constant time and held
  in plaintext. The cluster-token 256-byte prefix compare, the MFA secret pointer
  lifetime, the LSP token error-as-invalid and the lenient PHC parser items are
  in-process / cluster-only: covered by zig tests test-sonny6600-*).
  Bug: `geode.auth.mfa_setup` issued recovery codes and kept them in plaintext (in
  memory and in the stored enrollment), compared with a non-constant-time equality.
  Spec proves on a real `geode serve`: after `mfa_setup` returns its recovery codes
  and the server is stopped gracefully, NONE of the issued recovery codes appears as
  plaintext in any file of the data directory (the stored enrollment holds digests),
  while the enrollment is present (the secret-bearing `mfa: enabled/enrolled` state is
  shown by `geode user show`).

single_node_only: true  # each step starts its own private geode server / offline CLI: no harness server

cli:
  binary: ./zig-out/bin/geode
  env:
    GEODE_LOG_LEVEL: warn
  server:
    enabled: false
  client:
    timeout_ms: 420000
    tls_verify: false
    format: json

invariants: []

fuzz:
  enabled: false

tests:

- name: sonny6600-recovery-codes-absent-from-data-dir
  type: bash
  command: |
    BIN="${GEODE_BINARY:-geode}"
    export GEODE_ENABLE_MFA=1 GEODE_ALLOW_INSECURE_TLS=1 GEODE_DATA_DIR_LOCK_TIMEOUT_MS=0
    D=$(mktemp -d); H="$D/home"; mkdir -p "$H"
    PW='Geode Test Admin Passphrase'
    SD="$D/srv"; mkdir -p "$SD"
    PORT=$(python3 -c 'import socket;s=socket.socket();s.bind(("127.0.0.1",0));print(s.getsockname()[1])')
    ADDR="127.0.0.1:$PORT"
    SPID=""
    cleanup() { [ -n "$SPID" ] && kill -9 "$SPID" 2>/dev/null; rm -rf "$D"; }
    trap cleanup EXIT
    q() { "$BIN" query --server "$ADDR" --insecure-tls-skip-verify -U geode -P "$PW" "$1" 2>&1; }
    privstart() {
     GEODE_ADMIN_PASSWORD="$PW" "$BIN" auth init --data-dir "$SD" >/dev/null 2>&1 || { echo "FAIL auth init"; exit 1; }
     start
    }
    start() { "$BIN" serve --listen "$ADDR" --data-dir "$SD" --log-level warn >>"$D/srv.log" 2>&1 & SPID=$!
     for i in $(seq 1 120); do q "RETURN 1" | grep -q '"rows"' && return 0; kill -0 "$SPID" 2>/dev/null || break; sleep 0.5; done
     echo "FAIL server did not start"; tail -20 "$D/srv.log"; exit 1; }
    stop() { kill -TERM "$SPID" 2>/dev/null; wait "$SPID" 2>/dev/null; SPID=""; }
    kill9() { kill -9 "$SPID" 2>/dev/null; wait "$SPID" 2>/dev/null; SPID=""; }
    totp() { python3 - "$1" <<'PY'
    import sys,hmac,hashlib,struct,time,base64
    s=sys.argv[1].strip().upper(); s+='='*(-len(s)%8)
    k=base64.b32decode(s)
    h=hmac.new(k,struct.pack('>Q',int(time.time())//30),hashlib.sha1).digest()
    o=h[-1]&15
    print('%06d'%((struct.unpack('>I',h[o:o+4])[0]&0x7fffffff)%1000000))
    PY
    }
    want() { echo "$2" | grep -q "\"error_code\":\"$3\"" || { echo "FAIL $1: want error_code $3"; echo "$2"; exit 1; }; }
    ok() { echo "$2" | grep -q '"error_code"' && { echo "FAIL $1: unexpected error"; echo "$2"; exit 1; }; return 0; }
    enrol() { # user -> SECRET
     ok "create $1" "$(q "CREATE USER $1 SET PASSWORD 'Correct Horse Battery Staple 6623'")"
     O=$(q "CALL geode.auth.mfa_setup('$1')"); ok "setup $1" "$O"
     SECRET=$(echo "$O" | grep -o 'MFA secret: [A-Z2-7]*' | head -1 | sed 's/MFA secret: //')
     [ -n "$SECRET" ] || { echo "FAIL no secret for $1"; echo "$O"; exit 1; }
    }
    privstart

    ok "create" "$(q "CREATE USER rc6600 SET PASSWORD 'Correct Horse Battery Staple 6600'")"
    O=$(q "CALL geode.auth.mfa_setup('rc6600')"); ok "setup" "$O"
    CODES=$(echo "$O" | grep -o 'Recovery codes: [^"]*' | head -1 | sed 's/Recovery codes: //' | tr -d '\\')
    [ -n "$CODES" ] || { echo "FAIL no recovery codes in mfa_setup output"; echo "$O"; exit 1; }
    N=0; for c in $CODES; do N=$((N+1)); [ "${#c}" -ge 8 ] || { echo "FAIL implausible recovery code '$c'"; exit 1; }; done
    [ "$N" -ge 1 ] || { echo "FAIL no codes parsed"; exit 1; }
    q "CREATE (:Doc6600 {v: 1})" >/dev/null
    stop
    for c in $CODES; do
      if grep -rqF -- "$c" "$SD" 2>/dev/null; then echo "FAIL recovery code $c is stored in plaintext:"; grep -rlF -- "$c" "$SD"; exit 1; fi
    done
    OUT=$("$BIN" user show rc6600 --data-dir "$SD" 2>&1) || { echo "FAIL user show"; echo "$OUT"; exit 1; }
    echo "$OUT" | grep -q "MFA: disabled (enrolled" || { echo "FAIL enrollment not stored (user show: $OUT)"; exit 1; }
    echo "RECOVERY_DIGESTS_OK ($N codes checked)"

  timeout_ms: 420000
  expect:
    exit_code: 0
    stdout_contains: [RECOVERY_DIGESTS_OK]
  tags: [mfa, sonny6600]
