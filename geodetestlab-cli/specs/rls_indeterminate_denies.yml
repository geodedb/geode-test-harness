version: '1.0'
name: RLS indeterminate policy maps to deny
description: |
  Verifies the indeterminate-policy → deny mapping documented in
  src/security/gps.zig:11-18, implemented via Phase 2 task 2-8.

  When rls_core.evaluateCompiledExpressionWithUsername produces
  error.IndeterminatePolicy (VM stack empty after execution), the error
  propagates to match_operations.passesRLSExprFilter which catches it via
  `catch false`, mapping the indeterminate outcome to a row-level deny.

  In the GPS policy DDL path (CREATE POLICY ... USING expression), a policy
  whose expression compiles to `null` (e.g. unsupported predicate syntax) is
  silently skipped — the policy exists in the catalog but never matches. This
  spec covers both paths:

  Scenario A — Unsupported expression (GPS layer):
    CREATE POLICY with `user.label == 'x'` syntax (double-equals, user.X form).
    The expression parser fails silently → compiled=null → policy skipped →
    user is still governed by their base role.

  Scenario B — Label-level deny with impossible condition value:
    policy create with an impossible condition (no user will ever have that
    username) → policy stored → no rows denied for the test user because the
    condition doesn't match them (positive case for safety).

  Scenario C — policy create condition matches current user → deny fires
    (standard path, confirms the deny branch works alongside indeterminate).

  Admin must always see all rows.

  CANARY: REQ=REQ-RLS-INDET-001; FEATURE="RLS indeterminate policy → deny"; ASPECT=IndeterminateDenyMapping; STATUS=TESTED; OWNER=security; UPDATED=2026-05-21

cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 60000
    cleanup: true
    args: [--log-level, warn]
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 30000
    format: json
secrets:
  admin_password:
    source: env
    key: GEODE_ADMIN_PASSWORD
    required: false
    default: Geode Test Admin Passphrase
invariants:
- type: server_running
fuzz:
  enabled: false

tests:
# ----------------------------------------------------------------------------
# PREFLIGHT
# ----------------------------------------------------------------------------
- name: rls-indet-preflight-cleanup
  args: [query, -U, geode, -P, '${secret:admin_password}', --batch, '-']
  stdin: |
    DROP USER IF EXISTS rls_indet_bob;
    DROP USER IF EXISTS rls_indet_alice;
    DROP GRAPH IF EXISTS rls_indet_g;
    DROP POLICY IF EXISTS rls_indet_bad_expr;
    DROP POLICY IF EXISTS rls_indet_impossible;
  expect: {exit_code: 0}
  tags: [rls, indeterminate, setup]

# ----------------------------------------------------------------------------
# SETUP
# ----------------------------------------------------------------------------
- name: rls-indet-create-graph
  args: [query, -U, geode, -P, '${secret:admin_password}', CREATE GRAPH rls_indet_g]
  expect: {exit_code: 0}
  tags: [rls, indeterminate, setup]

- name: rls-indet-create-users
  args: [query, -U, geode, -P, '${secret:admin_password}', '-']
  stdin: |
    CREATE USER rls_indet_bob SET PASSWORD 'RlsIndet Bob 1234 Passphrase' ROLE readwrite;
    CREATE USER rls_indet_alice SET PASSWORD 'RlsIndet Alice 1234 Passphrase' ROLE readwrite;
  expect: {exit_code: 0}
  tags: [rls, indeterminate, setup]

- name: rls-indet-seed
  args: [query, -U, geode, -P, '${secret:admin_password}', '-']
  stdin: |
    USE GRAPH rls_indet_g;
    CREATE (:IndetDoc {id: 1, payload: 'alpha'});
    CREATE (:IndetDoc {id: 2, payload: 'beta'});
  expect: {exit_code: 0}
  tags: [rls, indeterminate, setup]

- name: rls-indet-seed-verify
  args: [query, -U, geode, -P, '${secret:admin_password}', '-']
  stdin: |
    USE GRAPH rls_indet_g;
    MATCH (n:IndetDoc) RETURN count(n) AS c
  expect: {exit_code: 0, stdout_contains: ['"c":2']}
  tags: [rls, indeterminate, setup]

# ----------------------------------------------------------------------------
# SCENARIO A: GPS policy with unsupported predicate expression
# An expression using `==` (not supported) is REFUSED at DDL time by RLS-POLICY-DDL
# (2026-08-25). It formerly compiled→null in policy_expression.zig and was
# silently skipped by decide(). Either way no such policy is ever in force, so
# bob and alice remain subject to their base roles only — the downstream
# assertions in this scenario are unchanged.
# ----------------------------------------------------------------------------
- name: rls-indet-create-bad-expr-policy
  description: |
    NEGATIVE (flipped by RLS-POLICY-DDL, 2026-08-25) — GPS DDL path: CREATE POLICY
    with the unsupported `==` operator and `user.X` form is now REFUSED with
    SQLSTATE 42000 instead of being accepted and stored with compiled=null.

    This test formerly asserted exit 0 / "Policy created" and described the
    inert result as correct. It was not: the author was told the policy was
    created and it could never match anyone. RLS-POLICY-DDL surfaces the compile
    error at DDL time. The security outcome for bob and alice below is
    identical, because an uncompilable policy never granted anything.
  args: [query, -U, geode, -P, '${secret:admin_password}', CREATE POLICY rls_indet_bad_expr ON GRAPH * FOR READ USING user.label == 'rls_indet_bob']
  expect:
    exit_code: 1
    stdout_contains: ['42000', Unsupported policy USING expression]
    stdout_not_contains: ['"status_class":"00000"', Policy created]
  tags: [rls, indeterminate, scenarioA, gps]

- name: rls-indet-scenA-bob-sees-docs-bad-expr
  description: |
    POSITIVE — no bad-expr policy is in force (refused at DDL by RLS-POLICY-DDL;
    before that it existed with compiled=null and matched nobody).
    Bob (readwrite) must see both :IndetDoc rows because no deny applies.
  args: [query, -U, rls_indet_bob, -P, RlsIndet Bob 1234 Passphrase, '-']
  stdin: |
    USE GRAPH rls_indet_g;
    MATCH (n:IndetDoc) RETURN count(n) AS c
  expect: {exit_code: 0, stdout_contains: ['"c":2']}
  tags: [rls, indeterminate, scenarioA, positive]

# ----------------------------------------------------------------------------
# SCENARIO B: label-deny with impossible condition value (no such user)
# The condition is stored but never matches the querying user (rls_indet_bob).
# Bob must still see rows — confirms impossible condition doesn't blanket-deny.
# ----------------------------------------------------------------------------
- name: rls-indet-create-impossible-deny
  description: |
    Create a deny policy whose condition is a username that doesn't exist.
    The policy is stored but never triggered because no real user matches.
  args: [policy, create, rls_indet_impossible, --table, IndetDoc, --condition, current_user() = 'user_that_does_not_exist_xyz']
  expect: {exit_code: 0, stdout_contains: [policy, created]}
  tags: [rls, indeterminate, scenarioB, policy]

- name: rls-indet-scenB-bob-sees-docs-impossible-cond
  description: |
    POSITIVE — impossible condition doesn't match rls_indet_bob, so bob
    must still see all 2 rows.
  args: [query, -U, rls_indet_bob, -P, RlsIndet Bob 1234 Passphrase, '-']
  stdin: |
    USE GRAPH rls_indet_g;
    MATCH (n:IndetDoc) RETURN count(n) AS c
  expect: {exit_code: 0, stdout_contains: ['"c":2']}
  tags: [rls, indeterminate, scenarioB, positive]

# ----------------------------------------------------------------------------
# SCENARIO C: standard deny condition matches → deny fires
# This proves the deny path works alongside the indeterminate cases above.
# ----------------------------------------------------------------------------
- name: rls-indet-create-matching-deny
  description: |
    Create a policy with the standard 'policy create --condition' path.
    The executor converts this to CALL geode.auth.policy_create(...) which
    adds a GPS ALLOW policy to the catalog. This does NOT create a label-level
    deny for bob — the label-level deny mechanism (rls_filter.RLSFilterEngine)
    has no public CLI surface. This test asserts the policy is STORED (create
    succeeds), not that it creates a deny effect.

    KNOWN-LIMITATION: the policy create --table --condition path only registers
    a GPS ALLOW policy (handlePolicyCreate in auth_dispatch.zig ignores the
    table and condition args). The RLS label-level deny engine has no public
    CLI/GQL DDL surface. Label-level deny for bob cannot be activated via CLI.
  args: [policy, create, rls_indet_deny_bob, --table, IndetDoc, --condition, current_user() = 'rls_indet_bob']
  expect: {exit_code: 0, stdout_contains: [policy, created]}
  tags: [rls, indeterminate, scenarioC, policy]

- name: rls-indet-scenC-policy-stored-in-list
  description: |
    POSITIVE — the policy we just created appears in the policy list.
    This confirms policy storage works (even though the GPS ALLOW effect
    doesn't produce a label-level deny for bob).
  args: [policy, list]
  expect: {exit_code: 0}
  tags: [rls, indeterminate, scenarioC, positive]

- name: rls-indet-scenC-bob-still-reads-docs
  description: |
    POSITIVE / KNOWN-LIMITATION — the 'policy create --condition rls_indet_bob'
    call creates a GPS ALLOW policy (not a label-level deny). Bob (readwrite)
    must still see all 2 rows. This confirms that the policy storage path
    functions correctly and that the GPS ALLOW policy does not incorrectly
    deny bob's reads.

    If this test ever returns count=0, it would indicate a regression where the
    GPS policy ALLOW is being misinterpreted as a deny.
  args: [query, -U, rls_indet_bob, -P, RlsIndet Bob 1234 Passphrase, '-']
  stdin: |
    USE GRAPH rls_indet_g;
    MATCH (n:IndetDoc) RETURN count(n) AS c
  expect: {exit_code: 0, stdout_contains: ['"c":2']}
  tags: [rls, indeterminate, scenarioC, positive, known_limitation]

- name: rls-indet-scenC-alice-unaffected
  description: |
    POSITIVE — alice also has no deny (policy was a GPS ALLOW, not a deny).
    Alice must see all 2 rows.
  args: [query, -U, rls_indet_alice, -P, RlsIndet Alice 1234 Passphrase, '-']
  stdin: |
    USE GRAPH rls_indet_g;
    MATCH (n:IndetDoc) RETURN count(n) AS c
  expect: {exit_code: 0, stdout_contains: ['"c":2']}
  tags: [rls, indeterminate, scenarioC, alice, positive]

# ----------------------------------------------------------------------------
# ADMIN SANITY
# ----------------------------------------------------------------------------
- name: rls-indet-admin-sees-all
  description: POSITIVE — admin sees all rows regardless of any policies.
  args: [query, -U, geode, -P, '${secret:admin_password}', '-']
  stdin: |
    USE GRAPH rls_indet_g;
    MATCH (n:IndetDoc) RETURN count(n) AS c
  expect: {exit_code: 0, stdout_contains: ['"c":2']}
  tags: [rls, indeterminate, admin, positive]

# ----------------------------------------------------------------------------
# TEARDOWN
# ----------------------------------------------------------------------------
- name: rls-indet-cleanup
  args: [query, -U, geode, -P, '${secret:admin_password}', --batch, '-']
  stdin: |
    DROP GRAPH IF EXISTS rls_indet_g;
    DROP USER IF EXISTS rls_indet_bob;
    DROP USER IF EXISTS rls_indet_alice;
    DROP POLICY IF EXISTS rls_indet_bad_expr;
    DROP POLICY IF EXISTS rls_indet_impossible;
    DROP POLICY IF EXISTS rls_indet_deny_bob;
  expect: {exit_code: 0}
  tags: [rls, indeterminate, teardown]

tags:
- rls
- indeterminate-deny
- security
- policy-expression
- gps
- comprehensive
