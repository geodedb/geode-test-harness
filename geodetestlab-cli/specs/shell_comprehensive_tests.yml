version: "1.0"
name: "Shell Comprehensive Tests"
description: "Comprehensive tests from comprehensive_test.gql covering expressions, functions, graph management, pattern matching, aggregation, vectors, transactions, and stress tests"

cli:
  binary: "./zig-out/bin/geode"
  working_dir: null
  env:
    GEODE_LOG_LEVEL: "info"
  server:
    enabled: true
    port: null
    data_dir: null
    startup_timeout_ms: 60000
    cleanup: true
    args: ["--log-level", "info"]
    env: {}
  client:
    server_address: "127.0.0.1:3141"
    timeout_ms: 30000
    tls_verify: false
    format: "json"

secrets:
  admin_password:
    source: "env"
    key: "GEODE_ADMIN_PASSWORD"
    required: false

invariants:
  - type: "server_running"

fuzz:
  enabled: false

tests:
  # Section 1: Basic Expressions and Literals
  - name: "integer-literal"
    description: "Integer literal"
    args: ["query", "--insecure", "-"]
    stdin: "RETURN 42 AS integer_literal;"
    expect:
      exit_code: 0
    tags: ["literal", "integer"]

  - name: "negative-integer"
    description: "Negative integer"
    args: ["query", "--insecure", "-"]
    stdin: "RETURN -17 AS negative_integer;"
    expect:
      exit_code: 0
    tags: ["literal", "integer"]

  - name: "float-literal"
    description: "Float literal"
    args: ["query", "--insecure", "-"]
    stdin: "RETURN 3.14159 AS float_literal;"
    expect:
      exit_code: 0
    tags: ["literal", "float"]

  - name: "scientific-notation"
    description: "Scientific notation"
    args: ["query", "--insecure", "-"]
    stdin: "RETURN 1e10 AS scientific_notation;"
    expect:
      exit_code: 0
    tags: ["literal", "scientific"]

  - name: "string-literals"
    description: "String literals"
    args: ["query", "--insecure", "-"]
    stdin: "RETURN 'hello world' AS single_quoted, '' AS empty_string;"
    expect:
      exit_code: 0
    tags: ["literal", "string"]

  - name: "boolean-literals"
    description: "Boolean literals"
    args: ["query", "--insecure", "-"]
    stdin: "RETURN true AS bool_true, false AS bool_false;"
    expect:
      exit_code: 0
    tags: ["literal", "boolean"]

  - name: "null-literal"
    description: "Null literal"
    args: ["query", "--insecure", "-"]
    stdin: "RETURN null AS null_value;"
    expect:
      exit_code: 0
    tags: ["literal", "null"]

  - name: "list-literals"
    description: "List literals"
    args: ["query", "--insecure", "-"]
    stdin: "RETURN [1, 2, 3, 4, 5] AS number_list, ['a', 'b', 'c'] AS string_list, [] AS empty_list;"
    expect:
      exit_code: 0
    tags: ["literal", "list"]

  - name: "map-literals"
    description: "Map literals"
    args: ["query", "--insecure", "-"]
    stdin: "RETURN {name: 'Alice', age: 30} AS simple_map, {} AS empty_map;"
    expect:
      exit_code: 0
    tags: ["literal", "map"]

  # Section 2: Arithmetic Operations
  - name: "basic-arithmetic"
    description: "Basic arithmetic operations"
    args: ["query", "--insecure", "-"]
    stdin: "RETURN 5 + 3 AS addition, 10 - 4 AS subtraction, 6 * 7 AS multiplication, 15 / 3 AS division, 17 % 5 AS modulo;"
    expect:
      exit_code: 0
    tags: ["arithmetic"]

  - name: "operator-precedence"
    description: "Operator precedence"
    args: ["query", "--insecure", "-"]
    stdin: "RETURN 2 + 3 * 4 AS precedence_mult_first, (2 + 3) * 4 AS precedence_parens;"
    expect:
      exit_code: 0
    tags: ["arithmetic", "precedence"]

  - name: "unary-operators"
    description: "Unary operators"
    args: ["query", "--insecure", "-"]
    stdin: "RETURN -42 AS unary_minus, +42 AS unary_plus, -(-5) AS double_negative;"
    expect:
      exit_code: 0
    tags: ["arithmetic", "unary"]

  # Section 3: Comparison Operations
  - name: "equality-comparisons"
    description: "Equality comparisons"
    args: ["query", "--insecure", "-"]
    stdin: "RETURN 5 = 5 AS equal_true, 5 = 6 AS equal_false, 'hello' = 'hello' AS string_equal, null = null AS null_equal;"
    expect:
      exit_code: 0
    tags: ["comparison", "equality"]

  - name: "ordering-comparisons"
    description: "Ordering comparisons"
    args: ["query", "--insecure", "-"]
    stdin: "RETURN 5 < 10 AS less_than, 10 > 5 AS greater_than, 5 <= 5 AS less_equal, 5 >= 5 AS greater_equal;"
    expect:
      exit_code: 0
    tags: ["comparison", "ordering"]

  - name: "null-predicates"
    description: "IS NULL / IS NOT NULL"
    args: ["query", "--insecure", "-"]
    stdin: "RETURN null IS NULL AS is_null_true, 5 IS NULL AS is_null_false, 5 IS NOT NULL AS is_not_null_true;"
    expect:
      exit_code: 0
    tags: ["comparison", "null"]

  # Section 4: Logical Operations
  - name: "and-operations"
    description: "AND operations"
    args: ["query", "--insecure", "-"]
    stdin: "RETURN true AND true AS and_tt, true AND false AS and_tf, false AND true AS and_ft, false AND false AS and_ff;"
    expect:
      exit_code: 0
    tags: ["logic", "and"]

  - name: "or-operations"
    description: "OR operations"
    args: ["query", "--insecure", "-"]
    stdin: "RETURN true OR true AS or_tt, true OR false AS or_tf, false OR true AS or_ft, false OR false AS or_ff;"
    expect:
      exit_code: 0
    tags: ["logic", "or"]

  - name: "not-operations"
    description: "NOT operations"
    args: ["query", "--insecure", "-"]
    stdin: "RETURN NOT true AS not_true, NOT false AS not_false, NOT NOT true AS double_not;"
    expect:
      exit_code: 0
    tags: ["logic", "not"]

  - name: "xor-operations"
    description: "XOR operations"
    args: ["query", "--insecure", "-"]
    stdin: "RETURN true XOR false AS xor_tf, true XOR true AS xor_tt, false XOR false AS xor_ff;"
    expect:
      exit_code: 0
    tags: ["logic", "xor"]

  # Section 5: String Functions
  - name: "case-functions"
    description: "Case conversion functions"
    args: ["query", "--insecure", "-"]
    stdin: "RETURN upper('hello') AS uppercase, lower('WORLD') AS lowercase;"
    expect:
      exit_code: 0
    tags: ["string", "case"]

  - name: "string-manipulation"
    description: "String manipulation"
    args: ["query", "--insecure", "-"]
    stdin: "RETURN length('hello world') AS str_length, substring('hello world', 0, 5) AS substr, trim('  spaced  ') AS trimmed;"
    expect:
      exit_code: 0
    tags: ["string", "manipulation"]

  - name: "string-replace"
    description: "String replace and reverse"
    args: ["query", "--insecure", "-"]
    stdin: "RETURN replace('hello world', 'world', 'geode') AS replaced, reverse('hello') AS reversed;"
    expect:
      exit_code: 0
    tags: ["string", "replace"]

  - name: "string-concatenation"
    description: "String concatenation"
    args: ["query", "--insecure", "-"]
    stdin: "RETURN 'hello' + ' ' + 'world' AS concatenated;"
    expect:
      exit_code: 0
    tags: ["string", "concat"]

  # Section 6: Mathematical Functions
  - name: "basic-math"
    description: "Basic math functions"
    args: ["query", "--insecure", "-"]
    stdin: "RETURN abs(-42) AS absolute, sign(-5) AS sign_neg, sign(5) AS sign_pos, sign(0) AS sign_zero;"
    expect:
      exit_code: 0
    tags: ["math", "basic"]

  - name: "rounding-functions"
    description: "Rounding functions"
    args: ["query", "--insecure", "-"]
    stdin: "RETURN ceil(3.2) AS ceiling, floor(3.8) AS floored, round(3.5) AS round_half;"
    expect:
      exit_code: 0
    tags: ["math", "rounding"]

  - name: "power-root-functions"
    description: "Power and root functions"
    args: ["query", "--insecure", "-"]
    stdin: "RETURN sqrt(16) AS square_root, pow(2, 10) AS power, exp(1) AS euler, log(2.71828) AS natural_log;"
    expect:
      exit_code: 0
    tags: ["math", "power"]

  - name: "trig-functions"
    description: "Trigonometric functions"
    args: ["query", "--insecure", "-"]
    stdin: "RETURN sin(0) AS sine_zero, cos(0) AS cosine_zero, tan(0) AS tangent_zero;"
    expect:
      exit_code: 0
    tags: ["math", "trig"]

  # Section 7: List Functions
  - name: "list-access"
    description: "List access"
    args: ["query", "--insecure", "-"]
    stdin: "RETURN [1, 2, 3, 4, 5][0] AS first_element, [1, 2, 3, 4, 5][2] AS third_element;"
    expect:
      exit_code: 0
    tags: ["list", "access"]

  - name: "list-properties"
    description: "List properties"
    args: ["query", "--insecure", "-"]
    stdin: "RETURN size([1, 2, 3]) AS list_size, head([1, 2, 3]) AS list_head, tail([1, 2, 3]) AS list_tail;"
    expect:
      exit_code: 0
    tags: ["list", "properties"]

  - name: "list-reverse"
    description: "List reverse"
    args: ["query", "--insecure", "-"]
    stdin: "RETURN reverse([1, 2, 3]) AS list_reversed;"
    expect:
      exit_code: 0
    tags: ["list", "reverse"]

  - name: "list-predicates"
    description: "List predicates"
    args: ["query", "--insecure", "-"]
    stdin: "RETURN 2 IN [1, 2, 3] AS element_in_list, 5 IN [1, 2, 3] AS element_not_in;"
    expect:
      exit_code: 0
    tags: ["list", "predicates"]

  - name: "list-range"
    description: "Range function"
    args: ["query", "--insecure", "-"]
    stdin: "RETURN range(1, 5) AS range_1_to_5, range(0, 10, 2) AS range_step;"
    expect:
      exit_code: 0
    tags: ["list", "range"]

  # Section 9: Date and Time Functions
  - name: "current-time"
    description: "Current time functions"
    args: ["query", "--insecure", "-"]
    stdin: "RETURN datetime() AS current_datetime, date() AS current_date, time() AS current_time;"
    expect:
      exit_code: 0
    tags: ["date", "current"]

  - name: "date-parsing"
    description: "Date parsing"
    args: ["query", "--insecure", "-"]
    stdin: "RETURN date('2024-01-15') AS parsed_date, datetime('2024-01-15T10:30:00') AS parsed_datetime;"
    expect:
      exit_code: 0
    tags: ["date", "parsing"]

  - name: "date-components"
    description: "Date components"
    args: ["query", "--insecure", "-"]
    stdin: "RETURN date().year AS current_year, date().month AS current_month, date().day AS current_day;"
    expect:
      exit_code: 0
    tags: ["date", "components"]

  - name: "duration"
    description: "Duration"
    args: ["query", "--insecure", "-"]
    stdin: "RETURN duration('P1Y2M3D') AS duration_period, duration('PT2H30M') AS duration_time;"
    expect:
      exit_code: 0
    tags: ["date", "duration"]

  # Section 10: Type Functions
  - name: "type-checking"
    description: "Type checking"
    args: ["query", "--insecure", "-"]
    stdin: "RETURN type(5) AS type_int, type(3.14) AS type_float, type('hello') AS type_string, type(true) AS type_bool;"
    expect:
      exit_code: 0
    tags: ["type", "checking"]

  - name: "type-conversion"
    description: "Type conversion"
    args: ["query", "--insecure", "-"]
    stdin: "RETURN toInteger('42') AS str_to_int, toFloat('3.14') AS str_to_float, toString(42) AS int_to_str;"
    expect:
      exit_code: 0
    tags: ["type", "conversion"]

  - name: "coalesce"
    description: "Coalesce function"
    args: ["query", "--insecure", "-"]
    stdin: "RETURN coalesce(null, null, 'default') AS first_non_null, coalesce('value', 'default') AS has_value;"
    expect:
      exit_code: 0
    tags: ["type", "coalesce"]

  # Section 11: Conditional Expressions
  - name: "simple-case"
    description: "Simple CASE expression"
    args: ["query", "--insecure", "-"]
    stdin: "RETURN CASE WHEN 5 > 3 THEN 'greater' ELSE 'less' END AS simple_case;"
    expect:
      exit_code: 0
    tags: ["case", "simple"]

  - name: "value-case"
    description: "Value CASE expression"
    args: ["query", "--insecure", "-"]
    stdin: "RETURN CASE 5 WHEN 1 THEN 'one' WHEN 5 THEN 'five' ELSE 'other' END AS value_case;"
    expect:
      exit_code: 0
    tags: ["case", "value"]

  - name: "nested-case"
    description: "Nested CASE expression"
    args: ["query", "--insecure", "-"]
    stdin: "RETURN CASE WHEN 10 > 20 THEN 'a' WHEN 10 > 5 THEN 'b' ELSE 'c' END AS nested_case;"
    expect:
      exit_code: 0
    tags: ["case", "nested"]

  # Section 12: Graph Management
  - name: "show-graphs"
    description: "Show available graphs"
    args: ["query", "--insecure", "-"]
    stdin: "SHOW GRAPHS;"
    expect:
      exit_code: 0
    tags: ["graph", "show"]

  - name: "create-test-graph"
    description: "Create test graph"
    args: ["query", "--insecure", "-"]
    stdin: "CREATE GRAPH IF NOT EXISTS test_comprehensive;"
    expect:
      exit_code: 0
    tags: ["graph", "create"]

  - name: "use-test-graph"
    description: "Switch to test graph"
    args: ["query", "--insecure", "-"]
    stdin: "USE GRAPH test_comprehensive;"
    expect:
      exit_code: 0
    tags: ["graph", "use"]

  # Section 13: Node Operations
  - name: "create-person-nodes"
    description: "Create Person nodes"
    args: ["query", "--insecure", "-"]
    stdin: |
      USE GRAPH test_comprehensive;
      CREATE (p:Person {name: 'Alice', age: 30, email: 'alice@example.com'});
      CREATE (p:Person {name: 'Bob', age: 25, email: 'bob@example.com'});
      CREATE (p:Person {name: 'Charlie', age: 35, email: 'charlie@example.com'});
    expect:
      exit_code: 0
    tags: ["node", "create"]

  - name: "create-company-nodes"
    description: "Create Company nodes"
    args: ["query", "--insecure", "-"]
    stdin: |
      USE GRAPH test_comprehensive;
      CREATE (c:Company {name: 'TechCorp', founded: 2010, industry: 'Technology'});
      CREATE (c:Company {name: 'DataInc', founded: 2015, industry: 'Data'});
    expect:
      exit_code: 0
    tags: ["node", "create"]

  - name: "count-nodes"
    description: "Count all nodes"
    args: ["query", "--insecure", "-"]
    stdin: "USE GRAPH test_comprehensive; MATCH (n) RETURN count(n) AS total_nodes;"
    expect:
      exit_code: 0
    tags: ["node", "count"]

  # Section 14: Relationship Operations
  - name: "create-knows-relationships"
    description: "Create KNOWS relationships"
    args: ["query", "--insecure", "-"]
    stdin: |
      USE GRAPH test_comprehensive;
      MATCH (a:Person {name: 'Alice'}), (b:Person {name: 'Bob'})
      CREATE (a)-[:KNOWS {since: 2020}]->(b);
    expect:
      exit_code: 0
    tags: ["relationship", "create"]

  - name: "create-works-for-relationships"
    description: "Create WORKS_FOR relationships"
    args: ["query", "--insecure", "-"]
    stdin: |
      USE GRAPH test_comprehensive;
      MATCH (p:Person {name: 'Alice'}), (c:Company {name: 'TechCorp'})
      CREATE (p)-[:WORKS_FOR {since: 2018, role: 'Engineer'}]->(c);
    expect:
      exit_code: 0
    tags: ["relationship", "create"]

  - name: "count-relationships"
    description: "Count all relationships"
    args: ["query", "--insecure", "-"]
    stdin: "USE GRAPH test_comprehensive; MATCH ()-[r]->() RETURN count(r) AS relationship_count;"
    expect:
      exit_code: 0
    tags: ["relationship", "count"]

  # Section 15: Pattern Matching
  - name: "simple-node-match"
    description: "Simple node match"
    args: ["query", "--insecure", "-"]
    stdin: "USE GRAPH test_comprehensive; MATCH (p:Person) RETURN p.name AS name, p.age AS age ORDER BY p.name;"
    expect:
      exit_code: 0
    tags: ["pattern", "match"]

  - name: "match-with-properties"
    description: "Match with properties"
    args: ["query", "--insecure", "-"]
    stdin: "USE GRAPH test_comprehensive; MATCH (p:Person {age: 30}) RETURN p.name AS name;"
    expect:
      exit_code: 0
    tags: ["pattern", "properties"]

  - name: "match-with-where"
    description: "Match with WHERE"
    args: ["query", "--insecure", "-"]
    stdin: "USE GRAPH test_comprehensive; MATCH (p:Person) WHERE p.age > 30 RETURN p.name AS name, p.age AS age;"
    expect:
      exit_code: 0
    tags: ["pattern", "where"]

  - name: "match-relationships"
    description: "Match relationships"
    args: ["query", "--insecure", "-"]
    stdin: "USE GRAPH test_comprehensive; MATCH (a:Person)-[:KNOWS]->(b:Person) RETURN a.name AS from, b.name AS to;"
    expect:
      exit_code: 0
    tags: ["pattern", "relationship"]

  - name: "optional-match"
    description: "Optional match"
    args: ["query", "--insecure", "-"]
    stdin: "USE GRAPH test_comprehensive; MATCH (p:Person) OPTIONAL MATCH (p)-[:WORKS_FOR]->(c:Company) RETURN p.name AS person, c.name AS company;"
    expect:
      exit_code: 0
    tags: ["pattern", "optional"]

  # Section 16: Filtering and Predicates
  - name: "comparison-predicates"
    description: "Comparison predicates"
    args: ["query", "--insecure", "-"]
    stdin: "USE GRAPH test_comprehensive; MATCH (p:Person) WHERE p.age >= 25 AND p.age <= 35 RETURN p.name, p.age;"
    expect:
      exit_code: 0
    tags: ["filter", "comparison"]

  - name: "string-predicates"
    description: "String predicates"
    args: ["query", "--insecure", "-"]
    stdin: "USE GRAPH test_comprehensive; MATCH (p:Person) WHERE p.name STARTS WITH 'A' RETURN p.name;"
    expect:
      exit_code: 0
    tags: ["filter", "string"]

  - name: "list-predicates"
    description: "List predicates"
    args: ["query", "--insecure", "-"]
    stdin: "USE GRAPH test_comprehensive; MATCH (p:Person) WHERE p.age IN [25, 30, 35] RETURN p.name, p.age;"
    expect:
      exit_code: 0
    tags: ["filter", "list"]

  - name: "null-predicates"
    description: "Null predicates"
    args: ["query", "--insecure", "-"]
    stdin: "USE GRAPH test_comprehensive; MATCH (p:Person) WHERE p.email IS NOT NULL RETURN p.name, p.email;"
    expect:
      exit_code: 0
    tags: ["filter", "null"]

  # Section 17: Ordering and Pagination
  - name: "order-by-single"
    description: "Order by single column"
    args: ["query", "--insecure", "-"]
    stdin: "USE GRAPH test_comprehensive; MATCH (p:Person) RETURN p.name, p.age ORDER BY p.age;"
    expect:
      exit_code: 0
    tags: ["order", "single"]

  - name: "order-by-desc"
    description: "Order by descending"
    args: ["query", "--insecure", "-"]
    stdin: "USE GRAPH test_comprehensive; MATCH (p:Person) RETURN p.name, p.age ORDER BY p.age DESC;"
    expect:
      exit_code: 0
    tags: ["order", "desc"]

  - name: "limit"
    description: "LIMIT"
    args: ["query", "--insecure", "-"]
    stdin: "USE GRAPH test_comprehensive; MATCH (p:Person) RETURN p.name ORDER BY p.name LIMIT 2;"
    expect:
      exit_code: 0
    tags: ["pagination", "limit"]

  - name: "skip"
    description: "SKIP"
    args: ["query", "--insecure", "-"]
    stdin: "USE GRAPH test_comprehensive; MATCH (p:Person) RETURN p.name ORDER BY p.name SKIP 1;"
    expect:
      exit_code: 0
    tags: ["pagination", "skip"]

  - name: "skip-limit-combined"
    description: "SKIP and LIMIT combined"
    args: ["query", "--insecure", "-"]
    stdin: "USE GRAPH test_comprehensive; MATCH (p:Person) RETURN p.name ORDER BY p.name SKIP 1 LIMIT 1;"
    expect:
      exit_code: 0
    tags: ["pagination", "combined"]

  # Section 18: Aggregation
  - name: "count-aggregation"
    description: "Count aggregation"
    args: ["query", "--insecure", "-"]
    stdin: "USE GRAPH test_comprehensive; MATCH (p:Person) RETURN count(p) AS total_people;"
    expect:
      exit_code: 0
    tags: ["aggregation", "count"]

  - name: "sum-aggregation"
    description: "Sum aggregation"
    args: ["query", "--insecure", "-"]
    stdin: "USE GRAPH test_comprehensive; MATCH (p:Person) RETURN sum(p.age) AS total_age;"
    expect:
      exit_code: 0
    tags: ["aggregation", "sum"]

  - name: "avg-aggregation"
    description: "Average aggregation"
    args: ["query", "--insecure", "-"]
    stdin: "USE GRAPH test_comprehensive; MATCH (p:Person) RETURN avg(p.age) AS average_age;"
    expect:
      exit_code: 0
    tags: ["aggregation", "avg"]

  - name: "min-max-aggregation"
    description: "Min/Max aggregation"
    args: ["query", "--insecure", "-"]
    stdin: "USE GRAPH test_comprehensive; MATCH (p:Person) RETURN min(p.age) AS youngest, max(p.age) AS oldest;"
    expect:
      exit_code: 0
    tags: ["aggregation", "minmax"]

  - name: "distinct"
    description: "DISTINCT"
    args: ["query", "--insecure", "-"]
    stdin: "USE GRAPH test_comprehensive; MATCH (c:Company) RETURN DISTINCT c.industry AS industries;"
    expect:
      exit_code: 0
    tags: ["aggregation", "distinct"]

  # Section 19: UNION Operations
  - name: "union"
    description: "UNION removes duplicates"
    args: ["query", "--insecure", "-"]
    stdin: "USE GRAPH test_comprehensive; MATCH (p:Person) WHERE p.age < 30 RETURN p.name AS name UNION MATCH (p:Person) WHERE p.name STARTS WITH 'A' RETURN p.name AS name;"
    expect:
      exit_code: 0
    tags: ["set", "union"]

  - name: "union-all"
    description: "UNION ALL keeps duplicates"
    args: ["query", "--insecure", "-"]
    stdin: "USE GRAPH test_comprehensive; MATCH (p:Person) WHERE p.age < 30 RETURN p.name AS name UNION ALL MATCH (p:Person) WHERE p.name STARTS WITH 'A' RETURN p.name AS name;"
    expect:
      exit_code: 0
    tags: ["set", "union-all"]

  # Section 20: Data Modification
  - name: "set-properties"
    description: "SET properties"
    args: ["query", "--insecure", "-"]
    stdin: "USE GRAPH test_comprehensive; MATCH (p:Person {name: 'Alice'}) SET p.nickname = 'Ali' RETURN p.name, p.nickname;"
    expect:
      exit_code: 0
    tags: ["modify", "set"]

  - name: "remove-property"
    description: "REMOVE property"
    args: ["query", "--insecure", "-"]
    stdin: "USE GRAPH test_comprehensive; MATCH (p:Person {name: 'Alice'}) REMOVE p.nickname RETURN p.name, p.nickname;"
    expect:
      exit_code: 0
    tags: ["modify", "remove"]

  # Section 23: WITH Clause
  - name: "with-ordering"
    description: "WITH for ordering"
    args: ["query", "--insecure", "-"]
    stdin: "USE GRAPH test_comprehensive; MATCH (p:Person) WITH p ORDER BY p.age DESC LIMIT 2 RETURN p.name, p.age;"
    expect:
      exit_code: 0
    tags: ["with", "ordering"]

  # Section 26: Vector Operations
  - name: "create-vector"
    description: "Create vector"
    args: ["query", "--insecure", "-"]
    stdin: "RETURN vectorf32('[1.0, 2.0, 3.0]') AS vec;"
    expect:
      exit_code: 0
    tags: ["vector", "create"]

  - name: "vector-l2-distance"
    description: "Vector L2 distance"
    args: ["query", "--insecure", "-"]
    stdin: "RETURN vector_l2(vectorf32('[1.0, 0.0]'), vectorf32('[0.0, 1.0]')) AS l2_distance;"
    expect:
      exit_code: 0
    tags: ["vector", "distance"]

  - name: "vector-cosine"
    description: "Cosine similarity"
    args: ["query", "--insecure", "-"]
    stdin: "RETURN vector_cosine(vectorf32('[1.0, 0.0]'), vectorf32('[1.0, 0.0]')) AS similarity;"
    expect:
      exit_code: 0
    tags: ["vector", "cosine"]

  - name: "vector-dot"
    description: "Dot product"
    args: ["query", "--insecure", "-"]
    stdin: "RETURN vector_dot(vectorf32('[1.0, 2.0, 3.0]'), vectorf32('[4.0, 5.0, 6.0]')) AS dot_product;"
    expect:
      exit_code: 0
    tags: ["vector", "dot"]

  # Section 34: Multi-Graph Isolation
  - name: "create-isolation-graph-a"
    description: "Create isolation graph A"
    args: ["query", "--insecure", "-"]
    stdin: "CREATE GRAPH IF NOT EXISTS isolation_graph_a;"
    expect:
      exit_code: 0
    tags: ["isolation", "create"]

  - name: "create-isolation-graph-b"
    description: "Create isolation graph B"
    args: ["query", "--insecure", "-"]
    stdin: "CREATE GRAPH IF NOT EXISTS isolation_graph_b;"
    expect:
      exit_code: 0
    tags: ["isolation", "create"]

  - name: "populate-graph-a"
    description: "Populate graph A"
    args: ["query", "--insecure", "-"]
    stdin: |
      USE GRAPH isolation_graph_a;
      CREATE (a:IsolationNode {id: 1, graph: 'A', name: 'Alice'});
      CREATE (b:IsolationNode {id: 2, graph: 'A', name: 'Bob'});
    expect:
      exit_code: 0
    tags: ["isolation", "populate"]

  - name: "populate-graph-b"
    description: "Populate graph B"
    args: ["query", "--insecure", "-"]
    stdin: |
      USE GRAPH isolation_graph_b;
      CREATE (x:IsolationNode {id: 100, graph: 'B', name: 'Xavier'});
      CREATE (y:IsolationNode {id: 101, graph: 'B', name: 'Yolanda'});
    expect:
      exit_code: 0
    tags: ["isolation", "populate"]

  - name: "verify-graph-b-isolation"
    description: "Verify graph B data"
    args: ["query", "--insecure", "-"]
    stdin: "USE GRAPH isolation_graph_b; MATCH (n:IsolationNode) RETURN n.id, n.graph ORDER BY n.id;"
    expect:
      exit_code: 0
    tags: ["isolation", "verify"]

  - name: "verify-graph-a-isolation"
    description: "Verify graph A data"
    args: ["query", "--insecure", "-"]
    stdin: "USE GRAPH isolation_graph_a; MATCH (n:IsolationNode) RETURN n.id, n.graph ORDER BY n.id;"
    expect:
      exit_code: 0
    tags: ["isolation", "verify"]

  - name: "cross-graph-test"
    description: "Cross-graph queries don't mix"
    args: ["query", "--insecure", "-"]
    stdin: "USE GRAPH isolation_graph_a; MATCH (n:IsolationNode) WHERE n.graph = 'B' RETURN count(n) AS should_be_zero;"
    expect:
      exit_code: 0
    tags: ["isolation", "cross"]

  # Section 38: Transactions
  - name: "transaction-creates"
    description: "Transaction with multiple creates"
    args: ["query", "--insecure", "-"]
    stdin: |
      USE GRAPH test_comprehensive;
      START TRANSACTION;
      CREATE (t1:TransactionTest {id: 1, status: 'created'});
      COMMIT;
    expect:
      exit_code: 0
    tags: ["transaction", "create"]

  - name: "verify-transaction"
    description: "Verify transaction committed"
    args: ["query", "--insecure", "-"]
    stdin: "USE GRAPH test_comprehensive; MATCH (t:TransactionTest) RETURN t.id, t.status ORDER BY t.id;"
    expect:
      exit_code: 0
    tags: ["transaction", "verify"]

  # Final Cleanup
  - name: "cleanup-test-comprehensive"
    description: "Cleanup test_comprehensive graph"
    args: ["query", "--insecure", "-"]
    stdin: |
      USE GRAPH test_comprehensive;
      MATCH (n) DETACH DELETE n;
      DROP GRAPH IF EXISTS test_comprehensive;
    expect:
      exit_code: 0
    tags: ["cleanup"]

  - name: "cleanup-isolation-graphs"
    description: "Cleanup isolation graphs"
    args: ["query", "--insecure", "-"]
    stdin: |
      USE GRAPH isolation_graph_a;
      MATCH (n) DETACH DELETE n;
      DROP GRAPH IF EXISTS isolation_graph_a;
      USE GRAPH isolation_graph_b;
      MATCH (n) DETACH DELETE n;
      DROP GRAPH IF EXISTS isolation_graph_b;
    expect:
      exit_code: 0
    tags: ["cleanup"]

  - name: "final-graphs-list"
    description: "Final graphs list"
    args: ["query", "--insecure", "-"]
    stdin: "SHOW GRAPHS;"
    expect:
      exit_code: 0
    tags: ["cleanup", "verify"]
