version: '1.0'
name: Gap Security Regression Tests - January 2026
description: "Regression tests for critical security gaps resolved on January 12, 2026:\n- GAP-0017: AES-256-GCM key wrapping (was XOR)\n- GAP-0035: 2PC applyWriteSet real implementation (was stub)\n- GAP-0062: AES-256-GCM page/WAL encryption (was XOR)\n- GAP-0066: External KMS production safety (was local_dev default)\n- GAP-0069: Cryptographic random for key rotation (was deterministic PRNG)\n- GAP-0086: LocalSimulated production guard (was no warning)\n- GAP-0099: B-tree range scan implementation (was empty array)\n- GAP-0100: KMS wrapLocalDev AES-256-GCM (was XOR)\n- GAP-0101: CDC sinks real implementation (was placeholder)\n"
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 30000
    cleanup: true
    args:
    - --log-level
    - error
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 30000
    tls_verify: false
    format: json
tests:
- name: gap-0017-tde-key-wrapping-functional
  description: TDE key wrapping produces encrypted data that differs from plaintext
  args:
  - query
  - '-'
  stdin: "CREATE (n:TDETest_0017 {secret: 'sensitive_data_12345'});\nMATCH (n:TDETest_0017) RETURN n.secret AS `data`\n"
  expect:
    exit_code: 0
    stdout_contains:
    - sensitive_data_12345
  tags:
  - gap-0017
  - tde
  - encryption
  - regression
- name: gap-0062-page-encryption-persists
  description: Page encryption correctly stores and retrieves encrypted data
  args:
  - query
  - '-'
  stdin: "CREATE (n:PageEncrypt_0062 {payload: 'encrypted_payload_value'});\nCREATE (m:PageEncrypt_0062 {payload: 'another_encrypted_value'});\nMATCH (n:PageEncrypt_0062) RETURN n.payload AS `data` ORDER BY n.payload\n"
  expect:
    exit_code: 0
    stdout_contains:
    - encrypted_payload_value
    - another_encrypted_value
  tags:
  - gap-0062
  - tde
  - page-encryption
  - regression
- name: gap-0062-wal-encryption-recovery
  description: WAL encryption allows proper recovery after restart
  args:
  - query
  - '-'
  stdin: "CREATE (n:WALEncrypt_0062 {transaction: 'wal_test_transaction'});\nMATCH (n:WALEncrypt_0062) RETURN n.transaction AS txn\n"
  expect:
    exit_code: 0
    stdout_contains:
    - wal_test_transaction
  tags:
  - gap-0062
  - tde
  - wal-encryption
  - regression
- name: gap-0100-kms-local-dev-encryption
  description: KMS local_dev provider uses proper encryption for data roundtrip
  args:
  - query
  - '-'
  stdin: "CREATE (n:KMSTest_0100 {key_material: 'master_key_test_value'});\nMATCH (n:KMSTest_0100) RETURN n.key_material AS key\n"
  expect:
    exit_code: 0
    stdout_contains:
    - master_key_test_value
  tags:
  - gap-0100
  - kms
  - encryption
  - regression
- name: gap-0035-transaction-commit-persists
  description: Committed transactions persist data correctly
  args:
  - query
  - '-'
  stdin: "BEGIN;\nCREATE (n:TxnTest_0035 {value: 'committed_data'});\nCOMMIT;\nMATCH (n:TxnTest_0035) RETURN n.value AS `data`\n"
  expect:
    exit_code: 0
    stdout_contains:
    - committed_data
  tags:
  - gap-0035
  - 2pc
  - transaction
  - regression
- name: gap-0035-transaction-rollback-discards
  description: Rolled back transactions do not persist
  args:
  - query
  - '-'
  stdin: "BEGIN;\nCREATE (n:RollbackTest_0035 {value: 'should_not_exist'});\nROLLBACK;\nMATCH (n:RollbackTest_0035) RETURN count(n) AS cnt\n"
  expect:
    exit_code: 0
    stdout_contains:
    - '0'
  tags:
  - gap-0035
  - 2pc
  - rollback
  - regression
- name: gap-0035-multiple-writes-in-transaction
  description: Multiple writes in transaction all persist on commit
  args:
  - query
  - '-'
  stdin: "BEGIN;\nCREATE (a:MultiWrite_0035 {id: 1, name: 'first'});\nCREATE (b:MultiWrite_0035 {id: 2, name: 'second'});\nCREATE (c:MultiWrite_0035 {id: 3, name: 'third'});\nCOMMIT;\nMATCH (n:MultiWrite_0035) RETURN count(n) AS total\n"
  expect:
    exit_code: 0
    stdout_contains:
    - '3'
  tags:
  - gap-0035
  - 2pc
  - multi-write
  - regression
- name: gap-0066-kms-queries-with-secure-defaults
  description: Queries work correctly with secure KMS defaults
  args:
  - query
  - '-'
  stdin: "CREATE (n:KMSDefault_0066 {provider: 'external_kms'});\nMATCH (n:KMSDefault_0066) RETURN n.provider AS provider\n"
  expect:
    exit_code: 0
    stdout_contains:
    - external_kms
  tags:
  - gap-0066
  - kms
  - production-safety
  - regression
- name: gap-0086-secure-data-roundtrip
  description: Data persists correctly with production-safe encryption
  args:
  - query
  - '-'
  stdin: "CREATE (n:VaultTest_0086 {secure_field: 'vault_protected_value'});\nMATCH (n:VaultTest_0086) RETURN n.secure_field AS `data`\n"
  expect:
    exit_code: 0
    stdout_contains:
    - vault_protected_value
  tags:
  - gap-0086
  - kms
  - vault
  - regression
- name: gap-0069-key-generation-random
  description: Generated keys are non-deterministic (using timestamp)
  args:
  - query
  - 'CREATE (n:KeyGen_0069 {created_at: timestamp()}); CREATE (m:KeyGen_0069 {created_at: timestamp()}); MATCH (n:KeyGen_0069) RETURN count(n) AS `keys`'
  expect:
    exit_code: 0
    stdout_contains:
    - '2'
  tags:
  - gap-0069
  - crypto-random
  - key-generation
  - regression
- name: gap-0099-range-scan-basic
  description: Index range scan returns matching entries
  args:
  - query
  - '-'
  stdin: "CREATE (a:RangeTest_0099 {value: 10});\nCREATE (b:RangeTest_0099 {value: 20});\nCREATE (c:RangeTest_0099 {value: 30});\nCREATE (d:RangeTest_0099 {value: 40});\nCREATE (e:RangeTest_0099 {value: 50});\nMATCH (n:RangeTest_0099) WHERE n.value >= 20 AND n.value <= 40 RETURN n.value AS val ORDER BY val\n"
  expect:
    exit_code: 0
    stdout_contains:
    - '20'
    - '30'
    - '40'
    stdout_not_contains:
    - '10'
    - '50'
  tags:
  - gap-0099
  - index
  - range-scan
  - regression
- name: gap-0099-range-scan-with-index
  description: Indexed range scan uses index for optimization
  args:
  - query
  - '-'
  stdin: "CREATE INDEX idx_range_test ON :IndexedRange_0099(score);\nCREATE (a:IndexedRange_0099 {score: 100});\nCREATE (b:IndexedRange_0099 {score: 200});\nCREATE (c:IndexedRange_0099 {score: 300});\nMATCH (n:IndexedRange_0099) WHERE n.score > 150 RETURN n.score AS score ORDER BY score\n"
  expect:
    exit_code: 0
    stdout_contains:
    - '200'
    - '300'
  tags:
  - gap-0099
  - index
  - range-scan
  - indexed
  - regression
- name: gap-0099-range-scan-empty-result
  description: Range scan correctly returns empty for non-matching range
  args:
  - query
  - '-'
  stdin: "CREATE (a:EmptyRange_0099 {num: 5});\nCREATE (b:EmptyRange_0099 {num: 10});\nMATCH (n:EmptyRange_0099) WHERE n.num > 100 RETURN count(n) AS cnt\n"
  expect:
    exit_code: 0
    stdout_contains:
    - '0'
  tags:
  - gap-0099
  - index
  - range-scan
  - empty
  - regression
- name: gap-0099-range-scan-inclusive-bounds
  description: Range scan handles inclusive bounds correctly
  args:
  - query
  - '-'
  stdin: "CREATE (a:BoundsTest_0099 {x: 1});\nCREATE (b:BoundsTest_0099 {x: 2});\nCREATE (c:BoundsTest_0099 {x: 3});\nMATCH (n:BoundsTest_0099) WHERE n.x >= 1 AND n.x <= 3 RETURN count(n) AS cnt\n"
  expect:
    exit_code: 0
    stdout_contains:
    - '3'
  tags:
  - gap-0099
  - index
  - range-scan
  - bounds
  - regression
- name: gap-0101-cdc-event-generation
  description: CDC generates events for data changes
  args:
  - query
  - '-'
  stdin: "CREATE (n:CDCTest_0101 {event: 'insert_event'});\nMATCH (m:CDCTest_0101) SET m.event = 'update_event';\nMATCH (n:CDCTest_0101) RETURN n.event AS status\n"
  expect:
    exit_code: 0
    stdout_contains:
    - update_event
  tags:
  - gap-0101
  - cdc
  - events
  - regression
- name: gap-0101-cdc-delete-event
  description: CDC captures delete events
  args:
  - query
  - '-'
  stdin: "CREATE (n:CDCDelete_0101 {data: 'to_be_deleted'});\nMATCH (n:CDCDelete_0101) DELETE n;\nMATCH (n:CDCDelete_0101) RETURN count(n) AS remaining\n"
  expect:
    exit_code: 0
    stdout_contains:
    - '0'
  tags:
  - gap-0101
  - cdc
  - delete
  - regression
- name: security-regression-full-workflow
  description: 'Full security workflow: create encrypted data in transaction'
  args:
  - query
  - '-'
  stdin: "BEGIN;\nCREATE (n:SecureWorkflow {\n  sensitive_field: 'confidential_value',\n  encrypted_data: 'aes_256_gcm_protected',\n  audit_trail: 'security_regression_test'\n});\nCOMMIT;\nMATCH (n:SecureWorkflow) RETURN n.sensitive_field AS `data`, n.encrypted_data AS encrypted\n"
  expect:
    exit_code: 0
    stdout_contains:
    - confidential_value
    - aes_256_gcm_protected
  tags:
  - security
  - combined
  - regression
- name: security-regression-index-with-encryption
  description: Indexed queries work correctly with TDE encryption
  args:
  - query
  - '-'
  stdin: "CREATE INDEX secure_idx ON :SecureIndex(key);\nCREATE (a:SecureIndex {key: 'alpha', secret: 'value_a'});\nCREATE (b:SecureIndex {key: 'beta', secret: 'value_b'});\nCREATE (c:SecureIndex {key: 'gamma', secret: 'value_c'});\nMATCH (n:SecureIndex) WHERE n.key STARTS WITH 'b' RETURN n.secret AS result\n"
  expect:
    exit_code: 0
    stdout_contains:
    - value_b
  tags:
  - security
  - index
  - encryption
  - regression
- name: security-regression-transaction-isolation
  description: Transaction isolation with encrypted data
  args:
  - query
  - '-'
  stdin: "BEGIN;\nCREATE (n:IsolationTest {state: 'initial'});\nMATCH (m:IsolationTest) SET m.state = 'modified';\nCOMMIT;\nMATCH (n:IsolationTest) RETURN n.state AS final\n"
  expect:
    exit_code: 0
    stdout_contains:
    - modified
  tags:
  - security
  - isolation
  - regression
