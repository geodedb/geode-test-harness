- name: cdc-retention-cleanup-process
  description: Test CDC retention cleanup process
  args:
  - query
  - CALL cdc.cleanup_expired_events() YIELD cleaned_events, bytes_freed, oldest_remaining_event RETURN cleaned_events, bytes_freed, oldest_remaining_event
  expect:
    exit_code: 1
    stdout_contains:
    - '"status_class":"0A000"'
    - is not implemented
