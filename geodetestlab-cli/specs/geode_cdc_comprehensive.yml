version: '1.0'
name: Geode CDC (Change Data Capture) Comprehensive Test Suite
description: Complete testing of Geode's CDC engine including event capture, diagnostics, guardrails, and streaming
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 30000
    cleanup: true
    args:
    - --log-level
    - info
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 15000
    tls_verify: false
    format: json
tests:
- name: cdc-setup-test-data
  description: Create test data for CDC operations
  args:
  - query
  - "CREATE (alice:Person {name: 'Alice', age: 30, department: 'Engineering'}), (bob:Person {name: 'Bob', age: 25, department: 'Marketing'}), (charlie:Person {name: 'Charlie', age: 35, department: 'Sales'}), (alice)-[:KNOWS {since: 2020, strength: 0.8}]->(bob), (alice)-[:KNOWS {since: 2018, strength: 0.9}]->(charlie) RETURN alice, bob, charlie"
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
      columns:
      - alice
      - bob
      - charlie
  tags:
  - cdc
  - setup
- name: cdc-enable-streaming
  description: Enable CDC streaming for test database
  args:
  - query
  - CALL cdc.enable() YIELD status RETURN status
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
      columns:
      - status
  tags:
  - cdc
  - enable
- name: cdc-capture-insert-events
  description: Test CDC capture of INSERT operations
  args:
  - query
  - "CREATE (diana:Person {name: 'Diana', age: 28, department: 'HR'}) RETURN diana.name AS name"
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
      columns:
      - name
  tags:
  - cdc
  - insert
  - capture
- name: cdc-capture-update-events
  description: Test CDC capture of UPDATE operations
  args:
  - query
  - "MATCH (p:Person {name: 'Alice'}) SET p.age = 31, p.department = 'Senior Engineering' RETURN p.name AS name, p.age AS new_age"
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
      columns:
      - name
      - new_age
  tags:
  - cdc
  - update
  - capture
- name: cdc-capture-delete-events
  description: Test CDC capture of DELETE operations
  args:
  - query
  - "MATCH (p:Person {name: 'Bob'}) DETACH DELETE p"
  expect:
    exit_code: 0
  tags:
  - cdc
  - delete
  - capture
- name: cdc-capture-relationship-events
  description: Test CDC capture of relationship operations
  args:
  - query
  - "MATCH (alice:Person {name: 'Alice'}), (diana:Person {name: 'Diana'}) CREATE (alice)-[:KNOWS {since: 2024, strength: 0.7}]->(diana) RETURN alice.name AS from_name, diana.name AS to_name"
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
      columns:
      - from_name
      - to_name
  tags:
  - cdc
  - relationships
  - capture
- name: cdc-diagnostics-export-events
  description: Test CDC diagnostics event export
  args:
  - query
  - CALL cdc.export_diagnostics() YIELD event_count, malformed_count, last_seq_id RETURN event_count, malformed_count, last_seq_id
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
      columns:
      - event_count
      - malformed_count
      - last_seq_id
  tags:
  - cdc
  - diagnostics
  - export
- name: cdc-diagnostics-json-payload
  description: Test CDC diagnostics JSON payload structure
  args:
  - query
  - CALL cdc.get_events(0, 10) YIELD seq_id, event_type, operation, timestamp, payload RETURN seq_id, event_type, operation ORDER BY seq_id LIMIT 5
  expect:
    exit_code: 1
    stdout_contains:
    - '"status_class":"0A000"'
    - is not implemented
  tags:
  - cdc
  - diagnostics
  - json
- name: cdc-diagnostics-monotonic-sequence
  description: Test CDC sequence ID monotonicity
  args:
  - query
  - CALL cdc.get_events(0, 100) YIELD seq_id RETURN min(seq_id) AS min_seq, max(seq_id) AS max_seq, count(*) AS total_events
  expect:
    exit_code: 1
    stdout_contains:
    - '"status_class":"0A000"'
    - is not implemented
  tags:
  - cdc
  - diagnostics
  - sequence
- name: cdc-guardrail-warn-threshold
  description: Test CDC guardrail warning threshold trigger
  args:
  - query
  - CALL cdc.set_guardrail('warn_threshold', 1000) YIELD status RETURN status
  expect:
    exit_code: 1
    stdout_contains:
    - '"status_class":"0A000"'
    - is not implemented
  tags:
  - cdc
  - guardrail
  - warn
- name: cdc-guardrail-abort-threshold
  description: Test CDC guardrail abort threshold configuration
  args:
  - query
  - CALL cdc.set_guardrail('abort_threshold', 10000) YIELD status RETURN status
  expect:
    exit_code: 1
    stdout_contains:
    - '"status_class":"0A000"'
    - is not implemented
  tags:
  - cdc
  - guardrail
  - abort
- name: cdc-guardrail-epoch-management
  description: Test CDC guardrail epoch tracking
  args:
  - query
  - CALL cdc.get_guardrail_status() YIELD current_epoch, warn_threshold, abort_threshold, pending_events RETURN current_epoch, warn_threshold, abort_threshold, pending_events
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
      columns:
      - current_epoch
      - warn_threshold
      - abort_threshold
      - pending_events
  tags:
  - cdc
  - guardrail
  - epoch
- name: cdc-guardrail-reset-command
  description: Test CDC guardrail reset functionality
  args:
  - query
  - CALL cdc.reset_guardrails() YIELD status, new_epoch RETURN status, new_epoch
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
      columns:
      - status
      - new_epoch
  tags:
  - cdc
  - guardrail
  - reset
- name: cdc-control-protocol-status
  description: Test CDC control protocol status responses
  args:
  - query
  - CALL cdc.status() YIELD enabled, streaming, event_count, last_checkpoint RETURN enabled, streaming, event_count, last_checkpoint
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
      columns:
      - enabled
      - streaming
      - event_count
      - last_checkpoint
  tags:
  - cdc
  - control
  - status
- name: cdc-control-protocol-pause-resume
  description: Test CDC control protocol pause
  args:
  - query
  - CALL cdc.pause() YIELD status RETURN status
  expect:
    exit_code: 1
    stdout_contains:
    - '"status_class":"0A000"'
    - is not implemented
  tags:
  - cdc
  - control
  - pause
- name: cdc-control-protocol-resume
  description: Test CDC control protocol resume functionality
  args:
  - query
  - CALL cdc.resume() YIELD status RETURN status
  expect:
    exit_code: 1
    stdout_contains:
    - '"status_class":"0A000"'
    - is not implemented
  tags:
  - cdc
  - control
  - resume
- name: cdc-backpressure-watermark-handling
  description: Test CDC backpressure watermark advancement
  args:
  - query
  - CALL cdc.get_watermark() YIELD current_watermark, pending_bytes, flow_control_active RETURN current_watermark, pending_bytes, flow_control_active
  expect:
    exit_code: 1
    stdout_contains:
    - '"status_class":"0A000"'
    - is not implemented
  tags:
  - cdc
  - backpressure
  - watermark
- name: cdc-backpressure-pending-events
  description: Test CDC pending events monitoring
  args:
  - query
  - CALL cdc.get_pending_events() YIELD count, oldest_timestamp, memory_usage RETURN count, oldest_timestamp, memory_usage
  expect:
    exit_code: 1
    stdout_contains:
    - '"status_class":"0A000"'
    - is not implemented
  tags:
  - cdc
  - backpressure
  - pending
- name: cdc-adaptive-flush-configuration
  description: Test CDC adaptive flush batch size configuration
  args:
  - query
  - CALL cdc.configure_adaptive_flush(100, 1000, 50) YIELD status RETURN status
  expect:
    exit_code: 1
    stdout_contains:
    - '"status_class":"0A000"'
    - is not implemented
  tags:
  - cdc
  - adaptive
  - flush
- name: cdc-adaptive-flush-metrics
  description: Test CDC adaptive flush performance metrics
  args:
  - query
  - CALL cdc.get_flush_metrics() YIELD current_batch_size, avg_latency_ms, total_flushes, adaptive_adjustments RETURN current_batch_size, avg_latency_ms, total_flushes, adaptive_adjustments
  expect:
    exit_code: 1
    stdout_contains:
    - '"status_class":"0A000"'
    - is not implemented
  tags:
  - cdc
  - adaptive
  - metrics
- name: cdc-malformed-record-detection
  description: Test CDC malformed record detection and handling
  args:
  - query
  - CALL cdc.get_malformed_records() YIELD record_count, corruption_types, recovery_attempts RETURN record_count, corruption_types, recovery_attempts
  expect:
    exit_code: 1
    stdout_contains:
    - '"status_class":"0A000"'
    - is not implemented
  tags:
  - cdc
  - malformed
  - detection
- name: cdc-malformed-prefix-retention
  description: Test CDC malformed record prefix/hash retention
  args:
  - query
  - CALL cdc.get_corruption_analysis() YIELD prefix_retained, hash_validation, repair_suggestions RETURN prefix_retained, hash_validation, repair_suggestions
  expect:
    exit_code: 1
    stdout_contains:
    - '"status_class":"0A000"'
    - is not implemented
  tags:
  - cdc
  - malformed
