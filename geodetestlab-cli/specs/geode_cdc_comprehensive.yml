  - ordering
- name: cdc-stream-deduplication
  description: Test CDC stream event deduplication
  args:
  - query
  - CALL cdc.check_duplicates() YIELD duplicate_count, dedup_strategy, unique_events RETURN duplicate_count, dedup_strategy, unique_events
  expect:
    exit_code: 1
    stdout_contains:
    - '"status_class":"0A000"'
    - is not implemented
