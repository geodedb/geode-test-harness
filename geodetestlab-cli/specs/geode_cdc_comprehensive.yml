- name: cdc-stream-event-ordering
  description: Test CDC stream event ordering guarantees
  args:
  - query
  - CALL cdc.get_ordered_events(0, 50) YIELD seq_id, timestamp, operation_order RETURN seq_id, timestamp, operation_order ORDER BY seq_id LIMIT 10
  expect:
    exit_code: 1
    stdout_contains:
    - '"status_class":"0A000"'
    - is not implemented
  tags:
  - cdc
