- name: cdc-retention-policy-configuration
  description: Test CDC retention policy configuration
  args:
  - query
  - CALL cdc.set_retention_policy(72, 100000) YIELD status RETURN status
  expect:
    exit_code: 1
    stdout_contains:
    - '"status_class":"0A000"'
    - is not implemented
  tags:
  - cdc
  - retention
