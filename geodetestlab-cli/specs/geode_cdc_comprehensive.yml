- name: cdc-lifecycle-start-stop
  description: Test CDC engine lifecycle stop operation
  args:
  - query
  - CALL cdc.stop() YIELD status, final_event_count RETURN status, final_event_count
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
      columns:
      - status
      - final_event_count
  tags:
  - cdc
  - lifecycle
  - stop
- name: cdc-lifecycle-restart
  description: Test CDC engine restart and state recovery
  args:
  - query
  - CALL cdc.start() YIELD status, recovered_event_count, checkpoint_restored RETURN status, recovered_event_count, checkpoint_restored
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
      columns:
      - status
      - recovered_event_count
      - checkpoint_restored
  tags:
  - cdc
  - lifecycle
