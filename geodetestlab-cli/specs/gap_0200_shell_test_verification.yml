name: gap_0200_shell_test_verification
description: Integration tests verifying shell test requirements from SHELL_TEST_ISSUES.md
mode: server
setup:
- query: "CREATE (n:ShellTestNode {name: 'shell_verification'})\nRETURN n.name AS result\n"
tests:
- name: gap-0200-aggregation-no-groupby
  description: Verify aggregation without GROUP BY clause
  query: "CREATE (a:Counter {value: 1}), (b:Counter {value: 2}), (c:Counter {value: 3});\nMATCH (n:Counter)\nRETURN count(n) AS total\n"
  expect:
    exit_code: 0
    stdout_contains:
    - total
- name: gap-0200-chain-aggregation
  description: Verify chained aggregation with WITH clause
  query: "MATCH (n:Counter)\nWITH count(n) AS cnt\nRETURN cnt AS aggregated_count\n"
  expect:
    exit_code: 0
    stdout_contains:
    - aggregated_count
- name: gap-0200-with-where-filter
  description: Verify WITH clause with WHERE filter
  query: "MATCH (n:Counter)\nWITH n WHERE n.value > 1\nRETURN count(n) AS filtered_count\n"
  expect:
    exit_code: 0
    stdout_contains:
    - filtered_count
- name: gap-0200-with-chain
  description: Verify chained WITH clauses
  query: "WITH 1 AS x\nWITH x + 1 AS y\nRETURN y AS result\n"
  expect:
    exit_code: 0
    stdout_contains:
    - result
- name: gap-0200-optional-match-basic
  description: Verify basic OPTIONAL MATCH
  query: "MATCH (a:ShellTestNode)\nOPTIONAL MATCH (a)-[:KNOWS]->(b)\nRETURN a.name AS node, b.name AS friend\n"
  expect:
    exit_code: 0
    stdout_contains:
    - node
- name: gap-0200-multiple-optional
  description: Verify multiple OPTIONAL MATCH clauses
  query: "MATCH (a:ShellTestNode)\nOPTIONAL MATCH (a)-[:KNOWS]->(b)\nOPTIONAL MATCH (a)-[:WORKS_AT]->(c)\nRETURN a.name AS node\n"
  expect:
    exit_code: 0
    stdout_contains:
    - node
- name: gap-0200-order-by-expression
  description: Verify ORDER BY with expression
  query: "MATCH (n:Counter)\nRETURN n.value AS val\nORDER BY n.value DESC\n"
  expect:
    exit_code: 0
    stdout_contains:
    - val
# removed: gap-0200-order-by-multi-column used Cypher list-iteration not in ISO GQL
- name: gap-0200-variable-length-path
  description: Verify variable length path pattern
  query: "CREATE (a:PathNode {id: 1})-[:NEXT]->(b:PathNode {id: 2})-[:NEXT]->(c:PathNode {id: 3});\nMATCH (s:PathNode)-[:NEXT*1..2]->(e:PathNode)\nRETURN s.id AS start_id, e.id AS end_id\n"
  expect:
    exit_code: 0
    stdout_contains:
    - start_id
    - end_id
- name: gap-0200-null-semantics
  description: Verify NULL semantics
  query: "WITH null AS val\nRETURN val IS NULL AS is_null, val IS NOT NULL AS is_not_null\n"
  expect:
    exit_code: 0
    stdout_contains:
    - is_null
    - is_not_null
- name: gap-0200-boolean-logic
  description: Verify boolean logic expressions
  query: "RETURN true AND true AS both_true, true AND false AS mixed, NOT false AS negated\n"
  expect:
    exit_code: 0
    stdout_contains:
    - both_true
    - mixed
    - negated
- name: gap-0200-set-union
  description: Verify UNION set operation
  query: "RETURN 'a' AS letter\nUNION\nRETURN 'b' AS letter\n"
  expect:
    exit_code: 0
    stdout_contains:
    - letter
