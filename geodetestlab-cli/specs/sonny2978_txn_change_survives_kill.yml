# SONNY-2978 (with SONNY-2979 / SONNY-6472): a change committing its own engine transaction
# inside a Geode transaction survives a SIGKILL
#
# Bug (DATA LOSS): graph-storage batches an engine transaction's WAL page images
# until it commits; recovery replays the log in order. Inside a Geode
# `START TRANSACTION ... COMMIT` program a REMOVE of a property, a DELETE of a
# node or relationship, a label SET or REMOVE and an edge-property REMOVE each
# committed their own engine transaction on the node's shard; when that was the
# session transaction's shard the program's earlier (older) page images of the
# same pages were logged AFTER the change's, so after a crash the change was
# undone: a removed property, deleted node/relationship or removed label came
# back and a label set was lost.
#
# Fixed behaviour: those changes join the session engine transaction (or commit
# without holding the shard's WAL batch), so after SIGKILL + restart the
# committed result is what recovery shows.
#
# What this spec proves: against a real server node with the persistence tick and
# checkpoint triggers disabled (what the restart sees is the WAL's), each of the
# six shapes is run as ONE `START TRANSACTION; <64 creates>; <change>; COMMIT`
# message; the result is asserted, the node is SIGKILLed (no shutdown, no
# checkpoint) and restarted on the same data directory, and the SAME counts are
# asserted again. 64 nodes per case so every one of the 16 shards, the session
# transaction's included, holds several. The harness's independent 2-node
# cluster mode is used only for its signal / restart_node steps; the nodes are
# standalone servers.

version: '1.0'
name: SONNY-2978 a committed change inside a transaction survives SIGKILL
description: REMOVE, DELETE, label SET/REMOVE, relationship DELETE and edge-property REMOVE inside START TRANSACTION survive a SIGKILL and restart (SONNY-2978)
cluster:
  nodes: 2
  independent: true
  target_node: '0'
  startup_timeout_ms: 90000
  shared_args:
  - --log-level
  - warn
  - --persist-interval
  - '86400000'
  shared_env:
    GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
    GEODE_CHECKPOINT_INTERVAL_MS: '86400000'
    GEODE_CHECKPOINT_OPS: '1000000000'
cli:
  binary: ./zig-out/bin/geode
  client:
    timeout_ms: 30000
    tls_verify: false
    format: json
tests:
