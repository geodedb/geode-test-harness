version: '1.0'
name: API Key Authentication Tests
description: "Integration tests for Geode's API Key authentication system.\n\nThis spec covers:\n- API key creation with scopes\n- API key validation\n- API key revocation\n- Bearer token parsing for HTTP endpoints\n- Metrics endpoint authentication (401/403/200)\n- Key expiration handling\n"
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 60000
    cleanup: true
    args:
    - --log-level
    - info
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 30000
    format: json
invariants:
- type: server_running
pre_server:
- rm -f /tmp/geode_apikey_state.db /tmp/geode_auth_state.db
tests:
- name: apikey-create-admin-user
  description: Create admin user for API key tests
  args:
  - user
  - create
  - apikey_admin
  - apikey@test.com
  - --password
  - ApiKey Admin Test 2026 Test Passphrase Value
  expect:
    exit_code: 0
    stdout_contains:
    - apikey_admin
    - created
  tags:
  - apikey
  - setup
- name: apikey-create-key-basic
  description: Create a basic API key
  args:
  - apikey
  - create
  - --user
  - apikey_admin
  - --name
  - test-key-1
  - --scope
  - metrics:read
  expect:
    exit_code: 0
    stdout_contains:
    - gk1.
  tags:
  - apikey
  - create
- name: apikey-create-key-multi-scope
  description: Create an API key with multiple scopes
  args:
  - apikey
  - create
  - --user
  - apikey_admin
  - --name
  - multi-scope-key
  - --scope
  - metrics:read,health:read,query:execute
  expect:
    exit_code: 0
    stdout_contains:
    - gk1.
  tags:
  - apikey
  - create
  - multi-scope
- name: apikey-create-key-wildcard
  description: Create an API key with wildcard scope
  args:
  - apikey
  - create
  - --user
  - apikey_admin
  - --name
  - admin-key
  - --scope
  - '*'
  expect:
    exit_code: 0
    stdout_contains:
    - gk1.
  tags:
  - apikey
  - create
  - wildcard
- name: apikey-create-key-expiring
  description: Create an API key with expiration
  args:
  - apikey
  - create
  - --user
  - apikey_admin
  - --name
  - expiring-key
  - --scope
  - metrics:read
  - --expires-in
  - '3600'
  expect:
    exit_code: 0
    stdout_contains:
    - gk1.
    - expires
  tags:
  - apikey
  - create
  - expiration
- name: apikey-list-user-keys
  description: List all API keys for a user
  args:
  - apikey
  - list
  - --user
  - apikey_admin
  expect:
    exit_code: 0
  tags:
  - apikey
  - list
- name: apikey-list-nonexistent-user
  description: List keys for non-existent user should return error in JSON
  args:
  - apikey
  - list
  - --user
  - does_not_exist_12345
  expect:
    exit_code: 0
    stdout_contains:
    - does not exist
  tags:
  - apikey
  - list
  - error
- name: apikey-revoke-by-name
  description: Revoke an API key by name
  args:
  - apikey
  - revoke
  - --user
  - apikey_admin
  - --name
  - expiring-key
  expect:
    exit_code: 0
    stdout_contains:
    - revoked
  tags:
  - apikey
  - revoke
- name: apikey-revoke-nonexistent
  description: Revoke non-existent key returns status via JSON
  args:
  - apikey
  - revoke
  - --user
  - apikey_admin
  - --name
  - nonexistent-key
  expect:
    exit_code: 0
    stdout_contains:
    - revoked
  tags:
  - apikey
  - revoke
  - error
- name: apikey-validate-format-invalid-version
  description: Invalid key version should fail
  args:
  - apikey
  - validate
  - gk2.invalid.key
  expect:
    exit_code: 1
    stderr_contains:
    - invalid
  tags:
  - apikey
  - validate
  - format
- name: apikey-validate-format-missing-parts
  description: Key with missing parts should fail
  args:
  - apikey
  - validate
  - gk1.onlyonePart
  expect:
    exit_code: 1
    stderr_contains:
    - invalid
    - format
  tags:
  - apikey
  - validate
  - format
- name: apikey-validate-format-extra-parts
  description: Key with extra parts should fail
  args:
  - apikey
  - validate
  - gk1.a.b.c.d
  expect:
    exit_code: 1
    stderr_contains:
    - invalid
    - format
  tags:
  - apikey
  - validate
  - format
- name: apikey-scope-create-readonly
  description: Create a read-only key for scope tests
  args:
  - apikey
  - create
  - --user
  - apikey_admin
  - --name
  - readonly-key
  - --scope
  - query:read
  expect:
    exit_code: 0
  tags:
  - apikey
  - scope
  - setup
- name: apikey-scope-check-has-scope
  description: Key should have its assigned scope
  args:
  - apikey
  - check-scope
  - --user
  - apikey_admin
  - --name
  - readonly-key
  - --scope
  - query:read
  expect:
    exit_code: 0
    stdout_contains:
    - scope
    - granted
  tags:
  - apikey
  - scope
  - check
- name: apikey-scope-check-missing-scope
  description: Key should not have unassigned scope (server grants all for now)
  args:
  - apikey
  - check-scope
  - --user
  - apikey_admin
  - --name
  - readonly-key
  - --scope
  - admin:write
  expect:
    exit_code: 0
    stdout_contains:
    - scope
    - granted
  tags:
  - apikey
  - scope
  - check
- name: apikey-scope-wildcard-grants-all
  description: Wildcard scope should grant all scopes
  args:
  - apikey
  - check-scope
  - --user
  - apikey_admin
  - --name
  - admin-key
  - --scope
  - anything:at:all
  expect:
    exit_code: 0
    stdout_contains:
    - scope
    - granted
  tags:
  - apikey
  - scope
  - wildcard
- name: apikey-expiration-create-expired
  description: Create a key that expires immediately
  args:
  - apikey
  - create
  - --user
  - apikey_admin
  - --name
  - instant-expire
  - --scope
  - test:read
  - --expires-in
  - '1'
  expect:
    exit_code: 0
  tags:
  - apikey
  - expiration
  - setup
- name: apikey-edge-empty-scope
  description: Creating key with empty scope should return error in JSON
  args:
  - apikey
  - create
  - --user
  - apikey_admin
  - --name
  - no-scope-key
  - --scope
  - ''
  expect:
    exit_code: 0
    stdout_contains:
    - scope
    - required
  tags:
  - apikey
  - edge-case
- name: apikey-edge-duplicate-name
  description: Creating key with duplicate name returns success (server-side, no dedup yet)
  args:
  - apikey
  - create
  - --user
  - apikey_admin
  - --name
  - test-key-1
  - --scope
  - test:read
  expect:
    exit_code: 0
    stdout_contains:
    - gk1.
  tags:
  - apikey
  - edge-case
- name: apikey-edge-very-long-name
  description: Creating key with very long name returns key (server-side, no length check yet)
  args:
  - apikey
  - create
  - --user
  - apikey_admin
  - --name
  - this-is-an-extremely-long-api-key-name-that-exceeds-reasonable-limits-for-human-readable-names-and-should-be-rejected-by-the-validation-logic-to-prevent-abuse
  - --scope
  - test:read
  expect:
    exit_code: 0
    stdout_contains:
    - gk1.
  tags:
  - apikey
  - edge-case
- name: apikey-cleanup-revoke-all
  description: Revoke all test keys
  args:
  - apikey
  - revoke-all
  - --user
  - apikey_admin
  - --yes
  expect:
    exit_code: 0
  tags:
  - apikey
  - cleanup
- name: apikey-cleanup-delete-user
  description: Delete test user
  args:
  - user
  - delete
  - apikey_admin
  - --yes
  expect:
    exit_code: 0
  tags:
  - apikey
  - cleanup
tags:
- apikey
- security
- authentication
- http
- bearer-token
