version: '1.0'
name: API Key Authentication Tests
description: 'Integration tests for Geode''s API Key authentication system.


  This spec covers:

  - API key creation with scopes

  - API key validation

  - API key revocation

  - Bearer token parsing for HTTP endpoints

  - Metrics endpoint authentication (401/403/200)

  - Key expiration handling

  '
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port: null
    data_dir: null
    startup_timeout_ms: 60000
    cleanup: true
    args:
    - --log-level
    - info
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 30000
    format: json
invariants:
- type: server_running
tests:
- name: apikey-create-admin-user
  description: Create admin user for API key tests
  args:
  - user
  - create
  - apikey_admin
  - apikey@test.com
  - --password
  - ApiKey_Admin_Test_2026!
  expect:
    exit_code: 0
    stdout_contains:
    - User 'apikey_admin' created successfully
  tags:
  - apikey
  - setup
- name: apikey-create-key-basic
  description: Create a basic API key
  args:
  - apikey
  - create
  - --user
  - apikey_admin
  - --name
  - test-key-1
  - --scope
  - metrics:read
  expect:
    exit_code: 0
    stdout_contains:
    - gk1.
    stdout_regex:
    - gk1\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+
  tags:
  - apikey
  - create
- name: apikey-create-key-multi-scope
  description: Create an API key with multiple scopes
  args:
  - apikey
  - create
  - --user
  - apikey_admin
  - --name
  - multi-scope-key
  - --scope
  - metrics:read,health:read,query:execute
  expect:
    exit_code: 0
    stdout_contains:
    - gk1.
  tags:
  - apikey
  - create
  - multi-scope
- name: apikey-create-key-wildcard
  description: Create an API key with wildcard scope
  args:
  - apikey
  - create
  - --user
  - apikey_admin
  - --name
  - admin-key
  - --scope
  - '*'
  expect:
    exit_code: 0
    stdout_contains:
    - gk1.
  tags:
  - apikey
  - create
  - wildcard
- name: apikey-create-key-expiring
  description: Create an API key with expiration
  args:
  - apikey
  - create
  - --user
  - apikey_admin
  - --name
  - expiring-key
  - --scope
  - metrics:read
  - --expires-in
  - '3600'
  expect:
    exit_code: 0
    stdout_contains:
    - gk1.
    - expires
  tags:
  - apikey
  - create
  - expiration
- name: apikey-list-user-keys
  description: List all API keys for a user
  args:
  - apikey
  - list
  - --user
  - apikey_admin
  expect:
    exit_code: 0
    stdout_contains:
    - test-key-1
    - multi-scope-key
    - admin-key
    - expiring-key
  tags:
  - apikey
  - list
- name: apikey-list-nonexistent-user
  description: List keys for non-existent user should fail
  args:
  - apikey
  - list
  - --user
  - does_not_exist_12345
  expect:
    exit_code: 1
    stderr_contains:
    - does not exist
  tags:
  - apikey
  - list
  - error
- name: apikey-revoke-by-name
  description: Revoke an API key by name
  args:
  - apikey
  - revoke
  - --user
  - apikey_admin
  - --name
  - expiring-key
  expect:
    exit_code: 0
    stdout_contains:
    - revoked
  tags:
  - apikey
  - revoke
- name: apikey-revoke-nonexistent
  description: Revoke non-existent key should fail gracefully
  args:
  - apikey
  - revoke
  - --user
  - apikey_admin
  - --name
  - nonexistent-key
  expect:
    exit_code: 1
    stderr_contains:
    - not found
  tags:
  - apikey
  - revoke
  - error
- name: apikey-validate-format-invalid-version
  description: Invalid key version should fail
  args:
  - apikey
  - validate
  - gk2.invalid.key
  expect:
    exit_code: 1
    stderr_contains:
    - unsupported
    - version
  tags:
  - apikey
  - validate
  - format
- name: apikey-validate-format-missing-parts
  description: Key with missing parts should fail
  args:
  - apikey
  - validate
  - gk1.onlyonePart
  expect:
    exit_code: 1
    stderr_contains:
    - invalid
    - format
  tags:
  - apikey
  - validate
  - format
- name: apikey-validate-format-extra-parts
  description: Key with extra parts should fail
  args:
  - apikey
  - validate
  - gk1.a.b.c.d
  expect:
    exit_code: 1
    stderr_contains:
    - invalid
    - format
  tags:
  - apikey
  - validate
  - format
- name: apikey-http-metrics-no-auth
  description: Metrics endpoint without auth should return 401 when auth required
  args:
  - curl
  - --silent
  - --write-out
  - '%{http_code}'
  - http://localhost:9091/metrics
  skip: true
  expect:
    exit_code: 0
    stdout_contains:
    - '401'
  tags:
  - apikey
  - http
  - '401'
- name: apikey-http-health-no-auth
  description: Health endpoint should work without auth
  args:
  - curl
  - --silent
  - --write-out
  - '%{http_code}'
  - http://localhost:9091/health
  skip: true
  expect:
    exit_code: 0
    stdout_contains:
    - '200'
    - ok
  tags:
  - apikey
  - http
  - health
- name: apikey-scope-create-readonly
  description: Create a read-only key for scope tests
  args:
  - apikey
  - create
  - --user
  - apikey_admin
  - --name
  - readonly-key
  - --scope
  - query:read
  expect:
    exit_code: 0
  tags:
  - apikey
  - scope
  - setup
- name: apikey-scope-check-has-scope
  description: Key should have its assigned scope
  args:
  - apikey
  - check-scope
  - --user
  - apikey_admin
  - --name
  - readonly-key
  - --scope
  - query:read
  expect:
    exit_code: 0
    stdout_contains:
    - scope
    - granted
  tags:
  - apikey
  - scope
  - check
- name: apikey-scope-check-missing-scope
  description: Key should not have unassigned scope
  args:
  - apikey
  - check-scope
  - --user
  - apikey_admin
  - --name
  - readonly-key
  - --scope
  - admin:write
  expect:
    exit_code: 1
    stdout_contains:
    - scope
    - denied
  tags:
  - apikey
  - scope
  - check
- name: apikey-scope-wildcard-grants-all
  description: Wildcard scope should grant all scopes
  args:
  - apikey
  - check-scope
  - --user
  - apikey_admin
  - --name
  - admin-key
  - --scope
  - anything:at:all
  expect:
    exit_code: 0
    stdout_contains:
    - scope
    - granted
  tags:
  - apikey
  - scope
  - wildcard
- name: apikey-expiration-create-expired
  description: Create a key that expires immediately
  args:
  - apikey
  - create
  - --user
  - apikey_admin
  - --name
  - instant-expire
  - --scope
  - test:read
  - --expires-in
  - '1'
  expect:
    exit_code: 0
  tags:
  - apikey
  - expiration
  - setup
- name: apikey-cleanup-revoke-all
  description: Revoke all test keys
  args:
  - apikey
  - revoke-all
  - --user
  - apikey_admin
  - --yes
  expect:
    exit_code: 0
  tags:
  - apikey
  - cleanup
- name: apikey-cleanup-delete-user
  description: Delete test user
  args:
  - user
  - delete
  - apikey_admin
  - --yes
  expect:
    exit_code: 0
  tags:
  - apikey
  - cleanup
- name: apikey-edge-empty-scope
  description: Creating key with empty scope should fail
  args:
  - apikey
  - create
  - --user
  - apikey_admin
  - --name
  - no-scope-key
  - --scope
  - ''
  expect:
    exit_code: 1
    stderr_contains:
    - scope
    - required
  tags:
  - apikey
  - edge-case
- name: apikey-edge-duplicate-name
  description: Creating key with duplicate name should fail
  args:
  - apikey
  - create
  - --user
  - apikey_admin
  - --name
  - test-key-1
  - --scope
  - test:read
  expect:
    exit_code: 1
    stderr_contains:
    - already exists
  tags:
  - apikey
  - edge-case
- name: apikey-edge-very-long-name
  description: Creating key with very long name should fail
  args:
  - apikey
  - create
  - --user
  - apikey_admin
  - --name
  - this-is-an-extremely-long-api-key-name-that-exceeds-reasonable-limits-for-human-readable-names-and-should-be-rejected-by-the-validation-logic-to-prevent-abuse
  - --scope
  - test:read
  expect:
    exit_code: 1
    stderr_contains:
    - name
    - long
  tags:
  - apikey
  - edge-case
tags:
- apikey
- security
- authentication
- http
- bearer-token
