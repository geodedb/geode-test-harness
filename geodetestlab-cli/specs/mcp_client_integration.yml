version: '1.0'
name: MCP Client Integration Tests
description: Integration tests for the Geode MCP/LSP server, verifying that the MCP and LSP subcommands are available and that the MCP server can start via the QUIC client path

cli:
  binary: /usr/local/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 60000
    cleanup: true
    args:
    - --log-level
    - warn
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 10000
    tls_verify: false
    format: json

tests:
- name: mcp-help-output
  description: Verify geode mcp --help shows MCP transport and endpoint options
  args: [mcp, --help]
  expect:
    exit_code: 0
    stderr_contains:
    - Model Context Protocol
    - --stdio
    - --port
    - --endpoint
  tags: [mcp, help]

- name: mcp-serve-help-output
  description: Verify geode mcp serve --help shows serve subcommand details
  args: [mcp, serve, --help]
  expect:
    exit_code: 0
    stderr_contains:
    - MCP
  tags: [mcp, help, serve]

- name: lsp-help-output
  description: Verify geode lsp --help shows LSP server capabilities
  args: [lsp, --help]
  expect:
    exit_code: 0
    stderr_contains:
    - Language Server Protocol
    - GQL
    - diagnostics
  tags: [lsp, help]

- name: main-help-lists-mcp-subcommand
  description: Verify the top-level help advertises the mcp subcommand
  args: [--help]
  expect:
    exit_code: 0
    stderr_contains:
    - mcp
    - Model Context Protocol
  tags: [mcp, discovery]

- name: main-help-lists-lsp-subcommand
  description: Verify the top-level help advertises the lsp subcommand
  args: [--help]
  expect:
    exit_code: 0
    stderr_contains:
    - lsp
    - Language Server Protocol
  tags: [lsp, discovery]

tags: [mcp, lsp, integration, quic]
