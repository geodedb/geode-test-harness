version: '1.0'
name: Vector Index Negative Paths (dim/metric/dropped/malformed/k)
description: >
  Plan 2, Task 7 — negative-path coverage for vector index DDL and KNN.
  `vector_hnsw_comprehensive.yml` / `vector_operations_basic.yml` are
  happy-path only. The deprecated `specs/legacy/vector_operations_comprehensive.yml`
  test 11 ("vector_function_error_handling") asserted that a dimension-
  mismatched vector_l2/vector_cosine call returns exit_code 1 with "error"
  in the output — that assertion does NOT hold on the current binary (see
  PROBE FINDINGS). This spec replaces that stale assertion with the real,
  verified behavior and adds the additionally-required index/metric/KNN
  negative paths.


  ## PROBE FINDINGS (2026-07-10, scratch server, ../geode/zig-out/bin/geode, port 4474)


  1. WRONG-DIMENSION INSERT — probed as silently ACCEPTED (status_class
     00000); FIXED by GAP-0918. Inserting a 3-component vectorf32 value into
     a property (`emb`) that already holds 4-component vectors under an HNSW
     index now returns `status_class":"22000"` with "Vector dimension does
     not match the indexed property's established dimension" — a clean
     rejection. The bad-dimension vector never reaches the store, closing
     the mixed-dimension data-integrity risk. Asserted as the verified
     rejection below (`p7_wrong_dimension_insert_limitation_pin`, converted
     from its original silent-accept limitation-pin to a positive).

  2. INVALID METRIC NAME — probed as silently ACCEPTED (index created with
     a bogus metric); FIXED by GAP-0918. `CREATE INDEX ... USING HNSW WITH
     (metric = 'banana', ...)` now returns `status_class":"42704"` with
     "Unknown vector distance metric (supported: l2, euclidean, cosine,
     dot_product, inner_product)". The metric is validated at DDL time and
     the bad index is never registered, so it does NOT appear in
     `SHOW INDEXES`. Asserted as the verified rejection below
     (`p7_invalid_metric_create_limitation_pin`, converted from its original
     silent-accept limitation-pin to a positive).

  3. KNN AFTER DROPPING THE INDEX STILL WORKS — DOCUMENTED FALLBACK, NOT A
     BUG. The KNN query pattern used throughout this codebase
     (`MATCH (n) RETURN n.id, vector_cosine(n.emb, $q) AS dist ORDER BY
     dist ... LIMIT k`) is a plain function-scored full graph scan; the
     HNSW index is an optimizer aid only, never a hard dependency for
     query correctness. Dropping the index and re-running the identical
     KNN query still returns exit 0 with correct results (full scan
     fallback). This is asserted as genuine, working behavior.

  4. MALFORMED VECTOR LITERAL (non-numeric component) — probed as silently
     swallowed to NULL (status_class 00000); FIXED by GAP-0918.
     `vectorf32("[1.0, 'x', 2.0]")` (and `CREATE (n {emb: vectorf32(...)})`
     with the same malformed literal) now both return `status_class":"58000"`
     with "TypeMismatch" — a clean error instead of silent data loss. The
     malformed RETURN raises the error; the malformed CREATE fails the write
     (the node is never created). Asserted as the verified rejection below
     (`p7_malformed_vector_literal_limitation_pin`, converted from its
     original silent-NULL limitation-pin to a positive).

  5. `LIMIT 0` (k=0) is genuine, correct behavior: an empty result set,
     `status_class":"00000"`. `LIMIT -1` (k=-1) is a genuine GQL syntax
     error: `status_class":"42000"` with
     `"expected token 'integer_lit', got 'minus'"`. Both are asserted as
     real (not guessed) below. Note: the `query` CLI subcommand always
     exits 0 regardless of GQL-level success/failure — errors are
     signalled exclusively via the JSON body's `status_class`/`error`
     fields, never via process exit code. Every negative assertion below
     therefore checks `stdout_contains`/`stdout_not_contains` on those
     JSON fields rather than `exit_code`.

  Also note: `vector_cosine` returns cosine SIMILARITY (1 = identical,
  0 = orthogonal), matching `docs/TYPE_QUICK_REFERENCE.md` and
  `docs/API_REFERENCE_GENERATED.md` ("Cosine similarity (NULL if
  zero-norm)") — NOT cosine distance as an inline comment in
  `vector_hnsw_comprehensive.yml` claims. This spec's setup/KNN assertions
  are written against the verified similarity semantics (ORDER BY ... DESC
  for nearest-first).

  CANARY: REQ=REQ-VECTOR-INDEX-ERRORS-001; FEATURE="VectorIndex"; ASPECT=NegativePaths; STATUS=TESTED; TEST=geodetestlab/specs/vector_index_errors.yml; OWNER=qa; UPDATED=2026-07-10
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 60000
    cleanup: true
    args:
    - --log-level
    - warn
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 120000
    tls_verify: false
    format: json
invariants:
- type: server_running
tags:
- vector
- index
- negative-paths
tests:

  # ------------------------------------------------------------ pre-clean --
- name: p7_teardown_canary
  description: Idempotent pre-teardown so reruns start clean (CANARY)
  args: [query, '-']
  stdin: |
    MATCH (n:P7Vec) DETACH DELETE n
    MATCH (n:P7BadMetric) DETACH DELETE n
  expect:
    exit_code: 0
  tags: [vector, setup, canary]

  # --------------------------------------------------------------- setup --
- name: p7_setup_create_index
  description: "Positive setup: create a valid HNSW vector index, dim=4, cosine metric"
  args: [query, '-']
  stdin: >-
    CREATE INDEX IF NOT EXISTS p7_vec_idx
    ON P7Vec (emb)
    USING HNSW
    WITH (metric = 'cosine', ef_construction = 200, M = 16)
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
  tags: [vector, setup, positive, ddl]

- name: p7_setup_show_index
  description: SHOW INDEXES contains the newly-created p7_vec_idx
  args: [query, '-']
  stdin: SHOW INDEXES
  expect:
    exit_code: 0
    stdout_contains:
    - p7_vec_idx
  tags: [vector, setup, positive, show]

- name: p7_setup_insert_valid_vectors
  description: "Positive setup: insert 3 valid dim=4 vectors under the indexed label"
  args: [query, '-']
  stdin: |
    CREATE (n1:P7Vec {id: 1, emb: vectorf32('[1.0, 0.0, 0.0, 0.0]')})
    CREATE (n2:P7Vec {id: 2, emb: vectorf32('[0.0, 1.0, 0.0, 0.0]')})
    CREATE (n3:P7Vec {id: 3, emb: vectorf32('[0.9, 0.1, 0.0, 0.0]')})
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
  tags: [vector, setup, positive, insert]

- name: p7_setup_knn_works
  description: >
    Positive: one KNN query works end-to-end. vector_cosine returns
    similarity (1=identical); ORDER BY dist DESC ranks nearest first, so
    id=1 (exact match against the query vector) must be first.
  args: [query, '-']
  stdin: >-
    MATCH (n:P7Vec)
    RETURN n.id AS id, vector_cosine(n.emb, vectorf32('[1.0, 0.0, 0.0, 0.0]')) AS dist
    ORDER BY dist DESC
    LIMIT 3
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    - '"id":1'
  tags: [vector, setup, positive, knn]

  # ------------------------------------------------- wrong-dimension insert --
- name: p7_wrong_dimension_insert_limitation_pin
  description: >
    KEY negative (per task brief) — insert a dim=3 vector into the dim=4,
    HNSW-indexed `emb` property. Geode now REJECTS this with a dimension-
    mismatch error (status_class 22000, "Vector dimension does not match
    the indexed property's established dimension"): the store refuses to
    hold mixed-dimension vectors under one index/property and surfaces the
    data-integrity violation to the caller instead of silently accepting it
    (GAP-0918). Converted from a limitation-pin that asserted the old
    silent-accept (00000) behavior to a positive assertion of the verified
    rejection.
  args: [query, '-']
  stdin: >-
    CREATE (n4:P7Vec {id: 4, emb: vectorf32('[1.0, 2.0, 3.0]')})
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"22000"'
    - Vector dimension does not match
    stdout_not_contains:
    - '"status_class":"00000"'
  tags: [vector, dimension, positive]

- name: p7_wrong_dimension_stored_value_evidence
  description: >
    Evidence for the rejection above (GAP-0918): the dim=3 vector was
    REJECTED at HNSW index-insert time, so the mismatched vector did NOT
    make it into the store — a same-space cosine comparison against n.emb
    returns NULL (dist:null), proving n.emb holds no dim=3 vector. This is
    the exact contract GAP-0918 established: refuse to hold a
    mixed-dimension vector under the index, surface the 22000 error, and
    store no bad vector. NOTE (scoped honesty): GAP-0918 rejects the
    VECTOR, not the whole node — the `CREATE` errors (22000) yet the node
    id=4 row is still committed with `emb` left unset (null). Full
    statement-level rollback of the node on an index-constraint violation
    is a SEPARATE, deeper atomicity concern: geode's node create touches
    both an in-memory map and the durable engine, and the per-statement
    engine-txn abort only unwinds the engine layer, so the in-memory row
    survives. That two-layer rollback gap is distinct from GAP-0930 (which
    made a bad property *expression* — e.g. malformed WKT — abort the
    CREATE with no node at all, since expression eval now runs before any
    write). This evidence test therefore asserts the real, verified
    behavior: the readback succeeds (00000), the row exists, and n.emb is
    null (dist:null) — i.e. the bad vector was not stored.
  args: [query, '-']
  stdin: >-
    MATCH (n:P7Vec {id: 4})
    RETURN vector_cosine(n.emb, vectorf32('[1.0, 0.0, 0.0, 0.0]')) AS dist
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    - '"dist":null'
    stdout_not_contains:
    - '"dist":0'
    - '"dist":1'
  tags: [vector, dimension, positive, evidence]

  # ----------------------------------------------------------- invalid metric --
- name: p7_invalid_metric_create_limitation_pin
  description: >
    Negative — CREATE INDEX with an invalid distance metric name
    ('banana'). Geode now REJECTS this at DDL time with
    status_class 42704, "Unknown vector distance metric (supported: l2,
    euclidean, cosine, dot_product, inner_product)" — the metric value is
    validated and the bad index is never registered (GAP-0918). Converted
    from a limitation-pin that asserted the old silent-accept (00000)
    behavior to a positive assertion of the verified rejection.
  args: [query, '-']
  stdin: >-
    CREATE INDEX IF NOT EXISTS p7_bad_metric_idx
    ON P7BadMetric (emb)
    USING HNSW
    WITH (metric = 'banana', ef_construction = 200, M = 16)
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"42704"'
    - Unknown vector distance metric
    stdout_not_contains:
    - '"status_class":"00000"'
  tags: [vector, metric, positive, ddl]

- name: p7_invalid_metric_show_index_evidence
  description: >
    Evidence -- SHOW INDEXES confirms p7_bad_metric_idx was NOT registered
    (the invalid-metric CREATE was rejected, GAP-0918); the report shows only
    the valid p7_vec_idx and its auto id index (auto_idx_P7Vec_id) remain.
    Converted from a limitation-pin that asserted the bogus index appeared.
  args: [query, '-']
  stdin: SHOW INDEXES
  expect:
    exit_code: 0
    stdout_not_contains:
    - p7_bad_metric_idx
  tags: [vector, metric, positive, evidence]

  # ------------------------------------------------------- knn-on-dropped-index --
- name: p7_knn_dropped_index_drop
  description: Drop the p7_vec_idx HNSW index before re-running the KNN pattern.
  args: [query, '-']
  stdin: DROP INDEX p7_vec_idx
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
  tags: [vector, dropped-index]

- name: p7_knn_dropped_index_show_absent
  description: p7_vec_idx no longer appears in SHOW INDEXES after DROP.
  args: [query, '-']
  stdin: SHOW INDEXES
  expect:
    exit_code: 0
    stdout_not_contains:
    - p7_vec_idx
  tags: [vector, dropped-index]

- name: p7_knn_on_dropped_index
  description: >
    Negative-shaped case, verified real outcome = documented fallback
    scan, not an error. The KNN query pattern
    (MATCH ... ORDER BY vector_cosine(...) LIMIT k) is a function-scored
    full graph scan; the HNSW index was only ever an optimizer aid, never
    a hard dependency. Re-running the identical KNN query after DROP
    INDEX still succeeds with correct results -- this is asserted as
    genuine working behavior (not a bug).
  args: [query, '-']
  stdin: >-
    MATCH (n:P7Vec)
    RETURN n.id AS id, vector_cosine(n.emb, vectorf32('[1.0, 0.0, 0.0, 0.0]')) AS dist
    ORDER BY dist DESC
    LIMIT 10
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    - '"id":1'
  tags: [vector, dropped-index, fallback-scan, documented]

  # ------------------------------------------------ malformed vector literal --
- name: p7_malformed_vector_literal_limitation_pin
  description: >
    Negative -- vectorf32 literal with a non-numeric component
    ([1.0, 'x', 2.0]). Geode now raises a clean error -- status_class 58000,
    "TypeMismatch" -- instead of silently swallowing the malformed input to
    NULL (GAP-0918). Converted from a limitation-pin that asserted the old
    silent-NULL behavior (00000 / "v":null) to a positive assertion of the
    verified error.
  args: [query, '-']
  stdin: |
    RETURN vectorf32("[1.0, 'x', 2.0]") AS v
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"58000"'
    - TypeMismatch
    stdout_not_contains:
    - '"status_class":"00000"'
  tags: [vector, malformed-literal, positive]

- name: p7_malformed_vector_literal_create_evidence
  description: >
    Evidence in a storage context: CREATE-ing a node with the same
    malformed vector literal as a property value now FAILS the write with
    status_class 58000, "TypeMismatch" (GAP-0918) -- the node is not
    created, rather than silently storing NULL. Converted from a
    limitation-pin that asserted the old silent-accept (00000) behavior to
    a positive assertion of the verified error.
  args: [query, '-']
  stdin: |
    CREATE (n5:P7Vec {id: 5, emb: vectorf32("[1.0, 'x', 2.0]")})
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"58000"'
    - TypeMismatch
    stdout_not_contains:
    - '"status_class":"00000"'
  tags: [vector, malformed-literal, positive, evidence]

- name: p7_malformed_vector_literal_stored_value_evidence
  description: >
    Confirms n5 was never created (the malformed-literal CREATE was
    rejected, GAP-0918) -- a lookup by id=5 returns an empty result set
    rather than a node with a silently-NULL emb. Cascade of
    p7_malformed_vector_literal_create_evidence: the CREATE now returns
    error status_class 58000, so no node id=5 is committed.
  args: [query, '-']
  stdin: >-
    MATCH (n:P7Vec {id: 5}) RETURN n.emb AS emb
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    - '"rows":[]'
  tags: [vector, malformed-literal, positive, evidence]

  # ------------------------------------------------------------------ k=0/k=-1 --
- name: p7_knn_k_zero
  description: >
    Negative-shaped case, verified real outcome = empty result set (not
    an error). LIMIT 0 (k=0) on a KNN-pattern query returns an empty rows
    array with status_class 00000 -- this is correct, expected SQL/GQL
    LIMIT semantics, not a bug.
  args: [query, '-']
  stdin: >-
    MATCH (n:P7Vec)
    RETURN n.id AS id, vector_cosine(n.emb, vectorf32('[1.0, 0.0, 0.0, 0.0]')) AS dist
    ORDER BY dist DESC
    LIMIT 0
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    - '"rows":[]'
  tags: [vector, knn, k-boundary]

- name: p7_knn_k_negative
  description: >
    Negative -- LIMIT -1 (k=-1) on a KNN-pattern query. Verified real
    outcome: genuine GQL syntax error, status_class 42000, "expected
    token 'integer_lit', got 'minus'". Real failure signal is the
    status_class/error JSON fields (the query CLI subcommand always
    exits 0); asserted here via stdout_contains/stdout_not_contains, not
    exit_code.
  args: [query, '-']
  stdin: >-
    MATCH (n:P7Vec)
    RETURN n.id AS id, vector_cosine(n.emb, vectorf32('[1.0, 0.0, 0.0, 0.0]')) AS dist
    ORDER BY dist DESC
    LIMIT -1
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"42000"'
    - error
    stdout_not_contains:
    - '"status_class":"00000"'
  tags: [vector, knn, k-boundary, negative]

  # ---------------------------------------------------------------- cleanup --
- name: p7_teardown
  description: Remove all P7 test nodes (CANARY idempotent teardown)
  args: [query, '-']
  stdin: |
    MATCH (n:P7Vec) DETACH DELETE n
    MATCH (n:P7BadMetric) DETACH DELETE n
  expect:
    exit_code: 0
  tags: [vector, cleanup, canary]
