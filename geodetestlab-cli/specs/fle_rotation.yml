version: '1.0'
name: Geode FLE (Field-Level Encryption) Rotation & Management Suite
description: Validation of FLE key rotation, policy management, and interaction with CLI commands
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    startup_timeout_ms: 30000
    args:
    - --log-level
    - info
    - --enable-fle
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
      GEODE_MASTER_KEY: fle-rotation-test-master-key-32b!
  client:
    timeout_ms: 15000
    format: json
skip_isolation: true
tests:
- name: fle-show-rotation-initial
  description: Verify initial rotation status for default tenant
  args:
  - fle
  - show-rotation
  - default
  expect:
    exit_code: 0
    stdout_contains:
    - FLE Key Rotation Status
    - default
  tags:
  - fle
  - rotation
  - status
- name: fle-show-policy-person
  description: Show encryption policy for Person schema
  args:
  - fle
  - show-policy
  - Person
  expect:
    exit_code: 0
    stdout_contains:
    - FLE Policy Status
    - Person
  tags:
  - fle
  - policy
- name: fle-grant-plaintext
  description: Grant plaintext access to a role
  args:
  - fle
  - grant-plaintext
  - Person
  - ssn
  - pii_reader
  expect:
    exit_code: 1
    stderr_contains: Failed to grant privilege
  tags:
  - fle
  - policy
  - grant
- name: fle-rotate-fek-cli
  description: Execute FEK rotation via CLI
  args:
  - fle
  - rotate-key
  - default
  - fek
  - Person
  - ssn
  # SONNY-6386/6387: geode fle rotate-key is refused as unsupported (no key is rotated).
  expect:
    exit_code: 1
    stderr_contains: [not supported in this release (SONNY-6387)]
  tags:
  - fle
  - rotation
  - fek
- name: fle-rotate-sk-cli
  description: Execute Schema Key rewrap via CLI
  args:
  - fle
  - rotate-key
  - default
  - sk
  - Person
  # SONNY-6386/6387: geode fle rotate-key is refused as unsupported (no key is rotated).
  expect:
    exit_code: 1
    stderr_contains: [not supported in this release (SONNY-6387)]
  tags:
  - fle
  - rotation
  - sk
- name: fle-rotate-trk-cli
  description: Execute Tenant Root Key rewrap via CLI
  args:
  - fle
  - rotate-key
  - default
  - trk
  # SONNY-6386/6387: geode fle rotate-key is refused as unsupported (no key is rotated).
  expect:
    exit_code: 1
    stderr_contains: [not supported in this release (SONNY-6387)]
  tags:
  - fle
  - rotation
  - trk
tags:
- fle
- security
- encryption
- rotation
