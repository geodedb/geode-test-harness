version: "1.0"
name: "Geode FLE (Field-Level Encryption) Rotation & Management Suite"
description: "Validation of FLE key rotation, policy management, and interaction with CLI commands"

cli:
  binary: "./zig-out/bin/geode"
  server:
    enabled: true
    startup_timeout_ms: 30000
    args: ["--log-level", "info", "--enable-fle"]
  client:
    timeout_ms: 15000
    format: "json"

# Skip isolation suffix for FLE tests - the CALL geode.fle.configureField
# must match the exact label names used in CREATE statements
skip_isolation: true

tests:
  # ===============================
  # ROTATION STATUS
  # ===============================

  - name: "fle-show-rotation-initial"
    description: "Verify initial rotation status for default tenant"
    args: ["fle", "show-rotation", "default"]
    expect:
      # FLE commands are now implemented (GAP-0004 resolved January 2026)
      # Returns status showing no encrypted schemas registered initially
      exit_code: 0
      stdout_contains: ["FLE Key Rotation Status", "default"]
    tags: ["fle", "rotation", "status"]

  # ===============================
  # POLICY MANAGEMENT
  # ===============================

  - name: "fle-show-policy-person"
    description: "Show encryption policy for Person schema"
    args: ["fle", "show-policy", "Person"]
    expect:
      # FLE commands are now implemented (GAP-0004 resolved January 2026)
      # Returns status showing schema not found in FLE catalog
      exit_code: 0
      stdout_contains: ["FLE Policy Status", "Person"]
    tags: ["fle", "policy"]

  - name: "fle-grant-plaintext"
    description: "Grant plaintext access to a role"
    args: ["fle", "grant-plaintext", "Person", "ssn", "pii_reader"]
    expect:
      exit_code: 1
      stderr_contains: "Failed to grant privilege"
      # Or "FLE commands require globalCatalog" depending on where it fails first (init of catalog)
    tags: ["fle", "policy", "grant"]

  # ===============================
  # KEY ROTATION EXECUTION
  # ===============================

  - name: "fle-rotate-fek-cli"
    description: "Execute FEK rotation via CLI"
    # This one DOES NOT use globalCatalog, it uses KeyManager directly (mock/offline)
    # So this SHOULD SUCCEED based on my implementation in fle_cli.zig!
    args: ["fle", "rotate-key", "default", "fek", "Person", "ssn"]
    expect:
      exit_code: 0
      stdout_contains: "Rotated FEK for default.Person.ssn"
    tags: ["fle", "rotation", "fek"]

  - name: "fle-rotate-sk-cli"
    description: "Execute Schema Key rewrap via CLI"
    args: ["fle", "rotate-key", "default", "sk", "Person"]
    expect:
      exit_code: 0
      stdout_contains: "Rewrapped SK for default.Person"
    tags: ["fle", "rotation", "sk"]

  - name: "fle-rotate-trk-cli"
    description: "Execute Tenant Root Key rewrap via CLI"
    args: ["fle", "rotate-key", "default", "trk"]
    expect:
      exit_code: 0
      stdout_contains: "Rewrapped TRK for default"
    tags: ["fle", "rotation", "trk"]

tags: ["fle", "security", "encryption", "rotation"]
