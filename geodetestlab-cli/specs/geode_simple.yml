version: "1.0"
name: "Simple Geode Tests"
description: "Simple tests that don't require server management"

cli:
  binary: "./zig-out/bin/geode"

tests:
  - name: "help-command"
    description: "Test basic help command"
    args: ["--help"]
    expect:
      exit_code: 0
      stdout_contains: ["geode", "Usage"]

  - name: "query-help"
    description: "Test query help command"
    args: ["query", "--help"]
    expect:
      exit_code: 0
      stdout_contains: ["query", "Execute"]

  - name: "shell-help"
    description: "Test shell help command"
    args: ["shell", "--help"]
    expect:
      exit_code: 0
      stdout_contains: ["shell", "Interactive"]

  - name: "serve-help"
    description: "Test serve help command"
    args: ["serve", "--help"]
    expect:
      exit_code: 0
      stdout_contains: ["serve", "Start"]
