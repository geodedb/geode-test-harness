name: recursive_and_cte
description: Test recursive patterns and hierarchical data traversal (supported features)
binary: geode
timeout: 30
cli:
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 30000
    cleanup: true
    args:
    - --log-level
    - error
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 30000
    tls_verify: false
    format: json
setup:
- args:
  - query
  - '-'
  stdin: "CREATE (p1:PersonRec {id: 1, name: 'Great-Grandparent', birth_year: 1900})\nCREATE (p2:PersonRec {id: 2, name: 'Grandparent-1', birth_year: 1925})\nCREATE (p3:PersonRec {id: 3, name: 'Grandparent-2', birth_year: 1928})\nCREATE (p4:PersonRec {id: 4, name: 'Parent-1', birth_year: 1950})\nCREATE (p5:PersonRec {id: 5, name: 'Parent-2', birth_year: 1952})\nCREATE (p6:PersonRec {id: 6, name: 'Parent-3', birth_year: 1955})\nCREATE (p7:PersonRec {id: 7, name: 'Child-1', birth_year: 1975})\nCREATE (p8:PersonRec {id: 8, name: 'Child-2', birth_year: 1978})\nCREATE (p9:PersonRec {id: 9, name: 'Child-3', birth_year: 1980})\nCREATE (p10:PersonRec {id: 10, name: 'Grandchild-1', birth_year: 2000})\nCREATE (p11:PersonRec {id: 11, name: 'Grandchild-2', birth_year: 2002})\nCREATE (p12:PersonRec {id: 12, name: 'Grandchild-3', birth_year: 2005})\n"
  expect:
    exit_code: 0
- args:
  - query
  - 'MATCH (p1:PersonRec {id: 1}), (p2:PersonRec {id: 2}) CREATE (p1)-[:PARENT_OF_REC]->(p2)'
  expect:
    exit_code: 0
- args:
  - query
  - 'MATCH (p1:PersonRec {id: 1}), (p3:PersonRec {id: 3}) CREATE (p1)-[:PARENT_OF_REC]->(p3)'
  expect:
    exit_code: 0
- args:
  - query
  - 'MATCH (p2:PersonRec {id: 2}), (p4:PersonRec {id: 4}) CREATE (p2)-[:PARENT_OF_REC]->(p4)'
  expect:
    exit_code: 0
- args:
  - query
  - 'MATCH (p2:PersonRec {id: 2}), (p5:PersonRec {id: 5}) CREATE (p2)-[:PARENT_OF_REC]->(p5)'
  expect:
    exit_code: 0
- args:
  - query
  - 'MATCH (p3:PersonRec {id: 3}), (p6:PersonRec {id: 6}) CREATE (p3)-[:PARENT_OF_REC]->(p6)'
  expect:
    exit_code: 0
- args:
  - query
  - 'MATCH (p4:PersonRec {id: 4}), (p7:PersonRec {id: 7}) CREATE (p4)-[:PARENT_OF_REC]->(p7)'
  expect:
    exit_code: 0
- args:
  - query
  - 'MATCH (p4:PersonRec {id: 4}), (p8:PersonRec {id: 8}) CREATE (p4)-[:PARENT_OF_REC]->(p8)'
  expect:
    exit_code: 0
- args:
  - query
  - 'MATCH (p5:PersonRec {id: 5}), (p9:PersonRec {id: 9}) CREATE (p5)-[:PARENT_OF_REC]->(p9)'
  expect:
    exit_code: 0
- args:
  - query
  - 'MATCH (p7:PersonRec {id: 7}), (p10:PersonRec {id: 10}) CREATE (p7)-[:PARENT_OF_REC]->(p10)'
  expect:
    exit_code: 0
- args:
  - query
  - 'MATCH (p7:PersonRec {id: 7}), (p11:PersonRec {id: 11}) CREATE (p7)-[:PARENT_OF_REC]->(p11)'
  expect:
    exit_code: 0
- args:
  - query
  - 'MATCH (p8:PersonRec {id: 8}), (p12:PersonRec {id: 12}) CREATE (p8)-[:PARENT_OF_REC]->(p12)'
  expect:
    exit_code: 0
- args:
  - query
  - '-'
  stdin: "CREATE (l1:LocRec {id: 1, name: 'World', type: 'Planet', population: 8000000000})\nCREATE (l2:LocRec {id: 2, name: 'North America', type: 'Continent', population: 579000000})\nCREATE (l3:LocRec {id: 3, name: 'USA', type: 'Country', population: 331000000})\nCREATE (l4:LocRec {id: 4, name: 'California', type: 'State', population: 39500000})\nCREATE (l5:LocRec {id: 5, name: 'Los Angeles', type: 'City', population: 3900000})\nCREATE (l6:LocRec {id: 6, name: 'Texas', type: 'State', population: 29100000})\nCREATE (l7:LocRec {id: 7, name: 'Houston', type: 'City', population: 2300000})\nCREATE (l8:LocRec {id: 8, name: 'Europe', type: 'Continent', population: 746000000})\nCREATE (l9:LocRec {id: 9, name: 'Germany', type: 'Country', population: 83000000})\nCREATE (l10:LocRec {id: 10, name: 'Berlin', type: 'City', population: 3600000})\n"
  expect:
    exit_code: 0
- args:
  - query
  - 'MATCH (l1:LocRec {id: 1}), (l2:LocRec {id: 2}) CREATE (l2)-[:LOCATED_IN_REC]->(l1)'
  expect:
    exit_code: 0
- args:
  - query
  - 'MATCH (l1:LocRec {id: 1}), (l8:LocRec {id: 8}) CREATE (l8)-[:LOCATED_IN_REC]->(l1)'
  expect:
    exit_code: 0
- args:
  - query
  - 'MATCH (l2:LocRec {id: 2}), (l3:LocRec {id: 3}) CREATE (l3)-[:LOCATED_IN_REC]->(l2)'
  expect:
    exit_code: 0
- args:
  - query
  - 'MATCH (l3:LocRec {id: 3}), (l4:LocRec {id: 4}) CREATE (l4)-[:LOCATED_IN_REC]->(l3)'
  expect:
    exit_code: 0
- args:
  - query
  - 'MATCH (l3:LocRec {id: 3}), (l6:LocRec {id: 6}) CREATE (l6)-[:LOCATED_IN_REC]->(l3)'
  expect:
    exit_code: 0
- args:
  - query
  - 'MATCH (l4:LocRec {id: 4}), (l5:LocRec {id: 5}) CREATE (l5)-[:LOCATED_IN_REC]->(l4)'
  expect:
    exit_code: 0
- args:
  - query
  - 'MATCH (l6:LocRec {id: 6}), (l7:LocRec {id: 7}) CREATE (l7)-[:LOCATED_IN_REC]->(l6)'
  expect:
    exit_code: 0
- args:
  - query
  - 'MATCH (l8:LocRec {id: 8}), (l9:LocRec {id: 9}) CREATE (l9)-[:LOCATED_IN_REC]->(l8)'
  expect:
    exit_code: 0
- args:
  - query
  - 'MATCH (l9:LocRec {id: 9}), (l10:LocRec {id: 10}) CREATE (l10)-[:LOCATED_IN_REC]->(l9)'
  expect:
    exit_code: 0
- args:
  - query
  - '-'
  stdin: "CREATE (c1:CatRec {id: 1, name: 'Products', level: 0})\nCREATE (c2:CatRec {id: 2, name: 'Electronics', level: 1})\nCREATE (c3:CatRec {id: 3, name: 'Clothing', level: 1})\nCREATE (c4:CatRec {id: 4, name: 'Computers', level: 2})\nCREATE (c5:CatRec {id: 5, name: 'Phones', level: 2})\nCREATE (c6:CatRec {id: 6, name: 'Laptops', level: 3})\nCREATE (c7:CatRec {id: 7, name: 'Desktops', level: 3})\n"
  expect:
    exit_code: 0
- args:
  - query
  - 'MATCH (c1:CatRec {id: 1}), (c2:CatRec {id: 2}) CREATE (c2)-[:SUBCATEGORY_OF_REC]->(c1)'
  expect:
    exit_code: 0
- args:
  - query
  - 'MATCH (c1:CatRec {id: 1}), (c3:CatRec {id: 3}) CREATE (c3)-[:SUBCATEGORY_OF_REC]->(c1)'
  expect:
    exit_code: 0
- args:
  - query
  - 'MATCH (c2:CatRec {id: 2}), (c4:CatRec {id: 4}) CREATE (c4)-[:SUBCATEGORY_OF_REC]->(c2)'
  expect:
    exit_code: 0
- args:
  - query
  - 'MATCH (c2:CatRec {id: 2}), (c5:CatRec {id: 5}) CREATE (c5)-[:SUBCATEGORY_OF_REC]->(c2)'
  expect:
    exit_code: 0
- args:
  - query
  - 'MATCH (c4:CatRec {id: 4}), (c6:CatRec {id: 6}) CREATE (c6)-[:SUBCATEGORY_OF_REC]->(c4)'
  expect:
    exit_code: 0
- args:
  - query
  - 'MATCH (c4:CatRec {id: 4}), (c7:CatRec {id: 7}) CREATE (c7)-[:SUBCATEGORY_OF_REC]->(c4)'
  expect:
    exit_code: 0
tests:
- name: all-descendants-count
  description: Count all descendants
  args:
  - query
  - '-'
  stdin: "MATCH (ancestor:PersonRec {name: 'Great-Grandparent'})-[:PARENT_OF_REC*]->(descendant:PersonRec) RETURN count(DISTINCT descendant) AS total_descendants"
  expect:
    exit_code: 0
    stdout_contains:
    - '11'
  tags:
  - recursive
  - count
- name: parent-children-relationship
  description: Parent children relationship
  args:
  - query
  - '-'
  stdin: "MATCH (parent:PersonRec {name: 'Grandparent-1'})-[:PARENT_OF_REC]->(child:PersonRec) RETURN parent.name, child.name ORDER BY child.name"
  expect:
    exit_code: 0
    stdout_contains:
    - Grandparent-1
    - Parent-1
    - Parent-2
  tags:
  - hierarchy
- name: state-populations
  description: State populations
  args:
  - query
  - '-'
  stdin: "MATCH (state:LocRec {type: 'State'}) RETURN state.name, state.population ORDER BY state.population DESC"
  expect:
    exit_code: 0
    stdout_contains:
    - California
    - Texas
  tags:
  - location
  - population
- name: city-populations
  description: City populations
  args:
  - query
  - '-'
  stdin: "MATCH (city:LocRec {type: 'City'}) RETURN city.name, city.population ORDER BY city.population DESC"
  expect:
    exit_code: 0
    stdout_contains:
    - Los Angeles
    - Berlin
    - Houston
  tags:
  - location
  - population
- name: country-populations
  description: Country populations
  args:
  - query
  - '-'
  stdin: "MATCH (country:LocRec {type: 'Country'}) RETURN country.name, country.population ORDER BY country.population DESC"
  expect:
    exit_code: 0
    stdout_contains:
    - USA
    - Germany
  tags:
  - location
- name: top-level-categories
  description: Top level categories
  args:
  - query
  - '-'
  stdin: MATCH (c:CatRec) WHERE c.level = 0 RETURN c.name
  expect:
    exit_code: 0
    stdout_contains:
    - Products
  tags:
  - category
- name: level-one-categories
  description: Level one categories
  args:
  - query
  - '-'
  stdin: MATCH (c:CatRec) WHERE c.level = 1 RETURN c.name ORDER BY c.name
  expect:
    exit_code: 0
    stdout_contains:
    - Clothing
    - Electronics
  tags:
  - category
- name: level-two-categories
  description: Level two categories
  args:
  - query
  - '-'
  stdin: MATCH (c:CatRec) WHERE c.level = 2 RETURN c.name ORDER BY c.name
  expect:
    exit_code: 0
    stdout_contains:
    - Computers
    - Phones
  tags:
  - category
- name: deepest-categories
  description: Deepest categories (level 3)
  args:
  - query
  - '-'
  stdin: MATCH (c:CatRec) WHERE c.level = 3 RETURN c.name ORDER BY c.name
  expect:
    exit_code: 0
    stdout_contains:
    - Desktops
    - Laptops
  tags:
  - category
- name: older-generation
  description: Older generation (birth year < 1930)
  args:
  - query
  - '-'
  stdin: MATCH (p:PersonRec) WHERE p.birth_year < 1930 RETURN p.name ORDER BY p.birth_year
  expect:
    exit_code: 0
    stdout_contains:
    - Great-Grandparent
    - Grandparent-1
    - Grandparent-2
  tags:
  - person
  - filter
- name: younger-generation
  description: Younger generation (birth year >= 2000)
  args:
  - query
  - '-'
  stdin: MATCH (p:PersonRec) WHERE p.birth_year >= 2000 RETURN p.name ORDER BY p.birth_year
  expect:
    exit_code: 0
    stdout_contains:
    - Grandchild-1
    - Grandchild-2
    - Grandchild-3
  tags:
  - person
  - filter
- name: city-in-california
  description: City in California
  args:
  - query
  - '-'
  stdin: "MATCH (city:LocRec)-[:LOCATED_IN_REC]->(state:LocRec {name: 'California'}) RETURN city.name"
  expect:
    exit_code: 0
    stdout_contains:
    - Los Angeles
  tags:
  - location
