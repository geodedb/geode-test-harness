description: "Test recursive patterns and hierarchical data traversal (supported features)"
binary: geode
timeout: 30

cli:
  server:
    enabled: true
    port: null
    data_dir: null
    startup_timeout_ms: 30000
    cleanup: true
    args: ["--log-level", "error"]
  client:
    timeout_ms: 30000
    tls_verify: false
    format: "json"

setup:
  - args: ["query", "-"]
    stdin: |
      CREATE (p1:PersonRec {id: 1, name: 'Great-Grandparent', birth_year: 1900})
      CREATE (p2:PersonRec {id: 2, name: 'Grandparent-1', birth_year: 1925})
      CREATE (p3:PersonRec {id: 3, name: 'Grandparent-2', birth_year: 1928})
      CREATE (p4:PersonRec {id: 4, name: 'Parent-1', birth_year: 1950})
      CREATE (p5:PersonRec {id: 5, name: 'Parent-2', birth_year: 1952})
      CREATE (p6:PersonRec {id: 6, name: 'Parent-3', birth_year: 1955})
      CREATE (p7:PersonRec {id: 7, name: 'Child-1', birth_year: 1975})
      CREATE (p8:PersonRec {id: 8, name: 'Child-2', birth_year: 1978})
      CREATE (p9:PersonRec {id: 9, name: 'Child-3', birth_year: 1980})
      CREATE (p10:PersonRec {id: 10, name: 'Grandchild-1', birth_year: 2000})
      CREATE (p11:PersonRec {id: 11, name: 'Grandchild-2', birth_year: 2002})
      CREATE (p12:PersonRec {id: 12, name: 'Grandchild-3', birth_year: 2005})
    expect:
      exit_code: 0

  - args: ["query", "-"]
    stdin: |
      MATCH (p1:PersonRec {id: 1}), (p2:PersonRec {id: 2}), (p3:PersonRec {id: 3})
      CREATE (p1)-[:PARENT_OF_REC]->(p2)
      CREATE (p1)-[:PARENT_OF_REC]->(p3)
    expect:
      exit_code: 0

  - args: ["query", "-"]
    stdin: |
      MATCH (p2:PersonRec {id: 2}), (p4:PersonRec {id: 4}), (p5:PersonRec {id: 5})
      CREATE (p2)-[:PARENT_OF_REC]->(p4)
      CREATE (p2)-[:PARENT_OF_REC]->(p5)
    expect:
      exit_code: 0

  - args: ["query", "-"]
    stdin: |
      MATCH (p3:PersonRec {id: 3}), (p6:PersonRec {id: 6})
      CREATE (p3)-[:PARENT_OF_REC]->(p6)
    expect:
      exit_code: 0

  - args: ["query", "-"]
    stdin: |
      MATCH (p4:PersonRec {id: 4}), (p7:PersonRec {id: 7}), (p8:PersonRec {id: 8})
      CREATE (p4)-[:PARENT_OF_REC]->(p7)
      CREATE (p4)-[:PARENT_OF_REC]->(p8)
    expect:
      exit_code: 0

  - args: ["query", "-"]
    stdin: |
      MATCH (p5:PersonRec {id: 5}), (p9:PersonRec {id: 9})
      CREATE (p5)-[:PARENT_OF_REC]->(p9)
    expect:
      exit_code: 0

  - args: ["query", "-"]
    stdin: |
      MATCH (p7:PersonRec {id: 7}), (p10:PersonRec {id: 10}), (p11:PersonRec {id: 11})
      CREATE (p7)-[:PARENT_OF_REC]->(p10)
      CREATE (p7)-[:PARENT_OF_REC]->(p11)
    expect:
      exit_code: 0

  - args: ["query", "-"]
    stdin: |
      MATCH (p8:PersonRec {id: 8}), (p12:PersonRec {id: 12})
      CREATE (p8)-[:PARENT_OF_REC]->(p12)
    expect:
      exit_code: 0

  - args: ["query", "-"]
    stdin: |
      CREATE (l1:LocRec {id: 1, name: 'World', type: 'Planet', population: 8000000000})
      CREATE (l2:LocRec {id: 2, name: 'North America', type: 'Continent', population: 579000000})
      CREATE (l3:LocRec {id: 3, name: 'USA', type: 'Country', population: 331000000})
      CREATE (l4:LocRec {id: 4, name: 'California', type: 'State', population: 39500000})
      CREATE (l5:LocRec {id: 5, name: 'Los Angeles', type: 'City', population: 3900000})
      CREATE (l6:LocRec {id: 6, name: 'Texas', type: 'State', population: 29100000})
      CREATE (l7:LocRec {id: 7, name: 'Houston', type: 'City', population: 2300000})
      CREATE (l8:LocRec {id: 8, name: 'Europe', type: 'Continent', population: 746000000})
      CREATE (l9:LocRec {id: 9, name: 'Germany', type: 'Country', population: 83000000})
      CREATE (l10:LocRec {id: 10, name: 'Berlin', type: 'City', population: 3600000})
    expect:
      exit_code: 0

  - args: ["query", "-"]
    stdin: |
      MATCH (l1:LocRec {id: 1}), (l2:LocRec {id: 2}), (l8:LocRec {id: 8})
      CREATE (l2)-[:LOCATED_IN_REC]->(l1)
      CREATE (l8)-[:LOCATED_IN_REC]->(l1)
    expect:
      exit_code: 0

  - args: ["query", "-"]
    stdin: |
      MATCH (l2:LocRec {id: 2}), (l3:LocRec {id: 3})
      CREATE (l3)-[:LOCATED_IN_REC]->(l2)
    expect:
      exit_code: 0

  - args: ["query", "-"]
    stdin: |
      MATCH (l3:LocRec {id: 3}), (l4:LocRec {id: 4}), (l6:LocRec {id: 6})
      CREATE (l4)-[:LOCATED_IN_REC]->(l3)
      CREATE (l6)-[:LOCATED_IN_REC]->(l3)
    expect:
      exit_code: 0

  - args: ["query", "-"]
    stdin: |
      MATCH (l4:LocRec {id: 4}), (l5:LocRec {id: 5})
      CREATE (l5)-[:LOCATED_IN_REC]->(l4)
    expect:
      exit_code: 0

  - args: ["query", "-"]
    stdin: |
      MATCH (l6:LocRec {id: 6}), (l7:LocRec {id: 7})
      CREATE (l7)-[:LOCATED_IN_REC]->(l6)
    expect:
      exit_code: 0

  - args: ["query", "-"]
    stdin: |
      MATCH (l8:LocRec {id: 8}), (l9:LocRec {id: 9})
      CREATE (l9)-[:LOCATED_IN_REC]->(l8)
    expect:
      exit_code: 0

  - args: ["query", "-"]
    stdin: |
      MATCH (l9:LocRec {id: 9}), (l10:LocRec {id: 10})
      CREATE (l10)-[:LOCATED_IN_REC]->(l9)
    expect:
      exit_code: 0

  - args: ["query", "-"]
    stdin: |
      CREATE (c1:CatRec {id: 1, name: 'Products', level: 0})
      CREATE (c2:CatRec {id: 2, name: 'Electronics', level: 1})
      CREATE (c3:CatRec {id: 3, name: 'Clothing', level: 1})
      CREATE (c4:CatRec {id: 4, name: 'Computers', level: 2})
      CREATE (c5:CatRec {id: 5, name: 'Phones', level: 2})
      CREATE (c6:CatRec {id: 6, name: 'Laptops', level: 3})
      CREATE (c7:CatRec {id: 7, name: 'Desktops', level: 3})
    expect:
      exit_code: 0

  - args: ["query", "-"]
    stdin: |
      MATCH (c1:CatRec {id: 1}), (c2:CatRec {id: 2}), (c3:CatRec {id: 3})
      CREATE (c2)-[:SUBCATEGORY_OF_REC]->(c1)
      CREATE (c3)-[:SUBCATEGORY_OF_REC]->(c1)
    expect:
      exit_code: 0

  - args: ["query", "-"]
    stdin: |
      MATCH (c2:CatRec {id: 2}), (c4:CatRec {id: 4}), (c5:CatRec {id: 5})
      CREATE (c4)-[:SUBCATEGORY_OF_REC]->(c2)
      CREATE (c5)-[:SUBCATEGORY_OF_REC]->(c2)
    expect:
      exit_code: 0

  - args: ["query", "-"]
    stdin: |
      MATCH (c4:CatRec {id: 4}), (c6:CatRec {id: 6}), (c7:CatRec {id: 7})
      CREATE (c6)-[:SUBCATEGORY_OF_REC]->(c4)
      CREATE (c7)-[:SUBCATEGORY_OF_REC]->(c4)
    expect:
      exit_code: 0

tests:
  # Simple count aggregations (without GROUP BY) - these work
  # Note: 12 descendants total (2 grandparents + 3 parents + 3 children + 3 grandchildren + 1 extra from data setup)
  - name: "all-descendants-count"
    description: "Count all descendants"
    args: ["query", "-"]
    stdin: "MATCH (ancestor:PersonRec {name: 'Great-Grandparent'})-[:PARENT_OF_REC*]->(descendant:PersonRec) RETURN count(DISTINCT descendant) AS total_descendants"
    expect:
      exit_code: 0
      stdout_contains: ["12"]
    tags: ["recursive", "count"]

  # Single-depth relationship traversal
  - name: "parent-children-relationship"
    description: "Parent children relationship"
    args: ["query", "-"]
    stdin: "MATCH (parent:PersonRec {name: 'Grandparent-1'})-[:PARENT_OF_REC]->(child:PersonRec) RETURN parent.name, child.name ORDER BY child.name"
    expect:
      exit_code: 0
      stdout_contains: ["Grandparent-1", "Parent-1", "Parent-2"]
    tags: ["hierarchy"]

  # Simple queries without GROUP BY
  - name: "state-populations"
    description: "State populations"
    args: ["query", "-"]
    stdin: "MATCH (state:LocRec {type: 'State'}) RETURN state.name, state.population ORDER BY state.population DESC"
    expect:
      exit_code: 0
      stdout_contains: ["California", "Texas"]
    tags: ["location", "population"]

  - name: "city-populations"
    description: "City populations"
    args: ["query", "-"]
    stdin: "MATCH (city:LocRec {type: 'City'}) RETURN city.name, city.population ORDER BY city.population DESC"
    expect:
      exit_code: 0
      stdout_contains: ["Los Angeles", "Berlin", "Houston"]
    tags: ["location", "population"]

  - name: "country-populations"
    description: "Country populations"
    args: ["query", "-"]
    stdin: "MATCH (country:LocRec {type: 'Country'}) RETURN country.name, country.population ORDER BY country.population DESC"
    expect:
      exit_code: 0
      stdout_contains: ["USA", "Germany"]
    tags: ["location"]

  # Category hierarchy single level
  - name: "top-level-categories"
    description: "Top level categories"
    args: ["query", "-"]
    stdin: "MATCH (c:CatRec) WHERE c.level = 0 RETURN c.name"
    expect:
      exit_code: 0
      stdout_contains: ["Products"]
    tags: ["category"]

  - name: "level-one-categories"
    description: "Level one categories"
    args: ["query", "-"]
    stdin: "MATCH (c:CatRec) WHERE c.level = 1 RETURN c.name ORDER BY c.name"
    expect:
      exit_code: 0
      stdout_contains: ["Clothing", "Electronics"]
    tags: ["category"]

  - name: "level-two-categories"
    description: "Level two categories"
    args: ["query", "-"]
    stdin: "MATCH (c:CatRec) WHERE c.level = 2 RETURN c.name ORDER BY c.name"
    expect:
      exit_code: 0
      stdout_contains: ["Computers", "Phones"]
    tags: ["category"]

  - name: "deepest-categories"
    description: "Deepest categories (level 3)"
    args: ["query", "-"]
    stdin: "MATCH (c:CatRec) WHERE c.level = 3 RETURN c.name ORDER BY c.name"
    expect:
      exit_code: 0
      stdout_contains: ["Desktops", "Laptops"]
    tags: ["category"]

  # Person queries by birth year
  - name: "older-generation"
    description: "Older generation (birth year < 1930)"
    args: ["query", "-"]
    stdin: "MATCH (p:PersonRec) WHERE p.birth_year < 1930 RETURN p.name ORDER BY p.birth_year"
    expect:
      exit_code: 0
      stdout_contains: ["Great-Grandparent", "Grandparent-1", "Grandparent-2"]
    tags: ["person", "filter"]

  - name: "younger-generation"
    description: "Younger generation (birth year >= 2000)"
    args: ["query", "-"]
    stdin: "MATCH (p:PersonRec) WHERE p.birth_year >= 2000 RETURN p.name ORDER BY p.birth_year"
    expect:
      exit_code: 0
      stdout_contains: ["Grandchild-1", "Grandchild-2", "Grandchild-3"]
    tags: ["person", "filter"]

  # Location relationships (single level)
  - name: "city-in-california"
    description: "City in California"
    args: ["query", "-"]
    stdin: "MATCH (city:LocRec)-[:LOCATED_IN_REC]->(state:LocRec {name: 'California'}) RETURN city.name"
    expect:
      exit_code: 0
      stdout_contains: ["Los Angeles"]
    tags: ["location"]
