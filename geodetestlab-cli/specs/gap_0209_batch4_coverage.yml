name: gap_0209_batch4_coverage
description: 'GAP-0209 Batch 4: Test coverage for IMPL markers converted to TESTED'
version: '1.0'
mode: server
tests:
- name: list-properties-node
  description: Test properties() function on nodes
  command: "./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -\n"
  stdin: "CREATE (n:TestProps {a: 1, b: 'hello', c: true}) RETURN properties(n) AS props\n"
  expected_output:
    contains:
    - props
  expected_exit_code: 0
- name: list-properties-keys
  description: Test keys() function on map
  command: "./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -\n"
  stdin: "RETURN keys({name: 'Alice', age: 30}) AS k\n"
  expected_output:
    contains:
    - k
  expected_exit_code: 0
- name: multi-graph-create
  description: Test multi-graph CREATE GRAPH
  command: "./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -\n"
  stdin: "CREATE GRAPH test_graph_batch4\n"
  expected_output:
    contains_any:
    - created
    - Graph
    - test_graph
  expected_exit_code: 0
- name: show-tables
  description: Test SHOW TABLES statement
  command: "./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -\n"
  stdin: "SHOW TABLES\n"
  expected_output:
    contains_any:
    - table
    - Table
    - name
  expected_exit_code: 0
- name: show-constraints
  description: Test SHOW CONSTRAINTS statement
  command: "./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -\n"
  stdin: "SHOW CONSTRAINTS\n"
  expected_output:
    contains_any:
    - constraint
    - Constraint
    - name
  expected_exit_code: 0
- name: list-slice-basic
  description: Test list slicing
  command: "./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -\n"
  stdin: "RETURN [1, 2, 3, 4, 5][1..3] AS sliced\n"
  expected_output:
    contains:
    - sliced
  expected_exit_code: 0
- name: list-slice-from-start
  description: Test list slicing from start
  command: "./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -\n"
  stdin: "RETURN [1, 2, 3, 4, 5][..2] AS first_two\n"
  expected_output:
    contains:
    - first_two
  expected_exit_code: 0
- name: list-head-function
  description: Test head() function
  command: "./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -\n"
  stdin: "RETURN head([1, 2, 3]) AS first\n"
  expected_output:
    contains:
    - first
  expected_exit_code: 0
- name: list-tail-function
  description: Test tail() function
  command: "./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -\n"
  stdin: "RETURN tail([1, 2, 3]) AS rest\n"
  expected_output:
    contains:
    - rest
  expected_exit_code: 0
- name: list-size-function
  description: Test size() function
  command: "./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -\n"
  stdin: "RETURN size([1, 2, 3, 4, 5]) AS len\n"
  expected_output:
    contains:
    - len
  expected_exit_code: 0
- name: in-operator
  description: Test IN operator
  command: "./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -\n"
  stdin: "RETURN 2 IN [1, 2, 3] AS is_in\n"
  expected_output:
    contains:
    - is_in
  expected_exit_code: 0
- name: not-in-operator
  description: Test NOT IN operator
  command: "./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -\n"
  stdin: "RETURN 5 NOT IN [1, 2, 3] AS not_in\n"
  expected_output:
    contains:
    - not_in
  expected_exit_code: 0
- name: count-subquery
  description: Test COUNT subquery
  command: "./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -\n"
  stdin: "MATCH (n:Person) RETURN n.name, COUNT { MATCH (n)-[:KNOWS]->() } AS friend_count\n"
  expected_output:
    contains:
    - friend_count
  expected_exit_code: 0
- name: arithmetic-abs
  description: Test abs() function
  command: "./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -\n"
  stdin: "RETURN abs(-5) AS absolute\n"
  expected_output:
    contains:
    - absolute
  expected_exit_code: 0
- name: arithmetic-ceil-floor
  description: Test ceil() and floor() functions
  command: "./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -\n"
  stdin: "RETURN ceil(4.3) AS c, floor(4.7) AS f\n"
  expected_output:
    contains:
    - c
    - f
  expected_exit_code: 0
- name: three-valued-null-and
  description: Test three-valued logic with NULL AND
  command: "./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -\n"
  stdin: "RETURN null AND true AS result\n"
  expected_output:
    contains:
    - result
  expected_exit_code: 0
- name: three-valued-null-or
  description: Test three-valued logic with NULL OR
  command: "./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -\n"
  stdin: "RETURN null OR true AS result\n"
  expected_output:
    contains:
    - result
  expected_exit_code: 0
- name: variable-length-path
  description: Test variable length path pattern
  command: "./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -\n"
  stdin: "MATCH p = (a)-[*1..3]-(b) RETURN count(p) AS path_count\n"
  expected_output:
    contains:
    - path_count
  expected_exit_code: 0
# removed: chained-with-agg used Cypher list-iteration not in ISO GQL
- name: with-where-post-filter
  description: Test WITH clause with WHERE post-filter
  command: "./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -\n"
  stdin: "MATCH (n:Person) WITH n, n.age AS age WHERE age > 25 RETURN n.name\n"
  expected_output:
    contains:
    - name
  expected_exit_code: 0
- name: quic-auth-help
  description: Test QUIC authentication help
  command: "./zig-out/bin/geode query --help\n"
  expected_output:
    contains:
    - query
  expected_exit_code: 0
