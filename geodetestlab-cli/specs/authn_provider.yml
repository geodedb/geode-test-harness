version: '1.0'
name: Unified Authentication Provider Tests
description: "Integration tests for Geode's unified authentication provider chain.\n\nThis spec covers:\n- Authentication provider chain (mTLS > API Key > Session > Password)\n- Session token creation and validation\n- Session token rotation\n- Session idle timeout\n- Session invalidation\n- Anonymous path access\n- MFA-required path enforcement\n- Step-up authentication\n"
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 60000
    cleanup: true
    args:
    - --log-level
    - info
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 30000
    format: json
invariants:
- type: server_running
tests:
- name: authn-setup-create-user
  description: Create test user for authentication tests
  args:
  - user
  - create
  - authn_user
  - authn@test.com
  - --password
  - Authn_Test_Passphrase_2026!
  expect:
    exit_code: 0
  tags:
  - authn
  - setup
- name: authn-setup-create-admin
  description: Create admin user for authentication tests
  args:
  - user
  - create
  - authn_admin
  - authn_admin@test.com
  - --password
  - Authn_Admin_Passphrase_2026!
  expect:
    exit_code: 0
  tags:
  - authn
  - setup
- name: authn-session-login
  description: Login to create a session before logout test
  args:
  - auth
  - login
  - --user
  - authn_admin
  - --password
  - Authn_Admin_Passphrase_2026!
  expect:
    exit_code: 0
  tags:
  - authn
  - session
  - login
- name: authn-session-logout
  description: Logout invalidates session
  args:
  - logout
  expect:
    exit_code: 0
    stderr_contains:
    - logged out
  tags:
  - authn
  - session
  - logout
- name: authn-session-invalid-after-logout
  description: Session should be invalid after logout
  args:
  - session
  - validate
  expect:
    exit_code: 1
    stderr_contains:
    - invalid
    - expired
  tags:
  - authn
  - session
  - invalid
- name: authn-session-invalidate-all
  description: Invalidate all user sessions
  args:
  - session
  - invalidate-all
  - --user
  - authn_user
  expect:
    exit_code: 0
    stderr_contains:
    - invalidated
  tags:
  - authn
  - session
  - invalidate-all
- name: authn-anonymous-configure
  description: Configure anonymous access for health endpoint
  args:
  - authn
  - config
  - --allow-anonymous-path
  - /health
  expect:
    exit_code: 0
    stderr_contains:
    - anonymous
    - allowed
  tags:
  - authn
  - anonymous
  - config
- name: authn-anonymous-access-allowed
  description: Anonymous access should work for configured paths
  args:
  - authn
  - test-access
  - --path
  - /health
  expect:
    exit_code: 0
    stderr_contains:
    - anonymous
    - allowed
  tags:
  - authn
  - anonymous
  - access
- name: authn-mfa-configure-path
  description: Configure MFA requirement for admin paths
  args:
  - authn
  - config
  - --require-mfa-path
  - /admin/*
  expect:
    exit_code: 0
    stderr_contains:
    - mfa
    - required
  tags:
  - authn
  - mfa
  - config
- name: authn-mfa-access-without-mfa
  description: Access to MFA-required path without MFA should trigger requirement
  args:
  - authn
  - test-access
  - --path
  - /admin/settings
  - --session-only
  expect:
    exit_code: 0
    stderr_contains:
    - requires_mfa
    - 'true'
  tags:
  - authn
  - mfa
  - required
- name: authn-mfa-access-with-mfa
  description: Access to MFA-required path with MFA verified should succeed
  args:
  - authn
  - test-access
  - --path
  - /admin/settings
  - --mfa-verified
  expect:
    exit_code: 0
    stderr_contains:
    - requires_mfa
    - 'false'
    - elevated
  tags:
  - authn
  - mfa
  - verified
- name: authn-stepup-mark-elevated
  description: Mark session as elevated after MFA
  args:
  - authn
  - stepup-mark
  expect:
    exit_code: 0
    stderr_contains:
    - elevated
    - expires
  tags:
  - authn
  - stepup
  - elevate
- name: authn-cleanup-logout
  description: Logout all sessions
  args:
  - logout
  - --all
  expect:
    exit_code: 0
  tags:
  - authn
  - cleanup
- name: authn-cleanup-revoke-keys
  description: Revoke all API keys
  args:
  - apikey
  - revoke-all
  - --user
  - authn_admin
  - --yes
  expect:
    exit_code: 0
  tags:
  - authn
  - cleanup
- name: authn-cleanup-delete-user
  description: Delete test user
  args:
  - user
  - delete
  - authn_user
  - --yes
  expect:
    exit_code: 0
  tags:
  - authn
  - cleanup
- name: authn-cleanup-delete-admin
  description: Delete admin user
  args:
  - user
  - delete
  - authn_admin
  - --yes
  expect:
    exit_code: 0
  tags:
  - authn
  - cleanup
tags:
- authn
- security
- authentication
- session
- provider-chain
