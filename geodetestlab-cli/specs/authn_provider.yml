version: '1.0'
name: Unified Authentication Provider Tests
description: "Integration tests for Geode's unified authentication provider chain.\n\nThis spec covers:\n- Authentication provider chain (mTLS > API Key > Session > Password)\n- Session token creation and validation\n- Session token rotation\n- Session idle timeout\n- Session invalidation\n- Anonymous path access\n- MFA-required path enforcement\n- Step-up authentication\n"
single_node_only: true  # Session/MFA state is per-node; cross-node session propagation is a future enhancement

cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 60000
    cleanup: true
    args:
    - --log-level
    - info
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 30000
    format: json
invariants:
- type: server_running
tests:
- name: authn-setup-create-user
  description: Create test user for authentication tests
  args:
  - user
  - create
  - authn_user
  - authn@test.com
  - --password
  - Authn Test Passphrase 2026 Test Passphrase Value
  expect:
    exit_code: 0
  tags:
  - authn
  - setup
- name: authn-session-login
  description: Login with default admin user (created by server at startup)
  args:
  - auth
  - login
  - --user
  - geode
  - --password
  - ${env:GEODE_ADMIN_PASSWORD}
  expect:
    exit_code: 0
  tags:
  - authn
  - session
  - login
- name: authn-session-logout
  description: Logout invalidates session
  args:
  - logout
  # SONNY-6554/6560: the server keeps no sessions or per-path rules; these CLI commands are refused (docs/USER_AUTH.md, Saved sessions).
  expect:
    exit_code: 0
    stderr_contains: [saved session file]
  tags:
  - authn
  - session
  - logout
- name: authn-session-invalid-after-logout
  description: Session should be invalid after logout
  args:
  - session
  - validate
  # SONNY-6554/6560: the server keeps no sessions or per-path rules; these CLI commands are refused (docs/USER_AUTH.md, Saved sessions).
  expect:
    exit_code: 1
    stderr_contains: [not supported by this server, session token validation]
  tags:
  - authn
  - session
  - invalid
- name: authn-session-invalidate-all
  description: Invalidate all user sessions
  args:
  - session
  - invalidate-all
  - --user
  - authn_user
  # SONNY-6554/6560: the server keeps no sessions or per-path rules; these CLI commands are refused (docs/USER_AUTH.md, Saved sessions).
  expect:
    exit_code: 1
    stderr_contains: [not supported by this server, nothing was invalidated]
  tags:
  - authn
  - session
  - invalidate-all
- name: authn-anonymous-configure
  description: Configure anonymous access for health endpoint
  args:
  - authn
  - config
  - --allow-anonymous-path
  - /health
  # SONNY-6554/6560: the server keeps no sessions or per-path rules; these CLI commands are refused (docs/USER_AUTH.md, Saved sessions).
  expect:
    exit_code: 1
    stderr_contains: [not supported by this server, nothing was configured]
  tags:
  - authn
  - anonymous
  - config
- name: authn-anonymous-access-allowed
  description: Anonymous access should work for configured paths
  args:
  - authn
  - test-access
  - --path
  - /health
  # SONNY-6554/6560: the server keeps no sessions or per-path rules; these CLI commands are refused (docs/USER_AUTH.md, Saved sessions).
  expect:
    exit_code: 1
    stderr_contains: [not supported by this server, per-path access rules]
  tags:
  - authn
  - anonymous
  - access
- name: authn-mfa-configure-path
  description: Configure MFA requirement for admin paths
  args:
  - authn
  - config
  - --require-mfa-path
  - /admin/*
  # SONNY-6554/6560: the server keeps no sessions or per-path rules; these CLI commands are refused (docs/USER_AUTH.md, Saved sessions).
  expect:
    exit_code: 1
    stderr_contains: [not supported by this server, nothing was configured]
  tags:
  - authn
  - mfa
  - config
- name: authn-mfa-access-without-mfa
  description: Access to MFA-required path without MFA should trigger requirement
  args:
  - authn
  - test-access
  - --path
  - /admin/settings
  - --session-only
  # SONNY-6554/6560: the server keeps no sessions or per-path rules; these CLI commands are refused (docs/USER_AUTH.md, Saved sessions).
  expect:
    exit_code: 1
    stderr_contains: [not supported by this server, per-path access rules]
  tags:
  - authn
  - mfa
  - required
- name: authn-mfa-access-with-mfa
  description: Access to MFA-required path with MFA verified should succeed
  args:
  - authn
  - test-access
  - --path
  - /admin/settings
  - --mfa-verified
  # SONNY-6554/6560: the server keeps no sessions or per-path rules; these CLI commands are refused (docs/USER_AUTH.md, Saved sessions).
  expect:
    exit_code: 1
    stderr_contains: [not supported by this server, per-path access rules]
  tags:
  - authn
  - mfa
  - verified
- name: authn-stepup-mark-elevated
  description: Mark session as elevated after MFA
  args:
  - authn
  - stepup-mark
  # SONNY-6554/6560: the server keeps no sessions or per-path rules; these CLI commands are refused (docs/USER_AUTH.md, Saved sessions).
  expect:
    exit_code: 1
    stderr_contains: [not supported by this server, nothing was elevated]
  tags:
  - authn
  - stepup
  - elevate
- name: authn-cleanup-logout
  description: Logout all sessions
  args:
  - logout
  - --all
  # SONNY-6554/6560: the server keeps no sessions or per-path rules; these CLI commands are refused (docs/USER_AUTH.md, Saved sessions).
  expect:
    exit_code: 2
    stderr_contains: [unknown option '--all']
  tags:
  - authn
  - cleanup
- name: authn-cleanup-revoke-keys
  description: Revoke all API keys for test user
  args:
  - apikey
  - revoke-all
  - --user
  - authn_user
  - --yes
  # SONNY-6291/6554: API keys are not implemented on the server (docs/USER_AUTH.md).
  expect:
    exit_code: 1
    stdout_contains: [0A000, API keys are not supported by the server]
  tags:
  - authn
  - cleanup
- name: authn-cleanup-delete-user
  description: Delete test user
  args:
  - user
  - delete
  - authn_user
  - --yes
  expect:
    exit_code: 0
  tags:
  - authn
  - cleanup
- name: authn-cleanup-delete-admin
  description: Verify default admin user still exists (not deleted)
  args:
  - user
  - list
  expect:
    exit_code: 0
  tags:
  - authn
  - cleanup
tags:
- authn
- security
- authentication
- session
- provider-chain
