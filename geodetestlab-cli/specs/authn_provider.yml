# Unified Authentication Provider Integration Tests
# Tests the authentication provider chain and session token rotation
#
# CANARY: REQ=REQ-AUTH-UNIFIED-TEST; FEATURE="Unified Authentication Testing"; ASPECT=Security; STATUS=TESTED; TEST=geodetestlab/specs/authn_provider.yml; OWNER=security; UPDATED=2026-01-29

version: "1.0"
name: "Unified Authentication Provider Tests"
description: |
  Integration tests for Geode's unified authentication provider chain.

  This spec covers:
  - Authentication provider chain (mTLS > API Key > Session > Password)
  - Session token creation and validation
  - Session token rotation
  - Session idle timeout
  - Session invalidation
  - Anonymous path access
  - MFA-required path enforcement
  - Step-up authentication

cli:
  binary: "./zig-out/bin/geode"
  server:
    enabled: true
    port: null
    data_dir: null
    startup_timeout_ms: 60000
    cleanup: true
    args: ["--log-level", "info"]
  client:
    timeout_ms: 30000
    format: "json"

invariants:
  - type: "server_running"

tests:
  # =============================================================================
  # SECTION 1: SETUP
  # =============================================================================

  - name: "authn-setup-create-user"
    description: "Create test user for authentication tests"
    args: ["user", "create", "authn_user", "authn@test.com", "--password", "Authn_Test_Passphrase_2026!"]
    expect:
      exit_code: 0
    tags: ["authn", "setup"]

  - name: "authn-setup-create-admin"
    description: "Create admin user for authentication tests"
    args: ["user", "create", "authn_admin", "authn_admin@test.com", "--password", "Authn_Admin_Passphrase_2026!"]
    expect:
      exit_code: 0
    tags: ["authn", "setup"]

  # =============================================================================
  # SECTION 2: SESSION TOKEN CREATION
  # =============================================================================

  - name: "authn-session-create"
    description: "Create a session token via login"
    args: ["login", "--username", "authn_user", "--password", "Authn_Test_Passphrase_2026!"]
    expect:
      exit_code: 0
      stdout_contains: ["session", "token"]
      stdout_regex: ["[a-f0-9]{64}"]
    tags: ["authn", "session", "create"]

  - name: "authn-session-validate"
    description: "Validate an active session token"
    args: ["session", "validate"]
    expect:
      exit_code: 0
      stdout_contains: ["valid", "authn_user"]
    tags: ["authn", "session", "validate"]

  - name: "authn-session-info"
    description: "Get session information"
    args: ["session", "info"]
    expect:
      exit_code: 0
      stdout_contains: ["user", "created", "expires"]
    tags: ["authn", "session", "info"]

  # =============================================================================
  # SECTION 3: SESSION TOKEN ROTATION
  # =============================================================================

  - name: "authn-session-rotation-trigger"
    description: "Trigger session token rotation"
    args: ["session", "rotate"]
    expect:
      exit_code: 0
      stdout_contains: ["rotated", "new token"]
    tags: ["authn", "session", "rotation"]

  - name: "authn-session-rotation-grace-period"
    description: "Old token should work during grace period"
    args: ["session", "validate", "--token", "OLD_TOKEN_PLACEHOLDER"]
    skip: true  # Requires state from previous test
    expect:
      exit_code: 0
      stdout_contains: ["valid"]
    tags: ["authn", "session", "rotation", "grace"]

  # =============================================================================
  # SECTION 4: SESSION INVALIDATION
  # =============================================================================

  - name: "authn-session-logout"
    description: "Logout invalidates session"
    args: ["logout"]
    expect:
      exit_code: 0
      stdout_contains: ["logged out"]
    tags: ["authn", "session", "logout"]

  - name: "authn-session-invalid-after-logout"
    description: "Session should be invalid after logout"
    args: ["session", "validate"]
    expect:
      exit_code: 1
      stderr_contains: ["invalid", "expired"]
    tags: ["authn", "session", "invalid"]

  - name: "authn-session-invalidate-all"
    description: "Invalidate all user sessions"
    args: ["session", "invalidate-all", "--user", "authn_user"]
    expect:
      exit_code: 0
      stdout_contains: ["invalidated"]
    tags: ["authn", "session", "invalidate-all"]

  # =============================================================================
  # SECTION 5: AUTHENTICATION CHAIN
  # =============================================================================

  - name: "authn-chain-login-password"
    description: "Login with password creates session"
    args: ["login", "--username", "authn_admin", "--password", "Authn_Admin_Passphrase_2026!"]
    expect:
      exit_code: 0
      stdout_contains: ["session"]
    tags: ["authn", "chain", "password"]

  - name: "authn-chain-create-apikey"
    description: "Create API key for chain tests"
    args: ["apikey", "create", "--user", "authn_admin", "--name", "chain-test-key", "--scope", "*"]
    expect:
      exit_code: 0
      stdout_contains: ["gk1."]
    tags: ["authn", "chain", "apikey", "setup"]

  - name: "authn-chain-auth-priority"
    description: "API key should take priority over session when both provided"
    args: ["auth", "test-chain", "--apikey", "gk1.xxx.xxx", "--session", "abc123"]
    skip: true  # Requires test harness support
    expect:
      exit_code: 0
      stdout_contains: ["api_key", "authenticated"]
    tags: ["authn", "chain", "priority"]

  # =============================================================================
  # SECTION 6: ANONYMOUS ACCESS
  # =============================================================================

  - name: "authn-anonymous-configure"
    description: "Configure anonymous access for health endpoint"
    args: ["authn", "config", "--allow-anonymous-path", "/health"]
    expect:
      exit_code: 0
      stdout_contains: ["anonymous", "allowed"]
    tags: ["authn", "anonymous", "config"]

  - name: "authn-anonymous-access-allowed"
    description: "Anonymous access should work for configured paths"
    args: ["authn", "test-access", "--path", "/health"]
    skip: true  # Requires logout first
    expect:
      exit_code: 0
      stdout_contains: ["anonymous", "allowed"]
    tags: ["authn", "anonymous", "access"]

  - name: "authn-anonymous-access-denied"
    description: "Anonymous access should fail for protected paths"
    args: ["authn", "test-access", "--path", "/metrics"]
    skip: true  # Requires logout first
    expect:
      exit_code: 1
      stderr_contains: ["authentication", "required"]
    tags: ["authn", "anonymous", "denied"]

  # =============================================================================
  # SECTION 7: MFA-REQUIRED PATHS
  # =============================================================================

  - name: "authn-mfa-configure-path"
    description: "Configure MFA requirement for admin paths"
    args: ["authn", "config", "--require-mfa-path", "/admin/*"]
    expect:
      exit_code: 0
      stdout_contains: ["mfa", "required"]
    tags: ["authn", "mfa", "config"]

  - name: "authn-mfa-access-without-mfa"
    description: "Access to MFA-required path without MFA should trigger requirement"
    args: ["authn", "test-access", "--path", "/admin/settings", "--session-only"]
    skip: true  # Requires specific session state
    expect:
      exit_code: 0
      stdout_contains: ["requires_mfa", "true"]
    tags: ["authn", "mfa", "required"]

  - name: "authn-mfa-access-with-mfa"
    description: "Access to MFA-required path with MFA verified should succeed"
    args: ["authn", "test-access", "--path", "/admin/settings", "--mfa-verified"]
    skip: true  # Requires MFA verification
    expect:
      exit_code: 0
      stdout_contains: ["requires_mfa", "false", "elevated"]
    tags: ["authn", "mfa", "verified"]

  # =============================================================================
  # SECTION 8: STEP-UP AUTHENTICATION
  # =============================================================================

  - name: "authn-stepup-check-required"
    description: "Check if step-up is required for sensitive operation"
    args: ["authn", "stepup-check", "--action", "admin:delete-user"]
    skip: true  # Requires session
    expect:
      exit_code: 0
      stdout_contains: ["stepup", "required"]
    tags: ["authn", "stepup", "check"]

  - name: "authn-stepup-mark-elevated"
    description: "Mark session as elevated after MFA"
    args: ["authn", "stepup-mark"]
    skip: true  # Requires MFA completion
    expect:
      exit_code: 0
      stdout_contains: ["elevated", "expires"]
    tags: ["authn", "stepup", "elevate"]

  # =============================================================================
  # SECTION 9: SESSION IDLE TIMEOUT
  # =============================================================================

  - name: "authn-idle-check-active"
    description: "Active session should not be idle"
    args: ["session", "check-idle"]
    expect:
      exit_code: 0
      stdout_contains: ["active"]
    tags: ["authn", "idle", "active"]

  # Note: Testing actual idle timeout requires waiting, handled in unit tests

  # =============================================================================
  # SECTION 10: CLEANUP
  # =============================================================================

  - name: "authn-cleanup-logout"
    description: "Logout all sessions"
    args: ["logout", "--all"]
    expect:
      exit_code: 0
    tags: ["authn", "cleanup"]

  - name: "authn-cleanup-revoke-keys"
    description: "Revoke all API keys"
    args: ["apikey", "revoke-all", "--user", "authn_admin", "--yes"]
    expect:
      exit_code: 0
    tags: ["authn", "cleanup"]

  - name: "authn-cleanup-delete-user"
    description: "Delete test user"
    args: ["user", "delete", "authn_user", "--yes"]
    expect:
      exit_code: 0
    tags: ["authn", "cleanup"]

  - name: "authn-cleanup-delete-admin"
    description: "Delete admin user"
    args: ["user", "delete", "authn_admin", "--yes"]
    expect:
      exit_code: 0
    tags: ["authn", "cleanup"]

  # =============================================================================
  # SECTION 11: ERROR CASES
  # =============================================================================

  - name: "authn-error-invalid-credentials"
    description: "Invalid password should fail"
    args: ["login", "--username", "authn_user", "--password", "WrongPassword123!"]
    expect:
      exit_code: 1
      stderr_contains: ["invalid", "credentials"]
    tags: ["authn", "error", "credentials"]

  - name: "authn-error-nonexistent-user"
    description: "Non-existent user should fail"
    args: ["login", "--username", "nonexistent_user_12345", "--password", "AnyPassword123!"]
    expect:
      exit_code: 1
      stderr_contains: ["does not exist"]
    tags: ["authn", "error", "user"]

  - name: "authn-error-disabled-user"
    description: "Disabled user should fail"
    args: ["login", "--username", "disabled_user", "--password", "Password123!"]
    expect:
      exit_code: 1
      stderr_contains: ["disabled"]
    tags: ["authn", "error", "disabled"]

tags: ["authn", "security", "authentication", "session", "provider-chain"]
