version: '1.0'
name: Unified Authentication Provider Tests
description: 'Integration tests for Geode''s unified authentication provider chain.


  This spec covers:

  - Authentication provider chain (mTLS > API Key > Session > Password)

  - Session token creation and validation

  - Session token rotation

  - Session idle timeout

  - Session invalidation

  - Anonymous path access

  - MFA-required path enforcement

  - Step-up authentication

  '
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port: null
    data_dir: null
    startup_timeout_ms: 60000
    cleanup: true
    args:
    - --log-level
    - info
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 30000
    format: json
invariants:
- type: server_running
tests:
- name: authn-setup-create-user
  description: Create test user for authentication tests
  args:
  - user
  - create
  - authn_user
  - authn@test.com
  - --password
  - Authn_Test_Passphrase_2026!
  expect:
    exit_code: 0
  tags:
  - authn
  - setup
- name: authn-setup-create-admin
  description: Create admin user for authentication tests
  args:
  - user
  - create
  - authn_admin
  - authn_admin@test.com
  - --password
  - Authn_Admin_Passphrase_2026!
  expect:
    exit_code: 0
  tags:
  - authn
  - setup
- name: authn-session-create
  description: Create a session token via login
  args:
  - login
  - --user
  - authn_user
  - --password
  - Authn_Test_Passphrase_2026!
  skip: true
  skip_reason: "Session tests require interactive login (not supported in CLI test mode)"
  expect:
    exit_code: 0
    stderr_contains:
    - session
    - token
    stderr_regex:
    - '[a-f0-9]{64}'
  tags:
  - authn
  - session
  - create
- name: authn-session-validate
  description: Validate an active session token
  args:
  - session
  - validate
  skip: true
  skip_reason: "Session tests require interactive login (not supported in CLI test mode)"
  expect:
    exit_code: 0
    stderr_contains:
    - valid
    - authn_user
  tags:
  - authn
  - session
  - validate
- name: authn-session-info
  description: Get session information
  args:
  - session
  - info
  skip: true
  skip_reason: "Session tests require interactive login (not supported in CLI test mode)"
  expect:
    exit_code: 0
    stderr_contains:
    - user
    - created
    - expires
  tags:
  - authn
  - session
  - info
- name: authn-session-rotation-trigger
  description: Trigger session token rotation
  args:
  - session
  - rotate
  skip: true
  skip_reason: "Session tests require interactive login (not supported in CLI test mode)"
  expect:
    exit_code: 0
    stderr_contains:
    - rotated
    - new token
  tags:
  - authn
  - session
  - rotation
- name: authn-session-rotation-grace-period
  description: Old token should work during grace period
  args:
  - session
  - validate
  - --token
  - OLD_TOKEN_PLACEHOLDER
  skip: true
  expect:
    exit_code: 0
    stderr_contains:
    - valid
  tags:
  - authn
  - session
  - rotation
  - grace
- name: authn-session-logout
  description: Logout invalidates session
  args:
  - logout
  expect:
    exit_code: 0
    stderr_contains:
    - Logout
  tags:
  - authn
  - session
  - logout
- name: authn-session-invalid-after-logout
  description: Session should be invalid after logout
  args:
  - session
  - validate
  expect:
    exit_code: 1
    stderr_contains:
    - invalid
    - expired
  tags:
  - authn
  - session
  - invalid
- name: authn-session-invalidate-all
  description: Invalidate all user sessions
  args:
  - session
  - invalidate-all
  - --user
  - authn_user
  expect:
    exit_code: 0
    stderr_contains:
    - invalidated
  tags:
  - authn
  - session
  - invalidate-all
- name: authn-chain-login-password
  description: Login with password creates session
  args:
  - login
  - --user
  - authn_admin
  - --password
  - Authn_Admin_Passphrase_2026!
  skip: true
  skip_reason: "Test state pollution from shared API key names across runs"
  expect:
    exit_code: 0
    stderr_contains:
    - session
  tags:
  - authn
  - chain
  - password
- name: authn-chain-create-apikey
  description: Create API key for chain tests
  args:
  - apikey
  - create
  - --user
  - authn_admin
  - --name
  - chain-test-key
  - --scope
  - '*'
  skip: true
  skip_reason: "Test state pollution from shared API key names across runs"
  expect:
    exit_code: 0
    stderr_contains:
    - gk1.
  tags:
  - authn
  - chain
  - apikey
  - setup
- name: authn-chain-auth-priority
  description: API key should take priority over session when both provided
  args:
  - auth
  - test-chain
  - --apikey
  - gk1.xxx.xxx
  - --session
  - abc123
  skip: true
  expect:
    exit_code: 0
    stdout_contains:
    - api_key
    - authenticated
  tags:
  - authn
  - chain
  - priority
- name: authn-anonymous-configure
  description: Configure anonymous access for health endpoint
  args:
  - authn
  - config
  - --allow-anonymous-path
  - /health
  expect:
    exit_code: 0
    stderr_contains:
    - anonymous
    - allowed
  tags:
  - authn
  - anonymous
  - config
- name: authn-anonymous-access-allowed
  description: Anonymous access should work for configured paths
  args:
  - authn
  - test-access
  - --path
  - /health
  skip: true
  expect:
    exit_code: 0
    stderr_contains:
    - anonymous
    - allowed
  tags:
  - authn
  - anonymous
  - access
- name: authn-anonymous-access-denied
  description: Anonymous access should fail for protected paths
  args:
  - authn
  - test-access
  - --path
  - /metrics
  skip: true
  expect:
    exit_code: 1
    stderr_contains:
    - authentication
    - required
  tags:
  - authn
  - anonymous
  - denied
- name: authn-mfa-configure-path
  description: Configure MFA requirement for admin paths
  args:
  - authn
  - config
  - --require-mfa-path
  - /admin/*
  expect:
    exit_code: 0
    stderr_contains:
    - mfa
    - required
  tags:
  - authn
  - mfa
  - config
- name: authn-mfa-access-without-mfa
  description: Access to MFA-required path without MFA should trigger requirement
  args:
  - authn
  - test-access
  - --path
  - /admin/settings
  - --session-only
  skip: true
  expect:
    exit_code: 0
    stderr_contains:
    - requires_mfa
    - 'true'
  tags:
  - authn
  - mfa
  - required
- name: authn-mfa-access-with-mfa
  description: Access to MFA-required path with MFA verified should succeed
  args:
  - authn
  - test-access
  - --path
  - /admin/settings
  - --mfa-verified
  skip: true
  expect:
    exit_code: 0
    stderr_contains:
    - requires_mfa
    - 'false'
    - elevated
  tags:
  - authn
  - mfa
  - verified
- name: authn-stepup-check-required
  description: Check if step-up is required for sensitive operation
  args:
  - authn
  - stepup-check
  - --action
  - admin:delete-user
  skip: true
  expect:
    exit_code: 0
    stderr_contains:
    - stepup
    - required
  tags:
  - authn
  - stepup
  - check
- name: authn-stepup-mark-elevated
  description: Mark session as elevated after MFA
  args:
  - authn
  - stepup-mark
  skip: true
  expect:
    exit_code: 0
    stderr_contains:
    - elevated
    - expires
  tags:
  - authn
  - stepup
  - elevate
- name: authn-idle-check-active
  description: Active session should not be idle
  args:
  - session
  - check-idle
  skip: true
  skip_reason: "Session tests require interactive login (not supported in CLI test mode)"
  expect:
    exit_code: 0
    stderr_contains:
    - active
  tags:
  - authn
  - idle
  - active
- name: authn-cleanup-logout
  description: Logout all sessions
  args:
  - logout
  - --all
  expect:
    exit_code: 0
  tags:
  - authn
  - cleanup
- name: authn-cleanup-revoke-keys
  description: Revoke all API keys
  args:
  - apikey
  - revoke-all
  - --user
  - authn_admin
  - --yes
  expect:
    exit_code: 0
  tags:
  - authn
  - cleanup
- name: authn-cleanup-delete-user
  description: Delete test user
  args:
  - user
  - delete
  - authn_user
  - --yes
  expect:
    exit_code: 0
  tags:
  - authn
  - cleanup
- name: authn-cleanup-delete-admin
  description: Delete admin user
  args:
  - user
  - delete
  - authn_admin
  - --yes
  expect:
    exit_code: 0
  tags:
  - authn
  - cleanup
- name: authn-error-invalid-credentials
  description: Invalid password should fail
  args:
  - login
  - --user
  - authn_user
  - --password
  - WrongPassword123!
  skip: true
  skip_reason: "Error auth tests cause TLS handshake failures/server crashes"
  expect:
    exit_code: 1
    stderr_contains:
    - Invalid
  tags:
  - authn
  - error
  - credentials
- name: authn-error-nonexistent-user
  description: Non-existent user should fail
  args:
  - login
  - --user
  - nonexistent_user_12345
  - --password
  - AnyPassword123!
  skip: true
  skip_reason: "Error auth tests cause TLS handshake failures/server crashes"
  expect:
    exit_code: 1
    stderr_contains:
    - Failed
  tags:
  - authn
  - error
  - user
- name: authn-error-disabled-user
  description: Disabled user should fail
  args:
  - login
  - --user
  - disabled_user
  - --password
  - Password123!
  skip: true
  skip_reason: "Error auth tests cause TLS handshake failures/server crashes"
  expect:
    exit_code: 1
    stderr_contains:
    - Failed
  tags:
  - authn
  - error
  - disabled
tags:
- authn
- security
- authentication
- session
- provider-chain
