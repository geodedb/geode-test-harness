---
# Network Types Basic Tests
# Converted from legacy format
version: "1.0"
name: "Network Types Basic Tests"
description: "Testing IPv4, IPv6, CIDR, and MAC address types"

cli:
  binary: "./zig-out/bin/geode"
  server:
    enabled: true
    port: null
    data_dir: null
    startup_timeout_ms: 60000
    cleanup: true
    args: ["--log-level", "warn"]
    env: {}
  client:
    timeout_ms: 30000
    tls_verify: false
    format: "json"

tests:
  - name: ipv4-basic
    description: Test IPv4 address type
    args: ["query", "-"]
    stdin: "RETURN '192.168.1.1' AS ipv4_addr"
    expect:
      exit_code: 0
      stdout_contains: ["ipv4_addr"]
    tags: [network, ipv4]

  - name: ipv6-basic
    description: Test IPv6 address type
    args: ["query", "-"]
    stdin: "RETURN '::1' AS ipv6_addr"
    expect:
      exit_code: 0
      stdout_contains: ["ipv6_addr"]
    tags: [network, ipv6]

  - name: network-node-storage
    description: Test storing network addresses in nodes
    args: ["query", "-"]
    stdin: "CREATE (s:Server {name: 'web1', ip: '10.0.0.1'}) RETURN s.name AS server_name"
    expect:
      exit_code: 0
      stdout_contains: ["server_name"]
    tags: [network, storage]

  - name: mac-address-basic
    description: Test MAC address as string
    args: ["query", "-"]
    stdin: "RETURN '00:1a:2b:3c:4d:5e' AS mac_addr"
    expect:
      exit_code: 0
      stdout_contains: ["mac_addr"]
    tags: [network, mac]

  - name: cidr-notation-basic
    description: Test CIDR notation as string
    args: ["query", "-"]
    stdin: "RETURN '192.168.0.0/24' AS cidr_block"
    expect:
      exit_code: 0
      stdout_contains: ["cidr_block"]
    tags: [network, cidr]

tags: [network, types, basic]
