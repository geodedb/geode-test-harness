version: '1.0'
name: 'GAP-0327: Connection Pool Exhaustion'
description: |
  CANARY: REQ=REQ-TRANSPORT-POOL-EXHAUST-001; FEATURE="Connection Pool Exhaustion"; ASPECT=CleanErrorOnPoolFull; STATUS=TESTED; OWNER=transport; UPDATED=2026-05-21

  Validates that when the server's connection / stream pool is saturated,
  additional connection attempts return a clear error and do not hang.
  Also verifies that releasing one connection allows the next attempt to
  succeed.

  PARTIAL BLOCK NOTE (geode v0.5.19):
    The `geode serve` binary does not expose a `--max-connections` or
    `--pool-size` flag to set a small cap for deterministic testing.
    The `--idle-timeout` flag is available and set to a short value so
    connections drain quickly between phases.

    Strategy without a configurable pool cap:
      Phase 1  — Saturate via many concurrent long-running queries.
                 Each query holds a QUIC stream open for ~3 s.
      Phase 2  — While streams are open, attempt an additional query;
                 capture its fate (may queue, reject, or succeed depending
                 on server capacity).
      Phase 3  — After stream drain, verify the server returns to normal.
      Phase 4  — gRPC transport: same saturation test over the gRPC port.
      Phase 5  — Baseline: single query succeeds post-exhaustion.

    The tests assert:
      a. The server never crashes or hangs indefinitely (bounded response).
      b. Post-drain, new queries succeed.
      c. Any rejection carries an informative message (not a silent hang).

    Tests GAP-0327-HARD-001 and GAP-0327-HARD-002 (deterministic
    pool-cap + POOL_EXHAUSTED error) are marked `skip: true` pending
    a `--max-connections` server flag.

cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 30000
    cleanup: true
    args:
    - --log-level
    - info
    - --idle-timeout
    - '8000'
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 90000
    tls_verify: false
    format: json

invariants:
- type: server_running

tests:

# ---------------------------------------------------------------------------
# Phase 0: Baseline
# ---------------------------------------------------------------------------

- name: 'GAP-0327-BASE-001: baseline query before saturation'
  description: Confirm server is healthy before pool exhaustion test begins
  args:
  - query
  - RETURN 'gap0327-pre' AS status
  expect:
    exit_code: 0
    stdout_contains:
    - gap0327-pre
  tags:
  - gap-0327
  - quic
  - baseline

# ---------------------------------------------------------------------------
# Phase 1: Saturation — open N concurrent long-running streams
# ---------------------------------------------------------------------------

- name: 'GAP-0327-SAT-001: saturate with 16 concurrent streams (QUIC)'
  description: |
    Open 16 concurrent query streams, each holding a connection open for
    ~3 s (large query + count aggregation on many nodes).  Record how many
    succeeded vs were rejected/timed-out.  Assert: server stays alive and
    rejection count is bounded (server does not crash).
  type: bash
  command: |
    SERVER="${GEODE_SERVER_ADDRESS}"
    PW="${GEODE_ADMIN_PASSWORD:-GeodeTestPassword123!}"
    TMPDIR=$(mktemp -d)
    N=16

    # Pre-create nodes to make the query take a bit longer
    geode query --server "${SERVER}" ${GEODE_CLIENT_TLS} \
      -U geode -P "${PW}" \
      "MATCH (n:GAP0327Load) DETACH DELETE n" >/dev/null 2>&1 || true
    geode query --server "${SERVER}" ${GEODE_CLIENT_TLS} \
      -U geode -P "${PW}" \
      "CREATE (a:GAP0327Load {i:1}),(b:GAP0327Load {i:2}),(c:GAP0327Load {i:3}),
              (d:GAP0327Load {i:4}),(e:GAP0327Load {i:5})" >/dev/null 2>&1 || true

    for i in $(seq 1 $N); do
      (
        OUT=$(geode query --server "${SERVER}" ${GEODE_CLIENT_TLS} \
              -U geode -P "${PW}" --timeout 8 \
              "MATCH (n:GAP0327Load) WITH count(n) AS c RETURN c AS load_count" 2>&1)
        EC=$?
        echo "stream_$i ec=$EC" > "${TMPDIR}/${i}.r"
      ) &
    done
    wait

    OK=$(grep -l "ec=0" "${TMPDIR}"/*.r 2>/dev/null | wc -l)
    ERR=$(grep -l "ec=[^0]" "${TMPDIR}"/*.r 2>/dev/null | wc -l)
    rm -rf "${TMPDIR}"

    echo "sat_ok=$OK sat_err=$ERR total=$N"

    # Server health probe — must still be answering
    HEALTH=$(geode query --server "${SERVER}" ${GEODE_CLIENT_TLS} \
             -U geode -P "${PW}" --timeout 15 \
             "RETURN 'alive_post_sat' AS status" 2>&1)
    echo "$HEALTH" | grep -q "alive_post_sat" && echo "server_alive=true" || echo "server_alive=false"
    echo "$HEALTH" | grep -q "alive_post_sat"
  timeout_ms: 90000
  expect:
    exit_code: 0
    stdout_contains:
    - server_alive=true
  tags:
  - gap-0327
  - quic
  - saturation

# ---------------------------------------------------------------------------
# Phase 2: Over-limit probe — assert bounded response (not a hang)
# ---------------------------------------------------------------------------

- name: 'GAP-0327-SAT-002: over-limit probe returns within timeout (QUIC)'
  description: |
    While one long-running stream is held open, fire an additional query
    with a short timeout.  The response must arrive within the timeout —
    it may succeed (server has capacity) or fail with an error, but it
    MUST NOT hang indefinitely.
  type: bash
  command: |
    SERVER="${GEODE_SERVER_ADDRESS}"
    PW="${GEODE_ADMIN_PASSWORD:-GeodeTestPassword123!}"

    # Background long-running holder (holds stream for ~6 s)
    geode query --server "${SERVER}" ${GEODE_CLIENT_TLS} \
      -U geode -P "${PW}" --timeout 10 \
      "MATCH (n:GAP0327Load) WITH count(n)*1000 AS c RETURN c AS delay_count" >/dev/null 2>&1 &
    HOLDER_PID=$!
    sleep 0.2

    # Short-timeout probe — must return within 6 s total
    START=$(date +%s%N)
    OUT=$(geode query --server "${SERVER}" ${GEODE_CLIENT_TLS} \
          -U geode -P "${PW}" --timeout 4 \
          "RETURN 'over_limit_probe' AS status" 2>&1)
    EC=$?
    END=$(date +%s%N)
    ELAPSED_MS=$(( (END - START) / 1000000 ))

    wait $HOLDER_PID 2>/dev/null

    echo "probe_ec=$EC elapsed_ms=${ELAPSED_MS} output=$OUT"

    # Pass if: response arrived within 6000 ms (bounded), regardless of success/failure
    [ "$ELAPSED_MS" -lt 6000 ] && echo "bounded=true" || echo "bounded=false"
    [ "$ELAPSED_MS" -lt 6000 ]
  timeout_ms: 30000
  expect:
    exit_code: 0
    stdout_contains:
    - bounded=true
  tags:
  - gap-0327
  - quic
  - over-limit

# ---------------------------------------------------------------------------
# Phase 3: Post-drain recovery
# ---------------------------------------------------------------------------

- name: 'GAP-0327-RECOVER-001: post-drain write succeeds'
  description: After all saturating streams drain, a new write must succeed
  args:
  - query
  - "CREATE (n:PoolRecoveryProbe {run: 'gap0327', ts: current_timestamp()}) RETURN n.run AS run"
  expect:
    exit_code: 0
    stdout_contains:
    - gap0327
  tags:
  - gap-0327
  - quic
  - recovery

- name: 'GAP-0327-RECOVER-002: post-drain read-back'
  description: Read back recovery probe node
  args:
  - query
  - "MATCH (n:PoolRecoveryProbe {run: 'gap0327'}) RETURN count(n) AS cnt"
  expect:
    exit_code: 0
    stdout_contains:
    - cnt
  tags:
  - gap-0327
  - quic
  - recovery

# ---------------------------------------------------------------------------
# Phase 4: gRPC transport saturation parity
# ---------------------------------------------------------------------------

- name: 'GAP-0327-GRPC-001: gRPC baseline before saturation'
  description: |
    Confirm gRPC transport is healthy before saturation test.
    Uses gRPC port when available (--transport grpc), otherwise falls back to
    QUIC to verify baseline connectivity.
  type: bash
  command: |
    PW="${GEODE_ADMIN_PASSWORD:-GeodeTestPassword123!}"
    if [ -n "${GEODE_GRPC_ADDRESS}" ]; then
      OUT=$(geode query --server "${GEODE_GRPC_ADDRESS}" --grpc \
            -U geode -P "${PW}" --timeout 15 \
            "RETURN 'grpc-pool-baseline' AS status" 2>&1)
      echo "$OUT"
      echo "$OUT" | grep -q "grpc-pool-baseline" && echo "grpc_baseline=ok" || { echo "grpc_baseline=FAIL"; exit 1; }
    else
      OUT=$(geode query --server "${GEODE_SERVER_ADDRESS}" ${GEODE_CLIENT_TLS} \
            -U geode -P "${PW}" --timeout 15 \
            "RETURN 'quic-baseline-grpc-unavailable' AS status" 2>&1)
      echo "$OUT"
      echo "$OUT" | grep -q "quic-baseline-grpc-unavailable" && echo "grpc_baseline=ok_quic_fallback grpc_note=use_transport_grpc_flag_for_full_test" || { echo "grpc_baseline=FAIL"; exit 1; }
    fi
  timeout_ms: 30000
  expect:
    exit_code: 0
    stdout_contains:
    - grpc_baseline=ok
  tags:
  - gap-0327
  - grpc
  - baseline

- name: 'GAP-0327-GRPC-002: gRPC saturation with 10 concurrent streams'
  description: |
    Open 10 concurrent gRPC streams (when gRPC port is available); verify
    server remains alive post-saturation. Falls back to QUIC if no gRPC port.
  type: bash
  command: |
    PW="${GEODE_ADMIN_PASSWORD:-GeodeTestPassword123!}"
    TMPDIR=$(mktemp -d)
    N=10

    if [ -n "${GEODE_GRPC_ADDRESS}" ]; then
      ADDR="${GEODE_GRPC_ADDRESS}"
      TRANSPORT_FLAGS="--grpc"
    else
      ADDR="${GEODE_SERVER_ADDRESS}"
      TRANSPORT_FLAGS="${GEODE_CLIENT_TLS}"
    fi

    for i in $(seq 1 $N); do
      (
        OUT=$(geode query --server "${ADDR}" ${TRANSPORT_FLAGS} \
              -U geode -P "${PW}" --timeout 8 \
              "MATCH (n:GAP0327Load) RETURN count(n) AS cnt" 2>&1)
        EC=$?
        echo "stream_$i ec=$EC" > "${TMPDIR}/${i}.r"
      ) &
    done
    wait

    OK=$(grep -l "ec=0" "${TMPDIR}"/*.r 2>/dev/null | wc -l)
    ERR=$(grep -l "ec=[^0]" "${TMPDIR}"/*.r 2>/dev/null | wc -l)
    rm -rf "${TMPDIR}"
    echo "sat_ok=$OK sat_err=$ERR"

    HEALTH=$(geode query --server "${ADDR}" ${TRANSPORT_FLAGS} \
             -U geode -P "${PW}" --timeout 15 \
             "RETURN 'alive_post_sat' AS status" 2>&1)
    echo "$HEALTH" | grep -q "alive_post_sat" && echo "grpc_alive=true" || echo "grpc_alive=false"
    echo "$HEALTH" | grep -q "alive_post_sat"
  timeout_ms: 90000
  expect:
    exit_code: 0
    stdout_contains:
    - grpc_alive=true
  tags:
  - gap-0327
  - grpc
  - saturation

# ---------------------------------------------------------------------------
# Phase 5: deterministic --max-connections admission control lives in its
# own spec, connection_pool_max_connections.yml, because it needs a
# dedicated server started with `--max-connections 4`. geode applies
# BACKPRESSURE (the accept loop parks until a slot frees) rather than a
# hard POOL_EXHAUSTED rejection, so that spec pins the bounded-backpressure
# invariant — every over-cap connection is queued and eventually served.
# ---------------------------------------------------------------------------

# ---------------------------------------------------------------------------
# Cleanup
# ---------------------------------------------------------------------------

- name: 'GAP-0327-CLEANUP-001: remove GAP0327Load nodes'
  description: Delete load test nodes used for stream saturation
  args:
  - query
  - MATCH (n:GAP0327Load) DETACH DELETE n RETURN count(n) AS deleted
  expect:
    exit_code: 0
  tags:
  - gap-0327
  - cleanup

- name: 'GAP-0327-CLEANUP-002: remove recovery probe nodes'
  description: Delete pool recovery probe nodes
  args:
  - query
  - "MATCH (n:PoolRecoveryProbe {run: 'gap0327'}) DETACH DELETE n RETURN count(n) AS deleted"
  expect:
    exit_code: 0
  tags:
  - gap-0327
  - cleanup

tags:
- gap-0327
- quic
- grpc
- transport
- pool-exhaustion
- connection-management
