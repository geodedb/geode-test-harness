version: "1.0"
name: "GQL Session Management Comprehensive Tests"
description: "Complete ISO/IEC 39075:2024 session management testing covering SESSION SET, RESET, and CLOSE commands"

cli:
  binary: "./zig-out/bin/geode"
  server:
    enabled: true
    port: null
    data_dir: null
    startup_timeout_ms: 30000
    cleanup: true
    args: ["--log-level", "info"]
  client:
    timeout_ms: 15000
    tls_verify: false
    format: "json"

tests:
  # ===============================
  # SESSION SET COMMANDS
  # ===============================

  # SESSION SET SCHEMA
  - name: "session-set-schema"
    description: "Test SESSION SET SCHEMA command"
    args: ["query", "SESSION SET SCHEMA default_schema"]
    expect:
      exit_code: 0
    tags: ["session", "schema", "set"]

  # SESSION SET GRAPH
  - name: "session-set-graph"
    description: "Test SESSION SET GRAPH command"
    args: ["query", "SESSION SET GRAPH CURRENT_GRAPH"]
    expect:
      exit_code: 0
    tags: ["session", "graph", "set"]

  - name: "session-set-property-graph"
    description: "Test SESSION SET PROPERTY GRAPH command"
    args: ["query", "SESSION SET PROPERTY GRAPH CURRENT_PROPERTY_GRAPH"]
    expect:
      exit_code: 0
    tags: ["session", "property-graph", "set"]

  # SESSION SET TIME ZONE
  - name: "session-set-timezone-utc"
    description: "Test SESSION SET TIME ZONE to UTC"
    args: ["query", "SESSION SET TIME ZONE 'UTC'"]
    expect:
      exit_code: 0
    tags: ["session", "timezone", "set"]

  - name: "session-set-timezone-offset"
    description: "Test SESSION SET TIME ZONE with offset"
    args: ["query", "SESSION SET TIME ZONE '+05:00'"]
    expect:
      exit_code: 0
    tags: ["session", "timezone", "offset"]

  # SESSION SET PARAMETER clauses
  - name: "session-set-graph-parameter"
    description: "Test SESSION SET GRAPH parameter"
    args: ["query", "SESSION SET GRAPH $my_graph = CURRENT_GRAPH"]
    expect:
      exit_code: 0
    tags: ["session", "parameter", "graph"]

  - name: "session-set-binding-table-parameter"
    description: "Test SESSION SET BINDING TABLE parameter"
    args: ["query", "SESSION SET BINDING TABLE $my_table = { MATCH (n) RETURN n }"]
    expect:
      exit_code: 0
    tags: ["session", "parameter", "binding-table"]

  - name: "session-set-value-parameter"
    description: "Test SESSION SET VALUE parameter"
    args: ["query", "SESSION SET VALUE $my_value = 42"]
    expect:
      exit_code: 0
    tags: ["session", "parameter", "value"]

  # SESSION SET with IF NOT EXISTS
  - name: "session-set-parameter-if-not-exists"
    description: "Test SESSION SET with IF NOT EXISTS"
    args: ["query", "SESSION SET VALUE IF NOT EXISTS $new_param = 'test'"]
    expect:
      exit_code: 0
    tags: ["session", "parameter", "conditional"]

  # ===============================
  # SESSION RESET COMMANDS
  # ===============================

  - name: "session-reset-all-parameters"
    description: "Test SESSION RESET ALL PARAMETERS"
    args: ["query", "SESSION RESET ALL PARAMETERS"]
    expect:
      exit_code: 0
    tags: ["session", "reset", "parameters"]

  - name: "session-reset-parameters"
    description: "Test SESSION RESET PARAMETERS"
    args: ["query", "SESSION RESET PARAMETERS"]
    expect:
      exit_code: 0
    tags: ["session", "reset", "parameters"]

  - name: "session-reset-characteristics"
    description: "Test SESSION RESET CHARACTERISTICS"
    args: ["query", "SESSION RESET ALL CHARACTERISTICS"]
    expect:
      exit_code: 0
    tags: ["session", "reset", "characteristics"]

  - name: "session-reset-schema"
    description: "Test SESSION RESET SCHEMA"
    args: ["query", "SESSION RESET SCHEMA"]
    expect:
      exit_code: 0
    tags: ["session", "reset", "schema"]

  - name: "session-reset-graph"
    description: "Test SESSION RESET GRAPH"
    args: ["query", "SESSION RESET GRAPH"]
    expect:
      exit_code: 0
    tags: ["session", "reset", "graph"]

  - name: "session-reset-property-graph"
    description: "Test SESSION RESET PROPERTY GRAPH"
    args: ["query", "SESSION RESET PROPERTY GRAPH"]
    expect:
      exit_code: 0
    tags: ["session", "reset", "property-graph"]

  - name: "session-reset-timezone"
    description: "Test SESSION RESET TIME ZONE"
    args: ["query", "SESSION RESET TIME ZONE"]
    expect:
      exit_code: 0
    tags: ["session", "reset", "timezone"]

  - name: "session-reset-specific-parameter"
    description: "Test SESSION RESET specific parameter"
    args: ["query", "SESSION RESET PARAMETER $my_value"]
    expect:
      exit_code: 0
    tags: ["session", "reset", "parameter", "specific"]

  - name: "session-reset-no-args"
    description: "Test SESSION RESET with no arguments"
    args: ["query", "SESSION RESET"]
    expect:
      exit_code: 0
    tags: ["session", "reset", "default"]

  # ===============================
  # SESSION CLOSE COMMAND
  # ===============================

  - name: "session-close"
    description: "Test SESSION CLOSE command"
    args: ["query", "SESSION CLOSE"]
    expect:
      exit_code: 0
    tags: ["session", "close"]

  # ===============================
  # SESSION WORKFLOW TESTS
  # ===============================

  - name: "session-workflow-set-reset"
    description: "Test complete session workflow: set parameters then reset"
    args:
      - "query"
      - |
        SESSION SET VALUE $test_param = 'initial_value';
        SESSION SET TIME ZONE 'UTC';
        SESSION RESET PARAMETERS
    expect:
      exit_code: 0
    tags: ["session", "workflow", "comprehensive"]

  - name: "session-workflow-multiple-parameters"
    description: "Test setting multiple session parameters"
    args:
      - "query"
      - |
        SESSION SET VALUE $param1 = 100;
        SESSION SET VALUE $param2 = 'text_value';
        SESSION SET GRAPH $my_graph = CURRENT_GRAPH;
        SESSION RESET ALL PARAMETERS
    expect:
      exit_code: 0
    tags: ["session", "workflow", "multiple-parameters"]

  # ===============================
  # CURRENT GRAPH EXPRESSIONS
  # ===============================

  - name: "current-graph-expression"
    description: "Test CURRENT_GRAPH expression"
    args: ["query", "RETURN CURRENT_GRAPH AS current_graph"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["current_graph"]
    tags: ["session", "current-graph", "expression"]

  - name: "current-property-graph-expression"
    description: "Test CURRENT_PROPERTY_GRAPH expression"
    args: ["query", "RETURN CURRENT_PROPERTY_GRAPH AS current_property_graph"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["current_property_graph"]
    tags: ["session", "current-property-graph", "expression"]

  # ===============================
  # ERROR CASES
  # ===============================

  - name: "session-set-invalid-parameter-name"
    description: "Test SESSION SET with invalid parameter name"
    skip: true  # Geode returns status codes via response, not exit codes - test runner limitation
    args: ["query", "SESSION SET VALUE invalid_param_name = 'value'"]
    expect:
      exit_code: 0
      geode_query:
        status_class: "42000"  # Syntax error
    tags: ["session", "error", "parameter"]

  - name: "session-reset-nonexistent-parameter"
    description: "Test SESSION RESET with non-existent parameter"
    args: ["query", "SESSION RESET PARAMETER $nonexistent"]
    expect:
      exit_code: 0  # Should not error, just no-op
    tags: ["session", "reset", "nonexistent"]

invariants:
  - type: "server_running"

tags: ["session", "management", "iso-gql", "comprehensive"]
