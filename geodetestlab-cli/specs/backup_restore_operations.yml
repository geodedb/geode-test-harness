version: '1.0'
name: Backup Operations Tests
description: Tests for backup CLI operations
cli:
  binary: ./zig-out/bin/geode
  working_dir: null
  env:
    GEODE_LOG_LEVEL: info
  server:
    enabled: true
    port: null
    data_dir: null
    startup_timeout_ms: 60000
    cleanup: true
    args:
    - --log-level
    - info
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    server_address: 127.0.0.1:3141
    timeout_ms: 30000
    tls_verify: false
    format: json
secrets:
  admin_password:
    source: env
    key: GEODE_ADMIN_PASSWORD
    required: false
invariants:
- type: server_running
fuzz:
  enabled: false
tests:
- name: backup-help
  description: Test backup subcommand help
  args:
  - backup
  - --help
  expect:
    exit_code: 0
    stderr_contains:
    - backup
    - Usage
    - Subcommands
  tags:
  - backup
  - help
- name: backup-create-help
  description: Test backup create subcommand help
  args:
  - backup
  - create
  - --help
  expect:
    exit_code: 0
    stderr_contains:
    - create
    - output
    - type
  tags:
  - backup
  - help
  - create
- name: backup-list
  description: Test listing backups
  args:
  - backup
  - list
  expect:
    exit_code: 0
  tags:
  - backup
  - list
- name: backup-create-requires-output
  description: Test that backup create requires --output
  args:
  - backup
  - create
  expect:
    exit_code: 1
    stderr_contains:
    - --output
    - required
  tags:
  - backup
  - create
  - validation
- name: backup-create-basic
  description: Test creating a backup with output path
  args:
  - backup
  - create
  - --output
  - /tmp/test-backup.gz
  expect:
    exit_code: 0
  tags:
  - backup
  - create
- name: backup-create-compressed
  description: Test creating a compressed backup
  args:
  - backup
  - create
  - --output
  - /tmp/test-backup-compressed.gz
  - --compress
  expect:
    exit_code: 0
  tags:
  - backup
  - create
  - compression
- name: backup-create-full
  description: Test creating a full backup
  args:
  - backup
  - create
  - --output
  - /tmp/test-backup-full.gz
  - --type
  - full
  expect:
    exit_code: 0
  tags:
  - backup
  - create
  - full
- name: backup-info-help
  description: Test backup info subcommand help
  args:
  - backup
  - info
  - --help
  expect:
    exit_code: 0
    stderr_contains:
    - info
  tags:
  - backup
  - help
  - info
- name: backup-cleanup-help
  description: Test backup cleanup subcommand help
  args:
  - backup
  - cleanup
  - --help
  expect:
    exit_code: 0
    stderr_contains:
    - cleanup
  tags:
  - backup
  - help
  - cleanup
- name: backup-unknown-subcommand
  description: Test error for unknown backup subcommand
  args:
  - backup
  - nonexistent
  expect:
    exit_code: 1
    stderr_contains:
    - Unknown
    - subcommand
  tags:
  - backup
  - error
