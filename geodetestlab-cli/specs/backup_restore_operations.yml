version: "1.0"
name: "Backup Operations Tests"
description: "Tests for backup CLI operations"

cli:
  binary: "./zig-out/bin/geode"
  working_dir: null
  env:
    GEODE_LOG_LEVEL: "info"
  server:
    enabled: true
    port: null
    data_dir: null
    startup_timeout_ms: 60000
    cleanup: true
    args: ["--log-level", "info"]
    env: {}
  client:
    server_address: "127.0.0.1:3141"
    timeout_ms: 30000
    tls_verify: false
    format: "json"

secrets:
  admin_password:
    source: "env"
    key: "GEODE_ADMIN_PASSWORD"
    required: false

invariants:
  - type: "server_running"

fuzz:
  enabled: false

tests:
  # Backup help
  - name: "backup-help"
    description: "Test backup subcommand help"
    args: ["backup", "--help"]
    expect:
      exit_code: 0
      stdout_contains: ["backup", "Usage", "Subcommands"]
    tags: ["backup", "help"]

  # Backup create help
  - name: "backup-create-help"
    description: "Test backup create subcommand help"
    args: ["backup", "create", "--help"]
    expect:
      exit_code: 0
      stdout_contains: ["create", "output", "type"]
    tags: ["backup", "help", "create"]

  # List backups (should work even with empty backup list)
  - name: "backup-list"
    description: "Test listing backups"
    args: ["backup", "list"]
    expect:
      exit_code: 0
    tags: ["backup", "list"]

  # Backup create requires output
  - name: "backup-create-requires-output"
    description: "Test that backup create requires --output"
    args: ["backup", "create"]
    expect:
      exit_code: 1
      stderr_contains: ["--output", "required"]
    tags: ["backup", "create", "validation"]

  # Backup create with output (basic test)
  - name: "backup-create-basic"
    description: "Test creating a backup with output path"
    args: ["backup", "create", "--output", "/tmp/test-backup.gz"]
    expect:
      exit_code: 0
    tags: ["backup", "create"]

  # Backup create with compression
  - name: "backup-create-compressed"
    description: "Test creating a compressed backup"
    args: ["backup", "create", "--output", "/tmp/test-backup-compressed.gz", "--compress"]
    expect:
      exit_code: 0
    tags: ["backup", "create", "compression"]

  # Backup create with type full
  - name: "backup-create-full"
    description: "Test creating a full backup"
    args: ["backup", "create", "--output", "/tmp/test-backup-full.gz", "--type", "full"]
    expect:
      exit_code: 0
    tags: ["backup", "create", "full"]

  # Backup info help
  - name: "backup-info-help"
    description: "Test backup info subcommand help"
    args: ["backup", "info", "--help"]
    expect:
      exit_code: 0
      stdout_contains: ["info"]
    tags: ["backup", "help", "info"]

  # Backup cleanup help
  - name: "backup-cleanup-help"
    description: "Test backup cleanup subcommand help"
    args: ["backup", "cleanup", "--help"]
    expect:
      exit_code: 0
      stdout_contains: ["cleanup"]
    tags: ["backup", "help", "cleanup"]

  # Unknown subcommand error
  - name: "backup-unknown-subcommand"
    description: "Test error for unknown backup subcommand"
    args: ["backup", "nonexistent"]
    expect:
      exit_code: 1
      stderr_contains: ["Unknown", "subcommand"]
    tags: ["backup", "error"]
