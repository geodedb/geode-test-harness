name: "Complex Multi-Level Nesting"
description: "Extreme complexity test cases with deep nesting, multiple subqueries, and intricate logic"
version: "1.0.0"
provider: "cli"

cli:
  server:
    enabled: true
    port: null
    data_dir: null
    startup_timeout_ms: 30000
    cleanup: true
    args: ["--log-level", "info"]
  client:
    timeout_ms: 15000
    tls_verify: false
    format: "json"

setup:
  - command: "query"
    args: ["-"]
    stdin: |
      CREATE SCHEMA IF NOT EXISTS complex_nesting;
      USE complex_nesting;

      CREATE NODE Company {
        id: INTEGER,
        name: STRING,
        industry: STRING,
        revenue: DECIMAL(15,2),
        employees: INTEGER,
        founded: DATE,
        stock_price: DECIMAL(8,2),
        market_cap: DECIMAL(15,2)
      };

      CREATE NODE Division {
        id: INTEGER,
        name: STRING,
        budget: DECIMAL(12,2),
        headcount: INTEGER,
        profit_margin: DECIMAL(5,2)
      };

      CREATE NODE Team {
        id: INTEGER,
        name: STRING,
        size: INTEGER,
        productivity_score: DECIMAL(3,2),
        formation_date: DATE
      };

      CREATE NODE Employee {
        id: INTEGER,
        name: STRING,
        title: STRING,
        salary: DECIMAL(10,2),
        hire_date: DATE,
        performance_rating: DECIMAL(3,2),
        level: INTEGER
      };

      CREATE NODE Project {
        id: INTEGER,
        name: STRING,
        budget: DECIMAL(12,2),
        start_date: DATE,
        end_date: DATE,
        completion_percentage: DECIMAL(5,2),
        priority: INTEGER,
        risk_score: DECIMAL(3,2)
      };

      CREATE NODE Task {
        id: INTEGER,
        title: STRING,
        estimated_hours: INTEGER,
        actual_hours: INTEGER,
        status: STRING,
        complexity: INTEGER
      };

      CREATE NODE Client {
        id: INTEGER,
        name: STRING,
        contract_value: DECIMAL(12,2),
        satisfaction_score: DECIMAL(3,2),
        since: DATE
      };

      CREATE NODE Invoice {
        id: INTEGER,
        amount: DECIMAL(12,2),
        issue_date: DATE,
        due_date: DATE,
        status: STRING
      };

      CREATE EDGE OWNS {percentage: DECIMAL(5,2)};
      CREATE EDGE HAS_DIVISION {};
      CREATE EDGE HAS_TEAM {};
      CREATE EDGE MEMBER_OF {start_date: DATE, role: STRING};
      CREATE EDGE WORKS_ON {allocation: DECIMAL(5,2), hours_logged: INTEGER};
      CREATE EDGE MANAGES {since: DATE};
      CREATE EDGE REPORTS_TO {};
      CREATE EDGE DELIVERS_TO {};
      CREATE EDGE DEPENDS_ON {dependency_type: STRING};
      CREATE EDGE BILLS_TO {};
      CREATE EDGE PART_OF {};
    expected_output:
      contains: []

  - command: "query"
    args: ["-"]
    stdin: |
      // Create companies with ownership relationships
      CREATE (c1:Company {id: 1, name: 'TechCorp', industry: 'Technology', revenue: 5000000000.00, employees: 10000, founded: DATE '2000-01-15', stock_price: 150.00, market_cap: 50000000000.00})
      CREATE (c2:Company {id: 2, name: 'FinanceInc', industry: 'Finance', revenue: 3000000000.00, employees: 5000, founded: DATE '1995-06-20', stock_price: 85.00, market_cap: 30000000000.00})
      CREATE (c3:Company {id: 3, name: 'RetailMax', industry: 'Retail', revenue: 2000000000.00, employees: 15000, founded: DATE '1985-03-10', stock_price: 45.00, market_cap: 15000000000.00})
      CREATE (c4:Company {id: 4, name: 'StartupAI', industry: 'Technology', revenue: 50000000.00, employees: 200, founded: DATE '2020-01-01', stock_price: 25.00, market_cap: 500000000.00})

      // Create ownership relationships between companies
      MATCH (c1:Company {id: 1}), (c4:Company {id: 4})
      CREATE (c1)-[:OWNS {percentage: 45.00}]->(c4)

      MATCH (c2:Company {id: 2}), (c4:Company {id: 4})
      CREATE (c2)-[:OWNS {percentage: 25.00}]->(c4)

      // Create divisions
      CREATE (d1:Division {id: 1, name: 'Engineering', budget: 50000000.00, headcount: 500, profit_margin: 35.50})
      CREATE (d2:Division {id: 2, name: 'Sales', budget: 30000000.00, headcount: 300, profit_margin: 45.00})
      CREATE (d3:Division {id: 3, name: 'Research', budget: 40000000.00, headcount: 200, profit_margin: 15.00})
      CREATE (d4:Division {id: 4, name: 'Operations', budget: 25000000.00, headcount: 400, profit_margin: 25.00})

      // Link divisions to companies
      MATCH (c1:Company {id: 1}), (d1:Division {id: 1}), (d2:Division {id: 2}), (d3:Division {id: 3})
      CREATE (c1)-[:HAS_DIVISION]->(d1)
      CREATE (c1)-[:HAS_DIVISION]->(d2)
      CREATE (c1)-[:HAS_DIVISION]->(d3)

      MATCH (c2:Company {id: 2}), (d4:Division {id: 4})
      CREATE (c2)-[:HAS_DIVISION]->(d4)

      // Create teams
      CREATE (t1:Team {id: 1, name: 'Backend', size: 15, productivity_score: 0.85, formation_date: DATE '2021-01-01'})
      CREATE (t2:Team {id: 2, name: 'Frontend', size: 12, productivity_score: 0.90, formation_date: DATE '2021-03-01'})
      CREATE (t3:Team {id: 3, name: 'Data Science', size: 8, productivity_score: 0.75, formation_date: DATE '2021-06-01'})
      CREATE (t4:Team {id: 4, name: 'DevOps', size: 10, productivity_score: 0.88, formation_date: DATE '2021-02-01'})
      CREATE (t5:Team {id: 5, name: 'QA', size: 6, productivity_score: 0.92, formation_date: DATE '2021-04-01'})

      // Link teams to divisions
      MATCH (d1:Division {id: 1}), (t1:Team {id: 1}), (t2:Team {id: 2}), (t3:Team {id: 3}), (t4:Team {id: 4}), (t5:Team {id: 5})
      CREATE (d1)-[:HAS_TEAM]->(t1)
      CREATE (d1)-[:HAS_TEAM]->(t2)
      CREATE (d1)-[:HAS_TEAM]->(t3)
      CREATE (d1)-[:HAS_TEAM]->(t4)
      CREATE (d1)-[:HAS_TEAM]->(t5)

      // Create employees with complex hierarchy
      CREATE (e1:Employee {id: 1, name: 'John CEO', title: 'CEO', salary: 500000.00, hire_date: DATE '2015-01-01', performance_rating: 0.95, level: 10})
      CREATE (e2:Employee {id: 2, name: 'Alice CTO', title: 'CTO', salary: 350000.00, hire_date: DATE '2016-03-01', performance_rating: 0.92, level: 9})
      CREATE (e3:Employee {id: 3, name: 'Bob VP', title: 'VP Engineering', salary: 250000.00, hire_date: DATE '2017-06-01', performance_rating: 0.88, level: 8})
      CREATE (e4:Employee {id: 4, name: 'Carol Director', title: 'Director', salary: 180000.00, hire_date: DATE '2018-01-01', performance_rating: 0.85, level: 7})
      CREATE (e5:Employee {id: 5, name: 'David Manager', title: 'Manager', salary: 150000.00, hire_date: DATE '2019-03-01', performance_rating: 0.83, level: 6})
      CREATE (e6:Employee {id: 6, name: 'Eve Senior', title: 'Senior Engineer', salary: 120000.00, hire_date: DATE '2020-01-01', performance_rating: 0.87, level: 5})
      CREATE (e7:Employee {id: 7, name: 'Frank Mid', title: 'Engineer', salary: 95000.00, hire_date: DATE '2021-01-01', performance_rating: 0.80, level: 4})
      CREATE (e8:Employee {id: 8, name: 'Grace Junior', title: 'Junior Engineer', salary: 75000.00, hire_date: DATE '2022-01-01', performance_rating: 0.78, level: 3})

      // Create reporting structure
      MATCH (e1:Employee {id: 1}), (e2:Employee {id: 2})
      CREATE (e2)-[:REPORTS_TO]->(e1)
      CREATE (e1)-[:MANAGES {since: DATE '2016-03-01'}]->(e2)

      MATCH (e2:Employee {id: 2}), (e3:Employee {id: 3})
      CREATE (e3)-[:REPORTS_TO]->(e2)
      CREATE (e2)-[:MANAGES {since: DATE '2017-06-01'}]->(e3)

      MATCH (e3:Employee {id: 3}), (e4:Employee {id: 4}), (e5:Employee {id: 5})
      CREATE (e4)-[:REPORTS_TO]->(e3)
      CREATE (e5)-[:REPORTS_TO]->(e3)
      CREATE (e3)-[:MANAGES {since: DATE '2018-01-01'}]->(e4)
      CREATE (e3)-[:MANAGES {since: DATE '2019-03-01'}]->(e5)

      MATCH (e5:Employee {id: 5}), (e6:Employee {id: 6}), (e7:Employee {id: 7}), (e8:Employee {id: 8})
      CREATE (e6)-[:REPORTS_TO]->(e5)
      CREATE (e7)-[:REPORTS_TO]->(e5)
      CREATE (e8)-[:REPORTS_TO]->(e5)
      CREATE (e5)-[:MANAGES {since: DATE '2020-01-01'}]->(e6)
      CREATE (e5)-[:MANAGES {since: DATE '2021-01-01'}]->(e7)
      CREATE (e5)-[:MANAGES {since: DATE '2022-01-01'}]->(e8)

      // Assign employees to teams
      MATCH (t1:Team {id: 1}), (e5:Employee {id: 5}), (e6:Employee {id: 6}), (e7:Employee {id: 7})
      CREATE (e5)-[:MEMBER_OF {start_date: DATE '2021-01-01', role: 'Lead'}]->(t1)
      CREATE (e6)-[:MEMBER_OF {start_date: DATE '2021-01-01', role: 'Senior'}]->(t1)
      CREATE (e7)-[:MEMBER_OF {start_date: DATE '2021-01-01', role: 'Member'}]->(t1)

      // Create projects with dependencies
      CREATE (p1:Project {id: 1, name: 'Platform Redesign', budget: 5000000.00, start_date: DATE '2023-01-01', end_date: DATE '2023-12-31', completion_percentage: 45.00, priority: 1, risk_score: 0.7})
      CREATE (p2:Project {id: 2, name: 'Mobile App', budget: 2000000.00, start_date: DATE '2023-03-01', end_date: DATE '2023-09-30', completion_percentage: 65.00, priority: 2, risk_score: 0.5})
      CREATE (p3:Project {id: 3, name: 'Data Pipeline', budget: 3000000.00, start_date: DATE '2023-02-01', end_date: DATE '2023-08-31', completion_percentage: 80.00, priority: 1, risk_score: 0.3})
      CREATE (p4:Project {id: 4, name: 'AI Features', budget: 4000000.00, start_date: DATE '2023-06-01', end_date: DATE '2024-05-31', completion_percentage: 25.00, priority: 3, risk_score: 0.8})

      // Create project dependencies
      MATCH (p1:Project {id: 1}), (p3:Project {id: 3})
      CREATE (p1)-[:DEPENDS_ON {dependency_type: 'Technical'}]->(p3)

      MATCH (p2:Project {id: 2}), (p1:Project {id: 1})
      CREATE (p2)-[:DEPENDS_ON {dependency_type: 'Technical'}]->(p1)

      MATCH (p4:Project {id: 4}), (p3:Project {id: 3})
      CREATE (p4)-[:DEPENDS_ON {dependency_type: 'Data'}]->(p3)

      // Assign employees to projects
      MATCH (e5:Employee {id: 5}), (p1:Project {id: 1})
      CREATE (e5)-[:WORKS_ON {allocation: 50.00, hours_logged: 400}]->(p1)

      MATCH (e6:Employee {id: 6}), (p1:Project {id: 1}), (p2:Project {id: 2})
      CREATE (e6)-[:WORKS_ON {allocation: 60.00, hours_logged: 480}]->(p1)
      CREATE (e6)-[:WORKS_ON {allocation: 40.00, hours_logged: 320}]->(p2)

      MATCH (e7:Employee {id: 7}), (p2:Project {id: 2}), (p3:Project {id: 3})
      CREATE (e7)-[:WORKS_ON {allocation: 30.00, hours_logged: 240}]->(p2)
      CREATE (e7)-[:WORKS_ON {allocation: 70.00, hours_logged: 560}]->(p3)

      // Create tasks
      CREATE (task1:Task {id: 1, title: 'API Development', estimated_hours: 100, actual_hours: 120, status: 'In Progress', complexity: 8})
      CREATE (task2:Task {id: 2, title: 'Database Schema', estimated_hours: 50, actual_hours: 45, status: 'Completed', complexity: 6})
      CREATE (task3:Task {id: 3, title: 'UI Components', estimated_hours: 80, actual_hours: 85, status: 'In Progress', complexity: 7})
      CREATE (task4:Task {id: 4, title: 'Testing', estimated_hours: 60, actual_hours: 30, status: 'Pending', complexity: 5})

      // Link tasks to projects
      MATCH (p1:Project {id: 1}), (task1:Task {id: 1}), (task2:Task {id: 2})
      CREATE (task1)-[:PART_OF]->(p1)
      CREATE (task2)-[:PART_OF]->(p1)

      MATCH (p2:Project {id: 2}), (task3:Task {id: 3}), (task4:Task {id: 4})
      CREATE (task3)-[:PART_OF]->(p2)
      CREATE (task4)-[:PART_OF]->(p2)

      // Create clients
      CREATE (cl1:Client {id: 1, name: 'MegaCorp', contract_value: 10000000.00, satisfaction_score: 0.85, since: DATE '2020-01-01'})
      CREATE (cl2:Client {id: 2, name: 'SmallBiz', contract_value: 500000.00, satisfaction_score: 0.92, since: DATE '2021-06-01'})
      CREATE (cl3:Client {id: 3, name: 'Enterprise Ltd', contract_value: 5000000.00, satisfaction_score: 0.78, since: DATE '2019-03-01'})

      // Link projects to clients
      MATCH (p1:Project {id: 1}), (cl1:Client {id: 1})
      CREATE (p1)-[:DELIVERS_TO]->(cl1)

      MATCH (p2:Project {id: 2}), (cl2:Client {id: 2})
      CREATE (p2)-[:DELIVERS_TO]->(cl2)

      // Create invoices
      CREATE (inv1:Invoice {id: 1, amount: 1000000.00, issue_date: DATE '2023-03-01', due_date: DATE '2023-04-01', status: 'Paid'})
      CREATE (inv2:Invoice {id: 2, amount: 50000.00, issue_date: DATE '2023-04-01', due_date: DATE '2023-05-01', status: 'Pending'})
      CREATE (inv3:Invoice {id: 3, amount: 500000.00, issue_date: DATE '2023-02-01', due_date: DATE '2023-03-01', status: 'Paid'})

      // Link invoices to clients
      MATCH (inv1:Invoice {id: 1}), (cl1:Client {id: 1})
      CREATE (inv1)-[:BILLS_TO]->(cl1)

      MATCH (inv2:Invoice {id: 2}), (cl2:Client {id: 2})
      CREATE (inv2)-[:BILLS_TO]->(cl2)
    expected_output:
      contains: []

tests:
  # Ultra-Complex Nested Queries
  - name: "Six-Level Deep Nested Query"
    command: "query"
    args: ["MATCH (c:Company) WHERE c.revenue > (SELECT avg(c2.revenue) FROM Company c2 WHERE EXISTS { MATCH (c2)-[:HAS_DIVISION]->(d:Division) WHERE d.profit_margin > (SELECT avg(d2.profit_margin) FROM Division d2 WHERE EXISTS { MATCH (d2)-[:HAS_TEAM]->(t:Team) WHERE t.productivity_score > (SELECT avg(t2.productivity_score) FROM Team t2 WHERE EXISTS { MATCH (e:Employee)-[:MEMBER_OF]->(t2) WHERE e.performance_rating > (SELECT avg(e2.performance_rating) FROM Employee e2 WHERE EXISTS { MATCH (e2)-[:WORKS_ON]->(p:Project) WHERE p.risk_score < (SELECT avg(p2.risk_score) FROM Project p2) }) }) }) }) RETURN c.name"]
    expected_output:
      pattern: "\\w+"

  - name: "Multiple Correlated Subqueries at Same Level"
    command: "query"
    args: ["MATCH (e:Employee) WHERE e.salary > (SELECT avg(e2.salary) FROM Employee e2 WHERE e2.level = e.level) AND e.performance_rating > (SELECT avg(e3.performance_rating) FROM Employee e3 WHERE e3.level = e.level) AND EXISTS { MATCH (e)-[:WORKS_ON]->(p:Project) WHERE p.budget > (SELECT avg(p2.budget) FROM Project p2) AND p.priority < (SELECT avg(p3.priority) FROM Project p3) } RETURN e.name"]
    expected_output:
      pattern: "\\w+"

  - name: "Recursive Management Chain Analysis"
    command: "query"
    args: ["MATCH (e:Employee) WHERE EXISTS { MATCH path = (e)-[:MANAGES*1..5]->(report:Employee) WHERE length(path) > (SELECT avg(length(path2)) FROM (e2:Employee)-[:MANAGES*]->(r2:Employee) AS path2 WHERE e2.level >= e.level) AND all(emp IN nodes(path) WHERE emp.performance_rating > (SELECT percentile(e3.performance_rating, 0.5) FROM Employee e3)) } RETURN e.name AS top_manager"]
    expected_output:
      pattern: "\\w+"

  # Complex Window Function Combinations
  - name: "Nested Window Functions with Subqueries"
    command: "query"
    args: ["WITH (MATCH (e:Employee)-[:WORKS_ON]->(p:Project) RETURN e.name, p.name AS project, sum(wo.hours_logged) AS hours, rank() OVER (PARTITION BY p.name ORDER BY sum(wo.hours_logged) DESC) AS project_rank GROUP BY e, p) AS ranked WHERE ranked.project_rank = 1 AND ranked.hours > (SELECT avg(wo2.hours_logged) FROM ()-[:WORKS_ON {hours_logged: wo2.hours_logged}]->()) RETURN ranked.name, ranked.project, ranked.hours"]
    expected_output:
      pattern: "\\w+"

  - name: "Cumulative Aggregation with Complex Filtering"
    command: "query"
    args: ["WITH (MATCH (p:Project) RETURN p.name, p.budget, p.completion_percentage, sum(p.budget * p.completion_percentage / 100) OVER (ORDER BY p.start_date ROWS BETWEEN UNBOUNDED PRECEDING AND CURRENT ROW) AS cumulative_spent) AS spending WHERE spending.cumulative_spent > (SELECT sum(p2.budget) * 0.3 FROM Project p2 WHERE p2.priority <= 2) WITH spending WHERE spending.completion_percentage < (SELECT avg(p3.completion_percentage) FROM Project p3) RETURN spending.name, spending.cumulative_spent"]
    expected_output:
      pattern: "\\w+"

  # Cross-Product with Multiple Levels
  - name: "Complex Cross Join with Nested Conditions"
    command: "query"
    args: ["MATCH (c1:Company), (c2:Company) WHERE c1.id < c2.id AND EXISTS { MATCH (c1)-[:HAS_DIVISION]->(d1:Division), (c2)-[:HAS_DIVISION]->(d2:Division) WHERE abs(d1.profit_margin - d2.profit_margin) < (SELECT stddev(d.profit_margin) FROM Division d) AND EXISTS { MATCH (d1)-[:HAS_TEAM]->(t1:Team), (d2)-[:HAS_TEAM]->(t2:Team) WHERE abs(t1.productivity_score - t2.productivity_score) < (SELECT stddev(t.productivity_score) * 0.5 FROM Team t) } } RETURN c1.name AS company1, c2.name AS company2"]
    expected_output:
      pattern: "\\w+"

  # Graph Pattern with Nested Aggregations
  - name: "Complex Path Pattern with Aggregations"
    command: "query"
    args: ["MATCH path = (c:Company)-[:HAS_DIVISION]->(d:Division)-[:HAS_TEAM]->(t:Team)<-[:MEMBER_OF]-(e:Employee)-[:WORKS_ON]->(p:Project) WHERE length(path) = 5 AND d.budget > (SELECT avg(d2.budget) FROM Division d2) WITH path, nodes(path) AS path_nodes, relationships(path) AS path_rels WITH path_nodes, reduce(total_value = 0, n IN path_nodes | total_value + CASE WHEN n:Employee THEN n.salary WHEN n:Division THEN n.budget WHEN n:Project THEN n.budget ELSE 0 END) AS path_value WHERE path_value > (SELECT percentile(p.budget, 0.75) FROM Project p) * 10 RETURN path_nodes[0].name AS company, path_value"]
    expected_output:
      pattern: "\\w+"

  # Multiple UNION with Nested Queries
  - name: "Complex UNION of Nested Results"
    command: "query"
    args: ["(SELECT e.name AS name, 'Top Performer' AS category FROM Employee e WHERE e.performance_rating > (SELECT percentile(e2.performance_rating, 0.9) FROM Employee e2) AND e.salary > (SELECT avg(e3.salary) FROM Employee e3 WHERE e3.level = e.level)) UNION (SELECT c.name AS name, 'Top Revenue' AS category FROM Company c WHERE c.revenue > (SELECT percentile(c2.revenue, 0.8) FROM Company c2) AND EXISTS { MATCH (c)-[:HAS_DIVISION]->(d:Division) WHERE d.profit_margin > (SELECT avg(d2.profit_margin) FROM Division d2) }) UNION (SELECT p.name AS name, 'High Priority' AS category FROM Project p WHERE p.priority = 1 AND p.risk_score < (SELECT avg(p2.risk_score) FROM Project p2 WHERE p2.priority = 1))"]
    expected_output:
      contains:
        - "Top Performer"
        - "Top Revenue"
        - "High Priority"

  # Recursive CTE-like Patterns
  - name: "Simulated Recursive CTE"
    command: "query"
    args: ["WITH 1 AS level MATCH (e1:Employee {level: level}) WITH e1, level WITH e1, level + 1 AS next_level MATCH (e2:Employee {level: next_level}) WHERE EXISTS { MATCH (e1)-[:MANAGES]->(e2) } WITH e1, e2, next_level WITH e1, e2, next_level + 1 AS next_level2 MATCH (e3:Employee {level: next_level2}) WHERE EXISTS { MATCH (e2)-[:MANAGES]->(e3) } WITH e1, e2, e3, collect(e3.salary) AS subordinate_salaries WHERE reduce(sum = 0, s IN subordinate_salaries | sum + s) > (SELECT avg(e.salary) * 2 FROM Employee e) RETURN e1.name AS top_manager, size(subordinate_salaries) AS team_size"]
    expected_output:
      pattern: "\\w+"

  # Complex CASE Chains with Nesting
  - name: "Multi-Level CASE with Subqueries"
    command: "query"
    args: ["MATCH (e:Employee) RETURN e.name, CASE WHEN e.level > (SELECT avg(e2.level) FROM Employee e2) THEN CASE WHEN e.salary > (SELECT percentile(e3.salary, 0.75) FROM Employee e3 WHERE e3.level = e.level) THEN CASE WHEN EXISTS { MATCH (e)-[:WORKS_ON]->(p:Project) WHERE p.priority = 1 } THEN 'Senior High-Priority' ELSE 'Senior Regular' END ELSE CASE WHEN e.performance_rating > (SELECT avg(e4.performance_rating) FROM Employee e4) THEN 'Senior High-Performer' ELSE 'Senior Standard' END END ELSE CASE WHEN EXISTS { MATCH (e)<-[:MANAGES]-(:Employee) } THEN 'Junior Manager' ELSE 'Junior IC' END END AS classification"]
    expected_output:
      contains:
        - "Senior"
        - "Junior"

  # Advanced Statistical Queries
  - name: "Complex Statistical Analysis"
    command: "query"
    args: ["MATCH (d:Division)-[:HAS_TEAM]->(t:Team)<-[:MEMBER_OF]-(e:Employee) WITH d.name AS division, collect(e.salary) AS salaries, collect(e.performance_rating) AS ratings WITH division, salaries, ratings, reduce(sum = 0, s IN salaries | sum + s) / size(salaries) AS avg_salary, reduce(sum = 0, r IN ratings | sum + r) / size(ratings) AS avg_rating WITH division, avg_salary, avg_rating, salaries, reduce(variance = 0, s IN salaries | variance + (s - avg_salary) * (s - avg_salary)) / size(salaries) AS salary_variance WHERE salary_variance < (SELECT variance(e.salary) FROM Employee e) AND avg_rating > (SELECT percentile(e2.performance_rating, 0.6) FROM Employee e2) RETURN division, round(sqrt(salary_variance), 2) AS salary_stddev, round(avg_rating, 2) AS avg_performance"]
    expected_output:
      pattern: "\\w+"

  # Time-Series Analysis with Nesting
  - name: "Complex Time-Series Query"
    command: "query"
    args: ["MATCH (p:Project) WITH p.start_date AS date, collect(p) AS projects_started WITH date, projects_started, size(projects_started) AS count WHERE count > (SELECT avg(size(collect(p2))) FROM Project p2 GROUP BY p2.start_date) WITH date, projects_started, reduce(total_budget = 0, p IN projects_started | total_budget + p.budget) AS day_budget WHERE day_budget > (WITH (MATCH (p3:Project) RETURN p3.start_date AS d, sum(p3.budget) AS budget GROUP BY d) AS daily_budgets RETURN percentile(daily_budgets.budget, 0.7)) RETURN date, day_budget, size(projects_started) AS num_projects"]
    expected_output:
      pattern: "\\d{4}-\\d{2}-\\d{2}"

  # Complex Dependency Analysis
  - name: "Multi-Level Dependency Resolution"
    command: "query"
    args: ["MATCH (p1:Project) WHERE EXISTS { MATCH path = (p1)-[:DEPENDS_ON*1..3]->(p2:Project) WHERE all(proj IN nodes(path) WHERE proj.completion_percentage < (SELECT avg(p3.completion_percentage) FROM Project p3)) AND length(path) > (SELECT avg(length(dep_path)) FROM (p4:Project)-[:DEPENDS_ON*]->(p5:Project) AS dep_path) AND p2.risk_score > (SELECT percentile(p6.risk_score, 0.7) FROM Project p6) } RETURN p1.name AS blocked_project"]
    expected_output:
      pattern: "\\w+"

  # Ownership Chain Analysis
  - name: "Complex Ownership Structure Query"
    command: "query"
    args: ["MATCH (c1:Company) WHERE EXISTS { MATCH path = (c1)-[:OWNS*1..2]->(c2:Company) WHERE reduce(total_ownership = 1.0, r IN relationships(path) | total_ownership * r.percentage / 100) > (SELECT avg(own.percentage) / 100 FROM ()-[:OWNS {percentage: own.percentage}]->()) AND c2.market_cap < c1.market_cap * (SELECT avg(c3.market_cap) / max(c3.market_cap) FROM Company c3) } RETURN c1.name AS parent_company"]
    expected_output:
      pattern: "\\w+"

  # Ultimate Complexity Query
  - name: "Maximum Complexity Nested Query"
    command: "query"
    args: ["WITH (MATCH (c:Company)-[:HAS_DIVISION]->(d:Division) RETURN c, d, (SELECT count(t) FROM (d)-[:HAS_TEAM]->(t:Team)) AS team_count WHERE team_count > (SELECT avg(count(t2)) FROM Division d2, (d2)-[:HAS_TEAM]->(t2:Team) GROUP BY d2)) AS companies_with_divisions WHERE EXISTS { MATCH (companies_with_divisions.d)-[:HAS_TEAM]->(t:Team)<-[:MEMBER_OF]-(e:Employee) WHERE e.salary > (WITH (MATCH (e2:Employee)-[:MEMBER_OF]->(t2:Team) WHERE t2.productivity_score > (SELECT percentile(t3.productivity_score, 0.5) FROM Team t3) RETURN avg(e2.salary) AS avg) AS filtered_avg RETURN filtered_avg * 1.2) AND EXISTS { MATCH (e)-[:WORKS_ON]->(p:Project) WHERE p.completion_percentage > (SELECT avg(p2.completion_percentage) FROM Project p2 WHERE EXISTS { MATCH (p2)-[:DEPENDS_ON*0..2]->(p3:Project) WHERE p3.risk_score < (SELECT percentile(p4.risk_score, 0.3) FROM Project p4) }) } } WITH companies_with_divisions.c AS company, count(DISTINCT companies_with_divisions.d) AS division_count WHERE division_count >= (SELECT percentile(count(d5), 0.75) FROM Company c5, (c5)-[:HAS_DIVISION]->(d5:Division) GROUP BY c5) RETURN company.name, division_count"]
    expected_output:
      pattern: "\\w+"

cleanup:
  - command: "query"
    args: ["-"]
    stdin: "DROP SCHEMA complex_nesting CASCADE;"
    expected_output:
      contains: []
