---
# Environment Variables Tests
# Converted from legacy format to compatible schema
version: "1.0"
name: "Environment Variables Basic Tests"
description: "Testing environment variable resolution in queries"

cli:
  binary: "./zig-out/bin/geode"
  server:
    enabled: true
    port: null
    data_dir: null
    startup_timeout_ms: 60000
    cleanup: true
    args: ["--log-level", "warn"]
    env: {}
  client:
    timeout_ms: 30000
    tls_verify: false
    format: "json"

tests:
  - name: env-var-default-value
    description: Test environment variable with default value
    args: ["query", "-"]
    stdin: 'RETURN "fallback_value" AS result'
    expect:
      exit_code: 0
      stdout_contains: ["result"]
    tags: [env, basic]

  - name: static-value-passthrough
    description: Test static values work correctly
    args: ["query", "-"]
    stdin: 'RETURN "static_value" AS static_result'
    expect:
      exit_code: 0
      stdout_contains: ["static_value", "static_result"]
    tags: [env, basic]

  - name: query-with-params
    description: Test query with parameters
    args: ["query", "-"]
    stdin: "RETURN 1 + 2 AS sum"
    expect:
      exit_code: 0
      stdout_contains: ["sum"]
    tags: [env, basic]

  - name: string-operations
    description: Test string operations in queries
    args: ["query", "-"]
    stdin: "RETURN 'hello' + ' ' + 'world' AS greeting"
    expect:
      exit_code: 0
      stdout_contains: ["greeting"]
    tags: [env, string]

tags: [environment, variables, basic]
