version: "1.0"
name: "Geode Enterprise Audit Logging Test Suite"
description: "Comprehensive testing of Geode's enterprise audit logging including tamper-evident features, multi-platform output, and SIEM integration"

cli:
  binary: "./zig-out/bin/geode"
  server:
    enabled: true
    port: null
    data_dir: null
    startup_timeout_ms: 30000
    cleanup: true
    args: ["--log-level", "info", "--audit", "--audit-file", "/tmp/geode_audit_test.jsonl"]
  client:
    timeout_ms: 15000
    tls_verify: false
    format: "json"

tests:
  # ===============================
  # AUDIT LOGGING SETUP
  # ===============================

  - name: "audit-setup-test-environment"
    description: "Setup audit logging test environment"
    args: ["query", "CALL audit.configure(enabled => true, file_path => '/tmp/geode_audit_test.jsonl', hash_algorithm => 'sha256') YIELD status, config RETURN status, config"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["status", "config"]
    tags: ["audit", "setup"]

  - name: "audit-setup-test-data"
    description: "Create test data for audit logging validation"
    args: ["query",
           "CREATE (user1:User {username: 'alice', role: 'admin', department: 'IT'}), (user2:User {username: 'bob', role: 'analyst', department: 'Finance'}), (user3:User {username: 'charlie', role: 'viewer', department: 'HR'}), (user1)-[:HAS_ACCESS {level: 'full', granted_at: timestamp()}]->(user2) RETURN count(*) AS created"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["created"]
    tags: ["audit", "setup", "data"]

  # ===============================
  # JSON FILE AUDIT LOGGING TESTING
  # ===============================

  - name: "audit-json-file-basic-operations"
    description: "Test JSON file audit logging for basic operations"
    args: ["query",
           "MATCH (u:User {username: 'alice'}) SET u.last_login = timestamp() RETURN u.username AS user, u.last_login AS login_time"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["user", "login_time"]
    tags: ["audit", "json", "basic"]

  - name: "audit-json-file-authentication-events"
    description: "Test authentication event logging (Event ID: 1001)"
    args: ["query", "CALL audit.log_auth_event('login', 'alice', 'success', 'password_auth') YIELD event_id, timestamp, logged RETURN event_id, timestamp, logged"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["event_id", "timestamp", "logged"]
    tags: ["audit", "json", "auth"]

  - name: "audit-json-file-command-execution-events"
    description: "Test command execution event logging (Event ID: 1002)"
    args: ["query",
           "MATCH (u:User) WHERE u.role = 'admin' RETURN count(u) AS admin_count"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["admin_count"]
    tags: ["audit", "json", "command"]

  - name: "audit-json-file-cli-lifecycle-events"
    description: "Test CLI lifecycle event logging (Event ID: 1003)"
    args: ["query", "CALL audit.log_lifecycle_event('cli_startup', 'geode-cli', 'success') YIELD event_id, lifecycle_stage RETURN event_id, lifecycle_stage"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["event_id", "lifecycle_stage"]
    tags: ["audit", "json", "lifecycle"]

  - name: "audit-json-file-event-structure"
    description: "Test JSON audit event structure and canonical format"
    args: ["query", "CALL audit.get_recent_events(limit => 5) YIELD seq_no, timestamp, event_type, actor, action, result, event_hash RETURN seq_no, timestamp, event_type, actor, action, result ORDER BY seq_no DESC LIMIT 3"]
    expect:
      exit_code: 0
      geode_query:
        columns: ["seq_no", "timestamp", "event_type", "actor", "action", "result"]
    tags: ["audit", "json", "structure"]

  # ===============================
  # TAMPER-EVIDENT FEATURES TESTING
  # ===============================

  - name: "audit-tamper-evident-hash-chain"
    description: "Test tamper-evident hash chain generation"
    args: ["query", "CALL audit.verify_hash_chain() YIELD chain_valid, total_events, hash_mismatches, last_verified_seq RETURN chain_valid, total_events, hash_mismatches, last_verified_seq"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["chain_valid", "total_events", "hash_mismatches", "last_verified_seq"]
    tags: ["audit", "tamper", "hash"]

  - name: "audit-tamper-evident-ed25519-signatures"
    description: "Test Ed25519 signature generation and verification"
    args: ["query", "CALL audit.test_signature_verification() YIELD signatures_valid, public_key_verified, signature_count RETURN signatures_valid, public_key_verified, signature_count"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["signatures_valid", "public_key_verified", "signature_count"]
    tags: ["audit", "tamper", "signature"]

  - name: "audit-tamper-evident-merkle-digests"
    description: "Test Merkle digest generation every 100 events"
    args: ["query", "CALL audit.get_merkle_digests() YIELD digest_count, merkle_root, events_covered, digest_valid RETURN digest_count, merkle_root, events_covered, digest_valid"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["digest_count", "merkle_root", "events_covered", "digest_valid"]
    tags: ["audit", "tamper", "merkle"]

  - name: "audit-tamper-evident-integrity-check"
    description: "Test comprehensive audit log integrity check"
    args: ["query", "CALL audit.comprehensive_integrity_check() YIELD integrity_status, events_verified, hash_chain_valid, signatures_valid, merkle_valid RETURN integrity_status, events_verified, hash_chain_valid, signatures_valid, merkle_valid"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["integrity_status", "events_verified", "hash_chain_valid", "signatures_valid", "merkle_valid"]
    tags: ["audit", "tamper", "integrity"]

  # ===============================
  # MULTI-PLATFORM OUTPUT TESTING
  # ===============================

  - name: "audit-multiplatform-file-output"
    description: "Test file-based audit output across platforms"
    args: ["query", "CALL audit.test_file_output() YIELD file_accessible, permissions_correct, json_valid, cross_platform_compatible RETURN file_accessible, permissions_correct, json_valid, cross_platform_compatible"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["file_accessible", "permissions_correct", "json_valid", "cross_platform_compatible"]
    tags: ["audit", "multiplatform", "file"]

  - name: "audit-multiplatform-windows-eventlog-simulation"
    description: "Test Windows Event Log integration simulation"
    args: ["query", "CALL audit.simulate_windows_eventlog() YIELD simulation_status, event_log_format, provider_name, event_ids_mapped RETURN simulation_status, event_log_format, provider_name, event_ids_mapped"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["simulation_status", "event_log_format", "provider_name", "event_ids_mapped"]
    tags: ["audit", "multiplatform", "windows"]

  - name: "audit-multiplatform-syslog-simulation"
    description: "Test syslog integration simulation for Unix/Linux systems"
    args: ["query", "CALL audit.simulate_syslog_output() YIELD syslog_format, facility, severity, message_format RETURN syslog_format, facility, severity, message_format"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["syslog_format", "facility", "severity", "message_format"]
    tags: ["audit", "multiplatform", "syslog"]

  - name: "audit-multiplatform-combined-output"
    description: "Test combined audit output to multiple destinations"
    args: ["query", "CALL audit.test_combined_output() YIELD outputs_configured, file_success, eventlog_success, syslog_success RETURN outputs_configured, file_success, eventlog_success, syslog_success"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["outputs_configured", "file_success", "eventlog_success", "syslog_success"]
    tags: ["audit", "multiplatform", "combined"]

  # ===============================
  # EVENT CATEGORIES TESTING
  # ===============================

  - name: "audit-categories-authentication-comprehensive"
    description: "Test comprehensive authentication event categories"
    args: ["query", "CALL audit.test_auth_categories() YIELD login_events, logout_events, password_reset_events, mfa_events, failed_auth_events RETURN login_events, logout_events, password_reset_events, mfa_events, failed_auth_events"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["login_events", "logout_events", "password_reset_events", "mfa_events", "failed_auth_events"]
    tags: ["audit", "categories", "auth"]

  - name: "audit-categories-command-execution-types"
    description: "Test command execution event type classification"
    args: ["query", "CALL audit.test_command_categories() YIELD serve_commands, shell_commands, query_commands, backup_commands, restore_commands RETURN serve_commands, shell_commands, query_commands, backup_commands, restore_commands"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["serve_commands", "shell_commands", "query_commands", "backup_commands", "restore_commands"]
    tags: ["audit", "categories", "commands"]

  - name: "audit-categories-data-access-patterns"
    description: "Test data access pattern categorization"
    args: ["query", "CALL audit.test_data_access_categories() YIELD read_operations, write_operations, admin_operations, privileged_access, unauthorized_attempts RETURN read_operations, write_operations, admin_operations, privileged_access, unauthorized_attempts"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["read_operations", "write_operations", "admin_operations", "privileged_access", "unauthorized_attempts"]
    tags: ["audit", "categories", "access"]

  # ===============================
  # SIEM INTEGRATION TESTING
  # ===============================

  - name: "audit-siem-event-correlation"
    description: "Test SIEM event correlation capabilities"
    args: ["query", "CALL audit.test_siem_correlation() YIELD correlation_id, related_events, threat_indicators, risk_score RETURN correlation_id, related_events, threat_indicators, risk_score"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["correlation_id", "related_events", "threat_indicators", "risk_score"]
    tags: ["audit", "siem", "correlation"]

  - name: "audit-siem-alert-generation"
    description: "Test SIEM alert generation for suspicious patterns"
    args: ["query", "CALL audit.test_siem_alerts() YIELD alert_count, high_risk_events, suspicious_patterns, recommended_actions RETURN alert_count, high_risk_events, suspicious_patterns, recommended_actions"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["alert_count", "high_risk_events", "suspicious_patterns", "recommended_actions"]
    tags: ["audit", "siem", "alerts"]

  - name: "audit-siem-compliance-reporting"
    description: "Test SIEM compliance reporting (SOX, PCI-DSS, HIPAA)"
    args: ["query", "CALL audit.generate_compliance_report(standard => 'SOX') YIELD report_id, compliance_score, violations_found, remediation_required RETURN report_id, compliance_score, violations_found, remediation_required"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["report_id", "compliance_score", "violations_found", "remediation_required"]
    tags: ["audit", "siem", "compliance"]

  - name: "audit-siem-powershell-queries"
    description: "Test PowerShell query compatibility for Windows environments"
    args: ["query", "CALL audit.test_powershell_compatibility() YIELD query_examples, filter_support, log_name_mapping, provider_name_mapping RETURN query_examples, filter_support, log_name_mapping, provider_name_mapping"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["query_examples", "filter_support", "log_name_mapping", "provider_name_mapping"]
    tags: ["audit", "siem", "powershell"]

  # ===============================
  # LOG ROTATION AND RETENTION TESTING
  # ===============================

  - name: "audit-rotation-time-based"
    description: "Test time-based audit log rotation"
    args: ["query", "CALL audit.configure_rotation(strategy => 'time', interval_hours => 24) YIELD rotation_enabled, next_rotation_time, file_naming_pattern RETURN rotation_enabled, next_rotation_time, file_naming_pattern"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["rotation_enabled", "next_rotation_time", "file_naming_pattern"]
    tags: ["audit", "rotation", "time"]

  - name: "audit-rotation-size-based"
    description: "Test size-based audit log rotation"
    args: ["query", "CALL audit.configure_rotation(strategy => 'size', max_size_mb => 100) YIELD rotation_enabled, size_threshold, compression_enabled RETURN rotation_enabled, size_threshold, compression_enabled"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["rotation_enabled", "size_threshold", "compression_enabled"]
    tags: ["audit", "rotation", "size"]

  - name: "audit-rotation-sequence-continuity"
    description: "Test sequence number continuity across rotations"
    args: ["query", "CALL audit.test_rotation_continuity() YIELD sequence_continuous, hash_chain_preserved, no_events_lost RETURN sequence_continuous, hash_chain_preserved, no_events_lost"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["sequence_continuous", "hash_chain_preserved", "no_events_lost"]
    tags: ["audit", "rotation", "continuity"]

  - name: "audit-retention-policy-enforcement"
    description: "Test audit log retention policy enforcement"
    args: ["query", "CALL audit.configure_retention(retention_days => 90, archive_enabled => true) YIELD policy_active, archive_location, auto_cleanup_enabled RETURN policy_active, archive_location, auto_cleanup_enabled"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["policy_active", "archive_location", "auto_cleanup_enabled"]
    tags: ["audit", "retention", "policy"]

  # ===============================
  # SECURITY MONITORING TESTING
  # ===============================

  - name: "audit-security-anomaly-detection"
    description: "Test security anomaly detection in audit logs"
    args: ["query", "CALL audit.detect_anomalies() YIELD anomalies_found, anomaly_types, confidence_scores, investigation_required RETURN anomalies_found, anomaly_types, confidence_scores, investigation_required"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["anomalies_found", "anomaly_types", "confidence_scores", "investigation_required"]
    tags: ["audit", "security", "anomaly"]

  - name: "audit-security-threat-indicators"
    description: "Test threat indicator extraction from audit events"
    args: ["query", "CALL audit.extract_threat_indicators() YIELD indicators_found, ip_addresses, user_patterns, attack_signatures RETURN indicators_found, ip_addresses, user_patterns, attack_signatures"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["indicators_found", "ip_addresses", "user_patterns", "attack_signatures"]
    tags: ["audit", "security", "threats"]

  - name: "audit-security-privilege-escalation"
    description: "Test privilege escalation detection in audit logs"
    args: ["query", "CALL audit.detect_privilege_escalation() YIELD escalation_events, suspicious_role_changes, admin_access_patterns RETURN escalation_events, suspicious_role_changes, admin_access_patterns"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["escalation_events", "suspicious_role_changes", "admin_access_patterns"]
    tags: ["audit", "security", "privilege"]

  # ===============================
  # PERFORMANCE AND SCALABILITY TESTING
  # ===============================

  - name: "audit-performance-high-volume"
    description: "Test audit logging performance under high event volume"
    args: ["query", "CALL audit.performance_test(events_per_second => 1000, duration_seconds => 30) YIELD events_logged, avg_latency_ms, max_latency_ms, throughput_achieved RETURN events_logged, avg_latency_ms, max_latency_ms, throughput_achieved"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["events_logged", "avg_latency_ms", "max_latency_ms", "throughput_achieved"]
    tags: ["audit", "performance", "volume"]

  - name: "audit-performance-memory-usage"
    description: "Test audit logging memory usage under load"
    args: ["query", "CALL audit.memory_usage_test() YIELD baseline_memory_mb, peak_memory_mb, memory_growth_rate, within_limits RETURN baseline_memory_mb, peak_memory_mb, memory_growth_rate, within_limits"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["baseline_memory_mb", "peak_memory_mb", "memory_growth_rate", "within_limits"]
    tags: ["audit", "performance", "memory"]

  - name: "audit-performance-concurrent-access"
    description: "Test audit logging with concurrent access patterns"
    args: ["query", "CALL audit.concurrent_access_test(concurrent_users => 50, operations_per_user => 100) YIELD total_operations, contention_events, lock_wait_time_ms RETURN total_operations, contention_events, lock_wait_time_ms"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["total_operations", "contention_events", "lock_wait_time_ms"]
    tags: ["audit", "performance", "concurrent"]

  # ===============================
  # ERROR HANDLING AND EDGE CASES
  # ===============================

  - name: "audit-error-disk-space-exhaustion"
    description: "Test audit logging behavior when disk space is exhausted"
    args: ["query", "CALL audit.test_disk_space_handling() YIELD graceful_degradation, error_handling, recovery_successful RETURN graceful_degradation, error_handling, recovery_successful"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["graceful_degradation", "error_handling", "recovery_successful"]
    tags: ["audit", "error", "disk"]

  - name: "audit-error-corrupted-log-file"
    description: "Test handling of corrupted audit log files"
    args: ["query", "CALL audit.test_corruption_handling() YIELD corruption_detected, recovery_attempted, data_salvaged RETURN corruption_detected, recovery_attempted, data_salvaged"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["corruption_detected", "recovery_attempted", "data_salvaged"]
    tags: ["audit", "error", "corruption"]

  - name: "audit-error-invalid-configuration"
    description: "Test error handling for invalid audit configuration"
    args: ["query", "CALL audit.test_invalid_config() YIELD config_rejected, fallback_activated, service_continuity RETURN config_rejected, fallback_activated, service_continuity"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["config_rejected", "fallback_activated", "service_continuity"]
    tags: ["audit", "error", "config"]

  # ===============================
  # VERIFICATION AND VALIDATION TESTING
  # ===============================

  - name: "audit-verification-external-tool"
    description: "Test audit log verification with external tools"
    args: ["query", "CALL audit.export_for_verification() YIELD export_path, verification_data, public_keys_included RETURN export_path, verification_data, public_keys_included"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["export_path", "verification_data", "public_keys_included"]
    tags: ["audit", "verification", "external"]

  - name: "audit-verification-forensic-analysis"
    description: "Test audit log preparation for forensic analysis"
    args: ["query", "CALL audit.prepare_forensic_package() YIELD package_created, chain_of_custody, integrity_preserved RETURN package_created, chain_of_custody, integrity_preserved"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["package_created", "chain_of_custody", "integrity_preserved"]
    tags: ["audit", "verification", "forensic"]

  - name: "audit-verification-compliance-audit"
    description: "Test audit log compliance verification"
    args: ["query", "CALL audit.compliance_verification() YIELD compliance_standard, verification_passed, issues_found, certification_ready RETURN compliance_standard, verification_passed, issues_found, certification_ready"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["compliance_standard", "verification_passed", "issues_found", "certification_ready"]
    tags: ["audit", "verification", "compliance"]

  # ===============================
  # AUDIT CLEANUP
  # ===============================

  - name: "audit-cleanup-test-data"
    description: "Clean up audit test data"
    args: ["query", "MATCH (n) DETACH DELETE n"]
    expect:
      exit_code: 0
    tags: ["cleanup"]

  - name: "audit-cleanup-log-files"
    description: "Clean up audit log files and test artifacts"
    args: ["query", "CALL audit.cleanup_test_artifacts() YIELD files_cleaned, logs_archived, test_data_removed RETURN files_cleaned, logs_archived, test_data_removed"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["files_cleaned", "logs_archived", "test_data_removed"]
    tags: ["audit", "cleanup"]

invariants:
  - type: "server_running"

tags: ["audit", "logging", "enterprise", "security", "siem", "compliance", "tamper-evident", "comprehensive"]
