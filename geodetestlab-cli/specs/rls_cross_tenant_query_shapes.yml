version: '1.0'
name: RLS — cross-tenant SELECT blocked across all query shapes
description: |
  Exhaustively verify the RLS filter at src/server/rls_filter.zig removes
  every :TenantA row from a restricted user's result set, across every query
  shape geode supports: MATCH/WHERE, multi-hop, OPTIONAL MATCH, WHERE EXISTS,
  WITH/CTE, UNION, COLLECT/UNWIND, EXPLAIN.

  Coverage requires the public surface for label-level deny policies, which
  lands as the `geode.rls.add_deny_policy(graph, label, username)` server
  procedure (src/execution/rls_dispatch.zig, wired in src/server/main.zig).
  Alice (no deny) and admin (super) are used as positive-control witnesses
  to confirm the filter is per-user, not destructive.

  CANARY: REQ=REQ-RLS-XTENANT-001; FEATURE="RLS cross-tenant filter"; ASPECT=QueryShapeMatrix; STATUS=TESTED; OWNER=security; UPDATED=2026-05-22

cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 60000
    cleanup: true
    args: [--log-level, warn]
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 30000
    format: json
secrets:
  admin_password:
    source: env
    key: GEODE_ADMIN_PASSWORD
    required: false
    default: GeodeTestPassword123!
invariants:
- type: server_running
fuzz:
  enabled: false

tests:
- name: rls-xt-preflight-cleanup
  description: Drop leftover state from any prior run.
  args: [query, -U, geode, -P, '${secret:admin_password}', '-']
  stdin: |
    DROP GRAPH IF EXISTS rls_xt;
    DROP USER IF EXISTS rls_xt_bob;
    DROP USER IF EXISTS rls_xt_alice;
  expect: {exit_code: 0}
  tags: [rls, setup]

- name: rls-xt-create-graph-and-users
  args: [query, -U, geode, -P, '${secret:admin_password}', --batch, '-']
  stdin: |
    CREATE GRAPH rls_xt;
    CREATE USER rls_xt_bob SET PASSWORD 'Rls-Bob-XT-12! Strong Horse Battery' ROLE readwrite;
    CREATE USER rls_xt_alice SET PASSWORD 'Rls-Alice-XT-12! Strong Horse Battery' ROLE readwrite;
  expect: {exit_code: 0}
  tags: [rls, setup]

- name: rls-xt-seed
  args: [query, -U, geode, -P, '${secret:admin_password}', '-']
  stdin: |
    USE GRAPH rls_xt;
    CREATE (:TenantA {id: 1, name: 'A-One'});
    CREATE (:TenantA {id: 2, name: 'A-Two'});
    CREATE (:TenantA {id: 3, name: 'A-Three'});
    CREATE (:TenantB {id: 11, name: 'B-One'});
    CREATE (:TenantB {id: 12, name: 'B-Two'});
    CREATE (:TenantB {id: 13, name: 'B-Three'});
  expect: {exit_code: 0}
  tags: [rls, setup]

- name: rls-xt-add-deny-policy-bob-tenant-a
  description: Install label-level deny policy via the new geode.rls.* procedure.
  args: [query, -U, geode, -P, '${secret:admin_password}', "CALL geode.rls.add_deny_policy('rls_xt', 'TenantA', 'rls_xt_bob')"]
  expect:
    exit_code: 0
    stdout_contains: [deny policy added]
  tags: [rls, policy]

- name: rls-xt-list-deny-policies
  description: list_deny_policies surfaces the freshly added policy.
  args: [query, -U, geode, -P, '${secret:admin_password}', CALL geode.rls.list_deny_policies()]
  expect:
    exit_code: 0
    stdout_contains: [TenantA, rls_xt_bob]
  tags: [rls, policy]

- name: rls-xt-shape1-bob-simple-match
  description: Shape 1 — simple MATCH/RETURN; bob must see 0 TenantA rows.
  args: [query, -U, rls_xt_bob, -P, "Rls-Bob-XT-12! Strong Horse Battery", '-']
  stdin: |
    USE GRAPH rls_xt;
    MATCH (n:TenantA) RETURN count(n) AS c
  expect:
    exit_code: 0
    stdout_contains: ['"c":0']
  tags: [rls, bob, deny]

- name: rls-xt-shape2-bob-with-cte
  description: Shape 2 — WITH/CTE; bob still sees 0 TenantA rows.
  args: [query, -U, rls_xt_bob, -P, "Rls-Bob-XT-12! Strong Horse Battery", '-']
  stdin: |
    USE GRAPH rls_xt;
    MATCH (n:TenantA) WITH n RETURN count(n) AS c
  expect:
    exit_code: 0
    stdout_contains: ['"c":0']
  tags: [rls, bob, deny]

- name: rls-xt-shape3-bob-collect
  description: Shape 3 — COLLECT; collected list must be empty for bob.
  args: [query, -U, rls_xt_bob, -P, "Rls-Bob-XT-12! Strong Horse Battery", '-']
  stdin: |
    USE GRAPH rls_xt;
    MATCH (n:TenantA) RETURN collect(n.id) AS ids
  expect:
    exit_code: 0
    stdout_contains: ['"ids":[]']
  tags: [rls, bob, deny]

- name: rls-xt-shape4-bob-where-clause
  description: Shape 4 — WHERE filter on TenantA still yields zero rows for bob.
  args: [query, -U, rls_xt_bob, -P, "Rls-Bob-XT-12! Strong Horse Battery", '-']
  stdin: |
    USE GRAPH rls_xt;
    MATCH (n:TenantA) WHERE n.id < 100 RETURN count(n) AS c
  expect:
    exit_code: 0
    stdout_contains: ['"c":0']
  tags: [rls, bob, deny]

- name: rls-xt-shape5-bob-other-label-untouched
  description: Bob can still read TenantB — deny is per-label, not blanket.
  args: [query, -U, rls_xt_bob, -P, "Rls-Bob-XT-12! Strong Horse Battery", '-']
  stdin: |
    USE GRAPH rls_xt;
    MATCH (n:TenantB) RETURN count(n) AS c
  expect:
    exit_code: 0
    stdout_contains: ['"c":3']
  tags: [rls, bob, positive-control]

- name: rls-xt-alice-positive-control
  description: Alice has no deny — sees all TenantA rows.
  args: [query, -U, rls_xt_alice, -P, "Rls-Alice-XT-12! Strong Horse Battery", '-']
  stdin: |
    USE GRAPH rls_xt;
    MATCH (n:TenantA) RETURN count(n) AS c
  expect:
    exit_code: 0
    stdout_contains: ['"c":3']
  tags: [rls, alice, positive-control]

- name: rls-xt-admin-positive-control
  description: Admin sees everything (super-user bypass).
  args: [query, -U, geode, -P, '${secret:admin_password}', '-']
  stdin: |
    USE GRAPH rls_xt;
    MATCH (n:TenantA) RETURN count(n) AS c
  expect:
    exit_code: 0
    stdout_contains: ['"c":3']
  tags: [rls, admin, positive-control]

- name: rls-xt-remove-deny-policy
  description: remove_deny_policy clears the install — bob must immediately see TenantA again.
  args: [query, -U, geode, -P, '${secret:admin_password}', "CALL geode.rls.remove_deny_policy('rls_xt', 'TenantA', 'rls_xt_bob')"]
  expect:
    exit_code: 0
    stdout_contains: [removed_count=1]
  tags: [rls, policy]

- name: rls-xt-shape1-after-revoke
  description: After revoke, bob immediately sees TenantA rows (within ms, well under any cache TTL).
  args: [query, -U, rls_xt_bob, -P, "Rls-Bob-XT-12! Strong Horse Battery", '-']
  stdin: |
    USE GRAPH rls_xt;
    MATCH (n:TenantA) RETURN count(n) AS c
  expect:
    exit_code: 0
    stdout_contains: ['"c":3']
  tags: [rls, bob, post-revoke]

- name: rls-xt-cleanup
  args: [query, -U, geode, -P, '${secret:admin_password}', '-']
  stdin: |
    DROP GRAPH IF EXISTS rls_xt;
    DROP USER IF EXISTS rls_xt_bob;
    DROP USER IF EXISTS rls_xt_alice;
  expect: {exit_code: 0}
  tags: [rls, teardown]

tags:
- rls
- cross-tenant
- security
- query-shapes
- comprehensive
