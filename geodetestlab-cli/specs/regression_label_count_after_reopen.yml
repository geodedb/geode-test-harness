- name: count-before-restart
  description: Confirm exactly 250 RG3_A nodes exist before the restart.
  query: MATCH (n:RG3_A) RETURN count(n)
  expected:
    exit_code: 0
    stdout_contains:
    - '"count(n)":250'
  tags: [label-count, reopen, positive-baseline]

- name: empty-label-count-before-restart
  description: |
    Negative control — RG3_Empty has zero persisted nodes; count(n)
    must be exactly 0 before the restart.
  query: MATCH (n:RG3_Empty) RETURN count(n)
  expected:
    exit_code: 0
    stdout_contains:
    - '"count(n)":0'
  tags: [label-count, reopen, negative-control]

- name: restart-server-for-lazy-reopen
  description: |
    Restart the managed server against the SAME data dir (cleanup:
    false above). On reopen, geode hydrates the graph store
    lazily/deferred — this is the exact condition under which the
    pre-9a255a83 bug served count(n) from the not-yet-hydrated engine
    label index instead of the in-memory refcount.
  type: bash
  command: echo RESTART
  restart_server: true
  expected:
    exit_code: 0
    stdout_contains:
    - RESTART
  tags: [label-count, reopen, restart]

- name: first-query-count-after-reopen
  description: |
    KEY ASSERTION — this is the FIRST query test after the restart
    marker above; no warm-up query precedes it. Under the pre-9a255a83
    bug, the deferred-EMPTY engine label index would serve this read
    and return 0 or a partial "still climbing" count instead of the
    true persisted total. Must return exactly 250.
  query: MATCH (n:RG3_A) RETURN count(n)
  expected:
    exit_code: 0
    stdout_contains:
    - '"count(n)":250'
  tags: [label-count, reopen, key-assertion]

- name: restart-server-second-reopen
  description: |
    Second restart against the same data dir, to test the count under a
    different first-query shape (a partial LIMIT walk instead of an
    immediate count).
  type: bash
  command: echo RESTART
  restart_server: true
  expected:
    exit_code: 0
    stdout_contains:
    - RESTART
  tags: [label-count, reopen, restart]

- name: walk-limit-5-after-second-reopen
  description: |
    First query after the second restart — a partial LIMIT-5 walk that
    touches only 5 of the 250 persisted RG3_A nodes. This runs BEFORE
    the count on purpose: it proves the subsequent count is not merely
    correct because it happened to run first, but stays correct even
    after a partial read has already touched the (still lazily
    hydrating) label index.
  query: MATCH (n:RG3_A) RETURN n.id LIMIT 5
  expected:
    exit_code: 0
  tags: [label-count, reopen, walk]

- name: count-after-walk-second-reopen
  description: |
    KEY ASSERTION — count(n) must still be exactly 250 after the
    second reopen, even though a partial LIMIT-5 walk ran immediately
    before it. A regression of geode 9a255a83 would show up here as a
    partial/climbing count reflecting only the nodes the walk (or the
    still-hydrating index) had touched, instead of the true total.
  query: MATCH (n:RG3_A) RETURN count(n)
  expected:
    exit_code: 0
    stdout_contains:
    - '"count(n)":250'
  tags: [label-count, reopen, key-assertion]

- name: empty-label-count-after-reopen
  description: |
    Negative control, repeated post-reopen — RG3_Empty must still be
    exactly 0, proving the fix didn't overcorrect into always returning
    a nonzero/stale count regardless of label.
  query: MATCH (n:RG3_Empty) RETURN count(n)
  expected:
    exit_code: 0
    stdout_contains:
    - '"count(n)":0'
  tags: [label-count, reopen, negative-control]

