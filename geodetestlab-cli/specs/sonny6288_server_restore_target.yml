    }

    W=$(mktemp -d /tmp/sonnyC.XXXXXX); mkdir -p "$W/cwd"
    X="$W/X_FAIL"
    start_server "$X" "$W/f.1.log" || exit 1
    q "INSERT (:P {id:1})" >/dev/null; q "INSERT (:P {id:2})" >/dev/null
    OUT=$(srv_restore); RC=$?
    [ "$RC" != 0 ] || { echo "$OUT" | tail; fail "restore with no backup succeeded"; }
    echo "$OUT" | grep -q "BackupMetadataNotFound" || { echo "$OUT" | tail -5; fail "no-backup error not named"; }
    echo "$OUT" | grep -q "was not changed" || fail "no-backup error does not say the data dir was not changed"
    echo "$OUT" | grep -q "Server restore completed" && fail "no-backup restore claimed completion"
    echo "NO_BACKUP_REFUSED"
    bk --output "$W/f.backup" | grep -q "Backup created successfully" || fail "backup"
    B=$(ls "$X"/backups/full_*.backup | head -1)
    python3 -I - "$B" <<'PYEOF'
    import sys
    p = sys.argv[1]; b = bytearray(open(p, "rb").read()); b[len(b) // 2] ^= 0xFF; open(p, "wb").write(b)
    PYEOF
    q "INSERT (:P {id:3})" >/dev/null
    OUT=$(srv_restore); RC=$?
    [ "$RC" != 0 ] || { echo "$OUT" | tail; fail "restore of a corrupt backup succeeded"; }
    echo "$OUT" | grep -q "Server restore completed" && fail "corrupt restore claimed completion"
    echo "$OUT" | grep -qE "Restore failed|Server returned error" || { echo "$OUT" | tail -5; fail "corrupt restore not reported as a failure"; }
    echo "CORRUPT_BACKUP_REFUSED"
    ls "$W" | grep -q "restored" && fail "a failed restore left a restored directory: $(ls "$W")"
    [ -z "$(ls -A "$W/cwd")" ] || fail "failed restore wrote into cwd"
    [ "$(pcount)" = 3 ] || fail "live server stopped serving its data after a failed restore"
    stop_server
    start_server "$X" "$W/f.2.log" || fail "restart"
    [ "$(pcount)" = 3 ] || fail "data lost after a failed restore + restart"
    stop_server
    echo "FAILED_RESTORE_LEAVES_NOTHING"
  expect:
    exit_code: 0
    stdout_contains:
    - NO_BACKUP_REFUSED
