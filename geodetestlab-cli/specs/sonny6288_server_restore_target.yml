    }

    W=$(mktemp -d /tmp/sonnyC.XXXXXX)
    Y="$W/envdir"
    restore_contract BOTH "GEODE_DATA_DIR=$Y"
    [ -e "$Y" ] && { ls -A "$Y"; fail "the unrelated GEODE_DATA_DIR directory was created/written: $(ls -A "$Y")"; }
    ls "$W" | grep -q "^envdir" && fail "restore created something named after GEODE_DATA_DIR"
    echo "ENV_DIR_UNTOUCHED"
  expect:
    exit_code: 0
    stdout_contains:
    - SERVER_RESTORE_BOTH_OK
    - ENV_DIR_UNTOUCHED
  tags: [backup, restore, server, sonny-6288]

- name: failed-server-restore-leaves-nothing-and-server-keeps-serving
  description: |
    No backup at all, then a bit-flipped server-side backup: a clear error, no restored directory, the live data directory unchanged, the server still answering.
  type: bash
  timeout_ms: 240000
  command: |
    set -u
    unset GEODE_DATA_DIR  # a scratch server must never see the managed server's data dir
    export GEODE_ALLOW_INSECURE_TLS=1
