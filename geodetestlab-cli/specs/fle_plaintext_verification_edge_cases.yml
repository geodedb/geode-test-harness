  tags:
  - fle
  - edge
  - scan
  - shell
  - critical
- name: fle-edge-scan-no-path-plaintext
  description: 'CRITICAL: Verify path traversal marker does NOT appear in ANY data
    file'
  command: grep
  args:
  - -r
  - -a
  - -l
  - FLESECRET_PATH_
  - ${data_dir}
  expect:
    exit_code: 1
  tags:
  - fle
  - edge
  - scan
  - path
  - critical
- name: fle-edge-scan-no-long-plaintext
  description: 'CRITICAL: Verify long string marker does NOT appear in ANY data file'
  command: grep
  args:
  - -r
  - -a
  - -l
  - FLESECRET_LONG_
  - ${data_dir}
  expect:
    exit_code: 1
  tags:
  - fle
  - edge
  - scan
  - long
  - critical
- name: fle-edge-scan-no-single-plaintext
  description: 'CRITICAL: Verify single char marker does NOT appear in ANY data file'
  command: grep
  args:
  - -r
  - -a
  - -l
  - FLESECRET_SINGLE_
  - ${data_dir}
  expect:
    exit_code: 1
  tags:
  - fle
  - edge
  - scan
  - single
  - critical
- name: fle-edge-scan-no-repeat-plaintext
  description: 'CRITICAL: Verify repeated pattern marker does NOT appear in ANY data
    file'
  command: grep
  args:
  - -r
  - -a
  - -l
  - FLESECRET_REPEAT_
  - ${data_dir}
  expect:
    exit_code: 1
  tags:
  - fle
  - edge
  - scan
  - repeat
  - critical
- name: fle-edge-binary-scan-flesecret-prefix
  description: 'CRITICAL: Verify NO FLESECRET_ prefix appears in ANY binary file'
  command: grep
  args:
  - -r
  - -a
  - -l
  - FLESECRET_
  - ${data_dir}
  expect:
    exit_code: 1
  tags:
  - fle
  - edge
  - binary-scan
  - comprehensive
  - critical
invariants:
- type: server_running
plaintext_verification:
  enabled: true
  patterns:
  - FLESECRET_UNICODE_
  - FLESECRET_EMOJI_
  - FLESECRET_SQLI_
  - FLESECRET_SHELL_
  - FLESECRET_PATH_
  - FLESECRET_LONG_
  - FLESECRET_SINGLE_
  - FLESECRET_REPEAT_
  - FLESECRET_
  fail_on_violation: true
  scan_binary_files: true
tags:
- fle
- field-level-encryption
- security
- edge-cases
- unicode
- plaintext-verification
- critical
