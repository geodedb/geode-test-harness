# SONNY-2688: the relationship aggregation loop ignored an inline node property map
# (`MATCH (a:Q {f: 1})-[r:R]->(x) RETURN count(r)`), and the multi-hop executor evaluated
# ungrouped count/collect once per row instead of once. SONNY-3127: multi-hop
# `RETURN count(*)` is one row.
# Fixture: four :Q {k, f?}, four :X {k}, four :Y {k}, eight :Z {k, g, r}:
#   (Yk)-[:R]->(Qk)-[:R {w: k}]->(Xk); Q0 and Q1 also have f: 1; Zk has g = k/4 and r = 7-k;
#   (Q0)-[:S]->(Q1) and a self loop (Q3)-[:S]->(Q3).
version: '1.0'
name: SONNY-2688/3127 relationship aggregates with inline node properties
description: aggregates over relationships honour inline maps; multi-hop ungrouped aggregates are one row
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 60000
    cleanup: true
    args:
    - --log-level
    - warn
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 60000
    tls_verify: false
    format: json
tests:
- name: setup-fixture
  description: Create the Q/X/Y/Z fixture graph
  args:
  - query
  - --batch
  stdin: |
    CREATE (:Y {k: 0})-[:R]->(:Q {k: 0, f: 1})-[:R {w: 0}]->(:X {k: 0})
    CREATE (:Y {k: 1})-[:R]->(:Q {k: 1, f: 1})-[:R {w: 1}]->(:X {k: 1})
    CREATE (:Y {k: 2})-[:R]->(:Q {k: 2})-[:R {w: 2}]->(:X {k: 2})
    CREATE (:Y {k: 3})-[:R]->(:Q {k: 3})-[:R {w: 3}]->(:X {k: 3})
    CREATE (:Z {k: 0, g: 0, r: 7})
    CREATE (:Z {k: 1, g: 0, r: 6})
    CREATE (:Z {k: 2, g: 0, r: 5})
    CREATE (:Z {k: 3, g: 0, r: 4})
    CREATE (:Z {k: 4, g: 1, r: 3})
    CREATE (:Z {k: 5, g: 1, r: 2})
    CREATE (:Z {k: 6, g: 1, r: 1})
    CREATE (:Z {k: 7, g: 1, r: 0})
    MATCH (a:Q {k: 0}), (b:Q {k: 1}) CREATE (a)-[:S]->(b)
    MATCH (a:Q {k: 3}) CREATE (a)-[:S]->(a)
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    stdout_not_contains:
    - '"error"'
    - '"status_class":"4'
    - '"status_class":"2'
  tags:
  - setup
- name: count-r-inline-start
  description: count(r) honours the start node inline map
  args:
  - query
  - '-'
  stdin: |
    MATCH (a:Q {f: 1})-[r:R]->(x) RETURN count(r) AS c
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    - '{"c":2}'
    stdout_regex:
    - '"rows":\[(\{[^{}]*\},?){1}\]'
  tags:
  - regression
- name: sum-r-w
  description: sum(r.w) honours the start node inline map
  args:
  - query
  - '-'
  stdin: |
    MATCH (a:Q {f: 1})-[r:R]->(x) RETURN sum(r.w) AS s
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    - '{"s":1}'
    stdout_regex:
    - '"rows":\[(\{[^{}]*\},?){1}\]'
  tags:
  - regression
- name: count-r-inline-end
  description: count(r) honours the end node inline map
  args:
  - query
  - '-'
  stdin: |
    MATCH (y:Y)-[r:R]->(q:Q {f: 1}) RETURN count(r) AS c
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    - '{"c":2}'
    stdout_regex:
    - '"rows":\[(\{[^{}]*\},?){1}\]'
  tags:
  - regression
- name: count-collect-one-row
  description: count(*) and collect() together are one row
  args:
  - query
  - '-'
  stdin: |
    MATCH (a:Q {k: 2})-[r:R]->(x:X) RETURN count(*) AS c, collect(x.k) AS ks
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    - '{"c":1,"ks":[2]}'
  tags:
  - regression
- name: two-hop-count
  description: two-hop ungrouped count(*) is a single row
  args:
  - query
  - '-'
  stdin: |
    MATCH (y:Y)-[:R]->(q:Q)-[:R]->(x:X) RETURN count(*) AS c
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    - '"rows":[{"c":4}]'
  tags:
  - regression
- name: two-hop-count-collect
  description: two-hop count(x) and size(collect(x.k))
  args:
  - query
  - '-'
  stdin: |
    MATCH (y:Y)-[:R]->(q:Q)-[:R]->(x:X) RETURN count(x) AS c, size(collect(x.k)) AS n
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    - '"rows":[{"c":4,"n":4}]'
  tags:
  - regression
- name: two-hop-inline-mid
  description: two-hop with an inline map on the middle node
  args:
  - query
  - '-'
  stdin: |
    MATCH (y:Y)-[:R]->(q:Q {f: 1})-[:R]->(x:X) RETURN count(*) AS c
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    - '"rows":[{"c":2}]'
  tags:
  - regression
- name: three-var-unlabelled
  description: unlabelled two-hop count
  args:
  - query
  - '-'
  stdin: |
    MATCH (y)-[:R]->(q)-[:R]->(x) RETURN count(*) AS c
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    - '"rows":[{"c":4}]'
  tags:
  - regression
- name: two-hop-where
  description: two-hop count with WHERE
  args:
  - query
  - '-'
  stdin: |
    MATCH (y:Y)-[:R]->(q:Q)-[:R]->(x:X) WHERE x.k >= 2 RETURN count(*) AS c
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    - '"rows":[{"c":2}]'
  tags:
  - regression
