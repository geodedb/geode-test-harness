description: "Basic nested queries and subqueries, from simple to intermediate complexity"
binary: geode
timeout: 30

cli:
  server:
    enabled: true
    port: null
    data_dir: null
    startup_timeout_ms: 30000
    cleanup: true
    args: ["--log-level", "error"]
  client:
    timeout_ms: 30000
    tls_verify: false
    format: "json"

setup:
  - args: ["query", "-"]
    stdin: |
      CREATE (d1:DeptBasic {name: 'Engineering', budget: 1000000.00, location: 'NYC'})
      CREATE (d2:DeptBasic {name: 'Sales', budget: 500000.00, location: 'LA'})
      CREATE (d3:DeptBasic {name: 'HR', budget: 200000.00, location: 'Chicago'})
      CREATE (d4:DeptBasic {name: 'Marketing', budget: 300000.00, location: 'NYC'})

      CREATE (e1:EmpBasic {id: 1, name: 'Alice', department: 'Engineering', salary: 120000.00})
      CREATE (e2:EmpBasic {id: 2, name: 'Bob', department: 'Engineering', salary: 95000.00, manager_id: 1})
      CREATE (e3:EmpBasic {id: 3, name: 'Charlie', department: 'Sales', salary: 85000.00})
      CREATE (e4:EmpBasic {id: 4, name: 'Diana', department: 'Sales', salary: 90000.00, manager_id: 3})
      CREATE (e5:EmpBasic {id: 5, name: 'Eve', department: 'HR', salary: 75000.00})
      CREATE (e6:EmpBasic {id: 6, name: 'Frank', department: 'Engineering', salary: 110000.00, manager_id: 1})
      CREATE (e7:EmpBasic {id: 7, name: 'Grace', department: 'Marketing', salary: 95000.00})
      CREATE (e8:EmpBasic {id: 8, name: 'Henry', department: 'Marketing', salary: 70000.00, manager_id: 7})

      CREATE (p1:ProjBasic {id: 1, name: 'Alpha', budget: 500000.00})
      CREATE (p2:ProjBasic {id: 2, name: 'Beta', budget: 300000.00})
      CREATE (p3:ProjBasic {id: 3, name: 'Gamma', budget: 200000.00})
    expect:
      exit_code: 0

  - args: ["query", "-"]
    stdin: |
      MATCH (e:EmpBasic), (d:DeptBasic) WHERE e.department = d.name
      CREATE (e)-[:WORKS_IN_BASIC]->(d)
    expect:
      exit_code: 0

  - args: ["query", "-"]
    stdin: |
      MATCH (e:EmpBasic), (m:EmpBasic) WHERE e.manager_id = m.id
      CREATE (m)-[:MANAGES_BASIC]->(e)
    expect:
      exit_code: 0

  - args: ["query", "-"]
    stdin: |
      MATCH (e:EmpBasic {name: 'Alice'}), (p:ProjBasic {name: 'Alpha'})
      CREATE (e)-[:ASSIGNED_BASIC {role: 'Lead', hours: 40}]->(p)
    expect:
      exit_code: 0

  - args: ["query", "-"]
    stdin: |
      MATCH (e:EmpBasic {name: 'Bob'}), (p:ProjBasic {name: 'Alpha'})
      CREATE (e)-[:ASSIGNED_BASIC {role: 'Developer', hours: 35}]->(p)
    expect:
      exit_code: 0

  - args: ["query", "-"]
    stdin: |
      MATCH (e:EmpBasic {name: 'Frank'}), (p:ProjBasic {name: 'Beta'})
      CREATE (e)-[:ASSIGNED_BASIC {role: 'Developer', hours: 30}]->(p)
    expect:
      exit_code: 0

  - args: ["query", "-"]
    stdin: |
      MATCH (e:EmpBasic {name: 'Charlie'}), (p:ProjBasic {name: 'Gamma'})
      CREATE (e)-[:ASSIGNED_BASIC {role: 'Lead', hours: 25}]->(p)
    expect:
      exit_code: 0

  - args: ["query", "-"]
    stdin: |
      MATCH (e:EmpBasic {name: 'Diana'}), (p:ProjBasic {name: 'Gamma'})
      CREATE (e)-[:ASSIGNED_BASIC {role: 'Analyst', hours: 20}]->(p)
    expect:
      exit_code: 0

tests:
  # Level 1: Simple WHERE filters
  - name: "simple-subquery-scalar"
    description: "Simple scalar subquery comparison"
    args: ["query", "-"]
    stdin: "MATCH (e:EmpBasic) WHERE e.salary > 92000 RETURN e.name, e.salary ORDER BY e.salary DESC"
    expect:
      exit_code: 0
      stdout_contains: ["Alice", "Frank", "Grace"]
    tags: ["filter", "order"]

  - name: "high-salary-filter"
    description: "High salary filter"
    args: ["query", "-"]
    stdin: "MATCH (e:EmpBasic) WHERE e.salary > 100000 RETURN e.name, e.salary ORDER BY e.salary DESC"
    expect:
      exit_code: 0
      stdout_contains: ["Alice", "120000", "Frank", "110000"]
    tags: ["filter", "order"]

  # Level 2: Single WITH clause
  - name: "single-with-filter"
    description: "Single WITH clause with filter"
    args: ["query", "-"]
    stdin: "MATCH (e:EmpBasic) WITH e WHERE e.salary > 90000 RETURN e.name"
    expect:
      exit_code: 0
      stdout_contains: ["Alice", "Bob", "Frank", "Grace"]
    tags: ["with", "filter"]

  # Level 3: UNION queries
  - name: "simple-union"
    description: "Simple UNION query"
    args: ["query", "-"]
    stdin: "MATCH (e:EmpBasic) WHERE e.department = 'Engineering' RETURN e.name AS name UNION MATCH (e:EmpBasic) WHERE e.department = 'Sales' RETURN e.name AS name"
    expect:
      exit_code: 0
      stdout_contains: ["Alice", "Bob", "Charlie", "Diana", "Frank"]
    tags: ["union"]

  - name: "union-all-query"
    description: "UNION ALL query"
    args: ["query", "-"]
    stdin: "MATCH (e:EmpBasic) WHERE e.salary > 100000 RETURN e.name AS name UNION ALL MATCH (e:EmpBasic) WHERE e.salary > 90000 RETURN e.name AS name"
    expect:
      exit_code: 0
      stdout_contains: ["Alice"]
    tags: ["union-all"]

  # Level 4: Relationship traversal
  - name: "managers-with-employees"
    description: "Managers with their employees"
    args: ["query", "-"]
    stdin: "MATCH (m:EmpBasic)-[:MANAGES_BASIC]->(e:EmpBasic) RETURN m.name AS manager, e.name AS employee"
    expect:
      exit_code: 0
      stdout_contains: ["Alice", "Bob"]
    tags: ["relationship", "traversal"]

  - name: "employee-department-relationship"
    description: "Employee works in department"
    args: ["query", "-"]
    stdin: "MATCH (e:EmpBasic)-[:WORKS_IN_BASIC]->(d:DeptBasic) WHERE d.name = 'Engineering' RETURN e.name"
    expect:
      exit_code: 0
      stdout_contains: ["Alice", "Bob", "Frank"]
    tags: ["relationship", "filter"]

  - name: "project-assignments"
    description: "Project assignment relationships"
    args: ["query", "-"]
    stdin: "MATCH (e:EmpBasic)-[:ASSIGNED_BASIC]->(p:ProjBasic) WHERE p.name = 'Alpha' RETURN e.name"
    expect:
      exit_code: 0
      stdout_contains: ["Alice", "Bob"]
    tags: ["relationship", "project"]

  # Level 5: Multiple conditions
  - name: "multiple-where-conditions"
    description: "Multiple WHERE conditions with AND"
    args: ["query", "-"]
    stdin: "MATCH (e:EmpBasic) WHERE e.salary > 80000 AND e.department = 'Engineering' RETURN e.name"
    expect:
      exit_code: 0
      stdout_contains: ["Alice", "Bob", "Frank"]
    tags: ["filter", "and"]

  - name: "where-or-conditions"
    description: "WHERE with OR conditions"
    args: ["query", "-"]
    stdin: "MATCH (e:EmpBasic) WHERE e.department = 'HR' OR e.department = 'Marketing' RETURN e.name"
    expect:
      exit_code: 0
      stdout_contains: ["Eve", "Grace", "Henry"]
    tags: ["filter", "or"]

  # Level 7: Property access and comparison
  - name: "property-comparison"
    description: "Property comparison between nodes"
    args: ["query", "-"]
    stdin: "MATCH (d:DeptBasic) WHERE d.budget > 250000 RETURN d.name"
    expect:
      exit_code: 0
      stdout_contains: ["Engineering", "Sales", "Marketing"]
    tags: ["property", "comparison"]

  - name: "department-location-filter"
    description: "Filter departments by location"
    args: ["query", "-"]
    stdin: "MATCH (d:DeptBasic) WHERE d.location = 'NYC' RETURN d.name"
    expect:
      exit_code: 0
      stdout_contains: ["Engineering", "Marketing"]
    tags: ["property", "filter"]
