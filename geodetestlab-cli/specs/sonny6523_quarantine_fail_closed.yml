- name: stop-damage-restart
  description: Stop gracefully (full checkpoint), zero every written nodes.store page, empty labels.idx, remove hydration snapshots, restart
  type: bash
  command: |2

    set -eu
    D="${GEODE_DATA_DIR}"
    # stop the server gracefully: the shutdown checkpoint empties the WALs
    pkill -TERM -f "serve .*--data-dir ${D}" || true
    for i in $(seq 1 120); do
      pgrep -f "serve .*--data-dir ${D}" >/dev/null || break
      sleep 1
    done
    if pgrep -f "serve .*--data-dir ${D}" >/dev/null; then echo SERVER_DID_NOT_STOP; exit 1; fi
    python3 - "$D" <<'PY'
    import os, sys
    PAGE, HDR = 8192, 32
    root = sys.argv[1]
    zeroed = 0
    snaps = 0
    for dp, dn, fn in os.walk(root):
        for f in fn:
            p = os.path.join(dp, f)
            if "/__geode_security" in p or "/graphs/__geode_security" in p:
                continue
            if f == "labels.idx":
                open(p, "wb").close()
            elif f.startswith("hydration_") and f.endswith(".snap"):
                os.remove(p); snaps += 1
            elif f == "nodes.store":
                size = os.path.getsize(p)
                with open(p, "r+b") as fh:
                    page = 0
                    while (page + 1) * PAGE <= size:
                        fh.seek(page * PAGE)
                        if fh.read(HDR).strip(b"\0"):
                            fh.seek(page * PAGE)
                            fh.write(b"\0" * PAGE)
                            zeroed += 1
                        page += 1
    print("ZEROED_PAGES=%d SNAPSHOTS_REMOVED=%d" % (zeroed, snaps))
    if zeroed == 0:
        sys.exit(3)
    PY
    echo DAMAGED
  timeout_ms: 300000
  restart_server: true
  expected:
    exit_code: 0
    stdout_contains:
    - DAMAGED
    stdout_regex:
    - ZEROED_PAGES=[1-9]
  tags:
  - storage
  - quarantine
  - sonny6523
  - damage
  - restart
