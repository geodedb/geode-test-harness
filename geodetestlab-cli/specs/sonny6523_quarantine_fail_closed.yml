# A graph whose first-touch hydration failed is quarantined: every read and
# every write fails closed, never "0" (SONNY-6523), and a graph dropped before a
# restart can be created again afterwards (SONNY-6523 tombstone).
#
# The bug (item 1): when the hydration scan of a graph meets damaged pages the
# graph is quarantined, but the quarantine was noted in a thread-local that only
# the executor's statement gate consumed. The transport fast paths -- the
# label-refcount count, count(*) / count(n), the filtered-count path, the write
# fast paths -- answered from the resident products the failed hydration had
# left partial: `MATCH (n:P) RETURN count(n)` answered 0 for a graph holding
# 300 nodes. A silent wrong answer where an error belongs.
#
# This spec seeds a real `geode serve` (300 nodes, 40 relationships with a
# property, an exact property index; a second graph with 40 nodes), stops it
# gracefully (the shutdown checkpoint empties the WALs), then DAMAGES the
# store on disk the way tests/test_sonny2409* does: every written page of every
# shard's nodes.store is zeroed, labels.idx is emptied and the derived hydration
# snapshots are removed, so the restart's hydration scan meets the damage. After
# the restart each read and each write below must FAIL (exit non-zero with an
# error status), none may answer -- a zero or empty answer included. DROP GRAPH
# of the quarantined second graph still runs (it is how an operator removes
# it), and the name can be created again after a further restart (the dropped
# graph's name is not left tombstoned against CREATE GRAPH).
#
# Not covered here (in-process only, `zig build test-sonny6523-failed-create-count`
# and `test-sonny6523-dropped-graph-restart`): a node create that fails part way
# giving its slot back (needs an injected allocation/engine failure), the
# replicated-Raft-apply write to a dropped graph name after a restart (needs a
# cluster), and the relationship-property SET WAL volume.
#
# CANARY: REQ=REQ-SONNY-6523-QUARANTINE-FAIL-CLOSED; FEATURE="StorageIntegrity"; ASPECT=FailClosed; STATUS=TESTED; TEST=geodetestlab-cli/specs/sonny6523_quarantine_fail_closed.yml; OWNER=storage; UPDATED=2026-11-17

version: '1.0'
name: Quarantined graph fails closed on every read and write (SONNY-6523)
description: After a damaged-page hydration failure every count/scan/write errors instead of answering 0; DROP GRAPH still runs
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 60000
    cleanup: true
    args:
    - --log-level
    - warn
  client:
    timeout_ms: 30000
    tls_verify: false
    format: json
tests:
- name: create-graph-q
  description: second graph that will be damaged too
  args:
  - query
  - '-'
  stdin: CREATE GRAPH g6523q
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
  tags:
  - storage
  - quarantine
  - sonny6523
  - setup
- name: seed
  description: 300 P nodes + 40 R relationships + an exact index in the default graph; 40 Q nodes in g6523q
  type: bash
  command: |2

    set -eu
    G="${GEODE_BINARY}"
    B() { "$G" query --batch --server "${GEODE_SERVER_ADDRESS}" ${GEODE_CLIENT_TLS} -U geode -P "${GEODE_ADMIN_PASSWORD}"; }
    F="${GEODE_DATA_DIR}/seed6523.gql"
    : > "$F"
    i=0
    while [ $i -lt 300 ]; do
      w=gamma; [ $((i % 2)) -eq 0 ] && w=alpha
      printf "CREATE (:P {name: 'p-%05d', i: %d, body: '%s delta'})\n" $i $i $w >> "$F"
      i=$((i+1))
    done
    i=0
    while [ $i -lt 40 ]; do
      printf "MATCH (a:P {name: 'p-%05d'}), (b:P {name: 'p-%05d'}) CREATE (a)-[:R {w: %d}]->(b)\n" $i $((i+1)) $i >> "$F"
      i=$((i+1))
    done
    printf "CREATE INDEX p_name FOR (n:P) ON (n.name)\n" >> "$F"
    B < "$F" > "${GEODE_DATA_DIR}/seed6523.out" 2>&1
    test "$(grep -c '"status_class":"00000"' "${GEODE_DATA_DIR}/seed6523.out")" -eq 341
    F2="${GEODE_DATA_DIR}/seed6523b.gql"
    : > "$F2"
    printf "USE GRAPH g6523q\n" >> "$F2"
    i=0
    while [ $i -lt 40 ]; do printf "CREATE (:Q {i: %d})\n" $i >> "$F2"; i=$((i+1)); done
    B < "$F2" > "${GEODE_DATA_DIR}/seed6523b.out" 2>&1
    test "$(grep -c '"status_class":"00000"' "${GEODE_DATA_DIR}/seed6523b.out")" -eq 41
    echo SEEDED
  timeout_ms: 600000
  expected:
    exit_code: 0
    stdout_contains:
    - SEEDED
  tags:
  - storage
  - quarantine
  - sonny6523
  - setup
- name: healthy-label-count
  description: 'baseline: the label count answers 300 on the healthy store'
  args:
  - query
  - '-'
  stdin: MATCH (n:P) RETURN count(n) AS c
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    - '"rows":[{"c":300}]'
  tags:
