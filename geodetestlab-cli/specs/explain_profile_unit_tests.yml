description: "Unit tests for EXPLAIN and PROFILE commands"
binary: geode
timeout: 30

cli:
  server:
    enabled: true
    port: null
    data_dir: null
    startup_timeout_ms: 30000
    cleanup: true
    args: ["--log-level", "error"]
  client:
    timeout_ms: 30000
    tls_verify: false
    format: "json"

tests:
  # ===============================
  # EXPLAIN TESTS
  # ===============================
  - name: "explain-basic-match"
    description: "Test EXPLAIN with basic MATCH query"
    args: ["query", "-"]
    stdin: "EXPLAIN MATCH (p:Person) RETURN p.name"
    expect:
      exit_code: 0
      geode_query:
        status_class: "00000"
        columns: ["plan"]
    tags: ["explain", "match"]

  - name: "explain-match-with-where"
    description: "Test EXPLAIN with MATCH and WHERE clause"
    args: ["query", "-"]
    stdin: "EXPLAIN MATCH (p:Person) WHERE p.age > 25 RETURN p.name"
    expect:
      exit_code: 0
      geode_query:
        status_class: "00000"
        columns: ["plan"]
    tags: ["explain", "where"]

  - name: "explain-match-with-relationship"
    description: "Test EXPLAIN with relationship pattern"
    args: ["query", "-"]
    stdin: "EXPLAIN MATCH (p:Person)-[:WORKS_FOR]->(c:Company) RETURN p.name, c.name"
    expect:
      exit_code: 0
      geode_query:
        status_class: "00000"
        columns: ["plan"]
    tags: ["explain", "relationship"]

  - name: "explain-create-statement"
    description: "Test EXPLAIN with CREATE statement"
    args: ["query", "-"]
    stdin: "EXPLAIN CREATE (p:Person {name: 'Alice'})"
    expect:
      exit_code: 0
      geode_query:
        status_class: "00000"
        columns: ["plan"]
    tags: ["explain", "create"]

  - name: "explain-delete-statement"
    description: "Test EXPLAIN with DELETE statement"
    args: ["query", "-"]
    stdin: "EXPLAIN MATCH (p:Person) DELETE p"
    expect:
      exit_code: 0
      geode_query:
        status_class: "00000"
        columns: ["plan"]
    tags: ["explain", "delete"]

  - name: "explain-complex-query"
    description: "Test EXPLAIN with complex query including aggregation"
    args: ["query", "-"]
    stdin: "EXPLAIN MATCH (p:Person) RETURN count(p) AS person_count"
    expect:
      exit_code: 0
      geode_query:
        status_class: "00000"
        columns: ["plan"]
    tags: ["explain", "aggregation"]

  - name: "explain-with-order-by"
    description: "Test EXPLAIN with ORDER BY clause"
    args: ["query", "-"]
    stdin: "EXPLAIN MATCH (p:Person) RETURN p.name ORDER BY p.name"
    expect:
      exit_code: 0
      geode_query:
        status_class: "00000"
        columns: ["plan"]
    tags: ["explain", "order_by"]

  - name: "explain-with-limit"
    description: "Test EXPLAIN with LIMIT clause"
    args: ["query", "-"]
    stdin: "EXPLAIN MATCH (p:Person) RETURN p.name LIMIT 10"
    expect:
      exit_code: 0
      geode_query:
        status_class: "00000"
        columns: ["plan"]
    tags: ["explain", "limit"]

  # ===============================
  # PROFILE TESTS
  # ===============================
  - name: "profile-basic-match"
    description: "Test PROFILE with basic MATCH query"
    args: ["query", "-"]
    stdin: |
      CREATE (p1:Person {name: 'Alice'})
      CREATE (p2:Person {name: 'Bob'})
      PROFILE MATCH (p:Person) RETURN p.name
    expect:
      exit_code: 0
      geode_query:
        status_class: "00000"
        columns: ["metric", "value"]
    tags: ["profile", "match"]

  - name: "profile-returns-metrics"
    description: "Test PROFILE returns expected metrics"
    args: ["query", "-"]
    stdin: |
      CREATE (p:Person {name: 'Test'})
      PROFILE MATCH (p:Person) RETURN p.name
    expect:
      exit_code: 0
      geode_query:
        status_class: "00000"
        columns: ["metric", "value"]
        row_count: 3
    tags: ["profile", "metrics"]

  - name: "profile-with-aggregation"
    description: "Test PROFILE with aggregation function"
    args: ["query", "-"]
    stdin: |
      CREATE (p1:Person {name: 'Alice'})
      CREATE (p2:Person {name: 'Bob'})
      PROFILE MATCH (p:Person) RETURN count(p) AS person_count
    expect:
      exit_code: 0
      geode_query:
        status_class: "00000"
        columns: ["metric", "value"]
    tags: ["profile", "aggregation"]

  - name: "profile-with-where-clause"
    description: "Test PROFILE with WHERE clause"
    args: ["query", "-"]
    stdin: |
      CREATE (p1:Person {name: 'Alice', age: 30})
      CREATE (p2:Person {name: 'Bob', age: 25})
      PROFILE MATCH (p:Person) WHERE p.age > 26 RETURN p.name
    expect:
      exit_code: 0
      geode_query:
        status_class: "00000"
        columns: ["metric", "value"]
    tags: ["profile", "where"]

  - name: "profile-create-statement"
    description: "Test PROFILE with CREATE statement"
    args: ["query", "-"]
    stdin: "PROFILE CREATE (p:Person {name: 'ProfileTest'})"
    expect:
      exit_code: 0
      geode_query:
        status_class: "00000"
        columns: ["metric", "value"]
    tags: ["profile", "create"]

  - name: "profile-relationship-pattern"
    description: "Test PROFILE with relationship traversal"
    args: ["query", "-"]
    stdin: |
      CREATE (p:Person {name: 'Alice'})
      CREATE (c:Company {name: 'Acme'})
      CREATE (p)-[:WORKS_FOR]->(c)
      PROFILE MATCH (p:Person)-[:WORKS_FOR]->(c:Company) RETURN p.name, c.name
    expect:
      exit_code: 0
      geode_query:
        status_class: "00000"
        columns: ["metric", "value"]
    tags: ["profile", "relationship"]

  - name: "profile-empty-result"
    description: "Test PROFILE with query returning no results"
    args: ["query", "-"]
    stdin: "PROFILE MATCH (p:NonExistent) RETURN p"
    expect:
      exit_code: 0
      geode_query:
        status_class: "00000"
        columns: ["metric", "value"]
    tags: ["profile", "empty_result"]

  - name: "profile-with-order-by-limit"
    description: "Test PROFILE with ORDER BY and LIMIT"
    args: ["query", "-"]
    stdin: |
      CREATE (p1:Person {name: 'Charlie', age: 35})
      CREATE (p2:Person {name: 'Alice', age: 30})
      CREATE (p3:Person {name: 'Bob', age: 25})
      PROFILE MATCH (p:Person) RETURN p.name, p.age ORDER BY p.age LIMIT 2
    expect:
      exit_code: 0
      geode_query:
        status_class: "00000"
        columns: ["metric", "value"]
    tags: ["profile", "order_limit"]

  # ===============================
  # COMBINED AND EDGE CASES
  # ===============================
  - name: "explain-nested-pattern"
    description: "Test EXPLAIN with nested graph pattern"
    args: ["query", "-"]
    stdin: "EXPLAIN MATCH (a)-[:REL1]->(b)-[:REL2]->(c) RETURN a, b, c"
    expect:
      exit_code: 0
      geode_query:
        status_class: "00000"
        columns: ["plan"]
    tags: ["explain", "nested"]

  - name: "profile-multiple-patterns"
    description: "Test PROFILE with multiple MATCH patterns"
    args: ["query", "-"]
    stdin: |
      CREATE (p:Person {name: 'Alice'})
      CREATE (c:Company {name: 'Acme'})
      PROFILE MATCH (p:Person), (c:Company) RETURN p.name, c.name
    expect:
      exit_code: 0
      geode_query:
        status_class: "00000"
        columns: ["metric", "value"]
    tags: ["profile", "multiple_patterns"]

  - name: "explain-union-query"
    description: "Test EXPLAIN with UNION query"
    args: ["query", "-"]
    stdin: |
      EXPLAIN
      MATCH (p:Person) RETURN p.name AS name
      UNION
      MATCH (c:Company) RETURN c.name AS name
    expect:
      exit_code: 0
      geode_query:
        status_class: "00000"
        columns: ["plan"]
    tags: ["explain", "union"]

  - name: "profile-with-label-test"
    description: "Test PROFILE with label test in WHERE"
    args: ["query", "-"]
    stdin: |
      CREATE (p:Person {name: 'Alice'})
      CREATE (c:Company {name: 'Acme'})
      PROFILE MATCH (n) WHERE n:Person RETURN n.name
    expect:
      exit_code: 0
      geode_query:
        status_class: "00000"
        columns: ["metric", "value"]
    tags: ["profile", "label_test"]

  - name: "explain-merge-statement"
    description: "Test EXPLAIN with MERGE statement"
    args: ["query", "-"]
    stdin: "EXPLAIN MERGE (p:Person {email: 'test@example.com'}) ON CREATE SET p.created = true"
    expect:
      exit_code: 0
      geode_query:
        status_class: "00000"
        columns: ["plan"]
    tags: ["explain", "merge"]
