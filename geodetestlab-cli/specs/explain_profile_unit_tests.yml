version: '1.0'
name: EXPLAIN and PROFILE Unit Tests
description: Unit tests for EXPLAIN and PROFILE commands
cli:
  server:
    enabled: true
    port: null
    data_dir: null
    startup_timeout_ms: 30000
    cleanup: true
    args:
    - --log-level
    - error
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 30000
    tls_verify: false
    format: json
tests:
- name: explain-basic-match
  description: Test EXPLAIN with basic MATCH query
  args:
  - query
  - '-'
  stdin: EXPLAIN MATCH (p:Person) RETURN p.name
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
      columns:
      - plan
  tags:
  - explain
  - match
- name: explain-match-with-where
  description: Test EXPLAIN with MATCH and WHERE clause
  args:
  - query
  - '-'
  stdin: EXPLAIN MATCH (p:Person) WHERE p.age > 25 RETURN p.name
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
      columns:
      - plan
  tags:
  - explain
  - where
- name: explain-match-with-relationship
  description: Test EXPLAIN with relationship pattern
  args:
  - query
  - '-'
  stdin: EXPLAIN MATCH (p:Person)-[:WORKS_FOR]->(c:Company) RETURN p.name, c.name
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
      columns:
      - plan
  tags:
  - explain
  - relationship
- name: explain-create-statement
  description: Test EXPLAIN with CREATE statement
  args:
  - query
  - '-'
  stdin: 'EXPLAIN CREATE (p:Person {name: ''Alice''})'
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
      columns:
      - plan
  tags:
  - explain
  - create
- name: explain-delete-statement
  description: Test EXPLAIN with DELETE statement
  args:
  - query
  - '-'
  stdin: EXPLAIN MATCH (p:Person) DELETE p
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
      columns:
      - plan
  tags:
  - explain
  - delete
- name: explain-complex-query
  description: Test EXPLAIN with complex query including aggregation
  args:
  - query
  - '-'
  stdin: EXPLAIN MATCH (p:Person) RETURN count(p) AS person_count
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
      columns:
      - plan
  tags:
  - explain
  - aggregation
- name: explain-with-order-by
  description: Test EXPLAIN with ORDER BY clause
  args:
  - query
  - '-'
  stdin: EXPLAIN MATCH (p:Person) RETURN p.name ORDER BY p.name
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
      columns:
      - plan
  tags:
  - explain
  - order_by
- name: explain-with-limit
  description: Test EXPLAIN with LIMIT clause
  args:
  - query
  - '-'
  stdin: EXPLAIN MATCH (p:Person) RETURN p.name LIMIT 10
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
      columns:
      - plan
  tags:
  - explain
  - limit
- name: profile-basic-match
  description: Test PROFILE with basic MATCH query
  args:
  - query
  - '-'
  stdin: 'CREATE (p1:Person {name: ''Alice''})

    CREATE (p2:Person {name: ''Bob''})

    PROFILE MATCH (p:Person) RETURN p.name

    '
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
      columns:
      - metric
      - value
  tags:
  - profile
  - match
- name: profile-returns-metrics
  description: Test PROFILE returns expected metrics
  args:
  - query
  - '-'
  stdin: 'CREATE (p:Person {name: ''Test''})

    PROFILE MATCH (p:Person) RETURN p.name

    '
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
      columns:
      - metric
      - value
      row_count: 3
  tags:
  - profile
  - metrics
- name: profile-with-aggregation
  description: Test PROFILE with aggregation function
  args:
  - query
  - '-'
  stdin: 'CREATE (p1:Person {name: ''Alice''})

    CREATE (p2:Person {name: ''Bob''})

    PROFILE MATCH (p:Person) RETURN count(p) AS person_count

    '
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
      columns:
      - metric
      - value
  tags:
  - profile
  - aggregation
- name: profile-with-where-clause
  description: Test PROFILE with WHERE clause
  args:
  - query
  - '-'
  stdin: 'CREATE (p1:Person {name: ''Alice'', age: 30})

    CREATE (p2:Person {name: ''Bob'', age: 25})

    PROFILE MATCH (p:Person) WHERE p.age > 26 RETURN p.name

    '
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
      columns:
      - metric
      - value
  tags:
  - profile
  - where
- name: profile-create-statement
  description: Test PROFILE with CREATE statement
  args:
  - query
  - '-'
  stdin: 'PROFILE CREATE (p:Person {name: ''ProfileTest''})'
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
      columns:
      - metric
      - value
  tags:
  - profile
  - create
- name: profile-relationship-pattern
  description: Test PROFILE with relationship traversal
  args:
  - query
  - '-'
  stdin: 'CREATE (p:Person {name: ''Alice''})

    CREATE (c:Company {name: ''Acme''})

    CREATE (p)-[:WORKS_FOR]->(c)

    PROFILE MATCH (p:Person)-[:WORKS_FOR]->(c:Company) RETURN p.name, c.name

    '
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
      columns:
      - metric
      - value
  tags:
  - profile
  - relationship
- name: profile-empty-result
  description: Test PROFILE with query returning no results
  args:
  - query
  - '-'
  stdin: PROFILE MATCH (p:NonExistent) RETURN p
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
      columns:
      - metric
      - value
  tags:
  - profile
  - empty_result
- name: profile-with-order-by-limit
  description: Test PROFILE with ORDER BY and LIMIT
  args:
  - query
  - '-'
  stdin: 'CREATE (p1:Person {name: ''Charlie'', age: 35})

    CREATE (p2:Person {name: ''Alice'', age: 30})

    CREATE (p3:Person {name: ''Bob'', age: 25})

    PROFILE MATCH (p:Person) RETURN p.name, p.age ORDER BY p.age LIMIT 2

    '
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
      columns:
      - metric
      - value
  tags:
  - profile
  - order_limit
- name: explain-nested-pattern
  description: Test EXPLAIN with nested graph pattern
  args:
  - query
  - '-'
  stdin: EXPLAIN MATCH (a)-[:REL1]->(b)-[:REL2]->(c) RETURN a, b, c
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
      columns:
      - plan
  tags:
  - explain
  - nested
- name: profile-multiple-patterns
  description: Test PROFILE with multiple MATCH patterns
  args:
  - query
  - '-'
  stdin: 'CREATE (p:Person {name: ''Alice''})

    CREATE (c:Company {name: ''Acme''})

    PROFILE MATCH (p:Person), (c:Company) RETURN p.name, c.name

    '
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
      columns:
      - metric
      - value
  tags:
  - profile
  - multiple_patterns
- name: explain-union-query
  description: Test EXPLAIN with UNION query
  args:
  - query
  - '-'
  stdin: 'EXPLAIN

    MATCH (p:Person) RETURN p.name AS name

    UNION

    MATCH (c:Company) RETURN c.name AS name

    '
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
      columns:
      - plan
  tags:
  - explain
  - union
- name: profile-with-label-test
  description: Test PROFILE with label test in WHERE
  args:
  - query
  - '-'
  stdin: 'CREATE (p:Person {name: ''Alice''})

    CREATE (c:Company {name: ''Acme''})

    PROFILE MATCH (n) WHERE n:Person RETURN n.name

    '
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
      columns:
      - metric
      - value
  tags:
  - profile
  - label_test
- name: explain-merge-statement
  description: Test EXPLAIN with MERGE statement
  args:
  - query
  - '-'
  stdin: 'EXPLAIN MERGE (p:Person {email: ''test@example.com''}) ON CREATE SET p.created
    = true'
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
      columns:
      - plan
  tags:
  - explain
  - merge

# ---------------------------------------------------------------------------
# GAP-0867 / GAP-0868 — truthful EXPLAIN estimates + real PROFILE wall-clock
# timing. The geode_query: blocks above are advisory (the harness enforces
# exit_code / stdout_contains / stdout_regex, not geode_query), so these add
# real teeth via stdout assertions against the on-the-wire JSON. A fresh,
# uniquely-labelled fixture pins the estimate to an exact cardinality.
# ---------------------------------------------------------------------------
- name: gap0867-setup-seven-nodes
  description: Seed EXACTLY 7 nodes of a unique label so the CBO estimate is deterministic
  args:
  - query
  - '-'
  stdin: 'CREATE (:Gap0867Est), (:Gap0867Est), (:Gap0867Est), (:Gap0867Est), (:Gap0867Est),
    (:Gap0867Est), (:Gap0867Est)'
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
  tags:
  - explain
  - gap0867
  - setup

- name: gap0867-explain-truthful-estimate
  description: >
    GAP-0867 — EXPLAIN's LabelScan est_rows equals the REAL label cardinality
    (7), sourced from collected statistics (StatsRegistry.analyzeTable over
    the graph store), not a canned/heuristic constant. The totals also carry
    est_rows=7. Pre-fix the CBO was dead code emitting canned estimates.
  args:
  - query
  - '-'
  stdin: EXPLAIN MATCH (n:Gap0867Est) RETURN n
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    - '"schema":"planned_explain.v1"'
    stdout_regex:
    - '"kind":"LabelScan","est_rows":7'
    - '"totals":\{"est_rows":7'
  tags:
  - explain
  - gap0867
  - truthful-estimate

- name: gap0868-profile-real-wallclock-timing
  description: >
    GAP-0868 — PROFILE reports REAL monotonic wall-clock timing: total_time_ns
    is a non-zero integer and the LabelScan op carries its own non-zero
    time_ns, with rows=7 reflecting the actual scan output. Pre-fix the
    fallback reported a hard-coded time=1 placeholder.
  args:
  - query
  - '-'
  stdin: PROFILE MATCH (n:Gap0867Est) RETURN n
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    - '"profile_version":2'
    - '"op":"LabelScan"'
    stdout_regex:
    - '"total_time_ns":[1-9][0-9]*'
    - '"rows":7'
  tags:
  - profile
  - gap0868
  - wallclock-timing

- name: gap0867-cleanup
  description: Remove the GAP-0867/0868 fixture nodes
  args:
  - query
  - '-'
  stdin: MATCH (n:Gap0867Est) DETACH DELETE n
  expect:
    exit_code: 0
  tags:
  - explain
  - gap0867
  - cleanup
