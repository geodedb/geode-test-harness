version: '1.0'
name: EXPLAIN and PROFILE Unit Tests
description: Unit tests for EXPLAIN and PROFILE commands
cli:
  server:
    enabled: true
    port: null
    data_dir: null
    startup_timeout_ms: 30000
    cleanup: true
    args:
    - --log-level
    - error
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 30000
    tls_verify: false
    format: json
tests:
- name: explain-basic-match
  description: Test EXPLAIN with basic MATCH query
  args:
  - query
  - '-'
  stdin: EXPLAIN MATCH (p:Person) RETURN p.name
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
      columns:
      - plan
  tags:
  - explain
  - match
- name: explain-match-with-where
  description: Test EXPLAIN with MATCH and WHERE clause
  args:
  - query
  - '-'
  stdin: EXPLAIN MATCH (p:Person) WHERE p.age > 25 RETURN p.name
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
      columns:
      - plan
  tags:
  - explain
  - where
- name: explain-match-with-relationship
  description: Test EXPLAIN with relationship pattern
  args:
  - query
  - '-'
  stdin: EXPLAIN MATCH (p:Person)-[:WORKS_FOR]->(c:Company) RETURN p.name, c.name
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
      columns:
      - plan
  tags:
  - explain
  - relationship
- name: explain-create-statement
  description: Test EXPLAIN with CREATE statement
  args:
  - query
  - '-'
  stdin: 'EXPLAIN CREATE (p:Person {name: ''Alice''})'
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
      columns:
      - plan
  tags:
  - explain
  - create
- name: explain-delete-statement
  description: Test EXPLAIN with DELETE statement
  args:
  - query
  - '-'
  stdin: EXPLAIN MATCH (p:Person) DELETE p
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
      columns:
      - plan
  tags:
  - explain
  - delete
- name: explain-complex-query
  description: Test EXPLAIN with complex query including aggregation
  args:
  - query
  - '-'
  stdin: EXPLAIN MATCH (p:Person) RETURN count(p) AS person_count
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
      columns:
      - plan
  tags:
  - explain
  - aggregation
- name: explain-with-order-by
  description: Test EXPLAIN with ORDER BY clause
  args:
  - query
  - '-'
  stdin: EXPLAIN MATCH (p:Person) RETURN p.name ORDER BY p.name
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
      columns:
      - plan
  tags:
  - explain
  - order_by
- name: explain-with-limit
  description: Test EXPLAIN with LIMIT clause
  args:
  - query
  - '-'
  stdin: EXPLAIN MATCH (p:Person) RETURN p.name LIMIT 10
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
      columns:
      - plan
  tags:
  - explain
  - limit
- name: profile-basic-match
  description: Test PROFILE with basic MATCH query
  args:
  - query
  - '-'
  stdin: 'CREATE (p1:Person {name: ''Alice''})

    CREATE (p2:Person {name: ''Bob''})

    PROFILE MATCH (p:Person) RETURN p.name

    '
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
      columns:
      - metric
      - value
  tags:
  - profile
  - match
- name: profile-returns-metrics
  description: Test PROFILE returns expected metrics
  args:
  - query
  - '-'
  stdin: 'CREATE (p:Person {name: ''Test''})

    PROFILE MATCH (p:Person) RETURN p.name

    '
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
      columns:
      - metric
      - value
      row_count: 3
  tags:
  - profile
  - metrics
- name: profile-with-aggregation
  description: Test PROFILE with aggregation function
  args:
  - query
  - '-'
  stdin: 'CREATE (p1:Person {name: ''Alice''})

    CREATE (p2:Person {name: ''Bob''})

    PROFILE MATCH (p:Person) RETURN count(p) AS person_count

    '
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
      columns:
      - metric
      - value
  tags:
  - profile
  - aggregation
- name: profile-with-where-clause
  description: Test PROFILE with WHERE clause
  args:
  - query
  - '-'
  stdin: 'CREATE (p1:Person {name: ''Alice'', age: 30})

    CREATE (p2:Person {name: ''Bob'', age: 25})

    PROFILE MATCH (p:Person) WHERE p.age > 26 RETURN p.name

    '
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
      columns:
      - metric
      - value
  tags:
  - profile
  - where
- name: profile-create-statement
  description: Test PROFILE with CREATE statement
  args:
  - query
  - '-'
  stdin: 'PROFILE CREATE (p:Person {name: ''ProfileTest''})'
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
      columns:
      - metric
      - value
  tags:
  - profile
  - create
- name: profile-relationship-pattern
  description: Test PROFILE with relationship traversal
  args:
  - query
  - '-'
  stdin: 'CREATE (p:Person {name: ''Alice''})

    CREATE (c:Company {name: ''Acme''})

    CREATE (p)-[:WORKS_FOR]->(c)

    PROFILE MATCH (p:Person)-[:WORKS_FOR]->(c:Company) RETURN p.name, c.name

    '
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
      columns:
      - metric
      - value
  tags:
  - profile
  - relationship
- name: profile-empty-result
  description: Test PROFILE with query returning no results
  args:
  - query
  - '-'
  stdin: PROFILE MATCH (p:NonExistent) RETURN p
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
      columns:
      - metric
      - value
  tags:
  - profile
  - empty_result
- name: profile-with-order-by-limit
  description: Test PROFILE with ORDER BY and LIMIT
  args:
  - query
  - '-'
  stdin: 'CREATE (p1:Person {name: ''Charlie'', age: 35})

    CREATE (p2:Person {name: ''Alice'', age: 30})

    CREATE (p3:Person {name: ''Bob'', age: 25})

    PROFILE MATCH (p:Person) RETURN p.name, p.age ORDER BY p.age LIMIT 2

    '
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
      columns:
      - metric
      - value
  tags:
  - profile
  - order_limit
- name: explain-nested-pattern
  description: Test EXPLAIN with nested graph pattern
  args:
  - query
  - '-'
  stdin: EXPLAIN MATCH (a)-[:REL1]->(b)-[:REL2]->(c) RETURN a, b, c
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
      columns:
      - plan
  tags:
  - explain
  - nested
- name: profile-multiple-patterns
  description: Test PROFILE with multiple MATCH patterns
  args:
  - query
  - '-'
  stdin: 'CREATE (p:Person {name: ''Alice''})

    CREATE (c:Company {name: ''Acme''})

    PROFILE MATCH (p:Person), (c:Company) RETURN p.name, c.name

    '
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
      columns:
      - metric
      - value
  tags:
  - profile
  - multiple_patterns
- name: explain-union-query
  description: Test EXPLAIN with UNION query
  args:
  - query
  - '-'
  stdin: 'EXPLAIN

    MATCH (p:Person) RETURN p.name AS name

    UNION

    MATCH (c:Company) RETURN c.name AS name

    '
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
      columns:
      - plan
  tags:
  - explain
  - union
- name: profile-with-label-test
  description: Test PROFILE with label test in WHERE
  args:
  - query
  - '-'
  stdin: 'CREATE (p:Person {name: ''Alice''})

    CREATE (c:Company {name: ''Acme''})

    PROFILE MATCH (n) WHERE n:Person RETURN n.name

    '
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
      columns:
      - metric
      - value
  tags:
  - profile
  - label_test
- name: explain-merge-statement
  description: Test EXPLAIN with MERGE statement
  args:
  - query
  - '-'
  stdin: 'EXPLAIN MERGE (p:Person {email: ''test@example.com''}) ON CREATE SET p.created
    = true'
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
      columns:
      - plan
  tags:
  - explain
  - merge

# ---------------------------------------------------------------------------
# GAP-0867 — truthful EXPLAIN estimates. The geode_query: blocks above are
# advisory (the harness enforces exit_code / stdout_contains / stdout_regex,
# not geode_query), so these add real teeth via stdout assertions against the
# on-the-wire JSON. A fresh, uniquely-labelled fixture pins the estimate to an
# exact cardinality.
#
# GAP-0868 scope note: GAP-0868 replaced a hard-coded time=1 placeholder in
# statement_handlers.zig::executeProfile — reached ONLY for non-Query PROFILE
# statements (SHOW/DDL) or reads demoted by the concrete-tenant guard. Probing
# the release binary shows those PROFILE classes are served over the QUIC/gRPC
# transports by the server's synthetic buildProfilePayload (profile_version 1,
# constant per-op ns like 10/20/30), NOT by executeProfile — so GAP-0868's
# CLOCK_MONOTONIC time_ms path is not reachable black-box and stays covered by
# geode's test-gap0868 CI. The planned-read timing test below asserts the
# PRE-EXISTING RuntimeTrace path (profile_version 2), which the GAP-0868 commit
# itself documents as unaffected — it is NOT credited as GAP-0868 coverage.
# ---------------------------------------------------------------------------
- name: gap0867-setup-seven-nodes
  description: Seed EXACTLY 7 nodes of a unique label so the CBO estimate is deterministic
  args:
  - query
  - '-'
  stdin: 'CREATE (:Gap0867Est), (:Gap0867Est), (:Gap0867Est), (:Gap0867Est), (:Gap0867Est),
    (:Gap0867Est), (:Gap0867Est)'
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
  tags:
  - explain
  - gap0867
  - setup

- name: gap0867-explain-truthful-estimate
  description: >
    GAP-0867 — EXPLAIN's LabelScan est_rows equals the REAL label cardinality
    (7), sourced from collected statistics (StatsRegistry.analyzeTable over
    the graph store), not a canned/heuristic constant. The totals also carry
    est_rows=7. Pre-fix the CBO was dead code emitting canned estimates.
  args:
  - query
  - '-'
  stdin: EXPLAIN MATCH (n:Gap0867Est) RETURN n
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    - '"schema":"planned_explain.v1"'
    stdout_regex:
    - '"kind":"LabelScan","est_rows":7'
    - '"totals":\{"est_rows":7'
  tags:
  - explain
  - gap0867
  - truthful-estimate

- name: profile-planned-read-real-timing
  description: >
    PROFILE on a planned-read (MATCH) reports REAL monotonic timing:
    total_time_ns AND the profiled LabelScan op's OWN time_ns are both non-zero
    integers (profile_version 2 RuntimeTrace), with rows=7 reflecting the actual
    scan output — a per-op zero (a fake/placeholder timer) would fail the
    per-op regex. NOTE: this is the PRE-EXISTING planned-read RuntimeTrace path,
    NOT GAP-0868's executeProfile fallback (which is not reachable over network
    transports — see the scope note above); it is not credited as GAP-0868
    coverage.
  args:
  - query
  - '-'
  stdin: PROFILE MATCH (n:Gap0867Est) RETURN n
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    - '"profile_version":2'
    - '"op":"LabelScan"'
    stdout_regex:
    - '"total_time_ns":[1-9][0-9]*'
    - '"time_ns":[1-9][0-9]*'
    - '"rows":7'
  tags:
  - profile
  - planned-read-timing

- name: gap0867-cleanup
  description: Remove the GAP-0867 fixture nodes
  args:
  - query
  - '-'
  stdin: MATCH (n:Gap0867Est) DETACH DELETE n
  expect:
    exit_code: 0
  tags:
  - explain
  - gap0867
  - cleanup
