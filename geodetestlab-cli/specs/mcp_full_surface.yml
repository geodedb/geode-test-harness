  tags:
  - gap-0345
  - mcp
  - call-tool
  - invalid-args
  - error-mapping

# ---------------------------------------------------------------------------
# Phase 5: call_tool with syntactically invalid GQL
# ---------------------------------------------------------------------------

- name: 'GAP-0345-CALL-003: call_tool with bad GQL returns error not panic'
  description: |
    Pass "SELEC * FORM nodes" (invalid GQL) to the GQL execution tool.
    Assert no crash (exit code not 139/134) and an error signal in the response.
  type: bash
  command: |
    SCRIPT=$(mktemp --suffix=.py)
    cat > "$SCRIPT" << 'SCRIPTEOF'
    import subprocess, json, sys, os, select, time

    geode_bin = os.environ.get("GEODE_BINARY", "./zig-out/bin/geode")
    server_addr = os.environ.get("GEODE_SERVER_ADDRESS", "127.0.0.1:3141")
    _pw = os.environ.get("GEODE_ADMIN_PASSWORD", "Geode Test Admin Passphrase")
    _sep = "&" if "?" in server_addr else "?"
    endpoint_dsn = server_addr + _sep + "user=geode&pass=" + _pw + "&insecure_tls_skip_verify=true"

    def mcp_frame(msg):
        return (json.dumps(msg) + "\n").encode()

    def read_mcp(proc, timeout_secs=8):
        deadline = time.time() + timeout_secs
        while time.time() < deadline:
            ready = select.select([proc.stdout], [], [], 0.2)[0]
            if ready:
                line = proc.stdout.readline()
                if line:
                    line = line.strip()
                    if line:
                        return json.loads(line)
        return None

    proc = subprocess.Popen(
        [geode_bin, "mcp", "--stdio", "--no-auth", "--endpoint", endpoint_dsn],
        stdin=subprocess.PIPE, stdout=subprocess.PIPE, stderr=subprocess.DEVNULL
    )
    try:
        proc.stdin.write(mcp_frame({"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"geode-test-harness","version":"1.0"}}}))
        proc.stdin.flush()
        read_mcp(proc, timeout_secs=10)

        proc.stdin.write(mcp_frame({"jsonrpc":"2.0","method":"notifications/initialized","params":{}}))
        proc.stdin.flush()

        proc.stdin.write(mcp_frame({"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}))
        proc.stdin.flush()

        list_resp = None
        for _ in range(10):
            r = read_mcp(proc, timeout_secs=5)
            if r and r.get("id") == 2:
                list_resp = r
                break

        if list_resp is None:
            print("call_tool_bad_gql=skipped reason=tools_list_failed")
            sys.exit(0)

        tools = (list_resp.get("result") or {}).get("tools", [])
        if not tools:
            print("call_tool_bad_gql=skipped reason=no_tools_listed")
            sys.exit(0)

        gql_tool = next(
            (t for t in tools if any(kw in t.get("name","").lower() for kw in ["query","execute","gql","run"])),
            tools[0]
        )
        tool_name = gql_tool["name"]
        schema = gql_tool.get("inputSchema") or {}
        props = schema.get("properties") or {}
        query_param = next(
            (k for k in props if k.lower() in ("query","gql","statement","sql","text")),
            "query"
        )

        proc.stdin.write(mcp_frame({"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":tool_name,"arguments":{query_param:"SELEC * FORM nodes"}}}))
        proc.stdin.flush()

        call_resp = None
        for _ in range(10):
            r = read_mcp(proc, timeout_secs=8)
            if r and r.get("id") == 3:
                call_resp = r
                break

        if call_resp is None:
            print("call_tool_bad_gql=error tool=" + tool_name + " no_response=true")
            sys.exit(1)

        has_rpc_error = bool(call_resp.get("error"))
        result = call_resp.get("result") or {}
        is_error_content = result.get("isError", False)
        content = result.get("content") or []
        content_text = " ".join(c.get("text","") for c in content if isinstance(c, dict)).lower() if isinstance(content, list) else ""
        rpc_msg = ((call_resp.get("error") or {}).get("message") or "").lower()
        error_mentioned = any(kw in content_text + rpc_msg for kw in ["parse","syntax","error","invalid","unexpected","unknown"])

        print("call_tool_bad_gql=ok tool=" + tool_name + " has_rpc_error=" + str(has_rpc_error) + " is_error_content=" + str(is_error_content) + " error_mentioned=" + str(error_mentioned))
        sys.exit(0 if (has_rpc_error or is_error_content) else 1)
    finally:
        try:
            proc.stdin.close()
        except Exception:
            pass
        exit_code = proc.wait(timeout=5)
        if exit_code in (-11, 139, -6, 134):
            print("GEODE_BUG: mcp server crashed on bad GQL exit_code=" + str(exit_code))
            sys.exit(1)
    SCRIPTEOF
    python3 "$SCRIPT"
    STATUS=$?
    rm -f "$SCRIPT"
    exit $STATUS
  timeout_ms: 30000
  expect:
    exit_code: 0
    stdout_contains:
    - call_tool_bad_gql=ok
  tags:
  - gap-0345
  - mcp
  - call-tool
  - bad-gql
  - error-mapping

# ---------------------------------------------------------------------------
