        is_error_content = result.get("isError", False)
        error_code = (call_resp.get("error") or {}).get("code", 0)
        print("call_tool_unknown=ok has_rpc_error=" + str(has_rpc_error) + " is_error_content=" + str(is_error_content) + " error_code=" + str(error_code))
        sys.exit(0 if (has_rpc_error or is_error_content) else 1)
    finally:
        try:
            proc.stdin.close()
        except Exception:
            pass
        proc.wait(timeout=5)
