version: '1.0'
name: ABAC attribute-based policies — end-to-end row-level enforcement
description: |
  Verifies real per-row ABAC enforcement: a row-level RLS expression policy
  compares each :Doc row's `dept` property against the querying principal's
  `department` attribute, so alice (department=engineering) sees ONLY
  :Doc {dept:'engineering'} and bob (department=sales) sees ONLY
  :Doc {dept:'sales'}. Admin (BYPASSRLS) sees every row.

  Mechanism:
    1. `ALTER USER <name> SET ATTRIBUTE department = '<value>'` stores the
       attribute in the process-global ABAC side-table
       (src/security/user_attribute_store.zig).
    2. `CALL geode.rls.add_attribute_policy('abac_g','Doc','dept','department')`
       installs a restrictive expression policy on (graph=abac_g, label=Doc)
       whose `using_expr` is `row.dept = principal.attribute.department`
       (src/execution/rls_dispatch.zig).
    3. The RLS bytecode VM resolves `principal.attribute.<key>` per row
       against the attribute store for the querying username — opcode
       load_attr (0x13) in src/security/rls_core.zig — and the match loop
       enforces it via passesRLSExprFilter (src/execution/match_operations.zig).

  CANARY: REQ=GAP-0284; FEATURE="ABAC end-to-end row-level enforcement"; ASPECT=DeptAttributePolicyMatrix; STATUS=TESTED; OWNER=security; UPDATED=2026-05-22

cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 60000
    cleanup: true
    args: [--log-level, warn]
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 30000
    format: json
secrets:
  admin_password:
    source: env
    key: GEODE_ADMIN_PASSWORD
    required: false
    default: GeodeTestPassword123!
invariants:
- type: server_running
fuzz:
  enabled: false

tests:
- name: abac-preflight-cleanup
  description: Drop leftovers from prior run.
  args: [query, -U, geode, -P, '${secret:admin_password}', '-']
  stdin: |
    DROP USER IF EXISTS abac_alice;
    DROP USER IF EXISTS abac_bob;
    DROP GRAPH IF EXISTS abac_g;
  expect: {exit_code: 0}
  tags: [abac, setup]

- name: abac-create-graph-and-users
  args: [query, -U, geode, -P, '${secret:admin_password}', --batch, '-']
  stdin: |
    CREATE GRAPH abac_g;
    CREATE USER abac_alice SET PASSWORD 'Abac-Alice-1234' ROLE readwrite;
    CREATE USER abac_bob SET PASSWORD 'Abac-Bob-1234' ROLE readwrite;
  expect: {exit_code: 0}
  tags: [abac, setup]

- name: abac-set-alice-attr
  description: Set alice's department attribute in the ABAC side-table.
  args: [query, -U, geode, -P, '${secret:admin_password}', ALTER USER abac_alice SET ATTRIBUTE department = 'engineering']
  expect: {exit_code: 0}
  tags: [abac, setup]

- name: abac-set-bob-attr
  description: Set bob's department attribute in the ABAC side-table.
  args: [query, -U, geode, -P, '${secret:admin_password}', ALTER USER abac_bob SET ATTRIBUTE department = 'sales']
  expect: {exit_code: 0}
  tags: [abac, setup]

- name: abac-seed-docs
  args: [query, -U, geode, -P, '${secret:admin_password}', '-']
  stdin: |
    USE GRAPH abac_g;
    CREATE (:Doc {id: 1, dept: 'engineering', payload: 'eng-data'});
    CREATE (:Doc {id: 2, dept: 'sales', payload: 'sales-data'});
  expect: {exit_code: 0}
  tags: [abac, setup]

- name: abac-install-attribute-policy
  description: |
    Install the row-level ABAC policy: each :Doc row is visible only when
    row.dept equals the querying principal's `department` attribute.
  args: [query, -U, geode, -P, '${secret:admin_password}', "CALL geode.rls.add_attribute_policy('abac_g', 'Doc', 'dept', 'department')"]
  expect:
    exit_code: 0
    stdout_contains: [attribute policy added]
  tags: [abac, policy]

- name: abac-alice-sees-eng-only
  description: POSITIVE — alice (department=engineering) sees only engineering docs.
  args: [query, -U, abac_alice, -P, Abac-Alice-1234, '-']
  stdin: |
    USE GRAPH abac_g;
    MATCH (d:Doc) RETURN d.dept AS dept ORDER BY d.id
  expect:
    exit_code: 0
    stdout_contains: [engineering]
    stdout_not_contains: [sales]
  tags: [abac, alice, positive]

- name: abac-alice-count-is-one
  description: POSITIVE — alice's row count is exactly 1 (engineering doc only).
  args: [query, -U, abac_alice, -P, Abac-Alice-1234, '-']
  stdin: |
    USE GRAPH abac_g;
    MATCH (d:Doc) RETURN count(d) AS c
  expect: {exit_code: 0, stdout_contains: ['"c":1']}
  tags: [abac, alice, positive]

- name: abac-bob-sees-sales-only
  description: POSITIVE — bob (department=sales) sees only sales docs.
  args: [query, -U, abac_bob, -P, Abac-Bob-1234, '-']
  stdin: |
    USE GRAPH abac_g;
    MATCH (d:Doc) RETURN d.dept AS dept ORDER BY d.id
  expect:
    exit_code: 0
    stdout_contains: [sales]
    stdout_not_contains: [engineering]
  tags: [abac, bob, positive]

- name: abac-bob-count-is-one
  description: POSITIVE — bob's row count is exactly 1 (sales doc only).
  args: [query, -U, abac_bob, -P, Abac-Bob-1234, '-']
  stdin: |
    USE GRAPH abac_g;
    MATCH (d:Doc) RETURN count(d) AS c
  expect: {exit_code: 0, stdout_contains: ['"c":1']}
  tags: [abac, bob, positive]

- name: abac-admin-sees-all
  description: POSITIVE — admin (BYPASSRLS) sees all docs.
  args: [query, -U, geode, -P, '${secret:admin_password}', '-']
  stdin: |
    USE GRAPH abac_g;
    MATCH (d:Doc) RETURN count(d) AS c
  expect: {exit_code: 0, stdout_contains: ['"c":2']}
  tags: [abac, admin, positive]

- name: abac-remove-attribute-policy
  description: remove_attribute_policy tears down the row-level ABAC policy.
  args: [query, -U, geode, -P, '${secret:admin_password}', "CALL geode.rls.remove_attribute_policy('abac_g', 'Doc', 'dept', 'department')"]
  expect:
    exit_code: 0
    stdout_contains: [attribute policy removed, removed=true]
  tags: [abac, policy]

- name: abac-alice-sees-all-after-removal
  description: POSITIVE — with the policy removed, alice sees both docs again.
  args: [query, -U, abac_alice, -P, Abac-Alice-1234, '-']
  stdin: |
    USE GRAPH abac_g;
    MATCH (d:Doc) RETURN count(d) AS c
  expect: {exit_code: 0, stdout_contains: ['"c":2']}
  tags: [abac, alice, positive]

- name: abac-cleanup
  args: [query, -U, geode, -P, '${secret:admin_password}', '-']
  stdin: |
    DROP GRAPH IF EXISTS abac_g;
    DROP USER IF EXISTS abac_alice;
    DROP USER IF EXISTS abac_bob;
  expect: {exit_code: 0}
  tags: [abac, teardown]

tags:
- abac
- attribute-based-access-control
- security
- rls
