  - "CREATE (n:SharedService { service_type: 'audit_log', tenant_a_action: 'TENANT_A_AUDIT_LOGIN_USER_XYZ', tenant_b_action: 'TENANT_B_AUDIT_QUERY_SENSITIVE_DATA', system_note: 'SHARED_SYSTEM_NOTE_INTERNAL_ONLY' }) RETURN n.service_type AS service"
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
  tags:
  - tde
  - multitenant
  - shared
  - write
- name: tde-multitenant-verify-tenant-a-only
  description: Verify Tenant A data query isolation
  args:
  - query
  - MATCH (n) WHERE n.tenant_id = 'tenant_a' RETURN count(*) AS tenant_a_count
