version: '1.0'
name: TDE Plaintext Verification - Multi-Tenant Isolation
description: "SECURITY CRITICAL TEST SUITE - MULTI-TENANT\n\nVerifies that TDE maintains proper encryption isolation in multi-tenant scenarios.\nEach tenant's data must be encrypted with tenant-specific keys and no tenant\ndata should appear in plaintext.\n\nThis test ensures:\n1. Tenant A's data is encrypted\n2. Tenant B's data is encrypted\n3. No cross-tenant data leakage\n4. Tenant-specific markers don't appear in any files\n5. Shared infrastructure doesn't expose tenant data\n\nMulti-tenant considerations:\n- Separate key hierarchies per tenant\n- Proper key isolation\n- No plaintext in shared logs\n- No plaintext in system metadata\n\nCANARY: REQ=REQ-TDE-ENFORCE-007; FEATURE=TDEEnforcement; ASPECT=MultiTenant; STATUS=TESTED; OWNER=security; UPDATED=2026-01-28\n"
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 30000
    cleanup: false
    args:
    - --log-level
    - info
    - --enable-tde
    # SONNY-6422/6442: --enable-wal-encryption was removed; the WAL is encrypted by the engine under GEODE_TDE_KEY
    - --tde-provider
    - MockKms
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 15000
    tls_verify: false
    format: json
env:
  GEODE_TDE_KEY: aaaaaaaaaaaaaaaa1111111111111111bbbbbbbbbbbbbbbb2222222222222222
  # SONNY-6422: GEODE_WAL_KEY removed (server refuses it); the WAL is encrypted by GEODE_TDE_KEY
  GEODE_TDE_ENABLED: 'true'
  GEODE_WAL_ENCRYPTION_ENABLED: 'true'
tests:
- name: tde-multitenant-tenant-a-pii
  description: Write Tenant A PII data
  args:
  - query
  - "CREATE (n:TenantA_Customer { tenant_id: 'tenant_a', customer_id: 'TENANT_A_CUST_001', ssn: 'TENANT_A_SSN_111223333', email: 'TENANT_A_EMAIL_secret@tenanta.com', credit_card: 'TENANT_A_CC_4111111111111111', balance: 50000.00 }) RETURN n.customer_id AS customer"
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
  tags:
  - tde
  - multitenant
  - tenant-a
  - pii
  - write
- name: tde-multitenant-tenant-a-financial
  description: Write Tenant A financial data
  args:
  - query
  - "CREATE (n:TenantA_Account { tenant_id: 'tenant_a', account_number: 'TENANT_A_ACCT_987654321', routing_number: 'TENANT_A_RTN_021000021', secret_notes: 'TENANT_A_NOTES_Confidential_Account_Info' }) RETURN n.account_number AS account"
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
  tags:
  - tde
  - multitenant
  - tenant-a
  - financial
  - write
- name: tde-multitenant-tenant-a-api-keys
  description: Write Tenant A API credentials
  args:
  - query
  - "CREATE (n:TenantA_Credentials { tenant_id: 'tenant_a', api_key: 'TENANT_A_APIKEY_sk_live_abc123def456', api_secret: 'TENANT_A_APISECRET_whsec_xyz789', webhook_secret: 'TENANT_A_WEBHOOK_wh_secret_123' }) RETURN n.api_key AS key"
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
  tags:
  - tde
  - multitenant
  - tenant-a
  - credentials
  - write
- name: tde-multitenant-tenant-b-pii
  description: Write Tenant B PII data
  args:
  - query
  - "CREATE (n:TenantB_Customer { tenant_id: 'tenant_b', customer_id: 'TENANT_B_CUST_001', ssn: 'TENANT_B_SSN_444556666', email: 'TENANT_B_EMAIL_private@tenantb.com', credit_card: 'TENANT_B_CC_5500000000000004', balance: 75000.00 }) RETURN n.customer_id AS customer"
