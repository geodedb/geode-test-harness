version: "1.0"
name: "GQL Type System Comprehensive Tests"
description: "Complete ISO/IEC 39075:2024 type system testing covering all data types, literals, type operations, and type conversions"

cli:
  binary: "./zig-out/bin/geode"
  server:
    enabled: true
    port: null
    data_dir: null
    startup_timeout_ms: 30000
    cleanup: true
    args: ["--log-level", "info"]
  client:
    timeout_ms: 15000
    tls_verify: false
    format: "json"

tests:
  # ===============================
  # BASIC SCALAR TYPES
  # ===============================

  - name: "type-boolean-true"
    description: "Test boolean true literal"
    args: ["query", "RETURN true AS bool_value"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["bool_value"]
      stdout_json_assert:
        - expression: "results[0].bool_value"
          equals: true
    tags: ["type-system", "boolean", "literal"]

  - name: "type-boolean-false"
    description: "Test boolean false literal"
    args: ["query", "RETURN false AS bool_value"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["bool_value"]
      stdout_json_assert:
        - expression: "results[0].bool_value"
          equals: false
    tags: ["type-system", "boolean", "literal"]

  - name: "type-null"
    description: "Test null literal"
    args: ["query", "RETURN null AS null_value"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["null_value"]
      stdout_json_assert:
        - expression: "results[0].null_value"
          equals: null
    tags: ["type-system", "null", "literal"]

  # ===============================
  # INTEGER TYPES
  # ===============================

  - name: "type-integer-positive"
    description: "Test positive integer literal"
    args: ["query", "RETURN 42 AS int_value"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["int_value"]
      stdout_json_assert:
        - expression: "results[0].int_value"
          equals: 42
    tags: ["type-system", "integer", "positive"]

  - name: "type-integer-negative"
    description: "Test negative integer literal"
    args: ["query", "RETURN -123 AS neg_int_value"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["neg_int_value"]
      stdout_json_assert:
        - expression: "results[0].neg_int_value"
          equals: -123
    tags: ["type-system", "integer", "negative"]

  - name: "type-integer-zero"
    description: "Test zero integer literal"
    args: ["query", "RETURN 0 AS zero_value"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["zero_value"]
      stdout_json_assert:
        - expression: "results[0].zero_value"
          equals: 0
    tags: ["type-system", "integer", "zero"]

  - name: "type-integer-large"
    description: "Test large integer literal"
    args: ["query", "RETURN 9223372036854775807 AS large_int"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["large_int"]
    tags: ["type-system", "integer", "large"]

  # ===============================
  # DECIMAL/FLOAT TYPES
  # ===============================

  - name: "type-decimal-positive"
    description: "Test positive decimal literal"
    args: ["query", "RETURN 3.14159 AS decimal_value"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["decimal_value"]
      stdout_json_assert:
        - expression: "results[0].decimal_value"
          equals: 3.14159
    tags: ["type-system", "decimal", "positive"]

  - name: "type-decimal-negative"
    description: "Test negative decimal literal"
    args: ["query", "RETURN -2.71828 AS neg_decimal"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["neg_decimal"]
      stdout_json_assert:
        - expression: "results[0].neg_decimal"
          equals: -2.71828
    tags: ["type-system", "decimal", "negative"]

  - name: "type-decimal-scientific"
    description: "Test scientific notation decimal literal"
    args: ["query", "RETURN 1.23e-4 AS scientific_value"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["scientific_value"]
      stdout_json_assert:
        - expression: "results[0].scientific_value"
          equals: 0.000123
    tags: ["type-system", "decimal", "scientific"]

  - name: "type-decimal-zero"
    description: "Test zero decimal literal"
    args: ["query", "RETURN 0.0 AS zero_decimal"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["zero_decimal"]
      stdout_json_assert:
        - expression: "results[0].zero_decimal"
          equals: 0.0
    tags: ["type-system", "decimal", "zero"]

  # ===============================
  # STRING TYPES
  # ===============================

  - name: "type-string-simple"
    description: "Test simple string literal"
    args: ["query", "RETURN 'Hello World' AS string_value"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["string_value"]
      stdout_json_assert:
        - expression: "results[0].string_value"
          equals: "Hello World"
    tags: ["type-system", "string", "simple"]

  - name: "type-string-empty"
    description: "Test empty string literal"
    args: ["query", "RETURN '' AS empty_string"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["empty_string"]
      stdout_json_assert:
        - expression: "results[0].empty_string"
          equals: ""
    tags: ["type-system", "string", "empty"]

  - name: "type-string-with-quotes"
    description: "Test string literal with embedded quotes"
    args: ["query", "RETURN 'He said \\'Hello\\'' AS quoted_string"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["quoted_string"]
      stdout_json_assert:
        - expression: "results[0].quoted_string"
          equals: "He said 'Hello'"
    tags: ["type-system", "string", "quotes"]

  - name: "type-string-special-characters"
    description: "Test string literal with special characters"
    args: ["query", "RETURN 'Line1\\nLine2\\tTabbed' AS special_chars"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["special_chars"]
    tags: ["type-system", "string", "special-chars"]

  - name: "type-string-unicode"
    description: "Test string literal with Unicode characters"
    args: ["query", "RETURN 'Hello 世界 🌍' AS unicode_string"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["unicode_string"]
      stdout_json_assert:
        - expression: "results[0].unicode_string"
          equals: "Hello 世界 🌍"
    tags: ["type-system", "string", "unicode"]

  # ===============================
  # LIST TYPES
  # ===============================

  - name: "type-list-integers"
    description: "Test list of integers"
    args: ["query", "RETURN [1, 2, 3, 4, 5] AS int_list"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["int_list"]
    tags: ["type-system", "list", "integers"]

  - name: "type-list-strings"
    description: "Test list of strings"
    args: ["query", "RETURN ['apple', 'banana', 'cherry'] AS string_list"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["string_list"]
    tags: ["type-system", "list", "strings"]

  - name: "type-list-mixed"
    description: "Test list with mixed types"
    args: ["query", "RETURN [1, 'text', true, null, 3.14] AS mixed_list"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["mixed_list"]
    tags: ["type-system", "list", "mixed"]

  - name: "type-list-empty"
    description: "Test empty list"
    args: ["query", "RETURN [] AS empty_list"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["empty_list"]
    tags: ["type-system", "list", "empty"]

  - name: "type-list-nested"
    description: "Test nested lists"
    args: ["query", "RETURN [[1, 2], [3, 4], [5, 6]] AS nested_list"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["nested_list"]
    tags: ["type-system", "list", "nested"]

  # ===============================
  # MAP TYPES
  # ===============================

  - name: "type-map-simple"
    description: "Test simple map literal"
    args: ["query", "RETURN {name: 'Alice', age: 30, active: true} AS person_map"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["person_map"]
    tags: ["type-system", "map", "simple"]

  - name: "type-map-empty"
    description: "Test empty map literal"
    args: ["query", "RETURN {} AS empty_map"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["empty_map"]
    tags: ["type-system", "map", "empty"]

  - name: "type-map-nested"
    description: "Test nested map literal"
    args: ["query", "RETURN {person: {name: 'Bob', details: {age: 25, city: 'Boston'}}} AS nested_map"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["nested_map"]
    tags: ["type-system", "map", "nested"]

  - name: "type-map-with-lists"
    description: "Test map containing lists"
    args: ["query", "RETURN {scores: [85, 92, 78], subjects: ['math', 'science', 'english']} AS map_with_lists"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["map_with_lists"]
    tags: ["type-system", "map", "with-lists"]

  # ===============================
  # DATE AND TIME TYPES
  # ===============================

  - name: "type-date-literal"
    description: "Test date literal"
    args: ["query", "RETURN date('2024-01-15') AS date_value"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["date_value"]
    tags: ["type-system", "date", "literal"]

  - name: "type-time-literal"
    description: "Test time literal"
    args: ["query", "RETURN time('14:30:25') AS time_value"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["time_value"]
    tags: ["type-system", "time", "literal"]

  - name: "type-datetime-literal"
    description: "Test datetime literal"
    args: ["query", "RETURN datetime('2024-01-15T14:30:25') AS datetime_value"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["datetime_value"]
    tags: ["type-system", "datetime", "literal"]

  - name: "type-datetime-with-timezone"
    description: "Test datetime with timezone"
    args: ["query", "RETURN datetime('2024-01-15T14:30:25+05:00') AS datetime_tz"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["datetime_tz"]
    tags: ["type-system", "datetime", "timezone"]

  # ===============================
  # TYPE OPERATIONS
  # ===============================

  - name: "type-function-type-of"
    description: "Test type() function"
    args: ["query", "RETURN type(42) AS int_type, type('text') AS string_type, type(true) AS bool_type, type([1,2,3]) AS list_type"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["int_type", "string_type", "bool_type", "list_type"]
    tags: ["type-system", "operations", "type-function"]

  - name: "type-function-exists"
    description: "Test exists() function"
    setup:
      - args: ["query", "CREATE (n:TypeTest {existing_prop: 'value'})"]
        expect:
          exit_code: 0
    args: ["query", "MATCH (n:TypeTest) RETURN exists(n.existing_prop) AS has_prop, exists(n.missing_prop) AS missing_prop"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["has_prop", "missing_prop"]
      stdout_json_assert:
        - expression: "results[0].has_prop"
          equals: true
        - expression: "results[0].missing_prop"
          equals: false
    tags: ["type-system", "operations", "exists"]

  # ===============================
  # TYPE CONVERSION FUNCTIONS
  # ===============================

  - name: "type-conversion-to-string"
    description: "Test toString() function"
    args: ["query", "RETURN toString(42) AS int_to_string, toString(3.14) AS float_to_string, toString(true) AS bool_to_string"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["int_to_string", "float_to_string", "bool_to_string"]
      stdout_json_assert:
        - expression: "results[0].int_to_string"
          equals: "42"
        - expression: "results[0].float_to_string"
          equals: "3.14"
        - expression: "results[0].bool_to_string"
          equals: "true"
    tags: ["type-system", "conversion", "to-string"]

  - name: "type-conversion-to-integer"
    description: "Test toInteger() function"
    args: ["query", "RETURN toInteger('42') AS string_to_int, toInteger(3.14) AS float_to_int, toInteger(true) AS bool_to_int"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["string_to_int", "float_to_int", "bool_to_int"]
      stdout_json_assert:
        - expression: "results[0].string_to_int"
          equals: 42
        - expression: "results[0].float_to_int"
          equals: 3
        - expression: "results[0].bool_to_int"
          equals: 1
    tags: ["type-system", "conversion", "to-integer"]

  - name: "type-conversion-to-float"
    description: "Test toFloat() function"
    args: ["query", "RETURN toFloat('3.14') AS string_to_float, toFloat(42) AS int_to_float"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["string_to_float", "int_to_float"]
      stdout_json_assert:
        - expression: "results[0].string_to_float"
          equals: 3.14
        - expression: "results[0].int_to_float"
          equals: 42.0
    tags: ["type-system", "conversion", "to-float"]

  - name: "type-conversion-to-boolean"
    description: "Test toBoolean() function"
    args: ["query", "RETURN toBoolean('true') AS string_to_bool, toBoolean(1) AS int_to_bool, toBoolean(0) AS zero_to_bool"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["string_to_bool", "int_to_bool", "zero_to_bool"]
      stdout_json_assert:
        - expression: "results[0].string_to_bool"
          equals: true
        - expression: "results[0].int_to_bool"
          equals: true
        - expression: "results[0].zero_to_bool"
          equals: false
    tags: ["type-system", "conversion", "to-boolean"]

  # ===============================
  # LIST OPERATIONS
  # ===============================

  - name: "type-list-size"
    description: "Test size() function on lists"
    args: ["query", "RETURN size([1, 2, 3, 4, 5]) AS list_size, size([]) AS empty_size, size('hello') AS string_size"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["list_size", "empty_size", "string_size"]
      stdout_json_assert:
        - expression: "results[0].list_size"
          equals: 5
        - expression: "results[0].empty_size"
          equals: 0
        - expression: "results[0].string_size"
          equals: 5
    tags: ["type-system", "list", "size"]

  - name: "type-list-head"
    description: "Test head() function on lists"
    args: ["query", "RETURN head([1, 2, 3, 4]) AS first_element"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["first_element"]
      stdout_json_assert:
        - expression: "results[0].first_element"
          equals: 1
    tags: ["type-system", "list", "head"]

  - name: "type-list-tail"
    description: "Test tail() function on lists"
    args: ["query", "RETURN tail([1, 2, 3, 4]) AS rest_elements"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["rest_elements"]
    tags: ["type-system", "list", "tail"]

  - name: "type-list-last"
    description: "Test last() function on lists"
    args: ["query", "RETURN last([1, 2, 3, 4]) AS last_element"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["last_element"]
      stdout_json_assert:
        - expression: "results[0].last_element"
          equals: 4
    tags: ["type-system", "list", "last"]

  # ===============================
  # MAP OPERATIONS
  # ===============================

  - name: "type-map-keys"
    description: "Test keys() function on maps"
    args: ["query", "RETURN keys({name: 'Alice', age: 30, active: true}) AS map_keys"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["map_keys"]
    tags: ["type-system", "map", "keys"]

  - name: "type-map-values"
    description: "Test values() function on maps"
    args: ["query", "RETURN values({name: 'Alice', age: 30}) AS map_values"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["map_values"]
    tags: ["type-system", "map", "values"]

  - name: "type-map-size"
    description: "Test size() function on maps"
    args: ["query", "RETURN size({a: 1, b: 2, c: 3}) AS map_size"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["map_size"]
      stdout_json_assert:
        - expression: "results[0].map_size"
          equals: 3
    tags: ["type-system", "map", "size"]

  # ===============================
  # TYPE COERCION AND COMPATIBILITY
  # ===============================

  - name: "type-coercion-arithmetic"
    description: "Test type coercion in arithmetic operations"
    args: ["query", "RETURN 5 + 3.14 AS int_plus_float, 2 * 1.5 AS int_times_float"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["int_plus_float", "int_times_float"]
      stdout_json_assert:
        - expression: "results[0].int_plus_float"
          equals: 8.14
        - expression: "results[0].int_times_float"
          equals: 3.0
    tags: ["type-system", "coercion", "arithmetic"]

  - name: "type-coercion-comparison"
    description: "Test type coercion in comparison operations"
    args: ["query", "RETURN 5 = 5.0 AS int_equals_float, 3 < 3.5 AS int_less_float"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["int_equals_float", "int_less_float"]
      stdout_json_assert:
        - expression: "results[0].int_equals_float"
          equals: true
        - expression: "results[0].int_less_float"
          equals: true
    tags: ["type-system", "coercion", "comparison"]

  - name: "type-coercion-string-concat"
    description: "Test type coercion in string concatenation"
    args: ["query", "RETURN 'Value: ' || 42 AS string_concat_int, 'Pi: ' || 3.14 AS string_concat_float"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["string_concat_int", "string_concat_float"]
      stdout_json_assert:
        - expression: "results[0].string_concat_int"
          equals: "Value: 42"
        - expression: "results[0].string_concat_float"
          equals: "Pi: 3.14"
    tags: ["type-system", "coercion", "string-concat"]

  # ===============================
  # PROPERTY ACCESS WITH TYPES
  # ===============================

  - name: "type-property-access-mixed"
    description: "Test property access with mixed types"
    setup:
      - args: ["query", "CREATE (n:TypeNode {int_prop: 42, string_prop: 'text', bool_prop: true, list_prop: [1, 2, 3], map_prop: {nested: 'value'}})"]
        expect:
          exit_code: 0
    args: ["query", "MATCH (n:TypeNode) RETURN n.int_prop AS int_val, n.string_prop AS string_val, n.bool_prop AS bool_val, n.list_prop AS list_val, n.map_prop AS map_val"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["int_val", "string_val", "bool_val", "list_val", "map_val"]
    tags: ["type-system", "property-access", "mixed"]

  # ===============================
  # ERROR SCENARIOS
  # ===============================

  - name: "type-error-invalid-conversion"
    description: "Test invalid type conversion (should error)"
    skip: true  # Geode returns status codes via response, not exit codes - test runner limitation
    args: ["query", "RETURN toInteger('not_a_number') AS invalid_conversion"]
    expect:
      exit_code: 0
      geode_query:
        status_class: "22018"  # Invalid character value for cast
    tags: ["type-system", "error", "invalid-conversion"]

  - name: "type-error-incompatible-operations"
    description: "Test incompatible type operations (should error)"
    skip: true  # Geode returns status codes via response, not exit codes - test runner limitation
    args: ["query", "RETURN [1, 2, 3] + 'string' AS incompatible_op"]
    expect:
      exit_code: 0
      geode_query:
        status_class: "22000"  # Type incompatibility
    tags: ["type-system", "error", "incompatible-operations"]

  - name: "type-error-list-access-out-of-bounds"
    description: "Test list access out of bounds (should return null or error)"
    args: ["query", "RETURN [1, 2, 3][10] AS out_of_bounds"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["out_of_bounds"]
      stdout_json_assert:
        - expression: "results[0].out_of_bounds"
          equals: null
    tags: ["type-system", "error", "out-of-bounds"]

  # ===============================
  # COMPLEX TYPE COMBINATIONS
  # ===============================

  - name: "type-complex-nested-structures"
    description: "Test complex nested type structures"
    args:
      - "query"
      - |
        RETURN {
          users: [
            {name: 'Alice', scores: [85, 92, 78], active: true},
            {name: 'Bob', scores: [88, 95, 82], active: false}
          ],
          metadata: {
            total_users: 2,
            created: datetime('2024-01-15T10:00:00'),
            tags: ['test', 'demo']
          }
        } AS complex_structure
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["complex_structure"]
    tags: ["type-system", "complex", "nested"]

  - name: "type-dynamic-property-access"
    description: "Test dynamic property access on complex types"
    setup:
      - args: ["query", "CREATE (n:DynamicTest {data: {level1: {level2: {value: 'deep_value'}}}})"]
        expect:
          exit_code: 0
    args: ["query", "MATCH (n:DynamicTest) RETURN n.data.level1.level2.value AS deep_value"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["deep_value"]
      stdout_json_assert:
        - expression: "results[0].deep_value"
          equals: "deep_value"
    tags: ["type-system", "complex", "dynamic-access"]

  # ===============================
  # CLEANUP
  # ===============================

  - name: "cleanup-type-test-data"
    description: "Clean up all test data created during type system tests"
    args:
      - "query"
      - |
        MATCH (n) WHERE
          n:TypeTest OR n:TypeNode OR n:DynamicTest
        DETACH DELETE n
    expect:
      exit_code: 0
    tags: ["cleanup", "type-system"]

invariants:
  - type: "server_running"

tags: ["type-system", "data-types", "literals", "conversions", "iso-gql", "comprehensive"]
