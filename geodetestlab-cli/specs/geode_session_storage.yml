version: "1.0"
name: "Geode Session Storage Tests"
description: "Comprehensive testing of Geode's token-based session storage system with local credential management"

cli:
  binary: "./zig-out/bin/geode"
  server:
    enabled: true
    port: null
    data_dir: null
    startup_timeout_ms: 60000
    cleanup: true
  client:
    timeout_ms: 10000
    format: "json"

invariants:
  - type: "exit_code"
    equals: 0

tests:
  - name: "auth-login-help"
    description: "Display auth login help"
    args: ["auth", "login", "--help"]
    expect:
      exit_code: 0
      stderr_contains: ["--save-session"]

  - name: "auth-login-save-session"
    description: "Login with --save-session flag creates credentials file"
    args: ["auth", "login", "-U", "session_test_alice", "-P", "testpass123", "--save-session"]
    expect:
      exit_code: 0
      stdout_contains:
        - "Login successful"
        - "Session token saved to ~/.geode/credentials.json"
        - "Token expires in 1 hour"

  - name: "auth-login-without-save-session"
    description: "Login without --save-session displays token but doesn't save"
    args: ["auth", "login", "-U", "session_test_bob", "-P", "testpass456"]
    expect:
      exit_code: 0
      stdout_contains:
        - "Login successful"
        - "Session token:"
        - "Use --save-session to save credentials locally"

  - name: "auth-logout-success"
    description: "Logout clears saved credentials"
    setup:
      - "auth login -U logout_test_user -P testpass789 --save-session"
    args: ["auth", "logout"]
    expect:
      exit_code: 0
      stdout_contains:
        - "Logout successful"
        - "Credentials cleared from ~/.geode/credentials.json"

  - name: "query-auto-load-session"
    description: "Query command auto-loads saved session credentials"
    setup:
      - "auth login -U autoload_test_user -P autoloadpass --save-session"
    args: ["query", "RETURN 'auto-loaded-session' AS session_test"]
    expect:
      exit_code: 0
      stdout_contains:
        - "auto-loaded-session"
        - "session_test"
    teardown:
      - "auth logout"

  - name: "query-no-saved-session-flag"
    description: "Query with --no-saved-session ignores saved credentials"
    setup:
      - "auth login -U nosave_test_user -P nosavepass --save-session"
    args: ["query", "--no-saved-session", "RETURN 'no-session-flag' AS test"]
    expect:
      exit_code: 0
      stdout_contains:
        - "no-session-flag"
    teardown:
      - "auth logout"

  - name: "query-without-session"
    description: "Query works without any session"
    args: ["query", "RETURN 42 AS answer"]
    expect:
      exit_code: 0
      stdout_contains:
        - "42"
        - "answer"

  - name: "session-token-format"
    description: "Session token is 64 hex characters"
    args: ["auth", "login", "-U", "token_format_user", "-P", "tokenpass"]
    expect:
      exit_code: 0
      stdout_regex: ["Session token: [0-9a-f]{64}"]

  - name: "session-file-permissions"
    description: "Credentials file has restrictive 600 permissions"
    skip: true  # Requires external stat command, not testable via geode CLI
    setup:
      - "auth login -U perms_user -P permspass --save-session"
    args: ["bash", "-c", "stat -c %a ~/.geode/credentials.json"]
    expect:
      exit_code: 0
      stdout_contains: ["600"]
    teardown:
      - "auth logout"

  - name: "session-system-fingerprint-binding"
    description: "Session tokens are bound to system fingerprint"
    setup:
      - "auth login -U fingerprint_user -P fppass --save-session"
    args: ["auth", "token"]
    expect:
      exit_code: 0
      stdout_contains: ["system_fingerprint"]
    teardown:
      - "auth logout"

  - name: "session-multiple-logins"
    description: "Multiple logins overwrite previous session"
    setup:
      - "auth login -U first_user -P firstpass --save-session"
    args: ["auth", "login", "-U", "second_user", "-P", "secondpass", "--save-session"]
    expect:
      exit_code: 0
      stdout_contains:
        - "Login successful"
    teardown:
      - "auth logout"

  - name: "session-credentials-json-structure"
    description: "Credentials file contains required JSON fields"
    setup:
      - "auth login -U json_test_user -P jsonpass --save-session"
    args: ["auth", "token"]
    expect:
      exit_code: 0
      stdout_contains:
        - '"token":'
        - '"username":'
        - '"server":'
        - '"created_at":'
        - '"system_fingerprint":'
    teardown:
      - "auth logout"

  - name: "session-logout-nonexistent-session"
    description: "Logout succeeds even without saved session"
    args: ["auth", "logout"]
    expect:
      exit_code: 0

statistics:
  track:
    - "exit_code"
    - "execution_time_ms"
    - "stdout_length"
    - "stderr_length"

fuzz:
  enabled: false  # Session storage is deterministic, not suitable for fuzzing
