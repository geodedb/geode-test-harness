name: cli_flags_comprehensive
description: Tests for CLI flag parsing, help output, and argument handling
tests:
- name: Main help output
  description: Test geode --help output
  args:
  - --help
  expect:
    contains:
    - geode
    - serve
    - query
    - shell
    - --help
    - --version
    exit_code: 0
- name: Short help flag
  description: Test -h flag
  args:
  - -h
  expect:
    contains:
    - serve
    - query
    exit_code: 0
- name: Version flag
  description: Test --version flag
  args:
  - --version
  expect:
    contains:
    - geode
    - v
    exit_code: 0
- name: Serve help output
  description: Test geode serve --help output
  args:
  - serve
  - --help
  expect:
    contains:
    - --listen
    - --cert
    - --key
    - --data-dir
    - --log-level
    exit_code: 0
- name: Serve config flag documented
  description: Verify --config flag is documented in global help
  args:
  - --help
  expect:
    contains:
    - --config
    - Configuration
    exit_code: 0
- name: Serve short config flag documented
  description: Verify -c flag is documented
  args:
  - serve
  - --help
  expect:
    contains:
    - -c
    exit_code: 0
- name: Serve log level options
  description: Verify log level options are documented
  args:
  - serve
  - --help
  expect:
    contains:
    - debug
    - info
    - warn
    - error
    exit_code: 0
- name: Query help output
  description: Test geode query --help output
  args:
  - query
  - --help
  expect:
    contains:
    - --server
    - --format
    exit_code: 0
- name: Query format flag
  description: Test --format flag is documented
  args:
  - query
  - --help
  expect:
    contains:
    - format
    exit_code: 0
- name: Shell help output
  description: Test geode shell --help output
  args:
  - shell
  - --help
  expect:
    contains:
    - --server
    exit_code: 0
- name: Shell insecure flag
  description: Test --insecure flag documentation
  args:
  - shell
  - --help
  expect:
    contains:
    - insecure
    exit_code: 0
- name: Backup help output
  description: Test geode backup --help output
  args:
  - backup
  - --help
  expect:
    contains:
    - backup
    exit_code: 0
- name: MCP help output
  description: Test geode mcp --help output
  args:
  - mcp
  - --help
  expect:
    contains:
    - Model Context Protocol
    - serve
    - --port
    exit_code: 0
- name: MCP serve subcommand
  description: Test geode mcp serve --help output
  args:
  - mcp
  - serve
  - --help
  expect:
    contains:
    - MCP
    exit_code: 0
- name: Audit help output
  description: Test geode audit --help output
  args:
  - audit
  - --help
  expect:
    contains:
    - audit
    exit_code: 0
- name: User help output
  description: Test geode user --help output
  args:
  - user
  - --help
  expect:
    contains:
    - user
    exit_code: 0
- name: Role help output
  description: Test geode role --help output
  args:
  - role
  - --help
  expect:
    contains:
    - role
    exit_code: 0
- name: Policy help output
  description: Test geode policy --help output
  args:
  - policy
  - --help
  expect:
    contains:
    - policy
    exit_code: 0
- name: Unknown option error
  description: Test error for unknown option
  args:
  - --unknown-option
  expect:
    contains:
    - unknown
    exit_code: 2
- name: Unknown subcommand error
  description: Test error for unknown subcommand
  args:
  - unknowncommand
  expect:
    contains:
    - unknown
    exit_code: 2
- name: Verbose flag is refused
  description: The global --verbose option was removed (nothing read it; SONNY-6560) and is refused as a usage error
  args:
  - --verbose
  expect:
    contains:
    - not supported
    exit_code: 2
- name: JSON output flag is refused
  description: The global --json option was removed (nothing read it; SONNY-6560) and is refused as a usage error
  args:
  - --json
  expect:
    contains:
    - not supported
    exit_code: 2
- name: Config flag in global options
  description: Test --config is a global option
  args:
  - --help
  expect:
    contains:
    - config
    exit_code: 0
