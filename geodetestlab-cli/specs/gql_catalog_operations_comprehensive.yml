version: "1.0"
name: "GQL Catalog Operations Comprehensive Tests"
description: "Complete ISO/IEC 39075:2024 catalog operations testing covering CREATE/DROP SCHEMA, GRAPH, and GRAPH TYPE"

cli:
  binary: "./zig-out/bin/geode"
  server:
    enabled: true
    port: null
    data_dir: null
    startup_timeout_ms: 30000
    cleanup: true
    args: ["--log-level", "info"]
  client:
    timeout_ms: 15000
    tls_verify: false
    format: "json"

tests:
  # ===============================
  # SCHEMA OPERATIONS
  # ===============================

  - name: "create-schema-basic"
    description: "Test basic CREATE SCHEMA command"
    args: ["query", "CREATE SCHEMA IF NOT EXISTS test_schema"]
    expect:
      exit_code: 0
    tags: ["catalog", "schema", "create", "basic"]

  - name: "create-schema-if-not-exists"
    description: "Test CREATE SCHEMA IF NOT EXISTS"
    args: ["query", "CREATE SCHEMA IF NOT EXISTS test_schema_conditional"]
    expect:
      exit_code: 0
    tags: ["catalog", "schema", "create", "conditional"]

  - name: "create-schema-if-not-exists-duplicate"
    description: "Test CREATE SCHEMA IF NOT EXISTS on existing schema"
    setup:
      - args: ["query", "CREATE SCHEMA existing_schema"]
        expect:
          exit_code: 0
    args: ["query", "CREATE SCHEMA IF NOT EXISTS existing_schema"]
    expect:
      exit_code: 0
    tags: ["catalog", "schema", "create", "duplicate"]

  - name: "drop-schema-basic"
    description: "Test basic DROP SCHEMA command"
    skip: true  # Works manually, test runner name isolation issue - needs investigation
    setup:
      - args: ["query", "CREATE SCHEMA drop_test_schema"]
        expect:
          exit_code: 0
    args: ["query", "DROP SCHEMA drop_test_schema"]
    expect:
      exit_code: 0
    tags: ["catalog", "schema", "drop", "basic"]

  - name: "drop-schema-if-exists"
    description: "Test DROP SCHEMA IF EXISTS"
    setup:
      - args: ["query", "CREATE SCHEMA conditional_drop_schema"]
        expect:
          exit_code: 0
    args: ["query", "DROP SCHEMA IF EXISTS conditional_drop_schema"]
    expect:
      exit_code: 0
    tags: ["catalog", "schema", "drop", "conditional"]

  - name: "drop-schema-if-exists-nonexistent"
    description: "Test DROP SCHEMA IF EXISTS on non-existent schema"
    args: ["query", "DROP SCHEMA IF EXISTS nonexistent_schema"]
    expect:
      exit_code: 0
    tags: ["catalog", "schema", "drop", "nonexistent"]

  # ===============================
  # GRAPH OPERATIONS
  # ===============================

  - name: "create-graph-basic"
    description: "Test basic CREATE GRAPH command"
    args: ["query", "CREATE GRAPH IF NOT EXISTS test_graph ANY"]
    expect:
      exit_code: 0
    tags: ["catalog", "graph", "create", "basic"]

  - name: "create-property-graph-basic"
    description: "Test CREATE PROPERTY GRAPH command"
    args: ["query", "CREATE PROPERTY GRAPH IF NOT EXISTS test_property_graph ANY"]
    expect:
      exit_code: 0
    tags: ["catalog", "graph", "create", "property"]

  - name: "create-graph-if-not-exists"
    description: "Test CREATE GRAPH IF NOT EXISTS"
    args: ["query", "CREATE GRAPH IF NOT EXISTS conditional_graph ANY"]
    expect:
      exit_code: 0
    tags: ["catalog", "graph", "create", "conditional"]

  - name: "create-or-replace-graph"
    description: "Test CREATE OR REPLACE GRAPH"
    setup:
      - args: ["query", "CREATE GRAPH replace_test_graph ANY"]
        expect:
          exit_code: 0
    args: ["query", "CREATE OR REPLACE GRAPH replace_test_graph ANY"]
    expect:
      exit_code: 0
    tags: ["catalog", "graph", "create", "replace"]

  - name: "create-or-replace-property-graph"
    description: "Test CREATE OR REPLACE PROPERTY GRAPH"
    args: ["query", "CREATE OR REPLACE PROPERTY GRAPH replace_property_graph ANY"]
    expect:
      exit_code: 0
    tags: ["catalog", "graph", "create", "replace", "property"]

  # Graph with typed specifications
  - name: "create-typed-graph-any"
    description: "Test CREATE GRAPH with TYPED ANY specification"
    args: ["query", "CREATE GRAPH IF NOT EXISTS typed_any_graph TYPED ANY"]
    expect:
      exit_code: 0
    tags: ["catalog", "graph", "create", "typed"]

  - name: "create-typed-property-graph-any"
    description: "Test CREATE GRAPH with TYPED ANY PROPERTY GRAPH"
    args: ["query", "CREATE GRAPH IF NOT EXISTS typed_property_any_graph TYPED ANY PROPERTY GRAPH"]
    expect:
      exit_code: 0
    tags: ["catalog", "graph", "create", "typed", "property"]

  # Graph with LIKE clause
  - name: "create-graph-like-existing"
    description: "Test CREATE GRAPH LIKE existing graph"
    setup:
      - args: ["query", "CREATE GRAPH IF NOT EXISTS source_graph ANY"]
        expect:
          exit_code: 0
    args: ["query", "CREATE GRAPH IF NOT EXISTS like_graph LIKE source_graph"]
    expect:
      exit_code: 0
    tags: ["catalog", "graph", "create", "like"]

  # Graph with AS COPY OF clause
  - name: "create-graph-as-copy-of"
    description: "Test CREATE GRAPH AS COPY OF existing graph"
    setup:
      - args: ["query", "CREATE GRAPH IF NOT EXISTS copy_source_graph ANY"]
        expect:
          exit_code: 0
    args: ["query", "CREATE OR REPLACE GRAPH copy_target_graph ANY AS COPY OF copy_source_graph"]
    expect:
      exit_code: 0
    tags: ["catalog", "graph", "create", "copy"]

  - name: "drop-graph-basic"
    description: "Test basic DROP GRAPH command"
    skip: true  # Works manually, test runner name isolation issue - needs investigation
    setup:
      - args: ["query", "CREATE GRAPH drop_test_graph ANY"]
        expect:
          exit_code: 0
    args: ["query", "DROP GRAPH drop_test_graph"]
    expect:
      exit_code: 0
    tags: ["catalog", "graph", "drop", "basic"]

  - name: "drop-property-graph-basic"
    description: "Test DROP PROPERTY GRAPH command"
    skip: true  # Works manually, test runner name isolation issue - needs investigation
    setup:
      - args: ["query", "CREATE PROPERTY GRAPH drop_property_test_graph ANY"]
        expect:
          exit_code: 0
    args: ["query", "DROP PROPERTY GRAPH drop_property_test_graph"]
    expect:
      exit_code: 0
    tags: ["catalog", "graph", "drop", "property"]

  - name: "drop-graph-if-exists"
    description: "Test DROP GRAPH IF EXISTS"
    setup:
      - args: ["query", "CREATE GRAPH conditional_drop_graph ANY"]
        expect:
          exit_code: 0
    args: ["query", "DROP GRAPH IF EXISTS conditional_drop_graph"]
    expect:
      exit_code: 0
    tags: ["catalog", "graph", "drop", "conditional"]

  - name: "drop-graph-if-exists-nonexistent"
    description: "Test DROP GRAPH IF EXISTS on non-existent graph"
    args: ["query", "DROP GRAPH IF EXISTS nonexistent_graph"]
    expect:
      exit_code: 0
    tags: ["catalog", "graph", "drop", "nonexistent"]

  # ===============================
  # GRAPH TYPE OPERATIONS
  # ===============================

  - name: "create-graph-type-basic"
    description: "Test basic CREATE GRAPH TYPE command"
    args: ["query", "CREATE GRAPH TYPE test_graph_type AS { }"]
    expect:
      exit_code: 0
    tags: ["catalog", "graph-type", "create", "basic"]

  - name: "create-property-graph-type-basic"
    description: "Test CREATE PROPERTY GRAPH TYPE command"
    args: ["query", "CREATE PROPERTY GRAPH TYPE test_property_graph_type AS { }"]
    expect:
      exit_code: 0
    tags: ["catalog", "graph-type", "create", "property"]

  - name: "create-graph-type-if-not-exists"
    description: "Test CREATE GRAPH TYPE IF NOT EXISTS"
    args: ["query", "CREATE GRAPH TYPE IF NOT EXISTS conditional_graph_type AS { }"]
    expect:
      exit_code: 0
    tags: ["catalog", "graph-type", "create", "conditional"]

  - name: "create-or-replace-graph-type"
    description: "Test CREATE OR REPLACE GRAPH TYPE"
    skip: true  # Works manually, test runner name isolation issue - needs investigation
    setup:
      - args: ["query", "CREATE GRAPH TYPE replace_test_graph_type AS { }"]
        expect:
          exit_code: 0
    args: ["query", "CREATE OR REPLACE GRAPH TYPE replace_test_graph_type AS { }"]
    expect:
      exit_code: 0
    tags: ["catalog", "graph-type", "create", "replace"]

  - name: "create-or-replace-property-graph-type"
    description: "Test CREATE OR REPLACE PROPERTY GRAPH TYPE"
    args: ["query", "CREATE OR REPLACE PROPERTY GRAPH TYPE replace_property_graph_type AS { }"]
    expect:
      exit_code: 0
    tags: ["catalog", "graph-type", "create", "replace", "property"]

  # Graph Type with COPY OF clause
  - name: "create-graph-type-copy-of"
    description: "Test CREATE GRAPH TYPE AS COPY OF existing type"
    setup:
      - args: ["query", "CREATE GRAPH TYPE source_graph_type AS { }"]
        expect:
          exit_code: 0
    args: ["query", "CREATE GRAPH TYPE copy_graph_type AS COPY OF source_graph_type"]
    expect:
      exit_code: 0
    tags: ["catalog", "graph-type", "create", "copy"]

  # Graph Type with LIKE clause
  - name: "create-graph-type-like"
    description: "Test CREATE GRAPH TYPE LIKE existing graph"
    setup:
      - args: ["query", "CREATE GRAPH like_source_graph ANY"]
        expect:
          exit_code: 0
    args: ["query", "CREATE GRAPH TYPE like_graph_type LIKE like_source_graph"]
    expect:
      exit_code: 0
    tags: ["catalog", "graph-type", "create", "like"]

  - name: "drop-graph-type-basic"
    description: "Test basic DROP GRAPH TYPE command"
    setup:
      - args: ["query", "CREATE GRAPH TYPE drop_test_graph_type AS { }"]
        expect:
          exit_code: 0
    args: ["query", "DROP GRAPH TYPE drop_test_graph_type"]
    expect:
      exit_code: 0
    tags: ["catalog", "graph-type", "drop", "basic"]

  - name: "drop-property-graph-type-basic"
    description: "Test DROP PROPERTY GRAPH TYPE command"
    setup:
      - args: ["query", "CREATE PROPERTY GRAPH TYPE drop_property_test_graph_type AS { }"]
        expect:
          exit_code: 0
    args: ["query", "DROP PROPERTY GRAPH TYPE drop_property_test_graph_type"]
    expect:
      exit_code: 0
    tags: ["catalog", "graph-type", "drop", "property"]

  - name: "drop-graph-type-if-exists"
    description: "Test DROP GRAPH TYPE IF EXISTS"
    setup:
      - args: ["query", "CREATE GRAPH TYPE conditional_drop_graph_type AS { }"]
        expect:
          exit_code: 0
    args: ["query", "DROP GRAPH TYPE IF EXISTS conditional_drop_graph_type"]
    expect:
      exit_code: 0
    tags: ["catalog", "graph-type", "drop", "conditional"]

  - name: "drop-graph-type-if-exists-nonexistent"
    description: "Test DROP GRAPH TYPE IF EXISTS on non-existent type"
    args: ["query", "DROP GRAPH TYPE IF EXISTS nonexistent_graph_type"]
    expect:
      exit_code: 0
    tags: ["catalog", "graph-type", "drop", "nonexistent"]

  # ===============================
  # WORKFLOW TESTS
  # ===============================

  - name: "catalog-workflow-schema-graph"
    description: "Complete workflow: create schema, create graph, use graph, drop"
    args:
      - "query"
      - |
        CREATE SCHEMA IF NOT EXISTS workflow_schema;
        CREATE GRAPH IF NOT EXISTS workflow_schema.workflow_graph ANY;
        DROP GRAPH IF EXISTS workflow_schema.workflow_graph;
        DROP SCHEMA IF EXISTS workflow_schema
    expect:
      exit_code: 0
    tags: ["catalog", "workflow", "comprehensive"]

  - name: "catalog-workflow-graph-types"
    description: "Workflow with graph types: create type, create graph from type, drop"
    args:
      - "query"
      - |
        CREATE GRAPH TYPE IF NOT EXISTS workflow_type AS { };
        CREATE OR REPLACE GRAPH workflow_typed_graph TYPED workflow_type;
        DROP GRAPH IF EXISTS workflow_typed_graph;
        DROP GRAPH TYPE IF EXISTS workflow_type
    expect:
      exit_code: 0
    tags: ["catalog", "workflow", "graph-types"]

  # ===============================
  # ERROR SCENARIOS
  # ===============================

  - name: "create-duplicate-schema-error"
    description: "Test creating duplicate schema without IF NOT EXISTS (should error)"
    skip: true  # Geode returns status codes via response, not exit codes - test runner limitation
    setup:
      - args: ["query", "CREATE SCHEMA duplicate_error_schema"]
        expect:
          exit_code: 0
    args: ["query", "CREATE SCHEMA duplicate_error_schema"]
    expect:
      exit_code: 0
      geode_query:
        status_class: "42000"  # Schema already exists
    cleanup:
      - args: ["query", "DROP SCHEMA duplicate_error_schema"]
        expect:
          exit_code: 0
    tags: ["catalog", "error", "schema", "duplicate"]

  - name: "drop-nonexistent-schema-error"
    description: "Test dropping non-existent schema without IF EXISTS (should error)"
    skip: true  # Geode returns status codes via response, not exit codes - test runner limitation
    args: ["query", "DROP SCHEMA nonexistent_error_schema"]
    expect:
      exit_code: 0
      geode_query:
        status_class: "42000"  # Schema does not exist
    tags: ["catalog", "error", "schema", "nonexistent"]

  - name: "create-duplicate-graph-error"
    description: "Test creating duplicate graph without IF NOT EXISTS (should error)"
    skip: true  # Geode returns status codes via response, not exit codes - test runner limitation
    setup:
      - args: ["query", "CREATE GRAPH duplicate_error_graph ANY"]
        expect:
          exit_code: 0
    args: ["query", "CREATE GRAPH duplicate_error_graph ANY"]
    expect:
      exit_code: 0
      geode_query:
        status_class: "42000"  # Graph already exists
    cleanup:
      - args: ["query", "DROP GRAPH duplicate_error_graph"]
        expect:
          exit_code: 0
    tags: ["catalog", "error", "graph", "duplicate"]

  - name: "drop-nonexistent-graph-error"
    description: "Test dropping non-existent graph without IF EXISTS (should error)"
    skip: true  # Geode returns status codes via response, not exit codes - test runner limitation
    args: ["query", "DROP GRAPH nonexistent_error_graph"]
    expect:
      exit_code: 0
      geode_query:
        status_class: "42000"  # Graph does not exist
    tags: ["catalog", "error", "graph", "nonexistent"]

  # ===============================
  # CLEANUP
  # ===============================

  - name: "cleanup-catalog-objects"
    description: "Clean up all catalog objects created during tests"
    args:
      - "query"
      - |
        DROP GRAPH IF EXISTS test_graph;
        DROP GRAPH IF EXISTS test_property_graph;
        DROP GRAPH IF EXISTS conditional_graph;
        DROP GRAPH IF EXISTS replace_property_graph;
        DROP GRAPH IF EXISTS typed_any_graph;
        DROP GRAPH IF EXISTS typed_property_any_graph;
        DROP GRAPH IF EXISTS like_graph;
        DROP GRAPH IF EXISTS copy_target_graph;
        DROP GRAPH IF EXISTS copy_source_graph;
        DROP GRAPH IF EXISTS source_graph;
        DROP GRAPH IF EXISTS like_source_graph;
        DROP GRAPH TYPE IF EXISTS test_graph_type;
        DROP GRAPH TYPE IF EXISTS test_property_graph_type;
        DROP GRAPH TYPE IF EXISTS conditional_graph_type;
        DROP GRAPH TYPE IF EXISTS replace_property_graph_type;
        DROP GRAPH TYPE IF EXISTS copy_graph_type;
        DROP GRAPH TYPE IF EXISTS source_graph_type;
        DROP GRAPH TYPE IF EXISTS like_graph_type;
        DROP SCHEMA IF EXISTS test_schema;
        DROP SCHEMA IF EXISTS test_schema_conditional;
        DROP SCHEMA IF EXISTS existing_schema
    expect:
      exit_code: 0
    tags: ["cleanup", "catalog"]

invariants:
  - type: "server_running"

tags: ["catalog", "operations", "iso-gql", "comprehensive", "ddl"]
