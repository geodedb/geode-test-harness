- name: REPL history persistence
  description: '[SKIPPED: requires TTY] Test that history persists between sessions'
  args:
  - -c
  - rm -f /tmp/test_history.txt; GEODE_HISTORY=/tmp/test_history.txt ./zig-out/bin/geode
    shell --server localhost:7567 <<< $'RETURN 42;\n\\quit\n'; GEODE_HISTORY=/tmp/test_history.txt
    ./zig-out/bin/geode shell --server localhost:7567 <<< $'\\history\n\\quit\n'
  expect:
    exit_code: 0
    stdout_contains:
    - RETURN 42
  tags:
  - repl
  timeout_ms: 15000
  skip: true
