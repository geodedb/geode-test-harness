name: Geode REPL Comprehensive Tests
description: 'Comprehensive test suite for Geode REPL functionality including QUIC
  integration, command history, formatting, and transaction support


  NOTE: All REPL tests are currently skipped because the ''geode shell'' command requires
  an interactive TTY, which is not available in automated testing. To test REPL functionality
  manually, run: ./zig-out/bin/geode shell --server localhost:7567'
tests:
- name: REPL basic startup and help
  description: '[SKIPPED: requires TTY] Test REPL starts up and shows help correctly'
  args:
  - shell
  - --server
  - localhost:7567
  expect:
    exit_code: 0
    stdout_contains:
    - Welcome to Geode Shell
    - Meta-Commands
    - \help
    - \quit
  tags:
  - repl
  stdin: '\help

    \quit

    '
  timeout_ms: 10000
  skip: true
- name: REPL simple query execution
  description: '[SKIPPED: requires TTY] Test basic query execution in REPL'
  args:
  - shell
  - --server
  - localhost:7567
  expect:
    exit_code: 0
    stdout_contains:
    - geode>
  tags:
  - repl
  stdin: 'RETURN 1 AS result;

    \quit

    '
  timeout_ms: 10000
  skip: true
- name: REPL multi-line query support
  description: '[SKIPPED: requires TTY] Test multi-line query input with continuation
    prompts'
  args:
  - shell
  - --server
  - localhost:7567
  expect:
    exit_code: 0
    stdout_contains:
    - geode>
    - geode->
  tags:
  - repl
  stdin: 'MATCH (n:Person)

    RETURN n.name

    LIMIT 5;

    \quit

    '
  timeout_ms: 10000
  skip: true
- name: REPL timing command
  description: '[SKIPPED: requires TTY] Test timing meta-command functionality'
  args:
  - shell
  - --server
  - localhost:7567
  expect:
    exit_code: 0
    stdout_contains:
    - Timing is on
    - executed in
    - Timing is off
  tags:
  - repl
  stdin: '\timing on

    RETURN 1;

    \timing off

    \quit

    '
  timeout_ms: 10000
  skip: true
- name: REPL format commands
  description: '[SKIPPED: requires TTY] Test output format switching'
  args:
  - shell
  - --server
  - localhost:7567
  expect:
    exit_code: 0
    stdout_contains:
    - Output format set to table
    - Output format set to csv
    - Output format set to json
  tags:
  - repl
  stdin: '\format table

    \format csv

    \format json

    \quit

    '
  timeout_ms: 10000
  skip: true
- name: REPL clear screen command
  description: '[SKIPPED: requires TTY] Test clear screen functionality'
  args:
  - shell
  - --server
  - localhost:7567
  expect:
    exit_code: 0
  tags:
  - repl
  stdin: '\clear

    \quit

    '
  timeout_ms: 10000
  skip: true
- name: REPL echo command
  description: '[SKIPPED: requires TTY] Test echo meta-command'
  args:
  - shell
  - --server
  - localhost:7567
  expect:
    exit_code: 0
    stdout_contains:
    - Hello World
  tags:
  - repl
  stdin: '\echo Hello World

    \quit

    '
  timeout_ms: 10000
  skip: true
- name: REPL history basic functionality
  description: '[SKIPPED: requires TTY] Test command history storage and retrieval'
  args:
  - shell
  - --server
  - localhost:7567
  expect:
    exit_code: 0
    stdout_contains:
    - RETURN 1
    - RETURN 2
  tags:
  - repl
  stdin: 'RETURN 1;

    RETURN 2;

    \history

    \quit

    '
  timeout_ms: 10000
  skip: true
- name: REPL history with limit
