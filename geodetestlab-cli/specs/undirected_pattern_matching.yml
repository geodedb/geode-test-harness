version: '1.0'
name: Undirected Pattern Matching Tests
description: "Comprehensive tests for undirected relationship pattern matching.\nVerifies that -[r]- patterns return results from BOTH directions,\nnot just outgoing edges.\n"
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 30000
    cleanup: true
    args:
    - --log-level
    - error
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 30000
    tls_verify: false
    format: json
tests:
- name: setup-create-nodes
  description: Create test nodes for undirected pattern testing
  query: "CREATE (a:Person {name: 'Alice'}),\n       (b:Person {name: 'Bob'}),\n       (c:Person {name: 'Charlie'}),\n       (d:Person {name: 'Diana'});\nMATCH (n:Person) RETURN count(n) AS created\n"
  expect:
    success: true
    result_contains:
    - created
  tags:
  - undirected
  - setup
- name: setup-create-relationships
  description: Create directed relationships (Alice->Bob, Alice->Charlie, Diana->Alice)
  query: "MATCH (a:Person {name: 'Alice'}), (b:Person {name: 'Bob'})\nCREATE (a)-[:KNOWS {since: 2020}]->(b)\nRETURN type(r) AS rel_type\n"
  expect:
    success: true
  tags:
  - undirected
  - setup
- name: setup-create-relationship-2
  description: Create Alice->Charlie relationship
  query: "MATCH (a:Person {name: 'Alice'}), (c:Person {name: 'Charlie'})\nCREATE (a)-[:KNOWS {since: 2021}]->(c)\nRETURN 'created' AS status\n"
  expect:
    success: true
  tags:
  - undirected
  - setup
- name: setup-create-relationship-3
  description: Create Diana->Alice relationship
  query: "MATCH (d:Person {name: 'Diana'}), (a:Person {name: 'Alice'})\nCREATE (d)-[:KNOWS {since: 2022}]->(a)\nRETURN 'created' AS status\n"
  expect:
    success: true
  tags:
  - undirected
  - setup
- name: undirected-with-relationship-properties
  description: Undirected pattern can access relationship properties
  query: "MATCH (a:Person {name: 'Alice'})-[r:KNOWS]-(b)\nRETURN b.name AS connected, r.since AS year ORDER BY year\n"
  expect:
    success: true
    geode_query:
      row_count: 3
      columns:
      - connected
      - year
  tags:
  - undirected
  - edge-cases
- name: undirected-isolated-node
  description: Node with no connections returns 0 rows for undirected
  query: "CREATE (lonely:Person {name: 'Lonely'})\nRETURN 'created' AS status\n"
  expect:
    success: true
  tags:
  - undirected
  - edge-cases
  - setup
- name: undirected-isolated-node-query
  description: Undirected query on isolated node returns empty
  query: "MATCH (l:Person {name: 'Lonely'})-[r]-(other)\nRETURN count(*) AS connections\n"
  expect:
    success: true
    geode_query:
      row_count: 1
      columns:
      - connections
    result_contains:
    - '0'
  tags:
  - undirected
  - edge-cases
- name: undirected-aggregation-count
  description: Aggregation with undirected pattern
  query: "MATCH (p:Person)-[r:KNOWS]-(other)\nRETURN p.name AS person, count(*) AS connections\nORDER BY connections DESC\n"
  expect:
    success: true
    geode_query:
      columns:
      - person
      - connections
  tags:
  - undirected
  - aggregation
- name: cleanup-test-data
  description: Clean up test nodes and relationships
  query: "MATCH (n:Person) WHERE n.name IN ['Alice', 'Bob', 'Charlie', 'Diana', 'Lonely']\nDETACH DELETE n\nRETURN count(*) AS deleted\n"
  expect:
    success: true
  tags:
  - undirected
  - cleanup
metadata:
  gaps_covered:
  - id: UNDIRECTED-PATTERN-BUG
    title: Undirected patterns only traverse outgoing edges
    severity: High
    description: The -[r]- pattern was treating undirected the same as right-directed
  created: '2026-01-29'
  author: engine-team
invariants:
- type: server_running
tags:
- undirected
- pattern-matching
- gql-compliance
- regression
