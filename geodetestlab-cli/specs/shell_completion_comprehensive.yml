# CANARY: REQ=REQ-LIB-MIGRATION-CLI-TEST-001; FEATURE="External Library Migration"; ASPECT=ShellCompletionTests; STATUS=TESTED; OWNER=test; UPDATED=2026-01-24
# Comprehensive tests for Geode shell completion script generation
# Tests bash, zsh, fish, and powershell completion output

name: shell_completion_comprehensive
description: Tests for shell completion script generation (bash, zsh, fish, powershell)

tests:
  # ============================================================================
  # Bash Completion Tests
  # ============================================================================

  - name: Generate bash completions
    description: Test bash completion script generation
    args: ["completion", "--shell", "bash"]
    expect:
      contains:
        - "_geode()"
        - "COMPREPLY"
        - "compgen"
        - "serve"
        - "query"
        - "shell"
        - "backup"
        - "restore"
        - "completion"
        - "mcp"
      exit_code: 0

  - name: Bash completions include global options
    description: Verify bash completions include global CLI options
    args: ["completion", "--shell", "bash"]
    expect:
      contains:
        - "--help"
        - "--version"
        - "--config"
        - "--json"
      exit_code: 0

  - name: Bash completions include subcommand options
    description: Verify bash completions have subcommand-specific options
    args: ["completion", "--shell", "bash"]
    expect:
      contains:
        - "--listen"
        - "--data-dir"
        - "--cert"
        - "--key"
        - "--server"
        - "--format"
      exit_code: 0

  # ============================================================================
  # Zsh Completion Tests
  # ============================================================================

  - name: Generate zsh completions
    description: Test zsh completion script generation
    args: ["completion", "--shell", "zsh"]
    expect:
      contains:
        - "#compdef"
        - "_geode"
        - "_arguments"
        - "serve"
        - "query"
        - "shell"
      exit_code: 0

  - name: Zsh completions include descriptions
    description: Verify zsh completions have option descriptions
    args: ["completion", "--shell", "zsh"]
    expect:
      contains:
        - "_describe"
        - "commands"
      exit_code: 0

  # ============================================================================
  # Fish Completion Tests
  # ============================================================================

  - name: Generate fish completions
    description: Test fish completion script generation
    args: ["completion", "--shell", "fish"]
    expect:
      contains:
        - "complete"
        - "-c geode"
        - "serve"
        - "query"
        - "shell"
      exit_code: 0

  - name: Fish completions include command descriptions
    description: Verify fish completions have descriptions
    args: ["completion", "--shell", "fish"]
    expect:
      contains:
        - "-d"
        - "-a"
      exit_code: 0

  # ============================================================================
  # PowerShell Completion Tests
  # ============================================================================

  - name: Generate powershell completions
    description: Test PowerShell completion script generation
    args: ["completion", "--shell", "powershell"]
    expect:
      contains:
        - "Register-ArgumentCompleter"
        - "CommandName"
        - "geode"
        - "ScriptBlock"
      exit_code: 0

  - name: PowerShell completions include pwsh alias
    description: Verify powershell works as alias for pwsh
    args: ["completion", "--shell", "pwsh"]
    expect:
      contains:
        - "Register-ArgumentCompleter"
      exit_code: 0

  # ============================================================================
  # Completion Command Help
  # ============================================================================

  - name: Completion help message
    description: Test completion command help output
    args: ["completion", "--help"]
    expect:
      contains:
        - "Generate shell completion scripts"
        - "--shell"
        - "bash"
        - "zsh"
        - "fish"
        - "powershell"
      exit_code: 0

  - name: Completion short help flag
    description: Test -h flag for completion help
    args: ["completion", "-h"]
    expect:
      contains:
        - "Generate shell completion scripts"
      exit_code: 0

  # ============================================================================
  # Default Behavior Tests
  # ============================================================================

  - name: Default to bash when no shell specified
    description: Test that bash is the default shell
    args: ["completion"]
    expect:
      contains:
        - "_geode()"
        - "COMPREPLY"
      exit_code: 0

  - name: Completions alias works
    description: Test that 'completions' (plural) works
    args: ["completions", "--shell", "bash"]
    expect:
      contains:
        - "_geode"
      exit_code: 0

  # ============================================================================
  # Error Handling Tests
  # ============================================================================

  - name: Unknown shell type error
    description: Test error for unknown shell type
    args: ["completion", "--shell", "unknown"]
    expect:
      contains:
        - "Error"
        - "Unknown shell type"
      exit_code: 2

  - name: Short shell flag works
    description: Test -s flag for shell selection
    args: ["completion", "-s", "zsh"]
    expect:
      contains:
        - "#compdef"
      exit_code: 0

  # ============================================================================
  # All Subcommands Present Tests
  # ============================================================================

  - name: All major subcommands in bash completions
    description: Verify all major subcommands are included
    args: ["completion", "--shell", "bash"]
    expect:
      contains:
        - "serve"
        - "query"
        - "shell"
        - "backup"
        - "restore"
        - "migrate"
        - "user"
        - "role"
        - "policy"
        - "grant"
        - "revoke"
        - "auth"
        - "fle"
        - "storage"
        - "audit"
        - "completion"
        - "mcp"
      exit_code: 0
