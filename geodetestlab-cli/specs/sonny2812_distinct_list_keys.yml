# SONNY-2812: count(DISTINCT) and collect(DISTINCT) kept the list properties [1] and [1.0]
# apart while RETURN DISTINCT and GROUP BY merged them. ISO/IEC 39075:2024 20.9 / 22.15: the
# DISTINCT aggregates key a value exactly as grouping does (numbers by exact value, inside a
# list too).
#
# This spec drives a real `geode serve` through the CLI: five nodes whose list property holds
# [1], [1.0], [2, 3], [2.0, 3] and ['1'] must be three distinct values for count(DISTINCT),
# size(collect(DISTINCT)), the grouped DISTINCT aggregates and RETURN DISTINCT alike.

version: '1.0'
name: SONNY-2812 DISTINCT aggregates key list values like DISTINCT and GROUP BY
description: count(DISTINCT) / collect(DISTINCT) over list properties agree with RETURN DISTINCT and GROUP BY
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 240000
    cleanup: true
    args:
    - --log-level
    - warn
    env:
      GEODE_ADMIN_PASSWORD: Correct Horse Battery Staple 42!
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 30000
    tls_verify: false
    format: json
default_timeout_ms: 120000
tests:
- name: seed
  description: Five nodes holding the lists [1], [1.0], [2,3], [2.0,3], ['1']
  args:
  - query
  - '-'
  stdin: "CREATE (:L2812 {v: [1], g: 1}); CREATE (:L2812 {v: [1.0], g: 1}); CREATE (:L2812 {v: [2, 3], g: 1}); CREATE (:L2812 {v: [2.0, 3], g: 2}); CREATE (:L2812 {v: ['1'], g: 2})"
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
  tags:
  - storage
  - sonny738
- name: count-distinct
  description: 'count(DISTINCT) merges [1] and [1.0], [2,3] and [2.0,3]: 3 values'
  args:
  - query
  - '-'
  stdin: MATCH (n:L2812) RETURN count(DISTINCT n.v) AS c
  expect:
    exit_code: 0
    stdout_contains:
    - '"rows":[{"c":3}]'
  tags:
  - storage
  - sonny738
- name: collect-distinct
  description: 'size(collect(DISTINCT)) agrees: 3'
  args:
  - query
  - '-'
  stdin: MATCH (n:L2812) RETURN size(collect(DISTINCT n.v)) AS c
  expect:
    exit_code: 0
    stdout_contains:
    - '"rows":[{"c":3}]'
  tags:
  - storage
  - sonny738
- name: grouped-count-distinct
  description: "Per group: group 1 holds [1],[1.0],[2,3] = 2, group 2 holds [2.0,3],['1'] = 2"
  args:
  - query
  - '-'
  stdin: MATCH (n:L2812) RETURN n.g AS g, count(DISTINCT n.v) AS c GROUP BY n.g ORDER BY g
  expect:
    exit_code: 0
    stdout_contains:
    - '"rows":[{"g":1,"c":2},{"g":2,"c":2}]'
  tags:
  - storage
  - sonny738
- name: grouped-collect-distinct
  description: Per group size(collect(DISTINCT)) agrees
  args:
  - query
  - '-'
  stdin: MATCH (n:L2812) RETURN n.g AS g, size(collect(DISTINCT n.v)) AS c GROUP BY n.g ORDER BY g
  expect:
    exit_code: 0
    stdout_contains:
    - '"rows":[{"g":1,"c":2},{"g":2,"c":2}]'
  tags:
  - storage
  - sonny738
- name: return-distinct-agrees
  description: 'RETURN DISTINCT keys the same way: three rows'
  args:
  - query
  - '-'
  stdin: MATCH (n:L2812) RETURN DISTINCT n.v AS v
  expect:
    exit_code: 0
    stdout_contains:
    - '"rows":[{"v":[1]},{"v":[2,3]},{"v":["1"]}]'
  tags:
  - storage
  - sonny738
