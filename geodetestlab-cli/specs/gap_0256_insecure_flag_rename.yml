name: 'GAP-0256: --insecure flag rename to --insecure-tls-skip-verify'
description: Verify that --insecure-tls-skip-verify is the primary flag and --insecure works as a silent alias
mode: server
server_args: []
tests:
- name: 'GAP-0256-001: query help shows new flag name'
  command: zig-out/bin/geode query --help
  expected:
    exit_code: 0
    stdout_contains:
    - --insecure-tls-skip-verify

- name: 'GAP-0256-002: query help shows deprecated annotation'
  command: zig-out/bin/geode query --help
  expected:
    exit_code: 0
    stdout_contains:
    - deprecated

- name: 'GAP-0256-003: shell help shows new flag name'
  command: zig-out/bin/geode shell --help
  expected:
    exit_code: 0
    stdout_contains:
    - --insecure-tls-skip-verify

- name: 'GAP-0256-004: shell help shows deprecated annotation'
  command: zig-out/bin/geode shell --help
  expected:
    exit_code: 0
    stdout_contains:
    - deprecated

- name: 'GAP-0256-005: --insecure flag works silently (no deprecation warning)'
  command: zig-out/bin/geode query --insecure --server ${GEODE_SERVER_ADDRESS} 'RETURN 1 AS x'
  expected:
    exit_code: 0
    stdout_contains:
    - '1'
    stdout_not_contains:
    - deprecated

- name: 'GAP-0256-006: new flag works for query'
  query: RETURN 42 AS answer
  expected:
    exit_code: 0
    stdout_contains:
    - '42'

- name: 'GAP-0256-007: backup create help shows new flag name'
  command: zig-out/bin/geode backup create --help
  expected:
    exit_code: 0
    stdout_contains:
    - --insecure-tls-skip-verify
