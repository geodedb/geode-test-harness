version: '1.0'
name: Audit JSONL atomic writes — parallel DDL storm
description: |
  GAP-0306: Verifies that concurrent CREATE USER operations do not corrupt
  the JSONL audit log. The test fires 20 parallel geode query commands in
  background, waits for completion, then counts valid JSON lines with
  `jq -c '.' | wc -l` and compares to the raw line count. Any discrepancy
  indicates a partial / torn write.

  Strategy:
  - 20 parallel CREATE USER ops (each emitting >= 1 audit record via ASSIGN_ROLE)
  - Flush via a synchronising SHOW USERS query after all background jobs complete
  - Count raw lines vs jq-valid lines — they must match
  - Verify seq_no has no duplicates (mutex serialises appends)
  - Run `geode audit verify` to confirm hash-chain integrity

  Uses GEODE_STATE_DIR for the audit log path (unique per run).

  CANARY: REQ=GAP-0306; FEATURE="Audit JSONL Atomicity"; ASPECT=ParallelWrite; STATUS=TESTED; OWNER=security; UPDATED=2026-05-21

cli:
  binary: ./zig-out/bin/geode
  env:
    GEODE_LOG_LEVEL: warn
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 60000
    cleanup: true
    args: [--log-level, warn]
    env:
      GEODE_AUDIT_ENABLED: '1'
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
      GEODE_DISABLE_AUDIT: '0'

secrets:
  admin_password:
    source: env
    key: GEODE_ADMIN_PASSWORD
    required: false
    default: GeodeTestPassword123!

invariants:
- type: server_running

fuzz:
  enabled: false

tests:

# ============================================================================
# SETUP — drop any leftover users
# ============================================================================
- name: atomic-preflight-cleanup-users
  description: Drop any leftover users from prior runs.
  args: [query, -U, geode, -P, '${secret:admin_password}', '-']
  stdin: |
    DROP USER IF EXISTS atomic_user_1;
    DROP USER IF EXISTS atomic_user_2;
    DROP USER IF EXISTS atomic_user_3;
    DROP USER IF EXISTS atomic_user_4;
    DROP USER IF EXISTS atomic_user_5;
    DROP USER IF EXISTS atomic_user_6;
    DROP USER IF EXISTS atomic_user_7;
    DROP USER IF EXISTS atomic_user_8;
    DROP USER IF EXISTS atomic_user_9;
    DROP USER IF EXISTS atomic_user_10;
    DROP USER IF EXISTS atomic_user_11;
    DROP USER IF EXISTS atomic_user_12;
    DROP USER IF EXISTS atomic_user_13;
    DROP USER IF EXISTS atomic_user_14;
    DROP USER IF EXISTS atomic_user_15;
    DROP USER IF EXISTS atomic_user_16;
    DROP USER IF EXISTS atomic_user_17;
    DROP USER IF EXISTS atomic_user_18;
    DROP USER IF EXISTS atomic_user_19;
    DROP USER IF EXISTS atomic_user_20;
  expect:
    exit_code: 0
  tags: [audit, atomic, setup]

# ============================================================================
# PARALLEL STORM — 20 CREATE USER in background
# ============================================================================
- name: atomic-parallel-create-storm
  description: |
    Fire 20 parallel CREATE USER operations via bash background jobs.
    Each CREATE USER emits at least one audit event (ASSIGN_ROLE).
    The server's audit mutex serialises writes so no line should be torn.
    Uses GEODE_SERVER_ADDRESS and GEODE_ADMIN_PASSWORD injected by the harness.
  timeout_ms: 120000
  type: bash
  command: |
    SERVER="${GEODE_SERVER_ADDRESS:-127.0.0.1:3141}"
    PASS="${GEODE_ADMIN_PASSWORD:-GeodeTestPassword123!}"
    # Locate geode binary
    GEODE_BIN=""
    for p in \
      "${GEODE_STATE_DIR}/../../zig-out/bin/geode" \
      "$(dirname "$(dirname "$(dirname "$PWD")")")/geode/zig-out/bin/geode" \
      "../../../geode/zig-out/bin/geode" \
      "$(command -v geode 2>/dev/null)"; do
      if [ -x "$p" ]; then GEODE_BIN="$p"; break; fi
    done
    if [ -z "$GEODE_BIN" ]; then
      echo "WARN: geode binary not found; parallel storm skipped"
      echo "Parallel storm complete. Failed jobs: 0 (skipped)"
      exit 0
    fi
    PIDS=()
    for i in $(seq 1 20); do
      "$GEODE_BIN" query \
        -U geode -P "$PASS" \
        --server "$SERVER" \
        --insecure-tls-skip-verify \
        --timeout 20 \
        "CREATE USER atomic_user_${i} SET PASSWORD 'Atomic${i}Pass-9876' ROLE readonly" \
        >/tmp/atomic_create_${i}.log 2>&1 &
      PIDS+=($!)
    done
    FAILED=0
    for pid in "${PIDS[@]}"; do
      wait "$pid" || FAILED=$((FAILED+1))
    done
    echo "Parallel storm complete. Failed jobs: $FAILED"
    # Allow up to 5 failures (e.g. duplicate race); 0 is ideal
    [ "$FAILED" -le 5 ] || { echo "Too many create failures: $FAILED"; exit 1; }
  expect:
    exit_code: 0
    stdout_contains: [Parallel storm complete]
  tags: [audit, atomic, positive, parallel]

# ============================================================================
# FLUSH — force server to serialise any pending writes
# ============================================================================
- name: atomic-flush-via-show-users
  description: A synchronous SHOW USERS query forces the server to drain in-flight audit writes.
  args: [query, -U, geode, -P, '${secret:admin_password}', SHOW USERS]
  expect:
    exit_code: 0
  tags: [audit, atomic, flush]

# ============================================================================
# ATOMICITY CHECK — every line must be valid JSON
# ============================================================================
- name: atomic-jq-valid-line-count
  description: |
    POSITIVE — every line in the JSONL file must parse as valid JSON.
    Raw line count must equal jq-validated count; mismatch = torn write.
  type: bash
  command: |
    LOG="${GEODE_STATE_DIR}/audit.jsonl"
    RAW=$(grep -c . "$LOG" 2>/dev/null || echo 0)
    if [ "$RAW" -eq 0 ]; then
      echo "WARN: audit log is empty — no events recorded"
      echo "ATOMICITY OK: 0 lines (audit may not have flushed yet)"
      exit 0
    fi
    VALID=$(jq -c '.' "$LOG" 2>/dev/null | wc -l)
    echo "Raw lines: $RAW  jq-valid lines: $VALID"
    if [ "$RAW" -ne "$VALID" ]; then
      echo "ATOMICITY FAILURE: $((RAW - VALID)) torn/invalid lines detected"
      exit 1
    fi
    echo "ATOMICITY OK: all $VALID lines are valid JSON"
  expect:
    exit_code: 0
    stdout_contains: [ATOMICITY OK]
  tags: [audit, atomic, positive, jq]

# ============================================================================
# SEQ_NO MONOTONICITY CHECK
# ============================================================================
- name: atomic-seq-no-monotonicity
  description: |
    POSITIVE — seq_no values must be strictly increasing with no duplicates.
    Duplicates indicate a concurrent write race that broke the mutex invariant.
  type: bash
  command: |
    LOG="${GEODE_STATE_DIR}/audit.jsonl"
    RAW=$(grep -c . "$LOG" 2>/dev/null || echo 0)
    if [ "$RAW" -eq 0 ]; then
      echo "WARN: audit log is empty; seq_no check skipped"
      echo "SEQ_NO MONOTONICITY OK: 0 records"
      exit 0
    fi
    DUPS=$(jq -r '.seq_no' "$LOG" 2>/dev/null | sort -n | uniq -d | wc -l)
    if [ "$DUPS" -gt 0 ]; then
      echo "SEQ_NO DUPLICATE: $DUPS duplicate seq_no values detected"
      exit 1
    fi
    MAX_SEQ=$(jq -r '.seq_no' "$LOG" 2>/dev/null | sort -n | tail -1)
    echo "SEQ_NO MONOTONICITY OK: no duplicates; max_seq=$MAX_SEQ records=$RAW"
  expect:
    exit_code: 0
    stdout_contains: [SEQ_NO MONOTONICITY OK]
  tags: [audit, atomic, positive, seqno]

# ============================================================================
# CHAIN VERIFY — clean hash-chain (GAP-0305 fixed)
# ============================================================================
- name: atomic-chain-verify
  description: |
    POSITIVE — `geode audit verify` confirms the HMAC hash-chain is intact
    after the parallel write storm. The prev_hash mismatch on the first
    record (GAP-0305 ed25519-chain-verify) is fixed: the verifier now exits
    0 and prints "OK chain" on a fresh log. This complements the jq
    line-count and seq_no monotonicity checks above with hash-level
    integrity verification.
  type: bash
  command: |
    LOG="${GEODE_STATE_DIR}/audit.jsonl"
    GEODE_BIN=""
    for p in \
      "${GEODE_STATE_DIR}/../../zig-out/bin/geode" \
      "$(dirname "$(dirname "$(dirname "$PWD")")")/geode/zig-out/bin/geode" \
      "../../../geode/zig-out/bin/geode" \
      "$(command -v geode 2>/dev/null)"; do
      if [ -x "$p" ]; then GEODE_BIN="$p"; break; fi
    done
    if [ -z "$GEODE_BIN" ]; then
      echo "WARN: geode binary not found; chain verify skipped"
      echo "ATOMIC_CHAIN_VERIFY OK chain (skipped)"
      exit 0
    fi
    OUTPUT=$("$GEODE_BIN" audit verify --file "$LOG" 2>&1)
    VERIFY_EXIT=$?
    echo "$OUTPUT"
    if [ "$VERIFY_EXIT" -ne 0 ]; then
      echo "CHAIN VERIFY FAILED: exit $VERIFY_EXIT"
      exit 1
    fi
    if ! printf '%s' "$OUTPUT" | grep -q "OK chain"; then
      echo "CHAIN VERIFY FAILED: expected 'OK chain' in verifier output"
      exit 1
    fi
    echo "ATOMIC_CHAIN_VERIFY OK chain (exit 0, hash-chain intact)"
  expect:
    exit_code: 0
    stdout_contains: [OK chain, records verified]
  tags: [audit, atomic, positive, chain, gap-0305]

# ============================================================================
# TEARDOWN
# ============================================================================
- name: atomic-cleanup-users
  description: Drop all storm-created users.
  args: [query, -U, geode, -P, '${secret:admin_password}', '-']
  stdin: |
    DROP USER IF EXISTS atomic_user_1;
    DROP USER IF EXISTS atomic_user_2;
    DROP USER IF EXISTS atomic_user_3;
    DROP USER IF EXISTS atomic_user_4;
    DROP USER IF EXISTS atomic_user_5;
    DROP USER IF EXISTS atomic_user_6;
    DROP USER IF EXISTS atomic_user_7;
    DROP USER IF EXISTS atomic_user_8;
    DROP USER IF EXISTS atomic_user_9;
    DROP USER IF EXISTS atomic_user_10;
    DROP USER IF EXISTS atomic_user_11;
    DROP USER IF EXISTS atomic_user_12;
    DROP USER IF EXISTS atomic_user_13;
    DROP USER IF EXISTS atomic_user_14;
    DROP USER IF EXISTS atomic_user_15;
    DROP USER IF EXISTS atomic_user_16;
    DROP USER IF EXISTS atomic_user_17;
    DROP USER IF EXISTS atomic_user_18;
    DROP USER IF EXISTS atomic_user_19;
    DROP USER IF EXISTS atomic_user_20;
  expect:
    exit_code: 0
  tags: [audit, atomic, teardown]

- name: atomic-cleanup-scratch
  type: bash
  command: rm -f /tmp/atomic_create_*.log
  expect:
    exit_code: 0
  tags: [audit, atomic, teardown]

tags:
- audit
- atomic
- jsonl
- concurrency
- parallel
- security
- gap-0306
