version: '1.0'
name: Geode Query File Flag Comprehensive Tests
description: Comprehensive tests for geode query --file/-f flag with chunked execution
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    startup_timeout_ms: 30000
    args:
    - --log-level
    - error
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
secrets: {}
invariants:
- type: server_running
fuzz:
  enabled: false
tests:
- name: setup-file-test-graph
  description: Create graph for file flag tests
  args:
  - query
  - --insecure
  - CREATE GRAPH IF NOT EXISTS file_test_graph
  expect:
    exit_code: 0
  tags:
  - setup
- name: file-flag-basic-single-statement
  description: Execute single statement from file using --file flag
  setup:
    files:
    - path: /tmp/geode_test_single.gql
      content: "USE GRAPH file_test_graph;\nCREATE (n:FileTest {id: 1, name: 'basic'});\n"
  args:
  - query
  - --insecure
  - --file
  - /tmp/geode_test_single.gql
  expect:
    exit_code: 0
    stdout_contains:
    - Executing from file
  cleanup:
  - - query
    - --insecure
    - 'USE GRAPH file_test_graph; MATCH (n:FileTest {id: 1}) DELETE n'
  tags:
  - file
  - basic
- name: file-flag-short-form
  description: Execute file using -f short flag
  setup:
    files:
    - path: /tmp/geode_test_short.gql
      content: "USE GRAPH file_test_graph;\nCREATE (n:FileTest {id: 2, name: 'short-flag'});\n"
  args:
  - query
  - --insecure
  - -f
  - /tmp/geode_test_short.gql
  expect:
    exit_code: 0
    stdout_contains:
    - Executing from file
  cleanup:
  - - query
    - --insecure
    - 'USE GRAPH file_test_graph; MATCH (n:FileTest {id: 2}) DELETE n'
  tags:
  - file
  - short-flag
- name: file-flag-verify-execution
  description: Verify file execution created nodes
  setup:
    files:
    - path: /tmp/geode_test_verify.gql
      content: "USE GRAPH file_test_graph;\nCREATE (a:VerifyTest {seq: 1});\nCREATE (b:VerifyTest {seq: 2});\nCREATE (c:VerifyTest {seq: 3});\n"
  args:
  - query
  - --insecure
  - --file
  - /tmp/geode_test_verify.gql
  expect:
    exit_code: 0
  verify:
  - args:
    - query
    - --insecure
    - USE GRAPH file_test_graph; MATCH (n:VerifyTest) RETURN count(n) AS cnt
    expect:
      stdout_contains:
      - '3'
  cleanup:
  - - query
    - --insecure
    - USE GRAPH file_test_graph; MATCH (n:VerifyTest) DELETE n
  tags:
  - file
  - verify
- name: file-flag-strip-double-hyphen-comments
  description: Test that -- comments are stripped from file
  setup:
    files:
    - path: /tmp/geode_test_comments_hyphen.gql
      content: "-- This is a comment at the start\nUSE GRAPH file_test_graph;\n-- Another comment in the middle\nCREATE (n:CommentTest {id: 10, type: 'hyphen'});\n-- Final comment\n"
  args:
  - query
  - --insecure
  - --file
  - /tmp/geode_test_comments_hyphen.gql
  expect:
    exit_code: 0
  verify:
  - args:
    - query
    - --insecure
    - 'USE GRAPH file_test_graph; MATCH (n:CommentTest {id: 10}) RETURN n.type AS type'
    expect:
      stdout_contains:
      - hyphen
  cleanup:
  - - query
    - --insecure
    - 'USE GRAPH file_test_graph; MATCH (n:CommentTest {id: 10}) DELETE n'
  tags:
  - file
  - comments
- name: file-flag-strip-hash-comments
  description: 'Test that # comments are stripped from file'
  setup:
    files:
    - path: /tmp/geode_test_comments_hash.gql
      content: "# This is a hash comment\nUSE GRAPH file_test_graph;\n# Another hash comment\nCREATE (n:CommentTest {id: 11, type: 'hash'});\n"
  args:
  - query
  - --insecure
  - --file
  - /tmp/geode_test_comments_hash.gql
  expect:
    exit_code: 0
  verify:
  - args:
    - query
    - --insecure
    - 'USE GRAPH file_test_graph; MATCH (n:CommentTest {id: 11}) RETURN n.type AS type'
    expect:
      stdout_contains:
      - hash
  cleanup:
  - - query
    - --insecure
    - 'USE GRAPH file_test_graph; MATCH (n:CommentTest {id: 11}) DELETE n'
  tags:
  - file
  - comments
- name: file-flag-strip-empty-lines
  description: Test that empty lines are stripped
  setup:
    files:
    - path: /tmp/geode_test_empty_lines.gql
      content: "USE GRAPH file_test_graph;\n\nCREATE (n:EmptyLineTest {id: 20});\n\nCREATE (m:EmptyLineTest {id: 21});\n"
  args:
  - query
  - --insecure
  - --file
  - /tmp/geode_test_empty_lines.gql
  expect:
    exit_code: 0
  verify:
  - args:
    - query
    - --insecure
    - USE GRAPH file_test_graph; MATCH (n:EmptyLineTest) RETURN count(n) AS cnt
    expect:
      stdout_contains:
      - '2'
  cleanup:
  - - query
    - --insecure
    - USE GRAPH file_test_graph; MATCH (n:EmptyLineTest) DELETE n
  tags:
  - file
  - whitespace
- name: file-flag-mixed-comments-and-empty-lines
  description: Test file with mixed comments, empty lines, and statements
  setup:
    files:
    - path: /tmp/geode_test_mixed.gql
      content: "-- Setup section\nUSE GRAPH file_test_graph;\n\n# Create some nodes\nCREATE (a:MixedTest {id: 30});\n\n-- Second node\nCREATE (b:MixedTest {id: 31});\n# Third node with hash comment\n\nCREATE (c:MixedTest {id: 32});\n"
  args:
  - query
  - --insecure
  - --file
  - /tmp/geode_test_mixed.gql
  expect:
    exit_code: 0
  verify:
  - args:
    - query
    - --insecure
    - USE GRAPH file_test_graph; MATCH (n:MixedTest) RETURN count(n) AS cnt
    expect:
      stdout_contains:
      - '3'
  cleanup:
  - - query
    - --insecure
    - USE GRAPH file_test_graph; MATCH (n:MixedTest) DELETE n
  tags:
  - file
  - comments
  - whitespace
- name: file-flag-tilde-expansion-error
  description: Test tilde expansion when HOME is set (expect file not found for test path)
  args:
  - query
  - --insecure
  - --file
  - ~/nonexistent_geode_test_file_xyz.gql
  expect:
    exit_code: 2
    stderr_contains:
    - 'Error: Cannot open file'
    - nonexistent_geode_test_file_xyz.gql
  tags:
  - file
  - path
  - error
- name: file-flag-absolute-path
  description: Test execution with absolute path
  setup:
    files:
    - path: /tmp/geode_test_absolute.gql
      content: "USE GRAPH file_test_graph;\nCREATE (n:AbsPathTest {id: 40});\n"
  args:
  - query
  - --insecure
  - --file
  - /tmp/geode_test_absolute.gql
  expect:
    exit_code: 0
  cleanup:
  - - query
    - --insecure
    - USE GRAPH file_test_graph; MATCH (n:AbsPathTest) DELETE n
  tags:
  - file
  - path
- name: file-flag-relative-path
  description: Test execution with relative path (uses /tmp for sandbox compliance)
  setup:
    files:
    - path: /tmp/geode_test_relative.gql
      content: "USE GRAPH file_test_graph;\nCREATE (n:RelPathTest {id: 41});\n"
  args:
  - query
  - --insecure
  - --file
  - /tmp/geode_test_relative.gql
  expect:
    exit_code: 0
  cleanup:
  - - query
    - --insecure
    - USE GRAPH file_test_graph; MATCH (n:RelPathTest) DELETE n
  - - rm
    - -f
    - /tmp/geode_test_relative.gql
  tags:
  - file
  - path
- name: file-flag-file-not-found
  description: Test error when file does not exist
  args:
  - query
  - --insecure
  - --file
  - /tmp/nonexistent_file_that_does_not_exist_12345.gql
  expect:
    exit_code: 2
    stderr_contains:
    - 'Error: Cannot open file'
    - nonexistent_file_that_does_not_exist_12345.gql
  tags:
  - file
  - error
  - not-found
- name: file-flag-empty-file
  description: Test error when file contains no valid statements (only comments/whitespace)
  setup:
    files:
    - path: /tmp/geode_test_empty.gql
      content: "-- Only comments\n# More comments\n\n-- Nothing else\n"
  args:
  - query
  - --insecure
  - --file
  - /tmp/geode_test_empty.gql
  expect:
    exit_code: 2
    stderr_contains:
    - 'Error: File contains no valid GQL statements'
  tags:
  - file
  - error
  - empty
- name: file-flag-multiple-statements
  description: Execute file with multiple statements (small file, single batch)
  setup:
    files:
    - path: /tmp/geode_test_multi.gql
      content: "USE GRAPH file_test_graph;\nCREATE (n1:MultiStmt {id: 50, seq: 1});\nCREATE (n2:MultiStmt {id: 51, seq: 2});\nCREATE (n3:MultiStmt {id: 52, seq: 3});\nCREATE (n4:MultiStmt {id: 53, seq: 4});\nCREATE (n5:MultiStmt {id: 54, seq: 5});\n"
  args:
  - query
  - --insecure
  - --file
  - /tmp/geode_test_multi.gql
  expect:
    exit_code: 0
  verify:
  - args:
    - query
    - --insecure
    - USE GRAPH file_test_graph; MATCH (n:MultiStmt) RETURN count(n) AS cnt
    expect:
      stdout_contains:
      - '5'
  cleanup:
  - - query
    - --insecure
    - USE GRAPH file_test_graph; MATCH (n:MultiStmt) DELETE n
  tags:
  - file
  - multi-statement
- name: file-flag-ten-statements
  description: Execute file with 10 statements
  setup:
