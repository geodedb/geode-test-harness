    - path: /tmp/geode_test_ten.gql
      content: "USE GRAPH file_test_graph;\nCREATE (n1:TenStmt {id: 60});\nCREATE (n2:TenStmt {id: 61});\nCREATE (n3:TenStmt {id: 62});\nCREATE (n4:TenStmt {id: 63});\nCREATE (n5:TenStmt {id: 64});\nCREATE (n6:TenStmt {id: 65});\nCREATE (n7:TenStmt {id: 66});\nCREATE (n8:TenStmt {id: 67});\nCREATE (n9:TenStmt {id: 68});\nCREATE (n10:TenStmt {id: 69});\n"
