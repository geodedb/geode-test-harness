  - args:
    - query
    - --insecure
    - USE GRAPH file_flag_graph2; MATCH (n:GraphFlagTest) RETURN count(n) AS cnt
    expect:
      stdout_contains:
      - '1'
  cleanup:
  - - query
    - --insecure
    - DROP GRAPH IF EXISTS file_flag_graph2
  tags:
  - file
  - graph-flag
- name: file-flag-with-format-json
  description: Test --file flag with --format json
  setup:
    files:
