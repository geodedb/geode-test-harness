    expect:
      stdout_contains:
      - multiline-test
  cleanup:
  - - query
    - --insecure
    - USE GRAPH file_test_graph; MATCH (n:MultilineStmt) DELETE n
  tags:
  - file
  - multiline
- name: file-flag-with-graph-flag
  description: Test --file flag combined with --graph flag
  setup:
    commands:
    - - query
      - --insecure
      - CREATE GRAPH IF NOT EXISTS file_flag_graph2
    files:
    - path: /tmp/geode_test_with_graph.gql
      content: "CREATE (n:GraphFlagTest {id: 200});\n"
  args:
