- name: file-flag-mixed-statement-types
  description: Execute file with mixed CREATE, MATCH, and relationship statements
  setup:
    files:
    - path: /tmp/geode_test_mixed_types.gql
      content: "USE GRAPH file_test_graph;\nCREATE (a:MixedType {name: 'A'});\nCREATE (b:MixedType {name: 'B'});\nMATCH (x:MixedType {name: 'A'}), (y:MixedType {name: 'B'})\nCREATE (x)-[:RELATED_TO]->(y);\n"
  args:
  - query
  - --insecure
  - --file
  - /tmp/geode_test_mixed_types.gql
  expect:
    exit_code: 0
  verify:
  - args:
    - query
    - --insecure
    - USE GRAPH file_test_graph; MATCH ()-[r:RELATED_TO]->() RETURN count(r) AS cnt
    expect:
      stdout_contains:
      - '1'
  cleanup:
  - - query
    - --insecure
    - USE GRAPH file_test_graph; MATCH (n:MixedType) DETACH DELETE n
  tags:
  - file
  - mixed-types
- name: file-flag-multiline-statement
  description: Execute file with statement spanning multiple lines
  setup:
    files:
    - path: /tmp/geode_test_multiline.gql
      content: "USE GRAPH file_test_graph;\nCREATE (n:MultilineStmt {\n  id: 100,\n  name: 'multiline-test',\n  description: 'A statement that spans multiple lines',\n  value: 42,\n  active: true\n});\n"
