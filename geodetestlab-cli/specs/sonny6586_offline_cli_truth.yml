version: '1.0'
name: SONNY-6586 CLI answers truthfully (stepup, missing data dir, grant/revoke --help, --log-level)
description: |
  Ticket: SONNY-6586.
  Bug: `geode authn stepup-check/stepup-mark` fabricated answers ("Session
  elevated"); offline auth commands (`user list`, `role list`, `grant`, `auth
  reseal`, ...) on a missing data dir failed with DataDirLockUnavailable and
  could create the directory; `grant --help` / `revoke --help` needed the auth
  store; `query --log-level` was silently ignored.
  Spec proves on the real binary: stepup-check / stepup-mark exit 1 with "not
  supported by this server" and no success claim; offline commands on a
  missing directory exit 1 naming the directory ("does not exist"), without
  DataDirLockUnavailable and without creating it; grant/revoke --help exit 0
  and usage errors exit 2 even for a missing data dir; query/shell/tenant
  refuse --log-level (exit 2 naming it).

single_node_only: true  # each step starts its own private geode server / offline CLI: no harness server

cli:
  binary: ./zig-out/bin/geode
  env:
    GEODE_LOG_LEVEL: warn
  server:
    enabled: false
  client:
    timeout_ms: 420000
    tls_verify: false
    format: json

invariants: []

fuzz:
  enabled: false

tests:

- name: sonny6586-stepup-refused
  type: bash
  command: |
    BIN="${GEODE_BINARY:-geode}"
    H=$(mktemp -d); trap 'rm -rf "$H"' EXIT
    for args in "stepup-check --action admin:drop" "stepup-check --action read:data" "stepup-mark"; do
      OUT=$(HOME="$H" "$BIN" authn $args 2>&1); RC=$?
      [ "$RC" -eq 1 ] || { echo "FAIL authn $args rc=$RC"; echo "$OUT"; exit 1; }
      echo "$OUT" | grep -q "not supported by this server" || { echo "FAIL authn $args no refusal"; echo "$OUT"; exit 1; }
      for claim in "Session elevated" "elevated successfully" "No step-up required" "Step-up required for"; do
        echo "$OUT" | grep -qF "$claim" && { echo "FAIL authn $args claims '$claim'"; exit 1; }
      done
    done
    echo "STEPUP_OK"
  timeout_ms: 420000
  expect:
    exit_code: 0
    stdout_contains: [STEPUP_OK]
  tags: [cli, sonny6586]

- name: sonny6586-missing-data-dir-named
  type: bash
  command: |
    BIN="${GEODE_BINARY:-geode}"
    H=$(mktemp -d); trap 'rm -rf "$H"' EXIT
    M="$H/no-such-data-dir"
    run() { OUT=$(HOME="$H" "$BIN" "$@" --data-dir "$M" 2>&1); RC=$?
      [ "$RC" -eq 1 ] || { echo "FAIL $1 $2 rc=$RC (want 1)"; echo "$OUT"; exit 1; }
      echo "$OUT" | grep -q "does not exist" || { echo "FAIL $1 $2: no 'does not exist'"; echo "$OUT"; exit 1; }
      echo "$OUT" | grep -qF "$M" || { echo "FAIL $1 $2: data dir not named"; echo "$OUT"; exit 1; }
      echo "$OUT" | grep -q "DataDirLockUnavailable" && { echo "FAIL $1 $2 leaks DataDirLockUnavailable"; exit 1; }
      [ ! -e "$M" ] || { echo "FAIL $1 $2 created $M"; exit 1; }
    }
    run user list
    run role list
    run policy list
    run grant READ --to bob --graph g6586
    run revoke READ --from bob --graph g6586
    run auth reseal
    echo "NODIR_OK"
  timeout_ms: 420000
  expect:
    exit_code: 0
    stdout_contains: [NODIR_OK]
  tags: [cli, offline, sonny6586]

- name: sonny6586-grant-revoke-help-and-usage-without-store
  type: bash
  command: |
    BIN="${GEODE_BINARY:-geode}"
    H=$(mktemp -d); trap 'rm -rf "$H"' EXIT
    M="$H/missing"
    t() { want="$1"; pat="$2"; shift 2
      OUT=$(HOME="$H" "$BIN" "$@" --data-dir "$M" 2>&1); RC=$?
      [ "$RC" -eq "$want" ] || { echo "FAIL $* rc=$RC want $want"; echo "$OUT"; exit 1; }
      echo "$OUT" | grep -qF -- "$pat" || { echo "FAIL $*: missing '$pat'"; echo "$OUT"; exit 1; }
    }
    t 0 "Usage: geode grant" grant --help
    t 0 "Usage: geode grant" grant read:data --help
    t 0 "Usage: geode grant" grant -h
    t 2 "missing permission to grant" grant
    t 2 "target user or role required" grant read:data
    t 0 "Usage: geode revoke" revoke --help
    t 0 "Usage: geode revoke" revoke read:data -h
    t 2 "missing permission to revoke" revoke
    t 2 "--from flag is required" revoke read:data
    [ ! -e "$M" ] || { echo "FAIL missing dir created"; exit 1; }
    echo "HELP_OK"
  timeout_ms: 420000
  expect:
    exit_code: 0
    stdout_contains: [HELP_OK]
  tags: [cli, sonny6586]

- name: sonny6586-log-level-refused
  type: bash
  command: |
    BIN="${GEODE_BINARY:-geode}"
    export GEODE_ENABLE_MFA=1 GEODE_ALLOW_INSECURE_TLS=1 GEODE_DATA_DIR_LOCK_TIMEOUT_MS=0
    D=$(mktemp -d); H="$D/home"; mkdir -p "$H"
    PW='Geode Test Admin Passphrase'
    SD="$D/srv"; mkdir -p "$SD"
    PORT=$(python3 -c 'import socket;s=socket.socket();s.bind(("127.0.0.1",0));print(s.getsockname()[1])')
    ADDR="127.0.0.1:$PORT"
    SPID=""
    cleanup() { [ -n "$SPID" ] && kill -9 "$SPID" 2>/dev/null; rm -rf "$D"; }
    trap cleanup EXIT
    q() { "$BIN" query --server "$ADDR" --insecure-tls-skip-verify -U geode -P "$PW" "$1" 2>&1; }
    privstart() {
      GEODE_ADMIN_PASSWORD="$PW" "$BIN" auth init --data-dir "$SD" >/dev/null 2>&1 || { echo "FAIL auth init"; exit 1; }
      start
    }
    start() { "$BIN" serve --listen "$ADDR" --data-dir "$SD" --log-level warn >>"$D/srv.log" 2>&1 & SPID=$!
      for i in $(seq 1 120); do q "RETURN 1" | grep -q '"rows"' && return 0; kill -0 "$SPID" 2>/dev/null || break; sleep 0.5; done
      echo "FAIL server did not start"; tail -20 "$D/srv.log"; exit 1; }
    stop() { kill -TERM "$SPID" 2>/dev/null; wait "$SPID" 2>/dev/null; SPID=""; }
    kill9() { kill -9 "$SPID" 2>/dev/null; wait "$SPID" 2>/dev/null; SPID=""; }
    totp() { python3 - "$1" <<'PY'
    import sys,hmac,hashlib,struct,time,base64
    s=sys.argv[1].strip().upper(); s+='='*(-len(s)%8)
    k=base64.b32decode(s)
    h=hmac.new(k,struct.pack('>Q',int(time.time())//30),hashlib.sha1).digest()
    o=h[-1]&15
    print('%06d'%((struct.unpack('>I',h[o:o+4])[0]&0x7fffffff)%1000000))
    PY
    }
    want() { echo "$2" | grep -q "\"error_code\":\"$3\"" || { echo "FAIL $1: want error_code $3"; echo "$2"; exit 1; }; }
    ok() { echo "$2" | grep -q '"error_code"' && { echo "FAIL $1: unexpected error"; echo "$2"; exit 1; }; return 0; }
    enrol() { # user -> SECRET
      ok "create $1" "$(q "CREATE USER $1 SET PASSWORD 'Correct Horse Battery Staple 6623'")"
      O=$(q "CALL geode.auth.mfa_setup('$1')"); ok "setup $1" "$O"
      SECRET=$(echo "$O" | grep -o 'MFA secret: [A-Z2-7]*' | head -1 | sed 's/MFA secret: //')
      [ -n "$SECRET" ] || { echo "FAIL no secret for $1"; echo "$O"; exit 1; }
    }
    privstart
    chk() { OUT=$(HOME="$H" "$BIN" "$@" --server "$ADDR" --insecure-tls-skip-verify </dev/null 2>&1); RC=$?
      [ "$RC" -eq 2 ] || { echo "FAIL '$*' rc=$RC (want 2)"; echo "$OUT"; exit 1; }
      echo "$OUT" | grep -q -- "--log-level" || { echo "FAIL '$*' does not name --log-level"; echo "$OUT"; exit 1; }
    }
    chk query "RETURN 1" --log-level debug
    chk query --log-level error "RETURN 1"
    chk shell --log-level debug
    chk tenant list --log-level debug
    echo "LOGLEVEL_OK"
  timeout_ms: 420000
  expect:
    exit_code: 0
    stdout_contains: [LOGLEVEL_OK]
  tags: [cli, sonny6586]
