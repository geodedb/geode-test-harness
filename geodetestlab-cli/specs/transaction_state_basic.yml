---
# Transaction State Tests
# Converted from legacy format to compatible schema
version: "1.0"
name: "Transaction State Basic Tests"
description: "Testing transaction state management"

cli:
  binary: "./zig-out/bin/geode"
  server:
    enabled: true
    port: null
    data_dir: null
    startup_timeout_ms: 60000
    cleanup: true
    args: ["--log-level", "warn"]
    env: {}
  client:
    timeout_ms: 30000
    tls_verify: false
    format: "json"

tests:
  - name: tx-begin-basic
    description: Test BEGIN transaction
    args: ["query", "-"]
    stdin: "BEGIN"
    expect:
      exit_code: 0
      stdout_contains: ["00000"]
    tags: [transaction, basic]

  - name: tx-commit-basic
    description: Test COMMIT transaction
    args: ["query", "-"]
    stdin: "BEGIN; RETURN 1 AS x; COMMIT"
    expect:
      exit_code: 0
    tags: [transaction, basic]

  - name: tx-rollback-basic
    description: Test ROLLBACK transaction
    args: ["query", "-"]
    stdin: "BEGIN; CREATE (n:TxTest {id: 1}); ROLLBACK"
    expect:
      exit_code: 0
    tags: [transaction, basic]

  - name: tx-autocommit
    description: Test autocommit behavior
    args: ["query", "-"]
    stdin: "CREATE (n:AutoCommitTest {val: 42}) RETURN n.val AS val"
    expect:
      exit_code: 0
      stdout_contains: ["val"]
    tags: [transaction, autocommit]

  - name: tx-read-after-write
    description: Test reading data written in same transaction
    args: ["query", "-"]
    stdin: |
      BEGIN
      CREATE (n:TxReadWrite {id: 1})
      MATCH (n:TxReadWrite {id: 1}) RETURN n.id AS id
      COMMIT
    expect:
      exit_code: 0
    tags: [transaction, consistency]

  - name: tx-isolation
    description: Test transaction isolation
    args: ["query", "-"]
    stdin: "BEGIN; CREATE (n:IsolationTest {id: 1}) RETURN n.id AS id; COMMIT"
    expect:
      exit_code: 0
    tags: [transaction, isolation]

tags: [transaction, state, gql-compliance]
