version: '1.0'
name: FLE Plaintext Verification - DISABLED Baseline
description: "BASELINE TEST - FLE INTENTIONALLY DISABLED\n\nThis test proves that when FLE is DISABLED, plaintext DOES appear in data files.\nThis is critical because it validates that our grep-based scanning methodology\nactually works and can detect plaintext.\n\nIf this test PASSES (finds plaintext), it proves the scanning methodology is valid.\nIf this test FAILS (no plaintext found), something is wrong with the test setup.\n\nTest Data Markers (these SHOULD appear in data files when FLE is disabled):\n- \"FLEBASELINE_PLAINTEXT_EXPECTED_SSN123\"\n- \"FLEBASELINE_PLAINTEXT_EXPECTED_PWD456\"\n\nCANARY: REQ=REQ-FLE-BASELINE-001; FEATURE=FLEEnforcement; ASPECT=BaselineValidation; STATUS=TESTED; OWNER=security; UPDATED=2026-01-28\n"
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 30000
    cleanup: false
    args:
    - --log-level
    - info
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 15000
    tls_verify: false
    format: json
env:
  GEODE_FLE_ENABLED: 'false'
skip_isolation: true
tests:
- name: fle-baseline-write-ssn
  description: Write SSN data WITHOUT FLE (should be plaintext)
  args:
  - query
  - "CREATE (n:FLETest_Baseline { test_type: 'baseline_ssn', data: 'FLEBASELINE_PLAINTEXT_EXPECTED_SSN123' }) RETURN n.test_type AS test_type"
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
  tags:
  - fle
  - baseline
  - write
- name: fle-baseline-write-password
  description: Write password data WITHOUT FLE (should be plaintext)
  args:
  - query
  - "CREATE (n:FLETest_Baseline { test_type: 'baseline_password', data: 'FLEBASELINE_PLAINTEXT_EXPECTED_PWD456' }) RETURN n.test_type AS test_type"
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
  tags:
  - fle
  - baseline
  - write
- name: fle-baseline-write-combined
  description: Write combined marker data WITHOUT FLE (should be plaintext)
  args:
  - query
  - "CREATE (n:FLETest_Baseline { test_type: 'baseline_combined', data: 'FLEBASELINE_PLAINTEXT_EXPECTED_COMBO789' }) RETURN n.test_type AS test_type"
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
  tags:
  - fle
  - baseline
  - write
- name: fle-baseline-verify-data-readable
  description: Verify all baseline data is readable
  args:
  - query
  - MATCH (n:FLETest_Baseline) RETURN count(*) AS total_records
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
  tags:
  - fle
  - baseline
  - verify
- name: fle-baseline-force-checkpoint
  description: Force checkpoint to ensure all data is written to disk
  args:
  - query
  - RETURN 'checkpoint_requested' AS status
  expect:
    exit_code: 0
  tags:
  - fle
  - baseline
  - checkpoint
- name: fle-baseline-wait-for-flush
  description: Wait for async persistence thread to flush data to disk
  command: sleep
  args:
  - '2'
  expect:
    exit_code: 0
  tags:
  - fle
  - baseline
  - flush-wait
- name: fle-baseline-scan-ssn-plaintext-present
  description: 'BASELINE: Verify SSN marker IS PRESENT in data files (FLE disabled)'
  command: grep
  args:
  - -r
  - -a
  - -l
  - --exclude=*.jsonl
  - --exclude-dir=timeseries
  - --exclude-dir=fts
  - --exclude-dir=wal
  - FLEBASELINE_PLAINTEXT_EXPECTED_SSN123
  - ${data_dir}
  expect:
    exit_code: 0
  tags:
  - fle
  - baseline
  - scan
  - validation
- name: fle-baseline-scan-password-plaintext-present
  description: 'BASELINE: Verify password marker IS PRESENT in data files (FLE disabled)'
  command: grep
  args:
  - -r
  - -a
  - -l
  - --exclude=*.jsonl
  - --exclude-dir=timeseries
  - --exclude-dir=fts
  - --exclude-dir=wal
  - FLEBASELINE_PLAINTEXT_EXPECTED_PWD456
  - ${data_dir}
  expect:
    exit_code: 0
  tags:
  - fle
  - baseline
  - scan
  - validation
- name: fle-baseline-scan-combined-plaintext-present
  description: 'BASELINE: Verify combined marker IS PRESENT in data files (FLE disabled)'
  command: grep
  args:
  - -r
  - -a
  - -l
  - --exclude=*.jsonl
  - --exclude-dir=timeseries
  - --exclude-dir=fts
  - --exclude-dir=wal
  - FLEBASELINE_PLAINTEXT_EXPECTED_COMBO789
  - ${data_dir}
  expect:
    exit_code: 0
  tags:
  - fle
  - baseline
  - scan
  - validation
- name: fle-baseline-binary-scan-prefix-present
  description: 'BASELINE: Verify FLEBASELINE_ prefix IS PRESENT in data files'
  command: grep
  args:
  - -r
  - -a
  - -l
  - --exclude=*.jsonl
  - --exclude-dir=timeseries
  - --exclude-dir=fts
  - --exclude-dir=wal
  - FLEBASELINE_PLAINTEXT_EXPECTED_
  - ${data_dir}
  expect:
    exit_code: 0
  tags:
  - fle
  - baseline
  - binary-scan
  - validation
invariants:
- type: server_running
plaintext_verification:
  enabled: true
  patterns:
  - FLEBASELINE_PLAINTEXT_EXPECTED_SSN123
  - FLEBASELINE_PLAINTEXT_EXPECTED_PWD456
  - FLEBASELINE_PLAINTEXT_EXPECTED_COMBO789
  fail_on_violation: false
  scan_binary_files: true
  baseline_test: true
tags:
- fle
- field-level-encryption
- security
- baseline
- validation
- methodology
