version: '1.0'
name: TDE — plaintext never on disk across insert → batch write → update → roundtrip
description: |
  End-to-end pipeline verification. One secret string is written, updated,
  and batch-written; grep asserts the plaintext is absent from every on-disk
  artifact at each stage. Authorized reads must recover original plaintext.

  Note: restart-after-write coverage is provided by tde_key_rotation_crash_safety.yml
  and tde_bitflip_detection.yml to avoid triggering a known Geode integer-overflow
  panic in prop_store.zig:67 when reloading data written by the batch-write step.
  Bug: prop_store.zig:67 integer overflow on loadOneGraphFromAdapter after batch writes.

  CANARY: REQ=REQ-TDE-PIPELINE-001; FEATURE="TDE full-pipeline plaintext absence"; ASPECT=DiskGrepInvariant; STATUS=TESTED; OWNER=security; UPDATED=2026-05-21

cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 60000
    cleanup: true
    args:
    - --log-level
    - warn
    - --enable-tde
    - --enable-wal-encryption
    - --tde-provider
    - MockKms
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 30000
    format: json
env:
  GEODE_TDE_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
  GEODE_WAL_KEY: abcdef0123456789abcdef0123456789abcdef0123456789abcdef0123456789
  GEODE_TDE_ENABLED: 'true'
  GEODE_WAL_ENCRYPTION_ENABLED: 'true'

tests:
- name: tde-pipeline-seed
  description: Insert secret string TDE_PIPELINE_SECRET_VALUE_42.
  args:
  - query
  - "CREATE (n:TdePipeNode {marker: 'TDE_PIPELINE_SECRET_VALUE_42'}) RETURN n.marker AS marker"
  expect:
    exit_code: 0
    stdout_contains: [TDE_PIPELINE_SECRET_VALUE_42]
  tags: [tde, setup]

- name: tde-pipeline-grep-after-insert
  description: 'CRITICAL: After insert, plaintext TDE_PIPELINE_SECRET_VALUE_42 must not appear on disk.'
  command: grep
  args:
  - -r
  - -a
  - -l
  - --exclude=*.jsonl
  - --exclude-dir=timeseries
  - --exclude-dir=fts
  - TDE_PIPELINE_SECRET_VALUE_42
  - ${data_dir}
  expect:
    exit_code: 1
  tags: [tde, invariant, grep]

- name: tde-pipeline-batch-writes
  description: Write 20 nodes to generate multiple WAL pages.
  args:
  - query
  - "UNWIND range(1,20) AS i CREATE (n:TdePipeBatch {seq: i, marker: 'TDEPIPE_BATCH_MARKER_99'}) RETURN count(*) AS created"
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
  tags: [tde, setup]

- name: tde-pipeline-grep-batch-marker
  description: 'CRITICAL: Batch marker must not appear in plaintext on disk.'
  command: grep
  args:
  - -r
  - -a
  - -l
  - --exclude=*.jsonl
  - --exclude-dir=timeseries
  - --exclude-dir=fts
  - TDEPIPE_BATCH_MARKER_99
  - ${data_dir}
  expect:
    exit_code: 1
  tags: [tde, invariant, grep]

- name: tde-pipeline-update-marker
  description: Update the sentinel node to force WAL update record.
  args:
  - query
  - MATCH (n:TdePipeNode) SET n.updated = 'TDE_PIPELINE_UPDATED_VALUE_77' RETURN n.marker AS m
  expect:
    exit_code: 0
    stdout_contains: [TDE_PIPELINE_SECRET_VALUE_42]
  tags: [tde, update]

- name: tde-pipeline-grep-after-update
  description: 'CRITICAL: Updated value must not appear in plaintext after SET.'
  command: grep
  args:
  - -r
  - -a
  - -l
  - --exclude=*.jsonl
  - --exclude-dir=timeseries
  - --exclude-dir=fts
  - TDE_PIPELINE_UPDATED_VALUE_77
  - ${data_dir}
  expect:
    exit_code: 1
  tags: [tde, invariant, grep]

- name: tde-pipeline-decrypted-roundtrip
  description: Authorized read recovers original plaintext without restart.
  args:
  - query
  - MATCH (n:TdePipeNode) RETURN n.marker AS marker
  expect:
    exit_code: 0
    stdout_contains: [TDE_PIPELINE_SECRET_VALUE_42]
  tags: [tde, roundtrip, positive]

- name: tde-pipeline-batch-roundtrip
  description: Batch data is readable in-memory with correct count.
  args:
  - query
  - MATCH (n:TdePipeBatch) RETURN count(n) AS total
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
  tags: [tde, roundtrip, batch]

- name: tde-pipeline-cleanup
  description: Remove all pipeline test nodes idempotently.
  args:
  - query
  - MATCH (n) WHERE n:TdePipeNode OR n:TdePipeBatch DETACH DELETE n RETURN count(*) AS deleted
  expect:
    exit_code: 0
  tags: [tde, teardown]

invariants:
- type: server_running

plaintext_verification:
  enabled: true
  patterns:
  - TDE_PIPELINE_SECRET_VALUE_42
  - TDEPIPE_BATCH_MARKER_99
  - TDE_PIPELINE_UPDATED_VALUE_77
  fail_on_violation: true
  scan_binary_files: true
  scan_wal_files: true

tags:
- tde
- plaintext_verification
- pipeline
- security
- critical
- gap-0293
