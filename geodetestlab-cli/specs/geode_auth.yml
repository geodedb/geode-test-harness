version: '1.0'
name: Geode Authentication and Authorization Tests
description: Comprehensive testing of Geode's authentication, authorization, and security features
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 60000
    cleanup: true
    args:
    - --log-level
    - info
    # --audit/--audit-file are global client flags, not `geode serve` options (docs/AUDIT_LOGGING.md "Command audit")
    env:
      GEODE_AUDIT_ENABLED: '1'
      GEODE_AUDIT_LOG_PATH: /tmp/geode-audit.log
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
      GEODE_DISABLE_AUDIT: '0'
  client:
    timeout_ms: 30000
    format: json
secrets:
  admin_password:
    source: env
    key: GEODE_ADMIN_PASSWORD
    required: false
  test_user_password:
    source: env
    key: GEODE_TEST_PASSWORD
    required: false
    default: Geode Testp4ssw0rd123 Passphrase
  api_token:
    source: keyring
    service: geodetestlab
    key: api_token
    required: false
invariants:
- type: server_running
- type: exit_code
  equals: 0
fuzz:
  enabled: true
  provider: mock
  max_cases: 5
  include_auth: true
  prompt_template: "Generate authentication and authorization test cases for Geode.\nFocus on login attempts, user management, role assignments, and permission testing.\nInclude both valid and malicious scenarios.\n"
tests:
- name: auth-help
  description: Display authentication help
  args:
  - auth
  - --help
  expect:
    exit_code: 0
    stderr_contains:
    - login
    - logout
    - Authentication
  tags:
  - auth
  - help
- name: user-create-basic
  description: Create a new user
  args:
  - user
  - create
  - testuser
  - test@example.com
  - --password
  - Geode Testp4ss123 Passphrase
  expect:
    exit_code: 0
    stdout_contains:
    - created
    - testuser
  tags:
  - user
  - create
- name: user-create-with-password
  description: Create user with password
  args:
  - user
  - create
  - testuser2
  - test2@example.com
  - --password
  - Geode Testp4ssw0rd123 Passphrase
  expect:
    exit_code: 0
    stdout_contains:
    - created
    - testuser2
  tags:
  - user
  - create
  - password
- name: user-list
  description: List all users
  args:
  - user
  - list
  expect:
    exit_code: 0
    stdout_contains:
    - testuser
  tags:
  - user
  - list
- name: user-enable-disable
  description: Test user enable/disable functionality
  setup:
  - args:
    - user
    - create
    - bob
    - bob@example.com
    - --password
    - Geode B0bp4ssw Passphrase
    expect:
      exit_code: 0
  args:
  - user
  - disable
  - bob
  expect:
    exit_code: 0
    stdout_contains:
    - disabled
    - bob
  cleanup:
  - user delete bob --yes
  tags:
  - user
  - enable
  - disable
- name: role-create
  description: Create a new role
  args:
  - role
  - create
  - test_role
  - Test role for geodetestlab
  expect:
    exit_code: 0
    stdout_contains:
    - created
    - test_role
  tags:
  - role
  - create
- name: role-list
  description: List all roles
  args:
  - role
  - list
  expect:
    exit_code: 0
    stdout_contains:
    - test_role
  tags:
  - role
  - list
- name: policy-create-rls
  description: |
    Create a row-level security policy. Its USING condition is written in
    geode's policy predicate grammar (true, current_user()/current_tenant()/
    current_graph()/resource.label/principal.attributes.<key> = '<literal>',
    AND/OR), which every policy must compile to since geode b5130bf4. The
    old condition, user_id = current_user_id(), compares a row property with
    a function; see policy-create-rls-row-comparison-refused.
  args:
  - policy
  - create
  - user_data_policy
  - User can only see their own data
  - --table
  - users
  - --using
  - current_user() = 'user_data_owner'
  expect:
    exit_code: 0
    stdout_contains:
    - policy
    - created
    - user_data_policy
  tags:
  - policy
  - rls
  - security
- name: policy-create-rls-row-comparison-refused
  description: |
    A USING condition that compares a row property with a function
    (user_id = current_user_id()) is outside the policy predicate grammar,
    and geode refuses it at DDL time with 42000 (b5130bf4). Before that it
    was stored uncompiled and denied everything at runtime, so this spec's
    old "created" expectation pinned a policy that never worked.
  args:
  - policy
  - create
  - user_data_policy_rowcmp
  - User can only see their own data
  - --table
  - users
  - --using
  - user_id = current_user_id()
  expect:
    exit_code: 1
    stdout_contains:
    - '"status_class":"42000"'
    - Unsupported policy USING expression
  tags:
  - policy
  - rls
  - security
  - negative
- name: audit-log-check
  description: Verify audit logging is working
  setup:
  - args:
    - user
    - create
    - audit_test
    - audit@test.com
    - --password
    - Geode Aud1tp4ss Passphrase
    expect:
      exit_code: 0
  args:
  - audit
  - verify
  expect:
    exit_code: 0
  tags:
  - audit
  - logging
  - security
- name: password-policy-validation
  description: Test password policy enforcement (server returns error in JSON with exit 0)
  args:
  - user
  - create
  - weakpass
  - weak@example.com
  - --password
  - '123'
  expect:
    exit_code: 1
    stdout_contains:
    - '"status_class":"22000"'
    - Password too short
  tags:
  - password
  - policy
  - security
- name: token-based-auth
  description: A server accepts no session or API token, so --token is refused (docs/USER_AUTH.md, SONNY-6554)
  args:
  - query
  - --token
  - ${secret:api_token}
  - RETURN current_user() AS user
  expect:
    exit_code: 2
    stderr_contains:
    - is not supported by this server
  tags:
  - auth
  - token
  - api
tags:
- auth
- security
- user-management
