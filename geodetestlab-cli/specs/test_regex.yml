version: "1.0"
name: "Regex Test"
description: "Test regex operators"

cli:
  binary: "./zig-out/bin/geode"
  server:
    enabled: true
    port: null
    data_dir: null
    startup_timeout_ms: 5000
    cleanup: true
  client:
    timeout_ms: 5000

tests:
  - name: "regex-plus-quantifier"
    description: "Test regex with + quantifier"
    args: ["query", "RETURN 'abc123' =~ '^[a-z]+[0-9]+$' AS result"]
    expect:
      exit_code: 0
      stdout_json_assert:
        - expression: "rows[0].result"
          equals: true

  - name: "regex-simple"
    description: "Test simple regex pattern"
    args: ["query", "RETURN 'test' =~ 'te.*' AS result"]
    expect:
      exit_code: 0
      stdout_json_assert:
        - expression: "rows[0].result"
          equals: true

  - name: "regex-no-match"
    description: "Test regex that should not match"
    args: ["query", "RETURN 'abc' =~ '^[0-9]+$' AS result"]
    expect:
      exit_code: 0
      stdout_json_assert:
        - expression: "rows[0].result"
          equals: false
