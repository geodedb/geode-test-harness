version: '1.0'
name: Auto-Index Lifecycle Tests
description: >
  GAP-0332 — Auto-index lifecycle comprehensive coverage.
  Invariants tested:
    1. Auto btree index on 'id' property created at first CREATE/INSERT/MERGE.
    2. Index visible in SHOW INDEXES immediately after first data mutation.
    3. DROP INDEX removes the index; subsequent SHOW INDEXES confirms absence.
    4. After DROP, re-inserting data via CREATE recreates the auto-index.
    5. Re-query after DROP does NOT recreate (auto-index is trigger-on-write,
       not trigger-on-read) — this is the documented eviction behavior.
    6. Manual CREATE INDEX IF NOT EXISTS on non-id property lifecycle:
       create, visible, query via IndexSeek (EXPLAIN), DROP, gone.
    7. Multiple labels get independent auto-indexes.
    8. EXPLAIN confirms IndexSeek when auto-index present; Scan otherwise.
  Known non-configurable behavior: idle eviction is not time-based and
  cannot be triggered by env vars — eviction = explicit DROP INDEX only.
  CANARY tokens ensure idempotent setup/teardown.
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 60000
    cleanup: true
    args:
    - --log-level
    - warn
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 60000
    tls_verify: false
    format: json
tags:
- auto-index
- lifecycle
- comprehensive
tests:

  # ------------------------------------------------------------------ setup --
- name: aidx-lc-teardown-canary
  description: Idempotent pre-teardown so reruns start clean (CANARY)
  args: [query, '-']
  stdin: |
    MATCH (n:AIdxLC) DETACH DELETE n
    MATCH (n:AIdxLC2) DETACH DELETE n
    MATCH (n:AIdxLCManual) DETACH DELETE n
  expect:
    exit_code: 0
  tags: [auto-index, setup, canary]

  # ============================================================
  # Phase 1: Auto-index creation on first CREATE
  # ============================================================
- name: aidx-lc-create-first-node
  description: INSERT first node triggers auto-index creation for AIdxLC.id
  args: [query, '-']
  stdin: "CREATE (n:AIdxLC {id: 1, name: 'alpha'})"
  expect:
    exit_code: 0
  tags: [auto-index, create, trigger]

- name: aidx-lc-auto-idx-visible-after-create
  description: auto_idx_AIdxLC_id visible in SHOW INDEXES after first CREATE
  args: [query, '-']
  stdin: SHOW INDEXES
  expect:
    exit_code: 0
    stdout_contains:
    - auto_idx_AIdxLC_id
  tags: [auto-index, show]

- name: aidx-lc-query-by-id
  description: Query by id uses auto-index and returns correct node
  args: [query, '-']
  stdin: MATCH (n:AIdxLC) WHERE n.id = 1 RETURN n.name AS name
  expect:
    exit_code: 0
    stdout_contains:
    - alpha
  tags: [auto-index, query]

- name: aidx-lc-explain-index-seek
  description: EXPLAIN shows IndexSeek when WHERE clause matches auto-index
  args: [query, '-']
  stdin: EXPLAIN MATCH (n:AIdxLC) WHERE n.id = 1 RETURN n
  expect:
    exit_code: 0
    stdout_contains:
    - IndexSeek
  tags: [auto-index, explain, index-seek]

  # ============================================================
  # Phase 2: Idempotency — more nodes do not duplicate index
  # ============================================================
- name: aidx-lc-insert-more-nodes
  description: Additional INSERT nodes keep exactly one auto-index
  args: [query, '-']
  stdin: |
    CREATE (n:AIdxLC {id: 2, name: 'beta'})
    CREATE (n:AIdxLC {id: 3, name: 'gamma'})
    CREATE (n:AIdxLC {id: 4, name: 'delta'})
  expect:
    exit_code: 0
  tags: [auto-index, idempotent]

- name: aidx-lc-single-auto-idx-still
  description: SHOW INDEXES still has exactly one auto_idx_AIdxLC_id entry
  args: [query, '-']
  stdin: SHOW INDEXES
  expect:
    exit_code: 0
    stdout_contains:
    - auto_idx_AIdxLC_id
  tags: [auto-index, idempotent, show]

- name: aidx-lc-query-second-node
  description: Query second node by id returns 'beta'
  args: [query, '-']
  stdin: MATCH (n:AIdxLC) WHERE n.id = 2 RETURN n.name AS name
  expect:
    exit_code: 0
    stdout_contains:
    - beta
  tags: [auto-index, query]

  # ============================================================
  # Phase 3: INSERT trigger (alternative DML)
  # ============================================================
- name: aidx-lc-insert-trigger
  description: INSERT (not CREATE) also triggers auto-index on new label
  args: [query, '-']
  stdin: "INSERT (n:AIdxLC2 {id: 10, name: 'x_ray'})"
  expect:
    exit_code: 0
  tags: [auto-index, insert-trigger]

- name: aidx-lc-insert-idx-visible
  description: Auto-index for AIdxLC2 visible after INSERT
  args: [query, '-']
  stdin: SHOW INDEXES
  expect:
    exit_code: 0
    stdout_contains:
    - auto_idx_AIdxLC2_id
  tags: [auto-index, insert-trigger, show]

  # ============================================================
  # Phase 4: MERGE trigger
  # ============================================================
- name: aidx-lc-merge-trigger
  description: MERGE triggers auto-index when creating new node
  args: [query, '-']
  stdin: "MERGE (n:AIdxLC {id: 99, name: 'omega'})"
  expect:
    exit_code: 0
  tags: [auto-index, merge-trigger]

- name: aidx-lc-merge-query-works
  description: Query merged node by id works
  args: [query, '-']
  stdin: MATCH (n:AIdxLC) WHERE n.id = 99 RETURN n.name AS name
  expect:
    exit_code: 0
    stdout_contains:
    - omega
  tags: [auto-index, merge-trigger, query]

  # ============================================================
  # Phase 5: DROP INDEX → eviction
  # ============================================================
- name: aidx-lc-drop-auto-idx
  description: DROP INDEX auto_idx_AIdxLC_id succeeds
  args: [query, '-']
  stdin: DROP INDEX auto_idx_AIdxLC_id
  expect:
    exit_code: 0
  tags: [auto-index, drop]

- name: aidx-lc-idx-absent-after-drop
  description: auto_idx_AIdxLC_id absent from SHOW INDEXES after DROP
  args: [query, '-']
  stdin: SHOW INDEXES
  expect:
    exit_code: 0
    stdout_not_contains:
    - auto_idx_AIdxLC_id
  tags: [auto-index, drop, show]

- name: aidx-lc-explain-scan-after-drop
  description: >
    EXPLAIN shows Scan (not IndexSeek) after auto-index dropped.
    Documents that re-query alone does NOT recreate the auto-index.
  args: [query, '-']
  stdin: EXPLAIN MATCH (n:AIdxLC) WHERE n.id = 1 RETURN n
  expect:
    exit_code: 0
    stdout_contains:
    - Scan
    stdout_not_contains:
    - IndexSeek
  tags: [auto-index, drop, explain, eviction-behavior]

- name: aidx-lc-query-without-idx-still-works
  description: Query still returns correct results without auto-index (full scan)
  args: [query, '-']
  stdin: MATCH (n:AIdxLC) WHERE n.id = 1 RETURN n.name AS name
  expect:
    exit_code: 0
    stdout_contains:
    - alpha
  tags: [auto-index, drop, scan-fallback]

  # ============================================================
  # Phase 6: Re-creation via new write
  # ============================================================
- name: aidx-lc-write-recreates-idx
  description: New CREATE re-creates the auto-index for AIdxLC
  args: [query, '-']
  stdin: "CREATE (n:AIdxLC {id: 5, name: 'epsilon'})"
  expect:
    exit_code: 0
  tags: [auto-index, recreate]

- name: aidx-lc-idx-recreated-visible
  description: auto_idx_AIdxLC_id visible again in SHOW INDEXES after new write
  args: [query, '-']
  stdin: SHOW INDEXES
  expect:
    exit_code: 0
    stdout_contains:
    - auto_idx_AIdxLC_id
  tags: [auto-index, recreate, show]

- name: aidx-lc-explain-seek-after-recreate
  description: EXPLAIN shows IndexSeek again after auto-index re-created
  args: [query, '-']
  stdin: EXPLAIN MATCH (n:AIdxLC) WHERE n.id = 1 RETURN n
  expect:
    exit_code: 0
    stdout_contains:
    - IndexSeek
  tags: [auto-index, recreate, explain]

  # ============================================================
  # Phase 7: Manual index on non-id property lifecycle
  # ============================================================
- name: aidx-lc-manual-setup
  description: Create nodes for manual index test on 'name' property
  args: [query, '-']
  stdin: |
    CREATE (n:AIdxLCManual {id: 1, name: 'alice'})
    CREATE (n:AIdxLCManual {id: 2, name: 'bob'})
    CREATE (n:AIdxLCManual {id: 3, name: 'carol'})
  expect:
    exit_code: 0
  tags: [auto-index, manual, setup]

- name: aidx-lc-manual-create-idx
  description: CREATE INDEX IF NOT EXISTS on non-id property 'name'
  args: [query, '-']
  stdin: CREATE INDEX IF NOT EXISTS aidx_lc_manual_name ON AIdxLCManual(name)
  expect:
    exit_code: 0
  tags: [auto-index, manual, create]

- name: aidx-lc-manual-idx-visible
  description: Manual index visible in SHOW INDEXES
  args: [query, '-']
  stdin: SHOW INDEXES
  expect:
    exit_code: 0
    stdout_contains:
    - aidx_lc_manual_name
  tags: [auto-index, manual, show]

- name: aidx-lc-manual-idx-explains-seek
  description: EXPLAIN uses IndexSeek for manual index on name property
  args: [query, '-']
  stdin: EXPLAIN MATCH (n:AIdxLCManual) WHERE n.name = 'alice' RETURN n
  expect:
    exit_code: 0
    stdout_contains:
    - IndexSeek
  tags: [auto-index, manual, explain]

- name: aidx-lc-manual-idx-query-works
  description: Query by name uses manual index and returns correct result
  args: [query, '-']
  stdin: MATCH (n:AIdxLCManual) WHERE n.name = 'alice' RETURN n.id AS id
  expect:
    exit_code: 0
    stdout_contains:
    - id
  tags: [auto-index, manual, query]

- name: aidx-lc-manual-drop-idx
  description: DROP INDEX aidx_lc_manual_name succeeds
  args: [query, '-']
  stdin: DROP INDEX aidx_lc_manual_name
  expect:
    exit_code: 0
  tags: [auto-index, manual, drop]

- name: aidx-lc-manual-absent-after-drop
  description: Manual index absent from SHOW INDEXES after DROP
  args: [query, '-']
  stdin: SHOW INDEXES
  expect:
    exit_code: 0
    stdout_not_contains:
    - aidx_lc_manual_name
  tags: [auto-index, manual, drop, show]

  # ============================================================
  # Phase 8: Manual index does not conflict with existing auto-index
  # ============================================================
- name: aidx-lc-manual-compat-auto
  description: >
    CREATE INDEX IF NOT EXISTS on same property as auto-index is a no-op
    (IF NOT EXISTS guards); auto-index name must still appear in SHOW INDEXES.
  args: [query, '-']
  stdin: CREATE INDEX IF NOT EXISTS auto_idx_AIdxLC_id ON AIdxLC(id)
  expect:
    exit_code: 0
  tags: [auto-index, compat]

- name: aidx-lc-auto-idx-after-compat-attempt
  description: auto_idx_AIdxLC_id still visible after compat CREATE attempt
  args: [query, '-']
  stdin: SHOW INDEXES
  expect:
    exit_code: 0
    stdout_contains:
    - auto_idx_AIdxLC_id
  tags: [auto-index, compat, show]

  # ============================================================
  # Phase 9: No-label query uses Scan (no auto-index cross-label)
  # ============================================================
- name: aidx-lc-no-label-uses-scan
  description: Query without label uses full Scan — auto-index is label-scoped
  args: [query, '-']
  stdin: EXPLAIN MATCH (n) WHERE n.id = 1 RETURN n
  expect:
    exit_code: 0
    stdout_contains:
    - Scan
    stdout_not_contains:
    - IndexSeek
  tags: [auto-index, explain, no-label]

  # ---------------------------------------------------------------- cleanup --
- name: aidx-lc-teardown
  description: Remove all auto-index lifecycle test nodes (CANARY idempotent teardown)
  args: [query, '-']
  stdin: |
    MATCH (n:AIdxLC) DETACH DELETE n
    MATCH (n:AIdxLC2) DETACH DELETE n
    MATCH (n:AIdxLCManual) DETACH DELETE n
  expect:
    exit_code: 0
  tags: [auto-index, cleanup, canary]
