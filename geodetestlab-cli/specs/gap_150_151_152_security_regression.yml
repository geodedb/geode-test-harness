version: '1.0'
name: gap_150_151_152_security_regression
description: Regression tests for GAP-0150 (CLI auth QUIC), GAP-0151 (audit verify), GAP-0152 (PowerShell)
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 10000
    cleanup: true
    args:
    - --log-level
    - warn
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 5000
    tls_verify: false
    format: json
tests:
- name: gap-0150-auth-help
  description: Auth subcommand help should be available
  args:
  - auth
  - --help
  expect:
    exit_code: 0
    stderr_contains: login
- name: gap-0150-auth-shows-logout
  description: Auth help should show logout command
  args:
  - auth
  - --help
  expect:
    exit_code: 0
    stderr_contains: logout
- name: gap-0150-auth-shows-session
  description: Auth help should mention session management
  args:
  - auth
  - --help
  expect:
    exit_code: 0
    stderr_contains: Session
- name: gap-0151-audit-verify-missing-file
  description: Audit verify should error on missing file
  args:
  - audit
  - verify
  - --file
  - /nonexistent/file.jsonl
  expect:
    exit_code: 1
- name: gap-0151-audit-verify-default-path
  description: Audit verify with default path returns OK with 0 records
  args:
  - audit
  - verify
  expect:
    exit_code: 0
    stderr_contains:
    - 0 records verified
- name: gap-0152-audit-flag-available
  description: Audit flag should be available
  args:
  - --help
  expect:
    exit_code: 0
    stderr_contains: --audit
- name: gap-general-help
  description: Main help should show all commands
  args:
  - --help
  expect:
    exit_code: 0
    stderr_contains: serve
- name: gap-version
  description: Version command should work
  args:
  - --version
  expect:
    exit_code: 0
- name: gap-auth-subcommand
  description: Auth subcommand should be listed
  args:
  - --help
  expect:
    exit_code: 0
    stderr_contains: auth
tags:
- security
- regression
- gap-analysis
- authentication
- audit
- cli
