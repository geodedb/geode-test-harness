version: "1.0"
name: "Geode Storage CLI Tests"
description: "Verify storage subsystem consistency and tools via CLI"

cli:
  binary: "./zig-out/bin/geode"
  working_dir: "storage_test_env" # Relative to runner or absolute
  env:
    GEODE_LOG_LEVEL: "info"
  server:
    enabled: false

tests:
  - name: "storage-help"
    description: "Verify storage subcommand help is available"
    args: ["storage", "--help"]
    expect:
      exit_code: 0
      stdout_contains: ["usage", "verify", "stress"]
    tags: ["basic", "help"]

  - name: "storage-verify-sanity"
    description: "Run storage sanity checks"
    args: ["storage", "verify"]
    expect:
      exit_code: 0
      stdout_contains: ["Storage integrity verification", "Verification complete"]
    tags: ["sanity", "verify"]

  - name: "storage-stress-integration"
    description: "Run lightweight stress test (integration check)"
    # Running 1000 items is fast (<1s) but exercises the full pipeline (WAL, FSM, Vacuum)
    args: ["storage", "stress", "--items", "1000", "--dir", "stress_data_integration"]
    expect:
      exit_code: 0
      stdout_contains: ["Bulk Loading", "Fragmenting", "Reloading", "Verifying Integrity", "Verified"]
    tags: ["stress", "integration"]

tags: ["cli", "storage", "no-server"]
