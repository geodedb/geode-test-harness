    CREATE (:RG11_Doc {secret: 'TDE_SENTINEL_RG11_XYZZY50'});
  expect:
    exit_code: 0
  tags: [tde, hydration, setup]

- name: rg11-count-before-checkpoint
  description: Sanity check all 50 sentinel nodes are visible before forcing the checkpoint.
  query: MATCH (n:RG11_Doc) RETURN count(n) AS total
  expect:
    exit_code: 0
    stdout_contains: ['50']
  tags: [tde, hydration, setup]

- name: rg11-force-snapshot
  description: |
    Force a FULL checkpoint (clean shutdown + reopen). Only the full
    checkpoint path (`saveToFileEx(light=false)`) calls
    `saveHydrationSnapshots`, which is where `hydration_merge.snap` /
    `hydration_labels.snap` / `hydration_counters.snap` would be written
    for every hydrated, non-deferred graph — exactly the point at which a
    plaintext leak would land on disk if the TDE guard were missing or
    broken.
  type: bash
  command: echo 'rg11-checkpoint-triggered'
  restart_server: true
  expect:
    exit_code: 0
    stdout_contains: [rg11-checkpoint-triggered]
  tags: [tde, hydration, checkpoint]

- name: rg11-scan-no-plaintext-in-hydration-snaps
  description: |
    KEY negative: the sentinel must not appear in ANY hydration_*.snap
    file anywhere under the data dir. GEODE_DATA_DIR is exported by the
    harness into bash-step environments; the step fails loudly (exit 2)
    rather than silently passing if that variable is missing, so an
    unwired env can never masquerade as "no leak found".

    With the 7cc6858e TDE guard in place, no hydration_*.snap files are
    written at all while GEODE_TDE_KEY is set (confirmed by a scratch-
    server probe run alongside this spec's development), so the search
    below is expected to find zero snapshot files and therefore trivially
    zero matches. The assertion is written to actively fail (exit 1) if a
    match IS found, so a regression that reintroduces plaintext writes
    under TDE is still caught.
  type: bash
  command: |
    DATA_DIR="${GEODE_DATA_DIR:-}"
    if [ -z "$DATA_DIR" ] || [ ! -d "$DATA_DIR" ]; then
      echo "FAIL: GEODE_DATA_DIR not available in bash step environment (got: '${DATA_DIR}')"
      exit 2
    fi

    SNAP_FILES=$(find "$DATA_DIR" -name "hydration_*.snap" 2>/dev/null)
    SNAP_COUNT=0
    if [ -n "$SNAP_FILES" ]; then
      SNAP_COUNT=$(printf '%s\n' "$SNAP_FILES" | wc -l)
    fi
    echo "hydration_*.snap files found under TDE: ${SNAP_COUNT}"

    MATCHES=""
    if [ -n "$SNAP_FILES" ]; then
      MATCHES=$(printf '%s\n' "$SNAP_FILES" | xargs -r grep -a -l "TDE_SENTINEL_RG11_XYZZY" 2>/dev/null || true)
    fi

    if [ -n "$MATCHES" ]; then
      echo "PLAINTEXT LEAK: sentinel found in: $MATCHES"
      exit 1
    fi

    echo "no plaintext sentinel found in any hydration_*.snap file"
    exit 0
  expect:
    exit_code: 0
    stdout_contains: [no plaintext sentinel found]
  tags: [tde, hydration, scan, critical]

- name: rg11-scan-no-plaintext-in-datadir
  description: |
    Defense-in-depth: the sentinel must not appear anywhere else in the
    data dir either (jsonl/timeseries/fts/wal side-cars excluded, matching
    the existing tde_bitflip_detection.yml / fle_plaintext_verification_basic.yml
    convention) — confirms TDE's page encryption also covers the primary
    engine store, not just the hydration side-car files this spec targets.
  command: grep
  args:
  - -r
  - -a
  - -l
  - --exclude=*.jsonl
  - --exclude-dir=timeseries
  - --exclude-dir=fts
  - --exclude-dir=wal
  - TDE_SENTINEL_RG11_XYZZY
  - ${data_dir}
  expect:
    exit_code: 1
  tags: [tde, hydration, scan, critical]

- name: rg11-data-readable
  description: 'Positive control: sentinel data round-trips correctly through the query API under TDE.'
  query: MATCH (n:RG11_Doc) RETURN n.secret AS secret ORDER BY secret
  expect:
    exit_code: 0
    stdout_contains: [TDE_SENTINEL_RG11_XYZZY1, TDE_SENTINEL_RG11_XYZZY50]
    geode_query:
      row_count: 50
  tags: [tde, hydration, readable]

invariants:
- type: server_running

plaintext_verification:
  enabled: true
  search_patterns:
  - TDE_SENTINEL_RG11_XYZZY
  fail_on_violation: true

tags:
- tde
- hydration
- snapshot
- plaintext-verification
- security
- critical
- gap-ent-0023
