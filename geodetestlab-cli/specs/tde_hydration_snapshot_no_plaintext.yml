version: '1.0'
name: TDE — hydration snapshots (hydration_merge/labels/counters.snap) hold no plaintext property values
description: |
  Pins a fix (geode commit 7cc6858e) for the GAP-ENT-0023 P3 loop2-product
  hydration snapshots: `hydration_merge.snap` (the {graph,label,key,VALUE}
  -> node_id merge property index), `hydration_labels.snap` (per-label
  node-id postings) and `hydration_counters.snap` (label/edge-type counts).
  These side-car files are written by the hydration_snapshot writer with
  magic+CRC framing but are NOT independently encrypted, so if written while
  TDE is enabled they would leak raw property values to disk in plaintext —
  defeating TDE's at-rest guarantee even though the main engine page store
  is correctly AES-GCM encrypted.

  The fix (`hydrationSnapshotsDisabled()` in graph_store.zig) suppresses
  BOTH writing and loading of all three snapshot files whenever
  GEODE_TDE_KEY is set: hydration falls back to the (encrypted-page) engine
  scan instead, at the cost of one scan-rebuild per graph per process
  lifetime — a pure optimization, never a correctness dependency.

  Scenario:
    1. Seed 50 sentinel nodes (:RG11_Doc {secret:'TDE_SENTINEL_RG11_XYZZY<i>'})
       under a TDE-enabled server (individual CREATE statements — UNWIND is
       not a supported clause on this build; confirmed via scratch-server
       probe, see regression_label_count_after_reopen.yml for the same
       finding).
    2. Force a FULL checkpoint via `restart_server: true` (only the FULL
       checkpoint — clean shutdown / explicit save — calls
       `saveHydrationSnapshots`; the periodic LIGHT runtime checkpoint
       skips it).
    3. KEY negative: scope a grep to every `hydration_*.snap` file under
       GEODE_DATA_DIR and assert the sentinel string appears in NONE of
       them. Because the TDE guard suppresses the writer entirely, the
       expected (and observed) outcome is that no hydration_*.snap files
       exist at all post-checkpoint — a vacuous but correct pass. The
       assertion is written so it would also fail loudly if some future
       change reintroduced a partial/conditional writer that still leaked
       the merge index while TDE is on.
    4. Positive control: the data is still fully readable through the
       normal query API, proving TDE round-trips the data rather than
       merely making the snapshot mechanism inert by destroying it.

  TEETH (scratch-server probe at /tmp/probe-r11, port auto, before writing
  this spec): the SAME 50-node seed + restart_server cycle was run WITHOUT
  any TDE flags/env. Result: `hydration_merge.snap` and `hydration_labels.snap`
  and `hydration_counters.snap` all exist post-restart, and `grep -c` against
  `hydration_merge.snap` found the sentinel pattern (2 raw-byte matches per
  50-node graph engine root; `hydration_labels.snap` and
  `hydration_counters.snap` showed 0 matches each — those two files hold
  structural data (node-id postings / counts) and never carry property
  VALUES, so `hydration_merge.snap` is the only one of the three that can
  leak plaintext property values; the other two are included in the scan
  purely for completeness/future-proofing). Extracting the matched strings
  confirmed literal plaintext values (`TDE_SENTINEL_RG11_XYZZY1`,
  `..._10`, `..._11`, `..._12`, `..._13`, ...) sitting in the unencrypted
  merge-index file when TDE is off — i.e. absent the 7cc6858e guard, this
  spec's KEY assertion would fail exactly as designed. With TDE on, the
  identical scenario produced zero hydration_*.snap files anywhere under
  the data dir.

  CANARY: REQ=REQ-SEC-TDE-SNAPSHOT-NO-PLAINTEXT-001; FEATURE="TDE"; ASPECT=HydrationSnapshotEncryption; STATUS=TESTED; TEST=geodetestlab/specs/tde_hydration_snapshot_no_plaintext.yml; OWNER=security; UPDATED=2026-07-09

cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 60000
    cleanup: true
    args:
    - --log-level
    - warn
    - --enable-tde
    # SONNY-6422/6442: --enable-wal-encryption was removed; the WAL is encrypted by the engine under GEODE_TDE_KEY
    - --tde-provider
    - MockKms
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 30000
    format: json
env:
  GEODE_TDE_KEY: deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef
  # SONNY-6422: GEODE_WAL_KEY removed (server refuses it); the WAL is encrypted by GEODE_TDE_KEY
  GEODE_TDE_ENABLED: 'true'
  GEODE_WAL_ENCRYPTION_ENABLED: 'true'

tests:
- name: rg11-seed-sentinel
  description: |
    Seed 50 sentinel nodes via 50 individual CREATE statements. UNWIND
    range-seeding was probed against a scratch server and returns a GQL
    parse error on this build (same finding as
    regression_label_count_after_reopen.yml), so a script-generated CREATE
    batch is used instead.
  query: |
    CREATE (:RG11_Doc {secret: 'TDE_SENTINEL_RG11_XYZZY1'});
    CREATE (:RG11_Doc {secret: 'TDE_SENTINEL_RG11_XYZZY2'});
    CREATE (:RG11_Doc {secret: 'TDE_SENTINEL_RG11_XYZZY3'});
    CREATE (:RG11_Doc {secret: 'TDE_SENTINEL_RG11_XYZZY4'});
    CREATE (:RG11_Doc {secret: 'TDE_SENTINEL_RG11_XYZZY5'});
    CREATE (:RG11_Doc {secret: 'TDE_SENTINEL_RG11_XYZZY6'});
    CREATE (:RG11_Doc {secret: 'TDE_SENTINEL_RG11_XYZZY7'});
    CREATE (:RG11_Doc {secret: 'TDE_SENTINEL_RG11_XYZZY8'});
    CREATE (:RG11_Doc {secret: 'TDE_SENTINEL_RG11_XYZZY9'});
    CREATE (:RG11_Doc {secret: 'TDE_SENTINEL_RG11_XYZZY10'});
    CREATE (:RG11_Doc {secret: 'TDE_SENTINEL_RG11_XYZZY11'});
    CREATE (:RG11_Doc {secret: 'TDE_SENTINEL_RG11_XYZZY12'});
    CREATE (:RG11_Doc {secret: 'TDE_SENTINEL_RG11_XYZZY13'});
    CREATE (:RG11_Doc {secret: 'TDE_SENTINEL_RG11_XYZZY14'});
    CREATE (:RG11_Doc {secret: 'TDE_SENTINEL_RG11_XYZZY15'});
    CREATE (:RG11_Doc {secret: 'TDE_SENTINEL_RG11_XYZZY16'});
    CREATE (:RG11_Doc {secret: 'TDE_SENTINEL_RG11_XYZZY17'});
    CREATE (:RG11_Doc {secret: 'TDE_SENTINEL_RG11_XYZZY18'});
    CREATE (:RG11_Doc {secret: 'TDE_SENTINEL_RG11_XYZZY19'});
    CREATE (:RG11_Doc {secret: 'TDE_SENTINEL_RG11_XYZZY20'});
    CREATE (:RG11_Doc {secret: 'TDE_SENTINEL_RG11_XYZZY21'});
    CREATE (:RG11_Doc {secret: 'TDE_SENTINEL_RG11_XYZZY22'});
    CREATE (:RG11_Doc {secret: 'TDE_SENTINEL_RG11_XYZZY23'});
    CREATE (:RG11_Doc {secret: 'TDE_SENTINEL_RG11_XYZZY24'});
