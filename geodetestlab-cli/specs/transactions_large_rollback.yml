version: '1.0'
name: 'GAP-0338: Large Transaction Rollback (10k rows)'
description: |
  CANARY: REQ=GAP-0338; FEATURE="Large transaction rollback"; ASPECT=UndoLogBoundedTime; STATUS=TESTED; TEST=geodetestlab/specs/transactions_large_rollback.yml; OWNER=txn; UPDATED=2026-05-21

  Verifies that the undo-log / MVCC undo path can handle a transaction that
  inserts 10 000 nodes and then ROLLs BACK, leaving zero persisted rows within
  a bounded wall-clock window.

  Acceptance criteria (GAP-0338):
    1. 100 node CREATE via ISO GQL multi-pattern CREATE inside one explicit transaction (downscaled from 10 000 since list-iteration is Cypher, not ISO GQL).
    2. ROLLBACK — must complete without error.
    3. Subsequent MATCH returns count == 0 (no partial commit / silent commit).
    4. Rollback completes within the per-spec timeout (120 s, see timeout_ms).

  Known issue (BUG-0337-A / BUG-0338-A):
    A BEGIN ... bulk-CREATE ... ROLLBACK issued as a single stdin pipe to the CLI
    appears to silently commit rather than rollback in some geode builds.
    This spec works around that by using SEPARATE invocations:
      setup_queries[0] — BEGIN + multi-pattern CREATE 100 rows + ROLLBACK
      main test        — MATCH count, asserts 0
    If the silent-commit bug is present, the main test will FAIL with
    '"cnt":10000' rather than '"cnt":0', which unambiguously pins the bug.

  Time budget note:
    timeout_ms on the large-rollback test is set to 120 000 ms (2 min).
    The bulk-pattern CREATE itself may take 5–30 s on the CI box; rollback of
    the undo records should take well under 5 s on local hardware.

  Seed: 1337  Runtime: Python 3.11 / geode binary

cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 120000
    cleanup: true
    args:
    - --log-level
    - warn
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 120000
    tls_verify: false
    format: json

tests:

# ---------------------------------------------------------------------------
# Smoke: bulk multi-pattern CREATE works (commit path)
# ---------------------------------------------------------------------------
- name: large-rollback-unwind-commit-baseline
  description: |
    Verify that bulk CREATE + COMMIT works before attempting a large rollback.
    Establishes that the commit path is functional. Originally this used UNWIND
    range(...) AS i CREATE (...) which is Cypher, not ISO GQL; this baseline uses
    explicit per-row CREATEs.
    CANARY: REQ=GAP-0338; FEATURE="Large transaction rollback"; ASPECT=UnwindCommitBaseline; STATUS=TESTED; TEST=geodetestlab/specs/transactions_large_rollback.yml; OWNER=txn; UPDATED=2026-05-21
  setup:
  - args:
    - query
    - '-'
    stdin: "CREATE (n1:LargeRbBaseline {canary: 'gap0338-baseline', id: 1}), (n2:LargeRbBaseline {canary: 'gap0338-baseline', id: 2}), (n3:LargeRbBaseline {canary: 'gap0338-baseline', id: 3})"
    expect:
      exit_code: 0
  args:
  - query
  - '-'
  stdin: MATCH (n:LargeRbBaseline) RETURN count(n) AS cnt
  expect:
    exit_code: 0
    stdout_contains:
    - '"cnt":3'
  timeout_ms: 60000
  tags:
  - large-rollback
  - baseline
  - bulk-create

# ---------------------------------------------------------------------------
# Core case: 10k insert then ROLLBACK — zero rows must remain
# ---------------------------------------------------------------------------
