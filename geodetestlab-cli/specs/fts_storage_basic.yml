# FTS Storage-Backed Full-Text Search Spec
#
# Exercises the fts-storage-backed full-text-search lifecycle end-to-end through
# the real QUIC CLI path:
#   - CREATE :Doc nodes (some BEFORE the index -> backfill coverage)
#   - CREATE INDEX ... USING fulltext  (ISO FOR-form; backfills pre-existing rows)
#   - SHOW INDEXES lists the fulltext index with type=fulltext on the right
#     table/column (single-property and multi-property)
#   - CREATE a :Doc AFTER the index exists (live maintenance-hook path)
#   - SEARCH via the ISO GQL procedure
#       CALL geode.fts.search('idx','term')
#     (the spec-correct set-returning surface; YIELD is OPTIONAL in GQL clause
#     16.3, so the bare CALL auto-projects the procedure's (node, score) columns
#     as rows — exactly how CALL geode.schema.indexes() works. node = matching
#     node id, score = BM25). Replaces the retired scalar
#     fulltext_search-for-UNWIND form.
#   - DROP INDEX <fulltext idx> and prove the server SURVIVES (SHOW INDEXES still
#     answers afterward) -- closes both former bugs (see history note below).
#
# Assertions go through stdout_contains / stdout_regex on the JSON client output
# (cli.client.format = json) -- the only keys lib/checks.py enforces.
# row_count / values / columns / status_class are silently ignored, so every
# assertion is a substring that appears ONLY on success.
#
# JSON shapes confirmed against a freshly-built geode binary
# (feat/storage-lib-migration, built 2026-05-31) by driving the exact queries
# below over the QUIC `geode query -` CLI path:
#   CREATE / CREATE INDEX -> {"status_class":"00000", ... "rows":[], ...}
#   SHOW INDEXES (with idx) -> rows include
#     {"name":"doc_body_idx","type":"fulltext","table":"Doc","columns":"body"}
#
# === HISTORY: two former bugs, both now CLOSED and asserted below ===
#
# 1. DROP INDEX <fulltext idx> used to crash the QUIC server: the fts_storage
#    engine was single-writer and asserted every mutating call ran on the
#    creating thread, but CREATE INDEX and DROP INDEX run on different QUIC
#    worker threads, so DROP -> engine.flush() panicked and the server died.
#    Fixed by pinning fts-storage 0.1.1 with single_writer_thread_check=false.
#    This spec now runs DROP INDEX and asserts the server stays alive (the
#    SHOW INDEXES after DROP answers instead of timing out).
#
# 2. fulltext_search('idx','term') was not usable over the QUIC server: the
#    scalar `UNWIND fulltext_search(...)` form (UNWIND is Cypher, not ISO GQL)
#    hung or parse-errored, and `CALL fulltext_search(...)` returned 42883
#    "Unknown procedure" because no such procedure was registered. Full-text
#    search is now the ISO GQL procedure `geode.fts.search(index, query [, max])`
#    invoked with a bare `CALL geode.fts.search(...)` (YIELD optional per GQL
#    16.3); this spec asserts it returns the matched doc over the wire (a real
#    (node, score) binding table, not a 42000 parse error or a hang).
#
# Tests share one server (server.enabled) so CREATEs in earlier tests are
# visible to later tests.

version: '1.0'
name: FTS Storage Full-Text Search
description: End-to-end fts-storage-backed full-text-search index lifecycle (CREATE INDEX USING fulltext + backfill + maintenance + SHOW catalog)
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 60000
    cleanup: true
    args:
    - --log-level
    - warn
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 30000
    tls_verify: false
    format: json
tests:
# --- setup: docs created BEFORE the index (exercise backfill) ---
- name: fts-storage-setup-fox-before-index
  description: Create the fox doc before the index exists (backfill path)
  args:
  - query
  - '-'
  stdin: "CREATE (:Doc {body: 'the quick brown fox jumps'})"
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
  tags:
  - fts
  - storage
  - backfill
- name: fts-storage-setup-dog-before-index
  description: Create the lazy-dog doc before the index exists (backfill path)
  args:
  - query
  - '-'
  stdin: "CREATE (:Doc {body: 'a lazy sleeping dog'})"
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
  tags:
  - fts
  - storage
- name: fts-storage-setup-whale-before-index
  description: Create the whale doc before the index exists (backfill path)
  args:
  - query
  - '-'
  stdin: "CREATE (:Doc {body: 'a gigantic blue whale swims'})"
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
  tags:
  - fts
  - storage
# --- create the fulltext index (ISO FOR-form; backfills the 3 docs) ---
- name: fts-storage-create-fulltext-index
  description: Create a fulltext index on Doc.body (backfills pre-existing rows)
  args:
  - query
  - '-'
  stdin: CREATE INDEX doc_body_idx FOR (d:Doc) ON (d.body) USING fulltext
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
  tags:
  - fts
  - storage
  - index
# --- SHOW INDEXES lists the new fulltext index with the right metadata ---
- name: fts-storage-show-indexes-lists-fulltext
  description: SHOW INDEXES lists the fulltext index with type=fulltext on Doc.body
  args:
  - query
  - '-'
  stdin: SHOW INDEXES
  expect:
    exit_code: 0
    stdout_contains:
    - doc_body_idx
    - '"type":"fulltext"'
    stdout_regex:
    - '"name":"doc_body_idx","type":"fulltext","table":"Doc","columns":"body"'
  tags:
  - fts
  - storage
  - catalog
# --- maintenance: a doc created AFTER the index (maintenance-hook path) ---
- name: fts-storage-maintenance-create-after-index
  description: Create a doc after the index exists (live maintenance hook path)
  args:
  - query
  - '-'
  stdin: "CREATE (:Doc {body: 'a rare pangolin forages at dusk'})"
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
  tags:
  - fts
  - storage
  - maintenance
# --- multi-property fulltext index on (title, body) ---
- name: fts-storage-setup-article
  description: Create an Article for the multi-property fulltext index
  args:
  - query
  - '-'
  stdin: "CREATE (:Article {title: 'Aardvark Almanac', body: 'covers nocturnal mammals in detail'})"
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
  tags:
  - fts
  - storage
- name: fts-storage-create-multiprop-index
  description: Create a multi-property fulltext index on Article(title, body)
  args:
  - query
  - '-'
  stdin: CREATE INDEX article_idx FOR (a:Article) ON (a.title, a.body) USING fulltext
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
  tags:
  - fts
  - storage
  - index
- name: fts-storage-show-indexes-lists-multiprop
  description: SHOW INDEXES lists the multi-property fulltext index on Article
  args:
  - query
  - '-'
  stdin: SHOW INDEXES
  expect:
    exit_code: 0
    stdout_contains:
    - article_idx
    - '"type":"fulltext"'
    - Article
  tags:
  - fts
  - storage
  - catalog
# --- SEARCH over the wire via the ISO GQL procedure (the crux) ---
- name: fts-storage-search-fox-via-call
  description: Bare CALL geode.fts.search(...) auto-projects the (node, score) row for the fox doc over the wire
  args:
  - query
  - '-'
  stdin: CALL geode.fts.search('doc_body_idx', 'fox')
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    # The (node, score) binding table flowed over the wire as a REAL hit — not a
    # 42000 parse error / 42883 unknown-procedure / connection hang. The columns
    # are auto-projected from the procedure result (no YIELD): two typed columns
    # named node and score.
    - '"name":"node"'
    - '"name":"score"'
    stdout_regex:
    # At least one row object with a real (node id, BM25 score) pair: node id is
    # an integer, score a positive float. This fails on an empty result set
    # (rows:[]), proving the fox doc actually matched over the wire.
    - '"node":[0-9]+'
    - '"score":[0-9]+(\.[0-9]+)?'
  tags:
  - fts
  - storage
  - search
- name: fts-storage-search-no-match-empty
  description: A term in no document returns an empty (but successful) row set
  args:
  - query
  - '-'
  stdin: CALL geode.fts.search('doc_body_idx', 'rhinoceros')
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    # A successful call with an empty binding table: the rows array is empty.
    - '"rows":[]'
  tags:
  - fts
  - storage
  - search
# --- DROP INDEX must NOT crash the server (fts-storage 0.1.1 fix) ---
- name: fts-storage-drop-fulltext-index
  description: DROP INDEX on a fulltext index (server must survive — 0.1.1 fix)
  args:
  - query
  - '-'
  stdin: DROP INDEX doc_body_idx
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
  tags:
  - fts
  - storage
  - index
- name: fts-storage-show-indexes-after-drop-server-alive
  description: SHOW INDEXES after DROP proves the server stayed alive (still answers)
  args:
  - query
  - '-'
  stdin: SHOW INDEXES
  expect:
    exit_code: 0
    stdout_contains:
    # The key proof is that this query ANSWERS AT ALL with a clean status — the
    # pre-0.1.1 server died on DROP INDEX, so this step would time out / error.
    # The surviving Article multiprop index confirms the catalog is intact.
    - '"status_class":"00000"'
    - article_idx
  tags:
  - fts
  - storage
  - catalog
tags:
- fulltext
- search
- fts-storage
