version: "1.0"
name: "Geode QUIC Transport Tests"
description: "Comprehensive testing of QUIC transport layer, TLS certificates, and production network connections"

cli:
  binary: "./zig-out/bin/geode"
  server:
    enabled: true
    port: null  # Auto-allocate port
    data_dir: null  # Use temporary directory
    startup_timeout_ms: 30000
    cleanup: true
    args: ["--log-level", "info"]
    env:
      GEODE_LOG_JSON: "true"
  client:
    timeout_ms: 10000
    tls_verify: false
    format: "json"

secrets:
  admin_password:
    source: "env"
    key: "GEODE_ADMIN_PASSWORD"
    required: false
  test_token:
    source: "env"
    key: "GEODE_TEST_TOKEN"
    required: false

tests:
  # Basic QUIC connectivity tests
  - name: "quic-handshake-success"
    description: "Verify successful QUIC handshake with self-signed certificate"
    args: ["query", "--insecure", "RETURN 'quic-test' AS transport"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["transport"]
    tags: ["quic", "handshake", "insecure"]

  - name: "quic-secure-connection"
    description: "Test secure QUIC connection without --insecure flag"
    args: ["query", "RETURN 'secure-test' AS transport"]
    expect:
      exit_code: 0  # Should work with self-signed cert in test environment
      geode_query:
        row_count: 1
        columns: ["transport"]
    tags: ["quic", "secure", "tls"]

  - name: "quic-multiple-connections"
    description: "Test multiple concurrent QUIC connections"
    parallel: true
    instances: 5
    args: ["query", "--insecure", "RETURN ${instance_id} AS connection_id"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["connection_id"]
    tags: ["quic", "concurrent", "scalability"]

  # Certificate and TLS tests
  - name: "certificate-validation"
    description: "Test certificate validation behavior"
    args: ["query", "--insecure", "RETURN current_timestamp() AS cert_test"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["cert_test"]
    tags: ["tls", "certificate", "validation"]

  - name: "insecure-flag-required"
    description: "Verify --insecure flag is required for self-signed certificates"
    skip_if_env: "CI"  # Skip in CI where cert validation might be different
    args: ["query", "RETURN 'no-insecure' AS test"]
    expect:
      # May succeed or fail depending on environment cert handling
      exit_code_any: [0, 1]
    tags: ["tls", "insecure", "security"]

  # Connection error handling
  - name: "connection-timeout"
    description: "Test connection timeout handling"
    no_server_override: true  # Use explicit --server address (not the auto-started server)
    args: ["query", "--server", "127.0.0.1:65000", "--timeout", "1", "RETURN 1"]
    expect:
      exit_code: 1
      stderr_contains: ["timeout", "connection"]
    tags: ["error", "timeout", "connection"]

  - name: "invalid-host"
    description: "Test invalid hostname handling"
    no_server_override: true  # Use explicit --server address (not the auto-started server)
    args: ["query", "--server", "invalid.invalid:3141", "--timeout", "2", "RETURN 1"]
    expect:
      exit_code: 1
    tags: ["error", "dns", "connection"]

  - name: "connection-refused"
    description: "Test connection refused handling"
    no_server_override: true  # Use explicit --server address (not the auto-started server)
    args: ["query", "--server", "127.0.0.1:12345", "--timeout", "1", "RETURN 1"]
    expect:
      exit_code: 1
    tags: ["error", "refused", "connection"]

  # Shell interactive mode tests
  - name: "shell-quic-connect"
    description: "Test shell connection over QUIC"
    skip: true  # Shell --non-interactive mode not supported in test harness
    args: ["shell",  "--insecure", "--non-interactive"]
    stdin: "RETURN 'shell-test' AS mode;\n.exit\n"
    expect:
      exit_code: 0
      stdout_contains: ["shell-test"]
    tags: ["shell", "quic", "interactive"]

  - name: "shell-multiple-queries"
    description: "Test multiple queries in shell session"
    skip: true  # Shell --non-interactive mode not supported in test harness
    args: ["shell",  "--insecure", "--non-interactive"]
    stdin: |
      RETURN 1 AS first;
      RETURN 2 AS second;
      RETURN 3 AS third;
      .exit
    expect:
      exit_code: 0
      stdout_contains: ["first", "second", "third"]
    tags: ["shell", "session", "multi-query"]

  # Data operations over QUIC
  - name: "quic-create-data"
    description: "Create data over QUIC connection"
    args: ["query", "--insecure", "CREATE (n:QuicTest {id: uuid(), timestamp: current_timestamp()}) RETURN n.id AS created_id"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["created_id"]
    tags: ["quic", "create", "data"]

  - name: "quic-query-data"
    description: "Query data over QUIC connection"
    args: ["query", "--insecure", "MATCH (n:QuicTest) RETURN count(n) AS quic_nodes"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["quic_nodes"]
    tags: ["quic", "query", "data"]

  - name: "quic-large-transaction"
    description: "Test large transaction over QUIC"
    # UNWIND is not GQL-compliant - replaced with simpler test
    # Original: args: ["query", "--insecure", "UNWIND range(1, 50) AS i CREATE (n:QuicBulk {id: i, data: 'test-data-' + toString(i)}) RETURN count(n) AS created"]
    args: ["query", "--insecure", "CREATE (n1:QuicBulk {id: 1}), (n2:QuicBulk {id: 2}), (n3:QuicBulk {id: 3}) RETURN count(*) AS created"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["created"]
    tags: ["quic", "bulk", "transaction"]

  # Performance and stress tests
  - name: "quic-rapid-connections"
    description: "Test rapid connection establishment and teardown"
    loop: 10
    args: ["query", "--insecure", "RETURN ${loop_index} AS rapid_test"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
    tags: ["quic", "performance", "rapid"]

  - name: "quic-large-result"
    description: "Test large result set over QUIC"
    args: ["query", "--insecure", "MATCH (n:QuicBulk) RETURN n.id, n.data ORDER BY n.id LIMIT 25"]
    expect:
      exit_code: 0
      geode_query:
        min_rows: 1
        max_rows: 25
        columns: ["n.id", "n.data"]
    tags: ["quic", "large-result", "performance"]

  # Protocol-specific tests
  - name: "quic-protocol-version"
    description: "Verify QUIC protocol compatibility"
    args: ["query", "--insecure", "RETURN 'quic-v1' AS protocol_version"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
    tags: ["quic", "protocol", "version"]

  - name: "quic-stream-multiplexing"
    description: "Test QUIC stream multiplexing capability"
    parallel: true
    instances: 3
    args: ["query", "--insecure", "CREATE (n:Stream {id: ${instance_id}, created: current_timestamp()}) RETURN n.id AS stream_id"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
    tags: ["quic", "streams", "multiplexing"]

  # Error recovery tests
  - name: "quic-connection-recovery"
    description: "Test connection recovery after network error simulation"
    args: ["query", "--insecure", "--retry", "3", "RETURN 'recovery-test' AS status"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
    tags: ["quic", "recovery", "retry"]

  - name: "quic-graceful-shutdown"
    description: "Test graceful connection shutdown"
    skip: true  # Shell --non-interactive mode not supported in test harness
    args: ["shell",  "--insecure", "--non-interactive"]
    stdin: "RETURN 'shutdown-test' AS test;\n.exit\n"
    expect:
      exit_code: 0
    tags: ["quic", "shutdown", "graceful"]

  # Security tests
  - name: "quic-tls-handshake"
    description: "Verify TLS 1.3 handshake in QUIC"
    args: ["query", "--insecure", "RETURN 'tls13-test' AS handshake"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
    tags: ["quic", "tls13", "handshake"]

  - name: "quic-encryption-active"
    description: "Verify encryption is active on QUIC connection"
    args: ["query", "--insecure", "RETURN 'encrypted-data' AS secure_payload"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
    tags: ["quic", "encryption", "security"]

  # Cleanup
  - name: "quic-cleanup-test-data"
    description: "Clean up QUIC test data"
    args: ["query", "--insecure", "MATCH (n) WHERE n:QuicTest OR n:QuicBulk OR n:Stream DELETE n"]
    expect:
      exit_code: 0
    tags: ["cleanup", "quic"]

invariants:
  - type: "server_running"
  - type: "quic_transport_available"

tags: ["quic", "transport", "tls", "network", "production"]
