version: '1.0'
name: Geode QUIC Transport Tests
description: Comprehensive testing of QUIC transport layer, TLS certificates, and production network connections
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 30000
    cleanup: true
    args:
    - --log-level
    - info
    env:
      GEODE_LOG_JSON: 'true'
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 10000
    tls_verify: false
    format: json
secrets:
  admin_password:
    source: env
    key: GEODE_ADMIN_PASSWORD
    required: false
  test_token:
    source: env
    key: GEODE_TEST_TOKEN
    required: false
tests:
- name: quic-handshake-success
  description: Verify successful QUIC handshake with self-signed certificate
  args:
  - query
  - --insecure
  - RETURN 'quic-test' AS transport
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
      columns:
      - transport
  tags:
  - quic
  - handshake
  - insecure
- name: quic-secure-connection
  description: Test secure QUIC connection without --insecure flag
  args:
  - query
  - RETURN 'secure-test' AS transport
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
      columns:
      - transport
  tags:
  - quic
  - secure
  - tls
- name: quic-multiple-connections-1
  description: Test multiple concurrent QUIC connections
  parallel: true
  args:
  - query
  - --insecure
  - RETURN 1 AS connection_id
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
      columns:
      - connection_id
  tags:
  - quic
  - concurrent
  - scalability
- name: quic-multiple-connections-2
  description: Test multiple concurrent QUIC connections
  parallel: true
  args:
  - query
  - --insecure
  - RETURN 2 AS connection_id
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
      columns:
      - connection_id
  tags:
  - quic
  - concurrent
  - scalability
- name: quic-multiple-connections-3
  description: Test multiple concurrent QUIC connections
  parallel: true
  args:
  - query
  - --insecure
  - RETURN 3 AS connection_id
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
      columns:
      - connection_id
  tags:
  - quic
  - concurrent
  - scalability
- name: quic-multiple-connections-4
  description: Test multiple concurrent QUIC connections
  parallel: true
  args:
  - query
  - --insecure
  - RETURN 4 AS connection_id
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
      columns:
      - connection_id
  tags:
  - quic
  - concurrent
  - scalability
- name: quic-multiple-connections-5
  description: Test multiple concurrent QUIC connections
  parallel: true
  args:
  - query
  - --insecure
  - RETURN 5 AS connection_id
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
      columns:
      - connection_id
  tags:
  - quic
  - concurrent
  - scalability
- name: certificate-validation
  description: Test certificate validation behavior
  args:
  - query
  - --insecure
  - RETURN current_timestamp() AS cert_test
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
      columns:
      - cert_test
  tags:
  - tls
  - certificate
  - validation
- name: insecure-flag-required
  description: Verify --insecure flag is required for self-signed certificates
  skip_if_env: CI
  args:
  - query
  - RETURN 'no-insecure' AS test
  expect:
    exit_code_any:
    - 0
    - 1
  tags:
  - tls
  - insecure
  - security
- name: connection-timeout
  description: Test connection timeout handling
  no_server_override: true
  args:
  - query
  - --server
  - 127.0.0.1:65000
  - --timeout
  - '1'
  - RETURN 1
  expect:
    exit_code: 1
    stderr_contains:
    - timed out
  tags:
  - error
  - timeout
  - connection
- name: invalid-host
  description: Test invalid hostname handling
  no_server_override: true
  args:
  - query
  - --server
  - invalid.invalid:3141
  - --timeout
  - '2'
  - RETURN 1
  expect:
    exit_code: 1
  tags:
  - error
  - dns
  - connection
- name: connection-refused
  description: Test connection refused handling
  no_server_override: true
  args:
  - query
  - --server
  - 127.0.0.1:12345
  - --timeout
  - '1'
  - RETURN 1
  expect:
    exit_code: 1
  tags:
  - error
  - refused
  - connection
- name: quic-create-data
  description: Create data over QUIC connection
  args:
  - query
  - --insecure
  - 'CREATE (n:QuicTest {id: uuid(), timestamp: current_timestamp()}) RETURN n.id AS created_id'
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
      columns:
      - created_id
  tags:
  - quic
  - create
  - data
- name: quic-query-data
  description: Query data over QUIC connection
  args:
  - query
  - --insecure
  - MATCH (n:QuicTest) RETURN count(n) AS quic_nodes
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
      columns:
      - quic_nodes
  tags:
  - quic
  - query
  - data
- name: quic-large-transaction
  description: Test large transaction over QUIC
  args:
  - query
  - --insecure
  - 'CREATE (n1:QuicBulk {id: 1}), (n2:QuicBulk {id: 2}), (n3:QuicBulk {id: 3}) RETURN n1, n2, n3'
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
      columns:
      - n1
      - n2
      - n3
  tags:
  - quic
  - bulk
  - transaction
- name: quic-rapid-connections-1
  description: Test rapid connection establishment and teardown
