- name: quic-connection-recovery
  description: Test connection recovery after network error simulation
  args:
  - query
  - --insecure
  - --retry
  - '3'
  - RETURN 'recovery-test' AS status
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
  tags:
  - quic
  - recovery
  - retry
- name: quic-tls-handshake
  description: Verify TLS 1.3 handshake in QUIC
  args:
  - query
  - --insecure
  - RETURN 'tls13-test' AS handshake
  expect:
