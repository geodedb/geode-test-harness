- name: quic-large-result
  description: Test large result set over QUIC
  args:
  - query
  - --insecure
  - MATCH (n:QuicBulk) RETURN n.id, n.data ORDER BY n.id LIMIT 25
  expect:
    exit_code: 0
    geode_query:
      min_rows: 1
      max_rows: 25
      columns:
      - n.id
      - n.data
  tags:
  - quic
  - large-result
  - performance
- name: quic-protocol-version
  description: Verify QUIC protocol compatibility
  args:
  - query
  - --insecure
  - RETURN 'quic-v1' AS protocol_version
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
  tags:
  - quic
  - protocol
  - version
- name: quic-stream-multiplexing-1
  description: Test QUIC stream multiplexing capability
  parallel: true
  args:
  - query
  - --insecure
  - 'CREATE (n:Stream {id: 1, created: current_timestamp()}) RETURN n.id AS stream_id'
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
  tags:
  - quic
