    geode_query:
      row_count: 1
  tags:
  - quic
  - tls13
  - handshake
- name: quic-encryption-active
  description: Verify encryption is active on QUIC connection
  args:
  - query
  - --insecure
  - RETURN 'encrypted-data' AS secure_payload
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
  tags:
  - quic
  - encryption
  - security
- name: quic-cleanup-test-data
  description: Clean up QUIC test data
  args:
  - query
  - --insecure
  - MATCH (n) WHERE n:QuicTest OR n:QuicBulk OR n:Stream DELETE n
  expect:
    exit_code: 0
  tags:
  - cleanup
  - quic
invariants:
- type: server_running
- type: quic_transport_available
tags:
- quic
- transport
- tls
- network
- production
