version: '1.0'
name: Gap Analysis Security and CBO Fixes - January 2026
description: 'Tests for security, path finding, and CBO gap fixes: GAP-0070 (TDE Shamir SSS), GAP-0072 (DP Join Enumeration), GAP-0073 (CDC TxIDs), GAP-0080 (Cost Evaluation), GAP-0084 (Path Edges), GAP-0085 (HKDF Key ID)'
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 30000
    cleanup: true
    args:
    - --log-level
    - error
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 30000
    tls_verify: false
    format: json
tests:
- name: gap-0084-path-edges-basic
  description: RELATIONSHIPS(path) returns edge IDs from path finding
  args:
  - query
  - '-'
  stdin: "CREATE (a:PathNode {name: 'A'});\nCREATE (b:PathNode {name: 'B'});\nCREATE (c:PathNode {name: 'C'});\nCREATE (a)-[:CONNECTS]->(b);\nCREATE (b)-[:CONNECTS]->(c);\nMATCH path = (`start`:PathNode {name: 'A'})-[:CONNECTS*1..2]->(`end`:PathNode {name: 'C'})\nRETURN length(path) AS `path_length`, size(RELATIONSHIPS(path)) AS edge_count\n"
  expect:
    exit_code: 0
    stdout_contains:
    - path_length
    - edge_count
  tags:
  - gap-0084
  - path
  - edges
- name: gap-0084-path-nodes-and-edges
  description: Path returns both NODES and RELATIONSHIPS
  args:
  - query
  - '-'
  stdin: "CREATE (x:Waypoint {id: 1});\nCREATE (y:Waypoint {id: 2});\nCREATE (x)-[:ROUTE {distance: 10}]->(y);\nMATCH path = (a:Waypoint {id: 1})-[:ROUTE]->(b:Waypoint {id: 2})\nRETURN NODES(path) AS nodes, RELATIONSHIPS(path) AS edges\n"
  expect:
    exit_code: 0
    stdout_contains:
    - nodes
    - edges
  tags:
  - gap-0084
  - path
  - nodes
  - relationships
- name: gap-0084-shortest-path-edges
  description: Shortest path returns edge information
  args:
  - query
  - '-'
  stdin: "CREATE (p1:Place {name: 'Start'});\nCREATE (p2:Place {name: 'Mid'});\nCREATE (p3:Place {name: 'End'});\nCREATE (p1)-[:PATH {cost: 5}]->(p2);\nCREATE (p2)-[:PATH {cost: 3}]->(p3);\nCREATE (p1)-[:PATH {cost: 10}]->(p3);\nMATCH path = shortestPath((s:Place {name: 'Start'})-[:PATH*]->(e:Place {name: 'End'}))\nRETURN length(path) AS hops\n"
  expect:
    exit_code: 0
    stdout_contains:
    - hops
  tags:
  - gap-0084
  - path
  - shortest
- name: gap-0080-explain-shows-cost
  description: EXPLAIN output includes cost estimates
  args:
  - query
  - '-'
  stdin: EXPLAIN MATCH (n:CostTest) WHERE n.value > 100 RETURN n
  expect:
    exit_code: 0
    stdout_contains:
    - cost
  tags:
  - gap-0080
  - explain
  - cost
- name: gap-0080-cost-based-plan-selection
  description: CBO selects optimal plan based on cost
  args:
  - query
  - --batch
  - '-'
  stdin: "CREATE INDEX ON :CostSelect(indexed_prop);\nCREATE (a:CostSelect {indexed_prop: 'find_me', other: 'data'});\nEXPLAIN MATCH (n:CostSelect {indexed_prop: 'find_me'}) RETURN n\n"
  expect:
    exit_code: 0
  tags:
  - gap-0080
  - cbo
  - index-selection
- name: gap-0072-multi-join-basic
  description: Multi-way join uses DP enumeration for optimal ordering
  args:
  - query
  - '-'
  stdin: "CREATE (a:TableA {id: 1, name: 'A'});\nCREATE (b:TableB {id: 1, ref_a: 1});\nCREATE (c:TableC {id: 1, ref_b: 1});\nMATCH (a:TableA), (b:TableB), (c:TableC)\nWHERE b.ref_a = a.id AND c.ref_b = b.id\nRETURN a.name AS name\n"
  expect:
    exit_code: 0
    stdout_contains:
    - A
  tags:
  - gap-0072
  - join
  - multi-way
- name: gap-0072-four-way-join
  description: Four-way join optimization
  args:
  - query
  - '-'
  stdin: "CREATE (w:T1 {id: 1});\nCREATE (x:T2 {id: 1, t1_id: 1});\nCREATE (y:T3 {id: 1, t2_id: 1});\nCREATE (z:T4 {id: 1, t3_id: 1});\nMATCH (w:T1), (x:T2), (y:T3), (z:T4)\nWHERE x.t1_id = w.id AND y.t2_id = x.id AND z.t3_id = y.id\nRETURN count(*) AS cnt\n"
  expect:
    exit_code: 0
    stdout_contains:
    - '1'
  tags:
  - gap-0072
  - join
  - four-way
- name: gap-0073-transaction-id-tracking
  description: Transactions have unique IDs for CDC tracking
  args:
  - query
  - '-'
  stdin: "BEGIN;\nCREATE (n:CDCTest {event: 'test'});\nCOMMIT;\nRETURN 'transaction_completed' AS status\n"
  expect:
    exit_code: 0
    stdout_contains:
    - transaction_completed
  tags:
  - gap-0073
  - cdc
  - transaction
- name: gap-0073-multi-statement-transaction
  description: Multi-statement transactions have consistent TX ID
  args:
  - query
  - '-'
  stdin: "BEGIN;\nCREATE (a:TxnNode {seq: 1});\nCREATE (b:TxnNode {seq: 2});\nCREATE (a)-[:FOLLOWS]->(b);\nCOMMIT;\nMATCH (n:TxnNode) RETURN count(n) AS cnt\n"
  expect:
    exit_code: 0
    stdout_contains:
    - '2'
  tags:
  - gap-0073
  - cdc
  - multi-statement
- name: gap-0073-rollback-cdc-behavior
  description: Rolled back transactions should not appear in CDC stream
  args:
  - query
  - '-'
  stdin: "BEGIN;\nCREATE (n:RollbackCDC {should_not_exist: true});\nROLLBACK;\nMATCH (n:RollbackCDC) RETURN count(n) AS cnt\n"
  expect:
    exit_code: 0
    stdout_contains:
    - '0'
  tags:
  - gap-0073
  - cdc
  - rollback
- name: gap-0070-0085-tde-encryption-roundtrip
  description: TDE encryption/decryption works (validates key management)
  args:
  - query
  - '-'
  stdin: "CREATE (n:EncryptedNode {sensitive: 'secret_data', public: 'visible'});\nMATCH (n:EncryptedNode) RETURN n.sensitive AS `data`, n.public AS visible\n"
  expect:
    exit_code: 0
    stdout_contains:
    - secret_data
    - visible
  tags:
  - gap-0070
  - gap-0085
  - tde
  - encryption
- name: gap-0070-0085-tde-configure
  description: TDE configuration works (validates secret sharing)
  args:
  - query
  - '-'
  stdin: CALL tde.configure_kms() YIELD success, kms_provider RETURN success, kms_provider
  # SONNY-6342: the tde.* key-management stubs are refused 0A000 (real key management is SONNY-6303).
  expect:
    exit_code: 1
    stdout_contains: [0A000]
  tags:
  - gap-0070
  - gap-0085
  - tde
  - configure
- name: integration-path-with-cost
  description: Path finding with cost-based optimization
  args:
  - query
  - '-'
  stdin: "CREATE (s:Start {id: 1});\nCREATE (m1:Middle {id: 2});\nCREATE (m2:Middle {id: 3});\nCREATE (e:End {id: 4});\nCREATE (s)-[:STEP {weight: 1}]->(m1);\nCREATE (m1)-[:STEP {weight: 1}]->(e);\nCREATE (s)-[:STEP {weight: 2}]->(m2);\nCREATE (m2)-[:STEP {weight: 2}]->(e);\nMATCH path = (`start`:Start)-[:STEP*]->(`end`:End)\nRETURN length(path) AS hops, NODES(path) AS nodes\n"
  expect:
    exit_code: 0
    stdout_contains:
    - hops
    - nodes
  tags:
  - integration
  - gap-0084
  - gap-0080
- name: integration-join-with-transaction
  description: Multi-join query within transaction
  args:
  - query
  - '-'
  stdin: "BEGIN;\nCREATE (u:User {id: 1, name: 'Alice'});\nCREATE (o:Order {id: 1, user_id: 1, total: 100});\nCREATE (i:Item {id: 1, order_id: 1, name: 'Widget'});\nCOMMIT;\nMATCH (u:User), (o:Order), (i:Item)\nWHERE o.user_id = u.id AND i.order_id = o.id\nRETURN u.name AS user, o.total AS total, i.name AS item\n"
  expect:
    exit_code: 0
    stdout_contains:
    - Alice
    - '100'
    - Widget
  tags:
  - integration
  - gap-0072
  - gap-0073
- name: integration-encrypted-path-query
  description: Path query on potentially encrypted data
  args:
  - query
  - '-'
  stdin: "CREATE (a:SecureNode {data: 'encrypted_a'})-[:SECURE_LINK]->(b:SecureNode {data: 'encrypted_b'});\nMATCH path = (`start`:SecureNode)-[:SECURE_LINK]->(`end`:SecureNode)\nRETURN `start`.data AS from_data, `end`.data AS to_data, length(path) AS len\n"
  expect:
    exit_code: 0
    stdout_contains:
    - encrypted_a
    - encrypted_b
    - len
  tags:
  - integration
  - gap-0070
  - gap-0084
- name: edge-empty-path-edges
  description: RELATIONSHIPS on single-node path returns empty
  args:
  - query
  - '-'
  stdin: "CREATE (n:SingleNode {id: 1});\nMATCH path = (n:SingleNode {id: 1})\nRETURN length(path) AS len, size(RELATIONSHIPS(path)) AS edge_count\n"
  expect:
    exit_code: 0
    stdout_contains:
    - '0'
  tags:
  - edge-case
  - gap-0084
  - path
- name: edge-join-single-table
  description: Single table query (no join enumeration needed)
  args:
  - query
  - '-'
  stdin: "CREATE (n:Solo {value: 42});\nMATCH (n:Solo) RETURN n.value AS val\n"
  expect:
    exit_code: 0
    stdout_contains:
    - '42'
  tags:
  - edge-case
  - gap-0072
  - single
- name: edge-cost-estimation-no-stats
  description: Cost estimation works without statistics
  args:
  - query
  - '-'
  stdin: EXPLAIN MATCH (n:NoStats) RETURN n
  expect:
    exit_code: 0
  tags:
  - edge-case
  - gap-0080
  - no-stats
- name: edge-transaction-empty-commit
  description: Empty transaction commit (CDC should handle)
  args:
  - query
  - '-'
  stdin: "BEGIN;\nCOMMIT;\nRETURN 'empty_txn_ok' AS status\n"
  expect:
    exit_code: 0
    stdout_contains:
    - empty_txn_ok
  tags:
  - edge-case
  - gap-0073
  - empty-txn
