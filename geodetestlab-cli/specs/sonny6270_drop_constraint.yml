# SONNY-6270: DROP CONSTRAINT answered success and removed nothing: the row stayed in the catalog, in
# SHOW CONSTRAINTS and across a restart, and a UNIQUE constraint kept refusing writes. It is now the mirror
# image of DROP INDEX: the row is removed from the session graph's catalog (a missing name is 42002; IF
# EXISTS makes it a no-op), the constraint stops being enforced at once, and a dropped constraint stays
# dropped after a restart while a sibling constraint on the same label keeps enforcing.
# SONNY-6720: DROP GRAPH removes every index and constraint row scoped to the graph (saved): a graph
# re-created under the name starts with none, across a restart; other graphs' rows stay.
version: '1.0'
name: SONNY-6270 DROP CONSTRAINT drops the constraint
description: DROP CONSTRAINT removes the constraint, durably
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 60000
    cleanup: false
    args:
    - --log-level
    - warn
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 60000
    tls_verify: false
    format: json
tests:
- name: setup-constraints
  description: 'Setup: setup-constraints'
  args:
  - query
  - --batch
  stdin: |
    CREATE CONSTRAINT p_id FOR (n:P) REQUIRE n.id IS UNIQUE
    CREATE (:P {id: 1})
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    stdout_not_contains:
    - '"error"'
    - '"status_class":"4'
    - '"status_class":"2'
  tags:
  - setup
- name: enforced
  description: a duplicate is refused while the constraint exists (23505)
  args:
  - query
  - '-'
  stdin: |
    CREATE (:P {id: 1})
  expect:
    exit_code: 1
    stdout_contains:
    - '"status_class":"23505"'
    stdout_not_contains:
    - '"status_class":"00000"'
  tags:
  - regression
- name: listed
  description: SHOW CONSTRAINTS lists the constraint
  args:
  - query
  - '-'
  stdin: |
    SHOW CONSTRAINTS
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    - '"rows":[{"name":"p_id","type":"UNIQUE","table":"P","columns":"id"}]'
  tags:
  - regression
- name: drop
  description: DROP CONSTRAINT succeeds
  args:
  - query
  - '-'
  stdin: |
    DROP CONSTRAINT p_id
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
  tags:
  - regression
- name: unlisted
  description: SHOW CONSTRAINTS no longer lists it
  args:
  - query
  - '-'
  stdin: |
    SHOW CONSTRAINTS
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    - '"rows":[]'
  tags:
  - regression
- name: procedure-unlisted
  description: db.constraints() no longer lists it
  args:
  - query
  - '-'
  stdin: |
    CALL db.constraints()
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    stdout_not_contains:
    - p_id
  tags:
  - regression
- name: no-longer-enforced
  description: the duplicate that was refused is accepted now
  args:
  - query
  - '-'
  stdin: |
    CREATE (:P {id: 1})
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
  tags:
  - regression
- name: two-holders
  description: two nodes now hold the key
  args:
  - query
  - '-'
  stdin: |
    MATCH (n:P {id: 1}) RETURN count(n) AS c
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    - '{"c":2}'
    stdout_regex:
    - '"rows":\[(\{[^{}]*\},?){1}\]'
  tags:
  - regression
- name: drop-again
  description: dropping a dropped name is 42002
  args:
  - query
  - '-'
  stdin: |
    DROP CONSTRAINT p_id
  expect:
    exit_code: 1
    stdout_contains:
    - '"status_class":"42002"'
    stdout_not_contains:
    - '"status_class":"00000"'
  tags:
  - regression
- name: drop-if-exists
  description: DROP CONSTRAINT IF EXISTS of a missing name is a no-op
  args:
  - query
  - '-'
  stdin: |
    DROP CONSTRAINT IF EXISTS p_id
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
  tags:
  - regression
- name: drop-never-was
  description: dropping a name that never existed is 42002
  args:
  - query
  - '-'
  stdin: |
    DROP CONSTRAINT never_was
  expect:
    exit_code: 1
    stdout_contains:
    - '"status_class":"42002"'
    stdout_not_contains:
    - '"status_class":"00000"'
  tags:
  - regression
- name: recreate-refused
  description: re-creating the dropped UNIQUE over the now-duplicated data is refused
  args:
  - query
  - '-'
  stdin: |
    CREATE CONSTRAINT p_id FOR (n:P) REQUIRE n.id IS UNIQUE
  expect:
    exit_code: 1
    stdout_contains:
    - '"status_class":"23'
    stdout_not_contains:
    - '"status_class":"00000"'
  tags:
  - regression
- name: setup-durable
  description: 'Setup: setup-durable'
  args:
  - query
  - --batch
  stdin: |
    CREATE CONSTRAINT durable_u FOR (n:Du) REQUIRE n.id IS UNIQUE
    CREATE CONSTRAINT kept_u FOR (n:Du) REQUIRE n.code IS UNIQUE
    CREATE (:Du {id: 1, code: 'a'})
    DROP CONSTRAINT durable_u
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    stdout_not_contains:
    - '"error"'
    - '"status_class":"4'
    - '"status_class":"2'
  tags:
  - setup
  restart_server: true
- name: after-restart-listed
  description: after a restart only the kept constraint is listed
  args:
  - query
  - '-'
  stdin: |
    SHOW CONSTRAINTS
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    - '"rows":[{"name":"kept_u","type":"UNIQUE","table":"Du","columns":"code"}]'
  tags:
  - regression
- name: after-restart-dropped-not-enforced
  description: 'the dropped constraint stays dropped: a duplicate id is accepted'
  args:
  - query
  - '-'
  stdin: |
    CREATE (:Du {id: 1, code: 'b'})
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
  tags:
  - regression
- name: after-restart-kept-enforced
  description: the kept constraint still enforces after the restart
  args:
  - query
  - '-'
  stdin: |
    CREATE (:Du {id: 3, code: 'a'})
  expect:
    exit_code: 1
    stdout_contains:
    - '"status_class":"23505"'
    stdout_not_contains:
    - '"status_class":"00000"'
  tags:
  - regression
- name: after-restart-drop-again
  description: a name dropped before the restart is still not found
  args:
  - query
  - '-'
  stdin: |
    DROP CONSTRAINT durable_u
  expect:
    exit_code: 1
    stdout_contains:
    - '"status_class":"42002"'
    stdout_not_contains:
    - '"status_class":"00000"'
  tags:
  - regression
- name: dg-create-graphs
  description: create the two graphs of the DROP GRAPH section
  args:
  - query
  - -g
  - default
  - '-'
  stdin: |
    CREATE GRAPH IF NOT EXISTS dg1
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
  tags:
  - regression
- name: dg-create-keep-graph
  description: second graph
  args:
  - query
  - -g
  - default
  - '-'
  stdin: |
    CREATE GRAPH IF NOT EXISTS dg2
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
  tags:
  - regression
- name: dg-keep-index
  description: dg2 gets a definition that must survive
  args:
  - query
  - -g
  - dg2
  - '-'
  stdin: |
    CREATE INDEX dg_keep ON K (k) USING btree
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
  tags:
  - regression
- name: dg-index
  description: dg1 gets an index
  args:
  - query
  - -g
  - dg1
  - '-'
  stdin: |
    CREATE INDEX dg_idx FOR (n:P) ON (n.k)
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
  tags:
  - regression
- name: dg-net-index
  description: dg1 gets a name-keyed advanced index
  args:
  - query
  - -g
  - dg1
  - '-'
  stdin: |
    CREATE INDEX dg_net ON N (addr) USING network_cidr
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
  tags:
  - regression
- name: dg-constraint
  description: dg1 gets a UNIQUE constraint
  args:
  - query
  - -g
  - dg1
  - '-'
  stdin: |
    CREATE CONSTRAINT dg_u FOR (n:P) REQUIRE n.id IS UNIQUE
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
  tags:
  - regression
- name: dg-node
  description: dg1 stores a node
  args:
  - query
  - -g
  - dg1
  - '-'
  stdin: |
    CREATE (:P {id: 1, k: 1})
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
  tags:
  - regression
- name: dg-enforced
  description: the constraint enforces in dg1
  args:
  - query
  - -g
  - dg1
  - '-'
  stdin: |
    CREATE (:P {id: 1, k: 2})
  expect:
    exit_code: 1
    stdout_contains:
    - '"status_class":"23505"'
    stdout_not_contains:
    - '"status_class":"00000"'
  tags:
  - regression
- name: dg-net-twin-refused
  description: the network index name is taken in dg2 while dg1 holds it
  args:
  - query
  - -g
  - dg2
  - '-'
  stdin: |
    CREATE INDEX dg_net ON N (addr) USING network_cidr
  expect:
    exit_code: 1
    stdout_contains:
    - '"status_class":"42P07"'
    stdout_not_contains:
    - '"status_class":"00000"'
  tags:
  - regression
- name: dg-drop-graph
  description: DROP GRAPH dg1
  args:
  - query
  - -g
  - default
  - '-'
  stdin: |
    DROP GRAPH dg1
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
  tags:
  - regression
  restart_server: true
- name: dg-recreate
  description: the graph is created again under the same name
  args:
  - query
  - -g
  - default
  - '-'
  stdin: |
    CREATE GRAPH dg1
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
  tags:
  - regression
- name: dg-no-indexes
  description: the new dg1 lists none of the old indexes
  args:
  - query
  - -g
  - dg1
  - '-'
  stdin: |
    SHOW INDEXES
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    stdout_not_contains:
    - dg_idx
    - dg_net
  tags:
  - regression
- name: dg-no-constraints
  description: nor the old constraint
  args:
  - query
  - -g
  - dg1
  - '-'
  stdin: |
    SHOW CONSTRAINTS
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    stdout_not_contains:
    - dg_u
  tags:
  - regression
- name: dg-not-enforced
  description: the old UNIQUE does not enforce against the new graph
  args:
  - query
  - -g
  - dg1
  - '-'
  stdin: |
    CREATE (:P {id: 1})
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
  tags:
  - regression
- name: dg-not-enforced-2
  description: a duplicate is accepted
  args:
  - query
  - -g
  - dg1
  - '-'
  stdin: |
    CREATE (:P {id: 1})
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
  tags:
  - regression
- name: dg-net-name-free
  description: the dropped graph freed the network index name for dg2
  args:
  - query
  - -g
  - dg2
  - '-'
  stdin: |
    CREATE INDEX dg_net ON N (addr) USING network_cidr
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
  tags:
  - regression
- name: dg-keep-listed
  description: dg2 still lists its own index
  args:
  - query
  - -g
  - dg2
  - '-'
  stdin: |
    SHOW INDEXES
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    - dg_keep
  tags:
  - regression
