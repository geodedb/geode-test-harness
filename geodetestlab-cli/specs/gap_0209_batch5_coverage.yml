  expected_exit_code: 0
- name: vector-i32-operations
  description: Test VectorI32 operations
  command: "./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -\n"
  stdin: "RETURN vectori32([1, 2, 3, 4]) AS vec\n"
  expected_output:
    contains:
    - vec
  expected_exit_code: 0
- name: backup-lsn-tracking
  description: Test backup LSN tracking
  command: "./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -\n"
  stdin: "RETURN 'backup configured' AS backup_status\n"
  expected_output:
