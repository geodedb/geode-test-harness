    - backup_status
  expected_exit_code: 0
- name: migration-engine
  description: Test migration engine availability
  command: "./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -\n"
  stdin: "RETURN 'migrations enabled' AS migration_status\n"
  expected_output:
    contains:
    - migration_status
  expected_exit_code: 0
- name: materialized-view-query
  description: Test materialized view operations
  command: "./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -\n"
  stdin: "RETURN 'mv enabled' AS mv_status\n"
  expected_output:
    contains:
    - mv_status
  expected_exit_code: 0
- name: tde-encryption
  description: Test TDE encryption availability
  command: "./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -\n"
  stdin: "RETURN 'tde enabled' AS tde_status\n"
  expected_output:
    contains:
    - tde_status
  expected_exit_code: 0
