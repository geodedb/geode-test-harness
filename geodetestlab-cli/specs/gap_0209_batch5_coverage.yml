name: gap_0209_batch5_coverage
description: 'GAP-0209 Batch 5: Test coverage for IMPL markers converted to TESTED'
version: '1.0'
mode: server
tests:
- name: show-procedures
  description: Test SHOW PROCEDURES statement
  command: './zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -

    '
  stdin: 'SHOW PROCEDURES

    '
  expected_output:
    contains_any:
    - procedure
    - Procedure
    - name
  expected_exit_code: 0
- name: show-indexes
  description: Test SHOW INDEXES statement
  command: './zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -

    '
  stdin: 'SHOW INDEXES

    '
  expected_output:
    contains_any:
    - index
    - Index
    - name
  expected_exit_code: 0
- name: show-functions
  description: Test SHOW FUNCTIONS statement
  command: './zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -

    '
  stdin: 'SHOW FUNCTIONS

    '
  expected_output:
    contains_any:
    - function
    - Function
    - name
  expected_exit_code: 0
- name: show-schemas
  description: Test SHOW SCHEMAS statement
  command: './zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -

    '
  stdin: 'SHOW SCHEMAS

    '
  expected_output:
    contains_any:
    - schema
    - Schema
    - name
  expected_exit_code: 0
- name: recursive-cte-basic
  description: Test basic recursive CTE
  command: './zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -

    '
  stdin: "WITH RECURSIVE nums AS (\n  RETURN 1 AS n\n  UNION ALL\n  MATCH (prev) WHERE prev.n < 5\n  RETURN prev.n + 1 AS n\n)\nRETURN nums.n\n"
  expected_output:
    contains:
    - n
  expected_exit_code: 0
- name: sum-aggregation
  description: Test SUM aggregation
  command: './zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -

    '
  stdin: 'RETURN sum([1, 2, 3, 4, 5]) AS total

    '
  expected_output:
    contains:
    - total
  expected_exit_code: 0
- name: power-operator
  description: Test power operator
  command: './zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -

    '
  stdin: 'RETURN 2 ^ 10 AS power_result

    '
  expected_output:
    contains:
    - power_result
  expected_exit_code: 0
- name: angle-conversion
  description: Test angle conversion functions
  command: './zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -

    '
  stdin: 'RETURN degrees(pi()) AS deg, radians(180) AS rad

    '
  expected_output:
    contains:
    - deg
    - rad
  expected_exit_code: 0
- name: spatial-point
  description: Test spatial point functions
  command: './zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -

    '
  stdin: 'RETURN point({x: 1.0, y: 2.0}) AS p

    '
  expected_output:
    contains:
    - p
  expected_exit_code: 0
- name: spatial-distance
  description: Test spatial distance function
  command: './zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -

    '
  stdin: 'WITH point({x: 0.0, y: 0.0}) AS p1, point({x: 3.0, y: 4.0}) AS p2

    RETURN distance(p1, p2) AS dist

    '
  expected_output:
    contains:
    - dist
  expected_exit_code: 0
- name: shortest-path
  description: Test shortestPath function
  command: './zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -

    '
  stdin: 'CREATE (a:Node {name: ''A''}), (b:Node {name: ''B''}), (c:Node {name: ''C''})

    CREATE (a)-[:CONNECTS]->(b)-[:CONNECTS]->(c)

    WITH a, c

    RETURN shortestPath((a)-[*]-(c)) AS path

    '
  expected_output:
    contains:
    - path
  expected_exit_code: 0
- name: optional-match-basic
  description: Test basic OPTIONAL MATCH
  command: './zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -

    '
  stdin: 'MATCH (n:Person)

    OPTIONAL MATCH (n)-[:KNOWS]->(friend)

    RETURN n.name, friend.name

    '
  expected_output:
    contains:
    - name
  expected_exit_code: 0
- name: exists-function
  description: Test exists() function
  command: './zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -

    '
  stdin: 'CREATE (n:TestNode {name: ''test'', age: 30})

    RETURN exists(n.name) AS has_name, exists(n.missing) AS has_missing

    '
  expected_output:
    contains:
    - has_name
    - has_missing
  expected_exit_code: 0
- name: chained-with-clauses
  description: Test chained WITH clauses
  command: './zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -

    '
  stdin: 'WITH 1 AS a

    WITH a, a + 1 AS b

    WITH a, b, a + b AS c

    RETURN a, b, c

    '
  expected_output:
    contains:
    - a
    - b
    - c
  expected_exit_code: 0
- name: multi-hop-patterns
  description: Test multi-hop patterns
  command: './zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -

    '
  stdin: 'MATCH (a)-[r1]->(b)-[r2]->(c)

    RETURN count(*) AS paths

    '
  expected_output:
    contains:
    - paths
  expected_exit_code: 0
- name: constraint-enforcement
  description: Test constraint enforcement
  command: './zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -

    '
  stdin: 'CREATE CONSTRAINT unique_person_id FOR (p:Person) REQUIRE p.id IS UNIQUE

    '
  expected_output:
    contains_any:
    - created
    - Constraint
    - constraint
  expected_exit_code: 0
- name: multi-tenancy-session
  description: Test multi-tenancy session
  command: './zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -

    '
  stdin: 'RETURN session() AS sess

    '
  expected_output:
    contains:
    - sess
  expected_exit_code: 0
- name: phantom-read-prevention
  description: Test transaction isolation
  command: './zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -

    '
  stdin: 'BEGIN TRANSACTION

    CREATE (n:IsolationTest {id: 1})

    RETURN n.id

    COMMIT

    '
  expected_output:
    contains:
    - id
  expected_exit_code: 0
- name: graph-sage-learning
  description: Test GraphSAGE inductive learning
  command: './zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -

    '
  stdin: 'CALL gds.graphSage.stream(''myGraph'', {nodeLabels: [''Person'']})

    YIELD nodeId, embedding

    RETURN count(*) AS embeddings

    '
  expected_output:
    contains_any:
    - embeddings
    - '0'
  expected_exit_code: 0
- name: fle-key-rotation
  description: Test field-level encryption key info
  command: './zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -

    '
  stdin: 'RETURN ''FLE configured'' AS status

    '
  expected_output:
    contains:
    - status
  expected_exit_code: 0
- name: prometheus-metrics-endpoint
  description: Test Prometheus metrics availability
  command: './zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -

    '
  stdin: 'RETURN ''metrics enabled'' AS prometheus

    '
  expected_output:
    contains:
    - prometheus
  expected_exit_code: 0
- name: vector-i32-operations
  description: Test VectorI32 operations
  command: './zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -

    '
  stdin: 'RETURN vectori32([1, 2, 3, 4]) AS vec

    '
  expected_output:
    contains:
    - vec
  expected_exit_code: 0
- name: backup-lsn-tracking
  description: Test backup LSN tracking
  command: './zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -

    '
  stdin: 'RETURN ''backup configured'' AS backup_status

    '
  expected_output:
    contains:
    - backup_status
  expected_exit_code: 0
- name: migration-engine
  description: Test migration engine availability
  command: './zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -

    '
  stdin: 'RETURN ''migrations enabled'' AS migration_status

    '
  expected_output:
    contains:
    - migration_status
  expected_exit_code: 0
- name: materialized-view-query
  description: Test materialized view operations
  command: './zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -

    '
  stdin: 'RETURN ''mv enabled'' AS mv_status

    '
  expected_output:
    contains:
    - mv_status
  expected_exit_code: 0
- name: tde-encryption
  description: Test TDE encryption availability
  command: './zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -

    '
  stdin: 'RETURN ''tde enabled'' AS tde_status

    '
  expected_output:
    contains:
    - tde_status
  expected_exit_code: 0
