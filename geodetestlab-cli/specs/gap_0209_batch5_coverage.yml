name: gap_0209_batch5_coverage
description: 'GAP-0209 Batch 5: Test coverage for IMPL markers converted to TESTED'
version: '1.0'
mode: server
tests:
- name: show-procedures
  description: Test SHOW PROCEDURES statement
  command: "./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -\n"
  stdin: "SHOW PROCEDURES\n"
  expected_output:
    contains_any:
    - procedure
    - Procedure
    - name
  expected_exit_code: 0
- name: show-indexes
  description: Test SHOW INDEXES statement
  command: "./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -\n"
  stdin: "SHOW INDEXES\n"
  expected_output:
    contains_any:
    - index
    - Index
    - name
  expected_exit_code: 0
- name: show-functions
  description: Test SHOW FUNCTIONS statement
  command: "./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -\n"
  stdin: "SHOW FUNCTIONS\n"
  expected_output:
    contains_any:
    - function
    - Function
    - name
  expected_exit_code: 0
- name: show-schemas
  description: Test SHOW SCHEMAS statement
  command: "./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -\n"
  stdin: "SHOW SCHEMAS\n"
  expected_output:
    contains_any:
    - schema
    - Schema
    - name
  expected_exit_code: 0
- name: recursive-cte-basic
  description: Test basic recursive CTE
  command: "./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -\n"
  stdin: "WITH RECURSIVE nums AS (\n  RETURN 1 AS n\n  UNION ALL\n  MATCH (prev) WHERE prev.n < 5\n  RETURN prev.n + 1 AS n\n)\nRETURN nums.n\n"
  expected_output:
    contains:
    - n
  expected_exit_code: 0
- name: sum-aggregation
  description: |
    Test SUM aggregation. SUM is a GQL set function: it aggregates a numeric
    value over the rows of a binding table, so it is exercised over matched
    rows. (The old form, sum([1, 2, 3, 4, 5]), passed a single LIST value;
    see sum-of-list-value-refused.)
  command: "./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -\n"
  stdin: "CREATE (:Batch5Sum {v: 1}), (:Batch5Sum {v: 2}), (:Batch5Sum {v: 3}), (:Batch5Sum {v: 4}), (:Batch5Sum {v: 5});\nMATCH (n:Batch5Sum) RETURN sum(n.v) AS total;\n"
  expected_output:
    contains:
    - total
    - '15'
  expected_exit_code: 0
- name: sum-of-list-value-refused
  description: |
    SUM over one LIST value is a type error, not a list sum: a set function's
    argument must be numeric (ISO/IEC 39075 general set functions). geode
    refuses it with TypeMismatch; summing a list is reduce()/FOR territory.
  command: "./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -\n"
  stdin: "RETURN sum([1, 2, 3, 4, 5]) AS total\n"
  expected_output:
    contains:
    - TypeMismatch
  expected_exit_code: 0
- name: power-operator
  description: Test power operator
  command: "./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -\n"
  stdin: "RETURN 2 ^ 10 AS power_result\n"
  expected_output:
    contains:
    - power_result
  expected_exit_code: 0
- name: angle-conversion
  description: Test angle conversion functions
  command: "./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -\n"
  stdin: "RETURN degrees(pi()) AS deg, radians(180) AS rad\n"
  expected_output:
    contains:
    - deg
    - rad
  expected_exit_code: 0
- name: spatial-point
  description: |
    Test spatial point functions.

    Retargeted 2026-08-26 (FN-DISPATCH-PARITY): this was RED, and had been for
    as long as it pinned `point({x, y})` — a function the engine has never
    implemented (SQLSTATE 42883). `point` has now been removed from
    SHOW FUNCTIONS; `st_point` is the geometry constructor that exists.
  command: "./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -\n"
  stdin: "RETURN st_point(1.0, 2.0) AS p\n"
  expected_output:
    contains:
    - p
  expected_exit_code: 0
- name: spatial-distance
  description: |
    Test spatial distance function.

    Retargeted 2026-08-26 (FN-DISPATCH-PARITY): the old form built its operands
    with the unimplemented `point()` AND used `distance()`, which in this engine
    is the VECTOR distance — the geospatial one is `ST_Distance`.
  command: "./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -\n"
  stdin: "RETURN ST_Distance(st_point(0.0, 0.0), st_point(3.0, 4.0)) AS dist\n"
  expected_output:
    contains:
    - '5.000000'
  expected_exit_code: 0
- name: shortest-path
  description: Test shortestPath function
  command: "./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -\n"
  stdin: "CREATE (a:Node {name: 'A'}), (b:Node {name: 'B'}), (c:Node {name: 'C'}); MATCH (a:Node {name: 'A'}), (b:Node {name: 'B'}), (c:Node {name: 'C'})\nCREATE (a)-[:CONNECTS]->(b), (b)-[:CONNECTS]->(c);\nMATCH (a:Node {name: 'A'}), (c:Node {name: 'C'})\nRETURN shortestPath((a)-[*]-(c)) AS path\n"
  expected_output:
    contains:
    - path
  expected_exit_code: 0
- name: optional-match-basic
  description: Test basic OPTIONAL MATCH
  command: "./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -\n"
  stdin: "MATCH (n:Person)\nOPTIONAL MATCH (n)-[:KNOWS]->(friend)\nRETURN n.name, friend.name\n"
  expected_output:
    contains:
    - name
  expected_exit_code: 0
- name: exists-function
  description: Test exists() function
  command: "./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -\n"
  stdin: "CREATE (n:TestNode {name: 'test', age: 30})\nRETURN exists(n.name) AS has_name, exists(n.missing) AS has_missing\n"
  expected_output:
    contains:
    - has_name
    - has_missing
  expected_exit_code: 0
- name: chained-with-clauses
  description: Test chained WITH clauses
  command: "./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -\n"
  stdin: "WITH 1 AS a\nWITH a, a + 1 AS b\nWITH a, b, a + b AS c\nRETURN a, b, c\n"
  expected_output:
    contains:
    - a
    - b
    - c
  expected_exit_code: 0
- name: multi-hop-patterns
  description: Test multi-hop patterns
  command: "./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -\n"
  stdin: "MATCH (a)-[r1]->(b)-[r2]->(c)\nRETURN count(*) AS paths\n"
  expected_output:
    contains:
    - paths
  expected_exit_code: 0
- name: constraint-enforcement
  description: Test constraint enforcement
  command: "./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -\n"
  stdin: "CREATE CONSTRAINT unique_person_id FOR (p:Person) REQUIRE p.id IS UNIQUE\n"
  expected_output:
    contains_any:
    - created
    - Constraint
    - constraint
  expected_exit_code: 0
- name: multi-tenancy-session
  description: >
    Test the session/identity surface. The former `session()` call never
    existed in geode, ISO GQL, or Cypher, and the assertion only matched
    the column alias — it "passed" solely because an unresolved function
    silently returned NULL pre-bug-8b. The real surfaces are
    current_user() (authenticated principal) and the ISO SESSION SET
    statement; assert on the actual value, not the alias.
  command: "./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -\n"
  stdin: "RETURN current_user() AS sess\n"
  expected_output:
    contains:
    - '"status_class":"00000"'
    - '"sess":"'
  expected_exit_code: 0
- name: phantom-read-prevention
  description: Test transaction isolation
  command: "./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -\n"
  stdin: "BEGIN TRANSACTION;\nCREATE (n:IsolationTest {id: 1})\nRETURN n.id;\nCOMMIT\n"
  expected_output:
    contains:
    - id
  expected_exit_code: 0
- name: graph-sage-learning
  description: Test GraphSAGE inductive learning
  command: "./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -\n"
  stdin: "CALL gds.graphSage.stream('myGraph', {nodeLabels: ['Person']})\nYIELD nodeId, embedding\nRETURN count(*) AS embeddings\n"
  expected_output:
    contains_any:
    - embeddings
    - '0'
  expected_exit_code: 0
- name: fle-key-rotation
  description: Test field-level encryption key info
  command: "./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -\n"
  stdin: "RETURN 'FLE configured' AS status\n"
  expected_output:
    contains:
    - status
  expected_exit_code: 0
- name: prometheus-metrics-endpoint
  description: Test Prometheus metrics availability
  command: "./zig-out/bin/geode query --server 127.0.0.1:${PORT} --insecure -\n"
  stdin: "RETURN 'metrics enabled' AS prometheus\n"
  expected_output:
