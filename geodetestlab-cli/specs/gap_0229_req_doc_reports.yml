# Gap 0229 Regression Tests: REQ-DOC Requirement ID Reports
# CANARY: REQ=REQ-CI-REQ-DOC-REGRESSION-001; FEATURE="REQ-DOC Report Regression Tests"; ASPECT=RegressionTesting; STATUS=TESTED; TEST=gap_0229_req_doc_reports.yml; OWNER=governance; UPDATED=2026-01-17

name: "GAP-0229: REQ-DOC Requirement ID Reports Regression Tests"
description: |
  Regression tests to ensure REQ-DOC report generation remains functional.
  These tests validate:
  - GAP-0229: Requirement ID extraction and report generation
  - Report tool generates valid output
  - CI integration works correctly

skip_server: true  # These tests run local tools, no server needed

tests:
  # Tool existence and basic functionality
  - name: "GAP-0229-001: req_doc_report.py tool exists"
    type: shell
    command: "test -f tools/req_doc_report.py && echo 'EXISTS'"
    expected_output_contains:
      - "EXISTS"

  - name: "GAP-0229-002: Tool can load status.csv"
    type: shell
    command: "python3 tools/req_doc_report.py --summary 2>&1 | head -3"
    expected_output_contains:
      - "Loaded"
      - "entries from docs/status.csv"

  - name: "GAP-0229-003: Tool can generate summary"
    type: shell
    command: "python3 tools/req_doc_report.py --summary 2>&1 | grep -c 'REQ-GQL:'"
    expected_output_contains:
      - "1"

  # Report generation for specific issues
  - name: "GAP-0229-004: Generate report for issue 293 (status ledger)"
    type: shell
    command: "python3 tools/req_doc_report.py --issue 293 --gitlab-snippet 2>&1 | head -5"
    expected_output_contains:
      - "## Requirement IDs (from doc)"
      - "**Total:**"

  - name: "GAP-0229-005: Generate report for issue 305 (transaction management)"
    type: shell
    command: "python3 tools/req_doc_report.py --issue 305 --gitlab-snippet 2>&1 | head -5"
    expected_output_contains:
      - "## Requirement IDs (from doc)"

  - name: "GAP-0229-006: Generate report for issue 306 (session management)"
    type: shell
    command: "python3 tools/req_doc_report.py --issue 306 --gitlab-snippet 2>&1 | head -5"
    expected_output_contains:
      - "## Requirement IDs (from doc)"

  - name: "GAP-0229-007: Generate report for issue 307 (transaction isolation)"
    type: shell
    command: "python3 tools/req_doc_report.py --issue 307 --gitlab-snippet 2>&1 | head -5"
    expected_output_contains:
      - "## Requirement IDs (from doc)"

  - name: "GAP-0229-008: Generate report for issue 308 (GQL compliance)"
    type: shell
    command: "python3 tools/req_doc_report.py --issue 308 --gitlab-snippet 2>&1 | head -5"
    expected_output_contains:
      - "## Requirement IDs (from doc)"

  # Verify report content quality
  - name: "GAP-0229-009: Issue 305 contains REQ-TXN requirements"
    type: shell
    command: "python3 tools/req_doc_report.py --issue 305 --gitlab-snippet 2>&1 | grep -c 'REQ-TXN'"
    expected_output_pattern: "^[1-9]"

  - name: "GAP-0229-010: Issue 308 contains many GQL requirements"
    type: shell
    command: "python3 tools/req_doc_report.py --issue 308 --gitlab-snippet 2>&1 | grep 'Total:' | grep -oP '[0-9]+'"
    expected_output_pattern: "^[4-9][0-9][0-9]"  # Should be 400+ requirements

  # All issues generation
  - name: "GAP-0229-011: Generate all reports to reports/ directory"
    type: shell
    command: "rm -rf reports && python3 tools/req_doc_report.py --all-issues --gitlab-snippet 2>&1 && ls reports/*.md | wc -l"
    expected_output_contains:
      - "5"  # 5 report files

  # JSON output
  - name: "GAP-0229-012: JSON output is valid JSON"
    type: shell
    command: "python3 tools/req_doc_report.py --issue 305 --json 2>&1 | python3 -m json.tool > /dev/null && echo 'VALID_JSON'"
    expected_output_contains:
      - "VALID_JSON"

  # Unit tests
  - name: "GAP-0229-013: Unit tests pass"
    type: shell
    command: "cd tools && python3 -m unittest test_req_doc_report -v 2>&1 | tail -3"
    expected_output_contains:
      - "OK"

  # Integration with status.csv
  - name: "GAP-0229-014: Total requirements > 3500"
    type: shell
    command: "python3 tools/req_doc_report.py --summary 2>&1 | grep 'Loaded' | grep -oP '[0-9]+' | head -1"
    expected_output_pattern: "^[3-9][0-9][0-9][0-9]"
