description: "Unit tests for label test expressions in WHERE clauses"
binary: geode
timeout: 10

cli:
  binary: "./zig-out/bin/geode"
  server:
    enabled: true
    startup_timeout_ms: 30000
    args: ["--log-level", "error"]

tests:
  # ===============================
  # SINGLE LABEL TESTS
  # ===============================
  - name: "label-test-single-match"
    description: "Test single label test in WHERE clause"
    args: ["query", "-"]
    stdin: |
      CREATE (p:Person {name: 'Alice'})
      CREATE (c:Company {name: 'Acme'})
      MATCH (n) WHERE n:Person RETURN n.name AS name
    expect:
      exit_code: 0
      geode_query:
        status_class: "00000"
        row_count: 1
        rows:
          - ["Alice"]
    tags: ["label_test", "where"]

  - name: "label-test-no-match"
    description: "Test label test with no matching nodes"
    args: ["query", "-"]
    stdin: |
      CREATE (p:Person {name: 'Bob'})
      MATCH (n) WHERE n:Company RETURN n.name AS name
    expect:
      exit_code: 0
      geode_query:
        status_class: "00000"
        row_count: 0
    tags: ["label_test", "where"]

  # ===============================
  # OR LABEL TESTS
  # ===============================
  - name: "label-test-or-two-labels"
    description: "Test OR with two label tests"
    args: ["query", "-"]
    stdin: |
      CREATE (p:Person {name: 'Alice'})
      CREATE (c:Company {name: 'Acme'})
      CREATE (d:Document {title: 'Doc1'})
      MATCH (n) WHERE n:Person OR n:Company RETURN n.name AS name
    expect:
      exit_code: 0
      geode_query:
        status_class: "00000"
        row_count: 2
    tags: ["label_test", "or"]

  - name: "label-test-or-three-labels"
    description: "Test OR with three label tests"
    args: ["query", "-"]
    stdin: |
      CREATE (p:Person {id: 1})
      CREATE (c:Company {id: 2})
      CREATE (d:Document {id: 3})
      CREATE (x:Other {id: 4})
      MATCH (n) WHERE n:Person OR n:Company OR n:Document RETURN n.id AS id
    expect:
      exit_code: 0
      geode_query:
        status_class: "00000"
        row_count: 3
    tags: ["label_test", "or"]

  - name: "label-test-or-returns-labels"
    description: "Test OR label tests returning labels() function"
    args: ["query", "-"]
    stdin: |
      CREATE (p:Person {name: 'Alice'})
      CREATE (t:TxTest {id: 1})
      CREATE (o:Other {value: 'x'})
      MATCH (n) WHERE n:Person OR n:TxTest RETURN labels(n) AS labels
    expect:
      exit_code: 0
      geode_query:
        status_class: "00000"
        row_count: 2
    tags: ["label_test", "or", "labels"]

  # ===============================
  # AND LABEL TESTS
  # ===============================
  - name: "label-test-and-two-labels"
    description: "Test AND with two label tests (multi-label node)"
    args: ["query", "-"]
    stdin: |
      CREATE (n:Person:Employee {name: 'Alice'})
      CREATE (p:Person {name: 'Bob'})
      MATCH (n) WHERE n:Person AND n:Employee RETURN n.name AS name
    expect:
      exit_code: 0
      geode_query:
        status_class: "00000"
        row_count: 1
        rows:
          - ["Alice"]
    tags: ["label_test", "and"]

  # ===============================
  # COMBINED WITH OTHER PREDICATES
  # ===============================
  - name: "label-test-with-property-predicate"
    description: "Test label test combined with property predicate"
    args: ["query", "-"]
    stdin: |
      CREATE (p1:Person {name: 'Alice', age: 30})
      CREATE (p2:Person {name: 'Bob', age: 25})
      CREATE (c:Company {name: 'Acme', age: 10})
      MATCH (n) WHERE n:Person AND n.age > 28 RETURN n.name AS name
    expect:
      exit_code: 0
      geode_query:
        status_class: "00000"
        row_count: 1
        rows:
          - ["Alice"]
    tags: ["label_test", "property"]

  - name: "label-test-or-with-property"
    description: "Test label test OR combined with property check"
    args: ["query", "-"]
    stdin: |
      CREATE (p:Person {name: 'Alice', active: true})
      CREATE (c:Company {name: 'Acme', active: false})
      CREATE (d:Document {title: 'Doc', active: true})
      MATCH (n) WHERE (n:Person OR n:Company) AND n.active = true RETURN n.name AS name
    expect:
      exit_code: 0
      geode_query:
        status_class: "00000"
        row_count: 1
        rows:
          - ["Alice"]
    tags: ["label_test", "property", "or"]

  # ===============================
  # NEGATION TESTS
  # ===============================
  - name: "label-test-negation"
    description: "Test NOT with label test"
    args: ["query", "-"]
    stdin: |
      CREATE (p:Person {name: 'Alice'})
      CREATE (c:Company {name: 'Acme'})
      MATCH (n) WHERE NOT n:Person RETURN n.name AS name
    expect:
      exit_code: 0
      geode_query:
        status_class: "00000"
        row_count: 1
        rows:
          - ["Acme"]
    tags: ["label_test", "not"]

  # ===============================
  # DELETE WITH LABEL TESTS
  # ===============================
  - name: "label-test-in-delete"
    description: "Test label tests in DELETE WHERE clause"
    args: ["query", "-"]
    stdin: |
      CREATE (p:Person {name: 'Alice'})
      CREATE (c:Company {name: 'Acme'})
      CREATE (d:Document {title: 'Doc'})
      MATCH (n) WHERE n:Person OR n:Company DELETE n
      MATCH (remaining) RETURN labels(remaining) AS labels
    expect:
      exit_code: 0
      geode_query:
        status_class: "00000"
        row_count: 1
    tags: ["label_test", "delete"]

  # ===============================
  # EDGE CASES
  # ===============================
  - name: "label-test-empty-graph"
    description: "Test label test on empty graph"
    args: ["query", "-"]
    stdin: "MATCH (n) WHERE n:Person RETURN n"
    expect:
      exit_code: 0
      geode_query:
        status_class: "00000"
        row_count: 0
    tags: ["label_test", "edge_cases"]

  - name: "label-test-with-labels-function"
    description: "Test label test combined with labels() function"
    args: ["query", "-"]
    stdin: |
      CREATE (p:Person:Employee {name: 'Alice'})
      CREATE (c:Company {name: 'Acme'})
      MATCH (n) WHERE n:Person RETURN labels(n) AS labels
    expect:
      exit_code: 0
      geode_query:
        status_class: "00000"
        row_count: 1
    tags: ["label_test", "labels_function"]

  - name: "label-test-case-sensitivity"
    description: "Test label test case sensitivity"
    args: ["query", "-"]
    stdin: |
      CREATE (p:Person {name: 'Alice'})
      MATCH (n) WHERE n:person RETURN n.name AS name
    expect:
      exit_code: 0
      geode_query:
        status_class: "00000"
        row_count: 0
    tags: ["label_test", "case_sensitivity"]
