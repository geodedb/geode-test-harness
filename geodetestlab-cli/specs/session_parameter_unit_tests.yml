name: session_parameter_unit_tests
description: Unit tests for SESSION SET and RESET parameter commands
binary: geode
timeout: 10
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    startup_timeout_ms: 30000
    args:
    - --log-level
    - error
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
tests:
- name: session-set-graph-basic
  description: Test SESSION SET GRAPH with basic parameter
  args:
  - query
  - '-'
  stdin: SESSION SET GRAPH $active_graph = CURRENT_GRAPH
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
      row_count: 0
  tags:
  - session
  - parameters
  - graph
- name: session-set-graph-if-not-exists
  description: Test SESSION SET GRAPH with IF NOT EXISTS
  args:
  - query
  - '-'
  stdin: "SESSION SET GRAPH IF NOT EXISTS $my_graph = G1;\nSESSION SET GRAPH IF NOT EXISTS $my_graph = G2\n"
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
  tags:
  - session
  - parameters
  - graph
- name: session-set-value-integer
  description: Test SESSION SET VALUE with integer
  args:
  - query
  - '-'
  stdin: SESSION SET VALUE $my_value = 42
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
      row_count: 0
  tags:
  - session
  - parameters
  - value
- name: session-set-value-string
  description: Test SESSION SET VALUE with string
  args:
  - query
  - '-'
  stdin: SESSION SET VALUE $my_string = 'hello'
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
  tags:
  - session
  - parameters
  - value
- name: session-set-value-boolean
  description: Test SESSION SET VALUE with boolean
  args:
  - query
  - '-'
  stdin: SESSION SET VALUE $my_bool = true
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
  tags:
  - session
  - parameters
  - value
- name: session-set-value-if-not-exists
  description: Test SESSION SET VALUE with IF NOT EXISTS
  args:
  - query
  - '-'
  stdin: "SESSION SET VALUE $counter = 1;\nSESSION SET VALUE IF NOT EXISTS $counter = 2\n"
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
  tags:
  - session
  - parameters
  - value
- name: session-set-binding-table-basic
  description: Test SESSION SET BINDING TABLE
  args:
  - query
  - '-'
  stdin: SESSION SET BINDING TABLE $my_table = my_binding
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
  tags:
  - session
  - parameters
  - binding_table
- name: session-set-table-shorthand
  description: Test SESSION SET TABLE shorthand
  args:
  - query
  - '-'
  stdin: SESSION SET TABLE $my_table = table1
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
  tags:
  - session
  - parameters
  - binding_table
- name: session-reset-all-parameters
  description: Test SESSION RESET ALL PARAMETERS
  args:
  - query
  - '-'
  stdin: "SESSION SET VALUE $v1 = 1;\nSESSION SET VALUE $v2 = 2;\nSESSION RESET ALL PARAMETERS\n"
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
  tags:
  - session
  - reset
- name: session-reset-parameters-shorthand
  description: Test SESSION RESET PARAMETERS (without ALL)
  args:
  - query
  - '-'
  stdin: "SESSION SET VALUE $v1 = 1;\nSESSION RESET PARAMETERS\n"
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
  tags:
  - session
  - reset
- name: session-reset-single-parameter
  description: Test SESSION RESET PARAMETER for single param
  args:
  - query
  - '-'
  stdin: "SESSION SET VALUE $test_param = 100;\nSESSION RESET PARAMETER $test_param\n"
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
  tags:
  - session
  - reset
- name: session-reset-graph
  description: Test SESSION RESET GRAPH
  args:
  - query
  - '-'
  stdin: "SESSION SET GRAPH $my_graph = G1;\nSESSION RESET GRAPH\n"
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
  tags:
  - session
  - reset
- name: session-reset-time-zone
  description: Test SESSION RESET TIME ZONE
  args:
  - query
  - '-'
  stdin: SESSION RESET TIME ZONE
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
  tags:
  - session
  - reset
- name: session-reset-no-args
  description: Test SESSION RESET with no arguments
  args:
  - query
  - '-'
  stdin: SESSION RESET
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
  tags:
  - session
  - reset
- name: session-parameter-lifecycle
  description: Test full parameter lifecycle
  args:
  - query
  - '-'
  stdin: "SESSION SET VALUE $count = 1;\nSESSION SET VALUE $name = 'test';\nSESSION SET GRAPH $g = G1;\nSESSION RESET PARAMETER $count;\nSESSION RESET ALL PARAMETERS\n"
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
  tags:
  - session
  - integration
- name: session-multiple-parameters
  description: Test setting multiple different parameter types
  args:
  - query
  - '-'
  stdin: "SESSION SET VALUE $v1 = 10;\nSESSION SET VALUE $v2 = 'hello';\nSESSION SET VALUE $v3 = true;\nSESSION SET GRAPH $g1 = G1;\nSESSION SET TABLE $t1 = table1\n"
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
  tags:
  - session
  - integration
