description: "Unit tests for SESSION SET and RESET parameter commands"
binary: geode
timeout: 10

cli:
  binary: "./zig-out/bin/geode"
  server:
    enabled: true
    startup_timeout_ms: 30000
    args: ["--log-level", "error"]

tests:
  # ===============================
  # SESSION SET GRAPH TESTS
  # ===============================
  - name: "session-set-graph-basic"
    description: "Test SESSION SET GRAPH with basic parameter"
    args: ["query", "-"]
    stdin: "SESSION SET GRAPH $current_graph = CURRENT_GRAPH"
    expect:
      exit_code: 0
      geode_query:
        status_class: "00000"
        row_count: 0
    tags: ["session", "parameters", "graph"]

  - name: "session-set-graph-if-not-exists"
    description: "Test SESSION SET GRAPH with IF NOT EXISTS"
    args: ["query", "-"]
    stdin: |
      SESSION SET GRAPH IF NOT EXISTS $my_graph = G1
      SESSION SET GRAPH IF NOT EXISTS $my_graph = G2
    expect:
      exit_code: 0
      geode_query:
        status_class: "00000"
    tags: ["session", "parameters", "graph"]

  # ===============================
  # SESSION SET VALUE TESTS
  # ===============================
  - name: "session-set-value-integer"
    description: "Test SESSION SET VALUE with integer"
    args: ["query", "-"]
    stdin: "SESSION SET VALUE $my_value = 42"
    expect:
      exit_code: 0
      geode_query:
        status_class: "00000"
        row_count: 0
    tags: ["session", "parameters", "value"]

  - name: "session-set-value-string"
    description: "Test SESSION SET VALUE with string"
    args: ["query", "-"]
    stdin: "SESSION SET VALUE $my_string = 'hello'"
    expect:
      exit_code: 0
      geode_query:
        status_class: "00000"
    tags: ["session", "parameters", "value"]

  - name: "session-set-value-boolean"
    description: "Test SESSION SET VALUE with boolean"
    args: ["query", "-"]
    stdin: "SESSION SET VALUE $my_bool = true"
    expect:
      exit_code: 0
      geode_query:
        status_class: "00000"
    tags: ["session", "parameters", "value"]

  - name: "session-set-value-if-not-exists"
    description: "Test SESSION SET VALUE with IF NOT EXISTS"
    args: ["query", "-"]
    stdin: |
      SESSION SET VALUE $counter = 1
      SESSION SET VALUE IF NOT EXISTS $counter = 2
    expect:
      exit_code: 0
      geode_query:
        status_class: "00000"
    tags: ["session", "parameters", "value"]

  # ===============================
  # SESSION SET BINDING TABLE TESTS
  # ===============================
  - name: "session-set-binding-table-basic"
    description: "Test SESSION SET BINDING TABLE"
    args: ["query", "-"]
    stdin: "SESSION SET BINDING TABLE $my_table = my_binding"
    expect:
      exit_code: 0
      geode_query:
        status_class: "00000"
    tags: ["session", "parameters", "binding_table"]

  - name: "session-set-table-shorthand"
    description: "Test SESSION SET TABLE shorthand"
    args: ["query", "-"]
    stdin: "SESSION SET TABLE $my_table = table1"
    expect:
      exit_code: 0
      geode_query:
        status_class: "00000"
    tags: ["session", "parameters", "binding_table"]

  # ===============================
  # SESSION RESET TESTS
  # ===============================
  - name: "session-reset-all-parameters"
    description: "Test SESSION RESET ALL PARAMETERS"
    args: ["query", "-"]
    stdin: |
      SESSION SET VALUE $v1 = 1
      SESSION SET VALUE $v2 = 2
      SESSION RESET ALL PARAMETERS
    expect:
      exit_code: 0
      geode_query:
        status_class: "00000"
    tags: ["session", "reset"]

  - name: "session-reset-parameters-shorthand"
    description: "Test SESSION RESET PARAMETERS (without ALL)"
    args: ["query", "-"]
    stdin: |
      SESSION SET VALUE $v1 = 1
      SESSION RESET PARAMETERS
    expect:
      exit_code: 0
      geode_query:
        status_class: "00000"
    tags: ["session", "reset"]

  - name: "session-reset-single-parameter"
    description: "Test SESSION RESET PARAMETER for single param"
    args: ["query", "-"]
    stdin: |
      SESSION SET VALUE $test_param = 100
      SESSION RESET PARAMETER $test_param
    expect:
      exit_code: 0
      geode_query:
        status_class: "00000"
    tags: ["session", "reset"]

  - name: "session-reset-graph"
    description: "Test SESSION RESET GRAPH"
    args: ["query", "-"]
    stdin: |
      SESSION SET GRAPH $my_graph = G1
      SESSION RESET GRAPH
    expect:
      exit_code: 0
      geode_query:
        status_class: "00000"
    tags: ["session", "reset"]

  - name: "session-reset-time-zone"
    description: "Test SESSION RESET TIME ZONE"
    args: ["query", "-"]
    stdin: "SESSION RESET TIME ZONE"
    expect:
      exit_code: 0
      geode_query:
        status_class: "00000"
    tags: ["session", "reset"]

  - name: "session-reset-no-args"
    description: "Test SESSION RESET with no arguments"
    args: ["query", "-"]
    stdin: "SESSION RESET"
    expect:
      exit_code: 0
      geode_query:
        status_class: "00000"
    tags: ["session", "reset"]

  # ===============================
  # INTEGRATION TESTS
  # ===============================
  - name: "session-parameter-lifecycle"
    description: "Test full parameter lifecycle"
    args: ["query", "-"]
    stdin: |
      SESSION SET VALUE $count = 1
      SESSION SET VALUE $name = 'test'
      SESSION SET GRAPH $g = G1
      SESSION RESET PARAMETER $count
      SESSION RESET ALL PARAMETERS
    expect:
      exit_code: 0
      geode_query:
        status_class: "00000"
    tags: ["session", "integration"]

  - name: "session-multiple-parameters"
    description: "Test setting multiple different parameter types"
    args: ["query", "-"]
    stdin: |
      SESSION SET VALUE $v1 = 10
      SESSION SET VALUE $v2 = 'hello'
      SESSION SET VALUE $v3 = true
      SESSION SET GRAPH $g1 = G1
      SESSION SET TABLE $t1 = table1
    expect:
      exit_code: 0
      geode_query:
        status_class: "00000"
    tags: ["session", "integration"]
