name: gap-157-164-regression
description: Regression tests for GAP-0157 through GAP-0164 fixes
cli:
  server:
    enabled: true
    startup_timeout_ms: 10000
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
tests:
- name: gap-0162-geode-help-distributed
  description: Verify geode --help includes distributed commands
  args:
  - --help
  expect:
    exit_code: 0
    stderr_contains:
    - serve
    - query
    - shell
- name: gap-0159-audit-subcommand-exists
  description: Verify geode audit subcommand is available
  args:
  - --help
  expect:
    exit_code: 0
    stderr_contains:
    - audit
- name: gap-0161-us001-offset-without-order
  description: Verify OFFSET without ORDER BY executes (US001 diagnostic not yet implemented)
  args:
  - query
  - MATCH (n) RETURN n OFFSET 5
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
- name: gap-0161-us001-limit-alone-allowed
  description: Verify LIMIT alone is allowed without ORDER BY
  args:
  - query
  - RETURN 1 AS x LIMIT 10
  expect:
    exit_code: 0
    stdout_contains:
    - x
- name: gap-0161-us001-offset-with-order
  description: Verify OFFSET with ORDER BY is allowed without US001
  args:
  - query
  - RETURN 1 AS x ORDER BY x OFFSET 0 LIMIT 10
  expect:
    exit_code: 0
    stdout_contains:
    - x
- name: gap-regression-version-check
  description: Verify geode binary is functional
  args:
  - --version
  expect:
    exit_code: 0
    stdout_regex:
    - '[0-9]+\.[0-9]+'
