version: '1.0'
name: regression-match-merge-without-return
description: >
  Regression test for SQLSTATE 42000 ("RETURN required") when using
  MATCH + MATCH + MERGE without a RETURN clause.

  Geode's GQL parser rejects queries of the form:
    MATCH (a:Label {id: 'x'})
    MATCH (b:Label {id: 'y'})
    MERGE (a)-[:EDGE]->(b)
  with SQLSTATE 42000, because the query has no RETURN clause.

  The inline MERGE path pattern form:
    MERGE (:LabelA {id: 'x'})-[:EDGE]->(:LabelB {id: 'y'})
  succeeds syntactically (exit_code 0, status 00000) but does not yet
  create edges in the graph store — this is a known Geode limitation.

  This spec verifies:
    1. MATCH + MATCH + MERGE without RETURN returns SQLSTATE 42000
    2. Inline MERGE path pattern succeeds (status 00000)
    3. MATCH + RETURN (no MERGE) still works correctly
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    startup_timeout_ms: 60000
    cleanup: true
    args:
    - --log-level
    - error
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 30000
    tls_verify: false
    format: json
tests:
# --- Setup: Create source and target nodes used by edge tests ---
- name: match-merge-setup-nodes
  description: >
    Create two nodes that will be linked by edge tests. Uses CREATE (not MERGE)
    to isolate this spec from other tests.
  args:
  - query
  - '-'
  stdin: |
    CREATE (:RegMMSource {id: 'reg-mm-src-1', name: 'Source Node'})
    CREATE (:RegMMTarget {id: 'reg-mm-tgt-1', name: 'Target Node'})
  expect:
    exit_code: 0
  tags:
  - regression
  - match-merge
  - setup

# --- Test 1: MATCH + MATCH + MERGE without RETURN must return 42000 ---
- name: match-merge-without-return-fails
  description: >
    Regression guard: MATCH + MATCH + MERGE without RETURN must return
    SQLSTATE 42000. The CLI returns exit_code 0 with the error reported
    in the JSON response body (status_class 42000).
  args:
  - query
  - '-'
  stdin: |
    MATCH (a:RegMMSource {id: 'reg-mm-src-1'})
    MATCH (b:RegMMTarget {id: 'reg-mm-tgt-1'})
    MERGE (a)-[:REG_MM_EDGE]->(b)
  expect:
    exit_code: 0
    stdout_contains:
    - '42000'
    - RETURN
  tags:
  - regression
  - match-merge
  - negative-test
  - sqlstate-42000

# --- Test 2: Inline MERGE path pattern must succeed ---
- name: inline-merge-path-succeeds
  description: >
    The inline MERGE path pattern form succeeds syntactically (status 00000).
    Note: Geode does not yet create edges from MERGE path patterns — this test
    only verifies the command completes without error.
  args:
  - query
  - "MERGE (:RegMMSource {id: 'reg-mm-src-1'})-[:REG_MM_LINK]->(:RegMMTarget {id: 'reg-mm-tgt-1'})"
  expect:
    exit_code: 0
    stdout_contains:
    - '00000'
  tags:
  - regression
  - match-merge
  - positive-test

# --- Test 3: Inline MERGE is idempotent (second call must not error) ---
- name: inline-merge-path-idempotent
  description: >
    Repeating the same inline MERGE must not error. Both calls should return
    status 00000.
  args:
  - query
  - "MERGE (:RegMMSource {id: 'reg-mm-src-1'})-[:REG_MM_LINK]->(:RegMMTarget {id: 'reg-mm-tgt-1'})"
  expect:
    exit_code: 0
    stdout_contains:
    - '00000'
  tags:
  - regression
  - match-merge
  - idempotent

# --- Test 4: MERGE path pattern edge creation is a known limitation ---
- name: inline-merge-edge-count-zero
  description: >
    Known limitation: MERGE path patterns in Geode succeed syntactically but
    do not currently create edges in the graph store. Verify edge count is 0.
    When MERGE path edge creation is implemented, update this test to expect 1.
  args:
  - query
  - >-
    MATCH ()-[r:REG_MM_LINK]->() RETURN count(r) AS edge_count
  - --format
  - json
  expect:
    exit_code: 0
    stdout_contains:
    - edge_count
    - '0'
  tags:
  - regression
  - match-merge
  - known-limitation

# --- Test 5: MATCH + RETURN (no MERGE) still works correctly ---
- name: match-with-return-works
  description: >
    Sanity check: MATCH with an explicit RETURN clause must succeed. This
    confirms that the 42000 error is specific to MATCH+MERGE-without-RETURN,
    not to MATCH in general.
  args:
  - query
  - >-
    MATCH (n:RegMMSource {id: 'reg-mm-src-1'}) RETURN n.name AS name
  - --format
  - json
  expect:
    exit_code: 0
    stdout_contains:
    - Source Node
  tags:
  - regression
  - match-merge
  - sanity

# --- Cleanup: Remove nodes and edges created by this spec ---
- name: match-merge-cleanup
  description: Remove RegMM* nodes (edges are removed via DETACH DELETE).
  args:
  - query
  - '-'
  stdin: |
    MATCH (n:RegMMSource) DETACH DELETE n
    MATCH (n:RegMMTarget) DETACH DELETE n
  expect:
    exit_code: 0
  tags:
  - regression
  - match-merge
  - cleanup
