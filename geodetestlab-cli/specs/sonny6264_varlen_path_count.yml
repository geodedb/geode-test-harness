# SONNY-6264: a variable-length MATCH undercounted paths when edges are parallel or form a diamond (the
# path iterator expanded only the first path to reach a node at a depth). ISO/IEC 39075:2024 16.7 (path
# pattern matching) yields one binding per path.
# Graph: :D k=0..4; edges 0->1 (twice, parallel), 0->2, 1->3, 2->3 (diamond 0-1-3 / 0-2-3), 3->4.
# Paths of length 1..3 from 0: to 1: 2, to 2: 1, to 3: 3 (two via 1 x parallel, one via 2), to 4: 3  => 9.
version: '1.0'
name: SONNY-6264 variable-length MATCH counts every path
description: every path through parallel edges and a diamond is returned
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 60000
    cleanup: true
    args:
    - --log-level
    - warn
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 60000
    tls_verify: false
    format: json
tests:
- name: setup-diamond
  description: 'Setup: setup-diamond'
  args:
  - query
  - --batch
  stdin: |
    CREATE (:D {k: 0}), (:D {k: 1}), (:D {k: 2}), (:D {k: 3}), (:D {k: 4})
    MATCH (a:D {k: 0}), (b:D {k: 1}) CREATE (a)-[:T]->(b)
    MATCH (a:D {k: 0}), (b:D {k: 1}) CREATE (a)-[:T]->(b)
    MATCH (a:D {k: 0}), (c:D {k: 2}) CREATE (a)-[:T]->(c)
    MATCH (b:D {k: 1}), (d:D {k: 3}) CREATE (b)-[:T]->(d)
    MATCH (c:D {k: 2}), (d:D {k: 3}) CREATE (c)-[:T]->(d)
    MATCH (d:D {k: 3}), (e:D {k: 4}) CREATE (d)-[:T]->(e)
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    stdout_not_contains:
    - '"error"'
    - '"status_class":"4'
    - '"status_class":"2'
  tags:
  - setup
- name: count-all
  description: count of paths 1..3 from 0
  args:
  - query
  - '-'
  stdin: |
    MATCH (a:D {k: 0})-[:T*1..3]->(x) RETURN count(*) AS c
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    - '{"c":9}'
    stdout_regex:
    - '"rows":\[(\{[^{}]*\},?){1}\]'
  tags:
  - regression
- name: count-per-end
  description: paths per end node
  args:
  - query
  - '-'
  stdin: |
    MATCH (a:D {k: 0})-[:T*1..3]->(x) RETURN x.k AS k, count(*) AS c GROUP BY x.k
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    - '{"k":1,"c":2}'
    - '{"k":2,"c":1}'
    - '{"k":3,"c":3}'
    - '{"k":4,"c":3}'
    stdout_regex:
    - '"rows":\[(\{[^{}]*\},?){4}\]'
  tags:
  - regression
- name: rows
  description: one row per path
  args:
  - query
  - '-'
  stdin: |
    MATCH (a:D {k: 0})-[:T*1..3]->(x) RETURN x.k AS k ORDER BY k
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    - '"rows":[{"k":1},{"k":1},{"k":2},{"k":3},{"k":3},{"k":3},{"k":4},{"k":4},{"k":4}]'
  tags:
  - regression
- name: no-type
  description: typeless variable-length pattern
  args:
  - query
  - '-'
  stdin: |
    MATCH (a:D {k: 0})-[*1..3]->(x:D) RETURN x.k AS k ORDER BY k
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    - '"rows":[{"k":1},{"k":1},{"k":2},{"k":3},{"k":3},{"k":3},{"k":4},{"k":4},{"k":4}]'
  tags:
  - regression
- name: undirected
  description: undirected from the sink
  args:
  - query
  - '-'
  stdin: |
    MATCH (e:D {k: 4})-[:T*1..4]-(x) RETURN count(*) AS c
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    - '{"c":10}'
    stdout_regex:
    - '"rows":\[(\{[^{}]*\},?){1}\]'
  tags:
  - regression
- name: incoming
  description: incoming paths from the sink
  args:
  - query
  - '-'
  stdin: |
    MATCH (e:D {k: 4})<-[:T*1..3]-(x) RETURN count(*) AS c
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    - '{"c":6}'
    stdout_regex:
    - '"rows":\[(\{[^{}]*\},?){1}\]'
  tags:
  - regression
- name: trail
  description: MATCH TRAIL yields the same paths (no edge repeats here)
  args:
  - query
  - '-'
  stdin: |
    MATCH TRAIL (a:D {k: 0})-[:T*1..3]->(x) RETURN count(*) AS c
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    - '{"c":9}'
    stdout_regex:
    - '"rows":\[(\{[^{}]*\},?){1}\]'
  tags:
  - regression
- name: count-subquery
  description: COUNT {} agrees with MATCH
  args:
  - query
  - '-'
  stdin: |
    RETURN COUNT { (a:D {k: 0})-[:T*1..3]->(x) } AS c
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    - '{"c":9}'
    stdout_regex:
    - '"rows":\[(\{[^{}]*\},?){1}\]'
  tags:
  - regression
- name: comprehension
  description: a pattern comprehension agrees
  args:
  - query
  - '-'
  stdin: |
    RETURN size([(e:D {k: 4})-[:T*1..4]-(x) | x.k]) AS n
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    - '{"n":10}'
    stdout_regex:
    - '"rows":\[(\{[^{}]*\},?){1}\]'
  tags:
  - regression
- name: exact-length
  description: exact length 3 from 0
  args:
  - query
  - '-'
  stdin: |
    MATCH (a:D {k: 0}) RETURN COUNT { (a)-[:T*3..3]->(x) } AS c
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    - '{"c":3}'
    stdout_regex:
    - '"rows":\[(\{[^{}]*\},?){1}\]'
  tags:
  - regression
