# Full-text index maintenance on every write path, across restarts (SONNY-6591),
# and after REMOVE n:L / SET that replaces or drops indexed text (SONNY-6421).
#
# SONNY-6591 (the bugs): after `CREATE INDEX ... USING fulltext`, a CREATE of a
# matching node was not indexed -- `CALL geode.fts.search` returned no row --
# because (1) the QUIC write fast path for a single-statement
# `CREATE (n:L {k: v})` with no RETURN never ran the fulltext maintenance hook,
# and (2) after a restart the in-memory label -> index registry was empty, so
# no write of any kind (CREATE, SET, MERGE, DELETE, REMOVE) reached an index
# that was still searchable.
#
# SONNY-6421 (the bugs): REMOVE n:L left the node's entry in L's fulltext
# index; a SET that replaced an indexed text value (SET n.p = ..., or
# SET n = {map}) left the old words findable (a stale hit).
#
# This spec drives a real `geode serve` over QUIC. Every step's assertion is a
# search by a word unique to one write path, so each result is exactly one row
# (the node written by that path) or no row (the word was replaced / removed /
# deleted). Rows are counted with a regex over the single-line JSON result.
# Rounds:
#   a: every write path on a fresh server;
#   SIGKILL (no checkpoint) + restart: every round-a word still resolves
#      exactly as before, then writes of every path run again;
#   graceful restart (shutdown checkpoint): ditto.
# Fulltext indexes live in the default graph (docs/FULLTEXT_SEARCH.md "Graph
# scope"), so the spec works there.
#
# Not covered here (not observable black-box, covered by the zig step
# `zig build test-sonny6421-index-maintenance`): the vector-index undo repair
# vs a background rebuild, the IndexOnEncryptedField message text and the
# engine-less setNodeProperty refusal.
#
# CANARY: REQ=REQ-SONNY-6591-FTS-WRITE-PATHS; FEATURE="FullText"; ASPECT=WirePathMatrix; STATUS=TESTED; TEST=geodetestlab-cli/specs/sonny6591_fts_write_paths.yml; OWNER=storage; UPDATED=2026-11-17

version: '1.0'
name: Fulltext index maintenance on every write path, before and after restarts (SONNY-6591, SONNY-6421)
description: Every node write path keeps a fulltext index current; SET/REMOVE n:L leave no stale entries; survives SIGKILL and graceful restarts
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 60000
    cleanup: true
    args:
    - --log-level
    - warn
  client:
    timeout_ms: 30000
    tls_verify: false
    format: json
tests:
- name: create-index
  description: Fulltext index on Doc.body in the default graph (nothing indexed yet)
  args:
  - query
  - '-'
  stdin: CREATE INDEX ft_6591 FOR (d:Doc) ON (d.body) USING fulltext
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
  tags:
  - fts
  - sonny6591
  - sonny6421
  - setup
- name: a-fast-create
  description: 'QUIC fast path: single-statement CREATE with no RETURN (was: never indexed)'
  args:
  - query
  - '-'
  stdin: "CREATE (:Doc {tag: 'a-fast', body: 'quokka alpharound'})"
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
  tags:
  - fts
  - sonny6591
  - sonny6421
  - round-a
- name: a-fast-create-found
  description: the fast-path node is searchable right away
  args:
  - query
  - '-'
  stdin: CALL geode.fts.search('ft_6591', 'quokka')
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    stdout_not_contains:
    - '"rows":[]'
    stdout_regex:
    - '"rows":\[\{"node":\d+,"score":[^}]*\}\],"additional'
  tags:
  - fts
  - sonny6591
  - sonny6421
  - round-a
  - key
- name: a-exec-create
  description: executor CREATE (has a RETURN, so not the fast path)
  args:
  - query
  - '-'
  stdin: "CREATE (d:Doc {tag: 'a-exec', body: 'wombat alpharound'}) RETURN d.tag"
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
  tags:
  - fts
  - sonny6591
  - sonny6421
  - round-a
- name: a-exec-create-found
  description: the executor-created node is searchable
  args:
  - query
  - '-'
  stdin: CALL geode.fts.search('ft_6591', 'wombat')
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    stdout_not_contains:
    - '"rows":[]'
    stdout_regex:
    - '"rows":\[\{"node":\d+,"score":[^}]*\}\],"additional'
  tags:
  - fts
  - sonny6591
  - sonny6421
  - round-a
- name: a-shared-word-two-rows
