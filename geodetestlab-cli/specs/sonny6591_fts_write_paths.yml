  - query
  - '-'
  stdin: CALL geode.fts.search('ft_6591', 'alpharound')
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    stdout_regex:
    - '"rows":\[\{"node":\d+,"score":[^}]*\},\{"node":\d+,"score":[^}]*\}\],"additional'
    stdout_not_contains:
    - '"rows":[]'
  tags:
  - fts
  - sonny6591
  - sonny6421
  - round-a
- name: a-merge-create
  description: MERGE ... ON CREATE SET creates an indexed node
