version: '1.0'
name: regression-issue-536-auth-count-overflow
description: >
  Regression test for GitLab issue #536: integer overflow in countAuthRecords().
  HashMap.count() returns u32 (HashMap.Size); summing four u32 values with bare +
  performs u32 arithmetic and panics in safe/debug builds when the total exceeds
  ~4.29 billion. Fixed by casting each count() to u64 before addition.

  This spec exercises bulk MERGE operations (mirroring a real CMMC ingest: 14 domain
  nodes + 110 practice nodes + 320 objective nodes) to ensure the auth subsystem
  survives large node counts without crashing, and that the server remains responsive
  after a high-volume ingest.
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    startup_timeout_ms: 60000
    cleanup: true
    args:
    - --log-level
    - error
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 120000
    tls_verify: false
    format: json
tests:
# --- Phase 1: Create domain nodes (14 CMMC domains) ---
- name: issue-536-create-domains
  description: >
    MERGE 14 CMMCDomain nodes (mirroring actual CMMC domain set). Each MERGE
    exercises auth-graph path; all 14 together stress-test the multi-node path.
  args:
  - query
  - '-'
  stdin: |
    MERGE (d:Reg536Domain {code: 'AC'}) ON CREATE SET d.name = 'Access Control'
    MERGE (d:Reg536Domain {code: 'AT'}) ON CREATE SET d.name = 'Awareness and Training'
    MERGE (d:Reg536Domain {code: 'AU'}) ON CREATE SET d.name = 'Audit and Accountability'
    MERGE (d:Reg536Domain {code: 'CA'}) ON CREATE SET d.name = 'Assessment, Authorization, and Monitoring'
    MERGE (d:Reg536Domain {code: 'CM'}) ON CREATE SET d.name = 'Configuration Management'
    MERGE (d:Reg536Domain {code: 'IA'}) ON CREATE SET d.name = 'Identification and Authentication'
    MERGE (d:Reg536Domain {code: 'IR'}) ON CREATE SET d.name = 'Incident Response'
    MERGE (d:Reg536Domain {code: 'MA'}) ON CREATE SET d.name = 'Maintenance'
    MERGE (d:Reg536Domain {code: 'MP'}) ON CREATE SET d.name = 'Media Protection'
    MERGE (d:Reg536Domain {code: 'PE'}) ON CREATE SET d.name = 'Physical Protection'
    MERGE (d:Reg536Domain {code: 'PS'}) ON CREATE SET d.name = 'Personnel Security'
    MERGE (d:Reg536Domain {code: 'RA'}) ON CREATE SET d.name = 'Risk Assessment'
    MERGE (d:Reg536Domain {code: 'SC'}) ON CREATE SET d.name = 'System and Communications Protection'
    MERGE (d:Reg536Domain {code: 'SI'}) ON CREATE SET d.name = 'System and Information Integrity'
  expect:
    exit_code: 0
  tags:
  - regression
  - issue-536
  - auth
  - overflow

# --- Phase 2: Create level nodes ---
- name: issue-536-create-levels
  description: MERGE CMMC level nodes (Level 1, 2, 3).
  args:
  - query
  - '-'
  stdin: |
    MERGE (l:Reg536Level {name: 'Level 1'})
    MERGE (l:Reg536Level {name: 'Level 2'})
    MERGE (l:Reg536Level {name: 'Level 3'})
  expect:
