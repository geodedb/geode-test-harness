version: '1.0'
name: SONNY-6331 / 6359 password policy on every path; admin ALTER USER SET PASSWORD over the wire
description: |
  SONNY-6331: the documented policy (docs/USER_AUTH.md: at least 20
  characters, upper AND lower case, at least 3 words) was enforced by the
  geode user CLI but NOT by the server's GQL paths: CREATE USER /
  geode.auth.user_create applied an old 8-character rule and
  ALTER USER ... SET PASSWORD / user_reset_password / user_change_password
  applied nothing (even an empty password was accepted). Fixed: one policy on
  every path; a refusal is SQLSTATE 22000 naming the rule that failed (with
  the configured limit) and NEVER echoing the password.

  SONNY-6359: (1) over QUIC/gRPC an Admin's ALTER USER <other> SET PASSWORD
  was refused 42501 by a raw-text intercept before the parser, although the
  docs map it to user_reset_password; (2) user_change_password skipped the
  old-password check when it was empty; (3) auth failures came back as 00000
  status rows instead of GQLSTATUS errors.

  Fixed behaviour proved over the wire with real users:
    - CREATE USER with 'Alice123!', 'sneaky12345', all-lower, all-upper and
      one-word passwords is refused 22000 with the specific rule text, the
      password text is absent from the output, and no user is created;
    - an Admin's ALTER USER <other> SET PASSWORD works over the wire with a
      compliant password (the user then logs in with it, not the old one) and
      is refused 22000 for a weak one (old password keeps working);
    - a non-admin's ALTER USER <other> SET PASSWORD is 42501; one's own works;
    - user_reset_password with '' / 'x' / one word is refused 22000;
    - user_change_password with an EMPTY old password is refused 28000 and
      changes nothing; with the right old password and a weak new one 22000;
      with right old and compliant new it works;
    - duplicate CREATE USER is a 42710 error (not a 00000 row); an unknown
      role in user_assign_role is an error row.

  Engine regressions: test-sonny6331-password-policy-paths,
  test-sonny6359-auth-residuals.

  CANARY: REQ=REQ-SONNY-6331-PASSWORD-POLICY; FEATURE="PasswordPolicy"; ASPECT=ServerPaths; STATUS=TESTED; TEST=self; OWNER=security; UPDATED=2026-11-17
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 60000
    cleanup: true
    args: [--log-level, warn]
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
      GEODE_ADMIN_PASSWORD: Geode Test Admin Passphrase
  client:
    timeout_ms: 30000
    tls_verify: false
    format: json
secrets:
  admin_password:
    source: env
    key: GEODE_ADMIN_PASSWORD
    required: false
    default: Geode Test Admin Passphrase
invariants:
- type: server_running
fuzz:
  enabled: false
tags: [auth, security, password-policy, sonny-6331, sonny-6359]
tests:

# ------------------------------------------------------------ CREATE USER
- name: s6331_create_user_short_refused
  args: [query, -U, geode, -P, '${secret:admin_password}', CREATE USER pp_carol SET PASSWORD 'Alice123!']
  expect:
    exit_code: 1
    stdout_contains: ['"status_class":"22000"', Password too short (minimum 20 characters)]
    stdout_not_contains: [Alice123!, '"status_class":"00000"']

- name: s6331_create_user_old_8_char_rule_refused
  args: [query, -U, geode, -P, '${secret:admin_password}', CREATE USER pp_carol SET PASSWORD 'sneaky12345']
  expect:
    exit_code: 1
    stdout_contains: ['"status_class":"22000"', Password too short (minimum 20 characters)]
    stdout_not_contains: [sneaky12345, '"status_class":"00000"']

- name: s6331_create_user_no_uppercase_refused
  args: [query, -U, geode, -P, '${secret:admin_password}', CREATE USER pp_carol SET PASSWORD 'all lower case words here']
  expect:
    exit_code: 1
    stdout_contains: ['"status_class":"22000"', Password must contain at least one uppercase letter]
    stdout_not_contains: [all lower case words here, '"status_class":"00000"']

- name: s6331_create_user_no_lowercase_refused
  args: [query, -U, geode, -P, '${secret:admin_password}', CREATE USER pp_carol SET PASSWORD 'ALL UPPER CASE WORDS HERE']
  expect:
    exit_code: 1
    stdout_contains: ['"status_class":"22000"', Password must contain at least one lowercase letter]
    stdout_not_contains: [ALL UPPER CASE WORDS HERE, '"status_class":"00000"']

- name: s6331_create_user_one_word_refused
  args: [query, -U, geode, -P, '${secret:admin_password}', CREATE USER pp_carol SET PASSWORD 'CorrectHorseBatteryStaple1']
  expect:
    exit_code: 1
    stdout_contains: ['"status_class":"22000"', Password must be a passphrase with at least 3 words]
    stdout_not_contains: [CorrectHorseBatteryStaple1, '"status_class":"00000"']

- name: s6331_create_user_proc_short_refused
  args: [query, -U, geode, -P, '${secret:admin_password}', "CALL geode.auth.user_create('pp_carol', 'Alice123!')"]
  expect:
    exit_code: 1
    stdout_contains: ['"status_class":"22000"', Password too short (minimum 20 characters)]
    stdout_not_contains: [Alice123!]

- name: s6331_refusals_created_no_user
  args: [query, -U, geode, -P, '${secret:admin_password}', SHOW USERS]
  expect:
    exit_code: 0
    stdout_contains: ['"status_class":"00000"']
    stdout_not_contains: [pp_carol]

- name: s6331_create_user_compliant_ok
  args: [query, -U, geode, -P, '${secret:admin_password}', CREATE USER pp_carol SET PASSWORD 'Carol Policy Passphrase One' ROLE readwrite]
  expect:
    exit_code: 0
    stdout_contains: ['"status_class":"00000"']

- name: s6331_carol_logs_in
  args: [query, -U, pp_carol, -P, Carol Policy Passphrase One, RETURN 1 AS ok]
  expect:
    exit_code: 0
    stdout_contains: ['"ok":1']

- name: s6359_create_user_duplicate_is_error
  description: SONNY-6359 item 3 - a duplicate CREATE USER is a GQLSTATUS error (42710), not a 00000 row.
  args: [query, -U, geode, -P, '${secret:admin_password}', CREATE USER pp_carol SET PASSWORD 'Carol Policy Passphrase Two']
  expect:
    exit_code: 1
    stdout_contains: ['"status_class":"42710"']
    stdout_not_contains: ['"status_class":"00000"']

# --------------------------------------------- admin ALTER USER SET PASSWORD
- name: s6359_admin_alter_other_user_weak_refused
  description: An Admin's ALTER USER <other> SET PASSWORD reaches the policy over the wire (was 42501 by intercept), and a weak one is 22000.
  args: [query, -U, geode, -P, '${secret:admin_password}', ALTER USER pp_carol SET PASSWORD 'short1']
  expect:
    exit_code: 1
    stdout_contains: ['"status_class":"22000"', Password too short (minimum 20 characters)]
    stdout_not_contains: [short1", '"status_class":"42501"', '"status_class":"00000"']

- name: s6331_admin_alter_one_word_refused
  args: [query, -U, geode, -P, '${secret:admin_password}', ALTER USER pp_carol SET PASSWORD 'onewordbutlongenoughHere']
  expect:
    exit_code: 1
    stdout_contains: ['"status_class":"22000"', at least 3 words]

- name: s6331_old_password_still_works_after_refusals
  args: [query, -U, pp_carol, -P, Carol Policy Passphrase One, RETURN 1 AS ok]
  expect:
    exit_code: 0
    stdout_contains: ['"ok":1']

- name: s6359_admin_alter_other_user_compliant_works
  args: [query, -U, geode, -P, '${secret:admin_password}', ALTER USER pp_carol SET PASSWORD 'Carol Policy Passphrase Reset']
  expect:
    exit_code: 0
    stdout_contains: ['"status_class":"00000"']
    stdout_not_contains: ['"status_class":"42501"']

- name: s6359_carol_logs_in_with_reset_password
  args: [query, -U, pp_carol, -P, Carol Policy Passphrase Reset, RETURN 1 AS ok]
  expect:
    exit_code: 0
    stdout_contains: ['"ok":1']

- name: s6359_carol_old_password_no_longer_works
  args: [query, -U, pp_carol, -P, Carol Policy Passphrase One, RETURN 1 AS ok]
  expect:
    exit_code: [1, 2, 3, 4, 5]
    stderr_contains: [Authentication failed]
    stdout_not_contains: ['"ok":1']

- name: s6359_non_admin_alter_other_user_refused
  description: A non-admin may not reset another user's password - 42501.
  args: [query, -U, pp_carol, -P, Carol Policy Passphrase Reset, ALTER USER geode SET PASSWORD 'Hijacked Admin Passphrase Now']
  expect:
    exit_code: 1
    stdout_contains: ['"status_class":"42501"']
    stdout_not_contains: ['"status_class":"00000"']

- name: s6359_user_alters_own_password
  description: One's own ALTER USER SET PASSWORD still works.
  args: [query, -U, pp_carol, -P, Carol Policy Passphrase Reset, ALTER USER pp_carol SET PASSWORD 'Carol Policy Passphrase Own']
  expect:
    exit_code: 0
    stdout_contains: ['"status_class":"00000"']

- name: s6331_admin_still_logs_in
  description: The refused hijack changed nothing.
  args: [query, -U, geode, -P, '${secret:admin_password}', RETURN 1 AS ok]
  expect:
    exit_code: 0
    stdout_contains: ['"ok":1']

# ------------------------------------------------------ user_reset_password
- name: s6331_reset_password_empty_refused
  args: [query, -U, geode, -P, '${secret:admin_password}', "CALL geode.auth.user_reset_password('pp_carol', '')"]
  expect:
    exit_code: 1
    stdout_contains: ['"status_class":"22000"', Password too short (minimum 20 characters)]
    stdout_not_contains: ['"status_class":"00000"']

- name: s6331_reset_password_x_refused
  args: [query, -U, geode, -P, '${secret:admin_password}', "CALL geode.auth.user_reset_password('pp_carol', 'x')"]
  expect:
    exit_code: 1
    stdout_contains: ['"status_class":"22000"']
    stdout_not_contains: ['"status_class":"00000"']

- name: s6331_reset_password_one_word_refused
  args: [query, -U, geode, -P, '${secret:admin_password}', "CALL geode.auth.user_reset_password('pp_carol', 'onewordbutlongenoughHere')"]
  expect:
    exit_code: 1
    stdout_contains: ['"status_class":"22000"', at least 3 words]

- name: s6331_password_unchanged_by_refused_resets
  args: [query, -U, pp_carol, -P, Carol Policy Passphrase Own, RETURN 1 AS ok]
  expect:
    exit_code: 0
    stdout_contains: ['"ok":1']

# ---------------------------------------------------- user_change_password
- name: s6359_change_password_empty_old_refused
  description: SONNY-6359 item 2 - an EMPTY old password no longer skips the check (28000), and nothing changes.
  args: [query, -U, geode, -P, '${secret:admin_password}', "CALL geode.auth.user_change_password('pp_carol', '', 'Carol Policy Passphrase Empty')"]
  expect:
    exit_code: 1
    stdout_contains: ['"status_class":"28000"']
    stdout_not_contains: ['"status_class":"00000"']

- name: s6359_password_unchanged_after_empty_old
  args: [query, -U, pp_carol, -P, Carol Policy Passphrase Own, RETURN 1 AS ok]
  expect:
    exit_code: 0
    stdout_contains: ['"ok":1']

- name: s6331_change_password_weak_new_refused
  args: [query, -U, geode, -P, '${secret:admin_password}', "CALL geode.auth.user_change_password('pp_carol', 'Carol Policy Passphrase Own', 'weakpass9')"]
  expect:
    exit_code: 1
    stdout_contains: ['"status_class":"22000"', Password too short (minimum 20 characters)]
    stdout_not_contains: [weakpass9"]

- name: s6331_change_password_compliant_works
  args: [query, -U, geode, -P, '${secret:admin_password}', "CALL geode.auth.user_change_password('pp_carol', 'Carol Policy Passphrase Own', 'Carol Policy Passphrase Final')"]
  expect:
    exit_code: 0
    stdout_contains: ['"status_class":"00000"']

- name: s6331_carol_logs_in_with_final_password
  args: [query, -U, pp_carol, -P, Carol Policy Passphrase Final, RETURN 1 AS ok]
  expect:
    exit_code: 0
    stdout_contains: ['"ok":1']

# ------------------------------------------------ auth failures are errors
- name: s6359_assign_role_unknown_user_is_error
  description: SONNY-6359 item 3 - failures of the auth procedures are GQLSTATUS errors, not 00000 rows.
  args: [query, -U, geode, -P, '${secret:admin_password}', "CALL geode.auth.user_assign_role('nobody6359', 'readonly')"]
  expect:
    exit_code: 1
    stdout_contains: ['"status_class":"42002"']
    stdout_not_contains: ['"status_class":"00000"']

- name: s6359_assign_role_empty_args_is_error
  args: [query, -U, geode, -P, '${secret:admin_password}', "CALL geode.auth.user_assign_role('', '')"]
  expect:
    exit_code: 1
    stdout_contains: ['"status_class":"22023"']
    stdout_not_contains: ['"status_class":"00000"']

- name: s6359_grant_bad_privilege_is_error
  args: [query, -U, geode, -P, '${secret:admin_password}', "CALL geode.auth.grant('FLY', 'pp_carol', 'g1')"]
  expect:
    exit_code: 1
    stdout_contains: ['"status_class":"22023"']
    stdout_not_contains: ['"status_class":"00000"']
