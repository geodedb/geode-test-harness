  type: shell
  command: "# Search for hardcoded admin123 in authentication paths\nif grep -r \"admin123\" src/cli/main.zig 2>/dev/null\
    \ | grep -v \"GAP-0104\" | grep -v \"SECURITY FIX\" | grep -q \"admin123\"; then\n  echo \"FAIL: Found hardcoded admin123\
    \ credential\"\n  exit 1\nfi\necho \"PASS: No hardcoded admin123 credentials found\"\n"
  expected_exit_code: 0
  skip: true
  skip_reason: Source code verification tests should be in Geode Zig unit tests, not integration test harness
