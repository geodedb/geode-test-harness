# GAP-0104 to GAP-0122 Security Regression Tests
# These tests ensure critical security gaps remain fixed
#
# CRITICAL SECURITY GAPS FIXED:
# - GAP-0104: Removed hardcoded admin:admin123 credentials
# - GAP-0105: TLS validation enabled by default
# - GAP-0106: Authentication enabled by default
# - GAP-0107: KMS uses crypto random for nonces
# - GAP-0108: Default password requires env var
# - GAP-0109: Deterministic nonce mode blocked in production
# - GAP-0110: Audit uses crypto random
# - GAP-0113: CLI TLS certificate verification flags (--ca-cert, --client-cert, --client-key)
# - GAP-0120: Expression type coverage (List/Float support)
# - GAP-0121: Quote handling in STARTS WITH expressions
# - GAP-0112: DP join enumeration for query optimizer
# - GAP-0119: Temporal property filtering with version chain traversal
# - GAP-0114: Federation-aware index recommendations with per-shard cost breakdown
# - GAP-0122: Library mode server embedding documentation and patterns
# - GAP-0115: Memory allocation error handling documentation (Low)
# - GAP-0118: Test coverage documentation consistency (Low)

name: gap_0104_0122_security_regression
description: Security regression tests for GAP-0104 through GAP-0122 fixes
version: "1.0"
requires:
  - geode

# Note: No setup section needed - these are shell-type tests that verify source code patterns
# Any temp file cleanup is handled by individual test commands

tests:
  # GAP-0104: Hardcoded credentials removed
  - name: gap-0104-no-hardcoded-admin123
    description: "GAP-0104: Verify hardcoded admin:admin123 credentials are removed"
    type: shell
    command: |
      # Search for hardcoded admin123 in authentication paths
      if grep -r "admin123" src/cli/main.zig 2>/dev/null | grep -v "GAP-0104" | grep -v "SECURITY FIX" | grep -q "admin123"; then
        echo "FAIL: Found hardcoded admin123 credential"
        exit 1
      fi
      echo "PASS: No hardcoded admin123 credentials found"
    expected_exit_code: 0

  - name: gap-0104-env-var-credentials
    description: "GAP-0104: Verify credentials come from environment variables"
    type: shell
    command: |
      # Verify env var usage in user_management.zig
      if grep -q "GEODE_ADMIN_USERNAME" src/security/user_management.zig && \
         grep -q "GEODE_ADMIN_PASSWORD" src/security/user_management.zig; then
        echo "PASS: Credentials use environment variables"
        exit 0
      fi
      echo "FAIL: Environment variable credential configuration not found"
      exit 1
    expected_exit_code: 0

  # GAP-0105: TLS validation enabled by default
  - name: gap-0105-tls-secure-default
    description: "GAP-0105: Verify TLS validation enabled by default"
    type: shell
    command: |
      # Check default allow_insecure value in quic.zig
      if grep -A1 "allow_insecure:" src/transport/quic.zig | grep -q "= false"; then
        echo "PASS: TLS validation enabled by default (allow_insecure = false)"
        exit 0
      fi
      echo "FAIL: TLS validation not enabled by default"
      exit 1
    expected_exit_code: 0

  - name: gap-0105-kms-tls-secure
    description: "GAP-0105: Verify KMS transport uses secure TLS"
    type: shell
    command: |
      # Check KMS remote server uses secure TLS
      if grep "allow_insecure = false" src/security/kms_remote.zig | grep -q "false"; then
        echo "PASS: KMS transport uses secure TLS"
        exit 0
      fi
      echo "FAIL: KMS transport may use insecure TLS"
      exit 1
    expected_exit_code: 0

