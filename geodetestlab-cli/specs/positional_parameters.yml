# Positional Parameter Tests ($1, $2, $3)
# Verifies that the GQL parser accepts positional parameter references
# used by the Go client library (devnw.dev/geode/db).

name: Positional Parameters
version: '1.0'

cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    startup_timeout_ms: 30000
    cleanup: true
    args:
    - --log-level
    - error
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 30000
    tls_verify: false
    format: json

tests:
- name: RETURN with positional $1
  description: Basic positional parameter in RETURN
  args:
  - query
  - '-'
  - --param
  - '1'
  - '"hello"'
  stdin: RETURN $1 AS val
  expect:
    exit_code: 0
    stdout_contains:
    - '00000'
    - hello
  tags:
  - positional-params
  - regression

- name: RETURN with multiple positional params
  description: Multiple positional parameters $1, $2, $3
  args:
  - query
  - '-'
  - --param
  - '1'
  - '"a"'
  - --param
  - '2'
  - '"b"'
  - --param
  - '3'
  - '"c"'
  stdin: RETURN $1 AS x, $2 AS y, $3 AS z
  expect:
    exit_code: 0
    stdout_contains:
    - '00000'
  tags:
  - positional-params

- name: CREATE with positional params
  description: >
    Reproduces the Go client pattern: CREATE node with positional
    parameters as used by devnw.dev/geode/db Exec().
  args:
  - query
  - '-'
  - --param
  - '1'
  - '"user-123"'
  - --param
  - '2'
  - '"test@example.com"'
  - --param
  - '3'
  - '"Alice"'
  stdin: 'CREATE (:PosParamUser {uid: $1, email: $2, name: $3})'
  expect:
    exit_code: 0
    stdout_contains:
    - '00000'
  tags:
  - positional-params
  - go-client

- name: MATCH with positional WHERE param
  description: Positional parameter in WHERE clause
  args:
  - query
  - '-'
  - --param
  - '1'
  - '"user-123"'
  stdin: MATCH (n:PosParamUser) WHERE n.uid = $1 RETURN n.name AS name
  expect:
    exit_code: 0
    stdout_contains:
    - '00000'
    - Alice
  tags:
  - positional-params

- name: Mixed named and positional params
  description: Named $name and positional $1 in same query
  args:
  - query
  - '-'
  - --param
  - '1'
  - '42'
  - --param
  - name
  - '"world"'
  stdin: RETURN $1 AS num, $name AS greeting
  expect:
    exit_code: 0
    stdout_contains:
    - '00000'
  tags:
  - positional-params

- name: Cleanup positional param test data
  args:
  - query
  - '-'
  stdin: MATCH (n:PosParamUser) DELETE n
  expect:
    exit_code: 0

tags:
- positional-params
- regression
- go-client
