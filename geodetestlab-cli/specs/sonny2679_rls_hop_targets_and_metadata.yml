version: '1.0'
name: 'SONNY-2679 / SONNY-6437 / SONNY-6460: RLS-denied hop targets and metadata are unreachable for a restricted user'
description: |
  Tickets: SONNY-2679 (and SONNY-6437 item 5 / SONNY-6460).
  SONNY-2679 (security, critical): an RLS session is served by the legacy read
  executor, whose hop targets never passed the row-level-security check: single hop,
  variable-length, aggregation, multi-hop and the comprehension/COUNT/EXISTS/
  shortestPath forms returned properties, counts and whole nodes of RLS-denied
  nodes and edges reachable through relationship patterns, and writes through a
  hop (SET/DELETE on a hop target) could touch them.
  SONNY-6437 item 5 / SONNY-6460: db.relationshipTypes() and db.propertyKeys() ignored
  RLS label policies; they must omit an edge type or key only hidden edges carry,
  including an edge whose endpoint is a hidden node.
  Fixture (default graph, built by the admin): g1 -R-> ok -R-> ok2; g1 -R-> leak(:Hidden)
  -R-> far -R-> far2; g1 -SECRET{x:'topsecret'}-> viaSecret -R-> beyond;
  (:Hidden h2) -LINK-> (:Doc d2). bob is denied the labels Hidden and SECRET with
  CALL geode.rls.add_deny_policy; every query runs as the admin (sees all) and as bob.
  Proves: bob never reads, counts, collects or reaches a denied node or edge through
  any traversal shape, the admin still does (positive control), bob's writes through a
  hop leave the hidden rows untouched, and the metadata procedures list only what bob
  can reach.

cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 60000
    cleanup: true
    args: [--log-level, warn]
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 60000
    format: json
secrets:
  admin_password:
    source: env
    key: GEODE_ADMIN_PASSWORD
    required: false
    default: GeodeTestPassword123!
invariants:
- type: server_running
fuzz:
  enabled: false

tests:
- name: s2679-create-user-bob
  description: 'bob: a readwrite user.'
  args: [query, -U, geode, -P, '${secret:admin_password}', CREATE USER bob SET PASSWORD 'Bob Query Passphrase For Testing' ROLE readwrite]
  expect:
    exit_code: 0
    stdout_contains: [created bob]
  tags: [s2679, setup]

- name: s2679-seed
  description: Seed the fixture as the admin.
  args: [query, -U, geode, -P, '${secret:admin_password}', '-']
  stdin: |
    CREATE (:G {s: 'g1'});
    CREATE (:Doc {s: 'ok', cls: 'public'});
    CREATE (:Doc {s: 'ok2', cls: 'public'});
    CREATE (:Doc {s: 'far', cls: 'public'});
    CREATE (:Doc {s: 'far2', cls: 'public'});
    CREATE (:Doc {s: 'viaSecret', cls: 'public'});
    CREATE (:Doc {s: 'beyond', cls: 'public'});
    CREATE (:Hidden {s: 'leak', cls: 'secret'});
    MATCH (a:G {s: 'g1'}), (b:Doc {s: 'ok'}) CREATE (a)-[:R]->(b);
    MATCH (a:Doc {s: 'ok'}), (b:Doc {s: 'ok2'}) CREATE (a)-[:R]->(b);
    MATCH (a:G {s: 'g1'}), (b:Hidden {s: 'leak'}) CREATE (a)-[:R]->(b);
    MATCH (a:Hidden {s: 'leak'}), (b:Doc {s: 'far'}) CREATE (a)-[:R]->(b);
    MATCH (a:Doc {s: 'far'}), (b:Doc {s: 'far2'}) CREATE (a)-[:R]->(b);
    MATCH (a:G {s: 'g1'}), (b:Doc {s: 'viaSecret'}) CREATE (a)-[:SECRET {x: 'topsecret'}]->(b);
    MATCH (a:Doc {s: 'viaSecret'}), (b:Doc {s: 'beyond'}) CREATE (a)-[:R]->(b);
    CREATE (:Hidden {s: 'h2', cls: 'secret'})-[:LINK {link_key: 1}]->(:Doc {s: 'd2', cls: 'public'})
  expect:
    exit_code: 0
  tags: [s2679, setup]

- name: s2679-deny-Hidden
  description: Deny bob Hidden.
  args: [query, -U, geode, -P, '${secret:admin_password}', "CALL geode.rls.add_deny_policy('default', 'Hidden', 'bob')"]
  expect:
    exit_code: 0
    stdout_contains: [deny policy added]
  tags: [s2679, setup]

- name: s2679-deny-SECRET
