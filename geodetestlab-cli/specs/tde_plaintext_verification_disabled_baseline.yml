version: '1.0'
name: TDE Plaintext Verification - Disabled Baseline (Control Test)
description: "IMPORTANT: BASELINE CONTROL TEST\n\nThis test verifies that when TDE is DISABLED, plaintext data IS written to disk.\nThis serves as a control test to ensure our plaintext detection methodology works.\n\nIf this test passes, it confirms:\n1. The grep-based plaintext scanning is functional\n2. Data is actually being written to disk\n3. The test markers are correctly formatted\n4. The data_dir variable resolves correctly\n\nCRITICAL: This test should FIND plaintext (exit_code: 0 for grep)\nThis is the OPPOSITE of TDE-enabled tests!\n\nNOTE: This test uses --disable-tde flag and no encryption environment variables.\n\nCANARY: REQ=REQ-TDE-ENFORCE-006; FEATURE=TDEEnforcement; ASPECT=BaselineControl; STATUS=TESTED; OWNER=security; UPDATED=2026-01-28\n"
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 30000
    cleanup: false
    args:
    # --persist-interval 200 forces the deferred persistence thread to
    # flush to disk every 200 ms (default is 30 000 ms), so the grep
    # plaintext-scan steps below can observe the on-disk bytes within
    # the test's 2 s flush-wait window. Without this the seed CREATEs
    # sit only in the in-memory store and the scans return 0 hits.
    - --persist-interval
    - '200'
    - --log-level
    - info
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 15000
    tls_verify: false
    format: json
tests:
- name: tde-baseline-write-marker-data
  description: Write marker data without encryption
  args:
  - query
  - "CREATE (n:BaselineTest_Marker { type: 'PlaintextMarker', secret: 'BASELINE_PLAINTEXT_MARKER_XYZ123', description: 'This should be found in data files' }) RETURN n.secret AS secret"
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
  tags:
  - tde
  - baseline
  - plaintext
  - write
- name: tde-baseline-write-ssn
  description: Write SSN without encryption
  args:
  - query
  - "CREATE (n:BaselineTest_SSN { type: 'UnencryptedSSN', ssn: 'BASELINE_SSN_UNENCRYPTED_999887777', name: 'Plaintext Person' }) RETURN n.ssn AS ssn"
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
  tags:
  - tde
  - baseline
  - ssn
  - write
- name: tde-baseline-write-credit-card
  description: Write credit card without encryption
  args:
  - query
  - "CREATE (n:BaselineTest_CC { type: 'UnencryptedCC', card_number: 'BASELINE_CC_PLAINTEXT_4111222233334444', cvv: '123' }) RETURN n.card_number AS card"
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
  tags:
  - tde
  - baseline
  - creditcard
  - write
- name: tde-baseline-force-flush
  description: Force data flush to disk
  args:
  - query
  - RETURN 'flush_complete' AS status
  expect:
    exit_code: 0
  tags:
  - tde
  - baseline
  - flush
- name: tde-baseline-wait-for-flush
  description: Wait for async persistence thread to flush data to disk
  command: sleep
  args:
  - '2'
  expect:
    exit_code: 0
  tags:
  - tde
  - baseline
  - flush-wait
- name: tde-baseline-verify-marker-found
  description: 'BASELINE: Verify marker IS found in data files (TDE disabled)'
  command: grep
  args:
  - -r
  - -a
  - -l
  - --exclude=*.jsonl
  - --exclude-dir=timeseries
  - --exclude-dir=fts
  - --exclude-dir=wal
  - BASELINE_PLAINTEXT_MARKER_XYZ123
  - ${data_dir}
  expect:
    exit_code: 0
  tags:
  - tde
  - baseline
  - verify
  - found
- name: tde-baseline-verify-ssn-found
  description: 'BASELINE: Verify SSN IS found in data files (TDE disabled)'
  command: grep
  args:
  - -r
  - -a
  - -l
  - --exclude=*.jsonl
  - --exclude-dir=timeseries
  - --exclude-dir=fts
  - --exclude-dir=wal
  - BASELINE_SSN_UNENCRYPTED_999887777
  - ${data_dir}
  expect:
    exit_code: 0
  tags:
  - tde
  - baseline
  - verify
  - ssn
  - found
- name: tde-baseline-verify-cc-found
  description: 'BASELINE: Verify credit card IS found in data files (TDE disabled)'
  command: grep
  args:
  - -r
  - -a
  - -l
  - --exclude=*.jsonl
  - --exclude-dir=timeseries
  - --exclude-dir=fts
  - --exclude-dir=wal
  - BASELINE_CC_PLAINTEXT_4111222233334444
  - ${data_dir}
  expect:
    exit_code: 0
  tags:
  - tde
  - baseline
  - verify
  - creditcard
  - found
- name: tde-baseline-verify-prefix-found
  description: 'BASELINE: Verify BASELINE_ prefix IS found in data files'
  command: grep
  args:
  - -r
  - -a
  - -l
  - --exclude=*.jsonl
  - --exclude-dir=timeseries
  - --exclude-dir=fts
  - --exclude-dir=wal
  - BASELINE_
  - ${data_dir}
  expect:
    exit_code: 0
  tags:
  - tde
  - baseline
  - verify
  - comprehensive
  - found
invariants:
- type: server_running
plaintext_verification:
  enabled: false
  note: This test intentionally has TDE disabled to verify detection methodology
tags:
- tde
- baseline
- control-test
- methodology-verification
- plaintext-detection
