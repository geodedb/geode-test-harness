  tags:
  - gap-0334
  - interval
  - equality

# ============================================================================
# Path — skip: literal path values cannot be constructed outside a MATCH
# ============================================================================

- name: 'GAP-0334-PATH-001: Path variable from MATCH'
  description: >
    ISO GQL paths are bound via MATCH path = …, not as free literals.
    This test creates a minimal 1-hop graph and asserts that a path variable
    is bound and length() returns the expected integer.
  args:
  - query
  - '-'
  stdin: |
    CREATE (a:VTPathA {id: 'gap0334-pa'})-[:VT_LINK]->(b:VTPathB {id: 'gap0334-pb'})
    RETURN 'path-nodes-created' AS status
  expect:
    exit_code: 0
    stdout_contains:
    - status
  tags:
  - gap-0334
  - path
  - setup

- name: 'GAP-0334-PATH-002: Path length via path variable'
  args:
  - query
  - '-'
  stdin: |
    MATCH p = (a:VTPathA {id: 'gap0334-pa'})-[:VT_LINK]->(b:VTPathB)
    RETURN length(p) AS hops
  expect:
    exit_code: 0
    stdout_contains:
    - hops
    - '1'
  tags:
  - gap-0334
  - path
  - length

- name: 'GAP-0334-PATH-003: Path round-trip via MATCH (pattern-bound)'
  description: |
    ISO/IEC 39075:2024 defines paths only as pattern-bound variables — there
    is no free path() literal constructor, and Geode follows the standard.
    This test exercises the equivalent ISO GQL round-trip path: seed two
    nodes joined by an edge, MATCH with a path variable, then project the
    path length via RETURN. The path value is materialised by the executor
    and serialised back through the wire protocol, which is the meaningful
    "path round-trips through the value system" assertion ISO GQL admits.
  args:
  - query
  - '-'
  stdin: |
    CREATE (:PathRT {id: 1})-[:PATH_LINK]->(:PathRT {id: 2});
    MATCH p = (a:PathRT {id: 1})-[:PATH_LINK]->(b:PathRT {id: 2}) RETURN length(p) AS hops
  expect:
    exit_code: 0
    stdout_contains:
    - '"hops":1'
  tags:
  - gap-0334
  - path
  - roundtrip

# ============================================================================
# Cleanup
# ============================================================================

cleanup:
- args:
  - query
  - '-'
  stdin: |
    MATCH (n)
    WHERE n.id IN [
      'gap0334-date', 'gap0334-time', 'gap0334-dur',
      'gap0334-point', 'gap0334-interval',
      'gap0334-pa', 'gap0334-pb'
    ]
    DETACH DELETE n
    RETURN count(*) AS deleted
  expect:
    exit_code: 0

- args:
  - query
  - '-'
  stdin: |
    MATCH (n:VTRoundtrip {tag: 'gap0334-setup'})
    DETACH DELETE n
    RETURN count(*) AS deleted
  expect:
    exit_code: 0

metadata:
  gaps_covered:
  - id: GAP-0334
    title: Value types (Date, Time, Duration, Point, Path, Interval) lack roundtrip specs
    severity: Medium
    description: >
      No existing spec exercises store-and-retrieve + equality predicate for
      each extended type. Type regressions (serialisation changes, equality
      semantics) would go undetected.
  created: '2026-05-21'
  author: test-harness

tags:
- gql
- types
- roundtrip
- date
- time
- duration
- point
- path
- interval
- gap-0334
