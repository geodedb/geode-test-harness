---
# Test specification for SESSION and TRANSACTION command fixes
# These tests verify the implementation of session management and transaction control
version: "1.0"
name: "SESSION and TRANSACTION Command Tests"
description: "Verify session management and transaction control implementations"

cli:
  binary: "./zig-out/bin/geode"
  server:
    enabled: true
    port: null
    data_dir: null
    startup_timeout_ms: 60000
    cleanup: true
    args: ["--log-level", "warn"]
    env: {}
  client:
    timeout_ms: 30000
    tls_verify: false
    format: "json"

tests:
  # SESSION SET TIME ZONE tests
  - name: session-set-timezone-utc
    description: Test SESSION SET TIME ZONE with UTC string literal
    args: ["query", "-"]
    stdin: "SESSION SET TIME ZONE 'UTC'"
    expect:
      exit_code: 0
      stdout_contains: ["00000"]
    tags: [session, timezone]

  - name: session-set-timezone-local
    description: Test SESSION SET TIME ZONE with LOCAL keyword
    args: ["query", "-"]
    stdin: "SESSION SET TIME ZONE LOCAL"
    expect:
      exit_code: 0
      stdout_contains: ["00000"]
    tags: [session, timezone]

  - name: session-set-timezone-offset
    description: Test SESSION SET TIME ZONE with offset
    args: ["query", "-"]
    stdin: "SESSION SET TIME ZONE '+00:00'"
    expect:
      exit_code: 0
      stdout_contains: ["00000"]
    tags: [session, timezone]

  # SESSION SET SCHEMA tests
  - name: session-set-schema
    description: Test SESSION SET SCHEMA command
    args: ["query", "-"]
    stdin: "SESSION SET SCHEMA test_schema"
    expect:
      exit_code: 0
      stdout_contains: ["00000"]
    tags: [session, schema]

  # SESSION SET PROPERTY GRAPH tests
  - name: session-set-graph-g1
    description: Test SESSION SET PROPERTY GRAPH with G1
    args: ["query", "-"]
    stdin: "SESSION SET PROPERTY GRAPH G1"
    expect:
      exit_code: 0
      stdout_contains: ["00000"]
    tags: [session, graph]

  - name: session-set-graph-g2
    description: Test SESSION SET PROPERTY GRAPH with G2
    args: ["query", "-"]
    stdin: "SESSION SET PROPERTY GRAPH G2"
    expect:
      exit_code: 0
      stdout_contains: ["00000"]
    tags: [session, graph]

  - name: session-set-graph-custom
    description: Test SESSION SET PROPERTY GRAPH with custom graph name
    args: ["query", "-"]
    stdin: "SESSION SET PROPERTY GRAPH CustomGraph"
    expect:
      exit_code: 0
      stdout_contains: ["00000"]
    tags: [session, graph]

  # SESSION RESET tests
  - name: session-reset-no-args
    description: Test SESSION RESET without arguments (resets all)
    args: ["query", "-"]
    stdin: "SESSION RESET"
    expect:
      exit_code: 0
      stdout_contains: ["00000"]
    tags: [session, reset]

  # Transaction tests
  - name: transaction-begin
    description: Test BEGIN transaction
    args: ["query", "-"]
    stdin: "BEGIN"
    expect:
      exit_code: 0
      stdout_contains: ["00000"]
    tags: [transaction]

  - name: transaction-commit
    description: Test COMMIT transaction
    args: ["query", "-"]
    stdin: "BEGIN; CREATE (n:TxTest {id: 1}); COMMIT"
    expect:
      exit_code: 0
    tags: [transaction]

  - name: transaction-rollback
    description: Test ROLLBACK transaction
    args: ["query", "-"]
    stdin: "BEGIN; CREATE (n:TxTest {id: 2}); ROLLBACK"
    expect:
      exit_code: 0
    tags: [transaction]

tags: [session, transaction, gql-compliance]
