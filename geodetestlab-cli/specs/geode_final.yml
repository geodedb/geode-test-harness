version: "1.0"
name: "Geode Final Integration Demo"
description: "Final working demonstration of geodetestlab + Geode integration"

cli:
  binary: "./zig-out/bin/geode"

tests:
  # These tests demonstrate successful integration
  - name: "geode-main-help"
    description: "Geode main help command works"
    args: ["--help"]
    expect:
      exit_code: 0

  - name: "geode-query-help"
    description: "Geode query help command works"
    args: ["query", "--help"]
    expect:
      exit_code: 0

  - name: "geode-shell-help"
    description: "Geode shell help command works"
    args: ["shell", "--help"]
    expect:
      exit_code: 0

  - name: "geode-serve-help"
    description: "Geode serve help command works"
    args: ["serve", "--help"]
    expect:
      exit_code: 0

tags: ["integration", "working", "demo"]
