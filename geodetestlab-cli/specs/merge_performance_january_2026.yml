version: '1.0'
name: MERGE Performance Optimization January 2026
description: 'Tests for MERGE performance optimization using label-based indexing (Issues #391, #392)'
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 30000
    cleanup: true
tests:
- name: merge-creates-node
  description: Test MERGE creates node when none exists
  args:
  - query
  - --batch
  - '-'
  stdin: |
    CREATE GRAPH IF NOT EXISTS test391
    USE GRAPH test391
    MERGE (p:Person {name: 'Alice'})
    MATCH (n:Person) RETURN n.name AS name
  expect:
    row_count: 1
    values:
      name: Alice

- name: merge-finds-existing-node
  description: Test MERGE finds existing node instead of creating duplicate
  args:
  - query
  - --batch
  - '-'
  stdin: |
    CREATE GRAPH IF NOT EXISTS test391b
    USE GRAPH test391b
    CREATE (:Person {name: 'Bob'})
    MERGE (p:Person {name: 'Bob'})
    MATCH (n:Person) RETURN count(n) AS cnt
  expect:
    row_count: 1
    values:
      cnt: 1

- name: merge-label-index-basic
  description: Test MERGE with label uses index for lookup
  args:
  - query
  - --batch
  - '-'
  stdin: |
    CREATE GRAPH IF NOT EXISTS test391c
    USE GRAPH test391c
    MERGE (p:Employee {emp_id: '123'})
    MERGE (p:Employee {emp_id: '123'})
    MATCH (n:Employee) RETURN count(n) AS cnt
  expect:
    row_count: 1
    values:
      cnt: 1

- name: merge-multiple-labels
  description: Test MERGE with multiple labels
  args:
  - query
  - --batch
  - '-'
  stdin: |
    CREATE GRAPH IF NOT EXISTS test391d
    USE GRAPH test391d
    MERGE (p:Person:Manager {name: 'Carol'})
    MATCH (n:Person:Manager) RETURN n.name AS name
  expect:
    row_count: 1
    values:
      name: Carol

- name: delete-detach-with-adjacency
  description: Test DELETE DETACH performance with adjacency index
  args:
  - query
  - --batch
  - '-'
  stdin: |
    CREATE GRAPH IF NOT EXISTS test392
    USE GRAPH test392
    CREATE (a:Node {id: 'A'})-[:CONNECTS]->(b:Node {id: 'B'})-[:CONNECTS]->(c:Node {id: 'C'})
    MATCH (a:Node {id: 'A'}) DETACH DELETE a
    MATCH (n) RETURN count(n) AS cnt
  expect:
    row_count: 1
    values:
      cnt: 2

- name: create-edge-adjacency-basic
  description: Test edges are indexed for adjacency lookup
  args:
  - query
  - --batch
  - '-'
  stdin: |
    CREATE GRAPH IF NOT EXISTS test392b
    USE GRAPH test392b
    CREATE (a:Start {id: 'S'})-[:TO]->(b:End {id: 'E'})
    MATCH ()-[r]->() RETURN type(r) AS rel_type
  expect:
    row_count: 1

- name: merge-repeated-operations
  description: Test repeated MERGE operations don't create duplicates
  args:
  - query
  - --batch
  - '-'
  stdin: |
    CREATE GRAPH IF NOT EXISTS testperf
    USE GRAPH testperf
    MERGE (:Item {id: 1})
    MERGE (:Item {id: 2})
    MERGE (:Item {id: 3})
    MERGE (:Item {id: 1})
    MERGE (:Item {id: 2})
    MERGE (:Item {id: 3})
    MATCH (n:Item) RETURN count(n) AS cnt
  expect:
    row_count: 1
    values:
      cnt: 3

- name: merge-graph-isolation
  description: Test MERGE respects graph boundaries
  args:
  - query
  - --batch
  - '-'
  stdin: |
    CREATE GRAPH IF NOT EXISTS iso1
    CREATE GRAPH IF NOT EXISTS iso2
    USE GRAPH iso1
    MERGE (:Widget {name: 'W1'})
    USE GRAPH iso2
    MERGE (:Widget {name: 'W1'})
    MATCH (n:Widget) RETURN count(n) AS cnt
  expect:
    row_count: 1
    values:
      cnt: 1

teardown:
- |
  DROP GRAPH IF EXISTS test391;
  DROP GRAPH IF EXISTS test391b;
  DROP GRAPH IF EXISTS test391c;
  DROP GRAPH IF EXISTS test391d;
  DROP GRAPH IF EXISTS test392;
  DROP GRAPH IF EXISTS test392b;
  DROP GRAPH IF EXISTS testperf;
  DROP GRAPH IF EXISTS iso1;
  DROP GRAPH IF EXISTS iso2;
