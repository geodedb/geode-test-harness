version: "1.0"
name: "CAST Type Keywords Tests"
description: "Tests for CAST expressions using GQL type keywords (DECIMAL, INTEGER, FLOAT, STRING, BOOLEAN, TIMESTAMP, DATETIME, DATE, TIME)"

# CANARY: REQ=REQ-GQL-CAST-KEYWORDS-001; FEATURE="CastTypeKeywords"; ASPECT=LexerParser; STATUS=TESTED; TEST=geodetestlab/specs/cast_type_keywords.yml; OWNER=parser; UPDATED=2026-01-25

cli:
  binary: "./zig-out/bin/geode"
  server:
    enabled: true
    port: null
    data_dir: null
    startup_timeout_ms: 30000
    cleanup: true
    args: ["--log-level", "info"]
  client:
    timeout_ms: 15000
    tls_verify: false
    format: "json"

tests:
  # ===============================
  # CAST TO INTEGER
  # ===============================

  - name: "cast-string-to-integer"
    description: "CAST string to INTEGER type keyword"
    args: ["query", "RETURN CAST('42' AS INTEGER) AS result"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["result"]
      stdout_json_assert:
        - expression: "results[0].result"
          equals: 42
    tags: ["cast", "integer", "type-keyword"]

  - name: "cast-float-to-integer"
    description: "CAST float to INTEGER truncates decimal"
    args: ["query", "RETURN CAST(3.7 AS INTEGER) AS result"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["result"]
      stdout_json_assert:
        - expression: "results[0].result"
          equals: 3
    tags: ["cast", "integer", "type-keyword"]

  - name: "cast-negative-to-integer"
    description: "CAST negative string to INTEGER"
    args: ["query", "RETURN CAST('-123' AS INTEGER) AS result"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["result"]
      stdout_json_assert:
        - expression: "results[0].result"
          equals: -123
    tags: ["cast", "integer", "type-keyword"]

  # ===============================
  # CAST TO STRING
  # ===============================

  - name: "cast-integer-to-string"
    description: "CAST integer to STRING type keyword"
    args: ["query", "RETURN CAST(42 AS STRING) AS result"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["result"]
      stdout_json_assert:
        - expression: "results[0].result"
          equals: "42"
    tags: ["cast", "string", "type-keyword"]

  - name: "cast-boolean-to-string"
    description: "CAST boolean to STRING"
    args: ["query", "RETURN CAST(true AS STRING) AS result"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["result"]
      stdout_json_assert:
        - expression: "results[0].result"
          equals: "true"
    tags: ["cast", "string", "type-keyword"]

  - name: "cast-null-to-string"
    description: "CAST null to STRING returns null"
    args: ["query", "RETURN CAST(null AS STRING) AS result"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["result"]
      stdout_json_assert:
        - expression: "results[0].result"
          equals: null
    tags: ["cast", "string", "null", "type-keyword"]

  # ===============================
  # CAST TO DECIMAL
  # ===============================

  - name: "cast-string-to-decimal"
    description: "CAST string to DECIMAL type keyword"
    args: ["query", "RETURN CAST('3.14159' AS DECIMAL) AS result"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["result"]
    tags: ["cast", "decimal", "type-keyword"]

  - name: "cast-integer-to-decimal"
    description: "CAST integer to DECIMAL"
    args: ["query", "RETURN CAST(42 AS DECIMAL) AS result"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["result"]
    tags: ["cast", "decimal", "type-keyword"]

  # ===============================
  # CAST TO FLOAT
  # ===============================

  - name: "cast-string-to-float"
    description: "CAST string to FLOAT type keyword"
    args: ["query", "RETURN CAST('2.718' AS FLOAT) AS result"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["result"]
    tags: ["cast", "float", "type-keyword"]

  - name: "cast-integer-to-float"
    description: "CAST integer to FLOAT"
    args: ["query", "RETURN CAST(100 AS FLOAT) AS result"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["result"]
    tags: ["cast", "float", "type-keyword"]

  # ===============================
  # CAST TO BOOLEAN
  # ===============================

  - name: "cast-string-true-to-boolean"
    description: "CAST string 'true' to BOOLEAN"
    args: ["query", "RETURN CAST('true' AS BOOLEAN) AS result"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["result"]
      stdout_json_assert:
        - expression: "results[0].result"
          equals: true
    tags: ["cast", "boolean", "type-keyword"]

  - name: "cast-string-false-to-boolean"
    description: "CAST string 'false' to BOOLEAN"
    args: ["query", "RETURN CAST('false' AS BOOLEAN) AS result"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["result"]
      stdout_json_assert:
        - expression: "results[0].result"
          equals: false
    tags: ["cast", "boolean", "type-keyword"]

  - name: "cast-integer-1-to-boolean"
    description: "CAST integer 1 to BOOLEAN"
    args: ["query", "RETURN CAST(1 AS BOOLEAN) AS result"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["result"]
      stdout_json_assert:
        - expression: "results[0].result"
          equals: true
    tags: ["cast", "boolean", "type-keyword"]

  - name: "cast-integer-0-to-boolean"
    description: "CAST integer 0 to BOOLEAN"
    args: ["query", "RETURN CAST(0 AS BOOLEAN) AS result"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["result"]
      stdout_json_assert:
        - expression: "results[0].result"
          equals: false
    tags: ["cast", "boolean", "type-keyword"]

  # ===============================
  # CAST TO TEMPORAL TYPES
  # ===============================

  - name: "cast-string-to-date"
    description: "CAST string to DATE type keyword"
    args: ["query", "RETURN CAST('2024-06-15' AS DATE) AS result"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["result"]
    tags: ["cast", "date", "temporal", "type-keyword"]

  - name: "cast-string-to-time"
    description: "CAST string to TIME type keyword"
    args: ["query", "RETURN CAST('14:30:00' AS TIME) AS result"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["result"]
    tags: ["cast", "time", "temporal", "type-keyword"]

  - name: "cast-string-to-datetime"
    description: "CAST string to DATETIME type keyword"
    args: ["query", "RETURN CAST('2024-06-15T14:30:00Z' AS DATETIME) AS result"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["result"]
    tags: ["cast", "datetime", "temporal", "type-keyword"]

  - name: "cast-string-to-timestamp"
    description: "CAST string to TIMESTAMP type keyword"
    args: ["query", "RETURN CAST('2024-06-15T14:30:00Z' AS TIMESTAMP) AS result"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["result"]
    tags: ["cast", "timestamp", "temporal", "type-keyword"]

  # ===============================
  # COMPLEX CAST EXPRESSIONS
  # ===============================

  - name: "cast-in-arithmetic"
    description: "CAST used in arithmetic expression"
    args: ["query", "RETURN CAST('10' AS INTEGER) + CAST('20' AS INTEGER) AS result"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["result"]
      stdout_json_assert:
        - expression: "results[0].result"
          equals: 30
    tags: ["cast", "arithmetic", "type-keyword"]

  - name: "cast-nested"
    description: "Nested CAST expressions"
    args: ["query", "RETURN CAST(CAST(42 AS STRING) AS INTEGER) AS result"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["result"]
      stdout_json_assert:
        - expression: "results[0].result"
          equals: 42
    tags: ["cast", "nested", "type-keyword"]

  - name: "cast-in-comparison"
    description: "CAST in comparison expression"
    args: ["query", "RETURN CAST('100' AS INTEGER) > 50 AS result"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["result"]
      stdout_json_assert:
        - expression: "results[0].result"
          equals: true
    tags: ["cast", "comparison", "type-keyword"]

  # ===============================
  # TYPE KEYWORD AS IDENTIFIER FALLBACK
  # ===============================

  - name: "date-keyword-standalone"
    description: "DATE keyword used standalone returns as keyword token"
    args: ["query", "RETURN DATE '2024-01-15' AS result"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["result"]
    tags: ["date", "literal", "type-keyword"]

  - name: "time-keyword-standalone"
    description: "TIME keyword used standalone returns as keyword token"
    args: ["query", "RETURN TIME '10:30:00' AS result"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["result"]
    tags: ["time", "literal", "type-keyword"]

  - name: "datetime-keyword-standalone"
    description: "DATETIME keyword used standalone returns as keyword token"
    args: ["query", "RETURN DATETIME '2024-01-15T10:30:00Z' AS result"]
    expect:
      exit_code: 0
      geode_query:
        row_count: 1
        columns: ["result"]
    tags: ["datetime", "literal", "type-keyword"]
