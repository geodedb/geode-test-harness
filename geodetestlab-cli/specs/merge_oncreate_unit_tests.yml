name: merge_oncreate_unit_tests
description: Unit tests for MERGE with ON CREATE and ON MATCH clauses
binary: geode
timeout: 10
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    startup_timeout_ms: 30000
    args:
    - --log-level
    - error
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
tests:
- name: merge-on-create-string-property
  description: Test MERGE ON CREATE with string property
  args:
  - query
  - '-'
  stdin: "MERGE (p:Person {email: 'test@example.com'})\nON CREATE SET p.name = 'TestUser', p.created = true\nRETURN p.name AS name, p.email AS email, p.created AS created\n"
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
      row_count: 1
      columns:
      - name
      - email
      - created
      rows:
      - - TestUser
        - test@example.com
        - true
  tags:
  - merge
  - on_create
- name: merge-on-create-integer-property
  description: Test MERGE ON CREATE with integer property
  args:
  - query
  - '-'
  stdin: "MERGE (u:User {id: 123})\nON CREATE SET u.count = 1, u.active = true\nRETURN u.id AS id, u.count AS count\n"
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
      row_count: 1
  tags:
  - merge
  - on_create
- name: merge-on-create-boolean-property
  description: Test MERGE ON CREATE with boolean property
  args:
  - query
  - '-'
  stdin: "MERGE (d:Document {path: '/test'})\nON CREATE SET d.published = false, d.draft = true\nRETURN d.published AS published\n"
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
      rows:
      - - false
  tags:
  - merge
  - on_create
- name: merge-on-create-multiple-properties
  description: Test MERGE ON CREATE with multiple properties of different types
  args:
  - query
  - '-'
  stdin: "MERGE (n:Node {key: 'abc'})\nON CREATE SET n.name = 'NewNode', n.count = 42, n.enabled = true\nRETURN n.name AS name, n.count AS count, n.enabled AS enabled\n"
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
      columns:
      - name
      - count
      - enabled
  tags:
  - merge
  - on_create
- name: merge-on-match-existing-node
  description: Test MERGE ON MATCH with existing node
  args:
  - query
  - '-'
  stdin: "CREATE (p:Person {email: 'existing@example.com', name: 'Original'});\nMERGE (p:Person {email: 'existing@example.com'})\nON MATCH SET p.accessed = true, p.count = 1\nRETURN p.name AS name, p.accessed AS accessed\n"
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
      rows:
      - - Original
        - true
  tags:
  - merge
  - on_match
- name: merge-on-match-update-string
  description: Test MERGE ON MATCH updating string property
  args:
  - query
  - '-'
  stdin: "CREATE (u:User {id: 1, status: 'inactive'});\nMERGE (u:User {id: 1})\nON MATCH SET u.status = 'active'\nRETURN u.status AS status\n"
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
      rows:
      - - active
  tags:
  - merge
  - on_match
- name: merge-on-create-and-match-new-node
  description: Test MERGE with both ON CREATE and ON MATCH (new node)
  args:
  - query
  - '-'
  stdin: "MERGE (p:Person {email: 'new@example.com'})\nON CREATE SET p.name = 'NewPerson', p.created = true\nON MATCH SET p.accessed = true\nRETURN p.name AS name, p.created AS created, p.accessed AS accessed\n"
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
      rows:
      - - NewPerson
        - true
        - 
  tags:
  - merge
  - integration
- name: merge-on-create-and-match-existing-node
  description: Test MERGE with both ON CREATE and ON MATCH (existing node)
  args:
  - query
  - '-'
  stdin: "CREATE (p:Person {email: 'exist@example.com', name: 'Existing'});\nMERGE (p:Person {email: 'exist@example.com'})\nON CREATE SET p.created = true\nON MATCH SET p.accessed = true\nRETURN p.name AS name, p.created AS created, p.accessed AS accessed\n"
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
      rows:
      - - Existing
        - 
        - true
  tags:
  - merge
  - integration
- name: merge-double-execution-check
  description: Test MERGE executed twice shows ON MATCH on second run
  args:
  - query
  - '-'
  stdin: "MERGE (p:Person {email: 'double@example.com'})\nON CREATE SET p.create_count = 1\nON MATCH SET p.match_count = 1\nRETURN p.create_count AS c1, p.match_count AS m1;\nMERGE (p:Person {email: 'double@example.com'})\nON CREATE SET p.create_count = 2\nON MATCH SET p.match_count = 2\nRETURN p.create_count AS c2, p.match_count AS m2\n"
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
  tags:
  - merge
  - integration
- name: merge-without-on-clauses
  description: Test MERGE without ON CREATE or ON MATCH
  args:
  - query
  - '-'
  stdin: "MERGE (p:Person {email: 'simple@example.com'})\nRETURN p.email AS email\n"
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
      rows:
      - - simple@example.com
  tags:
  - merge
  - edge_cases
- name: merge-with-return-clause
  description: Test MERGE with RETURN clause
  args:
  - query
  - '-'
  stdin: "MERGE (p:Person {email: 'return@example.com'})\nON CREATE SET p.new_field = 'created'\nRETURN p.email AS email, p.new_field AS field\n"
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
      columns:
      - email
      - field
  tags:
  - merge
  - edge_cases
- name: merge-property-expressions
  description: Test MERGE evaluates property expressions correctly
  args:
  - query
  - '-'
  stdin: "MERGE (n:Node {id: 1})\nON CREATE SET n.str = 'hello', n.num = 42, n.bool = false\nRETURN n.str AS s, n.num AS n, n.bool AS b\n"
  expect:
    exit_code: 0
    geode_query:
      status_class: '00000'
      rows:
      - - hello
        - 42
        - false
  tags:
  - merge
  - expressions
