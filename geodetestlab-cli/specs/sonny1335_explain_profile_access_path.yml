# EXPLAIN and PROFILE report the access path the executor really takes, and
# name only real catalog indexes (SONNY-1335, SONNY-6276).
#
# SONNY-1335 (the bug): PROFILE put a NodeIndexScan operator named with the
# literal "heuristic_index" in front of any query with a WHERE/FILTER equality
# -- no catalog lookup -- so an UNINDEXED predicate profiled as an index scan,
# and the planned PROFILE copied the plan's IndexSeek decision into the trace
# whether or not the executor then seeked (an equality under an AND, a fulltext
# index on the property) and never carried the index's name.
#
# SONNY-6276 (the bug): EXPLAIN still over-reported: it showed IndexSeek for an
# index of ANY type (a fulltext index on the property), and for an equality
# anywhere inside an AND chain, although the executor seeks only on a WHERE
# that is one equality (or the inline {prop: v} map) over a btree/hash catalog
# index on that label+property in the session graph. The response flag
# U:HeuristicIndexSelection fired on every query with a WHERE equality.
#
# This spec runs real EXPLAIN / PROFILE statements over the QUIC wire against
# `geode serve` and walks the same matrix as the zig regression tests
# (tests/test_sonny1335_profile_access_path.zig,
# tests/test_sonny6276_explain_access_path.zig), asserting for every query that
# EXPLAIN and PROFILE agree:
#   no index                      -> LabelScan, no IndexSeek, no index_name
#   index on another property/label, fulltext index on the property
#                                 -> still a scan
#   btree index on label+property -> IndexSeek (EXPLAIN) and IndexSeek with
#                                    index_name = the catalog name (PROFILE),
#                                    for `WHERE n.p = v` and `{p: v}`
#   the same equality under an AND-> scan (executor does not seek)
#   after DROP INDEX              -> scan again
# and that neither output ever carries "heuristic_index", a NodeIndexScan, or
# the U:HeuristicIndexSelection flag. The tenant-bound / RLS (version 1
# payload) arm needs a tenant-scoped session the CLI cannot bind; it stays
# covered by the zig regression test (`zig build test-sonny1335-profile-access-path`).
#
# CANARY: REQ=REQ-SONNY-1335-EXPLAIN-PROFILE-ACCESS-PATH; FEATURE="EXPLAIN"; ASPECT=AccessPath; STATUS=TESTED; TEST=geodetestlab-cli/specs/sonny1335_explain_profile_access_path.yml; OWNER=storage; UPDATED=2026-11-17

version: '1.0'
name: EXPLAIN/PROFILE name the access path the executor takes (SONNY-1335, SONNY-6276)
description: No fabricated heuristic_index; IndexSeek only where a btree/hash catalog index serves a single equality; EXPLAIN and PROFILE agree
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 60000
    cleanup: true
    args:
    - --log-level
    - warn
  client:
    timeout_ms: 30000
    tls_verify: false
    format: json
tests:
- name: create-graph
  description: Create the probe graph
  args:
  - query
  - '-'
  stdin: CREATE GRAPH g_plan_1335
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
  tags:
  - explain
  - profile
  - sonny1335
  - sonny6276
  - setup
- name: seed
  description: Three PlanProbe nodes and one Other node
  args:
  - query
  - '-'
  stdin: "USE GRAPH g_plan_1335; CREATE (:PlanProbe {k: 1, note: 'n1', tag: 't1', body: 'alpha beta'}); CREATE (:PlanProbe {k: 2, note: 'n2', tag: 't2', body: 'gamma delta'}); CREATE (:PlanProbe {k: 3, note: 'n3', tag: 't3', body: 'alpha omega'}); CREATE (:Other {k: 9, note: 'n1'})"
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
  tags:
  - explain
  - profile
  - sonny1335
  - sonny6276
  - setup
- name: noidx-explain-where
  description: "EXPLAIN MATCH (n:PlanProbe) WHERE n.note = 'n1' RETURN n.k: a scan, no IndexSeek"
  args:
  - query
  - '-'
  stdin: USE GRAPH g_plan_1335; EXPLAIN MATCH (n:PlanProbe) WHERE n.note = 'n1' RETURN n.k
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    - '"kind":"LabelScan"'
    stdout_not_contains:
    - heuristic_index
    - HeuristicIndexSelection
    - NodeIndexScan
    - '"kind":"IndexSeek"'
  tags:
  - explain
  - profile
  - sonny1335
  - sonny6276
  - noidx
- name: noidx-profile-where
  description: "PROFILE MATCH (n:PlanProbe) WHERE n.note = 'n1' RETURN n.k: a scan, no index_name"
  args:
  - query
  - '-'
