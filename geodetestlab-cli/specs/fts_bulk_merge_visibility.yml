# Bulk-MERGE Fast Path — Live FTS Visibility Spec
#
# Spec geode-vectorization-and-reranking + A4b §6 / Task 4: closes the
# documented blind spot in fts_index_ops.zig:267-271 ("callers on worker
# threads ... reindex post-bulk on the connection thread instead") —
# quic_connection_handler.zig's bulk-MERGE fast path (executeBulkSimpleMerge,
# reached whenever a program is a single simple `MERGE (n:Label {k: v})`
# pattern — see geode.bulk_ingest.matchSimpleNodeMergeSpecStmt) AND its
# concurrent batch-mode sibling (executeBatchSimpleMerge, reached via a
# `/*+BATCH*/`-prefixed multi-statement program) now run live FTS
# maintenance on the connection thread right after the apply completes and
# all locks are released, so bulk-MERGE'd nodes are searchable IMMEDIATELY —
# no `CALL geode.fts.rebuild` required.
#
# PRE-FIX (RED) evidence, captured against the unfixed binary
# (zig-out/bin/geode, commit ac29593d, before src/server/quic_connection_handler.zig
# was touched by this task): running this spec's `bulk-merge-search-finds-all`
# test returned an EMPTY row set —
#   {"status_class":"00000", ...,"columns":[{"name":"node","type":"NULL"},
#    {"name":"score","type":"NULL"}],"rows":[],...}
# — i.e. `stdout_not_contains: ['"rows":[]']` FAILED (the string WAS present),
# confirming the bulk-MERGE fast path bypassed FTS maintenance exactly as
# documented. Also manually verified against a standalone server: 5
# `MERGE ... ON CREATE SET` statements (the exact shape the fast-path
# detector accepts) followed by `CALL geode.fts.search` returned `"rows":[]`
# pre-fix.
#
# POST-FIX (GREEN): the same 5 MERGEs are all found by the search, and
# `CALL geode.fts.rebuild` still works afterward (idempotent recovery path,
# reports nodes_indexed == 5 since the live hook already indexed them).
#
# Assertions go through stdout_contains / stdout_not_contains / stdout_regex
# on the JSON client output (cli.client.format = json) — the only keys
# lib/checks.py enforces; there is still no exact row_count assertion
# facility, so "all 5 rows present" is asserted via a regex requiring 5
# consecutive `"node":<id>` occurrences inside the rows array. BM25 score
# stability, however, now has a real cross-step assertion facility: the
# sequential test `bulk-merge-score-stability-capture-pin` below uses the
# runner's capture_regex / capture_as / gql_expected.equals_capture step
# fields (added to geodetestlab-cli/geodetestlab/lib/spec.py TestStep and
# lib/executor.py's `_run_sequential_test` gql branch) to capture a BM25
# score from one step and assert an exact match against it from a later
# step, over the real QUIC wire.

version: '1.0'
name: Bulk-MERGE Fast Path Live FTS Visibility
description: Bulk-MERGE fast-path nodes are searchable immediately via CALL geode.fts.search, no rebuild required (Task 4, geode-vectorization-and-reranking)
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 60000
    cleanup: true
    args:
    - --log-level
    - warn
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 30000
    tls_verify: false
    format: json
tests:
# --- idempotent pre-teardown so reruns start clean (CANARY) ---
# Review Finding 2 (Task 4, geode-vectorization-and-reranking A4b §6): the
# spec previously opened with a bare CREATE INDEX (no IF NOT EXISTS) and no
# defensive teardown, so a rerun after a prior partial/failed run left both
# `bulk_vis_idx` and `batch_vis_idx` already present and failed outright.
# Mirrors `kmm_teardown_canary` (knn_metric_mismatch.yml:55-62).
- name: bulk-merge-teardown-canary
  description: Idempotent pre-teardown of bulk_vis_idx so reruns start clean (CANARY)
  args:
  - query
  - '-'
  stdin: DROP INDEX IF EXISTS bulk_vis_idx
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
  tags:
  - fts
  - bulk-merge
  - setup
  - canary
- name: batch-merge-teardown-canary
  description: Idempotent pre-teardown of batch_vis_idx so reruns start clean (CANARY)
  args:
  - query
  - '-'
  stdin: DROP INDEX IF EXISTS batch_vis_idx
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
  tags:
  - fts
  - bulk-merge
  - batch
  - setup
  - canary
# --- bootstrap the fulltext index BEFORE any BulkVisDoc nodes exist ---
- name: bulk-merge-create-fulltext-index
  description: Create a fulltext index on BulkVisDoc.body before any bulk-MERGE writes
  args:
  - query
  - '-'
  stdin: CREATE INDEX bulk_vis_idx FOR (d:BulkVisDoc) ON (d.body) USING fulltext
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
  tags:
  - fts
  - bulk-merge
  - canary
# --- 5 simple-MERGE statements: the exact shape matchSimpleNodeMergeSpec
#     accepts (single label, one scalar merge-key filter, ON CREATE SET of
#     scalar values) so each one runs the connection-thread bulk fast path
#     (executeBulkSimpleMerge), not the general executor. ---
- name: bulk-merge-write-doc-1
  description: Bulk-MERGE fast-path write 1/5
  args:
  - query
  - '-'
  stdin: "MERGE (n:BulkVisDoc {k: 1}) ON CREATE SET n.body = 'searchable text one'"
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
  tags:
  - fts
  - bulk-merge
- name: bulk-merge-write-doc-2
  description: Bulk-MERGE fast-path write 2/5
  args:
  - query
  - '-'
  stdin: "MERGE (n:BulkVisDoc {k: 2}) ON CREATE SET n.body = 'searchable text two'"
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
  tags:
  - fts
  - bulk-merge
- name: bulk-merge-write-doc-3
  description: Bulk-MERGE fast-path write 3/5
  args:
  - query
  - '-'
  stdin: "MERGE (n:BulkVisDoc {k: 3}) ON CREATE SET n.body = 'searchable text three'"
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
  tags:
  - fts
  - bulk-merge
- name: bulk-merge-write-doc-4
  description: Bulk-MERGE fast-path write 4/5
  args:
  - query
  - '-'
  stdin: "MERGE (n:BulkVisDoc {k: 4}) ON CREATE SET n.body = 'searchable text four'"
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
  tags:
  - fts
  - bulk-merge
- name: bulk-merge-write-doc-5
  description: Bulk-MERGE fast-path write 5/5
  args:
  - query
  - '-'
  stdin: "MERGE (n:BulkVisDoc {k: 5}) ON CREATE SET n.body = 'searchable text five'"
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
  tags:
  - fts
  - bulk-merge
# --- the crux: all 5 bulk-MERGE'd nodes are searchable WITHOUT a rebuild ---
- name: bulk-merge-search-finds-all
  description: CALL geode.fts.search finds all 5 bulk-MERGE'd nodes immediately (no rebuild)
  args:
  - query
  - '-'
  stdin: CALL geode.fts.search('bulk_vis_idx', 'searchable')
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    - '"name":"node"'
    - '"name":"score"'
    stdout_not_contains:
    - '"rows":[]'
    stdout_regex:
    # 5 distinct (node, score) row objects present in the rows array — proves
    # every bulk-MERGE'd node was indexed live, not just the first/last one.
    - (?:\{"node":\d+,"score":[0-9.]+\}\s*,?\s*){5}
  tags:
  - fts
  - bulk-merge
# --- review Finding 1 pin: re-running the SAME 5 simple-MERGE statements
#     (idempotent re-MERGE against already-indexed nodes, no property
#     change) must NOT duplicate FTS postings. Before the fix, the
#     unconditional `fts_should_maintain = true` on this call site would
#     re-append each doc's postings on every re-run; the search below would
#     still return exactly 5 rows (duplicate postings don't fabricate a new
#     doc_id) but doubled term-frequency would be observable via BM25 score
#     drift — the unit regression in tests/test_fts_bulk_merge_maintenance.zig
#     pins that score-stability assertion directly. Here we pin the
#     row-count invariant end-to-end through the real QUIC wire path. ---
- name: bulk-merge-remerge-doc-1
  description: Idempotent re-MERGE 1/5 (same key, no property change) — review Finding 1 regression
  args:
  - query
  - '-'
  stdin: "MERGE (n:BulkVisDoc {k: 1}) ON CREATE SET n.body = 'searchable text one'"
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
  tags:
  - fts
  - bulk-merge
- name: bulk-merge-remerge-doc-2
  description: Idempotent re-MERGE 2/5 (same key, no property change) — review Finding 1 regression
  args:
  - query
  - '-'
  stdin: "MERGE (n:BulkVisDoc {k: 2}) ON CREATE SET n.body = 'searchable text two'"
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
  tags:
  - fts
  - bulk-merge
- name: bulk-merge-remerge-doc-3
  description: Idempotent re-MERGE 3/5 (same key, no property change) — review Finding 1 regression
  args:
  - query
  - '-'
  stdin: "MERGE (n:BulkVisDoc {k: 3}) ON CREATE SET n.body = 'searchable text three'"
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
  tags:
  - fts
  - bulk-merge
- name: bulk-merge-remerge-doc-4
  description: Idempotent re-MERGE 4/5 (same key, no property change) — review Finding 1 regression
  args:
  - query
  - '-'
  stdin: "MERGE (n:BulkVisDoc {k: 4}) ON CREATE SET n.body = 'searchable text four'"
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
  tags:
  - fts
  - bulk-merge
- name: bulk-merge-remerge-doc-5
  description: Idempotent re-MERGE 5/5 (same key, no property change) — review Finding 1 regression
  args:
  - query
  - '-'
  stdin: "MERGE (n:BulkVisDoc {k: 5}) ON CREATE SET n.body = 'searchable text five'"
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
  tags:
  - fts
  - bulk-merge
- name: bulk-merge-search-still-finds-exactly-five
  description: After idempotent re-MERGE, CALL geode.fts.search still returns exactly 5 rows (no duplicate postings) — review Finding 1 regression
  args:
  - query
  - '-'
  stdin: CALL geode.fts.search('bulk_vis_idx', 'searchable')
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    stdout_not_contains:
    - '"rows":[]'
    stdout_regex:
    # NOTE: like `bulk-merge-search-finds-all` above, `{5}` asserts "at least
    # 5 consecutive row objects present" (the harness still has no exact
    # row-count/length assertion facility). This is a coarse E2E smoke check
    # that the docs are still visible and the search still returns rows at
    # all after the re-merge; it would NOT by itself catch a 10-row
    # duplicate. The Zig unit regression in
    # tests/test_fts_bulk_merge_maintenance.zig pins BM25 score-stability
    # directly, and — as of the capture_regex/capture_as/
    # gql_expected.equals_capture step-assertion facility added to
    # geodetestlab-cli/geodetestlab/lib/{spec,executor}.py — the sequential
    # test `bulk-merge-score-stability-capture-pin` below pins the same
    # score-stability property end-to-end over the real QUIC wire, closing
    # the "no row_count/score assertion facility" gap noted in the file
    # header for BM25 scores specifically.
    - (?:\{"node":\d+,"score":[0-9.]+\}\s*,?\s*){5}
  tags:
  - fts
  - bulk-merge
  - canary
# --- recovery path still works: CALL geode.fts.rebuild reports all 5 nodes
#     (idempotent re-backfill on top of the already-live-maintained index) ---
- name: bulk-merge-rebuild-reports-all
  description: CALL geode.fts.rebuild reports nodes_indexed == 5 (recovery/backfill path still functions)
  args:
  - query
  - '-'
  stdin: CALL geode.fts.rebuild('bulk_vis_idx')
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    - '"index":"bulk_vis_idx"'
    - '"nodes_indexed":5'
  tags:
  - fts
  - bulk-merge
# --- BM25 score-stability pin (harness capture/compare facility): proves
#     over the real QUIC wire — not just via the Zig unit test
#     tests/test_fts_bulk_merge_maintenance.zig — that idempotent re-MERGE
#     of an already-indexed bulk-MERGE'd document does NOT inflate its BM25
#     score (MergeResult.wrote gating on the handler side; landed
#     2026-08-28). Uses the runner's new capture_regex / capture_as /
#     gql_expected.equals_capture step assertions
#     (geodetestlab-cli/geodetestlab/lib/spec.py TestStep,
#     geodetestlab-cli/geodetestlab/lib/executor.py
#     _run_sequential_test's gql branch) — this is the last untested link
#     of the Task-4 fix chain. Runs AFTER bulk-merge-rebuild-reports-all so
#     this test's extra BulkVisDoc node doesn't perturb that test's
#     nodes_indexed == 5 assertion. ---
- name: bulk-merge-score-stability-capture-pin
  description: Idempotent re-MERGE (3x) of a uniquely-termed bulk-MERGE'd doc must not change its BM25 score
  type: sequential
  steps:
  - type: gql
    query: "MERGE (n:BulkVisDoc {k: 100}) ON CREATE SET n.body = 'zzcapturestabilityprobe unique score pin document'"
    expect:
      status_class: '00000'
  - type: gql
    query: CALL geode.fts.search('bulk_vis_idx', 'zzcapturestabilityprobe')
    capture_regex: '"score":([0-9.]+)'
    capture_as: bmv_ref_score
    expect:
      status_class: '00000'
      stdout_not_contains:
      - '"rows":[]'
  - type: gql
    query: "MERGE (n:BulkVisDoc {k: 100}) ON CREATE SET n.body = 'zzcapturestabilityprobe unique score pin document'"
    expect:
      status_class: '00000'
  - type: gql
    query: "MERGE (n:BulkVisDoc {k: 100}) ON CREATE SET n.body = 'zzcapturestabilityprobe unique score pin document'"
    expect:
      status_class: '00000'
  - type: gql
    query: "MERGE (n:BulkVisDoc {k: 100}) ON CREATE SET n.body = 'zzcapturestabilityprobe unique score pin document'"
    expect:
      status_class: '00000'
  - type: gql
    query: CALL geode.fts.search('bulk_vis_idx', 'zzcapturestabilityprobe')
    capture_regex: '"score":([0-9.]+)'
    expect:
      status_class: '00000'
      stdout_not_contains:
      - '"rows":[]'
      equals_capture: bmv_ref_score
  tags:
  - fts
  - bulk-merge
  - capture
# --- batch fast path: /*+BATCH*/-prefixed multi-statement MERGE program
#     (executeBatchSimpleMerge — the concurrent per-statement sibling of the
#     single-MERGE fast path above). Live FTS maintenance must cover this
#     call site too, not just the single-statement one. ---
- name: batch-merge-create-fulltext-index
  description: Create a fulltext index on BatchVisDoc.body before any batch-MERGE writes
  args:
  - query
  - '-'
  stdin: CREATE INDEX batch_vis_idx FOR (d:BatchVisDoc) ON (d.body) USING fulltext
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
  tags:
  - fts
  - bulk-merge
  - batch
- name: batch-merge-write-both
  description: Batch-MERGE fast path writes 2 BatchVisDoc nodes in one /*+BATCH*/ program
  args:
  - query
  - '-'
  stdin: |
    /*+BATCH*/
    MERGE (n:BatchVisDoc {k: 1}) ON CREATE SET n.body = 'batchable text one';
    MERGE (n:BatchVisDoc {k: 2}) ON CREATE SET n.body = 'batchable text two';
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
  tags:
  - fts
  - bulk-merge
  - batch
- name: batch-merge-search-finds-both
  description: CALL geode.fts.search finds both batch-MERGE'd nodes immediately (no rebuild)
  args:
  - query
  - '-'
  stdin: CALL geode.fts.search('batch_vis_idx', 'batchable')
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    stdout_not_contains:
    - '"rows":[]'
    stdout_regex:
    - (?:\{"node":\d+,"score":[0-9.]+\}\s*,?\s*){2}
  tags:
  - fts
  - bulk-merge
  - batch
- name: batch-merge-drop-index-teardown
  description: DROP INDEX cleans up batch_vis_idx (idempotent teardown)
  args:
  - query
  - '-'
  stdin: DROP INDEX IF EXISTS batch_vis_idx
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
  tags:
  - fts
  - bulk-merge
  - batch
# --- idempotent teardown ---
- name: bulk-merge-drop-index-teardown
  description: DROP INDEX cleans up bulk_vis_idx (idempotent teardown)
  args:
  - query
  - '-'
  stdin: DROP INDEX IF EXISTS bulk_vis_idx
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
  tags:
  - fts
  - bulk-merge
  - canary
