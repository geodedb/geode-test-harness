version: '1.0'
name: Regression — CREATE INDEX on populated label returns promptly, no self-deadlock (geode 4a1efca4)
description: |
  Pins the contract that CREATE INDEX on a label that ALREADY HAS nodes
  returns promptly — no hang, no wedge — the server stays alive, and
  follow-up statements succeed. This targets geode commit 4a1efca4
  ("fix(index): remove eager ordered-index build from CREATE INDEX
  (self-deadlock)").

  Root cause being regression-tested: the eager H3-P2/GAP-0064
  `adapter.createOrderedIndex(...)` call inside the CREATE INDEX executor
  ran under the per-graph EXCLUSIVE write lock already held for the
  statement, then re-acquired the SAME rwlock SHARED on the same thread to
  scan existing nodes of the label — an exclusive-then-shared
  self-deadlock. It only reached the wedge with >=1 node of the label
  already present to scan, which is why a populated-label CREATE INDEX
  hung for ~30s and cascaded "Server died" to every subsequent test, while
  a 0-node/empty-label CREATE INDEX (nothing to scan) passed. The fix
  drops the eager ordered-tree build entirely; `orderedScanFastPath`
  builds it lazily/in the background on first ORDER BY instead.

  Scenario (order matters — nodes BEFORE index is the deadlock trigger):
    1. Seed exactly 200 RG14_N nodes (k: 'k<i>') via a script-generated
       CREATE batch — UNWIND/FOREACH range-seeding is not a supported
       clause on this build per prior probes for sibling specs.
    2. KEY: CREATE INDEX on RG14_N.k (label already populated) must return
       exit 0 within a 20s timeout — the exact self-deadlock trigger
       ordering from the bug report.
    3. KEY: MATCH (n:RG14_N) RETURN count(n) immediately after must return
       200 within a 20s timeout. This is the liveness proof: a wedged
       server (live 4a1efca4 regression) would time out here, not just on
       the CREATE INDEX statement itself.
    4. A second DDL statement (CREATE CONSTRAINT, then a second CREATE
       INDEX on a different property) must also succeed — confirms the
       server is not merely alive but still able to take the write lock
       for further DDL.
    5. SHOW INDEXES must list the index; DROP INDEX must succeed; count
       must still be 200 afterward.
    6. Control: CREATE INDEX on a FRESH label (RG14_Empty, 0 nodes) must
       also return exit 0 — confirms the non-triggering (empty-label)
       path still works, isolating the trigger to "nodes present before
       CREATE INDEX".

  Probed against a scratch server (geode serve --listen 127.0.0.1:4456
  --data-dir /tmp/probe-r14, GEODE_ADMIN_PASSWORD set on first boot)
  running geode v0.8.0-16-g600b235e (built after 4a1efca4): seeded 200
  RG14_N nodes (~0.5s), CREATE INDEX rg14_n_k_idx FOR (n:RG14_N) ON (n.k)
  on the populated label returned in ~0.97s (no hang), the immediate
  follow-up count(n) returned 200 in ~0.77s, CREATE CONSTRAINT ... REQUIRE
  ... IS UNIQUE and a second CREATE INDEX both succeeded, SHOW INDEXES
  listed both the created index and the label's auto id index, DROP INDEX
  succeeded, count remained 200, and CREATE INDEX on a fresh 0-node label
  also succeeded promptly. No live regression was observed on this build.

  CANARY: REQ=REQ-INDEX-CREATE-POPULATED-NO-WEDGE-001; FEATURE="IndexDDL"; ASPECT=CreateIndexOnPopulatedLabel; STATUS=TESTED; TEST=geodetestlab/specs/regression_create_index_with_nodes_no_wedge.yml; OWNER=qa; UPDATED=2026-07-09

cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 30000
    cleanup: true
    args:
    - --log-level
    - info

  client:
    timeout_ms: 30000
    format: json

invariants:
- type: server_running

