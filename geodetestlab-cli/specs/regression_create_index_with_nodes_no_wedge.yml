- name: create-index-on-populated
  description: |
    KEY ASSERTION — CREATE INDEX on RG14_N.k, where RG14_N already has
    200 nodes, must return exit 0 promptly. This is the exact ordering
    (nodes present BEFORE CREATE INDEX) that self-deadlocked under geode
    4a1efca4: the eager ordered-index build re-acquired the per-graph
    rwlock SHARED while the statement already held it EXCLUSIVE, on the
    same thread, only when there was >=1 node of the label to scan. A 20s
    timeout enforces the prompt-response contract: a wedge must fail as a
    timeout, not hang forever.
  query: "CREATE INDEX rg14_n_k_idx FOR (n:RG14_N) ON (n.k)"
  timeout_ms: 20000
  expected:
    exit_code: 0
  tags: [regression, index, ddl, key-assertion]

- name: server-alive-followup
  description: |
    KEY ASSERTION — the liveness proof. MATCH (n:RG14_N) RETURN
    count(n) run IMMEDIATELY after CREATE INDEX on the populated label
    must return 200 within a 20s timeout. Under a live 4a1efca4
    self-deadlock, the CREATE INDEX statement itself hangs holding the
    per-graph write lock, so this follow-up read would also wedge/time
    out (or every subsequent test in the suite would cascade-fail with
    "Server died") rather than the CREATE INDEX call failing outright.
  query: "MATCH (n:RG14_N) RETURN count(n)"
  timeout_ms: 20000
  expected:
    exit_code: 0
    stdout_contains:
    - '"count(n)":200'
  tags: [regression, index, key-assertion]

- name: constraint-after-index
  description: |
    A second DDL statement (CREATE CONSTRAINT) after CREATE INDEX on the
    populated label must also succeed — confirms the server is not just
    alive for reads but still able to acquire the write lock for further
    DDL (i.e. the write lock was released cleanly and is not left in a
    partially-held state by the earlier CREATE INDEX).
  query: "CREATE CONSTRAINT rg14_n_id_unique FOR (n:RG14_N) REQUIRE n.id IS UNIQUE"
  timeout_ms: 20000
  expected:
    exit_code: 0
  tags: [regression, index, ddl]

- name: second-index-different-property
  description: |
    A second CREATE INDEX, on a different property of the SAME populated
    label, must also succeed promptly — confirms the fix generalizes
    beyond a single CREATE INDEX call on the label.
  query: "CREATE INDEX rg14_n_k2_idx FOR (n:RG14_N) ON (n.k2)"
  timeout_ms: 20000
  expected:
    exit_code: 0
  tags: [regression, index, ddl]

- name: show-index-lists-it
  description: |
    SHOW INDEXES must list the rg14_n_k_idx index created on the
    populated label (probed exact form on this build: SHOW INDEXES,
    plural — SHOW INDEX singular is a parse error on this build).
  query: "SHOW INDEXES"
  timeout_ms: 20000
  expected:
    exit_code: 0
    stdout_contains:
    - rg14_n_k_idx
  tags: [regression, index]

- name: drop-index-succeeds
  description: |
    DROP INDEX on the index created on the populated label must succeed.
  query: "DROP INDEX rg14_n_k_idx"
  timeout_ms: 20000
  expected:
    exit_code: 0
  tags: [regression, index, ddl]

- name: count-still-200-after-drop
  description: |
    Node count must still be 200 after DROP INDEX — confirms DROP INDEX
    only removed the index metadata, not the underlying data.
  query: "MATCH (n:RG14_N) RETURN count(n)"
  timeout_ms: 20000
  expected:
    exit_code: 0
    stdout_contains:
    - '"count(n)":200'
  tags: [regression, index]

- name: create-index-empty-label
  description: |
    CONTROL — CREATE INDEX on a FRESH label (RG14_Empty) with 0 nodes
    must also return exit 0 promptly. This is the non-triggering path per
    the 4a1efca4 root-cause analysis: the eager ordered-index build only
    reached the self-deadlock when there was >=1 node of the label to
    scan, so a 0-node CREATE INDEX passed even under the live regression.
    Included so this spec exercises BOTH sides of the trigger condition,
    not just the populated-label path.
  query: "CREATE INDEX rg14_empty_idx FOR (n:RG14_Empty) ON (n.k)"
  timeout_ms: 20000
  expected:
    exit_code: 0
  tags: [regression, index, ddl, control]

