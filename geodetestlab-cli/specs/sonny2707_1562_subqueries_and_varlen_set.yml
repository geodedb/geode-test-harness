# SONNY-2707: `SET` through a variable-length pattern was silently ignored; `COUNT { }` over an unbound relationship
# counted left nodes; a variable-length `COUNT { }` followed outgoing edges only. SONNY-1562: COUNT{} / EXISTS{} scanned
# resident-only nodes, so a COLD store (after a restart) answered 0 / false. ISO/IEC 39075:2024 16.7 / 19.4.
# The cold-store half restarts the server on the same data directory so nothing is resident.
# Fixture: four :Q {k, f?}, four :X {k}, four :Y {k}, eight :Z {k, g, r}:
#   (Yk)-[:R]->(Qk)-[:R {w: k}]->(Xk); (Q0)-[:S]->(Q1) and a self loop (Q3)-[:S]->(Q3).
# V chain (SET targets): :V k=0..3 with (V0)-[:R]->(V1)-[:R]->(V2)-[:R]->(V3), plus an isolated V4.
version: '1.0'
name: SONNY-2707/1562 COUNT{}/EXISTS{} direction and cold store; SET through a variable-length pattern
description: subquery directions, multi-hop counts, variable-length SET, cold-store subqueries
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 60000
    cleanup: false
    args:
    - --log-level
    - warn
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 60000
    tls_verify: false
    format: json
tests:
- name: setup-fixture
  description: Create the Q/X/Y/Z fixture graph
  args:
  - query
  - --batch
  stdin: |
    CREATE (:Y {k: 0})-[:R]->(:Q {k: 0, f: 1})-[:R {w: 0}]->(:X {k: 0})
    CREATE (:Y {k: 1})-[:R]->(:Q {k: 1, f: 1})-[:R {w: 1}]->(:X {k: 1})
    CREATE (:Y {k: 2})-[:R]->(:Q {k: 2})-[:R {w: 2}]->(:X {k: 2})
    CREATE (:Y {k: 3})-[:R]->(:Q {k: 3})-[:R {w: 3}]->(:X {k: 3})
    CREATE (:Z {k: 0, g: 0, r: 7})
    CREATE (:Z {k: 1, g: 0, r: 6})
    CREATE (:Z {k: 2, g: 0, r: 5})
    CREATE (:Z {k: 3, g: 0, r: 4})
    CREATE (:Z {k: 4, g: 1, r: 3})
    CREATE (:Z {k: 5, g: 1, r: 2})
    CREATE (:Z {k: 6, g: 1, r: 1})
    CREATE (:Z {k: 7, g: 1, r: 0})
    MATCH (a:Q {k: 0}), (b:Q {k: 1}) CREATE (a)-[:S]->(b)
    MATCH (a:Q {k: 3}) CREATE (a)-[:S]->(a)
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    stdout_not_contains:
    - '"error"'
    - '"status_class":"4'
    - '"status_class":"2'
  tags:
  - setup
- name: setup-v
  description: 'Setup: setup-v'
  args:
  - query
  - --batch
  stdin: |
    CREATE (:V {k: 0}), (:V {k: 1}), (:V {k: 2}), (:V {k: 3}), (:V {k: 4})
    MATCH (a:V {k: 0}), (b:V {k: 1}) CREATE (a)-[:R]->(b)
    MATCH (a:V {k: 1}), (b:V {k: 2}) CREATE (a)-[:R]->(b)
    MATCH (a:V {k: 2}), (b:V {k: 3}) CREATE (a)-[:R]->(b)
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    stdout_not_contains:
    - '"error"'
    - '"status_class":"4'
    - '"status_class":"2'
  tags:
  - setup
- name: warm-count-in-S
  description: COUNT over incoming :S edges of Q counts the targets, not the left nodes
  args:
  - query
  - '-'
  stdin: |
    RETURN COUNT { (a:Q)<-[:S]-(b) } AS c
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    - '{"c":2}'
    stdout_regex:
    - '"rows":\[(\{[^{}]*\},?){1}\]'
  tags:
  - regression
- name: warm-count-out-S
