version: '1.0'
name: Geode Query File Flag Edge Cases and Error Handling
description: Advanced edge cases, error handling, and boundary tests for --file flag
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    startup_timeout_ms: 30000
    args:
    - --disable-auth
    - --insecure
    - --log-level
    - error
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
secrets: {}
invariants:
- type: server_running
fuzz:
  enabled: false
tests:
- name: setup-edge-case-graph
  description: Create graph for edge case tests
  args:
  - query
  - --insecure
  - CREATE GRAPH IF NOT EXISTS edge_case_graph
  expect:
    exit_code: 0
  tags:
  - setup
- name: file-flag-single-character
  description: Test file with single character (should error - no valid statements)
  setup:
    files:
    - path: /tmp/geode_test_single_char.gql
      content: a
  args:
  - query
  - --insecure
  - --file
  - /tmp/geode_test_single_char.gql
  expect:
    exit_code: 2
    stderr_contains:
    - 'Error: File contains no valid GQL statements'
  tags:
  - boundary
  - error
- name: file-flag-path-with-spaces
  description: Test file path containing spaces
  setup:
    files:
    - path: /tmp/geode test with spaces.gql
      content: "USE GRAPH edge_case_graph;\nCREATE (n:PathSpace {id: 1});\n"
  args:
  - query
  - --insecure
  - --file
  - /tmp/geode test with spaces.gql
  expect:
    exit_code: 0
  cleanup:
  - - query
    - --insecure
    - USE GRAPH edge_case_graph; MATCH (n:PathSpace) DELETE n
  - - rm
    - -f
    - /tmp/geode test with spaces.gql
  tags:
  - path
  - edge-case
- name: file-flag-path-with-special-chars
  description: Test file path with special characters
  setup:
    files:
    - path: /tmp/geode_test-file@2024#1.gql
      content: "USE GRAPH edge_case_graph;\nCREATE (n:SpecialPath {id: 2});\n"
  args:
  - query
  - --insecure
  - --file
  - /tmp/geode_test-file@2024#1.gql
  expect:
    exit_code: 0
  cleanup:
  - - query
    - --insecure
    - USE GRAPH edge_case_graph; MATCH (n:SpecialPath) DELETE n
  - - rm
    - -f
    - /tmp/geode_test-file@2024#1.gql
  tags:
  - path
  - edge-case
- name: file-flag-very-long-path
  description: Test with very long file path (near system limit)
  args:
  - --help
  tags:
  - path
  - boundary
- name: file-flag-only-whitespace-and-comments
  description: Test file containing only whitespace and comments
  setup:
    files:
    - path: /tmp/geode_test_only_comments.gql
      content: "-- Comment 1\n# Comment 2\n\n\n-- Comment 3\n\n# Comment 4\n"
  args:
  - query
  - --insecure
  - --file
  - /tmp/geode_test_only_comments.gql
  expect:
    exit_code: 2
    stderr_contains:
    - 'Error: File contains no valid GQL statements'
  tags:
  - content
  - edge-case
  - error
- name: file-flag-multiple-semicolons
  description: Test statement with multiple trailing semicolons
  setup:
    files:
    - path: /tmp/geode_test_multi_semi.gql
      content: "USE GRAPH edge_case_graph;;;\nCREATE (n:MultiSemi {id: 21});;;\n"
  args:
  - query
  - --insecure
  - --file
  - /tmp/geode_test_multi_semi.gql
  expect:
    exit_code: 0
  verify:
  - args:
    - query
    - --insecure
    - USE GRAPH edge_case_graph; MATCH (n:MultiSemi) RETURN count(n) AS cnt
    expect:
      stdout_contains:
      - '1'
  cleanup:
  - - query
    - --insecure
    - USE GRAPH edge_case_graph; MATCH (n:MultiSemi) DELETE n
  tags:
  - content
  - semicolon
- name: file-flag-tab-characters
  description: Test file with tab characters for indentation
  setup:
    files:
    - path: /tmp/geode_test_tabs.gql
      content: "USE GRAPH edge_case_graph;\n\tCREATE (n:TabTest {id: 30});\n"
  args:
  - query
  - --insecure
  - --file
  - /tmp/geode_test_tabs.gql
  expect:
    exit_code: 0
  verify:
  - args:
    - query
    - --insecure
    - USE GRAPH edge_case_graph; MATCH (n:TabTest) RETURN count(n) AS cnt
    expect:
      stdout_contains:
      - '1'
  cleanup:
  - - query
    - --insecure
    - USE GRAPH edge_case_graph; MATCH (n:TabTest) DELETE n
  tags:
  - content
  - whitespace
- name: file-flag-mixed-tab-space-indentation
  description: Test file with mixed tabs and spaces
  setup:
    files:
    - path: /tmp/geode_test_mixed_indent.gql
      content: "USE GRAPH edge_case_graph;\n  \tCREATE (n:MixedIndent {id: 31});\n"
  args:
  - query
  - --insecure
  - --file
  - /tmp/geode_test_mixed_indent.gql
  expect:
    exit_code: 0
  verify:
  - args:
    - query
    - --insecure
    - USE GRAPH edge_case_graph; MATCH (n:MixedIndent) RETURN count(n) AS cnt
    expect:
      stdout_contains:
      - '1'
  cleanup:
  - - query
    - --insecure
    - USE GRAPH edge_case_graph; MATCH (n:MixedIndent) DELETE n
  tags:
  - content
  - whitespace
- name: file-flag-null-bytes
  description: Test file containing null bytes (should handle gracefully or error)
  args:
  - --help
  tags:
  - content
  - binary
- name: file-flag-very-long-line
  description: Test file with single very long line (10KB single statement)
  args:
  - --help
  tags:
  - content
  - boundary
- name: file-flag-syntax-error-in-file
  description: Test file containing syntax error
  setup:
    files:
    - path: /tmp/geode_test_syntax_error.gql
      content: "USE GRAPH edge_case_graph;\nCREATE (n:SyntaxError {id: 40 INVALID SYNTAX});\n"
  args:
  - query
  - --insecure
  - --file
  - /tmp/geode_test_syntax_error.gql
  expect:
    exit_code: 0
  tags:
  - error
  - syntax
- name: file-flag-partial-statement
  description: Test file with incomplete statement at end
  setup:
    files:
    - path: /tmp/geode_test_partial.gql
      content: "USE GRAPH edge_case_graph;\nCREATE (n:Complete {id: 50});\nCREATE (n:Incomplete {id:\n"
  args:
  - query
  - --insecure
  - --file
  - /tmp/geode_test_partial.gql
  expect:
    exit_code: 0
  verify:
  - args:
    - query
    - --insecure
    - 'USE GRAPH edge_case_graph; MATCH (n:Complete {id: 50}) RETURN count(n) AS cnt'
    expect:
      stdout_contains:
      - '1'
  cleanup:
  - - query
    - --insecure
    - USE GRAPH edge_case_graph; MATCH (n:Complete) DELETE n
  tags:
  - error
  - incomplete
- name: file-flag-invalid-utf8
  description: Test file with invalid UTF-8 sequences
  args:
  - --help
  tags:
  - error
  - encoding
- name: file-flag-concurrent-execution
  description: Test multiple concurrent file executions (same file)
  args:
  - --help
  tags:
  - concurrent
  - stress
- name: file-flag-file-modified-during-execution
  description: Test file modification during execution
  args:
  - --help
  tags:
  - concurrent
  - race
- name: file-flag-over-size-cap-build-fixture
  description: |
    Materialise a REAL 17 MiB file, comfortably over the `1 << 24` cap at
    src/cli/main.zig:1325-1327. Replaces a placeholder that ran `--help` and
    therefore asserted nothing about the cap at all.
  type: bash
  command: |
    set -euo pipefail
    python3 - <<'PY'
    unit = b"-- padding comment line to clear the 16 MiB file cap\n"
    target = (1 << 24) + (1 << 20)
    with open("/tmp/geode_over_size_cap.gql", "wb") as f:
        written = 0
        while written < target:
            f.write(unit)
            written += len(unit)
        f.write(b"RETURN 1 AS x;\n")
    PY
    test "$(wc -c < /tmp/geode_over_size_cap.gql)" -gt 16777216
    echo OVER_SIZE_CAP_FIXTURE_READY
  expected:
    exit_code: 0
    stdout_contains:
    - OVER_SIZE_CAP_FIXTURE_READY
  tags:
  - setup
  - resource
  - boundary
- name: file-flag-over-size-cap-is-actionable
  description: |
    A file over the 16 MiB cap must be refused with a message an operator can
    act on: the file's actual size, the limit, and a remedy.

    RED at geode e46ece27 — the refusal is the bare string "Error: File too
    large" (src/cli/main.zig:1325-1327 compares against an unnamed `1 << 24`).
    The exit code (2 = ExitCode.usage_error) is already correct and is pinned
    here so a reword cannot drift it. The check fires while reading the file,
    before any connection is opened.
  type: bash
  command: |
    ${GEODE_BINARY} query --server "${GEODE_SERVER_ADDRESS}" ${GEODE_CLIENT_TLS} \
      --file /tmp/geode_over_size_cap.gql
  expected:
    exit_code: 2
    stderr_contains:
    - 16 MiB
    - '17825823'
    - split
  tags:
  - resource
  - boundary
  - error
  - regression
- name: file-flag-size-cap-is-documented
  description: |
    The cap must be discoverable. RED at geode e46ece27 — the --file help line
    (src/cli/main.zig:259) says only "Execute GQL statements from a file
    (supports ~)" and never mentions a maximum size, so a user who hits the
    limit has nowhere to look it up.

    `geode query --help` writes to stderr (std.debug.print) and exits 0;
    asserted accordingly.
  type: bash
  command: |
    ${GEODE_BINARY} query --help
  expected:
    exit_code: 0
    stderr_contains:
    - --file
    - 16 MiB
  tags:
  - resource
  - boundary
  - docs
- name: file-flag-directory-instead-of-file
  description: Test error when path is a directory, not a file
  args:
  - query
  - --insecure
  - --file
  - /tmp
  expect:
    exit_code: 2
    stderr_contains:
    - 'Error: Cannot read file: IsDir'
  tags:
  - error
  - path
- name: file-flag-device-file
  description: Test error when attempting to read device file
  args:
  - query
  - --insecure
  - --file
  - /dev/null
  expect:
    exit_code: 2
  tags:
  - error
  - device
- name: file-flag-pipe-file
  description: Test reading from named pipe (FIFO)
  args:
  - --help
  tags:
  - edge-case
  - pipe
- name: file-flag-unclosed-transaction
  description: Test file with BEGIN but no COMMIT
  setup:
    files:
    - path: /tmp/geode_test_unclosed_txn.gql
      content: "USE GRAPH edge_case_graph;\nBEGIN;\nCREATE (n:UnclosedTxn {id: 60});\n"
  args:
  - query
  - --insecure
  - --file
  - /tmp/geode_test_unclosed_txn.gql
  expect:
    exit_code: 0
  verify:
  - args:
    - query
    - --insecure
    - USE GRAPH edge_case_graph; MATCH (n:UnclosedTxn) RETURN count(n) AS cnt
    expect:
      stdout_contains:
      - '1'
  cleanup:
  - - query
    - --insecure
    - USE GRAPH edge_case_graph; MATCH (n:UnclosedTxn) DELETE n
  tags:
  - transaction
  - edge-case
- name: file-flag-rollback-in-file
  description: Test file with ROLLBACK statement
  setup:
    files:
    - path: /tmp/geode_test_rollback.gql
      content: "USE GRAPH edge_case_graph;\nBEGIN;\nCREATE (n:RolledBack {id: 70});\nROLLBACK;\n"
  args:
  - query
  - --insecure
  - --file
  - /tmp/geode_test_rollback.gql
  expect:
    exit_code: 0
  verify:
  - args:
    - query
    - --insecure
    - USE GRAPH edge_case_graph; MATCH (n:RolledBack) RETURN count(n) AS cnt
    expect:
      stdout_contains:
      - '0'
  tags:
  - transaction
  - rollback
- name: file-flag-nested-transactions
  description: Test file with nested BEGIN statements (should error or handle)
  setup:
    files:
    - path: /tmp/geode_test_nested_txn.gql
      content: "USE GRAPH edge_case_graph;\nBEGIN;\nCREATE (n:OuterTxn {id: 80});\nBEGIN;\nCREATE (m:InnerTxn {id: 81});\nCOMMIT;\nCOMMIT;\n"
  args:
  - query
  - --insecure
  - --file
  - /tmp/geode_test_nested_txn.gql
  expect:
    exit_code:
    - 0
    - 1
  cleanup:
  - - query
    - --insecure
    - USE GRAPH edge_case_graph; MATCH (n:OuterTxn) DELETE n
  - - query
    - --insecure
    - USE GRAPH edge_case_graph; MATCH (n:InnerTxn) DELETE n
  tags:
  - transaction
  - nested
- name: file-flag-idempotent-execution
  description: Test file can be executed multiple times (with MERGE)
  setup:
    files:
    - path: /tmp/geode_test_idempotent.gql
      content: "USE GRAPH edge_case_graph;\nMERGE (n:IdempotentTest {id: 100}) ON CREATE SET n.created = true;\n"
  args:
  - query
  - --insecure
  - --file
  - /tmp/geode_test_idempotent.gql
  expect:
    exit_code: 0
  verify:
  - args:
    - query
    - --insecure
    - --file
    - /tmp/geode_test_idempotent.gql
    expect:
      exit_code: 0
  - args:
    - query
    - --insecure
    - USE GRAPH edge_case_graph; MATCH (n:IdempotentTest) RETURN count(n) AS cnt
    expect:
      stdout_contains:
      - '1'
  cleanup:
  - - query
    - --insecure
    - USE GRAPH edge_case_graph; MATCH (n:IdempotentTest) DELETE n
  tags:
  - idempotent
  - merge
- name: file-flag-complex-cypher
  description: Test file with complex nested queries and patterns
  setup:
    files:
    - path: /tmp/geode_test_complex.gql
      content: "USE GRAPH edge_case_graph;\nCREATE (a:Complex {id: 200, type: 'A'});\nCREATE (b:Complex {id: 201, type: 'B'});\nCREATE (c:Complex {id: 202, type: 'C'});\nMATCH (x:Complex {type: 'A'}), (y:Complex {type: 'B'}), (z:Complex {type: 'C'})\nCREATE (x)-[:LINK]->(y)-[:LINK]->(z);\nMATCH (start:Complex {type: 'A'})-[:LINK*]->(end:Complex)\nRETURN count(end) AS reachable;\n"
  args:
  - query
  - --insecure
  - --file
  - /tmp/geode_test_complex.gql
  expect:
    exit_code: 0
  cleanup:
  - - query
    - --insecure
    - USE GRAPH edge_case_graph; MATCH (n:Complex) DETACH DELETE n
  tags:
  - complex
  - pattern
- name: file-flag-with-subqueries
  description: Test file containing subqueries
  args:
  - --help
  tags:
  - complex
  - subquery
- name: cleanup-edge-case-graph
  description: Drop edge case test graph
  args:
  - query
  - --insecure
  - DROP GRAPH IF EXISTS edge_case_graph
  expect:
    exit_code: 0
  tags:
  - cleanup
- name: cleanup-all-temp-files
  description: Remove all temporary test files
  args:
  - --help
  cleanup:
  - - bash
    - -c
    - rm -f /tmp/geode_test_*.gql
  tags:
  - cleanup
