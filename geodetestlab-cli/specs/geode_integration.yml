version: "1.0"
name: "Geode Integration Tests"
description: "Integration tests demonstrating geodetestlab working with Geode"

cli:
  binary: "./zig-out/bin/geode"

tests:
  # Basic command execution tests
  - name: "version-check"
    description: "Check that Geode binary executes and returns expected exit code"
    args: ["--help"]
    expect:
      exit_code: 0

  - name: "query-command-exists"
    description: "Verify query subcommand exists"
    args: ["query", "--help"]
    expect:
      exit_code: 0

  - name: "shell-command-exists"
    description: "Verify shell subcommand exists"
    args: ["shell", "--help"]
    expect:
      exit_code: 0

  - name: "serve-command-exists"
    description: "Verify serve subcommand exists"
    args: ["serve", "--help"]
    expect:
      exit_code: 0

  # Error handling tests
  - name: "invalid-command"
    description: "Test that invalid commands return usage error (exit code 2)"
    args: ["nonexistent-command"]
    expect:
      exit_code: 2

  - name: "invalid-option"
    description: "Test that invalid options are handled"
    args: ["--invalid-option"]
    expect:
      exit_code: 2

tags: ["integration", "cli", "basic"]
