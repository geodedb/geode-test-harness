    gq_as geode 'Sonny Harness Admin Passphrase 738' 'CREATE (:M6335 {k: 1, ssn: '"'"'SSN-6335-SECRET-ABC'"'"'})-[:Q6335 {k: 10, p: '"'"'SSN-6335-SECRET-ABC'"'"'}]->(:M6335 {k: 2, ssn: '"'"'other'"'"'}), (:M6335 {k: 3, ssn: '"'"'SSN-6335-SECRET-ABC'"'"'}) RETURN 1 AS ok'
