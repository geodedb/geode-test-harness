- name: secret-never-at-rest-in-plaintext
  command: |
    . "/tmp/sonny738-crypto-6335/env.sh"
    grep -r -a -l '--exclude=*.jsonl' --exclude-dir=timeseries --exclude-dir=fts --exclude-dir=wal SSN-6335-SECRET-ABC "$D"
