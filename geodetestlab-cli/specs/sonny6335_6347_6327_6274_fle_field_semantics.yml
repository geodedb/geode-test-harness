  - critical
  type: bash
  timeout_ms: 300000
- name: fle-catalog-lives-in-data-dir-not-tmp
  description: SONNY-6274 — the catalog is a 0600 file in the data directory; nothing is written to the shared /tmp path by this server
  type: bash
  command: |
    . "/tmp/sonny738-crypto-6335/env.sh"
    set -u
    D="${GEODE_DATA_DIR:?}"
    F=$(find "$D" -maxdepth 2 -name 'geode_fle_catalog.dat' | head -1)
    [ -n "$F" ] || { echo "FAIL no FLE catalog file under the data dir"; ls -la "$D"; exit 1; }
    MODE=$(stat -c %a "$F")
    [ "$MODE" = "600" ] || { echo "FAIL catalog mode $MODE (want 600)"; exit 1; }
    if [ -e /tmp/geode_fle_catalog.dat ]; then
      # another process/run may have left it; this server must not have touched it in the last 10 minutes
      if find /tmp/geode_fle_catalog.dat -mmin -10 | grep -q .; then echo "FAIL /tmp/geode_fle_catalog.dat was written recently"; exit 1; fi
    fi
    echo "fle_catalog_in_data_dir mode=$MODE"
  expect:
    exit_code: 0
    stdout_contains:
    - fle_catalog_in_data_dir
  tags:
  - fle
  - sonny-6274
  timeout_ms: 300000
- name: scratch-server-stop
