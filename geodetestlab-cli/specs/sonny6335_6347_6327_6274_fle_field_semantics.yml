version: '1.0'
name: FLE field semantics — indexes refused, inline maps agree with WHERE, MERGE refused, edge reads decrypt, catalog lives in the data dir (SONNY-6335, SONNY-6347, SONNY-6327, SONNY-6362, SONNY-6274)
description: |
  Black-box proofs for the FLE correctness/leak bugs of the SONNY-738 sweep.

  SONNY-6335 (2): the fulltext/exact/ordered/vector indexes and the MERGE property index stored
  CIPHERTEXT for encrypted fields (an FTS over an encrypted field indexed noise). Now: CREATE INDEX
  of every kind and CREATE CONSTRAINT UNIQUE on an encrypted field are refused (0A000), NOT NULL is
  allowed, an index on a plain field is unaffected, and configureField on a field that already has an
  index/UNIQUE constraint is refused (0A000, the field stays unencrypted).
  SONNY-6335 (3): inline property maps `(n:L {secret: 'x'})` compared against the stored envelope and
  never matched while `WHERE n.secret = 'x'` did; both must agree for each role.
  SONNY-6347 (1) / SONNY-6362 (4): MERGE on an encrypted key compared the envelope with the plaintext
  and created a duplicate on every run; it is refused (0A000).
  SONNY-6327 (1): an encrypted EDGE property was returned with no decryption and no role check.
  SONNY-6274: the FLE catalog fell back to a shared /tmp/geode_fle_catalog.dat; with a data directory it
  lives there (0600) and /tmp is never written.

  Real server (FLE via GEODE_MASTER_KEY), real roles (`--role`), the Admin holds FLE role 'pii' through
  geode.fle.grantRole (SONNY-6341).

  CANARY: REQ=REQ-SONNY-6335-6347-6327-FLE-SEMANTICS-BLACKBOX; FEATURE="FLE"; ASPECT=IdentityIndexesMerge; STATUS=TESTED; TEST=self; OWNER=security; UPDATED=2026-11-17

    Execution note: the server is a private scratch server started by the first step (own port and
    data dir under /tmp/sonny738-crypto-*, outside the harness-managed lifecycle), so these steps are not
    affected by concurrent harness runs on a shared machine.
single_node_only: true
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: false
  client:
    timeout_ms: 60000
    tls_verify: false
    format: json
invariants: []
tests:
- name: scratch-server-start
  description: Starts a private geode server (own data dir and port, outside the harness-managed lifecycle) for the steps below.
  type: bash
  timeout_ms: 300000
  command: |
    set -u
    ST="/tmp/sonny738-crypto-6335"
    rm -rf "$ST"; mkdir -p "$ST"
    PORT=$(python3 -c 'import socket; s=socket.socket(); s.bind(("127.0.0.1",0)); print(s.getsockname()[1]); s.close()')
    cat > "$ST/env.sh" <<'ENVEOF'
    export GEODE_ALLOW_INSECURE_TLS=1
    export ST="/tmp/sonny738-crypto-6335"
    export D="$ST/data"
    export GEODE_DATA_DIR="$D"
    export GEODE_CLIENT_TLS="--insecure-tls-skip-verify"
    export ADMINPW="Sonny Harness Admin Passphrase 738"
    SRV_ENV=(
      'GEODE_ADMIN_PASSWORD=Sonny Harness Admin Passphrase 738'
      GEODE_ALLOW_TEST_AUDIT_KEYS=1
      GEODE_LSP_PORT=0
      GEODE_MASTER_KEY=sonny6335-fle-master-key-0123456789abcdef
    )
    SRV_ARGS=()
    gq_as() { local u="$1" p="$2"; shift 2; "$GEODE_BINARY" query -U "$u" -P "$p" "$@" --server "$GEODE_SERVER_ADDRESS" $GEODE_CLIENT_TLS; }
    gq() { gq_as geode "$ADMINPW" "$@"; }
    start_srv() {
      env "${SRV_ENV[@]}" setsid nohup "$GEODE_BINARY" serve --listen "$GEODE_SERVER_ADDRESS" --data-dir "$D" --log-level warn "${SRV_ARGS[@]}" </dev/null >>"$ST/server.log" 2>&1 &
      echo $! > "$ST/pid"
      local i
      for i in $(seq 1 400); do
        gq "RETURN 1 AS x" >/dev/null 2>&1 && return 0
        kill -0 "$(cat "$ST/pid")" 2>/dev/null || { echo "SERVER_EXITED"; tail -20 "$ST/server.log"; return 1; }
        sleep 0.5
      done
      echo "SERVER_NOT_READY"; tail -20 "$ST/server.log"; return 1
    }
    stop_srv() {
      [ -f "$ST/pid" ] || return 0
      local p; p=$(cat "$ST/pid")
      kill "$p" 2>/dev/null
      local i; for i in $(seq 1 200); do kill -0 "$p" 2>/dev/null || break; sleep 0.3; done
      kill -9 "$p" 2>/dev/null; rm -f "$ST/pid"
    }
    restart_srv() { stop_srv; start_srv; }
    ENVEOF
    echo "export GEODE_SERVER_ADDRESS=127.0.0.1:$PORT" >> "$ST/env.sh"
    . "$ST/env.sh"
    mkdir -p "$D"
    start_srv && echo "SCRATCH_SERVER_READY"
  expect:
    exit_code: 0
    stdout_contains:
    - SCRATCH_SERVER_READY
  tags:
  - setup
- name: setup-encrypt-fields
  expect:
    exit_code: 0
    stdout_contains:
    - ok
  tags:
  - fle
  - sonny-738
  type: bash
  command: |
    . "/tmp/sonny738-crypto-6335/env.sh"
    gq_as geode 'Sonny Harness Admin Passphrase 738' 'CALL geode.fle.configureField('"'"'M6335'"'"', '"'"'ssn'"'"', { algorithm: '"'"'AES-256-GCM'"'"', visibility: ['"'"'pii'"'"'] }) RETURN '"'"'ok'"'"' AS s'
  timeout_ms: 300000
- name: setup-encrypt-edge-field
