    gq_as geode 'Sonny Harness Admin Passphrase 738' 'CALL geode.fle.configureField('"'"'Q6335'"'"', '"'"'p'"'"', { algorithm: '"'"'AES-256-GCM'"'"', visibility: ['"'"'pii'"'"'] }) RETURN '"'"'ok'"'"' AS s'
  timeout_ms: 300000
