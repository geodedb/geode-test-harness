version: '1.0'
name: TDE — KMS unreachable causes server to fail closed (no plaintext startup)
description: |
  Verifies that the Geode server refuses to start when TDE is enabled and the
  configured KMS endpoint is unreachable. This is the "fail-closed" property:
  the server must not start in a degraded mode that silently falls back to
  plaintext storage when key material cannot be fetched.

  Scenario:
  1. Start a server with GEODE_KMS_URL pointing to an unreachable endpoint
     (127.0.0.1:1 — bound to port 1 which is typically closed/refused).
  2. Assert the server exits non-zero.
  3. Assert stderr contains a KMS-related error (url, kms, unreachable,
     or "failed to start" pattern).
  4. Assert the data directory contains no initialized graph store files
     with plaintext content (if any files were created, they must not
     contain test sentinel data).

  This test invokes `geode serve` directly via a bash step (not via the
  harness server manager) because the harness expects the server to start
  successfully, and here we want the server to fail.

  CANARY: REQ=REQ-TDE-KMS-001; FEATURE="TDE KMS fail-closed"; ASPECT=KMSUnreachable; STATUS=TESTED; OWNER=security; UPDATED=2026-05-21

skip: 'GAP-0296: KMS external provider flag (--kms-url / GEODE_KMS_URL) not yet wired into the geode serve CLI. The serve command does not accept a --kms-url flag as of 2026-05-21. When the flag is added, remove this skip and validate that exit_code != 0 with a KMS-error message on stderr.'

tags:
- tde
- kms
- fail-closed
