---
# GAP-0139: SHOW Statement Types Tests
# CANARY: REQ=REQ-SHOW-STMT-TEST-001; FEATURE="SHOW Statements"; ASPECT=TestCoverage; STATUS=TESTED; TEST=geodetestlab/specs/gap_139_show_statements.yml; OWNER=testing; UPDATED=2026-01-13
version: "1.0"
name: "GAP-0139 SHOW Statement Tests"
description: "Tests for SHOW INDEXES, SHOW CONSTRAINTS, SHOW TABLES, SHOW PROCEDURES, SHOW FUNCTIONS"

cli:
  binary: "./zig-out/bin/geode"
  server:
    enabled: true
    port: null
    data_dir: null
    startup_timeout_ms: 60000
    cleanup: true
    args: ["--log-level", "warn"]
    env: {}
  client:
    timeout_ms: 30000
    tls_verify: false
    format: "json"

tests:
  # SHOW GRAPHS tests
  - name: show-graphs-empty
    description: Test SHOW GRAPHS returns graphs list
    args: ["query", "-"]
    stdin: "SHOW GRAPHS"
    expect:
      exit_code: 0
      stdout_contains: ["name"]
    tags: [show, graphs, gap-0139]

  # SHOW INDEXES tests
  - name: show-indexes-empty
    description: Test SHOW INDEXES when no indexes exist
    args: ["query", "-"]
    stdin: "SHOW INDEXES"
    expect:
      exit_code: 0
      stdout_contains: ["name", "type", "table", "columns"]
    tags: [show, indexes, gap-0139]

  # Note: Index creation and verification requires multi-statement session
  # These are basic functionality tests - index persistence tested separately

  # SHOW CONSTRAINTS tests
  - name: show-constraints-empty
    description: Test SHOW CONSTRAINTS when no constraints exist
    args: ["query", "-"]
    stdin: "SHOW CONSTRAINTS"
    expect:
      exit_code: 0
      stdout_contains: ["name", "type", "table", "columns"]
    tags: [show, constraints, gap-0139]

  # Note: Constraint creation and verification requires multi-statement session
  # These are basic functionality tests - constraint persistence tested separately

  # SHOW TABLES tests
  - name: setup-nodes-for-tables
    description: Create nodes with labels to test SHOW TABLES
    args: ["query", "-"]
    stdin: "CREATE (:Person {name: 'Alice'}), (:Company {name: 'Acme'})"
    expect:
      exit_code: 0
    tags: [show, tables, setup, gap-0139]

  - name: show-tables-with-labels
    description: Test SHOW TABLES returns node labels
    args: ["query", "-"]
    stdin: "SHOW TABLES"
    expect:
      exit_code: 0
      stdout_contains: ["name", "type"]
    tags: [show, tables, gap-0139]

  # SHOW PROCEDURES tests
  - name: show-procedures-empty
    description: Test SHOW PROCEDURES returns empty list (Geode has no stored procedures)
    args: ["query", "-"]
    stdin: "SHOW PROCEDURES"
    expect:
      exit_code: 0
      stdout_contains: ["name", "signature"]
    tags: [show, procedures, gap-0139]

  # SHOW FUNCTIONS tests
  - name: show-functions
    description: Test SHOW FUNCTIONS returns built-in functions list
    args: ["query", "-"]
    stdin: "SHOW FUNCTIONS"
    expect:
      exit_code: 0
      stdout_contains: ["name", "signature", "return_type", "substring", "count", "abs"]
    tags: [show, functions, gap-0139]

  - name: show-functions-has-aggregations
    description: Test SHOW FUNCTIONS includes aggregation functions
    args: ["query", "-"]
    stdin: "SHOW FUNCTIONS"
    expect:
      exit_code: 0
      stdout_contains: ["sum", "avg", "min", "max", "collect"]
    tags: [show, functions, aggregation, gap-0139]

  - name: show-functions-has-temporal
    description: Test SHOW FUNCTIONS includes temporal functions
    args: ["query", "-"]
    stdin: "SHOW FUNCTIONS"
    expect:
      exit_code: 0
      stdout_contains: ["date", "datetime", "duration"]
    tags: [show, functions, temporal, gap-0139]

tags: [show, catalog, gap-0139, gql-compliance]
