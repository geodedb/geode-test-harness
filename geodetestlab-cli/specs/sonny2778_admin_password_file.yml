version: '1.0'
name: SONNY-2778 generated admin password file location and creation
description: |
  SONNY-2778: three writers put a generated bootstrap admin password into
  `.geode_admin_password` with O_CREAT|O_TRUNC, without O_EXCL / O_NOFOLLOW,
  and with no data directory wrote it into the process's CURRENT WORKING
  DIRECTORY (a test run left one in a source worktree). A pre-created
  world-readable file therefore received the password, and a planted symlink
  was followed.

  Fixed: there is one writer. It creates `<data-dir>/.geode_admin_password`
  with O_CREAT|O_EXCL|O_NOFOLLOW, mode 0600, never writes
  into the cwd, and writes nothing when anything (file, symlink, dangling
  link) is already at the path; `geode auth init` refuses BEFORE it creates
  the admin when the path is taken.

  Black-box proof with the real `geode auth init` binary, in a clean
  environment (no GEODE_ADMIN_PASSWORD, so the password is generated), run
  from a scratch working directory:
    - the file is created in the data dir, mode 0600 (umask 022 would give 644),
      holds a policy-compliant passphrase, and NOTHING is written in the cwd;
    - a planted world-readable file keeps its content and mode, `auth init`
      exits non-zero with "never overwritten" and creates no admin store;
    - a planted symlink is not followed (target stays empty), and a dangling
      symlink's target is not created.

  (The geode-auth RLS string leak half of the ticket is memory-only and is
  covered in-process by test-sonny2778-admin-password-file; the first-boot
  server writer shares the same helper.)

  Engine regression: test-sonny2778-admin-password-file.

  CANARY: REQ=REQ-SONNY-2778-ADMIN-PASSWORD-FILE; FEATURE="AdminPasswordFile"; ASPECT=ExclusiveNoFollow; STATUS=TESTED; TEST=self; OWNER=security; UPDATED=2026-11-17
single_node_only: true
cli:
  binary: ./zig-out/bin/geode
  env:
    GEODE_LOG_LEVEL: warn
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 60000
    cleanup: true
    args: [--log-level, warn]
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 30000
    tls_verify: false
    format: json
secrets:
  admin_password:
    source: env
    key: GEODE_ADMIN_PASSWORD
    required: false
    default: GeodeTestPassword123!
invariants:
- type: server_running
fuzz:
  enabled: false
tags: [auth, cli, offline, security, sonny-2778]
tests:

- name: s2778_init_writes_0600_file_in_data_dir_not_cwd
  type: bash
  command: |
    set -u
    B="${GEODE_BINARY:-geode}"
    ROOT="${GEODE_STATE_DIR:-/tmp}/s2778-clean"
    rm -rf "$ROOT" && mkdir -p "$ROOT/cwd" "$ROOT/data"
    cd "$ROOT/cwd"
    OUT=$(umask 0022; env -u GEODE_ADMIN_PASSWORD -u GEODE_DEFAULT_PASSWORD -u GEODE_DATA_DIR "$B" auth init --data-dir "$ROOT/data" 2>&1); RC=$?
    [ "$RC" -eq 0 ] || { echo "init rc=$RC"; echo "$OUT"; exit 1; }
    F="$ROOT/data/.geode_admin_password"
    [ -f "$F" ] || { echo "no password file in data dir"; ls -la "$ROOT/data"; exit 1; }
    MODE=$(stat -c '%a' "$F")
    [ "$MODE" = "600" ] || { echo "mode=$MODE want 600"; exit 1; }
    # nothing in the cwd
    [ -z "$(ls -A "$ROOT/cwd")" ] || { echo "cwd not empty:"; ls -la "$ROOT/cwd"; exit 1; }
    # policy-compliant generated passphrase: >=20 chars, >=3 words, upper+lower
    P=$(cat "$F")
    [ "${#P}" -ge 20 ] || { echo "password shorter than 20"; exit 1; }
    [ "$(echo "$P" | wc -w)" -ge 3 ] || { echo "fewer than 3 words"; exit 1; }
    echo "$P" | grep -q '[A-Z]' || { echo "no uppercase"; exit 1; }
    echo "$P" | grep -q '[a-z]' || { echo "no lowercase"; exit 1; }
    # the password is not echoed on the console
    echo "$OUT" | grep -qF "$P" && { echo "password echoed"; exit 1; }
    echo "init_file=ok mode=600 cwd_clean=ok"
  timeout_ms: 60000
  expect:
    exit_code: 0
    stdout_contains: [init_file=ok mode=600 cwd_clean=ok]
  tags: [auth, cli, sonny-2778]

- name: s2778_init_refuses_planted_file_and_keeps_it
  type: bash
  command: |
    set -u
    B="${GEODE_BINARY:-geode}"
    ROOT="${GEODE_STATE_DIR:-/tmp}/s2778-planted"
    rm -rf "$ROOT" && mkdir -p "$ROOT/data"
    F="$ROOT/data/.geode_admin_password"
    printf 'planted' > "$F"; chmod 644 "$F"
    OUT=$(env -u GEODE_ADMIN_PASSWORD -u GEODE_DEFAULT_PASSWORD -u GEODE_DATA_DIR "$B" auth init --data-dir "$ROOT/data" 2>&1); RC=$?
    [ "$RC" -ne 0 ] || { echo "init succeeded over a planted file"; echo "$OUT"; exit 1; }
    echo "$OUT" | grep -q "never overwritten" || { echo "no 'never overwritten' in:"; echo "$OUT"; exit 1; }
    [ "$(cat "$F")" = "planted" ] || { echo "planted file was overwritten"; exit 1; }
    [ "$(stat -c '%a' "$F")" = "644" ] || { echo "planted file mode changed"; exit 1; }
    # refusal came before the admin was created: removing the file lets init run
    rm -f "$F"
    env -u GEODE_ADMIN_PASSWORD -u GEODE_DEFAULT_PASSWORD -u GEODE_DATA_DIR "$B" auth init --data-dir "$ROOT/data" >/dev/null 2>&1 \
      || { echo "init after removing planted file failed (admin was created before the refusal?)"; exit 1; }
    echo "planted_refused=ok"
  timeout_ms: 60000
  expect:
    exit_code: 0
    stdout_contains: [planted_refused=ok]
  tags: [auth, cli, sonny-2778]

- name: s2778_init_does_not_follow_symlinks
  type: bash
  command: |
    set -u
    B="${GEODE_BINARY:-geode}"
    ROOT="${GEODE_STATE_DIR:-/tmp}/s2778-symlink"
    rm -rf "$ROOT" && mkdir -p "$ROOT/data" "$ROOT/outside" "$ROOT/data2"
    : > "$ROOT/outside/attacker-readable"; chmod 666 "$ROOT/outside/attacker-readable"
    ln -s "$ROOT/outside/attacker-readable" "$ROOT/data/.geode_admin_password"
    env -u GEODE_ADMIN_PASSWORD -u GEODE_DEFAULT_PASSWORD -u GEODE_DATA_DIR "$B" auth init --data-dir "$ROOT/data" >/dev/null 2>&1; RC=$?
    [ "$RC" -ne 0 ] || { echo "init succeeded through a symlink"; exit 1; }
    [ ! -s "$ROOT/outside/attacker-readable" ] || { echo "password written through the symlink"; exit 1; }
    # dangling link: its target must not be created
    ln -s "$ROOT/outside/would-be-created" "$ROOT/data2/.geode_admin_password"
    env -u GEODE_ADMIN_PASSWORD -u GEODE_DEFAULT_PASSWORD -u GEODE_DATA_DIR "$B" auth init --data-dir "$ROOT/data2" >/dev/null 2>&1; RC=$?
    [ "$RC" -ne 0 ] || { echo "init succeeded through a dangling symlink"; exit 1; }
    [ ! -e "$ROOT/outside/would-be-created" ] || { echo "dangling link target was created"; exit 1; }
    echo "symlink_not_followed=ok"
  timeout_ms: 60000
  expect:
    exit_code: 0
    stdout_contains: [symlink_not_followed=ok]
  tags: [auth, cli, sonny-2778]
