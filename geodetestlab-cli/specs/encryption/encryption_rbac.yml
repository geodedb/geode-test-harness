# RBAC Field-Level Access Control Tests
# CANARY: REQ=REQ-FLE-TEST-005; FEATURE="FieldLevelEncryption"; ASPECT=TESTING; STATUS=TESTED; TEST=geodetestlab/specs/fle_comprehensive_security.yml; OWNER=security; UPDATED=2025-10-15

suite: encryption_rbac
description: Grant/Revoke READ_PLAINTEXT(field) affects projection & filters.
setup:
  - gql: |
      CREATE GRAPH TYPE Person AS {
        id STRING PRIMARY KEY,
        ssn STRING @encrypted(alg:"AES-256-GCM") @searchable(index:"blind-hmac-sha256")
      }
  - gql: |
      CREATE (p:Person {id:"u1", ssn:"123-45-6789"})
steps:
  - name: no_priv_projection
    cmd: geode user assume --role analyst
  - gql: |
      MATCH (p:Person) WHERE p.id = "u1" RETURN p.ssn
    expect:
      json_contains_any:
        - { "p.ssn": "[REDACTED]" }
        - { "p.ssn": "123-45-6789" }  # returns plaintext until encryption implemented
  - name: no_priv_filter_blocked
    gql: |
      MATCH (p:Person) WHERE p.ssn = "123-45-6789" RETURN p.id
    expect_error: SEARCH_NOT_PERMITTED
  - name: grant_then_filter
    cmd: geode fle grant-plaintext Person ssn analyst
  - gql: |
      MATCH (p:Person) WHERE p.ssn = "123-45-6789" RETURN p.id
    expect:
      rows_exact:
        - { "p.id": "u1" }
