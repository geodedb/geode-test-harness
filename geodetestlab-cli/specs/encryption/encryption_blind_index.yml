# Blind Index Equality Search Tests
# CANARY: REQ=REQ-FLE-TEST-002; FEATURE="FieldLevelEncryption"; ASPECT=TESTING; STATUS=TESTED; TEST=geodetestlab/specs/fle_comprehensive_security.yml; OWNER=security; UPDATED=2025-10-15

suite: encryption_blind_index
description: Equality search via blind index (BI) on encrypted field.
setup:
  - gql: |
      CREATE GRAPH TYPE Account AS {
        id UUID PRIMARY KEY,
        email STRING @encrypted(alg:"CHACHA20-POLY1305") @searchable(index:"blind-hmac-sha256")
      }
steps:
  - name: seed
    gql: |
      CREATE (a1:Account {id:"aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa", email:"alice@example.com"})
      CREATE (a2:Account {id:"bbbbbbbb-bbbb-bbbb-bbbb-bbbbbbbbbbbb", email:"bob@example.com"})
  - name: query_by_email
    gql: |
      MATCH (a:Account) WHERE a.email = "alice@example.com" RETURN a.id
    expect:
      rows_exact:
        - { "a.id": "aaaaaaaa-aaaa-aaaa-aaaa-aaaaaaaaaaaa" }
