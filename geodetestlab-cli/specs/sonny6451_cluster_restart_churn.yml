      # membership is whole and one leader is agreed on every node
      for P in "${PORTS[@]}"; do
        out=$(q "${P}" "SHOW CLUSTER STATUS")
        echo "${out}" | python3 -c 'import sys,json; r=json.load(sys.stdin)["rows"]; assert len(r)==3 and sum(1 for x in r if x["role"]=="leader")==1 and len({x["leader_id"] for x in r})==1, r' || { echo "bad membership on ${P}: ${out:0:400}"; exit 1; }
