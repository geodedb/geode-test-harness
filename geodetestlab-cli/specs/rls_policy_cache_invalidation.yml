version: '1.0'
name: RLS policy cache invalidation under churn
skip: true
skip_reason: |
  BLOCKED — rls_filter.RLSFilterEngine.addDenyPolicy() (src/server/rls_filter.zig)
  has no public CLI/GQL DDL surface. The 'policy create --table --condition' CLI
  command translates to CALL geode.auth.policy_create(...) via executor.py:205-210,
  which calls handlePolicyCreate (auth_dispatch.zig:939-965). That handler ignores
  the table/condition args and adds a GPS ALLOW policy (effect=.allow,
  expression_source="true") — NOT a label-level deny for rls_filter.
  Therefore steps 2 and 6 (restricted user sees 0 rows) can never pass via CLI;
  the cache invalidation invariant cannot be exercised without label-level deny.
  Remediation: expose a CALL geode.rls.add_deny_policy(graph, label, username)
  server procedure, or add GQL DDL syntax like DENY POLICY ... FOR USER.
description: |
  Verifies that the RLS policy cache in src/security/rls_core.zig is correctly
  invalidated when a policy is deleted (revoked), without waiting for the
  60-second TTL (RLS_POLICY_CACHE_TTL_MS = 60_000).

  Scenario:
  1. Create user + seed data.
  2. Create deny policy → restricted user sees 0 rows (confirm cache is populated).
  3. Admin deletes the policy.
  4. Restricted user immediately re-queries → must now see rows (cache invalidated).
  5. Admin re-creates the deny policy.
  6. Restricted user immediately re-queries → must see 0 rows again (cache repopulated).
  7. Admin still sees all rows throughout (sanity).

  The "immediately" qualifier means the next query in this sequential spec runs
  within milliseconds of the policy change — well under the 60-second TTL.
  If the cache is NOT invalidated on delete, step 4 would still return 0 rows
  (a bug). This spec pins that invariant.

  CANARY: REQ=REQ-RLS-CACHE-001; FEATURE="RLS policy cache invalidation"; ASPECT=PolicyDeleteInvalidation; STATUS=BLOCKED; OWNER=security; UPDATED=2026-05-21

known_limitation: true

cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 60000
    cleanup: true
    args: [--log-level, warn]
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 30000
    format: json
secrets:
  admin_password:
    source: env
    key: GEODE_ADMIN_PASSWORD
    required: false
    default: GeodeTestPassword123!
invariants:
- type: server_running
fuzz:
  enabled: false

# Tests list is empty because skip: true marks this spec as pending.
# The intended test plan (once label-level deny DDL surface is available):
#   preflight-cleanup (DROP USER/GRAPH IF EXISTS),
#   create-graph, create-user (rls_cache_bob readwrite), seed (3 CacheDoc nodes),
#   seed-verify, phase1-bob-sees-docs-pre-policy (count=3 before any deny),
#   phase2-create-deny-policy (policy create --table CacheDoc --condition rls_cache_bob),
#   phase2-bob-denied (count=0 — cache populated),
#   phase3-delete-policy (policy delete rls_cache_deny_bob),
#   phase3-bob-sees-docs-after-revoke (count=3 — cache invalidated on delete),
#   phase4-recreate-deny-policy, phase4-bob-denied-again (count=0 — cache repopulated),
#   admin-sees-all (count=3 throughout), cleanup.
tests: []

tags:
- rls
- cache-invalidation
- security
- policy-lifecycle
- comprehensive
- blocked
- known_limitation
