version: '1.0'
name: RLS policy cache invalidation under churn
description: |
  Verifies that the RLS deny-policy lookup correctly reflects policy
  additions and removals issued via `CALL geode.rls.add_deny_policy(...)`
  and `CALL geode.rls.remove_deny_policy(...)`. There is no stale cache
  on the deny-policy path — `snapshotDeniedLabels` walks the policy list
  under the engine mutex on every match, so add/remove is immediately
  reflected in the next query.

  Scenario:
    1. Create user + seed data.
    2. Bob can see all CacheDoc rows (no policy yet).
    3. Admin installs deny policy → bob sees 0 rows.
    4. Admin removes the deny policy → bob immediately sees rows again.
    5. Admin re-installs the deny policy → bob sees 0 rows again.
    6. Admin always sees all rows throughout (super-user bypass).

  CANARY: REQ=REQ-RLS-CACHE-001; FEATURE="RLS policy cache invalidation"; ASPECT=PolicyDeleteInvalidation; STATUS=TESTED; OWNER=security; UPDATED=2026-05-22

cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 60000
    cleanup: true
    args: [--log-level, warn]
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 30000
    format: json
secrets:
  admin_password:
    source: env
    key: GEODE_ADMIN_PASSWORD
    required: false
    default: GeodeTestPassword123!
invariants:
- type: server_running
fuzz:
  enabled: false

tests:
- name: rls-cache-preflight-cleanup
  args: [query, -U, geode, -P, '${secret:admin_password}', '-']
  stdin: |
    DROP GRAPH IF EXISTS rls_cache;
    DROP USER IF EXISTS rls_cache_bob;
  expect: {exit_code: 0}
  tags: [rls, setup]

- name: rls-cache-create-graph-and-user
  args: [query, -U, geode, -P, '${secret:admin_password}', --batch, '-']
  stdin: |
    CREATE GRAPH rls_cache;
    CREATE USER rls_cache_bob SET PASSWORD 'Rls-Cache-Bob-12!' ROLE readwrite;
  expect: {exit_code: 0}
  tags: [rls, setup]

- name: rls-cache-seed
  args: [query, -U, geode, -P, '${secret:admin_password}', '-']
  stdin: |
    USE GRAPH rls_cache;
    CREATE (:CacheDoc {id: 1});
    CREATE (:CacheDoc {id: 2});
    CREATE (:CacheDoc {id: 3});
  expect: {exit_code: 0}
  tags: [rls, setup]

- name: rls-cache-phase1-bob-pre-policy-sees-all
  description: Phase 1 — before any deny policy, bob sees all docs.
  args: [query, -U, rls_cache_bob, -P, Rls-Cache-Bob-12!, '-']
  stdin: |
    USE GRAPH rls_cache;
    MATCH (n:CacheDoc) RETURN count(n) AS c
  expect:
    exit_code: 0
    stdout_contains: ['"c":3']
  tags: [rls, bob]

- name: rls-cache-phase2-add-deny
  args: [query, -U, geode, -P, '${secret:admin_password}', "CALL geode.rls.add_deny_policy('rls_cache', 'CacheDoc', 'rls_cache_bob')"]
  expect: {exit_code: 0, stdout_contains: [deny policy added]}
  tags: [rls, policy]

- name: rls-cache-phase2-bob-denied
  description: Phase 2 — bob immediately sees 0 rows (no cache lag).
  args: [query, -U, rls_cache_bob, -P, Rls-Cache-Bob-12!, '-']
  stdin: |
    USE GRAPH rls_cache;
    MATCH (n:CacheDoc) RETURN count(n) AS c
  expect:
    exit_code: 0
    stdout_contains: ['"c":0']
  tags: [rls, bob]

- name: rls-cache-phase3-remove-deny
  args: [query, -U, geode, -P, '${secret:admin_password}', "CALL geode.rls.remove_deny_policy('rls_cache', 'CacheDoc', 'rls_cache_bob')"]
  expect: {exit_code: 0, stdout_contains: [removed_count=1]}
  tags: [rls, policy]

- name: rls-cache-phase3-bob-sees-all-again
  description: Phase 3 — after revoke, bob immediately sees all rows again.
  args: [query, -U, rls_cache_bob, -P, Rls-Cache-Bob-12!, '-']
  stdin: |
    USE GRAPH rls_cache;
    MATCH (n:CacheDoc) RETURN count(n) AS c
  expect:
    exit_code: 0
    stdout_contains: ['"c":3']
  tags: [rls, bob]

- name: rls-cache-phase4-re-add-deny
  args: [query, -U, geode, -P, '${secret:admin_password}', "CALL geode.rls.add_deny_policy('rls_cache', 'CacheDoc', 'rls_cache_bob')"]
  expect: {exit_code: 0, stdout_contains: [deny policy added]}
  tags: [rls, policy]

- name: rls-cache-phase4-bob-denied-again
  description: Phase 4 — after re-add, bob is denied again immediately.
  args: [query, -U, rls_cache_bob, -P, Rls-Cache-Bob-12!, '-']
  stdin: |
    USE GRAPH rls_cache;
    MATCH (n:CacheDoc) RETURN count(n) AS c
  expect:
    exit_code: 0
    stdout_contains: ['"c":0']
  tags: [rls, bob]

- name: rls-cache-admin-positive-control
  description: Admin sees all docs throughout (super-user bypass).
  args: [query, -U, geode, -P, '${secret:admin_password}', '-']
  stdin: |
    USE GRAPH rls_cache;
    MATCH (n:CacheDoc) RETURN count(n) AS c
  expect:
    exit_code: 0
    stdout_contains: ['"c":3']
  tags: [rls, admin]

- name: rls-cache-cleanup
  args: [query, -U, geode, -P, '${secret:admin_password}', '-']
  stdin: |
    DROP GRAPH IF EXISTS rls_cache;
    DROP USER IF EXISTS rls_cache_bob;
  expect: {exit_code: 0}
  tags: [rls, teardown]

tags:
- rls
- cache-invalidation
- security
- policy-lifecycle
