      row_count: 1
      columns:
      - customers_created
  tags:
  - fle
  - data
  - customer
  - create
- name: fle-create-encrypted-financial-data
  description: Create financial records with highly sensitive encrypted fields
  args:
  - query
  - "CREATE (f1:Financial {record_id: 'FIN001', employee_id: 'EMP001', account_number: '4111111111111111', routing_number: '021000021', balance: 15000}), (f2:Financial {record_id: 'FIN002', employee_id: 'EMP002', account_number: '4222222222222222', routing_number: '021000022', balance: 12000}), (f3:Financial {record_id: 'FIN003', employee_id: 'EMP003', account_number: '4333333333333333', routing_number: '021000023', balance: 25000}), (f4:Financial {record_id: 'FIN004', employee_id: 'EMP004', account_number: '4444444444444444', routing_number: '021000024', balance: 8000}), (f5:Financial {record_id: 'FIN005', employee_id: 'EMP005', account_number: '4555555555555555', routing_number: '021000025', balance: 20000}) RETURN count(*) AS financial_records_created"
