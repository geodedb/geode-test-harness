- name: fle-create-encrypted-employee-data
  description: Create employee records with PII fields (encrypted at rest)
  args:
  - query
  - "CREATE (e1:Employee {employee_id: 'EMP001', name: 'Alice Johnson', ssn: '123-45-6789', salary: 95000, date_of_birth: '1985-03-15', department: 'Engineering'}), (e2:Employee {employee_id: 'EMP002', name: 'Bob Smith', ssn: '987-65-4321', salary: 85000, date_of_birth: '1990-07-22', department: 'Marketing'}), (e3:Employee {employee_id: 'EMP003', name: 'Carol Williams', ssn: '456-78-9012', salary: 120000, date_of_birth: '1978-11-08', department: 'Engineering'}), (e4:Employee {employee_id: 'EMP004', name: 'David Brown', ssn: '234-56-7890', salary: 75000, date_of_birth: '1995-01-30', department: 'Support'}), (e5:Employee {employee_id: 'EMP005', name: 'Eve Davis', ssn: '567-89-0123', salary: 110000, date_of_birth: '1982-06-14', department: 'Engineering'}) RETURN count(*) AS employees_created"
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
      columns:
      - employees_created
  tags:
  - fle
  - data
  - employee
  - create
- name: fle-create-encrypted-customer-data
  description: Create customer records with encrypted contact info
  args:
  - query
  - "CREATE (c1:Customer {customer_id: 'CUST001', name: 'John Doe', email: 'john.doe@example.com', phone: '+1-555-0101', tier: 'Gold'}), (c2:Customer {customer_id: 'CUST002', name: 'Jane Smith', email: 'jane.smith@example.com', phone: '+1-555-0102', tier: 'Silver'}), (c3:Customer {customer_id: 'CUST003', name: 'Mike Wilson', email: 'mike.wilson@example.com', phone: '+1-555-0103', tier: 'Platinum'}), (c4:Customer {customer_id: 'CUST004', name: 'Sarah Connor', email: 'sarah.connor@example.com', phone: '+1-555-0104', tier: 'Gold'}), (c5:Customer {customer_id: 'CUST005', name: 'Tom Anderson', email: 'tom.anderson@example.com', phone: '+1-555-0105', tier: 'Silver'}) RETURN count(*) AS customers_created"
  expect:
