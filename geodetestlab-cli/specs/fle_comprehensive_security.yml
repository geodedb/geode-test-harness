version: '1.0'
name: Geode FLE (Field-Level Encryption) Comprehensive Security Test Suite
description: End-to-end testing of Field-Level Encryption including key hierarchy, multi-tenant isolation, and encrypted field operations
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 30000
    cleanup: true
    args:
    - --log-level
    - info
    - --enable-fle
    - --enable-tde
    - --tde-provider
    - MockKms
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
      GEODE_MASTER_KEY: fle-comprehensive-security-key-32b!
  client:
    timeout_ms: 15000
    tls_verify: false
    format: json
secrets:
  admin_password:
    source: env
    key: GEODE_ADMIN_PASSWORD
    required: false
    default: Geode Test Admin Passphrase
  analyst_password:
    source: env
    key: GEODE_ANALYST_PASSWORD
    required: false
    default: Analyst pass 456 Test Passphrase Value
  hr_manager_password:
    source: env
    key: GEODE_HR_PASSWORD
    required: false
    default: Hr manager pass 789 Test Passphrase Value
  auditor_password:
    source: env
    key: GEODE_AUDITOR_PASSWORD
    required: false
    default: Auditor pass 012 Test Passphrase Value
  regular_user_password:
    source: env
    key: GEODE_USER_PASSWORD
    required: false
    default: Regular user pass 345 Test Passphrase Value
skip_isolation: true
tests:
- name: fle-setup-admin-user
  description: Create admin user with full FLE access
  args:
  - user
  - create
  - fle_admin
  - fle_admin@geode.dev
  - --password
  - ${secret:admin_password}
  - --role
  - admin
  expect:
    exit_code: 0
    stdout_contains:
    - admin
    - created
  tags:
  - fle
  - setup
  - user
  - admin
- name: fle-setup-hr-manager-role
  description: Create HR manager role with PII read permissions
  args:
  - role
  - create
  - hr_manager
  - --permissions
  - read,write,pii_read
  expect:
    exit_code: 0
    stdout_contains:
    - hr_manager
    - created
  tags:
  - fle
  - setup
  - role
  - hr
- name: fle-setup-analyst-role
  description: Create analyst role with limited read permissions (no PII)
  args:
  - role
  - create
  - analyst
  - --permissions
  - read,query
  expect:
    exit_code: 0
    stdout_contains:
    - analyst
    - created
  tags:
  - fle
  - setup
  - role
  - analyst
- name: fle-setup-auditor-role
  description: Create auditor role with audit log access
  args:
  - role
  - create
  - auditor
  - --permissions
  - read,audit_read
  expect:
    exit_code: 0
    stdout_contains:
    - auditor
    - created
  tags:
  - fle
  - setup
  - role
  - auditor
- name: fle-setup-hr-manager-user
  description: Create HR manager user
  args:
  - user
  - create
  - hr_manager
  - hr@geode.dev
  - --password
  - HrM4nager789 Test Passphrase Value
  - --role
  - hr_manager
  expect:
    exit_code: 0
    stdout_contains:
    - hr_manager
    - created
  tags:
  - fle
  - setup
  - user
  - hr
- name: fle-setup-analyst-user
  description: Create analyst user
  args:
  - user
  - create
  - analyst_user
  - analyst@geode.dev
  - --password
  - An4lyst456 Test Passphrase Value
  - --role
  - analyst
  expect:
    exit_code: 0
    stdout_contains:
    - analyst_user
    - created
  tags:
  - fle
  - setup
  - user
  - analyst
- name: fle-setup-auditor-user
  description: Create auditor user
  args:
  - user
  - create
  - auditor_user
  - auditor@geode.dev
  - --password
  - Aud1tor012 Test Passphrase Value
  - --role
  - auditor
  expect:
    exit_code: 0
    stdout_contains:
    - auditor_user
    - created
  tags:
  - fle
  - setup
  - user
  - auditor
- name: fle-setup-regular-user
  description: Create regular user with no PII access
  args:
  - user
  - create
  - regular_user
  - user@geode.dev
  - --password
  - RegUl4r345 Test Passphrase Value
  - --role
  - user
  expect:
    exit_code: 0
    stdout_contains:
    - regular_user
    - created
  tags:
  - fle
  - setup
  - user
  - regular
