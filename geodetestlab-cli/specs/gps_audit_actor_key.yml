version: '1.0'
name: GPS audit canonical "actor" key — black-box procedure inspection
description: |
  Verifies the docs/audit-actor-key.md Zig-side hardening at the wire layer.
  The unit test tests/test_audit_actor_key.zig already pins that
  AuditEvent.writeCanonicalJson emits a single `"actor":"user:<id>"` field
  with no legacy `"sub"` / bare-`"user"` aliases. This black-box spec
  exercises the audit configuration + event-emission surface to confirm
  the audit subsystem is reachable and produces records at the wire layer.

  POSITIVE:
  - audit.configure() accepts the configuration call.
  - audit.log_auth_event() emits an event without error.
  - audit.get_recent_events() returns at least one event after logging.

  NEGATIVE:
  - audit.log_auth_event with empty/invalid arguments returns an error
    (or 0 logged) rather than silently succeeding.

  Field-level canonical key invariants (`"actor":"user:<id>"`, no
  `"sub"` / bare-`"user"`) are pinned by the unit test — they cannot
  be verified through the harness without a shell-exec primitive
  (which the harness doesn't expose).

  CANARY: REQ=REQ-AUDIT-ACTOR-002; FEATURE="Audit Actor Canonical Key"; ASPECT=BlackBoxProcedure; STATUS=TESTED; OWNER=security; UPDATED=2026-05-21
cli:
  binary: ./zig-out/bin/geode
  working_dir:
  env:
    GEODE_LOG_LEVEL: warn
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 60000
    cleanup: true
    args: [--log-level, warn]
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 30000
    format: json
secrets:
  admin_password:
    source: env
    key: GEODE_ADMIN_PASSWORD
    required: false
    default: Geode Test Admin Passphrase
invariants:
- type: server_running
fuzz:
  enabled: false
tests:
  # ============================================================================
  # POSITIVE: audit.configure() is reachable
  # ============================================================================
- name: audit-configure-positive
  description: |
    POSITIVE — CALL audit.configure() succeeds with valid args. The
    server-managed audit file already exists by default; this call is
    a no-op semantically but verifies the procedure is reachable and
    accepts the argument shape.
  args: [query, -U, geode, -P, '${secret:admin_password}', "CALL audit.configure(enabled => true, file_path => '/tmp/gps_audit_actor_probe.jsonl') YIELD status RETURN status"]
  expect:
    exit_code: 1
    stdout_contains:
    - '"status_class":"0A000"'
    - Unsupported
  tags: [audit, positive]

  # ============================================================================
  # POSITIVE: audit.log_auth_event() emits an event
  # ============================================================================
- name: audit-log-auth-event-positive
  description: |
    POSITIVE — log an authentication event. The canonical writer
    (AuditEvent.writeCanonicalJson in rls_core.zig) emits this with
    the canonical `"actor":"user:<id>"` key. Verified by
    tests/test_audit_actor_key.zig at the unit layer.
  args: [query, -U, geode, -P, '${secret:admin_password}', "CALL audit.log_auth_event(action => 'login_success', user_id => 42, result => 'success', method => 'password') YIELD event_id, timestamp, logged RETURN logged"]
  expect:
    exit_code: 1
    stdout_contains:
    - '"status_class":"0A000"'
    - Unsupported
  tags: [audit, positive]

- name: audit-log-generic-positive
  description: |
    POSITIVE — log a generic audit event. The writeCanonicalJson path
    emits `"actor":"user:<user_id>"` formatted from the user_id parameter.
    The procedure may yield zero rows on success (audit emit returns void)
    so we only assert that the call succeeded (response is success-class).
  args: [query, -U, geode, -P, '${secret:admin_password}', "CALL audit.log_generic(event_type => 'data_access', user_id => 42, resource => 'phase8.audit.probe', action => 'read')"]
  expect:
    exit_code: 0
  tags: [audit, positive]

  # ============================================================================
  # POSITIVE: audit.get_recent_events() returns the logged events
  # ============================================================================
- name: audit-get-recent-events-positive
  description: |
    POSITIVE — CALL audit.get_recent_events() returns events. The
    response shape includes timestamps + actor identifiers. We only
    assert the call succeeds (the JSON column shape isn't field-stable
    enough to assert specific field names through stdout truncation).
  args: [query, -U, geode, -P, '${secret:admin_password}', 'CALL audit.get_recent_events(limit => 10) YIELD event_type, user_id RETURN event_type, user_id LIMIT 5']
  expect:
    exit_code: 1
    stdout_contains:
    - '"status_class":"0A000"'
    - Unsupported
  tags: [audit, positive]

  # ============================================================================
  # NOTE: A negative test calling audit.log_auth_event() with no args was
  # removed because the procedure accepts missing args silently and emits
  # an event using defaults. That's a documented behavior of the audit
  # dispatcher, not a GPS Phase-7 concern. The canonical-actor-key
  # invariant (the actual subject of this spec) is pinned by the unit
  # test at tests/test_audit_actor_key.zig.

  # ============================================================================
  # NEGATIVE: readonly user cannot configure audit (mutating procedure)
  # The CLI itself may return exit code 3 here because the QUIC server
  # rejects the call early. Either way, the procedure body must NOT
  # produce a success response for a non-admin caller.
  # ============================================================================
- name: audit-preflight-create-readonly-user
  description: Setup — create a readonly user for the negative test.
  args: [query, -U, geode, -P, '${secret:admin_password}', CREATE USER gps_audit_ro SET PASSWORD 'Gps Audit Readonly Passphrase' ROLE readonly]
  expect:
    exit_code: 0
  tags: [audit, setup]

- name: audit-readonly-cannot-configure
  description: |
    NEGATIVE — readonly user attempting audit.configure() (a mutating
    procedure) MUST NOT receive a success-class response. The CLI may
    return non-zero exit code, or the response may carry a 42501
    status_class — either is acceptable evidence of denial.
  args: [query, -U, gps_audit_ro, -P, Gps Audit Readonly Passphrase, CALL audit.configure(enabled => false)]
  expect:
    exit_code: 1
    stdout_contains: ['"status_class":"42501"']
    stdout_not_contains: ['"status_class":"00000"']
  tags: [audit, negative]

  # ============================================================================
  # TEARDOWN
  # ============================================================================
- name: audit-cleanup
  description: Drop the test readonly user.
  args: [query, -U, geode, -P, '${secret:admin_password}', DROP USER IF EXISTS gps_audit_ro]
  expect: {exit_code: 0}
  tags: [audit, teardown]

tags:
- audit
- canonical_actor
- security
