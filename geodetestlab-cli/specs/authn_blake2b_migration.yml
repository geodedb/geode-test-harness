version: '1.0'
name: Authn BLAKE2b to Argon2id Migration (GAP-0314)
description: |
  GAP-0314 — BLAKE2b legacy password hash migration verification.

  STATUS: PARTIALLY BLOCKED

  Geode's geode_auth_lib.zig:verifyPassword supports a dual-path verify:
    1. PHC string path ($argon2id$...) — Argon2id OWASP hashes.
    2. Legacy hex path (64-char hex) — BLAKE2b-256 hashes seeded in an
       earlier format.

  The migration path is exercised by the internal unit test
  src/security/test_argon2id_hashing.zig ("legacy Blake2b migration support").

  SEEDING PATH (ENG-3979): `geode user import <name> --hash <h>
  --algorithm blake2b` now exists on BOTH sides — offline (data-dir) and
  over the wire (`CALL geode.auth.user_import(...)`, admin-only, cluster
  fail-closed, AuthGraphManager write-through). Against a running server
  only the wire arm is usable: ENG-3921's data-dir lock refuses an
  out-of-process auth write while the server owns the directory.

  STILL NOT COVERED HERE: the end-to-end "log in with a BLAKE2b
  credential" flow. `user_management.verifyPassword` only accepts
  `$argon2id$` PHC strings, so an imported legacy hash is fail-closed
  (never authenticates) until the legacy verify path is reachable from the
  wire login. That round trip stays pinned by the internal unit test
  src/security/test_argon2id_hashing.zig.

  TESTED HERE:
    1. Static oracle: confirm dual-path verify function exists in source.
    2. Static oracle: confirm BLAKE2b hex format constant is present.
    3. Behavioural oracle: create a user (Argon2id path); confirm login
       succeeds — proves the Argon2id path is live and the migration shim
       does not break normal logins.
    4. Negative: a 64-character hex string submitted as a password must
       fail authentication (hex strings are not valid plaintext passwords
       for Argon2id accounts).

  CANARY: REQ=REQ-AUTH-HASH-002; FEATURE="Blake2bMigration"; ASPECT=LegacyHashMigration; STATUS=PARTIAL; TEST=geodetestlab/specs/authn_blake2b_migration.yml; OWNER=security; UPDATED=2026-05-21

cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 60000
    cleanup: true
    args:
    - --log-level
    - info
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 30000
    format: json

invariants:
- type: server_running

tests:
  # ---- static oracle: dual-path verify function present ----
- name: blake2b-source-dual-path-verify-present
  description: |
    STATIC ORACLE: Scan geode_auth_lib.zig for the legacy BLAKE2b hex-
    path branch inside verifyPassword. The function must handle both PHC
    and 64-char hex inputs. If this grep fails the migration path was
    removed.
  type: bash
  command: |
    grep -n "blake2\|Blake2\|BLAKE2\|legacy\|hex.*verify\|verify.*hex" \
      src/security/geode_auth_lib.zig src/security/test_argon2id_hashing.zig \
      2>/dev/null | head -10 && echo "DUAL_PATH_PRESENT"
  expected:
    exit_code: 0
    stdout_contains:
    - DUAL_PATH_PRESENT
  tags: [blake2b, static-oracle]

- name: blake2b-source-migration-test-present
  description: |
    STATIC ORACLE: The internal unit test for the Blake2b migration
    round-trip must be present in the test suite.
  type: bash
  command: |
    grep -q "legacy Blake2b migration" src/security/test_argon2id_hashing.zig \
      2>/dev/null && echo "MIGRATION_TEST_PRESENT"
  expected:
    exit_code: 0
    stdout_contains:
    - MIGRATION_TEST_PRESENT
  tags: [blake2b, static-oracle]

  # ---- behavioural: new user uses Argon2id (migration does not break new logins) ----
- name: blake2b-create-argon2id-user
  description: |
    Create a test user. The server assigns an Argon2id hash. This confirms
    the migration shim (dual-path verify) does not interfere with normal
    Argon2id credential creation.
  args:
  - user
  - create
  - blake2b_test_user
  - blake2b_test@test.example.com
  - --password
  - Blake2b Test Pass 2026 Test Passphrase Value
  expected:
    exit_code: 0
    stdout_contains:
    - blake2b_test_user
    - created
  tags: [blake2b, positive, argon2id-path]

- name: blake2b-login-argon2id-user-succeeds
  description: |
    POSITIVE: The newly created user must be able to log in, confirming
    the Argon2id path through the dual-path verifier works.
  args:
  - auth
  - login
  - --user
  - blake2b_test_user
  - --password
  - Blake2b Test Pass 2026 Test Passphrase Value
  expected:
    exit_code: 0
    stdout_contains:
    - Successfully authenticated
  tags: [blake2b, positive, argon2id-login]

  # ---- NEGATIVE: BLAKE2b hex string used as password fails ----
- name: blake2b-hex-string-as-password-rejected
  description: |
    NEGATIVE: Submitting a wrong password must not grant access. The
    legacy Blake2b path is only reached when the STORED hash is in hex
    format; the submitted credential is always treated as plaintext. This
    confirms the verifier does not false-accept plaintext that looks like
    a hash.
  args:
  - auth
  - login
  - --user
  - blake2b_test_user
  - --password
  - Wrong_Blake2b_Pass_NotRight!
  expected:
    exit_code: 3
    stderr_contains:
    - Invalid username or password
  tags: [blake2b, negative, wrong-password]

  # ---- admin user-import (pre-computed hash) ----
- name: blake2b-user-import-precomputed-hash
  description: |
    `geode user import <name> --hash <h> --algorithm blake2b` seeds a user
    with a pre-computed password hash rather than a plaintext password.
    This is the migration path for importing users from a legacy store
    that carries BLAKE2b hashes. The hash is persisted verbatim into the
    __geode_security graph's password_hash column.

    ENG-3979: this rides the WIRE (`CALL geode.auth.user_import(...)`), like
    every other `user` subcommand in this harness. The offline `--data-dir`
    path cannot serve it here: ENG-3921's data-dir lock correctly refuses an
    out-of-process auth write while this spec's server owns the directory.
    The wire procedure carries the same posture as `user_create` —
    admin-only, cluster fail-closed, AuthGraphManager write-through into the
    HMAC-chained __geode_security graph.
  args:
  - user
  - import
  - legacy_blake2b_user
  - --hash
  - blake2b_legacy_hash_0123456789abcdef
  - --algorithm
  - blake2b
  - --email
  - legacy@migration.example
  expected:
    exit_code: 0
    stdout_contains:
    - imported successfully
    - legacy_blake2b_user
    - blake2b
  tags: [blake2b, migration, user-import]

  # ---- cleanup ----
- name: blake2b-cleanup-user
  description: Delete the test user.
  args:
  - user
  - delete
  - blake2b_test_user
  - --yes
  expected:
    exit_code: 0
  tags: [blake2b, cleanup]

tags:
- blake2b
- argon2id
- authn
- security
- migration
- partial-blocked
