name: "GAP-0258: mTLS CLI commands"
description: "Verify mTLS certificate mapping management CLI commands"
mode: server
server_args: []
tests:
  - name: "GAP-0258-001: mtls help shows subcommands"
    command: "zig-out/bin/geode mtls --help"
    expected:
      exit_code: 0
      stdout_contains:
        - "map create"
        - "map list"
        - "map delete"
        - "config"
        - "status"

  - name: "GAP-0258-002: create fingerprint mapping"
    command: "zig-out/bin/geode mtls map create --method fingerprint --pattern 'SHA256:abc123' --user alice --roles admin"
    expected:
      exit_code: 0
      stdout_contains:
        - "Created mTLS mapping"
        - "fingerprint"
        - "alice"

  - name: "GAP-0258-003: create SAN email mapping"
    command: "zig-out/bin/geode mtls map create --method san_email --pattern 'bob@example.com' --user bob --roles read_only"
    expected:
      exit_code: 0
      stdout_contains:
        - "Created mTLS mapping"
        - "san_email"
        - "bob"

  - name: "GAP-0258-004: list mappings shows both"
    command: "zig-out/bin/geode mtls map list"
    expected:
      exit_code: 0
      stdout_contains:
        - "fingerprint"
        - "san_email"
        - "alice"
        - "bob"

  - name: "GAP-0258-005: set strict mode"
    command: "zig-out/bin/geode mtls config --strict-mode true"
    expected:
      exit_code: 0
      stdout_contains:
        - "strict_mode=true"

  - name: "GAP-0258-006: set default method"
    command: "zig-out/bin/geode mtls config --default-method subject_cn"
    expected:
      exit_code: 0
      stdout_contains:
        - "default_method=subject_cn"

  - name: "GAP-0258-007: show status"
    command: "zig-out/bin/geode mtls status"
    expected:
      exit_code: 0
      stdout_contains:
        - "Strict mode"
        - "Default method"
        - "Mappings"

  - name: "GAP-0258-008: delete mapping"
    command: "zig-out/bin/geode mtls map delete --pattern 'SHA256:abc123'"
    expected:
      exit_code: 0
      stdout_contains:
        - "Deleted mTLS mapping"

  - name: "GAP-0258-009: verify delete removed it"
    command: "zig-out/bin/geode mtls map list"
    expected:
      exit_code: 0
      stdout_contains:
        - "bob"
      stdout_not_contains:
        - "alice"

  - name: "GAP-0258-010: invalid method rejected"
    command: "zig-out/bin/geode mtls map create --method invalid_method --pattern 'test' --user testuser"
    expected:
      exit_code: 2
      stdout_contains:
        - "Invalid method"
