# Timeseries Procedure Argument Validation — Negatives
#
# timeseries_basic.yml (+ its GAP-0865 durability extension, commit a21d4e7)
# proves the geode.ts.* procedure family works end-to-end on the happy path
# (insert / insert_many / range / last / sample_by). It contains NO
# argument-validation negatives: every CALL there is well-formed. This spec
# closes that gap — it probes what the dispatcher (src/execution/ts_dispatch.zig)
# actually does when a caller gets the arguments wrong.
#
# Probed against a live server on the real QUIC CLI path (not assumed):
#   - Missing/extra positional args (wrong arity)               -> InvalidArgs (58000)
#   - Unknown aggregation name to ts.sample_by                  -> InvalidArgs (58000)
#     NOTE (honest limitation pin): the dispatcher does NOT name the
#     offending value or list valid aggregations in the error text — it
#     returns the same generic "InvalidArgs" as any other arity/shape
#     violation. This is real, teeth-having rejection (not a silent
#     accept), just less descriptive than a caller might want.
#   - Wrong-typed value (string where int expected, float where an
#     int timestamp is expected)                                -> TypeMismatch (58000)
#   - Malformed nested array to ts.insert_many (ragged / wrong
#     inner arity / non-array element)                          -> InvalidArgs or
#                                                                    TypeMismatch (58000)
#   - Inverted range (start_ts > end_ts)                        -> exit 0, rows:[]
#                                                                    (NOT an error — a
#                                                                    boundary empty
#                                                                    result, no crash)
#
# Per house lore: `geode query` always exits 0 on the CLI; the real signal is
# the JSON status_class/error in stdout. A genuine error carries
# status_class 58000 (InvalidArgs/TypeMismatch) and MUST NOT carry the
# success status_class 00000. Assertions below check both directions.

version: '1.0'
name: Timeseries Procedure Argument Validation
description: >
  CANARY: REQ=REQ-TIMESERIES-ARG-VALIDATION-001; FEATURE="TimeSeries";
  ASPECT=ArgumentValidation; STATUS=TESTED;
  TEST=geodetestlab/specs/timeseries_argument_validation.yml; OWNER=qa;
  UPDATED=2026-07-10
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 60000
    cleanup: true
    args:
    - --log-level
    - warn
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 30000
    tls_verify: false
    format: json
invariants:
- type: server_running
tests:
# --- setup (positive): prove the surface works before probing its edges ---
- name: p12-setup-insert
  description: A valid CALL geode.ts.insert writes one point (baseline the negatives are compared against)
  args:
  - query
  - '-'
  stdin: CALL geode.ts.insert(1, 'p12.metric', 1000, 42)
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    - '"name":"inserted"'
    - '"inserted":1'
    stdout_not_contains:
    - '"status_class":"58000"'
  tags:
  - timeseries
  - argument-validation
  - setup
- name: p12-setup-readback
  description: CALL geode.ts.range reads the point back, proving the write landed (not a silent no-op)
  args:
  - query
  - '-'
  stdin: CALL geode.ts.range(1, 'p12.metric', 0, 2000)
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    stdout_regex:
    - '"ts":1000'
    - '"value":42'
  tags:
  - timeseries
  - argument-validation
  - setup
# --- KEY negative: wrong arity ---
- name: p12-wrong-arity-insert-missing-value
  description: >
    ts.insert called with the trailing value arg missing → real rejection
    (InvalidArgs/58000), not a silent accept or crash.
  args:
  - query
  - '-'
  stdin: CALL geode.ts.insert(1, 'p12.metric', 2000)
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"58000"'
    - InvalidArgs
    stdout_not_contains:
    - '"status_class":"00000"'
  tags:
  - timeseries
  - argument-validation
  - wrong-arity
- name: p12-wrong-arity-insert-missing-metric-and-value
  description: ts.insert called with only 2 of its 4 required args → InvalidArgs
  args:
  - query
  - '-'
  stdin: CALL geode.ts.insert(1, 2000)
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"58000"'
    - InvalidArgs
    stdout_not_contains:
    - '"status_class":"00000"'
  tags:
  - timeseries
  - argument-validation
  - wrong-arity
- name: p12-wrong-arity-insert-extra-arg
  description: ts.insert called with one extra trailing arg → also rejected as InvalidArgs
  args:
  - query
  - '-'
  stdin: CALL geode.ts.insert(1, 'p12.metric', 9000, 1, 'extra')
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"58000"'
    - InvalidArgs
    stdout_not_contains:
    - '"status_class":"00000"'
  tags:
  - timeseries
  - argument-validation
  - wrong-arity
# --- negative: invalid aggregation name to sample_by ---
- name: p12-invalid-aggregation-sample-by
  description: >
    ts.sample_by given an unknown aggregation ('banana') → rejected as
    InvalidArgs. LIMITATION: the error does not name 'banana' or list the
    valid aggregation set (avg/min/max/... per timeseries_basic.yml) — it
    is a generic InvalidArgs, same as any other malformed-args case. Real
    rejection, just not a descriptive one.
  args:
  - query
  - '-'
  stdin: CALL geode.ts.sample_by(1, 'p12.metric', 1000, 0, 3000, 'banana')
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"58000"'
    - InvalidArgs
    stdout_not_contains:
    - '"status_class":"00000"'
  tags:
  - timeseries
  - argument-validation
  - invalid-aggregation
# --- negative: non-numeric value where a number is required ---
- name: p12-non-numeric-value-string
  description: ts.insert given a string literal for the numeric `value` arg → TypeMismatch
  args:
  - query
  - '-'
  stdin: CALL geode.ts.insert(1, 'p12.metric', 3000, 'not_a_number')
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"58000"'
    - TypeMismatch
    stdout_not_contains:
    - '"status_class":"00000"'
  tags:
  - timeseries
  - argument-validation
  - non-numeric-value
- name: p12-non-numeric-timestamp-float
  description: >
    ts.insert given a float literal for the integer `ts` arg (4000.5) →
    TypeMismatch, not silent truncation.
  args:
  - query
  - '-'
  stdin: CALL geode.ts.insert(1, 'p12.metric', 4000.5, 55)
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"58000"'
    - TypeMismatch
    stdout_not_contains:
    - '"status_class":"00000"'
  tags:
  - timeseries
  - argument-validation
  - non-numeric-value
# --- negative: malformed insert_many nested array ---
- name: p12-malformed-insert-many-ragged
  description: >
    ts.insert_many given a ragged batch ([[ts,value], [ts]]) — one inner
    tuple missing its value → InvalidArgs.
  args:
  - query
  - '-'
  stdin: CALL geode.ts.insert_many(1, 'p12.metric', [[5000, 1], [6000]])
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"58000"'
    - InvalidArgs
    stdout_not_contains:
    - '"status_class":"00000"'
  tags:
  - timeseries
  - argument-validation
  - malformed-insert-many
- name: p12-malformed-insert-many-oversized-tuple
  description: >
    ts.insert_many given an inner tuple with an extra third element
    ([ts,value,extra]) → InvalidArgs.
  args:
  - query
  - '-'
  stdin: CALL geode.ts.insert_many(1, 'p12.metric', [[5000, 1], [6000, 2, 3]])
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"58000"'
    - InvalidArgs
    stdout_not_contains:
    - '"status_class":"00000"'
  tags:
  - timeseries
  - argument-validation
  - malformed-insert-many
- name: p12-malformed-insert-many-non-array-element
  description: >
    ts.insert_many given a batch where one element is a plain string
    instead of a [ts, value] pair → TypeMismatch.
  args:
  - query
  - '-'
  stdin: CALL geode.ts.insert_many(1, 'p12.metric', [[5000, 1], 'oops'])
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"58000"'
    - TypeMismatch
    stdout_not_contains:
    - '"status_class":"00000"'
  tags:
  - timeseries
  - argument-validation
  - malformed-insert-many
# --- boundary: inverted range (start > end) is empty, not an error ---
- name: p12-inverted-range-empty-not-error
  description: >
    ts.range with start_ts > end_ts (3000 > 0) is a valid boundary call:
    the server returns an empty (successful) binding table rather than
    erroring or crashing.
  args:
  - query
  - '-'
  stdin: CALL geode.ts.range(1, 'p12.metric', 3000, 0)
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    - '"rows":[]'
  tags:
  - timeseries
  - argument-validation
  - inverted-range
- name: p12-post-negatives-series-unaffected
  description: >
    After all the negative/rejected calls above, the original p12.metric
    series still contains exactly the one point from setup — none of the
    rejected calls silently wrote partial data.
  args:
  - query
  - '-'
  stdin: CALL geode.ts.range(1, 'p12.metric', 0, 10000)
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    # Exact single-row match — proves no rejected call (2000, 3000, 4000,
    # 9000, 5000/6000 batch, ...) slipped a partial write through.
    - '"rows":[{"ts":1000,"value":42}]'
  tags:
  - timeseries
  - argument-validation
  - setup
tags:
- timeseries
- ts-storage
- argument-validation
