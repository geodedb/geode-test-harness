  - name: "gap-0033-delete-where-basic"
    description: "DELETE with WHERE clause filters correctly (using MATCH...DELETE syntax)"
    args: ["query", "-"]
    stdin: |
      CREATE (a:ToDelete {status: 'inactive', name: 'A'});
      CREATE (b:ToDelete {status: 'active', name: 'B'});
      CREATE (c:ToDelete {status: 'inactive', name: 'C'});
      MATCH (n:ToDelete) WHERE n.status = 'inactive' DELETE n;
      MATCH (n:ToDelete) RETURN n.name AS name ORDER BY name
    expect:
      exit_code: 0
      stdout_contains: ["B"]
    tags: ["gap-0033", "delete", "where"]

  - name: "gap-0033-delete-where-numeric"
    description: "DELETE with numeric WHERE condition (using MATCH...DELETE syntax)"
    args: ["query", "-"]
    stdin: |
      CREATE (a:NumNode {value: 5});
      CREATE (b:NumNode {value: 15});
      CREATE (c:NumNode {value: 25});
      MATCH (n:NumNode) WHERE n.value < 10 DELETE n;
      MATCH (n:NumNode) RETURN n.value AS val ORDER BY val
    expect:
      exit_code: 0
      stdout_contains: ["15", "25"]
    tags: ["gap-0033", "delete", "where", "numeric"]

  - name: "gap-0033-delete-where-no-match"
    description: "DELETE with WHERE that matches nothing (using MATCH...DELETE syntax)"
    args: ["query", "-"]
