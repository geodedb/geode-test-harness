      MATCH (n:KeepMe) RETURN count(n) AS cnt
    expect:
      exit_code: 0
      stdout_contains: ["2"]
    tags: ["gap-0033", "delete", "where", "no-match"]

  - name: "gap-0033-delete-where-all-match"
    description: "DELETE with WHERE that matches all (using MATCH...DELETE syntax)"
    args: ["query", "-"]
    stdin: |
      CREATE (a:DeleteAll {flag: true});
      CREATE (b:DeleteAll {flag: true});
      MATCH (n:DeleteAll) WHERE n.flag = true DELETE n;
      MATCH (n:DeleteAll) RETURN count(n) AS cnt
    expect:
      exit_code: 0
      stdout_contains: ["0"]
    tags: ["gap-0033", "delete", "where", "all-match"]

  - name: "gap-0033-delete-where-string-pattern"
    description: "DELETE with string comparison in WHERE (using MATCH...DELETE syntax)"
    args: ["query", "-"]
    stdin: |
      CREATE (a:Named {name: 'Alice'});
      CREATE (b:Named {name: 'Bob'});
      CREATE (c:Named {name: 'Amanda'});
      MATCH (n:Named) WHERE n.name STARTS WITH 'A' DELETE n;
      MATCH (n:Named) RETURN n.name AS name
    expect:
