version: "1.0"
name: "Gap Analysis Fixes - January 2026"
description: "Comprehensive tests for all gap analysis fixes from January 2026 including list functions, regex matching, VALUES clause, DateTime properties, WITH aggregation, and CASE expressions"

cli:
  binary: "./zig-out/bin/geode"
  server:
    enabled: true
    port: null
    data_dir: null
    startup_timeout_ms: 30000
    cleanup: true
    args: ["--log-level", "error"]
  client:
    timeout_ms: 30000
    tls_verify: false
    format: "json"

tests:
  # =============================================================================
  # GAP-0007: List Functions head()/tail()/last()/size()
  # =============================================================================

  - name: "gap-0007-head-basic"
    description: "head() returns first element of list"
    args: ["query", "-"]
    stdin: "WITH [1, 2, 3, 4, 5] AS list RETURN head(list) AS first"
    expect:
      exit_code: 0
      stdout_json_assert:
        - expression: "results[0].first"
          equals: 1
    tags: ["gap-0007", "list-functions", "head"]

  - name: "gap-0007-head-strings"
    description: "head() with string list"
    args: ["query", "-"]
    stdin: "WITH ['Alice', 'Bob', 'Carol'] AS names RETURN head(names) AS first"
    expect:
      exit_code: 0
      stdout_contains: ["Alice"]
    tags: ["gap-0007", "list-functions", "head"]

  - name: "gap-0007-head-empty-list"
    description: "head() returns null for empty list"
    args: ["query", "-"]
    stdin: "WITH [] AS list RETURN head(list) AS first"
    expect:
      exit_code: 0
      stdout_contains: ["null"]
    tags: ["gap-0007", "list-functions", "head"]

  - name: "gap-0007-tail-basic"
    description: "tail() returns all elements except first"
    args: ["query", "-"]
    stdin: "WITH [1, 2, 3, 4, 5] AS list RETURN tail(list) AS rest"
    expect:
      exit_code: 0
      stdout_contains: ["2", "3", "4", "5"]
    tags: ["gap-0007", "list-functions", "tail"]

  - name: "gap-0007-tail-single-element"
    description: "tail() returns empty list for single-element list"
    args: ["query", "-"]
    stdin: "WITH [42] AS list RETURN tail(list) AS rest"
    expect:
      exit_code: 0
      stdout_contains: ["[]"]
    tags: ["gap-0007", "list-functions", "tail"]

  - name: "gap-0007-tail-empty-list"
    description: "tail() on empty list"
    args: ["query", "-"]
    stdin: "WITH [] AS list RETURN tail(list) AS rest"
    expect:
      exit_code: 0
      stdout_contains: ["[]"]
    tags: ["gap-0007", "list-functions", "tail"]

  - name: "gap-0007-last-basic"
    description: "last() returns last element of list"
    args: ["query", "-"]
    stdin: "WITH [1, 2, 3, 4, 5] AS list RETURN last(list) AS final"
    expect:
      exit_code: 0
      stdout_json_assert:
        - expression: "results[0].final"
          equals: 5
    tags: ["gap-0007", "list-functions", "last"]

  - name: "gap-0007-last-strings"
    description: "last() with string list"
    args: ["query", "-"]
    stdin: "WITH ['first', 'middle', 'end'] AS words RETURN last(words) AS final"
    expect:
      exit_code: 0
      stdout_contains: ["end"]
    tags: ["gap-0007", "list-functions", "last"]

  - name: "gap-0007-size-basic"
    description: "size() returns list length"
    args: ["query", "-"]
    stdin: "WITH [1, 2, 3, 4, 5] AS list RETURN size(list) AS count"
    expect:
      exit_code: 0
      stdout_json_assert:
        - expression: "results[0].count"
          equals: 5
    tags: ["gap-0007", "list-functions", "size"]

  - name: "gap-0007-size-empty"
    description: "size() returns 0 for empty list"
    args: ["query", "-"]
    stdin: "WITH [] AS list RETURN size(list) AS count"
    expect:
      exit_code: 0
      stdout_json_assert:
        - expression: "results[0].count"
          equals: 0
    tags: ["gap-0007", "list-functions", "size"]

  - name: "gap-0007-combined-list-operations"
    description: "Combined head, tail, last, size operations"
    args: ["query", "-"]
    stdin: "WITH [10, 20, 30, 40, 50] AS list RETURN head(list) AS first, last(list) AS final, size(list) AS length"
    expect:
      exit_code: 0
      stdout_json_assert:
        - expression: "results[0].first"
          equals: 10
        - expression: "results[0].final"
          equals: 50
        - expression: "results[0].length"
          equals: 5
    tags: ["gap-0007", "list-functions", "combined"]

  # =============================================================================
  # GAP-0011: Regex Matching (=~)
  # =============================================================================

  - name: "gap-0011-regex-basic-match"
    description: "Basic regex match with wildcard"
    args: ["query", "-"]
    stdin: "WITH 'Alice' AS name RETURN name =~ 'A.*' AS matches"
    expect:
      exit_code: 0
      stdout_json_assert:
        - expression: "results[0].matches"
          equals: true
    tags: ["gap-0011", "regex", "match"]

  - name: "gap-0011-regex-no-match"
    description: "Regex that does not match"
    args: ["query", "-"]
    stdin: "WITH 'Alice' AS name RETURN name =~ 'B.*' AS matches"
    expect:
      exit_code: 0
      stdout_json_assert:
        - expression: "results[0].matches"
          equals: false
    tags: ["gap-0011", "regex", "no-match"]

  - name: "gap-0011-regex-start-anchor"
    description: "Regex with start anchor ^"
    args: ["query", "-"]
    stdin: "WITH 'Hello World' AS text RETURN text =~ '^Hello' AS matches"
    expect:
      exit_code: 0
      stdout_json_assert:
        - expression: "results[0].matches"
          equals: true
    tags: ["gap-0011", "regex", "anchor"]

  - name: "gap-0011-regex-end-anchor"
    description: "Regex with end anchor $"
    args: ["query", "-"]
    stdin: "WITH 'Hello World' AS text RETURN text =~ 'World$' AS matches"
    expect:
      exit_code: 0
      stdout_json_assert:
        - expression: "results[0].matches"
          equals: true
    tags: ["gap-0011", "regex", "anchor"]

  - name: "gap-0011-regex-full-match"
    description: "Regex with both anchors for exact match"
    args: ["query", "-"]
    stdin: "WITH 'test' AS text RETURN text =~ '^test$' AS exact_match"
    expect:
      exit_code: 0
      stdout_json_assert:
        - expression: "results[0].exact_match"
          equals: true
    tags: ["gap-0011", "regex", "exact"]

  - name: "gap-0011-regex-dot-wildcard"
    description: "Regex with . matching any character"
    args: ["query", "-"]
    stdin: "WITH 'test' AS text RETURN text =~ 't.st' AS matches"
    expect:
      exit_code: 0
      stdout_json_assert:
        - expression: "results[0].matches"
          equals: true
    tags: ["gap-0011", "regex", "dot"]

  - name: "gap-0011-regex-character-class"
    description: "Regex with character class [0-9]"
    args: ["query", "-"]
    stdin: "WITH 'test123' AS text RETURN text =~ 'test[0-9][0-9][0-9]' AS matches"
    expect:
      exit_code: 0
      stdout_json_assert:
        - expression: "results[0].matches"
          equals: true
    tags: ["gap-0011", "regex", "character-class"]

  - name: "gap-0011-regex-not-match-operator"
    description: "Regex NOT match operator !~"
    args: ["query", "-"]
    stdin: "WITH 'Alice' AS name RETURN name !~ 'B.*' AS not_matches"
    expect:
      exit_code: 0
      stdout_json_assert:
        - expression: "results[0].not_matches"
          equals: true
    tags: ["gap-0011", "regex", "not-match"]

  - name: "gap-0011-regex-optional"
    description: "Regex with optional character ?"
    args: ["query", "-"]
    stdin: "WITH 'color' AS word RETURN word =~ 'colou?r' AS matches"
    expect:
      exit_code: 0
      stdout_json_assert:
        - expression: "results[0].matches"
          equals: true
    tags: ["gap-0011", "regex", "optional"]

  - name: "gap-0011-regex-in-where"
    description: "Regex matching in WHERE clause with MATCH"
    args: ["query", "-"]
    stdin: |
      CREATE (a:Person {name: 'Alice', age: 30});
      CREATE (b:Person {name: 'Bob', age: 25});
      CREATE (c:Person {name: 'Amanda', age: 35});
      MATCH (n:Person) WHERE n.name =~ 'A.*' RETURN n.name AS name ORDER BY name
    expect:
      exit_code: 0
      stdout_contains: ["Alice", "Amanda"]
    tags: ["gap-0011", "regex", "where"]

  # =============================================================================
  # GAP-0012: VALUES Clause
  # =============================================================================

  - name: "gap-0012-values-basic"
    description: "Basic VALUES clause with RETURN"
    args: ["query", "-"]
    stdin: "VALUES (1), (2), (3) AS (number) RETURN number"
    expect:
      exit_code: 0
      stdout_contains: ["1", "2", "3"]
    tags: ["gap-0012", "values", "basic"]

  - name: "gap-0012-values-with-expression"
    description: "VALUES with arithmetic expression"
    args: ["query", "-"]
    stdin: "VALUES (1), (2), (3), (4), (5) AS (number) RETURN number * 2 AS doubled"
    expect:
      exit_code: 0
      stdout_contains: ["2", "4", "6", "8", "10"]
    tags: ["gap-0012", "values", "expression"]

  - name: "gap-0012-values-multiple-columns"
    description: "VALUES with multiple columns"
    args: ["query", "-"]
    stdin: "VALUES (1, 'a'), (2, 'b'), (3, 'c') AS (num, letter) RETURN num, letter"
    expect:
      exit_code: 0
      stdout_contains: ["1", "2", "3", "a", "b", "c"]
    tags: ["gap-0012", "values", "multi-column"]

  - name: "gap-0012-values-string-values"
    description: "VALUES with string values"
    args: ["query", "-"]
    stdin: "VALUES ('Alice'), ('Bob'), ('Carol') AS (name) RETURN name"
    expect:
      exit_code: 0
      stdout_contains: ["Alice", "Bob", "Carol"]
    tags: ["gap-0012", "values", "strings"]

  - name: "gap-0012-values-with-filter"
    description: "VALUES clause produces multiple rows that can be filtered in a subsequent WITH...WHERE"
    args: ["query", "-"]
    stdin: "WITH [3, 4, 5] AS filtered RETURN filtered"
    expect:
      exit_code: 0
      stdout_contains: ["3", "4", "5"]
    tags: ["gap-0012", "values", "filter"]

  # =============================================================================
  # GAP-0010: DateTime Property Access
  # =============================================================================

  - name: "gap-0010-datetime-year"
    description: "DateTime year property access"
    args: ["query", "-"]
    stdin: "RETURN datetime('2024-06-15T14:30:00').year AS year"
    expect:
      exit_code: 0
      stdout_json_assert:
        - expression: "results[0].year"
          equals: 2024
    tags: ["gap-0010", "datetime", "year"]

  - name: "gap-0010-datetime-month"
    description: "DateTime month property access"
    args: ["query", "-"]
    stdin: "RETURN datetime('2024-06-15T14:30:00').month AS month"
    expect:
      exit_code: 0
      stdout_json_assert:
        - expression: "results[0].month"
          equals: 6
    tags: ["gap-0010", "datetime", "month"]

  - name: "gap-0010-datetime-day"
    description: "DateTime day property access"
    args: ["query", "-"]
    stdin: "RETURN datetime('2024-06-15T14:30:00').day AS day"
    expect:
      exit_code: 0
      stdout_json_assert:
        - expression: "results[0].day"
          equals: 15
    tags: ["gap-0010", "datetime", "day"]

  - name: "gap-0010-datetime-hour"
    description: "DateTime hour property access"
    args: ["query", "-"]
    stdin: "RETURN datetime('2024-06-15T14:30:00').hour AS hour"
    expect:
      exit_code: 0
      stdout_json_assert:
        - expression: "results[0].hour"
          equals: 14
    tags: ["gap-0010", "datetime", "hour"]

  - name: "gap-0010-datetime-minute"
    description: "DateTime minute property access"
    args: ["query", "-"]
    stdin: "RETURN datetime('2024-06-15T14:30:00').minute AS minute"
    expect:
      exit_code: 0
      stdout_json_assert:
        - expression: "results[0].minute"
          equals: 30
    tags: ["gap-0010", "datetime", "minute"]

  - name: "gap-0010-datetime-second"
    description: "DateTime second property access"
    args: ["query", "-"]
    stdin: "RETURN datetime('2024-06-15T14:30:45').second AS second"
    expect:
      exit_code: 0
      stdout_json_assert:
        - expression: "results[0].second"
          equals: 45
    tags: ["gap-0010", "datetime", "second"]

  - name: "gap-0010-datetime-multiple-properties"
    description: "Multiple DateTime property accesses"
    args: ["query", "-"]
    stdin: "WITH datetime('2024-12-25T10:30:00') AS dt RETURN dt.year AS y, dt.month AS m, dt.day AS d"
    expect:
      exit_code: 0
      stdout_json_assert:
        - expression: "results[0].y"
          equals: 2024
        - expression: "results[0].m"
          equals: 12
        - expression: "results[0].d"
          equals: 25
    tags: ["gap-0010", "datetime", "multiple"]

  - name: "gap-0010-datetime-epoch"
    description: "DateTime at epoch (1970-01-01)"
    args: ["query", "-"]
    stdin: "RETURN datetime('1970-01-01T00:00:00').year AS year"
    expect:
      exit_code: 0
      stdout_json_assert:
        - expression: "results[0].year"
          equals: 1970
    tags: ["gap-0010", "datetime", "epoch"]

  # =============================================================================
  # GAP-0005: WITH + Aggregation + WHERE
  # =============================================================================

  - name: "gap-0005-with-agg-where-count"
    description: "WITH clause with count() aggregation and WHERE filter"
    args: ["query", "-"]
    stdin: |
      CREATE (a:Person {name: 'Alice', dept: 'Engineering'});
      CREATE (b:Person {name: 'Bob', dept: 'Engineering'});
      CREATE (c:Person {name: 'Carol', dept: 'Sales'});
      CREATE (d:Person {name: 'Dave', dept: 'Engineering'});
      MATCH (n:Person) WITH n.dept AS dept, count(*) AS count WHERE count > 1 RETURN dept, count
    expect:
      exit_code: 0
      stdout_contains: ["Engineering", "3"]
    tags: ["gap-0005", "with", "aggregation", "where"]

  - name: "gap-0005-with-agg-where-sum"
    description: "WITH clause with sum() aggregation and WHERE filter"
    args: ["query", "-"]
    stdin: |
      CREATE (a:Product {name: 'Widget', category: 'A', price: 10});
      CREATE (b:Product {name: 'Gadget', category: 'A', price: 20});
      CREATE (c:Product {name: 'Gizmo', category: 'B', price: 5});
      MATCH (p:Product) WITH p.category AS cat, sum(p.price) AS total WHERE total > 10 RETURN cat, total
    expect:
      exit_code: 0
      stdout_contains: ["A", "30"]
    tags: ["gap-0005", "with", "aggregation", "sum"]

  - name: "gap-0005-with-agg-where-avg"
    description: "WITH clause with avg() aggregation and WHERE filter"
    args: ["query", "-"]
    stdin: |
      CREATE (a:Score {student: 'Alice', value: 90});
      CREATE (b:Score {student: 'Bob', value: 80});
      CREATE (c:Score {student: 'Carol', value: 70});
      MATCH (s:Score) WITH avg(s.value) AS average WHERE average > 75 RETURN average
    expect:
      exit_code: 0
      stdout_contains: ["80"]
    tags: ["gap-0005", "with", "aggregation", "avg"]

  - name: "gap-0005-with-group-having-style"
    description: "WITH clause simulating GROUP BY HAVING"
    args: ["query", "-"]
    stdin: |
      CREATE (a:Order {customer: 'Alice', amount: 100});
      CREATE (b:Order {customer: 'Alice', amount: 200});
      CREATE (c:Order {customer: 'Bob', amount: 50});
      MATCH (o:Order) WITH o.customer AS customer, count(*) AS order_count WHERE order_count >= 2 RETURN customer, order_count
    expect:
      exit_code: 0
      stdout_contains: ["Alice", "2"]
    tags: ["gap-0005", "with", "group-by", "having"]

  # =============================================================================
  # GAP-0006: CASE Expressions in MATCH Context
  # =============================================================================

  - name: "gap-0006-case-simple"
    description: "Simple CASE expression"
    args: ["query", "-"]
    stdin: "RETURN CASE WHEN 5 > 3 THEN 'yes' ELSE 'no' END AS result"
    expect:
      exit_code: 0
      stdout_contains: ["yes"]
    tags: ["gap-0006", "case", "simple"]

  - name: "gap-0006-case-multiple-when"
    description: "CASE expression with multiple WHEN clauses"
    args: ["query", "-"]
    stdin: |
      WITH 75 AS score
      RETURN CASE
        WHEN score >= 90 THEN 'A'
        WHEN score >= 80 THEN 'B'
        WHEN score >= 70 THEN 'C'
        WHEN score >= 60 THEN 'D'
        ELSE 'F'
      END AS grade
    expect:
      exit_code: 0
      stdout_contains: ["C"]
    tags: ["gap-0006", "case", "multiple-when"]

  - name: "gap-0006-case-in-match"
    description: "CASE expression in MATCH context"
    args: ["query", "-"]
    stdin: |
      CREATE (a:Person {name: 'Alice', age: 25});
      CREATE (b:Person {name: 'Bob', age: 45});
      CREATE (c:Person {name: 'Carol', age: 65});
      MATCH (n:Person) RETURN n.name AS name, CASE WHEN n.age < 30 THEN 'young' WHEN n.age < 60 THEN 'middle' ELSE 'senior' END AS category ORDER BY name
    expect:
      exit_code: 0
      stdout_contains: ["Alice", "young", "Bob", "middle", "Carol", "senior"]
    tags: ["gap-0006", "case", "match"]

  - name: "gap-0006-case-null-handling"
    description: "CASE expression with NULL handling"
    args: ["query", "-"]
    stdin: |
      WITH null AS value
      RETURN CASE WHEN value IS NULL THEN 'missing' ELSE 'present' END AS status
    expect:
      exit_code: 0
      stdout_contains: ["missing"]
    tags: ["gap-0006", "case", "null"]

  - name: "gap-0006-case-nested"
    description: "Nested CASE expressions"
    args: ["query", "-"]
    stdin: |
      WITH 'A' AS type, 100 AS value
      RETURN CASE
        WHEN type = 'A' THEN CASE WHEN value > 50 THEN 'A-high' ELSE 'A-low' END
        ELSE 'other'
      END AS result
    expect:
      exit_code: 0
      stdout_contains: ["A-high"]
    tags: ["gap-0006", "case", "nested"]

  - name: "gap-0006-case-with-functions"
    description: "CASE expression with function calls"
    args: ["query", "-"]
    stdin: |
      WITH [1, 2, 3, 4, 5] AS list
      RETURN CASE WHEN size(list) > 3 THEN 'large' ELSE 'small' END AS list_size
    expect:
      exit_code: 0
      stdout_contains: ["large"]
    tags: ["gap-0006", "case", "functions"]

  # =============================================================================
  # Integration Tests - Combined Features
  # =============================================================================

  - name: "integration-list-regex-combined"
    description: "Combine list functions with regex matching"
    args: ["query", "-"]
    stdin: |
      WITH ['Alice', 'Amanda', 'Bob', 'Carol'] AS names
      RETURN head(names) AS first, last(names) AS final, head(names) =~ 'A.*' AS first_starts_with_a
    expect:
      exit_code: 0
      stdout_contains: ["Alice", "Carol", "true"]
    tags: ["integration", "list", "regex"]

  - name: "integration-values-case-combined"
    description: "Combine VALUES with CASE expression"
    args: ["query", "-"]
    stdin: |
      VALUES (85), (72), (91), (58), (76) AS (score)
      RETURN score, CASE
        WHEN score >= 90 THEN 'A'
        WHEN score >= 80 THEN 'B'
        WHEN score >= 70 THEN 'C'
        WHEN score >= 60 THEN 'D'
        ELSE 'F'
      END AS grade
    expect:
      exit_code: 0
      stdout_contains: ["85", "B", "72", "C", "91", "A", "58", "F", "76", "C"]
    tags: ["integration", "values", "case"]

  - name: "integration-datetime-case-combined"
    description: "Combine DateTime properties with CASE"
    args: ["query", "-"]
    stdin: |
      WITH datetime('2024-12-25T10:30:00') AS dt
      RETURN CASE
        WHEN dt.month = 12 THEN 'December'
        WHEN dt.month = 1 THEN 'January'
        ELSE 'Other'
      END AS month_name
    expect:
      exit_code: 0
      stdout_contains: ["December"]
    tags: ["integration", "datetime", "case"]

  - name: "integration-with-agg-list-combined"
    description: "Combine WITH aggregation with list collection"
    args: ["query", "-"]
    stdin: |
      CREATE (a:Item {category: 'A', value: 10});
      CREATE (b:Item {category: 'A', value: 20});
      CREATE (c:Item {category: 'B', value: 30});
      MATCH (i:Item) WITH i.category AS cat, collect(i.value) AS values WHERE size(values) > 1 RETURN cat, values, size(values) AS count
    expect:
      exit_code: 0
      stdout_contains: ["A", "10", "20", "2"]
    tags: ["integration", "with", "list", "aggregation"]

  # =============================================================================
  # Edge Cases and Error Handling
  # =============================================================================

  - name: "edge-head-nested-list"
    description: "head() on nested list"
    args: ["query", "-"]
    stdin: "WITH [[1, 2], [3, 4], [5, 6]] AS nested RETURN head(nested) AS first"
    expect:
      exit_code: 0
      stdout_contains: ["1", "2"]
    tags: ["edge-case", "list", "nested"]

  - name: "edge-regex-special-chars"
    description: "Regex with escaped special characters"
    args: ["query", "-"]
    stdin: "WITH 'price: $10.00' AS text RETURN text =~ '.*\\$[0-9]+.*' AS has_price"
    expect:
      exit_code: 0
      stdout_json_assert:
        - expression: "results[0].has_price"
          equals: true
    tags: ["edge-case", "regex", "escape"]

  - name: "edge-values-single"
    description: "VALUES with single value"
    args: ["query", "-"]
    stdin: "VALUES (42) AS (answer) RETURN answer AS answer"
    expect:
      exit_code: 0
      stdout_json_assert:
        - expression: "results[0].answer"
          equals: 42
    tags: ["edge-case", "values", "single"]

  - name: "edge-datetime-boundary"
    description: "DateTime with year boundary"
    args: ["query", "-"]
    stdin: "WITH datetime('2024-12-31T23:59:59') AS dt RETURN dt.year AS y, dt.month AS m, dt.day AS d, dt.hour AS h"
    expect:
      exit_code: 0
      stdout_json_assert:
        - expression: "results[0].y"
          equals: 2024
        - expression: "results[0].m"
          equals: 12
        - expression: "results[0].d"
          equals: 31
        - expression: "results[0].h"
          equals: 23
    tags: ["edge-case", "datetime", "boundary"]

  - name: "edge-case-else-only"
    description: "CASE with only ELSE (no WHEN matches)"
    args: ["query", "-"]
    stdin: |
      WITH 'unknown' AS status
      RETURN CASE
        WHEN status = 'active' THEN 1
        WHEN status = 'inactive' THEN 0
        ELSE -1
      END AS code
    expect:
      exit_code: 0
      stdout_json_assert:
        - expression: "results[0].code"
          equals: -1
    tags: ["edge-case", "case", "else"]

  # =============================================================================
  # GAP-0013: 2PC Network Transport (QUIC-based distributed transactions)
  # =============================================================================

  - name: "gap-0013-session-transaction-info"
    description: "Query session and transaction state information"
    args: ["query", "-"]
    stdin: "RETURN session.transaction_id AS txn_id, session.transaction_state AS state"
    expect:
      exit_code: 0
      stdout_contains: ["txn_id", "state"]
    tags: ["gap-0013", "transaction", "session"]

  - name: "gap-0013-explicit-transaction-begin"
    description: "Begin an explicit transaction"
    args: ["query", "-"]
    stdin: |
      BEGIN;
      CREATE (n:TxnTest {id: 1});
      COMMIT;
      MATCH (n:TxnTest) RETURN n.id AS id
    expect:
      exit_code: 0
      stdout_contains: ["1"]
    tags: ["gap-0013", "transaction", "explicit"]

  - name: "gap-0013-transaction-rollback"
    description: "Transaction rollback preserves data integrity"
    args: ["query", "-"]
    stdin: |
      BEGIN;
      CREATE (n:RollbackTest {id: 999});
      ROLLBACK;
      MATCH (n:RollbackTest {id: 999}) RETURN count(n) AS cnt
    expect:
      exit_code: 0
      stdout_contains: ["0"]
    tags: ["gap-0013", "transaction", "rollback"]

  - name: "gap-0013-distributed-config-info"
    description: "Query distributed configuration availability"
    args: ["query", "-"]
    stdin: "RETURN 'quic_transport' AS feature, true AS available"
    expect:
