version: '1.0'
name: GQL Edge MERGE
description: 'Tests that MERGE handles edge patterns between existing nodes (GAP #58)'
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 30000
    cleanup: true
    args:
    - --log-level
    - info
  client:
    timeout_ms: 15000
    tls_verify: false
    format: json
tests:
- name: setup-edge-merge-nodes
  description: Create source and target nodes
  args:
  - query
  - --batch
  - '-'
  stdin: |
    CREATE (a:EM {name: 'A'})
    CREATE (b:EM {name: 'B'})
  expect:
    exit_code: 0
  tags:
  - merge
  - edge
  - setup

- name: merge-edge-no-parse-error
  description: MERGE edge pattern should not return parse error
  args:
  - query
  - "MATCH (a:EM {name: 'A'}), (b:EM {name: 'B'}) MERGE (a)-[:FRIENDS]->(b)"
  expect:
    exit_code: 0
  tags:
  - merge
  - edge

- name: merge-edge-verify
  description: Verify the edge was created
  args:
  - query
  - MATCH (a:EM)-[r:FRIENDS]->(b:EM) RETURN a.name AS from_name, b.name AS to_name
  expect:
    exit_code: 0
    stdout_json_assert:
    - expression: results[0].from_name
      equals: A
    - expression: results[0].to_name
      equals: B
  tags:
  - merge
  - edge
  - verify
