version: '1.0'
name: Migration QUIC Connection Stability Tests
description: Tests for migration QUIC client connection stability - verifies heap-allocated client prevents dangling allocator pointers
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 30000
    cleanup: true
    args:
    - --log-level
    - info
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 30000
    tls_verify: false
    format: json
tests:
- name: migrate-status-no-crash
  description: Migration status should not crash
  args:
  - migrate
  - status
  - --dir
  - tests/fixtures/migrations
  expect:
    exit_code: 0
    stdout_contains:
    - Migration status
  tags:
  - migration
  - quic
  - stability
  - status
- name: migrate-run-with-server
  description: Migration run with server connection (tests QUIC stream opening)
  args:
  - migrate
  - run
  - --dir
  - tests/fixtures/migrations
  - --server
  - ${GEODE_SERVER_ADDRESS}
  - --insecure-tls-skip-verify
  - --user
  - geode
  - --password
  - ${GEODE_ADMIN_PASSWORD}
  expect:
    exit_code: 0
  tags:
  - migration
  - quic
  - stability
  - server
- name: migrate-repeated-connections
  description: Multiple migration status checks should not cause memory corruption
  args:
  - migrate
  - status
  - --dir
  - tests/fixtures/migrations
  repeat: 3
  expect:
    exit_code: 0
    stdout_contains:
    - Migration status
  tags:
  - migration
  - quic
  - stability
  - repeated
- name: migrate-nonexistent-dir
  description: Migration with nonexistent directory should fail gracefully (not crash)
  args:
  - migrate
  - status
  - --dir
  - /dev/null/nonexistent/migrations
  expect:
    exit_code: 1
    stderr_contains:
    - FileSystemError
  tags:
  - migration
  - error-handling
  - stability
- name: migrate-empty-dir
  description: Migration with empty directory should report no migrations
  args:
  - migrate
  - status
  - --dir
  - tests/fixtures/data
  expect:
    exit_code: 0
    stdout_contains:
    - 'Applied: 0'
    - 'Pending: 0'
  tags:
  - migration
  - empty
  - stability
- name: migrate-help-no-crash
  description: Migration help should display without crash
  args:
  - migrate
  - --help
  expect:
    exit_code: 0
    stderr_contains:
    - Database migration operations
    - status
    - run
    - create
  tags:
  - migration
  - help
  - stability
- name: migrate-create-temp
  description: Migration create should work without crash
  args:
  - migrate
  - create
  - test_stability
  - --dir
  - /tmp/geode_migration_test
  expect:
    exit_code: 0
    stdout_contains:
    - Created migration file
  tags:
  - migration
  - create
  - stability
