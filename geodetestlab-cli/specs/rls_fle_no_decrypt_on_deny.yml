version: '1.0'
name: RLS × FLE — no decrypt occurs when RLS denies the row
description: |
  Verifies the interaction between the RLS deny filter
  (src/server/rls_filter.zig / src/security/rls_types.zig) and Field-Level
  Encryption hooks (src/execution/fle_hooks.zig).

  The expected order of operations is:
  1. Query executor enumerates candidate rows under the read view.
  2. The RLS engine evaluates label-level deny policies and removes denied
     rows BEFORE they are projected to the caller.
  3. FLE decrypt hooks fire only for rows that survive the RLS filter.

  If RLS fires FIRST (correct behaviour), the FLE decrypt hook for a denied
  row never runs — bob simply sees zero rows, not "[REDACTED]". That is
  the assertion this spec pins.

  The label-level deny is installed via `CALL geode.rls.add_deny_policy(
  'rls_fle', 'FleDoc', 'rls_fle_bob')` — landed in src/execution/rls_dispatch.zig.

  CANARY: REQ=REQ-RLS-FLE-001; FEATURE="RLS x FLE no-decrypt-on-deny"; ASPECT=RlsBeforeFleDecrypt; STATUS=TESTED; OWNER=security; UPDATED=2026-05-22

cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 60000
    cleanup: true
    args: [--log-level, warn, --enable-fle]
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
      GEODE_FLE_ENABLED: 'true'
      GEODE_MASTER_KEY: rls-fle-test-master-key-32bytes!!
  client:
    timeout_ms: 30000
    format: json
secrets:
  admin_password:
    source: env
    key: GEODE_ADMIN_PASSWORD
    required: false
    default: Geode Test Admin Passphrase
invariants:
- type: server_running
fuzz:
  enabled: false

tests:
- name: rls-fle-preflight-cleanup
  args: [query, -U, geode, -P, '${secret:admin_password}', --batch, '-']
  stdin: |
    DROP GRAPH IF EXISTS rls_fle;
    DROP USER IF EXISTS rls_fle_bob;
  expect: {exit_code: 0}
  tags: [rls, fle, setup]

- name: rls-fle-create-graph-and-user
  args: [query, -U, geode, -P, '${secret:admin_password}', --batch, '-']
  stdin: |
    CREATE GRAPH rls_fle;
    CREATE USER rls_fle_bob SET PASSWORD 'Rls Fle Bob 12 Passphrase' ROLE readwrite;
  expect: {exit_code: 0}
  tags: [rls, fle, setup]

- name: rls-fle-seed
  args: [query, -U, geode, -P, '${secret:admin_password}', '-']
  stdin: |
    USE GRAPH rls_fle;
    CREATE (:FleDoc {id: 1, category: 'classified'});
  expect: {exit_code: 0}
  tags: [rls, fle, setup]

- name: rls-fle-add-deny-for-bob
  description: Label-level deny installed via geode.rls.add_deny_policy.
  args: [query, -U, geode, -P, '${secret:admin_password}', "CALL geode.rls.add_deny_policy('rls_fle', 'FleDoc', 'rls_fle_bob')"]
  expect: {exit_code: 0, stdout_contains: [deny policy added]}
  tags: [rls, fle, policy]

- name: rls-fle-bob-gets-zero-rows-key-assertion
  description: |
    KEY ASSERTION — bob must see zero rows AND no "[REDACTED]" sentinel.
    If FLE decrypt fired before RLS filtering, the result would contain
    [REDACTED] for the secret field; that would be a regression.
  args: [query, -U, rls_fle_bob, -P, Rls Fle Bob 12 Passphrase, '-']
  stdin: |
    USE GRAPH rls_fle;
    MATCH (d:FleDoc) RETURN d.id AS id
  expect:
    exit_code: 0
    stdout_not_contains: ['"id":1', REDACTED]
  tags: [rls, fle, bob, key-assertion]

- name: rls-fle-bob-count-zero
  description: Belt-and-braces — count from bob's side must be 0.
  args: [query, -U, rls_fle_bob, -P, Rls Fle Bob 12 Passphrase, '-']
  stdin: |
    USE GRAPH rls_fle;
    MATCH (d:FleDoc) RETURN count(d) AS c
  expect:
    exit_code: 0
    stdout_contains: ['"c":0']
  tags: [rls, fle, bob]

- name: rls-fle-admin-sees-row
  description: Admin must still see the row (super-user bypass).
  args: [query, -U, geode, -P, '${secret:admin_password}', '-']
  stdin: |
    USE GRAPH rls_fle;
    MATCH (d:FleDoc) RETURN d.id AS id
  expect:
    exit_code: 0
    stdout_contains: ['"id":1']
  tags: [rls, fle, admin]

- name: rls-fle-cleanup
  args: [query, -U, geode, -P, '${secret:admin_password}', --batch, '-']
  stdin: |
    DROP GRAPH IF EXISTS rls_fle;
    DROP USER IF EXISTS rls_fle_bob;
  expect: {exit_code: 0}
  tags: [rls, fle, teardown]

tags:
- rls
- fle
- field-level-encryption
- security
- rls-fle-interaction
