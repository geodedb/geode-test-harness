version: '1.0'
name: 2PC / Federation Cluster Token Enforcement (GAP-0321)
description: |
  GAP-0321: Verifies that the federation HELLO handshake rejects inter-node
  connections that present the wrong cluster token or no cluster token, and
  accepts connections carrying the correct token.

  CANARY: REQ=GAP-0321; FEATURE="Cluster token enforcement"; ASPECT=FederationHandshakeAuth; STATUS=TESTED; OWNER=security; UPDATED=2026-05-21

  Test strategy
  -------------
  The cluster token is checked in quic_connection_handler.zig:validateFederationAuth
  (GAP-0490). A federation node identifies itself by using username
  "geode-cluster" and supplies the GEODE_CLUSTER_TOKEN as the password.

  The `geode query` CLI's -U / -P flags map directly to the HELLO username /
  password fields, making the federation handshake testable without a second
  geode process: any client can attempt to authenticate as "geode-cluster".

  Sub-cases:
    A. Correct token    → HELLO succeeds, query executes  (exit 0)
    B. Wrong token      → HELLO fails "Authentication failed" (exit 3)
    C. No token (empty) → HELLO fails "Authentication failed" (exit 3)
    D. Normal user after failed cluster-token attempts → server still accepts
       the legitimate geode admin user  (exit 0, server stable)

  The server is started with GEODE_CLUSTER_TOKEN=geode-cluster-token-2026.

cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 60000
    cleanup: true
    args:
    - --log-level
    - warn
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
      GEODE_CLUSTER_TOKEN: geode-cluster-token-2026
  client:
    timeout_ms: 30000
    format: json

invariants:
- type: server_running

tests:
# -----------------------------------------------------------------------
# Sub-case A: Correct cluster token is accepted
# -----------------------------------------------------------------------
- name: cluster-token-correct-accepted
  description: |
    A client presenting username "geode-cluster" with the correct
    GEODE_CLUSTER_TOKEN value must be authenticated and able to execute
    a query. This is the positive control: the validation path that a
    legitimate federation node takes.
  args:
  - query
  - RETURN 'cluster_auth_ok' AS result
  - -U
  - geode-cluster
  - -P
  - geode-cluster-token-2026
  - --no-saved-session
  expect:
    exit_code: 0
    stdout_contains:
    - cluster_auth_ok
  tags:
  - distributed
  - 2pc
  - cluster-token
  - auth
  - positive-control
  - gap-0321

# -----------------------------------------------------------------------
# Sub-case B: Wrong cluster token is rejected
# -----------------------------------------------------------------------
- name: cluster-token-wrong-rejected
  description: |
    A client presenting "geode-cluster" with a token that does not match
    GEODE_CLUSTER_TOKEN must be rejected. The server must return exit code 3
    ("Authentication failed") and no query data. Validates the timing-safe
    comparison in validateFederationAuth (SEC-07).
  args:
  - query
  - RETURN 1 AS v
  - -U
  - geode-cluster
  - -P
  - wrong-token-xyz-should-fail
  - --no-saved-session
  expect:
    exit_code: 3
    stderr_contains:
    - Authentication failed
  tags:
  - distributed
  - 2pc
  - cluster-token
  - auth
  - rejection
  - sec-07
  - gap-0321

# -----------------------------------------------------------------------
# Sub-case C: Empty password with cluster username is rejected
# -----------------------------------------------------------------------
- name: cluster-token-empty-password-rejected
  description: |
    The server must reject "geode-cluster" with an empty password. The
    validateFederationAuth function explicitly checks password.len == 0 and
    returns false (cluster_auth.zig:22). This validates the empty-token
    guard without a timing-side-channel risk.
  args:
  - query
  - RETURN 1 AS v
  - -U
  - geode-cluster
  - -P
  - ''
  - --no-saved-session
  expect:
    exit_code: 3
  tags:
  - distributed
  - 2pc
  - cluster-token
  - auth
  - empty-password
  - gap-0321

# -----------------------------------------------------------------------
# Sub-case D: Server stable — legitimate admin still works after rejections
# -----------------------------------------------------------------------
- name: cluster-token-server-stable-after-rejections
  description: |
    After the two failed cluster-token authentication attempts above, the
    server must still accept the geode admin user normally. Validates that
    failed federation auth does not corrupt server state, exhaust connection
    slots, or trigger a crash/hang (i.e., the server is not denial-of-serviced
    by malformed cluster-token probes). This also confirms the rate-limiter
    does not block the legitimate user if the IP was flagged by failed
    cluster-auth attempts (rate limiter fires on password failures, not
    username mismatches for federation).
  args:
  - query
  - '-'
  stdin: |
    RETURN 'server_stable_after_cluster_auth_rejections' AS health_check
  expect:
    exit_code: 0
    stdout_contains:
    - server_stable_after_cluster_auth_rejections
  tags:
  - distributed
  - 2pc
  - cluster-token
  - stability
  - server-stable
  - gap-0321

# -----------------------------------------------------------------------
# Sub-case E (server started WITHOUT GEODE_CLUSTER_TOKEN rejects every
# "geode-cluster" HELLO) needs a token-absent server env. The harness
# manages one server env per spec, so that case lives in its own spec
# file: 2pc_cluster_token_absent.yml.
# -----------------------------------------------------------------------

tags:
- distributed
- 2pc
- cluster-token
- federation-auth
- security
- sec-07
- gap-0321
