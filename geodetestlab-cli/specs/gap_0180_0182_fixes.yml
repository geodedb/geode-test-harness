# GAP-0180, GAP-0181, GAP-0182 Fix Verification Tests
# Tests to verify fixes for:
# - GAP-0180: QUIC execution uses shared catalog singleton
# - GAP-0181: Backup/restore protocol uses real LSN and actual restore
# - GAP-0182: Complex path variable assignment GQL compliance

version: "1.0"
name: "GAP-0180 through GAP-0182 Fix Verification"
description: "Verification tests for resolved gaps"

cli:
  binary: "./zig-out/bin/geode"
  working_dir: null
  env:
    GEODE_LOG_LEVEL: "info"
  server:
    enabled: true
    port: null  # Auto-allocate
    data_dir: null  # Use temporary directory
    startup_timeout_ms: 60000
    cleanup: true
    args: ["--log-level", "info"]
    env: {}
  client:
    server_address: "127.0.0.1:3141"
    timeout_ms: 30000
    tls_verify: false
    format: "json"

secrets:
  admin_password:
    source: "env"
    key: "GEODE_ADMIN_PASSWORD"
    required: false

invariants:
  - type: "server_running"

fuzz:
  enabled: false

tests:
  # ==============================================================
  # GAP-0182: Complex Path Variable Assignment Tests
  # ==============================================================

  - name: "gap-0182-setup-person-chain"
    description: "Setup test data: chain of Person nodes connected by KNOWS"
    args: ["query", "-"]
    stdin: |
      CREATE (alice:Person {name: 'Alice'});
      CREATE (bob:Person {name: 'Bob'});
      CREATE (charlie:Person {name: 'Charlie'});
      CREATE (diana:Person {name: 'Diana'});
      CREATE (eve:Person {name: 'Eve'});
      MATCH (a:Person {name: 'Alice'}), (b:Person {name: 'Bob'}) CREATE (a)-[:KNOWS]->(b);
      MATCH (a:Person {name: 'Bob'}), (b:Person {name: 'Charlie'}) CREATE (a)-[:KNOWS]->(b);
      MATCH (a:Person {name: 'Charlie'}), (b:Person {name: 'Diana'}) CREATE (a)-[:KNOWS]->(b);
      MATCH (a:Person {name: 'Diana'}), (b:Person {name: 'Eve'}) CREATE (a)-[:KNOWS]->(b);
      RETURN 'Setup complete' AS status
    expect:
      exit_code: 0
    tags: ["gap-0182", "setup"]

  - name: "gap-0182-simple-path-variable"
    description: "Test simple path variable assignment (baseline)"
    args: ["query", "-"]
    stdin: "MATCH path = (a)-[*1..2]->(b) RETURN count(*) AS path_count"
    expect:
      exit_code: 0
      geode_query:
        columns: ["path_count"]
    tags: ["gap-0182", "path", "baseline"]

  - name: "gap-0182-path-with-labels-only"
    description: "Test path variable with node labels (baseline)"
    args: ["query", "-"]
    stdin: "MATCH path = (a:Person)-[:KNOWS]->(b:Person) RETURN a.name AS from_name, b.name AS to_name"
    expect:
      exit_code: 0
      geode_query:
        columns: ["from_name", "to_name"]
    tags: ["gap-0182", "path", "labels", "baseline"]

  - name: "gap-0182-complex-path-length"
    description: "Test complex path variable with length() - THE ORIGINALLY FAILING CASE"
    args: ["query", "-"]
    stdin: "MATCH path = (a:Person)-[:KNOWS*1..3]->(b:Person) RETURN a.name AS from_name, b.name AS to_name, length(path) AS hops"
    expect:
      exit_code: 0
      geode_query:
        columns: ["from_name", "to_name", "hops"]
    tags: ["gap-0182", "path", "complex", "length", "critical"]

  - name: "gap-0182-path-length-with-specific-range"
    description: "Test path variable with specific range *2..4 and length()"
    args: ["query", "-"]
    stdin: "MATCH path = (a:Person)-[:KNOWS*2..4]->(b:Person) RETURN a.name AS from_name, b.name AS to_name, length(path) AS hops"
    expect:
      exit_code: 0
      geode_query:
        columns: ["from_name", "to_name", "hops"]
    tags: ["gap-0182", "path", "complex", "range"]

  - name: "gap-0182-path-with-where-clause"
    description: "Test complex path with WHERE filter"
    args: ["query", "-"]
    stdin: "MATCH path = (a:Person)-[:KNOWS*1..3]->(b:Person) WHERE a.name = 'Alice' RETURN b.name AS reachable, length(path) AS distance"
    expect:
      exit_code: 0
      geode_query:
        columns: ["reachable", "distance"]
    tags: ["gap-0182", "path", "where"]

  - name: "gap-0182-path-order-by-length"
    description: "Test path variable with ORDER BY on length()"
    args: ["query", "-"]
    stdin: "MATCH path = (a:Person)-[:KNOWS*1..3]->(b:Person) RETURN a.name AS from_name, b.name AS to_name, length(path) AS hops ORDER BY hops ASC LIMIT 5"
    expect:
      exit_code: 0
      geode_query:
        columns: ["from_name", "to_name", "hops"]
    tags: ["gap-0182", "path", "order"]

  # ==============================================================
  # GAP-0180: QUIC Catalog Singleton Tests
  # ==============================================================

  - name: "gap-0180-catalog-persistence-create"
    description: "Verify catalog changes persist (create)"
    args: ["query", "-"]
    stdin: "CREATE (n:Gap180TestNode {testId: 1}) RETURN n.testId AS id"
    expect:
      exit_code: 0
      geode_query:
        columns: ["id"]
    tags: ["gap-0180", "catalog"]

  - name: "gap-0180-catalog-persistence-query"
    description: "Verify catalog changes persist across queries"
    args: ["query", "-"]
    stdin: "MATCH (n:Gap180TestNode {testId: 1}) RETURN n.testId AS id"
    expect:
      exit_code: 0
      geode_query:
        columns: ["id"]
    tags: ["gap-0180", "catalog"]

  # ==============================================================
  # GAP-0181: Backup/Restore Protocol Tests
  # Note: Full backup/restore tests are in backup_restore_operations.yml
  # ==============================================================

  - name: "gap-0181-backup-cli-help"
    description: "Verify backup CLI parses correctly"
    args: ["backup", "--help"]
    expect:
      exit_code: 0
      stdout_contains: ["backup", "create", "list"]
    tags: ["gap-0181", "backup", "cli"]

  # ==============================================================
  # Regression Tests - Ensure Fixes Don't Break Existing Functionality
  # ==============================================================

  - name: "regression-simple-match"
    description: "Verify simple MATCH still works"
    args: ["query", "-"]
    stdin: "MATCH (n:Person) RETURN n.name AS name LIMIT 3"
    expect:
      exit_code: 0
      geode_query:
        columns: ["name"]
    tags: ["regression"]

  - name: "regression-relationship-match"
    description: "Verify single-hop relationship MATCH still works"
    args: ["query", "-"]
    stdin: "MATCH (a:Person)-[:KNOWS]->(b:Person) RETURN a.name AS from_name, b.name AS to_name LIMIT 3"
    expect:
      exit_code: 0
      geode_query:
        columns: ["from_name", "to_name"]
    tags: ["regression"]

  - name: "regression-path-return"
    description: "Verify simple path return still works"
    args: ["query", "-"]
    stdin: "MATCH path = (a:Person)-[:KNOWS]->(b:Person) RETURN path LIMIT 1"
    expect:
      exit_code: 0
      geode_query:
        columns: ["path"]
    tags: ["regression"]
