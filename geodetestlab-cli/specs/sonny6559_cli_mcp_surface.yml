version: '1.0'
name: SONNY-6559 completion script on stdout; MCP tools/resources/error codes against a real server
description: |
  Ticket: SONNY-6559.
  Bug: `geode completion` wrote the script to stderr and ignored the shell named as
  an argument; the MCP library mapped ToolNotFound/PromptNotFound to -32002; the
  `catalogs` tool always failed (SHOW CATALOGS is not geode syntax); the advertised
  node/{label} and relationship/{type} resource templates answered not-found; any URI
  holding "config" or "/schema" matched.
  Spec proves on the real binary: `geode completion [--shell|-s] bash|zsh|fish|
  powershell|pwsh` and `completions bash` print the script to stdout (> 100 bytes,
  mentions geode) with an EMPTY stderr, and `completion zsh` equals `completion
  --shell zsh` and differs from the bash script; a real `geode mcp --stdio` against a
  real `geode serve`: tools/list no longer advertises `catalogs` and calling it is
  -32602 (not -32002), the advertised templates read without -32002 (schema, stats,
  node/<label>, relationship/<type>, geode://config), and malformed or foreign URIs
  are -32002.

single_node_only: true  # each step starts its own private geode server / offline CLI: no harness server

cli:
  binary: ./zig-out/bin/geode
  env:
    GEODE_LOG_LEVEL: warn
  server:
    enabled: false
  client:
    timeout_ms: 420000
    tls_verify: false
    format: json

invariants: []

fuzz:
  enabled: false

tests:

- name: sonny6559-completion-script-on-stdout
  type: bash
  command: |
    BIN="${GEODE_BINARY:-geode}"
    H=$(mktemp -d); trap 'rm -rf "$H"' EXIT
    run() { HOME="$H" "$BIN" "$@" >"$H/out" 2>"$H/err" </dev/null; RC=$?
      [ "$RC" -eq 0 ] || { echo "FAIL geode $* rc=$RC"; cat "$H/err"; exit 1; }
      [ "$(wc -c <"$H/out")" -gt 100 ] && grep -q geode "$H/out" || { echo "FAIL geode $*: stdout is not a script"; exit 1; }
      [ ! -s "$H/err" ] || { echo "FAIL geode $*: wrote to stderr:"; head -c 300 "$H/err"; exit 1; }
    }
    for a in "completion" "completion --shell bash" "completion --shell zsh" "completion --shell fish" "completion --shell powershell" "completion -s pwsh" "completions --shell bash"; do run $a; done
    HOME="$H" "$BIN" completion bash >"$H/bash" 2>/dev/null; HOME="$H" "$BIN" completion zsh >"$H/zsh" 2>/dev/null; HOME="$H" "$BIN" completion --shell zsh >"$H/zsh2" 2>/dev/null
    cmp -s "$H/zsh" "$H/zsh2" || { echo "FAIL 'completion zsh' differs from 'completion --shell zsh'"; exit 1; }
    cmp -s "$H/bash" "$H/zsh" && { echo "FAIL 'completion zsh' printed the bash script"; exit 1; }
    echo "COMPLETION_OK"

  timeout_ms: 420000
  expect:
    exit_code: 0
    stdout_contains: [COMPLETION_OK]
  tags: [cli, sonny6559]

- name: sonny6559-mcp-tools-resources-and-codes
  type: bash
  command: |
    BIN="${GEODE_BINARY:-geode}"
    export GEODE_ENABLE_MFA=1 GEODE_ALLOW_INSECURE_TLS=1 GEODE_DATA_DIR_LOCK_TIMEOUT_MS=0
    D=$(mktemp -d); H="$D/home"; mkdir -p "$H"
    PW='Geode Test Admin Passphrase'
    SD="$D/srv"; mkdir -p "$SD"
    PORT=$(python3 -c 'import socket;s=socket.socket();s.bind(("127.0.0.1",0));print(s.getsockname()[1])')
    ADDR="127.0.0.1:$PORT"
    SPID=""
    cleanup() { [ -n "$SPID" ] && kill -9 "$SPID" 2>/dev/null; rm -rf "$D"; }
    trap cleanup EXIT
    q() { "$BIN" query --server "$ADDR" --insecure-tls-skip-verify -U geode -P "$PW" "$1" 2>&1; }
    privstart() {
     GEODE_ADMIN_PASSWORD="$PW" "$BIN" auth init --data-dir "$SD" >/dev/null 2>&1 || { echo "FAIL auth init"; exit 1; }
     start
    }
    start() { "$BIN" serve --listen "$ADDR" --data-dir "$SD" --log-level warn >>"$D/srv.log" 2>&1 & SPID=$!
     for i in $(seq 1 120); do q "RETURN 1" | grep -q '"rows"' && return 0; kill -0 "$SPID" 2>/dev/null || break; sleep 0.5; done
     echo "FAIL server did not start"; tail -20 "$D/srv.log"; exit 1; }
    stop() { kill -TERM "$SPID" 2>/dev/null; wait "$SPID" 2>/dev/null; SPID=""; }
    kill9() { kill -9 "$SPID" 2>/dev/null; wait "$SPID" 2>/dev/null; SPID=""; }
    totp() { python3 - "$1" <<'PY'
    import sys,hmac,hashlib,struct,time,base64
    s=sys.argv[1].strip().upper(); s+='='*(-len(s)%8)
    k=base64.b32decode(s)
    h=hmac.new(k,struct.pack('>Q',int(time.time())//30),hashlib.sha1).digest()
    o=h[-1]&15
    print('%06d'%((struct.unpack('>I',h[o:o+4])[0]&0x7fffffff)%1000000))
    PY
    }
    want() { echo "$2" | grep -q "\"error_code\":\"$3\"" || { echo "FAIL $1: want error_code $3"; echo "$2"; exit 1; }; }
    ok() { echo "$2" | grep -q '"error_code"' && { echo "FAIL $1: unexpected error"; echo "$2"; exit 1; }; return 0; }
    enrol() { # user -> SECRET
     ok "create $1" "$(q "CREATE USER $1 SET PASSWORD 'Correct Horse Battery Staple 6623'")"
     O=$(q "CALL geode.auth.mfa_setup('$1')"); ok "setup $1" "$O"
     SECRET=$(echo "$O" | grep -o 'MFA secret: [A-Z2-7]*' | head -1 | sed 's/MFA secret: //')
     [ -n "$SECRET" ] || { echo "FAIL no secret for $1"; echo "$O"; exit 1; }
    }
    privstart

    PWE=$(python3 -c "import urllib.parse,sys;print(urllib.parse.quote(sys.argv[1],safe=''))" "$PW")
    EP="quic://$ADDR?insecure=true&user=geode&pass=$PWE"
    python3 - "$BIN" "$H" "$EP" <<'PY'
    import subprocess, sys, json, os
    binp, home, ep = sys.argv[1:4]
    reads = ["geode://default/default/schema", "geode://default/default/stats", "geode://default/default/node/Sonny6559",
             "geode://default/default/relationship/KNOWS6559", "geode://config"]
    bad = ["geode://config/extra", "geode://xconfig", "geode://configuration", "geode://default/default/schemax",
           "geode://default/default/schema/extra", "geode://other/default/schema", "geode://default/default/edge/KNOWS",
           "geode://default/default/relationship/a/b", "geode://config?x=1"]
    msgs = [{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-11-25","capabilities":{},"clientInfo":{"name":"sonny6559","version":"1.0"}}},
            {"jsonrpc":"2.0","method":"notifications/initialized"},
            {"jsonrpc":"2.0","id":2,"method":"tools/list"},
            {"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"catalogs","arguments":{}}},
            {"jsonrpc":"2.0","id":4,"method":"resources/templates/list"}]
    for i, u in enumerate(reads): msgs.append({"jsonrpc":"2.0","id":100+i,"method":"resources/read","params":{"uri":u}})
    for i, u in enumerate(bad):   msgs.append({"jsonrpc":"2.0","id":200+i,"method":"resources/read","params":{"uri":u}})
    inp = "".join(json.dumps(m) + "\n" for m in msgs)
    r = subprocess.run([binp, "mcp", "--stdio", "--no-auth", "--endpoint", ep], input=inp, capture_output=True, text=True, timeout=150, env=dict(os.environ, HOME=home, GEODE_LSP_PORT="0"))
    got = {}
    for line in r.stdout.splitlines():
        try: m = json.loads(line)
        except Exception: continue
        if "id" in m: got[m["id"]] = m
    def err(i): return got[i].get("error", {}).get("code") if i in got else "no-response"
    names = [t["name"] for t in got[2]["result"]["tools"]]
    assert "catalogs" not in names, "tools/list still advertises catalogs: %s" % names
    assert err(3) == -32602, "calling the removed catalogs tool answered %r, want -32602" % err(3)
    tpl = [t["uriTemplate"] for t in got[4]["result"]["resourceTemplates"]]
    for want in ("geode://{catalog}/{graph}/schema", "geode://{catalog}/{graph}/stats", "geode://{catalog}/{graph}/node/{label}", "geode://{catalog}/{graph}/relationship/{type}"):
        assert want in tpl, "template %s not advertised: %s" % (want, tpl)
    for i, u in enumerate(reads):
        assert 100+i in got and "error" not in got[100+i], "advertised resource %s did not read: %s" % (u, got.get(100+i))
    for i, u in enumerate(bad):
        assert err(200+i) == -32002, "%s answered %r, want -32002" % (u, err(200+i))
    print("MCP_SURFACE_OK")
    PY

  timeout_ms: 420000
  expect:
    exit_code: 0
    stdout_contains: [MCP_SURFACE_OK]
  tags: [mcp, sonny6559]
