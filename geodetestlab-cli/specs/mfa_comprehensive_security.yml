  - edge-case
  - setup
- name: mfa-edge-invalid-code-too-short
  description: TOTP code with less than 6 digits should return error in JSON
  args:
  - user
  - mfa
  - enable
  - mfa_invalid_code
  - --code
  - '123'
  expect:
    exit_code: 1
    stdout_contains:
    - '"status_class":"22023"'
    - Invalid arguments for function (an argument value the functi
  tags:
  - mfa
  - edge-case
  - invalid-code
- name: mfa-edge-invalid-code-too-long
  description: TOTP code with more than 6 digits should return error in JSON
  args:
  - user
  - mfa
  - enable
  - mfa_invalid_code
  - --code
  - '12345678'
  expect:
    exit_code: 1
    stdout_contains:
    - '"status_class":"22023"'
    - Invalid arguments for function (an argument value the functi
  tags:
  - mfa
  - edge-case
  - invalid-code
- name: mfa-edge-invalid-code-non-numeric
  description: TOTP code with non-numeric characters should return error in JSON
  args:
  - user
  - mfa
  - enable
  - mfa_invalid_code
  - --code
  - abcdef
  expect:
    exit_code: 1
    stdout_contains:
    - '"status_class":"22023"'
    - Invalid arguments for function (an argument value the functi
  tags:
  - mfa
  - edge-case
  - invalid-code
- name: mfa-edge-invalid-code-cleanup
  description: Clean up invalid code test user
  args:
  - user
  - delete
  - mfa_invalid_code
  - --yes
  expect:
    exit_code: 0
  tags:
  - mfa
  - cleanup
- name: mfa-edge-double-enable-user-create
