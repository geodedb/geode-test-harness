version: '1.0'
name: MFA Comprehensive Security Tests
description: "Testing of Geode's Multi-Factor Authentication (MFA) implementation.\n\nThis spec covers:\n- MFA enrollment workflows (mfa-setup command)\n- MFA enable/disable commands\n- TOTP code validation\n- Recovery code generation\n- Edge cases and error handling\n"
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 60000
    cleanup: true
    args:
    - --log-level
    - info
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
      GEODE_ENABLE_MFA: '1'
  client:
    timeout_ms: 30000
    format: json
invariants:
- type: server_running
tests:
- name: mfa-enrollment-basic-user-create
  description: Create test user for MFA enrollment tests
  args:
  - user
  - create
  - mfa_basic_user
  - mfa_basic@test.com
  - --password
  - Geode Mfa Basic Test Passphrase 2026 Passphrase
  expect:
    exit_code: 0
    stdout_contains:
    - mfa_basic_user
    - created
  tags:
  - mfa
  - enrollment
  - setup
- name: mfa-enrollment-generate-secret
  description: Generate MFA enrollment secret for user
  args:
  - user
  - mfa-setup
  - mfa_basic_user
  expect:
    exit_code: 0
    stdout_contains:
    - MFA secret
    - Recovery codes
  tags:
  - mfa
  - enrollment
  - secret-generation
- name: mfa-enrollment-show-provisioning-uri
  description: Verify provisioning URI format for authenticator apps
  args:
  - user
  - mfa-setup
  - mfa_basic_user
  - --show-uri
  expect:
    exit_code: 0
    stdout_contains:
    - 'otpauth://totp/Geode:'
    - secret=
    - issuer=Geode
  tags:
  - mfa
  - enrollment
  - provisioning-uri
- name: mfa-enrollment-recovery-codes-count
  description: Verify recovery codes are generated
  args:
  - user
  - mfa-setup
  - mfa_basic_user
  - --show-recovery
  expect:
    exit_code: 0
    stdout_contains:
    - Recovery codes
  tags:
  - mfa
  - enrollment
  - recovery-codes
- name: mfa-enrollment-cleanup-basic
  description: Clean up basic MFA test user
  args:
  - user
  - delete
  - mfa_basic_user
  - --yes
  expect:
    exit_code: 0
  tags:
  - mfa
  - cleanup
- name: mfa-admin-user-create
  description: Create user for admin MFA tests
  args:
  - user
  - create
  - mfa_admin_test
  - mfa_admin@test.com
  - --password
  - Geode Admin Mfa Test Passphrase 2026 Passphrase
  expect:
    exit_code: 0
  tags:
  - mfa
  - admin
  - setup
- name: mfa-admin-enable-for-user
  description: |
    Issue #838 (geode 2026-05-21): mfa enable without --code now errors
    with "missing code". Before the fix, any admin could enable MFA for
    any user without proof of authenticator binding (CVE-class bypass).
    Test now asserts the secure-by-default error path.
  args:
  - user
  - mfa
  - enable
  - mfa_admin_test
  expect:
    exit_code: 1
    stdout_contains:
    - '"status_class":"22023"'
    - Invalid arguments for function (an argument value the functi
  tags:
  - mfa
  - admin
  - enable
  - security-838
- name: mfa-admin-disable-for-user
  description: Admin can disable MFA for user
  args:
  - user
  - mfa
  - disable
  - mfa_admin_test
  expect:
    exit_code: 0
    stdout_contains:
    - MFA
    - disabled
  tags:
  - mfa
  - admin
  - disable
- name: mfa-admin-view-status
  description: Admin can view user details
  args:
  - user
  - show
  - mfa_admin_test
  expect:
    exit_code: 0
  tags:
  - mfa
  - admin
  - status
- name: mfa-admin-cleanup
  description: Clean up admin MFA test user
  args:
  - user
  - delete
  - mfa_admin_test
  - --yes
  expect:
    exit_code: 0
  tags:
  - mfa
  - cleanup
- name: mfa-recovery-user-create
  description: Create user for recovery code tests
  args:
  - user
  - create
  - mfa_recovery_user
  - recovery@test.com
  - --password
  - Geode Recovery Test Passphrase 2026 Passphrase
  expect:
    exit_code: 0
  tags:
  - mfa
  - recovery
  - setup
- name: mfa-recovery-codes-displayed
  description: Recovery codes are displayed during MFA setup
  args:
  - user
  - mfa-setup
  - mfa_recovery_user
  - --show-recovery
  expect:
    exit_code: 0
    stdout_contains:
    - Recovery codes
  tags:
  - mfa
  - recovery
  - display
- name: mfa-recovery-codes-regenerate
  description: Recovery codes can be regenerated
  args:
  - user
  - mfa-setup
  - mfa_recovery_user
  - --regenerate
  expect:
    exit_code: 0
    stdout_contains:
    - MFA secret
    - Recovery codes
  tags:
  - mfa
  - recovery
  - regenerate
- name: mfa-recovery-cleanup
  description: Clean up recovery test user
  args:
  - user
  - delete
  - mfa_recovery_user
  - --yes
  expect:
    exit_code: 0
  tags:
  - mfa
  - cleanup
- name: mfa-edge-nonexistent-user-setup
  description: MFA setup for non-existent user should return error in JSON
  args:
  - user
  - mfa-setup
  - definitely_does_not_exist_12345
  expect:
    exit_code: 1
    stdout_contains:
    - '"status_class":"42002"'
    - User does not exist
  tags:
  - mfa
  - edge-case
  - nonexistent
- name: mfa-edge-nonexistent-user-enable
  description: MFA enable for non-existent user should return error in JSON
  args:
  - user
  - mfa
  - enable
  - definitely_does_not_exist_12345
  expect:
    exit_code: 1
    stdout_contains:
    - '"status_class":"42002"'
    - User does not exist
  tags:
  - mfa
  - edge-case
  - nonexistent
- name: mfa-edge-nonexistent-user-disable
  description: MFA disable for non-existent user should return error in JSON
  args:
  - user
  - mfa
  - disable
  - definitely_does_not_exist_12345
  expect:
    exit_code: 1
    stdout_contains:
    - '"status_class":"42002"'
    - User does not exist
  tags:
  - mfa
  - edge-case
  - nonexistent
- name: mfa-edge-invalid-code-user-create
  description: Create user for invalid code tests
  args:
  - user
  - create
  - mfa_invalid_code
  - invalid@test.com
  - --password
