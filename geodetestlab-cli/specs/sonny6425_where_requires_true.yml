version: '1.0'
name: 'SONNY-6425: a WHERE / FILTER / HAVING keeps a row only when the condition is True'
description: |
  Ticket: SONNY-6425 (item 1; the other items are in-process or cluster-only, see the
  coverage file).
  Every single-node WHERE / FILTER / HAVING site took a non-zero integer as true. ISO/IEC
  39075:2024 19.1 GR2 and 16.13 GR2b keep a row only when the search condition is True, so
  a condition that evaluates to the integer 1 (or a string) keeps no row, and a write behind
  it (MATCH ... WHERE n.a SET ...) writes nothing.
  Fixture: W nodes (k 1, a 1, z 0, s 'x') -R {w: 1}-> (k 2, a 2, z 0, s 'y').
  Proves on an admin session and a row-level-security session (bob): the twelve
  non-boolean conditions (WHERE, FILTER, WITH ... WHERE, relationship WHERE, comma
  pattern, HAVING) return no row (count 0), the boolean controls still return their rows,
  and WHERE n.a SET n.t = 1 changes nothing.

cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 60000
    cleanup: true
    args: [--log-level, warn]
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 60000
    format: json
secrets:
  admin_password:
    source: env
    key: GEODE_ADMIN_PASSWORD
    required: false
    default: Geode Test Admin Passphrase
invariants:
- type: server_running
fuzz:
  enabled: false

tests:
- name: s6425-create-user-bob
  description: 'bob: a readwrite user.'
  args: [query, -U, geode, -P, '${secret:admin_password}', CREATE USER bob SET PASSWORD 'Bob Query Passphrase For Testing' ROLE readwrite]
  expect:
    exit_code: 0
    stdout_contains: [created bob]
  tags: [s6425, setup]

- name: s6425-seed
  description: Seed the W nodes.
  args: [query, -U, geode, -P, '${secret:admin_password}', '-']
  stdin: |
    CREATE (:W {k: 1, a: 1, z: 0, s: 'x'})-[:R {w: 1}]->(:W {k: 2, a: 2, z: 0, s: 'y'})
  expect:
    exit_code: 0
  tags: [s6425, setup]

- name: s6425-deny
  description: Deny bob an unrelated label so his session is a row-level-security session.
  args: [query, -U, geode, -P, '${secret:admin_password}', "CALL geode.rls.add_deny_policy('default', 'Hidden', 'bob')"]
  expect:
    exit_code: 0
    stdout_contains: [deny policy added]
  tags: [s6425, setup]

- name: s6425-where-prop-admin
  description: 'SONNY-6425 [admin]: a non-boolean search condition keeps no row: MATCH (n:W) WHERE n.a RETURN n.k AS k'
  args: [query, -U, geode, -P, '${secret:admin_password}', MATCH (n:W) WHERE n.a RETURN n.k AS k]
  expect:
    exit_code: 0
    stdout_contains: ['"status_class":"00000"', '"rows":[]']
  tags: [s6425]

