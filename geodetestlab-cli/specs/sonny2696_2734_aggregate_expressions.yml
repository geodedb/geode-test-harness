  - '-'
  stdin: |
    MATCH (n:A) RETURN n.g AS g, sum(n.i / (n.g - n.g)) AS x GROUP BY n.g
  expect:
    exit_code: 1
    stdout_contains:
    - '"status_class":"22012"'
    stdout_not_contains:
    - '"status_class":"00000"'
  tags:
  - regression
