# SONNY-2696: aggregates inside expressions in RETURN/WITH items were wrong
# (`count(*) + 1` -> NULL, `toString(count(*))` -> "1"). SONNY-2734: ungrouped aggregates computed
# expression arguments wrongly (`sum(n.i * $f)` = 0, `count(CASE ...)` = 25 instead of 9, avg/max NULL,
# max over dates NULL). Asserted over a real server against 25 :A nodes (i 0..24, g = i%3, s = text of i,
# d = DATE 2026-01-(i+1), v = i on even i only) and four P-R->Q-S->T chains.
# Sums: sum(i)=300, count(DISTINCT i%3)=3; per g: g0 has 9 nodes, g1 8, g2 8.
version: '1.0'
name: SONNY-2696/2734 aggregates inside expressions and computed aggregate arguments
description: aggregate expressions and computed arguments
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 60000
    cleanup: true
    args:
    - --log-level
    - warn
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 60000
    tls_verify: false
    format: json
tests:
- name: setup-data
  description: Create 25 :A nodes and four P/Q/T chains
  args:
  - query
  - --batch
  stdin: |
    CREATE (:A {i: 0, g: 0, s: '0', d: DATE '2026-01-01', v: 0})
    CREATE (:A {i: 1, g: 1, s: '1', d: DATE '2026-01-02'})
    CREATE (:A {i: 2, g: 2, s: '2', d: DATE '2026-01-03', v: 2})
    CREATE (:A {i: 3, g: 0, s: '3', d: DATE '2026-01-04'})
    CREATE (:A {i: 4, g: 1, s: '4', d: DATE '2026-01-05', v: 4})
    CREATE (:A {i: 5, g: 2, s: '5', d: DATE '2026-01-06'})
    CREATE (:A {i: 6, g: 0, s: '6', d: DATE '2026-01-07', v: 6})
    CREATE (:A {i: 7, g: 1, s: '7', d: DATE '2026-01-08'})
    CREATE (:A {i: 8, g: 2, s: '8', d: DATE '2026-01-09', v: 8})
    CREATE (:A {i: 9, g: 0, s: '9', d: DATE '2026-01-10'})
    CREATE (:A {i: 10, g: 1, s: '10', d: DATE '2026-01-11', v: 10})
    CREATE (:A {i: 11, g: 2, s: '11', d: DATE '2026-01-12'})
    CREATE (:A {i: 12, g: 0, s: '12', d: DATE '2026-01-13', v: 12})
    CREATE (:A {i: 13, g: 1, s: '13', d: DATE '2026-01-14'})
    CREATE (:A {i: 14, g: 2, s: '14', d: DATE '2026-01-15', v: 14})
    CREATE (:A {i: 15, g: 0, s: '15', d: DATE '2026-01-16'})
    CREATE (:A {i: 16, g: 1, s: '16', d: DATE '2026-01-17', v: 16})
    CREATE (:A {i: 17, g: 2, s: '17', d: DATE '2026-01-18'})
    CREATE (:A {i: 18, g: 0, s: '18', d: DATE '2026-01-19', v: 18})
    CREATE (:A {i: 19, g: 1, s: '19', d: DATE '2026-01-20'})
    CREATE (:A {i: 20, g: 2, s: '20', d: DATE '2026-01-21', v: 20})
    CREATE (:A {i: 21, g: 0, s: '21', d: DATE '2026-01-22'})
    CREATE (:A {i: 22, g: 1, s: '22', d: DATE '2026-01-23', v: 22})
    CREATE (:A {i: 23, g: 2, s: '23', d: DATE '2026-01-24'})
    CREATE (:A {i: 24, g: 0, s: '24', d: DATE '2026-01-25', v: 24})
    CREATE (:P {k: 0})-[:R]->(:Q {k: 0})-[:S]->(:T {k: 0})
    CREATE (:P {k: 1})-[:R]->(:Q {k: 1})-[:S]->(:T {k: 1})
    CREATE (:P {k: 2})-[:R]->(:Q {k: 2})-[:S]->(:T {k: 2})
    CREATE (:P {k: 3})-[:R]->(:Q {k: 3})-[:S]->(:T {k: 3})
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    stdout_not_contains:
    - '"error"'
    - '"status_class":"4'
    - '"status_class":"2'
  tags:
  - setup
- name: count-plus-1
  description: count-plus-1
  args:
  - query
  - '-'
  stdin: |
    MATCH (n:A) RETURN count(*) + 1 AS x
  expect:
