  - error
  - invalid
- name: missing-subcommand
  description: Test error when subcommand is missing
  args: []
  expect:
    exit_code: 2
    stderr_contains:
    - Error
    - missing
    - subcommand
    status: error
  tags:
  - error
  - missing
- name: verbose-flag
