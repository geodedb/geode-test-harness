- name: invalid-command
  description: Test error handling with invalid command
  args:
  - nonexistent-command
  expect:
    exit_code: 2
    stderr_contains:
    - Error
    - unknown
    status: error
  tags:
  - error
  - invalid
- name: invalid-option
  description: Test error handling with invalid option
