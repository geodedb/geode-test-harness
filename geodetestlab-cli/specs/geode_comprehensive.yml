version: '1.0'
name: Geode Comprehensive Test Suite
description: Comprehensive test suite for Geode database CLI functionality
cli:
  binary: ./zig-out/bin/geode
  working_dir: null
  env:
    GEODE_LOG_LEVEL: info
  server:
    enabled: false
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    server_address: 127.0.0.1:3141
    timeout_ms: 30000
    tls_verify: false
    format: json
secrets: {}
invariants: []
fuzz:
  enabled: false
tests:
- name: help-command
  description: Test main help command
  args:
  - --help
  expect:
    exit_code: 0
    stderr_contains:
    - 'Usage:'
    - 'Subcommands:'
  tags:
  - basic
  - help
- name: serve-help
  description: Test serve subcommand help
  args:
  - serve
  - --help
  expect:
    exit_code: 0
    stderr_contains:
    - serve
    - Start
    - database
    - server
  tags:
  - serve
  - help
- name: query-help
  description: Test query subcommand help
  args:
  - query
  - --help
  expect:
    exit_code: 0
    stderr_contains:
    - query
    - Execute
    - GQL
  tags:
  - query
  - help
- name: backup-help
  description: Test backup subcommand help
  args:
  - backup
  - --help
  expect:
    exit_code: 0
    stderr_contains:
    - backup
    - Database
  tags:
  - backup
  - help
- name: restore-help
  description: Test restore subcommand help
  args:
  - restore
  - --help
  expect:
    exit_code: 0
    stderr_contains:
    - restore
    - database
  tags:
