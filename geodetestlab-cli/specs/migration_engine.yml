name: migration-engine-cli
description: Validate migration engine discovers files and plans migrations correctly
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: false
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
tests:
- name: migrate-dry-run-plans-migrations
  description: Test migration dry-run discovers and plans migrations without server
  skip: true
  skip_reason: "Migration discovery does not detect files created in setup (needs data-dir integration)"
  args:
  - migrate
  - run
  - --dir
  - tests/fixtures/migrations
  - --dry-run
  expect:
    exit_code: 0
    stdout_contains:
    - Running migrations from
    - Found 2 migration files
    - Dry run mode
    - Would apply
- name: migrate-status-discovers-files
  description: Test migration status discovers migration files on disk
  skip: true
  skip_reason: "Migration discovery does not detect files created in setup (needs data-dir integration)"
  args:
  - migrate
  - status
  - --dir
  - tests/fixtures/migrations
  expect:
    exit_code: 0
    stdout_contains:
    - 'Migration status:'
    - 'Total: 2'
    - 001_seed.gql
    - 002_add_index.gql
- name: migrate-create-generates-file
  description: Test migration create generates a new migration file
  args:
  - migrate
  - create
  - test_migration
  - --dir
  - /tmp/geodetestlab_migrations
  expect:
    exit_code: 0
    stdout_contains:
    - Created migration file
