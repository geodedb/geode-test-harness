name: migration-engine-cli
description: Validate migration engine discovers files and plans migrations correctly
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: false
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
tests:
- name: migrate-create-generates-file
  description: Test migration create generates a new migration file
  env:
    GEODE_MIGRATION_HMAC_KEY: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
  args:
  - migrate
  - create
  - test_migration
  - --dir
  - /tmp/geodetestlab_migrations
  expect:
    exit_code: 0
    stdout_contains:
    - Created migration file
