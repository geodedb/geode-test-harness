# SONNY-6302 (items 4): label and relationship-type names longer than 512 bytes
#
# Bug: the label counters and the index readers built their key on a 512-byte
# stack buffer. Past it, MATCH (n:L) / MATCH ()-[:T]->() answered "no such label /
# type" (the readers built the key on the stack only), and the (graph, label)
# count stayed low after a node joined the label (and high after a label was
# removed) because the heap key allocation was `catch return`ed.
#
# Fixed behaviour: a 600-byte label and a 600-byte relationship type behave like
# any other: nodes/edges are found by a label/type scan, counts are exact after
# CREATE, SET n:L, REMOVE n:L and DELETE.
#
# What this spec proves (black box, real server): create nodes and an edge with
# 600-byte label / type names; MATCH by that label/type finds exactly them; the
# count follows SET label / REMOVE label / DELETE.
#
# Not covered here (not reachable from GQL): setEdgeProperty of a nonexistent edge
# now answers EdgeNotFound; covered by zig build test-sonny6302-label-count-and-missing-edge.

version: '1.0'
name: SONNY-6302 labels and relationship types longer than 512 bytes
description: Label and relationship-type scans and counts stay exact for names past 512 bytes (SONNY-6302)
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 60000
    cleanup: true
    args:
    - --log-level
    - warn
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
      GEODE_LSP_PORT: '0'
  client:
    timeout_ms: 30000
    tls_verify: false
    format: json
tests:
- name: s6302-create-long-label-nodes
  description: Create three nodes with a 600-byte label
  args:
  - query
  - '-'
  stdin: 'CREATE (: {k: 1}), (: {k: 2}), (: {k: 3})'
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
  tags:
  - labels
  - sonny6302
- name: s6302-scan-finds-long-label
  description: MATCH by the 600-byte label finds all three (the reader built its key on a 512-byte stack buffer)
  args:
  - query
  - '-'
  stdin: MATCH (n:) RETURN count(n) AS c
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    - '"c":3'
  tags:
  - labels
  - sonny6302
  - key-assertion
- name: s6302-scan-with-filter
  description: A filtered scan by the long label finds the node
  args:
  - query
  - '-'
  stdin: MATCH (n:) WHERE n.k = 2 RETURN n.k AS k
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    - '"k":2'
  tags:
  - labels
  - sonny6302
- name: s6302-set-long-label
  description: SET n:<long> adds a short-labelled node to the long label
  args:
  - query
  - '-'
  stdin: "CREATE (:Short6302 {k: 4});\nMATCH (s:Short6302) SET s:;\nMATCH (n:) RETURN count(n) AS c"
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    - '"c":4'
  tags:
  - labels
  - sonny6302
  - key-assertion
- name: s6302-remove-long-label
  description: REMOVE n:<long> takes the node out of the label and the count follows
  args:
  - query
  - '-'
  stdin: "MATCH (s:Short6302) REMOVE s:;\nMATCH (n:) RETURN count(n) AS c"
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    - '"c":3'
  tags:
  - labels
  - sonny6302
  - key-assertion
- name: s6302-removed-node-still-short-labelled
  description: The node that left the long label still has its short label
  args:
  - query
  - '-'
  stdin: MATCH (s:Short6302) RETURN count(s) AS c
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    - '"c":1'
  tags:
  - labels
  - sonny6302
- name: s6302-delete-long-label-node
  description: DELETE of a node with the long label lowers the count
  args:
  - query
  - '-'
  stdin: "MATCH (n:) WHERE n.k = 1 DELETE n;\nMATCH (n:) RETURN count(n) AS c"
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    - '"c":2'
  tags:
  - labels
  - sonny6302
- name: s6302-create-long-type-edge
  description: Create an edge with a 600-byte relationship type
  args:
  - query
  - '-'
  stdin: 'MATCH (a: {k: 2}), (b: {k: 3}) CREATE (a)-[: {w: 7}]->(b)'
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
  tags:
  - edge-types
  - sonny6302
- name: s6302-scan-finds-long-type
  description: MATCH by the 600-byte relationship type finds the edge (the edge-type scan built its key on the stack only)
  args:
  - query
  - '-'
  stdin: MATCH ()-[e:]->() RETURN count(e) AS c
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    - '"c":1'
  tags:
  - edge-types
  - sonny6302
  - key-assertion
- name: s6302-long-type-property
  description: The edge's property is readable through the long-type scan
  args:
  - query
  - '-'
  stdin: MATCH ()-[e:]->() RETURN e.w AS w
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    - '"w":7'
  tags:
  - edge-types
  - sonny6302
