version: '1.0'
name: gRPC/QUIC CDC control default-deny, admin-only (#849)
description: |
  Pins geode security issue #849 (SEC-002): the raw CDC control-plane wire
  messages — `CdcDiagnosticsRequest`/`CdcControlRequest` (protobuf, shared by
  both the gRPC `GetCdcDiagnostics`/`ControlCdc` RPCs and the QUIC
  `.cdc_diag`/`.cdc_ctrl` oneof arms) — must default-deny any caller that is
  not an authenticated Admin. Fix commits: c51c7d66 (gRPC handlers gated via
  `authorizeAdminSession` in `src/transport/grpc_server.zig`), 309470c2 (same
  gate added to the QUIC arms in `src/server/quic_connection_handler.zig`),
  918a0307 (#867 — systemic connection-level default-deny gate before
  dispatch, defense-in-depth), 93e94099 (positive-control test: auth-disabled
  deployments are NOT over-blocked).

  ## Probe: this surface has NO CLI/GQL/HTTP path at all — on either transport

  Exhaustively grepped before writing this spec:

    - `src/cli/*.zig` (cli_dispatcher.zig, auth_cli.zig, tenant_cli.zig, ...):
      zero references to `cdc`. `geode --help` lists no `cdc` subcommand.
    - The GQL surface DOES expose `CALL cdc.status()`, `cdc.export_diagnostics()`,
      `cdc.pause()`, `cdc.resume()`, `cdc.reset_guardrails()`, etc.
      (`src/execution/storage_dispatch.zig` `executeCdc`, already covered by
      `specs/geode_cdc_comprehensive.yml`) — but this is a COMPLETELY
      SEPARATE engine/dispatch path (`global_cdc_engine`, module-level mutex)
      that does NOT call `authorizeAdminSession` anywhere; it is gated only
      by the ordinary GPS read/write procedure classification
      (`procedure_access.zig`), unrelated to #849. Conflating the two would
      test the wrong lever. #849 gates ONLY `handleCdcDiag`/`handleCdcCtrl`
      in `grpc_server.zig` and the `.cdc_diag`/`.cdc_ctrl` switch arms in
      `quic_connection_handler.zig`, which operate on the DIFFERENT
      `execution.getGlobalCdcEngine()` accessor guarded by
      `execution.getCdcMutex()`.
    - No client library (`geode-client-go`'s `grpc_transport.go`/`conn.go`)
      exposes a public method to SEND a `CdcDiagnosticsRequest`/
      `CdcControlRequest` — `conn.go` only has a response-describer branch
      for the unexpected-variant case; nothing constructs these requests.
    - `build.zig` confirms the ONLY thing that ever exercises this exact gate
      is geode's own Zig unit test, `tests/test_sec002_cdc_preauth.zig`
      (`zig build test-sec002-cdc-preauth`), using a hand-rolled
      `QuicProtoClient` (`tests/proto_test_util.zig`) that speaks the raw
      QUIC wire protocol directly — a tool this harness does not have.

  So the #849-gated surface is reachable ONLY by constructing the raw
  `CdcDiagnosticsRequest`/`CdcControlRequest` protobuf messages directly,
  over either QUIC (no harness tool speaks this) or gRPC (the
  `GetCdcDiagnostics`/`ControlCdc` unary RPCs declared in
  `src/proto/geode.proto`'s `GeodeService`). gRPC is therefore the only
  transport ANY tool available to this harness can reach, via `grpcurl`
  hand-crafting the `geode.GeodeService/Handshake` and
  `geode.GeodeService/ControlCdc` calls against `src/proto/geode.proto`
  (no server-side reflection — confirmed absent in `grpc_server.zig` — so
  `-import-path src/proto -proto geode.proto` is required).

  ## Independent live verification: gRPC transport is dead at the wire level too

  `grpcurl` is not a repository dependency of this harness — it was
  installed ad hoc (`go install
  github.com/fullstorydev/grpcurl/cmd/grpcurl@latest`) purely to probe this
  spec, and is NOT assumed present when this spec runs elsewhere. Probed
  live against a hand-rolled `--listen-grpc`-only scratch server (binary
  HEAD 78173943, `GEODE_GRPC_ALLOW_PLAINTEXT_FALLBACK=1`, matching the exact
  recipe independently verified broken in
  `specs/security_graph_bind_authorization_861.yml` / task R6): a bare
  `geode.GeodeService/Handshake` call via `grpcurl -plaintext` — bypassing
  the `geode` CLI entirely — hangs to the grpcurl client timeout, with the
  server logging only `error: Connection handling failed:
  error.ConnectionClosed`. This is the SAME failure signature R6 found via
  the CLI's `--server --grpc` form, now confirmed with a completely
  different client implementation (Go-based grpcurl, no geode code at all)
  hitting the raw gRPC service directly — independent evidence that gRPC
  handler globals genuinely are only initialized in the QUIC-listen branch
  of `src/server/main.zig`, not a CLI-side artifact.

  ## Bug rule

  If the live baseline below is ever observed to succeed AND an
  unauthenticated or non-admin `ControlCdc` call is ever observed to return
  `success:true` (a "pass" other than the expected `AUTH_REQUIRED`/denied
  status), that is a live #849 regression and must be reported BLOCKED with
  evidence rather than pinned here.

  ## Test design

  Three semantic cases (`unauthenticated-cdc-denied` KEY negative,
  `nonadmin-cdc-denied` negative, `admin-cdc-allowed` positive), all built
  on `ControlCdc(action=RESET_GUARDRAILS)` — chosen over
  `GetCdcDiagnostics` because the diagnostics response is BY DESIGN
  identical whether the caller is denied or an admin call finds no CDC
  engine running (`handleCdcDiag`'s comment: "identical to the no-engine
  response, leaking no diagnostics") — undetectable pass/fail from output
  alone. `ControlCdc` instead carries an explicit `status` field
  (`AUTH_REQUIRED` when the session/role gate fires vs `OK`/`NO_ENGINE`/
  `UNSUPPORTED` once past it) and needs no live Kafka broker.

  A dedicated scratch server (port 4449, `single_node_only: true`) is
  bootstrapped in two phases because the CLI's only working transport
  (QUIC) is needed to create the non-admin principal `rg7_user`, but the
  actual matrix requires a gRPC-only listener (dual QUIC+gRPC startup was
  separately observed to hang, per R6): phase 1 starts a QUIC-listening
  server against a real `--data-dir`, creates `rg7_user` (ROLE readwrite,
  non-admin) via the proven CLI path, then stops it; phase 2 restarts the
  SAME `--data-dir` gRPC-only (`GEODE_GRPC_ALLOW_PLAINTEXT_FALLBACK=1`).

  NOTE on CDC engine state: no env var seeds the CDC engine on this
  binary — `GEODE_CDC_ENABLE` appears only in geode's tests/build.zig
  (zero hits in `src/`); empirically a server started with it still
  reports `enabled:false` from `CALL cdc.status()`. The ONLY path that
  sets the shared global engine (`storage_dispatch.global_cdc_engine`,
  which `execution.getGlobalCdcEngine()` — the accessor the gRPC handler
  uses — delegates to) is `handleCdcEnable`, reachable only via
  `CALL cdc.enable()` — which cannot be issued to the phase-2 gRPC-only
  process while gRPC is its only (and currently dead) transport. The
  admin positive-control therefore mirrors geode's OWN upstream
  positive-control (`tests/test_sec002_cdc_preauth.zig`, "authenticated
  admin CDC path reaches handler"): the assertion is that the admin GETS
  PAST the auth gate to the engine check — any post-gate status (`OK`,
  `NO_ENGINE`, `UNSUPPORTED`) proves that; `AUTH_REQUIRED` is the only
  failure. Whether an engine happens to be running is orthogonal to
  #849 and is deliberately NOT asserted.
  A single baseline liveness probe (admin `Handshake` via `grpcurl`, short
  timeout) then runs once and its outcome (`GRPC_BASELINE_OK` /
  `GRPC_TRANSPORT_BROKEN_ON_BINARY` / `GRPCURL_NOT_AVAILABLE`) is written
  to a state file the three matrix tests each read — avoiding three redundant hang-length timeouts while
  keeping each matrix test an independently readable, self-contained bash
  script (mirrors `security_graph_bind_authorization_861.yml`'s
  transport-liveness gate pattern, generalized to a two-reason gate: missing
  tooling OR dead transport). Every ambiguous outcome inside the LIVE branch
  (unexpected JSON shape, non-zero grpcurl exit past the baseline) is a hard
  FAIL (`exit 1`), not a skip — only the two proven-dead-transport/missing-tool
  reasons, checked once at the baseline, may skip.

  CANARY: REQ=REQ-SEC-CDC-ADMIN-GATE-001; FEATURE="CDCControl"; ASPECT=AdminOnlyDefaultDeny; STATUS=TESTED; TEST=geodetestlab/specs/security_grpc_cdc_admin_gate_849.yml; OWNER=security; UPDATED=2026-07-09

single_node_only: true  # drives its own scratch server (QUIC phase then gRPC-only phase) on a fixed port

cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 60000
    cleanup: true
    args:
    - --log-level
    - info
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 30000
    tls_verify: false
    format: json

invariants:
- type: server_running

tests:

# ---------------------------------------------------------------------------
# Phase 1 — QUIC-listening scratch server creates the non-admin principal
# (rg7_user) against a real --data-dir, then stops.
# ---------------------------------------------------------------------------

- name: rg7-scratch-quic-setup
  description: |
    Self-heals any stale instance from an aborted prior run, preflights port
    4449, then starts a QUIC-listening scratch server with a real
    --data-dir (so the auth store persists into phase 2) and creates
    rg7_user (ROLE readwrite, non-admin — used by nonadmin-cdc-denied
    below). Stops the QUIC listener once the user is created; phase 2
    restarts the SAME data dir gRPC-only.
  type: bash
  timeout_ms: 60000
  command: |
    set -u
    unset GEODE_DATA_DIR
    PORT=4449
    PIDFILE=/tmp/rg7_scratch.pid
    DIRFILE=/tmp/rg7_scratch.dir
    PW="${GEODE_ADMIN_PASSWORD:-Geode Test Admin Passphrase}"
    BIN="${GEODE_BINARY:-geode}"

    if [ -f "$PIDFILE" ]; then
      OLDPID=$(cat "$PIDFILE" 2>/dev/null || echo "")
      if [ -n "$OLDPID" ] && kill -0 "$OLDPID" 2>/dev/null; then
        kill "$OLDPID" 2>/dev/null || true
        sleep 1
        kill -9 "$OLDPID" 2>/dev/null || true
      fi
      rm -f "$PIDFILE"
    fi
    pkill -f "geode serve .*127.0.0.1:${PORT}( |\$)" 2>/dev/null || true
    if [ -f "$DIRFILE" ]; then
      OLDDIR=$(cat "$DIRFILE" 2>/dev/null || echo "")
      case "$OLDDIR" in /tmp/rg7_scratch.*) rm -rf "$OLDDIR" ;; esac
      rm -f "$DIRFILE"
    fi
    rm -f /tmp/rg7_gate_status
    sleep 0.3

    if ss -tuln 2>/dev/null | awk '{print $5}' | grep -qE "[:.]${PORT}$"; then
      echo "PORT_${PORT}_OCCUPIED_BY_FOREIGN_PROCESS"
      ss -tulpn 2>/dev/null | awk -v p=":${PORT}" '$5 ~ p"$"' || true
      exit 1
    fi

    WORKDIR=$(mktemp -d /tmp/rg7_scratch.XXXXXX)
    echo "$WORKDIR" > "$DIRFILE"
    cd "$WORKDIR"

    export GEODE_DISABLE_AUDIT=1
    export GEODE_ADMIN_PASSWORD="$PW"

    # Verified-TLS parity (release-binary safe): serve the harness CA's leaf cert.
    SERVER_TLS_ARGS=""
    if [ -n "${GEODE_TEST_CA_CERT:-}" ] && [ -f "${GEODE_TEST_CA_CERT}" ]; then
      CERT_DIR=$(dirname "${GEODE_TEST_CA_CERT}")
      if [ -f "${CERT_DIR}/leaf.crt" ] && [ -f "${CERT_DIR}/leaf.key" ]; then
        SERVER_TLS_ARGS="--cert ${CERT_DIR}/leaf.crt --key ${CERT_DIR}/leaf.key"
      fi
    fi

    nohup "$BIN" serve --listen "127.0.0.1:${PORT}" --data-dir "$WORKDIR/data" --log-level warn \
      ${SERVER_TLS_ARGS} \
      > "$WORKDIR/server.log" 2>&1 &
    echo $! > "$PIDFILE"

    READY=0
    for i in $(seq 1 100); do
      if "$BIN" query "RETURN 1 AS x" --server "127.0.0.1:${PORT}" -U geode -P "$PW" ${GEODE_CLIENT_TLS} >/dev/null 2>&1; then
        READY=1
        break
      fi
      sleep 0.3
    done
    if [ "$READY" -ne 1 ]; then
      echo "SCRATCH_SERVER_TIMEOUT"
      cat "$WORKDIR/server.log"
      exit 1
    fi
    echo "SCRATCH_QUIC_READY"

    USER_OUT=$("$BIN" query "CREATE USER rg7_user SET PASSWORD 'Rg7UserCdcPass 234 Passphrase' ROLE readwrite" --server "127.0.0.1:${PORT}" -U geode -P "$PW" ${GEODE_CLIENT_TLS} 2>&1)
    echo "$USER_OUT"
    echo "$USER_OUT" | grep -qF 'rg7_user' || { echo "USER_CREATE_FAILED"; exit 1; }

    # Stop the QUIC listener; phase 2 restarts the same --data-dir gRPC-only.
    PID=$(cat "$PIDFILE" 2>/dev/null || echo "")
    if [ -n "$PID" ] && kill -0 "$PID" 2>/dev/null; then
      kill "$PID" 2>/dev/null || true
      sleep 1
      kill -9 "$PID" 2>/dev/null || true
    fi
    rm -f "$PIDFILE"
    echo "SCRATCH_QUIC_STOPPED"
  expected:
    exit_code: 0
    stdout_contains:
    - SCRATCH_QUIC_READY
    - rg7_user
    - SCRATCH_QUIC_STOPPED
  tags: [security, cdc, setup]

# ---------------------------------------------------------------------------
# Phase 2 — restart gRPC-only on the same data dir, run the transport-
# liveness baseline once, write its outcome to a state file the three
# matrix tests below read.
# ---------------------------------------------------------------------------

- name: rg7-scratch-grpc-relisten-and-baseline
  description: |
    Restarts the phase-1 data dir gRPC-only
    (GEODE_GRPC_ALLOW_PLAINTEXT_FALLBACK=1 per the proven R6 recipe). No
    env var can seed the CDC engine (GEODE_CDC_ENABLE is a no-op on this
    binary — see spec description); the admin positive-control below
    accordingly asserts gate passage, not engine state. Then runs the
    transport-liveness baseline exactly once: an admin `Handshake` via
    `grpcurl` (not the `geode` CLI — this is the actual #849-gated wire
    surface). Writes ONE of three outcomes to /tmp/rg7_gate_status for
    the three matrix tests to read: GRPCURL_NOT_AVAILABLE (tool missing —
    not a repo dependency), GRPC_TRANSPORT_BROKEN_ON_BINARY (tool
    present, Handshake did not complete/succeed — the known regression
    this harness independently re-confirmed live, see spec description),
    or GRPC_BASELINE_OK (baseline Handshake returned success:true — the
    real matrix below will execute for real). This test itself always
    exits 0 — it is infrastructure, not an assertion; the matrix tests
    are where FAIL/PASS is decided.
  type: bash
  timeout_ms: 60000
  command: |
    set -u
    unset GEODE_DATA_DIR
    PORT=4449
    PIDFILE=/tmp/rg7_scratch.pid
    DIRFILE=/tmp/rg7_scratch.dir
    PW="${GEODE_ADMIN_PASSWORD:-Geode Test Admin Passphrase}"
    BIN="${GEODE_BINARY:-geode}"
    PROTO_DIR="$(pwd)/src/proto"  # captured BEFORE the cd below — grpcurl -import-path must stay valid after cd "$WORKDIR"

    WORKDIR=$(cat "$DIRFILE" 2>/dev/null || echo "")
    if [ -z "$WORKDIR" ] || [ ! -d "$WORKDIR" ]; then
      echo "SETUP_STATE_MISSING"
      exit 1
    fi

    if ! command -v grpcurl >/dev/null 2>&1; then
      echo "GRPCURL_NOT_AVAILABLE" | tee /tmp/rg7_gate_status
      echo "GATE_STATE_WRITTEN=GRPCURL_NOT_AVAILABLE"
      echo "grpcurl is not on PATH in this environment. It is not a repository dependency of this harness (installed ad hoc via 'go install github.com/fullstorydev/grpcurl/cmd/grpcurl@latest' only to probe this spec). This spec's real assertions self-activate once grpcurl is available AND the gRPC transport is fixed (see spec description)."
      exit 0
    fi

    if ss -tuln 2>/dev/null | awk '{print $5}' | grep -qE "[:.]${PORT}$"; then
      echo "PORT_${PORT}_OCCUPIED_BY_FOREIGN_PROCESS"
      ss -tulpn 2>/dev/null | awk -v p=":${PORT}" '$5 ~ p"$"' || true
      exit 1
    fi

    cd "$WORKDIR"
    export GEODE_DISABLE_AUDIT=1
    export GEODE_ADMIN_PASSWORD="$PW"
    export GEODE_GRPC_ALLOW_PLAINTEXT_FALLBACK=1

    nohup "$BIN" serve --listen-grpc "127.0.0.1:${PORT}" --data-dir "$WORKDIR/data" --log-level info \
      > "$WORKDIR/grpc_server.log" 2>&1 &
    echo $! > "$PIDFILE"
    sleep 2

    HELLO_JSON=$(printf '{"username":"geode","password":"%s","client_name":"rg7-baseline","client_version":"1","wanted_conformance":"iso"}' "$PW")
    BASE_OUT=$(timeout 15 grpcurl -plaintext -import-path "$PROTO_DIR" -proto geode.proto \
      -d "$HELLO_JSON" "127.0.0.1:${PORT}" geode.GeodeService/Handshake 2>&1)
    BASE_STATUS=$?
    echo "$BASE_OUT"
    echo "BASELINE_GRPCURL_EXIT=${BASE_STATUS}"

    BASE_SUCCESS=$(echo "$BASE_OUT" | jq -r '.success // empty' 2>/dev/null || echo "")
    if [ "$BASE_STATUS" -ne 0 ] || [ "$BASE_SUCCESS" != "true" ]; then
      echo "GRPC_TRANSPORT_BROKEN_ON_BINARY" | tee /tmp/rg7_gate_status
      echo "GATE_STATE_WRITTEN=GRPC_TRANSPORT_BROKEN_ON_BINARY"
      echo "An admin Handshake via grpcurl against geode.GeodeService did not complete/succeed within 15s — gRPC transport is down on this binary (known regression, independently reconfirmed here bypassing the CLI entirely; see spec description). Authorization coverage for #849 cannot be evaluated over gRPC until the transport works; there is no other reachable path (see spec description's CLI/GQL probe)."
      exit 0
    fi

    echo "GRPC_BASELINE_OK" | tee /tmp/rg7_gate_status
    echo "GATE_STATE_WRITTEN=GRPC_BASELINE_OK"
  expected:
    exit_code: 0
    stdout_contains:
    - GATE_STATE_WRITTEN
  tags: [security, cdc, setup, grpc]

# ---------------------------------------------------------------------------
# KEY NEGATIVE — unauthenticated ControlCdc call must be denied
# ---------------------------------------------------------------------------

- name: rg7-unauthenticated-cdc-denied
  description: |
    KEY NEGATIVE (#849). ControlCdc(action=RESET_GUARDRAILS, session_id="")
    — no Handshake performed at all. Per `authorizeAdminSession`, an empty
    session_id is `.missing` -> the handler must return
    success:false, status:"AUTH_REQUIRED" without ever touching the CDC
    engine. Any success:true response, any crash, or a hang past the
    per-call timeout is a live #849 regression (bug rule in spec
    description) and must FAIL, not skip. Only the two proven-dead-gate
    reasons recorded by the baseline (grpcurl missing / transport dead) may
    skip.
  type: bash
  timeout_ms: 60000
  command: |
    set -u
    GATE=$(cat /tmp/rg7_gate_status 2>/dev/null || echo "MISSING")
    echo "GATE_STATUS=${GATE}"
    case "$GATE" in
      GRPCURL_NOT_AVAILABLE)
        echo "SKIPPED_NO_GRPCURL — grpcurl unavailable, see baseline test output."
        exit 0
        ;;
      GRPC_TRANSPORT_BROKEN_ON_BINARY)
        echo "SKIPPED_GRPC_DEAD — gRPC transport confirmed broken by the baseline probe, see spec description."
        exit 0
        ;;
      GRPC_BASELINE_OK)
        : # fall through to the real assertion
        ;;
      *)
        echo "GATE_STATE_UNKNOWN_${GATE}"
        exit 1
        ;;
    esac

    PORT=4449
    PROTO_DIR="src/proto"
    OUT=$(timeout 15 grpcurl -plaintext -import-path "$PROTO_DIR" -proto geode.proto \
      -d '{"action":"RESET_GUARDRAILS","session_id":""}' \
      "127.0.0.1:${PORT}" geode.GeodeService/ControlCdc 2>&1)
    STATUS=$?
    echo "$OUT"
    echo "GRPCURL_EXIT=${STATUS}"

    if [ "$STATUS" -ne 0 ]; then
      echo "AMBIGUOUS_RPC_FAILURE"
      exit 1
    fi
    SUCCESS=$(echo "$OUT" | jq -r '.success // false' 2>/dev/null || echo "PARSE_ERROR")
    RESP_STATUS=$(echo "$OUT" | jq -r '.status // empty' 2>/dev/null || echo "")
    echo "PARSED_SUCCESS=${SUCCESS} PARSED_STATUS=${RESP_STATUS}"

    if [ "$SUCCESS" = "true" ]; then
      echo "SEC849_REGRESSION_UNAUTHENTICATED_ALLOWED"
      exit 1
    fi
    if [ "$SUCCESS" != "false" ] || [ -z "$RESP_STATUS" ]; then
      echo "AMBIGUOUS_RESPONSE_SHAPE"
      exit 1
    fi
    echo "DENIED_AS_EXPECTED status=${RESP_STATUS}"
  expected:
    exit_code: 0
    stdout_contains:
    - GATE_STATUS
    stdout_not_contains:
    - SEC849_REGRESSION_UNAUTHENTICATED_ALLOWED
    - AMBIGUOUS_RPC_FAILURE
    - AMBIGUOUS_RESPONSE_SHAPE
    - GATE_STATE_UNKNOWN
    - PARSED_SUCCESS=true
  tags: [security, cdc, negative, key-assertion, gap-849, grpc]

# ---------------------------------------------------------------------------
# NEGATIVE — authenticated non-admin ControlCdc call must be denied
# ---------------------------------------------------------------------------

- name: rg7-nonadmin-cdc-denied
  description: |
    NEGATIVE (#849). rg7_user (ROLE readwrite, created in phase 1) performs
    a real Handshake to obtain a valid but non-admin session_id, then calls
    ControlCdc with it. `authorizeAdminSession` resolves the session,
    confirms the role is NOT Admin, and returns `.forbidden` -> the gRPC
    handler maps this (together with missing/invalidated) to
    success:false, status:"AUTH_REQUIRED" — a valid, live, non-admin
    session must not reach the CDC engine.
  type: bash
  timeout_ms: 60000
  command: |
    set -u
    GATE=$(cat /tmp/rg7_gate_status 2>/dev/null || echo "MISSING")
    echo "GATE_STATUS=${GATE}"
    case "$GATE" in
      GRPCURL_NOT_AVAILABLE)
        echo "SKIPPED_NO_GRPCURL — grpcurl unavailable, see baseline test output."
        exit 0
        ;;
      GRPC_TRANSPORT_BROKEN_ON_BINARY)
        echo "SKIPPED_GRPC_DEAD — gRPC transport confirmed broken by the baseline probe, see spec description."
        exit 0
        ;;
      GRPC_BASELINE_OK)
        : # fall through to the real assertion
        ;;
      *)
        echo "GATE_STATE_UNKNOWN_${GATE}"
        exit 1
        ;;
    esac

    PORT=4449
    PROTO_DIR="src/proto"

    HELLO_JSON='{"username":"rg7_user","password":"Rg7UserCdcPass 234 Passphrase","client_name":"rg7-nonadmin","client_version":"1","wanted_conformance":"iso"}'
    HELLO_OUT=$(timeout 15 grpcurl -plaintext -import-path "$PROTO_DIR" -proto geode.proto \
      -d "$HELLO_JSON" "127.0.0.1:${PORT}" geode.GeodeService/Handshake 2>&1)
    HELLO_STATUS=$?
    echo "$HELLO_OUT"
    echo "HANDSHAKE_EXIT=${HELLO_STATUS}"

    if [ "$HELLO_STATUS" -ne 0 ]; then
      echo "AMBIGUOUS_HANDSHAKE_FAILURE"
      exit 1
    fi
    HELLO_SUCCESS=$(echo "$HELLO_OUT" | jq -r '.success // false' 2>/dev/null || echo "PARSE_ERROR")
    SESSION_ID=$(echo "$HELLO_OUT" | jq -r '.sessionId // .session_id // empty' 2>/dev/null || echo "")
    if [ "$HELLO_SUCCESS" != "true" ] || [ -z "$SESSION_ID" ]; then
      echo "NONADMIN_HANDSHAKE_FAILED"
      exit 1
    fi
    echo "NONADMIN_SESSION_ESTABLISHED"

    CTRL_JSON=$(printf '{"action":"RESET_GUARDRAILS","session_id":"%s"}' "$SESSION_ID")
    OUT=$(timeout 15 grpcurl -plaintext -import-path "$PROTO_DIR" -proto geode.proto \
      -d "$CTRL_JSON" "127.0.0.1:${PORT}" geode.GeodeService/ControlCdc 2>&1)
    STATUS=$?
    echo "$OUT"
    echo "GRPCURL_EXIT=${STATUS}"

    if [ "$STATUS" -ne 0 ]; then
      echo "AMBIGUOUS_RPC_FAILURE"
      exit 1
    fi
    SUCCESS=$(echo "$OUT" | jq -r '.success // false' 2>/dev/null || echo "PARSE_ERROR")
    RESP_STATUS=$(echo "$OUT" | jq -r '.status // empty' 2>/dev/null || echo "")
    echo "PARSED_SUCCESS=${SUCCESS} PARSED_STATUS=${RESP_STATUS}"

    if [ "$SUCCESS" = "true" ]; then
      echo "SEC849_REGRESSION_NONADMIN_ALLOWED"
      exit 1
    fi
    if [ "$SUCCESS" != "false" ] || [ -z "$RESP_STATUS" ]; then
      echo "AMBIGUOUS_RESPONSE_SHAPE"
      exit 1
    fi
    echo "DENIED_AS_EXPECTED status=${RESP_STATUS}"
  expected:
    exit_code: 0
    stdout_contains:
    - GATE_STATUS
    stdout_not_contains:
    - SEC849_REGRESSION_NONADMIN_ALLOWED
    - AMBIGUOUS_RPC_FAILURE
    - AMBIGUOUS_RESPONSE_SHAPE
    - AMBIGUOUS_HANDSHAKE_FAILURE
    - NONADMIN_HANDSHAKE_FAILED
    - GATE_STATE_UNKNOWN
    - PARSED_SUCCESS=true
  tags: [security, cdc, negative, key-assertion, gap-849, grpc]

# ---------------------------------------------------------------------------
# POSITIVE — authenticated Admin ControlCdc call must succeed
# ---------------------------------------------------------------------------

- name: rg7-admin-cdc-allowed
  description: |
    POSITIVE (#849 — proves the gate is not over-blocking, mirrors geode's
    own positive-control test in test_sec002_cdc_preauth.zig which asserts
    exactly `status != AUTH_REQUIRED`). Admin performs a real Handshake,
    then calls ControlCdc(RESET_GUARDRAILS) with the admin session_id.
    `authorizeAdminSession` resolves the session, confirms role==Admin,
    and lets the request PAST the gate to the engine check. What is
    asserted is gate passage, not engine state: any of the three post-gate
    statuses (`OK` if an engine is running, `NO_ENGINE` if not,
    `UNSUPPORTED` for an unknown action) passes; `AUTH_REQUIRED` — the
    denial the two negative cases above assert — is the over-block
    failure; any other status is ambiguous and fails. Engine state is
    deliberately not asserted because no env var seeds the CDC engine on
    this binary and `CALL cdc.enable()` cannot reach the gRPC-only
    phase-2 process (see the spec description's "NOTE on CDC engine
    state") — on the current binary the expected live outcome is
    success:false status:"NO_ENGINE", which is a PASS (gate passed),
    exactly as in the upstream positive-control.
  type: bash
  timeout_ms: 60000
  command: |
    set -u
    GATE=$(cat /tmp/rg7_gate_status 2>/dev/null || echo "MISSING")
    echo "GATE_STATUS=${GATE}"
    case "$GATE" in
      GRPCURL_NOT_AVAILABLE)
        echo "SKIPPED_NO_GRPCURL — grpcurl unavailable, see baseline test output."
        exit 0
        ;;
      GRPC_TRANSPORT_BROKEN_ON_BINARY)
        echo "SKIPPED_GRPC_DEAD — gRPC transport confirmed broken by the baseline probe, see spec description."
        exit 0
        ;;
      GRPC_BASELINE_OK)
        : # fall through to the real assertion
        ;;
      *)
        echo "GATE_STATE_UNKNOWN_${GATE}"
        exit 1
        ;;
    esac

    PORT=4449
    PROTO_DIR="src/proto"
    PW="${GEODE_ADMIN_PASSWORD:-Geode Test Admin Passphrase}"

    HELLO_JSON=$(printf '{"username":"geode","password":"%s","client_name":"rg7-admin","client_version":"1","wanted_conformance":"iso"}' "$PW")
    HELLO_OUT=$(timeout 15 grpcurl -plaintext -import-path "$PROTO_DIR" -proto geode.proto \
      -d "$HELLO_JSON" "127.0.0.1:${PORT}" geode.GeodeService/Handshake 2>&1)
    HELLO_STATUS=$?
    echo "$HELLO_OUT"
    echo "HANDSHAKE_EXIT=${HELLO_STATUS}"

    if [ "$HELLO_STATUS" -ne 0 ]; then
      echo "AMBIGUOUS_HANDSHAKE_FAILURE"
      exit 1
    fi
    HELLO_SUCCESS=$(echo "$HELLO_OUT" | jq -r '.success // false' 2>/dev/null || echo "PARSE_ERROR")
    SESSION_ID=$(echo "$HELLO_OUT" | jq -r '.sessionId // .session_id // empty' 2>/dev/null || echo "")
    if [ "$HELLO_SUCCESS" != "true" ] || [ -z "$SESSION_ID" ]; then
      echo "ADMIN_HANDSHAKE_FAILED"
      exit 1
    fi
    echo "ADMIN_SESSION_ESTABLISHED"

    CTRL_JSON=$(printf '{"action":"RESET_GUARDRAILS","session_id":"%s"}' "$SESSION_ID")
    OUT=$(timeout 15 grpcurl -plaintext -import-path "$PROTO_DIR" -proto geode.proto \
      -d "$CTRL_JSON" "127.0.0.1:${PORT}" geode.GeodeService/ControlCdc 2>&1)
    STATUS=$?
    echo "$OUT"
    echo "GRPCURL_EXIT=${STATUS}"

    if [ "$STATUS" -ne 0 ]; then
      echo "AMBIGUOUS_RPC_FAILURE"
      exit 1
    fi
    SUCCESS=$(echo "$OUT" | jq -r '.success // false' 2>/dev/null || echo "PARSE_ERROR")
    RESP_STATUS=$(echo "$OUT" | jq -r '.status // empty' 2>/dev/null || echo "")
    echo "PARSED_SUCCESS=${SUCCESS} PARSED_STATUS=${RESP_STATUS}"

    # Mirrors upstream test_sec002_cdc_preauth.zig positive-control:
    # the assertion is gate PASSAGE (status != AUTH_REQUIRED), not engine
    # state. OK / NO_ENGINE / UNSUPPORTED are all post-gate responses and
    # pass; AUTH_REQUIRED is the over-block failure; anything else is an
    # ambiguous response shape and fails.
    case "$RESP_STATUS" in
      AUTH_REQUIRED)
        echo "SEC849_OVERBLOCKED_ADMIN_DENIED"
        exit 1
        ;;
      OK|NO_ENGINE|UNSUPPORTED)
        echo "ADMIN_GATE_PASSED status=${RESP_STATUS} success=${SUCCESS}"
        ;;
      *)
        echo "AMBIGUOUS_RESPONSE_SHAPE"
        exit 1
        ;;
    esac
  expected:
    exit_code: 0
    stdout_contains:
    - GATE_STATUS
    stdout_not_contains:
    - SEC849_OVERBLOCKED_ADMIN_DENIED
    - AMBIGUOUS_RPC_FAILURE
    - AMBIGUOUS_RESPONSE_SHAPE
    - AMBIGUOUS_HANDSHAKE_FAILURE
    - ADMIN_HANDSHAKE_FAILED
    - GATE_STATE_UNKNOWN
    - PARSED_STATUS=AUTH_REQUIRED
  tags: [security, cdc, positive, key-assertion, gap-849, grpc]

# ---------------------------------------------------------------------------
# Teardown
# ---------------------------------------------------------------------------

- name: rg7-scratch-teardown
  description: |
    Stops the scratch server (whichever phase left it running) and removes
    its scratch dir and state files. Always reached regardless of earlier
    failures (runner.py only stops the test loop on interactive
    interrupt); the setup test's idempotent cleanup self-heals any residue
    from an interactive SIGINT on the next run.
  type: bash
  command: |
    PORT=4449
    PIDFILE=/tmp/rg7_scratch.pid
    DIRFILE=/tmp/rg7_scratch.dir

    if [ -f "$PIDFILE" ]; then
      PID=$(cat "$PIDFILE" 2>/dev/null || echo "")
      if [ -n "$PID" ] && kill -0 "$PID" 2>/dev/null; then
        kill "$PID" 2>/dev/null || true
        sleep 1
        kill -9 "$PID" 2>/dev/null || true
      fi
      rm -f "$PIDFILE"
    fi
    pkill -f "geode serve .*127.0.0.1:${PORT}( |\$)" 2>/dev/null || true

    if [ -f "$DIRFILE" ]; then
      WORKDIR=$(cat "$DIRFILE" 2>/dev/null || echo "")
      case "$WORKDIR" in /tmp/rg7_scratch.*) rm -rf "$WORKDIR" ;; esac
      rm -f "$DIRFILE"
    fi
    rm -f /tmp/rg7_gate_status
    echo "SCRATCH_SERVER_STOPPED"
  expected:
    exit_code: 0
    stdout_contains:
    - SCRATCH_SERVER_STOPPED
  tags: [security, cdc, teardown]

tags:
- security
- cdc
- grpc
- admin-gate
- gap-849
