- name: 6267-exists-abbrev
  description: abbreviated edge inside EXISTS {}
  args:
  - query
  - '-'
  stdin: |
    MATCH (q:Q) WHERE EXISTS { (q)-(:Y) } RETURN count(*) AS c
  expect:
    exit_code: 0
