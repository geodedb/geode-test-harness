    - '"status_class":"00000"'
    - '{"c":4}'
    stdout_regex:
    - '"rows":\[(\{[^{}]*\},?){1}\]'
  tags:
  - regression
- name: 6267-double-dash-refused
  description: <-- is not ISO and is a syntax error
  args:
  - query
  - '-'
  stdin: |
    MATCH (a)<--(b) RETURN count(*) AS c
  expect:
    exit_code: 1
    stdout_contains:
    - '"status_class":"42000"'
    stdout_not_contains:
    - '"status_class":"00000"'
  tags:
  - regression
