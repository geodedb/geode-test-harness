- name: 6267-chain-abbrev
  description: y-(q)-(x)
  args:
  - query
  - '-'
  stdin: |
    MATCH (y:Y {k: 1})-(q)-(x:X) RETURN x.k AS k
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    - '{"k":1}'
    stdout_regex:
    - '"rows":\[(\{[^{}]*\},?){1}\]'
  tags:
  - regression
- name: 6267-both-abbrev
  description: a<->(b)
  args:
  - query
  - '-'
  stdin: |
    MATCH (a:Q {k: 0})<->(b) RETURN count(*) AS c
  expect:
