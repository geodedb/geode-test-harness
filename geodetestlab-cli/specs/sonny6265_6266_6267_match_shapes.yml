  - '-'
  stdin: |
    MATCH (a:Q {k: 0})->(b) RETURN count(*) AS c
  expect:
    exit_code: 0
    stdout_contains:
    - '"status_class":"00000"'
    - '{"c":2}'
    stdout_regex:
    - '"rows":\[(\{[^{}]*\},?){1}\]'
  tags:
  - regression
- name: 6267-any-abbrev
  description: a-(b)
  args:
  - query
  - '-'
  stdin: |
    MATCH (a:Q {k: 0})-(b) RETURN count(*) AS c
  expect:
