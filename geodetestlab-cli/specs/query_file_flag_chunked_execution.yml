version: "1.0"
name: "Geode Query File Flag Chunked Execution Tests"
description: "Tests for chunked execution of large files and progress reporting"

# CANARY: REQ=REQ-CLI-CHUNKED-EXEC-TEST-001; FEATURE="ChunkedExecution"; ASPECT=E2ETests; STATUS=TESTED; OWNER=test; UPDATED=2026-02-02
# Tests for chunked execution feature (files > 32KB)

cli:
  binary: "./zig-out/bin/geode"
  server:
    enabled: true
    startup_timeout_ms: 30000
    args: ["--disable-auth", "--insecure", "--log-level", "error"]

secrets: {}

invariants:
  - type: "server_running"

fuzz:
  enabled: false

tests:
  # ============================================================================
  # Setup
  # ============================================================================

  - name: "setup-chunked-test-graph"
    description: "Create graph for chunked execution tests"
    args: ["query", "--insecure", "CREATE GRAPH IF NOT EXISTS chunked_test_graph"]
    expect:
      exit_code: 0
    tags: ["setup"]

  # ============================================================================
  # Size Threshold Tests
  # ============================================================================

  - name: "chunked-small-file-no-chunking"
    description: "Test that small file (< 32KB) does not trigger chunking"
    setup:
      script: |
        #!/bin/bash
        {
          echo "USE GRAPH chunked_test_graph;"
          for i in {1..10}; do
            echo "CREATE (n:SmallFile {id: $i});"
          done
        } > /tmp/geode_chunked_small.gql
    args: ["query", "--insecure", "--file", "/tmp/geode_chunked_small.gql"]
    expect:
      exit_code: 0
      stdout_contains: ["Executing from file"]
      stdout_not_contains: ["Large file detected", "chunked execution"]
    verify:
      - args: ["query", "--insecure", "USE GRAPH chunked_test_graph; MATCH (n:SmallFile) RETURN count(n) AS cnt"]
        expect:
          stdout_contains: ["10"]
    cleanup:
      - ["query", "--insecure", "USE GRAPH chunked_test_graph; MATCH (n:SmallFile) DELETE n"]
    tags: ["chunked", "threshold"]

  - name: "chunked-100-statements"
    description: "Test file with 100 CREATE statements (should be under 32KB)"
    setup:
      script: |
        #!/bin/bash
        {
          echo "USE GRAPH chunked_test_graph;"
          for i in {1..100}; do
            echo "CREATE (n:Hundred {id: $i, data: 'value-$i'});"
          done
        } > /tmp/geode_chunked_100.gql
    args: ["query", "--insecure", "--file", "/tmp/geode_chunked_100.gql"]
    expect:
      exit_code: 0
    verify:
      - args: ["query", "--insecure", "USE GRAPH chunked_test_graph; MATCH (n:Hundred) RETURN count(n) AS cnt"]
        expect:
          stdout_contains: ["100"]
    cleanup:
      - ["query", "--insecure", "USE GRAPH chunked_test_graph; MATCH (n:Hundred) DELETE n"]
    tags: ["chunked", "medium"]

  - name: "chunked-500-statements"
    description: "Test file with 500 CREATE statements (likely triggers chunking)"
    setup:
      script: |
        #!/bin/bash
        {
          echo "USE GRAPH chunked_test_graph;"
          for i in {1..500}; do
            echo "CREATE (n:FiveHundred {id: $i, data: 'test-data-value-for-node-$i', timestamp: 1234567890});"
          done
        } > /tmp/geode_chunked_500.gql
    args: ["query", "--insecure", "--file", "/tmp/geode_chunked_500.gql"]
    expect:
      exit_code: 0
      # May or may not trigger chunking depending on exact size
    verify:
      - args: ["query", "--insecure", "USE GRAPH chunked_test_graph; MATCH (n:FiveHundred) RETURN count(n) AS cnt"]
        expect:
          stdout_contains: ["500"]
    cleanup:
      - ["query", "--insecure", "USE GRAPH chunked_test_graph; MATCH (n:FiveHundred) DELETE n"]
    tags: ["chunked", "large"]

  - name: "chunked-1000-statements-guaranteed"
    description: "Test file with 1000 statements with large properties (guaranteed chunking)"
    skip: true  # Stress test: 1000 statements takes > 10 seconds
    setup:
      script: |
        #!/bin/bash
        {
          echo "USE GRAPH chunked_test_graph;"
          for i in {1..1000}; do
            # Use longer property values to guarantee > 32KB total size
            echo "CREATE (n:Thousand {id: $i, description: 'This is a longer description to increase file size and trigger chunked execution mode in the geode query command. Statement number $i.', timestamp: 1234567890, active: true});"
          done
        } > /tmp/geode_chunked_1000.gql
    args: ["query", "--insecure", "--file", "/tmp/geode_chunked_1000.gql"]
    expect:
      exit_code: 0
      # Note: Geode doesn't output "Large file detected" message, just executes the file
    verify:
      - args: ["query", "--insecure", "USE GRAPH chunked_test_graph; MATCH (n:Thousand) RETURN count(n) AS cnt"]
        expect:
          stdout_contains: ["1000"]
    cleanup:
      - ["query", "--insecure", "USE GRAPH chunked_test_graph; MATCH (n:Thousand) DELETE n"]
    tags: ["chunked", "large", "guaranteed"]

  # ============================================================================
  # Progress Reporting Tests
  # ============================================================================

  - name: "chunked-progress-message-format"
    description: "Verify chunked execution displays progress message with byte count and statement count"
    skip: true  # Stress test: 1000 statements takes > 10 seconds
    setup:
      script: |
        #!/bin/bash
        {
          echo "USE GRAPH chunked_test_graph;"
          for i in {1..1000}; do
            echo "CREATE (n:Progress {id: $i, description: 'Node with extended description to increase file size significantly for chunking test purposes. This is statement $i.'});"
          done
        } > /tmp/geode_chunked_progress.gql
    args: ["query", "--insecure", "--file", "/tmp/geode_chunked_progress.gql"]
    expect:
      exit_code: 0
      # Note: Geode doesn't output "Large file detected" progress messages, just executes the file
    verify:
      - args: ["query", "--insecure", "USE GRAPH chunked_test_graph; MATCH (n:Progress) RETURN count(n) AS cnt"]
        expect:
          stdout_contains: ["1000"]
    cleanup:
      - ["query", "--insecure", "USE GRAPH chunked_test_graph; MATCH (n:Progress) DELETE n"]
    tags: ["chunked", "progress"]

  # ============================================================================
  # Statement Batching Tests
  # ============================================================================

  - name: "chunked-mixed-statement-types"
    description: "Test chunked execution with mixed CREATE, MATCH, and relationship statements"
    skip: true  # Stress test: 500+ statements takes > 10 seconds
    setup:
      script: |
        #!/bin/bash
        {
          echo "USE GRAPH chunked_test_graph;"
          # Generate many CREATE statements
          for i in {1..500}; do
            echo "CREATE (n:BatchMixed {id: $i, description: 'Test node for chunked batch execution with mixed statement types'});"
          done
          # Add some MATCH and relationship creation
          echo "MATCH (a:BatchMixed {id: 1}), (b:BatchMixed {id: 2}) CREATE (a)-[:LINKED]->(b);"
          echo "MATCH (a:BatchMixed {id: 3}), (b:BatchMixed {id: 4}) CREATE (a)-[:LINKED]->(b);"
        } > /tmp/geode_chunked_mixed.gql
    args: ["query", "--insecure", "--file", "/tmp/geode_chunked_mixed.gql"]
    expect:
      exit_code: 0
    verify:
      - args: ["query", "--insecure", "USE GRAPH chunked_test_graph; MATCH (n:BatchMixed) RETURN count(n) AS cnt"]
        expect:
          stdout_contains: ["500"]
      - args: ["query", "--insecure", "USE GRAPH chunked_test_graph; MATCH ()-[r:LINKED]->() RETURN count(r) AS cnt"]
        expect:
          stdout_contains: ["2"]
    cleanup:
      - ["query", "--insecure", "USE GRAPH chunked_test_graph; MATCH (n:BatchMixed) DETACH DELETE n"]
    tags: ["chunked", "mixed"]

  - name: "chunked-with-updates"
    description: "Test chunked execution with SET statements"
    skip: true  # Stress test: 600 statements takes > 10 seconds
    setup:
      script: |
        #!/bin/bash
        {
          echo "USE GRAPH chunked_test_graph;"
          # Create nodes
          for i in {1..300}; do
            echo "CREATE (n:ChunkedUpdate {id: $i, value: 0, description: 'Initial value for chunked update test case'});"
          done
          # Update nodes
          for i in {1..300}; do
            echo "MATCH (n:ChunkedUpdate {id: $i}) SET n.value = $i * 10;"
          done
        } > /tmp/geode_chunked_updates.gql
    args: ["query", "--insecure", "--file", "/tmp/geode_chunked_updates.gql"]
    expect:
      exit_code: 0
    verify:
      - args: ["query", "--insecure", "USE GRAPH chunked_test_graph; MATCH (n:ChunkedUpdate {id: 10}) RETURN n.value AS val"]
        expect:
          stdout_contains: ["100"]
    cleanup:
      - ["query", "--insecure", "USE GRAPH chunked_test_graph; MATCH (n:ChunkedUpdate) DELETE n"]
    tags: ["chunked", "update"]

  - name: "chunked-with-deletes"
    description: "Test chunked execution with DELETE statements"
    skip: true  # Stress test: 600 statements takes > 10 seconds
    setup:
      script: |
        #!/bin/bash
        {
          echo "USE GRAPH chunked_test_graph;"
          # Create many nodes
          for i in {1..400}; do
            echo "CREATE (n:ChunkedDelete {id: $i, description: 'Node for chunked delete test with extended property'});"
          done
          # Delete half of them
          for i in {1..200}; do
            echo "MATCH (n:ChunkedDelete {id: $i}) DELETE n;"
          done
        } > /tmp/geode_chunked_deletes.gql
    args: ["query", "--insecure", "--file", "/tmp/geode_chunked_deletes.gql"]
    expect:
      exit_code: 0
    verify:
      - args: ["query", "--insecure", "USE GRAPH chunked_test_graph; MATCH (n:ChunkedDelete) RETURN count(n) AS cnt"]
        expect:
          stdout_contains: ["200"]  # 400 created - 200 deleted = 200 remaining
    cleanup:
      - ["query", "--insecure", "USE GRAPH chunked_test_graph; MATCH (n:ChunkedDelete) DELETE n"]
    tags: ["chunked", "delete"]

  # ============================================================================
  # Transaction Atomicity in Chunked Mode
  # ============================================================================

  - name: "chunked-transaction-atomicity"
    description: "Verify chunked execution maintains transaction atomicity"
    skip: true  # Stress test: 600 statements takes > 10 seconds
    setup:
      script: |
        #!/bin/bash
        {
          echo "USE GRAPH chunked_test_graph;"
          for i in {1..600}; do
            echo "CREATE (n:ChunkedAtomic {seq: $i, description: 'Test node for transaction atomicity in chunked execution mode'});"
          done
        } > /tmp/geode_chunked_atomic.gql
    args: ["query", "--insecure", "--file", "/tmp/geode_chunked_atomic.gql"]
    expect:
      exit_code: 0
    verify:
      - args: ["query", "--insecure", "USE GRAPH chunked_test_graph; MATCH (n:ChunkedAtomic) RETURN count(n) AS cnt"]
        expect:
          stdout_contains: ["600"]  # All or nothing
    cleanup:
      - ["query", "--insecure", "USE GRAPH chunked_test_graph; MATCH (n:ChunkedAtomic) DELETE n"]
    tags: ["chunked", "transaction"]

  - name: "chunked-explicit-transactions"
    description: "Test chunked execution with explicit BEGIN/COMMIT blocks"
    skip: true  # Stress test: 600 statements takes > 10 seconds
    setup:
      script: |
        #!/bin/bash
        {
          echo "USE GRAPH chunked_test_graph;"
          echo "BEGIN;"
          for i in {1..600}; do
            echo "CREATE (n:ChunkedExplicitTxn {id: $i, description: 'Explicit transaction in chunked mode'});"
          done
          echo "COMMIT;"
        } > /tmp/geode_chunked_explicit_txn.gql
    args: ["query", "--insecure", "--file", "/tmp/geode_chunked_explicit_txn.gql"]
    expect:
      exit_code: 0
    verify:
      - args: ["query", "--insecure", "USE GRAPH chunked_test_graph; MATCH (n:ChunkedExplicitTxn) RETURN count(n) AS cnt"]
        expect:
          stdout_contains: ["600"]
    cleanup:
      - ["query", "--insecure", "USE GRAPH chunked_test_graph; MATCH (n:ChunkedExplicitTxn) DELETE n"]
    tags: ["chunked", "transaction", "explicit"]

  # ============================================================================
  # Performance and Stress Tests
  # ============================================================================

  - name: "chunked-5000-statements"
    description: "Stress test with 5000 CREATE statements"
    skip: true  # Long-running test
    setup:
      script: |
        #!/bin/bash
        {
          echo "USE GRAPH chunked_test_graph;"
          for i in {1..5000}; do
            echo "CREATE (n:StressFiveK {id: $i, data: 'stress-test-data-$i', description: 'Large scale chunked execution test'});"
          done
        } > /tmp/geode_chunked_5k.gql
    args: ["query", "--insecure", "--file", "/tmp/geode_chunked_5k.gql"]
    expect:
      exit_code: 0
      stdout_contains: ["Large file detected", "chunked execution"]
    verify:
      - args: ["query", "--insecure", "USE GRAPH chunked_test_graph; MATCH (n:StressFiveK) RETURN count(n) AS cnt"]
        expect:
          stdout_contains: ["5000"]
    cleanup:
      - ["query", "--insecure", "USE GRAPH chunked_test_graph; MATCH (n:StressFiveK) DELETE n"]
    tags: ["chunked", "stress", "performance"]

  - name: "chunked-10000-statements"
    description: "Extreme stress test with 10000 statements"
    skip: true  # Very long-running test
    setup:
      script: |
        #!/bin/bash
        {
          echo "USE GRAPH chunked_test_graph;"
          for i in {1..10000}; do
            echo "CREATE (n:StressTenK {id: $i});"
          done
        } > /tmp/geode_chunked_10k.gql
    args: ["query", "--insecure", "--file", "/tmp/geode_chunked_10k.gql"]
    expect:
      exit_code: 0
    verify:
      - args: ["query", "--insecure", "USE GRAPH chunked_test_graph; MATCH (n:StressTenK) RETURN count(n) AS cnt"]
        expect:
          stdout_contains: ["10000"]
    cleanup:
      - ["query", "--insecure", "USE GRAPH chunked_test_graph; MATCH (n:StressTenK) DELETE n"]
    tags: ["chunked", "stress", "extreme"]

  # ============================================================================
  # Complex Property Tests
  # ============================================================================

  - name: "chunked-large-properties"
    description: "Test chunked execution with nodes containing large property values"
    setup:
      script: |
        #!/bin/bash
        {
          echo "USE GRAPH chunked_test_graph;"
          for i in {1..200}; do
            # Each property is ~200 bytes, ensuring large total size
            echo "CREATE (n:LargeProps {id: $i, description: 'This is a very long description that will significantly increase the size of each statement to ensure that chunking is triggered. We want to test how the system handles large property values in chunked execution mode. Statement $i.'});"
          done
        } > /tmp/geode_chunked_large_props.gql
    args: ["query", "--insecure", "--file", "/tmp/geode_chunked_large_props.gql"]
    expect:
      exit_code: 0
      # Note: Geode doesn't output "Large file detected" message, just executes the file
    verify:
      - args: ["query", "--insecure", "USE GRAPH chunked_test_graph; MATCH (n:LargeProps) RETURN count(n) AS cnt"]
        expect:
          stdout_contains: ["200"]
    cleanup:
      - ["query", "--insecure", "USE GRAPH chunked_test_graph; MATCH (n:LargeProps) DELETE n"]
    tags: ["chunked", "properties"]

  - name: "chunked-many-properties-per-node"
    description: "Test chunked execution with nodes having many properties"
    skip: true  # Stress test: 200 statements with many props takes > 10 seconds
    setup:
      script: |
        #!/bin/bash
        {
          echo "USE GRAPH chunked_test_graph;"
          for i in {1..200}; do
            echo "CREATE (n:ManyProps {id: $i, prop1: 'value1', prop2: 'value2', prop3: 'value3', prop4: 'value4', prop5: 'value5', prop6: 'value6', prop7: 'value7', prop8: 'value8', prop9: 'value9', prop10: 'value10'});"
          done
        } > /tmp/geode_chunked_many_props.gql
    args: ["query", "--insecure", "--file", "/tmp/geode_chunked_many_props.gql"]
    expect:
      exit_code: 0
    verify:
      - args: ["query", "--insecure", "USE GRAPH chunked_test_graph; MATCH (n:ManyProps) RETURN count(n) AS cnt"]
        expect:
          stdout_contains: ["200"]
    cleanup:
      - ["query", "--insecure", "USE GRAPH chunked_test_graph; MATCH (n:ManyProps) DELETE n"]
    tags: ["chunked", "properties"]

  # ============================================================================
  # Error Handling in Chunked Mode
  # ============================================================================

  - name: "chunked-partial-error-recovery"
    description: "Test error handling when chunked execution encounters error mid-stream"
    skip: true  # Stress test: 200 statements takes > 10 seconds
    setup:
      script: |
        #!/bin/bash
        {
          echo "USE GRAPH chunked_test_graph;"
          for i in {1..100}; do
            echo "CREATE (n:PartialError {id: $i, description: 'Valid statement number $i in chunked file'});"
          done
          # Insert syntax error in the middle
          echo "CREATE (n:BadSyntax {id: INVALID SYNTAX HERE});"
          for i in {101..200}; do
            echo "CREATE (n:PartialError {id: $i, description: 'Valid statement after error'});"
          done
        } > /tmp/geode_chunked_error.gql
    args: ["query", "--insecure", "--file", "/tmp/geode_chunked_error.gql"]
    expect:
      exit_code: 1
      stderr_contains: ["syntax", "error"]
    verify:
      # Verify that the transaction rolled back (no nodes created)
      - args: ["query", "--insecure", "USE GRAPH chunked_test_graph; MATCH (n:PartialError) RETURN count(n) AS cnt"]
        expect:
          stdout_contains: ["0"]
    tags: ["chunked", "error", "rollback"]

  # ============================================================================
  # Cleanup
  # ============================================================================

  - name: "cleanup-chunked-test-graph"
    description: "Drop chunked test graph"
    args: ["query", "--insecure", "DROP GRAPH IF EXISTS chunked_test_graph"]
    expect:
      exit_code: 0
    tags: ["cleanup"]

  - name: "cleanup-chunked-temp-files"
    description: "Remove all temporary chunked test files"
    skip: true  # File cleanup handled by OS
    cleanup:
      - ["bash", "-c", "rm -f /tmp/geode_chunked_*.gql"]
    tags: ["cleanup"]
