version: '1.0'
name: Audit Ed25519 forensic export verification
description: |
  GAP-0305: Verifies that the audit subsystem generates Ed25519 key pairs on
  first start, that the hash-chain verifier passes for untampered logs, and
  that flipping one byte causes chain break detection.

  Findings:
  - `geode audit export --sign` does NOT exist as a CLI surface (no `export`
    sub-command under `geode audit`). The binary only exposes `geode audit
    verify`. Ed25519 signatures are generated inline on DIGEST records inside
    the JSONL file; external forensic export is not yet implemented.
  - Key files are written as `<audit_file>.pub` (hex, 64 chars) and
    `<audit_file>.key` (hex, 128 chars) on first boot when neither
    GEODE_AUDIT_PUB nor GEODE_AUDIT_SEC is set.
  - DIGEST records appear every 100 events (default digest_interval).
    Short test runs will not produce DIGEST records; the pubkey verify
    step is conditional on their presence.
  - Tamper detection: the verifier calls `std.process.exit(3)` on
    PREV_HASH_MISMATCH. The test uses a shell fallback path finder so
    the harness CWD doesn't matter.
  - This spec uses GEODE_STATE_DIR (injected by the harness) so key-file
    paths are unique per run and never conflict across concurrent test runs.

  CANARY: REQ=GAP-0305; FEATURE="Audit Ed25519 Forensic Export"; ASPECT=SignatureChain; STATUS=TESTED; OWNER=security; UPDATED=2026-05-21

single_node_only: true  # Per-node audit chain semantics; promotion to multi-node would change the test

cli:
  binary: ./zig-out/bin/geode
  env:
    GEODE_LOG_LEVEL: warn
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 60000
    cleanup: true
    args: [--log-level, warn]
    env:
      GEODE_AUDIT_ENABLED: '1'
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
      GEODE_DISABLE_AUDIT: '0'
      # GEODE_AUDIT_LOG_PATH is intentionally NOT set here so the server writes
      # to {data_dir}/audit.jsonl, which is accessible via ${GEODE_STATE_DIR}
      # and is unique per run (cleanup: true guarantees a fresh data dir).

secrets:
  admin_password:
    source: env
    key: GEODE_ADMIN_PASSWORD
    required: false
    default: Geode Test Admin Passphrase

invariants:
- type: server_running

fuzz:
  enabled: false

tests:

# ============================================================================
# Generate events — CREATE USER triggers ASSIGN_ROLE audit records
# ============================================================================
- name: ed25519-create-user-alice
  description: Create a test user to generate audit events.
  args: [query, -U, geode, -P, '${secret:admin_password}', CREATE USER ed25519_alice SET PASSWORD 'Ed25519Alice 9876 Test Passphrase Value' ROLE readonly]
  expect:
    exit_code: 0
  tags: [audit, ed25519, setup]

- name: ed25519-create-user-bob
  description: Create a second test user to generate more audit events.
  args: [query, -U, geode, -P, '${secret:admin_password}', CREATE USER ed25519_bob SET PASSWORD 'Ed25519Bob 9876 Test Passphrase Value' ROLE readwrite]
  expect:
    exit_code: 0
  tags: [audit, ed25519, setup]

- name: ed25519-create-user-carol
  description: Create a third user to accumulate events.
  args: [query, -U, geode, -P, '${secret:admin_password}', CREATE USER ed25519_carol SET PASSWORD 'Ed25519Carol 9876 Test Passphrase Value' ROLE readonly]
  expect:
    exit_code: 0
  tags: [audit, ed25519, setup]

# ============================================================================
# POSITIVE — verify that the audit JSONL file exists and contains records
# ============================================================================
- name: ed25519-audit-file-exists
  description: |
    POSITIVE — the audit log file must exist and have at least one line.
    The server writes to {data_dir}/audit.jsonl; GEODE_STATE_DIR is the
    data dir injected by the harness.
  type: bash
  command: |
    AUDIT="${GEODE_STATE_DIR}/audit.jsonl"
    echo "Checking audit path: $AUDIT"
    test -s "$AUDIT" || { echo "AUDIT FILE MISSING OR EMPTY: $AUDIT"; exit 1; }
    LINES=$(grep -c . "$AUDIT")
    echo "Audit file exists with $LINES line(s)"
  expect:
    exit_code: 0
  tags: [audit, ed25519, positive]

# ============================================================================
# POSITIVE — key files are created by the server on first start
# ============================================================================
- name: ed25519-key-files-created
  description: |
    POSITIVE — the server creates <audit_file>.pub (64-char hex, the 32-byte
    ed25519 public key) and <audit_file>.key (64-char hex, the 32-byte ed25519
    SEED) alongside the JSONL when no env-based keys are supplied. Geode
    intentionally persists the compact 32-byte seed (from KeyPair.privateSeed),
    NOT the 64-byte libsodium expanded secret key; the 128-char format is
    treated as a legacy input only (see src/security/audit.zig — "GEODE_AUDIT_SEC
    legacy 128-char format … re-export the 64-char seed to silence").
  type: bash
  command: |
    AUDIT="${GEODE_STATE_DIR}/audit.jsonl"
    PUB="${AUDIT}.pub"
    KEY="${AUDIT}.key"
    test -f "$PUB" || { echo "MISSING: $PUB"; exit 1; }
    test -f "$KEY" || { echo "MISSING: $KEY"; exit 1; }
    PUB_LEN=$(tr -d '[:space:]' < "$PUB" | wc -c)
    KEY_LEN=$(tr -d '[:space:]' < "$KEY" | wc -c)
    [ "$PUB_LEN" -eq 64 ] || { echo "BAD pub key length: $PUB_LEN (expected 64)"; exit 1; }
    [ "$KEY_LEN" -eq 64 ] || { echo "BAD sec key length: $KEY_LEN (expected 64 — 32-byte seed)"; exit 1; }
    echo "KEY_FILES_OK pub_len=$PUB_LEN sec_len=$KEY_LEN"
  expect:
    exit_code: 0
    stdout_contains: [KEY_FILES_OK]
  tags: [audit, ed25519, positive, keys]

# ============================================================================
# POSITIVE — hash chain verifier accepts a well-formed fresh log
# ============================================================================
- name: ed25519-chain-verify-full
  description: |
    GAP-0305 / geode#828 RESOLVED — the verifier now reproduces the writer's
    SHA256(last_hash) step so `geode audit verify` correctly accepts a
    well-formed audit log.  Previously the first record always tripped
    PREV_HASH_MISMATCH (expected=0000...0000 got=66687aad...) because the
    writer stores prev_hash = sha256(last_hash) but the verifier compared
    against bare last_hash.  See geode commit fixing src/cli/geode_audit_verify.zig.
  type: bash
  command: |
    AUDIT="${GEODE_STATE_DIR}/audit.jsonl"
    # Locate geode binary
    GEODE_BIN=""
    for p in \
      "${GEODE_STATE_DIR}/../../zig-out/bin/geode" \
      "$(dirname "$(dirname "$(dirname "$PWD")")")/geode/zig-out/bin/geode" \
      "../../../geode/zig-out/bin/geode" \
      "$(command -v geode 2>/dev/null)"; do
      if [ -x "$p" ]; then GEODE_BIN="$p"; break; fi
    done
    if [ -z "$GEODE_BIN" ]; then
      echo "SKIP: geode binary not found"
      exit 0
    fi
    OUTPUT=$("$GEODE_BIN" audit verify --file "$AUDIT" 2>&1)
    EXIT=$?
    echo "$OUTPUT"
    if [ "$EXIT" -ne 0 ]; then
      echo "FAIL: expected exit 0, got $EXIT (verifier should accept a fresh, well-formed log)"
      exit 1
    fi
    echo "$OUTPUT" | grep -q "OK chain" || { echo "FAIL: missing 'OK chain' in verifier output"; exit 1; }
    echo "CHAIN_VERIFY_OK"
  expect:
    exit_code: 0
    stdout_contains: [CHAIN_VERIFY_OK]
  tags: [audit, ed25519, chain, gap-0305-resolved]

# ============================================================================
# POSITIVE — pubkey check (conditional on key file presence)
# ============================================================================
- name: ed25519-pubkey-verify-when-digest-present
  description: |
    POSITIVE (conditional) — check DIGEST count and verify pubkey file length.
    The full pubkey-verified run is exercised only when DIGEST records exist.
  type: bash
  command: |
    AUDIT="${GEODE_STATE_DIR}/audit.jsonl"
    PUB="${AUDIT}.pub"
    DIGEST_COUNT=$(grep -c '"event_type":"DIGEST"' "$AUDIT" 2>/dev/null || echo 0)
    echo "DIGEST records found: $DIGEST_COUNT"
    if [ -f "$PUB" ]; then
      PUBKEY=$(tr -d '[:space:]' < "$PUB")
      echo "Public key present (len=${#PUBKEY})"
    else
      echo "Public key file not present"
    fi
    echo "PUBKEY_CHECK_DONE"
  expect:
    exit_code: 0
    stdout_contains: [PUBKEY_CHECK_DONE]
  tags: [audit, ed25519, positive, signature]

# ============================================================================
# POSITIVE — tamper a copy of the log → verifier must exit non-zero
# ============================================================================
- name: ed25519-tamper-prepare
  description: |
    Prepare a tampered copy of the audit log by flipping the event_hash
    on line 1. Skipped if fewer than 2 records exist.
  type: bash
  command: |
    AUDIT="${GEODE_STATE_DIR}/audit.jsonl"
    LINES=$(grep -c . "$AUDIT" 2>/dev/null || echo 0)
    if [ "$LINES" -lt 2 ]; then
      echo "Only $LINES line(s); need >=2 for chain tamper test"
      echo "TAMPER_SKIP" > /tmp/ed25519_tamper_state.txt
      exit 0
    fi
    TAMPERED="/tmp/ed25519_tampered_$$.jsonl"
    cp "$AUDIT" "$TAMPERED"
    python3 -c "
    import re
    with open('$TAMPERED', 'r') as f:
        lines = f.readlines()
    line = lines[0]
    patched = re.sub(
        r'(\"event_hash\":\"[0-9a-f]{62})([0-9a-f]{2})(\")',
        lambda m: m.group(1) + ('00' if m.group(2) != '00' else 'ff') + m.group(3),
        line, count=1)
    lines[0] = patched
    with open('$TAMPERED', 'w') as f:
        f.writelines(lines)
    print('TAMPER_PREPARED')
    "
    echo "$TAMPERED" > /tmp/ed25519_tamper_state.txt
    echo "TAMPER_PREPARED_OK path=$TAMPERED"
  expect:
    exit_code: 0
  tags: [audit, ed25519, negative, tamper]

- name: ed25519-tamper-detection
  description: |
    NEGATIVE — run `geode audit verify` on the tampered copy. The verifier
    must exit non-zero (exit code 3) on PREV_HASH_MISMATCH.
  type: bash
  command: |
    STATE=$(cat /tmp/ed25519_tamper_state.txt 2>/dev/null || echo "TAMPER_SKIP")
    if [ "$STATE" = "TAMPER_SKIP" ]; then
      echo "TAMPER_RESULT=SKIPPED (insufficient records)"
      echo "ED25519_TAMPER_CHECK_COMPLETE"
      rm -f /tmp/ed25519_tamper_state.txt
      exit 0
    fi
    TAMPERED="$STATE"
    # Locate geode binary
    GEODE_BIN=""
    for p in \
      "${GEODE_STATE_DIR}/../../zig-out/bin/geode" \
      "$(dirname "$(dirname "$(dirname "$PWD")")")/geode/zig-out/bin/geode" \
      "../../../geode/zig-out/bin/geode" \
      "$(command -v geode 2>/dev/null)"; do
      if [ -x "$p" ]; then GEODE_BIN="$p"; break; fi
    done
    if [ -z "$GEODE_BIN" ]; then
      echo "TAMPER_RESULT=SKIPPED (binary not found)"
      echo "ED25519_TAMPER_CHECK_COMPLETE"
      rm -f "$TAMPERED" /tmp/ed25519_tamper_state.txt
      exit 0
    fi
    OUTPUT=$("$GEODE_BIN" audit verify --file "$TAMPERED" 2>&1 || true)
    echo "$OUTPUT"
    "$GEODE_BIN" audit verify --file "$TAMPERED" >/dev/null 2>&1; VERIFY_EXIT=$?
    echo "Verifier exit: $VERIFY_EXIT"
    rm -f "$TAMPERED" /tmp/ed25519_tamper_state.txt
    [ "$VERIFY_EXIT" -ne 0 ] && echo "TAMPER_RESULT=DETECTED exit=$VERIFY_EXIT" || echo "TAMPER_RESULT=MISS (unexpected)"
    echo "ED25519_TAMPER_CHECK_COMPLETE"
  expect:
    exit_code: 0
    stdout_contains: [ED25519_TAMPER_CHECK_COMPLETE]
  tags: [audit, ed25519, negative, tamper]

# ============================================================================
# TEARDOWN
# ============================================================================
- name: ed25519-cleanup
  description: Drop test users.
  args: [query, -U, geode, -P, '${secret:admin_password}', '-']
  stdin: |
    DROP USER IF EXISTS ed25519_alice;
    DROP USER IF EXISTS ed25519_bob;
    DROP USER IF EXISTS ed25519_carol;
  expect:
    exit_code: 0
  tags: [audit, ed25519, teardown]

- name: ed25519-cleanup-scratch
  description: Remove any scratch files from tamper tests.
  type: bash
  command: |
    rm -f /tmp/ed25519_tamper_state.txt /tmp/ed25519_tampered_*.jsonl
  expect:
    exit_code: 0
  tags: [audit, ed25519, teardown]

tags:
- audit
- ed25519
- signature
- forensic
- tamper_detection
- security
- gap-0305
