# Gap Analysis Security Fixes Regression Tests
# GAP-0147: FLE migrate-encrypt stub fix
# GAP-0148: Backup hex key parsing fix
# GAP-0149: Risk score parsing fail-secure fix
# Date: January 13, 2026

version: "1.0"
name: "gap_147_148_149_security_regression"
description: "Regression tests for GAP-0147 (FLE migrate), GAP-0148 (backup hex), GAP-0149 (risk score)"

# Note: These tests verify CLI command behavior and error handling
# The actual cryptographic security fixes are verified in Zig unit tests

cli:
  binary: "./zig-out/bin/geode"
  server:
    enabled: true
    port: null
    data_dir: null
    startup_timeout_ms: 10000
    cleanup: true
    args: ["--log-level", "warn", "--enable-fle"]
  client:
    timeout_ms: 5000
    tls_verify: false
    format: "json"

tests:
  # GAP-0147: FLE migrate-encrypt validation tests
  - name: "gap-0147-fle-migrate-missing-args"
    description: "FLE migrate-encrypt should error on missing arguments"
    args: ["fle", "migrate-encrypt"]
    expect:
      exit_code: 1
      stderr_contains: "migrate-encrypt requires"

  - name: "gap-0147-fle-migrate-partial-args"
    description: "FLE migrate-encrypt should error on partial arguments"
    args: ["fle", "migrate-encrypt", "default"]
    expect:
      exit_code: 1
      stderr_contains: "migrate-encrypt requires"

  - name: "gap-0147-fle-help"
    description: "FLE help should show migrate-encrypt documentation"
    args: ["fle", "--help"]
    expect:
      exit_code: 0
      stdout_contains: "migrate-encrypt"

  # GAP-0148: Backup command validation (hex key errors)
  # Note: The actual hex parsing fix is tested in Zig unit tests
  - name: "gap-0148-backup-help"
    description: "Backup help should be available"
    args: ["backup", "--help"]
    expect:
      exit_code: 0
      stdout_contains: "backup"

  # GAP-0149: Risk score tests
  # Note: Risk score parsing is internal to auth and tested in Zig unit tests
  # This test verifies auth CLI is functional
  - name: "gap-0149-auth-help"
    description: "Auth help should be available"
    args: ["--help"]
    expect:
      exit_code: 0
      stdout_contains: "auth"

tags: ["security", "regression", "gap-analysis", "fle", "backup", "authentication"]
