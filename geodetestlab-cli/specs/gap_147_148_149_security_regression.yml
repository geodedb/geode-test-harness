version: '1.0'
name: gap_147_148_149_security_regression
description: Regression tests for GAP-0147 (FLE migrate), GAP-0148 (backup hex), GAP-0149
  (risk score)
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port: null
    data_dir: null
    startup_timeout_ms: 10000
    cleanup: true
    args:
    - --log-level
    - warn
    - --enable-fle
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
      GEODE_MASTER_KEY: gap-147-148-149-security-key-32b!
  client:
    timeout_ms: 5000
    tls_verify: false
    format: json
tests:
- name: gap-0147-fle-migrate-missing-args
  description: FLE migrate-encrypt should error on missing arguments
  args:
  - fle
  - migrate-encrypt
  expect:
    exit_code: 1
    stderr_contains: migrate-encrypt requires
- name: gap-0147-fle-migrate-partial-args
  description: FLE migrate-encrypt should error on partial arguments
  args:
  - fle
  - migrate-encrypt
  - default
  expect:
    exit_code: 1
    stderr_contains: migrate-encrypt requires
- name: gap-0147-fle-help
  description: FLE help should show migrate-encrypt documentation
  args:
  - fle
  - --help
  expect:
    exit_code: 0
    stderr_contains: migrate-encrypt
- name: gap-0148-backup-help
  description: Backup help should be available
  args:
  - backup
  - --help
  expect:
    exit_code: 0
    stderr_contains: backup
- name: gap-0149-auth-help
  description: Auth help should be available
  args:
  - --help
  expect:
    exit_code: 0
    stderr_contains: auth
tags:
- security
- regression
- gap-analysis
- fle
- backup
- authentication
