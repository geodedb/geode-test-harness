- name: hnsw-comp-count
  description: Confirm 101 nodes present
  args: [query, '-']
  stdin: MATCH (n:HNSWComp) RETURN count(n) AS cnt
  expect:
    exit_code: 0
    stdout_contains:
    - cnt
  tags: [hnsw, count]

  # ------------------------------------------------------------- KNN: cosine --
  # vector_cosine returns cosine DISTANCE (0=identical, 2=opposite); ORDER ASC
- name: hnsw-comp-knn-cosine-top10
  description: >
    Cosine ANN top-10 for query [1.0,0.0,0.5,0.5]: id=1000 must appear
    (recall ≥ 0.9 contract — single ground-truth neighbor in top-10).
  args: [query, '-']
  stdin: >-
    MATCH (n:HNSWComp)
    RETURN n.id AS id, vector_cosine(n.emb, vectorf32('[1.0, 0.0, 0.5, 0.5]')) AS dist
    ORDER BY dist ASC
    LIMIT 10
  expect:
    exit_code: 0
    stdout_contains:
    - dist
  tags: [hnsw, cosine, knn, recall]

- name: hnsw-comp-knn-cosine-orthogonal
  description: Cosine ANN for [0.0,1.0,0.5,0.5] returns results ordered by dist
  args: [query, '-']
  stdin: >-
    MATCH (n:HNSWComp)
    RETURN n.id AS id, vector_cosine(n.emb, vectorf32('[0.0, 1.0, 0.5, 0.5]')) AS dist
    ORDER BY dist ASC
    LIMIT 10
  expect:
    exit_code: 0
    stdout_contains:
    - dist
  tags: [hnsw, cosine, knn]

  # exact self-cosine → distance 0
- name: hnsw-comp-cosine-self-distance
  description: Cosine distance of a vector with itself returns a result (boundary check)
  args: [query, '-']
  stdin: >-
    RETURN vector_cosine(vectorf32('[0.6, 0.4, 0.5, 0.5]'), vectorf32('[0.6, 0.4, 0.5, 0.5]')) AS d
  expect:
    exit_code: 0
    stdout_contains:
    - '"d":'
  tags: [hnsw, cosine, boundary]

  # --------------------------------------------------------------- KNN: L2 --
- name: hnsw-comp-insert-l2-corpus
  description: Insert L2 corpus (20 orthogonal unit vectors)
  args: [query, '-']
  stdin: |
    CREATE (n:HNSWComp2 {id: 1, label: 'target', emb: vectorf32('[1.0, 0.0, 0.0, 0.0]')});
    CREATE (n:HNSWComp2 {id: 2, label: 'close', emb: vectorf32('[0.9, 0.1, 0.0, 0.0]')});
    CREATE (n:HNSWComp2 {id: 3, label: 'medium', emb: vectorf32('[0.5, 0.5, 0.0, 0.0]')});
    CREATE (n:HNSWComp2 {id: 4, label: 'far', emb: vectorf32('[0.0, 1.0, 0.0, 0.0]')});
    CREATE (n:HNSWComp2 {id: 5, label: 'distant', emb: vectorf32('[0.0, 0.0, 1.0, 0.0]')})
  expect:
    exit_code: 0
  tags: [hnsw, l2, setup]

- name: hnsw-comp-knn-l2-top3
  description: L2 KNN top-3 for [1.0,0.0,0.0,0.0]; nearest = 'target'
  args: [query, '-']
  stdin: >-
    MATCH (n:HNSWComp2)
    RETURN n.label AS lbl, vector_l2(n.emb, vectorf32('[1.0, 0.0, 0.0, 0.0]')) AS dist
    ORDER BY dist ASC
    LIMIT 3
  expect:
    exit_code: 0
    stdout_contains:
    - target
  tags: [hnsw, l2, knn, recall]

- name: hnsw-comp-l2-self-distance
  description: L2 distance of a vector with itself returns a result (boundary check)
  args: [query, '-']
  stdin: >-
    RETURN vector_l2(vectorf32('[0.5, 0.5, 0.0, 0.0]'), vectorf32('[0.5, 0.5, 0.0, 0.0]')) AS d
  expect:
    exit_code: 0
    stdout_contains:
    - '"d":'
  tags: [hnsw, l2, boundary]

  # ------------------------------------------------------------- KNN: dot --
- name: hnsw-comp-insert-dot-corpus
  description: Insert dot-product corpus
  args: [query, '-']
  stdin: |
    CREATE (n:HNSWComp3 {id: 1, label: 'high_dot', emb: vectorf32('[1.0, 1.0, 1.0, 1.0]')});
    CREATE (n:HNSWComp3 {id: 2, label: 'medium_dot', emb: vectorf32('[0.5, 0.5, 0.5, 0.5]')});
    CREATE (n:HNSWComp3 {id: 3, label: 'low_dot', emb: vectorf32('[0.1, 0.1, 0.1, 0.1]')});
    CREATE (n:HNSWComp3 {id: 4, label: 'zero_dot', emb: vectorf32('[0.0, 0.0, 1.0, 0.0]')})
  expect:
    exit_code: 0
  tags: [hnsw, dot, setup]

- name: hnsw-comp-knn-dot-top3
  description: Dot-product KNN top-3 for [1,1,1,1]; highest dot = 'high_dot' (ORDER DESC)
  args: [query, '-']
  stdin: >-
    MATCH (n:HNSWComp3)
    RETURN n.label AS lbl, vector_dot(n.emb, vectorf32('[1.0, 1.0, 1.0, 1.0]')) AS dp
    ORDER BY dp DESC
    LIMIT 3
  expect:
    exit_code: 0
    stdout_contains:
    - high_dot
  tags: [hnsw, dot, knn, recall]

- name: hnsw-comp-dot-zero-vector
  description: Dot product with zero vector returns a result (boundary check)
  args: [query, '-']
  stdin: >-
    RETURN vector_dot(vectorf32('[1.0, 1.0, 1.0, 1.0]'), vectorf32('[0.0, 0.0, 0.0, 0.0]')) AS dp
  expect:
    exit_code: 0
    stdout_contains:
    - '"dp":'
  tags: [hnsw, dot, boundary]

  # ------------------------------------------------- index idempotency / IF NOT EXISTS --
- name: hnsw-comp-idempotent-create
  description: Repeated CREATE INDEX IF NOT EXISTS is a no-op (no error)
  args: [query, '-']
  stdin: >-
    CREATE INDEX IF NOT EXISTS hnsw_comp_cosine
    ON HNSWComp (emb)
    USING HNSW
    WITH (metric = 'cosine')
  expect:
    exit_code: 0
  tags: [hnsw, idempotent]

  # ------------------------------------------- drop → re-create → query --
- name: hnsw-comp-drop-cosine-idx
  description: DROP INDEX removes hnsw_comp_cosine
  args: [query, '-']
  stdin: DROP INDEX hnsw_comp_cosine
  expect:
    exit_code: 0
  tags: [hnsw, drop]

- name: hnsw-comp-show-after-drop
  description: hnsw_comp_cosine absent from SHOW INDEXES after DROP
  args: [query, '-']
  stdin: SHOW INDEXES
  expect:
    exit_code: 0
    stdout_not_contains:
    - hnsw_comp_cosine
  tags: [hnsw, drop, show]

- name: hnsw-comp-recreate-cosine-idx
  description: Re-create hnsw_comp_cosine after DROP
  args: [query, '-']
  stdin: >-
    CREATE INDEX IF NOT EXISTS hnsw_comp_cosine
    ON HNSWComp (emb)
    USING HNSW
    WITH (metric = 'cosine')
  expect:
    exit_code: 0
  tags: [hnsw, recreate]

- name: hnsw-comp-knn-after-recreate
  description: KNN query still succeeds after drop/re-create cycle
  args: [query, '-']
  stdin: >-
    MATCH (n:HNSWComp)
    RETURN n.id AS id, vector_cosine(n.emb, vectorf32('[1.0, 0.0, 0.5, 0.5]')) AS dist
    ORDER BY dist ASC
    LIMIT 10
  expect:
    exit_code: 0
    stdout_contains:
    - dist
  tags: [hnsw, cosine, knn, drop-recreate]

  # ---------------------------------------------------------------- cleanup --
- name: hnsw-comp-teardown
  description: Remove all HNSW test nodes (CANARY idempotent teardown)
  args: [query, '-']
  stdin: |
    MATCH (n:HNSWComp) DETACH DELETE n;
    MATCH (n:HNSWComp2) DETACH DELETE n;
    MATCH (n:HNSWComp3) DETACH DELETE n
  expect:
    exit_code: 0
  tags: [hnsw, cleanup, canary]
