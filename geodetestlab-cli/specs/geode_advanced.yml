version: '1.0'
name: Geode Advanced Features Tests
description: Advanced Geode functionality including complex queries, authentication, and performance testing
cli:
  binary: ./zig-out/bin/geode
  server:
    enabled: true
    port:
    data_dir:
    startup_timeout_ms: 90000
    cleanup: true
    args:
    - --log-level
    - debug
    env:
      GEODE_ALLOW_TEST_AUDIT_KEYS: '1'
  client:
    timeout_ms: 60000
    format: json
secrets:
  admin_token:
    source: env
    key: GEODE_ADMIN_TOKEN
    required: false
  user_password:
    source: env
    key: GEODE_USER_PASSWORD
    required: false
fuzz:
  enabled: true
  provider: mock
  max_cases: 10
  seed: 123
  geode_specific: true
  include_gql: true
  include_auth: true
  prompt_template: "Generate sophisticated test cases for Geode graph database.\nFocus on complex GQL queries, schema operations, and edge cases.\nInclude both valid and invalid scenarios for comprehensive testing.\n"
tests:
- name: complex-graph-creation
  description: Create a complex graph structure
  args:
  - query
  - "CREATE\n  (alice:Person {name: 'Alice', age: 30, city: 'New York'}),\n  (bob:Person {name: 'Bob', age: 25, city: 'San Francisco'}),\n  (carol:Person {name: 'Carol', age: 35, city: 'London'}),\n  (company:Company {name: 'TechCorp', founded: 2010}),\n  (prd:Product {name: 'Database', version: '1.0'}),\n  (alice)-[:WORKS_FOR {since: 2020}]->(company),\n  (bob)-[:WORKS_FOR {since: 2021}]->(company),\n  (carol)-[:MANAGES]->(alice),\n  (alice)-[:DEVELOPED]->(prd),\n  (company)-[:OWNS]->(prd)\nRETURN alice, bob, carol, company, prd\n"
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
      contains_node:
        name: Alice
      contains_edge:
        since: 2020
  tags:
  - complex
  - graph
  - create
- name: path-traversal-query
  description: Complex path traversal and analysis
  args:
  - query
  - "MATCH path = (person:Person)-[:WORKS_FOR*1..2]->(org)-[:OWNS]->(prd:Product)\nWHERE person.age > 25\nRETURN\n  person.name AS employee,\n  length(path) AS path_len,\n  prd.name AS product_name,\n  path\nORDER BY person.age DESC\n"
  expect:
    exit_code: 0
    geode_query:
      min_rows: 0
      columns:
      - employee
      - path_len
      - product_name
      - path
  tags:
  - complex
  - query
  - path
- name: aggregation-analysis
  description: Advanced aggregation and analytics
  args:
  - query
  - "MATCH (p:Person)-[r:WORKS_FOR]->(c:Company)\nWITH c.name AS company,\n     count(p) AS employee_count,\n     avg(p.age) AS avg_age\nWHERE employee_count > 0\nRETURN company, employee_count, avg_age\nORDER BY employee_count DESC\n"
  expect:
    exit_code: 0
    geode_query:
      min_rows: 0
      max_rows: 10
      columns:
      - company
      - employee_count
      - avg_age
  tags:
  - complex
  - aggregation
  - analytics
- name: temporal-query
  description: Time-based query with temporal functions
  args:
  - query
  - "MATCH (p:Person)-[r:WORKS_FOR]->(c:Company)\nWHERE r.since <= 2021\nWITH p, r, c, (2024 - r.since) AS years_employed\nRETURN\n  p.name AS employee,\n  c.name AS company,\n  r.since AS start_year,\n  years_employed\nORDER BY years_employed DESC\n"
  expect:
    exit_code: 0
    geode_query:
      min_rows: 0
  tags:
  - temporal
  - query
  - analytics
- name: subquery-with-union
  description: Complex subquery with UNION operations
  args:
  - query
  - "MATCH (p:Person) RETURN p.name AS name, 'Person' AS type\nUNION\nMATCH (c:Company) RETURN c.name AS name, 'Company' AS type\nUNION\nMATCH (pr:Product) RETURN pr.name AS name, 'Product' AS type\n"
  expect:
    exit_code: 0
    geode_query:
      min_rows: 1
      max_rows: 10
      columns:
      - name
      - type
  tags:
  - complex
  - subquery
  - union
- name: schema-introspection
  description: Explore database schema and structure
  args:
  - query
  - "MATCH (n)\nRETURN count(DISTINCT n) AS total_nodes,\n       count(n) AS node_count\nLIMIT 1\n"
  expect:
    exit_code: 0
    geode_query:
      row_count: 1
      columns:
      - total_nodes
      - node_count
  tags:
  - schema
  - introspection
  - metadata
- name: performance-bulk-create
  description: Performance test with bulk data creation
  timeout_ms: 120000
  args:
  - query
  - "CREATE (n1:TestNode {id: 1, name: 'node_1', category: 'B'}),\n       (n2:TestNode {id: 2, name: 'node_2', category: 'C'}),\n       (n3:TestNode {id: 3, name: 'node_3', category: 'A'}),\n       (n4:TestNode {id: 4, name: 'node_4', category: 'B'}),\n       (n5:TestNode {id: 5, name: 'node_5', category: 'C'})\nRETURN n1, n2, n3, n4, n5\n"
  expect:
    exit_code: 0
    geode_query:
      # a writing statement cannot also aggregate (allowlisted write shapes, SQLSTATE 0A000): one row carrying all 5 created nodes
      row_count: 1
      columns:
      - n1
      - n2
      - n3
      - n4
      - n5
  tags:
  - performance
  - bulk
  - create
- name: performance-complex-matching
  description: Performance test with complex pattern matching
  timeout_ms: 60000
  args:
  - query
  - "MATCH (n:TestNode)\nWHERE n.category IN ['A', 'B']\nWITH n.category AS cat, count(n) AS node_count\nRETURN cat, node_count\nORDER BY node_count DESC\n"
  expect:
    exit_code: 0
    geode_query:
      min_rows: 0
      max_rows: 2
      execution_time_ms: 30000
  tags:
  - performance
  - matching
  - analytics
- name: transaction-rollback-test
  description: Test transaction handling and rollback
  args:
  - query
  - --batch
  - '-'
  stdin: |
    BEGIN
    CREATE (temp:TempNode {test: true})
    ROLLBACK
  expect:
    exit_code: 0
  tags:
  - transaction
  - rollback
- name: error-handling-division-by-zero
  description: Test error handling in mathematical operations (Geode raises SQLSTATE 22012, ISO/IEC 39075:2024 data exceptions)
  args:
  - query
  - RETURN 10 / 0 AS result
  expect:
    exit_code: 1
    stdout_contains:
    - '"status_class":"22012"'
  tags:
  - error
  - math
- name: memory-cleanup-test
  description: Test memory cleanup with large result sets
  args:
  - query
  - MATCH (n:TestNode) RETURN n LIMIT 1000
  expect:
    exit_code: 0
    geode_query:
      max_rows: 1000
  tags:
  - memory
  - performance
  - cleanup
tags:
- advanced
- performance
- complex
