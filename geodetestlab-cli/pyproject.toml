[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geodetestlab"
version = "0.1.0"
description = "Interactive CLI testing system for Geode graph database with LLM fuzzing"
authors = [
    {name = "CodePros", email = "team@codepros.dev"}
]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
keywords = ["testing", "cli", "database", "geode", "graph", "gql"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: System Shells",
]

dependencies = [
    "typer~=0.21.1",
    "pydantic~=2.12.5",
    "PyYAML~=6.0.3",
    "httpx~=0.28.1",
    "jmespath~=1.1.0",
    "keyring~=25.7.0",
    "psutil~=7.2.2",
    "rich~=14.3.2",
]

[project.optional-dependencies]
dev = [
    "pytest~=9.0.2",
    "pytest-asyncio~=0.26.0",
    "pytest-timeout~=2.3.1",
    "ruff~=0.15.0",
    "mypy~=1.19.1",
]

[project.scripts]
geodetestlab = "geodetestlab.cli:main"

[project.urls]
Homepage = "https://gitlab.com/devnw/codepros/geode/geode-test-harness"
Repository = "https://gitlab.com/devnw/codepros/geode/geode-test-harness"
Documentation = "https://gitlab.com/devnw/codepros/geode/geode-test-harness/-/tree/main/docs"
"Bug Tracker" = "https://gitlab.com/devnw/codepros/geode/geode-test-harness/-/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["geodetestlab*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function-call-in-default-argument (Typer pattern)
    "SIM105", # suppressible-exception (try/except/pass is fine for cleanup)
    "SIM102", # collapsible-if (readability preference)
    "SIM108", # if-else-block-instead-of-if-exp (readability preference)
]

[tool.ruff.lint.isort]
known-first-party = ["geodetestlab"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["geodetestlab/tests"]
addopts = "-v --tb=short"
