[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geodetestlab"
version = "0.1.0"
description = "Interactive CLI testing system for Geode graph database with LLM fuzzing"
authors = [
    {name = "CodePros", email = "team@codepros.dev"}
]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
keywords = ["testing", "cli", "database", "geode", "graph", "gql"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: System Shells",
]

dependencies = [
    "typer>=0.9.0",
    "pydantic>=2.5.0",
    "PyYAML>=6.0.1",
    "httpx>=0.25.0",
    "jmespath>=1.0.1",
    "keyring>=24.0.0",
    "psutil>=5.9.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-timeout>=2.2.0",
    "mypy>=1.7.0",
    "black>=23.11.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
]

[project.scripts]
geodetestlab = "geodetestlab.cli:main"

[project.urls]
Homepage = "https://gitlab.com/devnw/codepros/geode/geode-test-harness"
Repository = "https://gitlab.com/devnw/codepros/geode/geode-test-harness"
Documentation = "https://gitlab.com/devnw/codepros/geode/geode-test-harness/-/tree/main/docs"
"Bug Tracker" = "https://gitlab.com/devnw/codepros/geode/geode-test-harness/-/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["geodetestlab*"]

[tool.black]
line-length = 120
target-version = ['py311']

[tool.isort]
profile = "black"
line_length = 120

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30
addopts = "-v --tb=short"
