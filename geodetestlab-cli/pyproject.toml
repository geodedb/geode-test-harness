[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geodetestlab"
version = "0.1.0"
description = "Interactive CLI testing system for Geode graph database with LLM fuzzing"
authors = [
    {name = "CodePros", email = "team@codepros.dev"}
]
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
keywords = ["testing", "cli", "database", "geode", "graph", "gql"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Software Development :: Testing",
    "Topic :: System :: System Shells",
]

dependencies = [
    "typer>=0.9.0",
    "PyYAML>=6.0.1",
    "httpx>=0.25.0",
    "keyring>=24.0.0",
    "rich>=13.7.0",
    # Pin protobuf floor to mitigate CVE-2025-4565 / CVE-2026-0994 if
    # any transitive dependency pulls it in.
    "protobuf>=4.25.8",
    # The Python client's generated gRPC stubs (geode_client/proto/geode_pb2_grpc.py)
    # refuse to import below grpcio 1.80; with an older grpcio the client runner
    # silently treats the client as absent.
    "grpcio>=1.80.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=6.0.0",
    "pytest-timeout>=2.2.0",
    "ruff>=0.4.0",
    "mypy>=1.7.0",
    "types-PyYAML>=6.0.0",
]

[project.scripts]
geodetestlab = "geodetestlab.cli:main"

[project.urls]
Homepage = "https://gitlab.com/devnw/codepros/geode/geode-test-harness"
Repository = "https://gitlab.com/devnw/codepros/geode/geode-test-harness"
Documentation = "https://gitlab.com/devnw/codepros/geode/geode-test-harness/-/tree/main/docs"
"Bug Tracker" = "https://gitlab.com/devnw/codepros/geode/geode-test-harness/-/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["geodetestlab*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function-call-in-default-argument (Typer pattern)
    "SIM105", # suppressible-exception (try/except/pass is fine for cleanup)
    "SIM102", # collapsible-if (readability preference)
    "SIM108", # if-else-block-instead-of-if-exp (readability preference)
]

[tool.ruff.lint.isort]
known-first-party = ["geodetestlab"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["geodetestlab/tests"]
addopts = "-v --tb=short --cov=geodetestlab --cov-report=term-missing"

[tool.coverage.run]
source = ["geodetestlab"]
omit = ["geodetestlab/tests/*", "geodetestlab/providers/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
