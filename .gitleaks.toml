# Gitleaks configuration for geode-test-harness
# These are test fixtures, not real secrets

title = "geode-test-harness gitleaks config"

[allowlist]
  description = "Test fixture data that triggers false positives"

  # FLE (Field-Level Encryption) test markers embedded in spec files
  regexTargets = ["match"]
  paths = [
    '''geodetestlab-cli/specs/fle_.*\.yml''',
    '''geodetestlab-cli/specs/geode_audit_.*\.yml''',
    '''specs/.*\.yaml''',
  ]

  [[allowlist.rules]]
    description = "FLE scan/secret/stress test markers"
    regex = '''(FLESCAN|FLESECRET|FLESTRESS)_[A-Z0-9_]+'''

  [[allowlist.rules]]
    description = "FLE test master keys (all contain 'test', 'fle', or 'gap' identifiers)"
    regex = '''(fle-.*-key-|test-master-key|gap-\d+-|vulnerability-)'''

  [[allowlist.rules]]
    description = "Test API keys in geode gk1.* format"
    regex = '''gk1\.[A-Za-z0-9_.]+'''

  [[allowlist.rules]]
    description = "Test Stripe-like keys (short test lengths)"
    regex = '''(sk_live|pk_test)_[a-z0-9]{3,20}'''

  [[allowlist.rules]]
    description = "Hardcoded test password used across test harness"
    regex = '''Geode Test Admin Passphrase'''

  [[allowlist.rules]]
    description = "Test API key admin passwords"
    regex = '''ApiKey_Admin_Test_\d+!'''

  [[allowlist.rules]]
    description = "Environment variable configuration (names, not real values)"
    regex = '''(GEODE_ADMIN_PASSWORD|GEODE_TEST_TOKEN|GEODE_MASTER_KEY)'''
