version: "1.0"
name: "Shell Advanced Feature Tests"
description: "Tests for advanced shell features including graphs, patterns, and complex queries"

# NOTE ON GQL COMPLIANCE:
# Most features in this file are GQL standard (graphs, patterns, WITH, UNION, etc.)
# Cypher-specific features (UNWIND, FOREACH) are commented out.
# Some aggregation functions like collect() are implementation-specific.

manage_server: true

tests:
  # ============================================
  # GRAPH MANAGEMENT
  # ============================================

  - name: "shell-graph-create"
    type: shell_steps
    description: "Create a new graph"
    steps:
      - type: query
        text: "CREATE GRAPH testgraph_adv IF NOT EXISTS"
        expect:
          success: true

  - name: "shell-graph-use-and-query"
    type: shell_steps
    description: "Use graph and execute queries"
    steps:
      - type: query
        text: "CREATE GRAPH graphtest1 IF NOT EXISTS"
      - type: command
        text: "\\use graphtest1"
      - type: query
        text: "CREATE (n:GraphNode {id: 1})"
      - type: query
        text: "MATCH (n:GraphNode) RETURN n.id AS id"
        expect:
          contains:
            - "1"

  - name: "shell-graph-list"
    type: shell_steps
    description: "List all graphs"
    steps:
      - type: query
        text: "CREATE GRAPH listtest1 IF NOT EXISTS"
      - type: command
        text: "\\graphs"
        expect:
          success: true

  - name: "shell-graph-switch"
    type: shell_steps
    description: "Switch between graphs"
    steps:
      - type: query
        text: "CREATE GRAPH switch1 IF NOT EXISTS"
      - type: query
        text: "CREATE GRAPH switch2 IF NOT EXISTS"
      - type: command
        text: "\\use switch1"
      - type: query
        text: "CREATE (n:SwitchNode {graph: 'switch1'})"
      - type: command
        text: "\\use switch2"
      - type: query
        text: "CREATE (n:SwitchNode {graph: 'switch2'})"
      - type: command
        text: "\\use switch1"
      - type: query
        text: "MATCH (n:SwitchNode) RETURN n.graph AS g"
        expect:
          contains:
            - "switch1"

  - name: "shell-graph-drop"
    type: shell_steps
    description: "Drop a graph"
    steps:
      - type: query
        text: "CREATE GRAPH droptest IF NOT EXISTS"
      - type: query
        text: "DROP GRAPH droptest"
        expect:
          success: true

  # ============================================
  # COMPLEX PATTERN MATCHING
  # ============================================

  - name: "shell-pattern-multi-hop"
    type: shell_steps
    description: "Multi-hop pattern matching"
    steps:
      - type: query
        text: |
          CREATE (a:HopTest {name: 'A'})-[:LINK]->(b:HopTest {name: 'B'})-[:LINK]->(c:HopTest {name: 'C'})
      - type: query
        text: "MATCH (a:HopTest)-[:LINK]->(b)-[:LINK]->(c) RETURN a.name AS start, c.name AS end"
        expect:
          contains:
            - "A"
            - "C"

  - name: "shell-pattern-optional-match"
    type: shell_steps
    description: "Optional match for missing relationships"
    steps:
      - type: query
        text: "CREATE (n:OptionalTest {id: 1})"
      - type: query
        text: "MATCH (n:OptionalTest) OPTIONAL MATCH (n)-[:MISSING]->(m) RETURN n.id AS id, m AS other"
        expect:
          contains:
            - "1"

  - name: "shell-pattern-where-complex"
    type: shell_steps
    description: "Complex WHERE conditions"
    steps:
      - type: query
        text: "CREATE (n:WhereComplex {a: 10, b: 20, c: 30})"
      - type: query
        text: "CREATE (n:WhereComplex {a: 5, b: 25, c: 35})"
      - type: query
        text: |
          MATCH (n:WhereComplex)
          WHERE n.a > 3 AND n.b < 30 AND (n.c > 25 OR n.a > 8)
          RETURN n.a AS a
        expect:
          success: true

  - name: "shell-pattern-exists"
    type: shell_steps
    description: "EXISTS subquery pattern"
    steps:
      - type: query
        text: "CREATE (a:ExistsTest {id: 1})-[:HAS]->(b:ExistsTest {id: 2})"
      - type: query
        text: "CREATE (c:ExistsTest {id: 3})"
      - type: query
        text: |
          MATCH (n:ExistsTest)
          WHERE EXISTS { (n)-[:HAS]->() }
          RETURN n.id AS id
        expect:
          contains:
            - "1"

  # ============================================
  # COLLECT AGGREGATION (Implementation-Specific)
  # Note: collect() is a common aggregation function but not in ISO GQL EBNF
  # ============================================

  - name: "shell-impl_specific-collect-aggregation"
    type: shell_steps
    description: "Collect values into a list (implementation-specific)"
    steps:
      - type: query
        text: "CREATE (n:CollectTest {val: 1})"
      - type: query
        text: "CREATE (n:CollectTest {val: 2})"
      - type: query
        text: "CREATE (n:CollectTest {val: 3})"
      - type: query
        text: "MATCH (n:CollectTest) RETURN collect(n.val) AS vals"
        expect:
          success: true
          contains:
            - "vals"

  # Note: UNWIND is Cypher-specific, NOT in ISO GQL standard EBNF
  # These tests are commented out as Cypher compatibility
  # - name: "shell-cypher_compat-unwind-list"
  #   type: shell_steps
  #   description: "Unwind a list into rows (Cypher compatibility)"
  #   steps:
  #     - type: query
  #       text: "UNWIND [1, 2, 3, 4, 5] AS x RETURN x"
  #       expect:
  #         rows: 5

  # ============================================
  # WITH CLAUSE
  # ============================================

  - name: "shell-with-projection"
    type: shell_steps
    description: "WITH clause for projection"
    steps:
      - type: query
        text: "RETURN 10 AS x WITH x * 2 AS doubled RETURN doubled"
        expect:
          contains:
            - "20"

  - name: "shell-with-filtering"
    type: shell_steps
    description: "WITH clause with WHERE"
    steps:
      - type: query
        text: "CREATE (n:WithFilter {val: 10})"
      - type: query
        text: "CREATE (n:WithFilter {val: 20})"
      - type: query
        text: "CREATE (n:WithFilter {val: 30})"
      - type: query
        text: |
          MATCH (n:WithFilter)
          WITH n.val AS v
          WHERE v > 15
          RETURN v ORDER BY v
        expect:
          contains:
            - "20"
            - "30"

  - name: "shell-with-aggregation"
    type: shell_steps
    description: "WITH clause with aggregation"
    steps:
      - type: query
        text: "CREATE (n:WithAgg {group: 'A', val: 10})"
      - type: query
        text: "CREATE (n:WithAgg {group: 'A', val: 20})"
      - type: query
        text: "CREATE (n:WithAgg {group: 'B', val: 30})"
      - type: query
        text: |
          MATCH (n:WithAgg)
          WITH n.group AS grp, sum(n.val) AS total
          RETURN grp, total ORDER BY grp
        expect:
          success: true

  # ============================================
  # FOREACH (Cypher compatibility - may not work)
  # ============================================

  # Note: FOREACH is marked as cypher_compat, not iso_gql
  # This test verifies FOREACH behavior but may fail if not implemented
  # - name: "shell-foreach-update"
  #   type: shell_steps
  #   description: "FOREACH for batch updates (Cypher compat)"
  #   steps:
  #     - type: query
  #       text: "CREATE (n:ForeachTest {id: 1, updated: false})"
  #     - type: query
  #       text: "CREATE (n:ForeachTest {id: 2, updated: false})"
  #     - type: query
  #       text: |
  #         MATCH (n:ForeachTest)
  #         WITH collect(n) AS nodes
  #         FOREACH (node IN nodes | SET node.updated = true)
  #     - type: query
  #       text: "MATCH (n:ForeachTest {updated: true}) RETURN count(n) AS cnt"
  #       expect:
  #         contains:
  #           - "2"

  # ============================================
  # DISTINCT
  # ============================================

  - name: "shell-distinct-values"
    type: shell_steps
    description: "DISTINCT removes duplicates"
    steps:
      - type: query
        text: "CREATE (n:DistinctTest {category: 'A'})"
      - type: query
        text: "CREATE (n:DistinctTest {category: 'A'})"
      - type: query
        text: "CREATE (n:DistinctTest {category: 'B'})"
      - type: query
        text: "MATCH (n:DistinctTest) RETURN DISTINCT n.category AS cat ORDER BY cat"
        expect:
          rows: 2
          contains:
            - "A"
            - "B"

  # ============================================
  # UNION OPERATIONS
  # ============================================

  - name: "shell-union-all"
    type: shell_steps
    description: "UNION ALL combines results"
    steps:
      - type: query
        text: "RETURN 1 AS x UNION ALL RETURN 1 AS x UNION ALL RETURN 2 AS x"
        expect:
          rows: 3

  - name: "shell-union-distinct"
    type: shell_steps
    description: "UNION removes duplicates"
    steps:
      - type: query
        text: "RETURN 1 AS x UNION RETURN 1 AS x UNION RETURN 2 AS x"
        expect:
          rows: 2

  # ============================================
  # CALL PROCEDURES
  # ============================================

  - name: "shell-call-db-labels"
    type: shell_steps
    description: "Call db.labels procedure"
    steps:
      - type: query
        text: "CREATE (n:CallTestLabel {id: 1})"
      - type: query
        text: "CALL db.labels() YIELD label RETURN label"
        expect:
          success: true

  - name: "shell-call-db-relationship-types"
    type: shell_steps
    description: "Call db.relationshipTypes procedure"
    steps:
      - type: query
        text: "CREATE (a:CallRelTest)-[:TEST_REL]->(b:CallRelTest)"
      - type: query
        text: "CALL db.relationshipTypes() YIELD relationshipType RETURN relationshipType"
        expect:
          success: true

  # ============================================
  # EXPLAIN AND PROFILE
  # ============================================

  - name: "shell-explain-query"
    type: shell_steps
    description: "EXPLAIN shows query plan"
    steps:
      - type: query
        text: "EXPLAIN MATCH (n) RETURN n"
        expect:
          success: true

  - name: "shell-profile-query"
    type: shell_steps
    description: "PROFILE shows execution stats"
    steps:
      - type: query
        text: "PROFILE MATCH (n:ProfileTest) RETURN n"
        expect:
          success: true

  # ============================================
  # RETURN VARIATIONS
  # ============================================

  - name: "shell-return-star"
    type: shell_steps
    description: "RETURN * returns all bound variables"
    steps:
      - type: query
        text: "CREATE (n:ReturnStarTest {id: 1})"
      - type: query
        text: "MATCH (n:ReturnStarTest) RETURN *"
        expect:
          success: true

  - name: "shell-return-expression"
    type: shell_steps
    description: "RETURN complex expression"
    steps:
      - type: query
        text: "RETURN CASE WHEN 5 > 3 THEN 'yes' ELSE 'no' END AS result, 1+2+3 AS sum, [1,2,3][0] AS first"
        expect:
          contains:
            - "yes"
            - "6"
            - "1"
