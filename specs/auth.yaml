version: "1.0"
name: "Authentication and Authorization Tests"
description: "Test user authentication, RBAC, and RLS features (simplified for GQL compliance)"

tests:
  - name: "create-user"
    description: "Create a new user account"
    steps:
      - type: query
        text: |
          CREATE USER testuser WITH PASSWORD 'testpass123'
        expect_error: false
    timeout_ms: 10000

  - name: "login-user"
    description: "Authenticate with username and password (returns null if not implemented)"
    query: "SELECT auth.login('testuser', 'testpass123') AS session"
    params: {}
    expect:
      rows: 1
      columns: ["session"]
    timeout_ms: 10000

  - name: "login-invalid-password"
    description: "Login with invalid password (returns null if not implemented)"
    query: "SELECT auth.login('testuser', 'wrongpass') AS session"
    params: {}
    expect:
      rows: 1
      columns: ["session"]
    timeout_ms: 10000

  - name: "user-data-test"
    description: "Create and query user data nodes"
    steps:
      - type: query
        text: |
          CREATE (u:UserData {owner_id: 1, data: 'user1 data'}) RETURN u
        expect:
          rows: 1
      - type: query
        text: |
          CREATE (u:UserData {owner_id: 2, data: 'user2 data'}) RETURN u
        expect:
          rows: 1
      - type: query
        text: |
          MATCH (u:UserData) RETURN count(u) AS total
        expect:
          rows: 1
    timeout_ms: 15000

  - name: "logout"
    description: "Logout and invalidate session (returns null if not implemented)"
    query: |
      SELECT auth.logout(auth.current_session()) AS logged_out
    params: {}
    expect:
      rows: 1
    timeout_ms: 10000

cleanup:
  - type: query
    text: "MATCH (u:UserData) DELETE u"
