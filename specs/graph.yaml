version: "1.0"
name: "Graph Query Tests"
description: "Tests for graph traversal, pattern matching, and relationship queries using pre-populated test data"
requires_migrations: true

tests:
  # ============================================================================
  # Basic Node Queries
  # ============================================================================

  - name: "find-person-by-name"
    description: "Find a specific person by name"
    query: "MATCH (p:Person {name: 'Alice'}) RETURN p.name, p.age, p.email"
    params: {}
    expect:
      rows: 1
      columns: ["p.name", "p.age", "p.email"]
      values:
        - p.name: "Alice"
          p.age: 30
          p.email: "alice@example.com"
    timeout_ms: 5000

  - name: "find-persons-over-age"
    description: "Find all persons over a specific age"
    query: "MATCH (p:Person) WHERE p.age > $min_age RETURN p.name, p.age ORDER BY p.age DESC"
    params:
      min_age: 35
    expect:
      rows: 3
    timeout_ms: 5000

  - name: "count-all-persons"
    description: "Count total number of Person nodes"
    query: "MATCH (p:Person) RETURN count(p) AS total"
    params: {}
    expect:
      rows: 1
      values:
        - total: 15
    timeout_ms: 5000

  - name: "find-active-persons"
    description: "Find persons with active status"
    query: "MATCH (p:Person {active: true}) RETURN count(p) AS active_count"
    params: {}
    expect:
      rows: 1
      values:
        - active_count: 13
    timeout_ms: 5000

  # ============================================================================
  # Relationship Traversal
  # ============================================================================

  - name: "find-alice-friends"
    description: "Find all people Alice knows"
    query: |
      MATCH (a:Person {name: 'Alice'})-[:KNOWS]->(friend:Person)
      RETURN friend.name, friend.age
      ORDER BY friend.name
    params: {}
    expect:
      rows: 5
    timeout_ms: 5000

  - name: "find-friends-of-friends"
    description: "Find friends of friends (2-hop traversal)"
    query: |
      MATCH (a:Person {name: 'Alice'})-[:KNOWS]->()-[:KNOWS]->(fof:Person)
      WHERE fof.name <> 'Alice'
      RETURN DISTINCT fof.name
      ORDER BY fof.name
    params: {}
    timeout_ms: 5000

  - name: "relationship-with-properties"
    description: "Query relationship properties"
    query: |
      MATCH (a:Person {name: 'Alice'})-[k:KNOWS]->(b:Person)
      RETURN b.name, k.since, k.strength
      ORDER BY k.since DESC
    params: {}
    expect:
      rows: 5
    timeout_ms: 5000

  - name: "filter-by-relationship-property"
    description: "Filter relationships by property value"
    query: |
      MATCH (p:Person)-[k:KNOWS]->(friend:Person)
      WHERE k.strength > 0.8
      RETURN p.name AS person, friend.name AS strong_friend, k.strength
      ORDER BY k.strength DESC
    params: {}
    timeout_ms: 5000

  # ============================================================================
  # Aggregations
  # ============================================================================

  - name: "count-friends-per-person"
    description: "Count how many friends each person has"
    query: |
      MATCH (p:Person)-[:KNOWS]->(friend:Person)
      RETURN p.name, count(friend) AS friend_count
      ORDER BY friend_count DESC
    params: {}
    timeout_ms: 5000

  - name: "average-age-of-friends"
    description: "Calculate average age of each person's friends"
    query: |
      MATCH (p:Person {name: 'Alice'})-[:KNOWS]->(friend:Person)
      RETURN avg(friend.age) AS avg_friend_age
    params: {}
    expect:
      rows: 1
    timeout_ms: 5000

  - name: "sum-of-ages"
    description: "Sum ages of all persons"
    query: "MATCH (p:Person) RETURN sum(p.age) AS total_age"
    params: {}
    expect:
      rows: 1
    timeout_ms: 5000

  - name: "min-max-ages"
    description: "Find youngest and oldest persons"
    query: "MATCH (p:Person) RETURN min(p.age) AS youngest, max(p.age) AS oldest"
    params: {}
    expect:
      rows: 1
      values:
        - youngest: 22
          oldest: 50
    timeout_ms: 5000

  # ============================================================================
  # Product and Category Queries
  # ============================================================================

  - name: "find-products-by-category"
    description: "Find all products in Electronics category"
    query: |
      MATCH (p:Product)-[:BELONGS_TO]->(c:Category {name: 'Electronics'})
      RETURN p.name, p.price, p.sku
      ORDER BY p.price DESC
    params: {}
    expect:
      rows: 5
    timeout_ms: 5000

  - name: "count-products-per-category"
    description: "Count products in each category"
    query: |
      MATCH (p:Product)-[:BELONGS_TO]->(c:Category)
      RETURN c.name, count(p) AS product_count
      ORDER BY product_count DESC
    params: {}
    expect:
      rows: 5
    timeout_ms: 5000

  - name: "find-expensive-products"
    description: "Find products over a price threshold"
    query: |
      MATCH (p:Product)
      WHERE p.price > $min_price
      RETURN p.name, p.price
      ORDER BY p.price DESC
    params:
      min_price: 100
    timeout_ms: 5000

  - name: "total-inventory-value"
    description: "Calculate total inventory value"
    query: |
      MATCH (p:Product)
      RETURN sum(p.price * p.stock) AS total_value
    params: {}
    expect:
      rows: 1
    timeout_ms: 5000

  # ============================================================================
  # Order Queries
  # ============================================================================

  - name: "find-orders-by-status"
    description: "Find completed orders"
    query: |
      MATCH (o:Order {status: 'completed'})
      RETURN o.order_id, o.total, o.created_at
      ORDER BY o.total DESC
    params: {}
    expect:
      rows: 6
    timeout_ms: 5000

  - name: "find-person-orders"
    description: "Find all orders placed by a specific person"
    query: |
      MATCH (p:Person {name: 'Alice'})-[:PLACED]->(o:Order)
      RETURN o.order_id, o.status, o.total
      ORDER BY o.total DESC
    params: {}
    expect:
      rows: 2
    timeout_ms: 5000

  - name: "order-with-products"
    description: "Find order details with products"
    query: |
      MATCH (o:Order {order_id: 'ORD-001'})-[c:CONTAINS]->(p:Product)
      RETURN p.name, p.price, c.quantity
    params: {}
    expect:
      rows: 2
    timeout_ms: 5000

  - name: "total-spending-by-person"
    description: "Calculate total spending per person"
    query: |
      MATCH (person:Person)-[:PLACED]->(o:Order {status: 'completed'})
      RETURN person.name, sum(o.total) AS total_spent
      ORDER BY total_spent DESC
    params: {}
    timeout_ms: 5000

  # ============================================================================
  # Complex Multi-Hop Queries
  # ============================================================================

  - name: "person-ordered-category"
    description: "Find categories ordered by a person"
    query: |
      MATCH (person:Person {name: 'Alice'})-[:PLACED]->(o:Order)-[:CONTAINS]->(p:Product)-[:BELONGS_TO]->(c:Category)
      RETURN DISTINCT c.name
      ORDER BY c.name
    params: {}
    timeout_ms: 10000

  - name: "recommend-products-from-friends"
    description: "Find products ordered by friends (basic recommendation)"
    query: |
      MATCH (me:Person {name: 'Alice'})-[:KNOWS]->(friend:Person)-[:PLACED]->(o:Order)-[:CONTAINS]->(p:Product)
      WHERE NOT EXISTS {
        MATCH (me)-[:PLACED]->(:Order)-[:CONTAINS]->(p)
      }
      RETURN DISTINCT p.name, p.price
      ORDER BY p.price
    params: {}
    timeout_ms: 10000

  # ============================================================================
  # Pattern Matching
  # ============================================================================

  - name: "find-mutual-friends"
    description: "Find mutual connections between two people"
    query: |
      MATCH (a:Person {name: 'Alice'})-[:KNOWS]->(mutual:Person)<-[:KNOWS]-(b:Person {name: 'Bob'})
      RETURN mutual.name
    params: {}
    timeout_ms: 5000

  - name: "shortest-path-query"
    description: "Find if path exists between two people"
    query: |
      MATCH path = (a:Person {name: 'Alice'})-[:KNOWS*1..3]->(b:Person {name: 'Jack'})
      RETURN length(path) AS path_length
      LIMIT 1
    params: {}
    timeout_ms: 10000
