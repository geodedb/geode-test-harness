version: "1.0"
name: "Shell Output Format Tests"
description: "Tests for different output formats (table, json, csv)"

manage_server: true

tests:
  # ============================================
  # TABLE FORMAT
  # ============================================

  - name: "shell-format-table-single-row"
    type: shell_steps
    description: "Table format with single row"
    steps:
      - type: command
        text: "\\format table"
      - type: query
        text: "RETURN 42 AS value"
        expect:
          contains:
            - "|"
            - "value"
            - "42"
            - "1 row"

  - name: "shell-format-table-multiple-rows"
    type: shell_steps
    description: "Table format with multiple rows"
    steps:
      - type: command
        text: "\\format table"
      - type: query
        text: "CREATE (n:TableTest {id: 1})"
      - type: query
        text: "CREATE (n:TableTest {id: 2})"
      - type: query
        text: "CREATE (n:TableTest {id: 3})"
      - type: query
        text: "MATCH (n:TableTest) RETURN n.id AS id ORDER BY n.id"
        expect:
          contains:
            - "|"
            - "id"
            - "1"
            - "2"
            - "3"
            - "3 row"

  - name: "shell-format-table-multiple-columns"
    type: shell_steps
    description: "Table format with multiple columns"
    steps:
      - type: command
        text: "\\format table"
      - type: query
        text: "RETURN 1 AS col_a, 'hello' AS col_b, 3.14 AS col_c"
        expect:
          contains:
            - "col_a"
            - "col_b"
            - "col_c"
            - "1"
            - "hello"
            - "3.14"

  - name: "shell-format-table-empty-result"
    type: shell_steps
    description: "Table format with no results"
    steps:
      - type: command
        text: "\\format table"
      - type: query
        text: "MATCH (n:NonExistentLabel12345) RETURN n.id AS id"
        expect:
          contains:
            - "0 row"

  - name: "shell-format-table-long-string"
    type: shell_steps
    description: "Table format with long strings (truncation)"
    steps:
      - type: command
        text: "\\format table"
      - type: query
        text: "RETURN 'This is a very long string that might get truncated in table output format' AS long_text"
        expect:
          contains:
            - "long_text"

  # ============================================
  # JSON FORMAT
  # ============================================

  - name: "shell-format-json-single-row"
    type: shell_steps
    description: "JSON format with single row"
    steps:
      - type: command
        text: "\\format json"
      - type: query
        text: "RETURN 42 AS value"
        expect:
          contains:
            - "{"
            - "value"
            - "42"
            - "}"

  - name: "shell-format-json-multiple-rows"
    type: shell_steps
    description: "JSON format with multiple rows"
    steps:
      - type: command
        text: "\\format json"
      - type: query
        text: "CREATE (n:JsonTest {id: 1})"
      - type: query
        text: "CREATE (n:JsonTest {id: 2})"
      - type: query
        text: "MATCH (n:JsonTest) RETURN n.id AS id ORDER BY n.id"
        expect:
          contains:
            - "["
            - "{"
            - "id"
            - "}"
            - "]"

  - name: "shell-format-json-string-value"
    type: shell_steps
    description: "JSON format with string value"
    steps:
      - type: command
        text: "\\format json"
      - type: query
        text: "RETURN 'hello world' AS message"
        expect:
          contains:
            - "message"
            - "hello world"

  - name: "shell-format-json-boolean"
    type: shell_steps
    description: "JSON format with boolean values"
    steps:
      - type: command
        text: "\\format json"
      - type: query
        text: "RETURN true AS t, false AS f"
        expect:
          contains:
            - "t"
            - "f"

  - name: "shell-format-json-null"
    type: shell_steps
    description: "JSON format with null value"
    steps:
      - type: command
        text: "\\format json"
      - type: query
        text: "RETURN null AS n"
        expect:
          contains:
            - "null"

  - name: "shell-format-json-nested-structure"
    type: shell_steps
    description: "JSON format with nested map"
    steps:
      - type: command
        text: "\\format json"
      - type: query
        text: "RETURN {inner: {value: 42}} AS nested"
        expect:
          contains:
            - "nested"

  # ============================================
  # CSV FORMAT
  # ============================================

  - name: "shell-format-csv-single-row"
    type: shell_steps
    description: "CSV format with single row"
    steps:
      - type: command
        text: "\\format csv"
      - type: query
        text: "RETURN 42 AS value"
        expect:
          contains:
            - "value"
            - "42"

  - name: "shell-format-csv-multiple-columns"
    type: shell_steps
    description: "CSV format with multiple columns"
    steps:
      - type: command
        text: "\\format csv"
      - type: query
        text: "RETURN 1 AS a, 2 AS b, 3 AS c"
        expect:
          contains:
            - "a,b,c"
            - "1,2,3"

  - name: "shell-format-csv-multiple-rows"
    type: shell_steps
    description: "CSV format with multiple rows"
    steps:
      - type: command
        text: "\\format csv"
      - type: query
        text: "CREATE (n:CsvTest {id: 1, name: 'first'})"
      - type: query
        text: "CREATE (n:CsvTest {id: 2, name: 'second'})"
      - type: query
        text: "MATCH (n:CsvTest) RETURN n.id AS id, n.name AS name ORDER BY n.id"
        expect:
          contains:
            - "id,name"
            - "1,first"
            - "2,second"

  - name: "shell-format-csv-string-with-comma"
    type: shell_steps
    description: "CSV format with string containing comma"
    steps:
      - type: command
        text: "\\format csv"
      - type: query
        text: "RETURN 'hello, world' AS text"
        expect:
          contains:
            - "text"

  # ============================================
  # FORMAT SWITCHING
  # ============================================

  - name: "shell-format-switch-table-to-json"
    type: shell_steps
    description: "Switch from table to json format"
    steps:
      - type: command
        text: "\\format table"
      - type: query
        text: "RETURN 1 AS x"
        expect:
          contains:
            - "|"
      - type: command
        text: "\\format json"
      - type: query
        text: "RETURN 1 AS x"
        expect:
          contains:
            - "{"

  - name: "shell-format-switch-json-to-csv"
    type: shell_steps
    description: "Switch from json to csv format"
    steps:
      - type: command
        text: "\\format json"
      - type: query
        text: "RETURN 1 AS x"
        expect:
          contains:
            - "{"
      - type: command
        text: "\\format csv"
      - type: query
        text: "RETURN 1 AS a, 2 AS b"
        expect:
          contains:
            - "a,b"

  # ============================================
  # SPECIAL CHARACTERS IN OUTPUT
  # ============================================

  - name: "shell-output-special-chars"
    type: shell_steps
    description: "Output with special characters"
    steps:
      - type: command
        text: "\\format table"
      - type: query
        text: "RETURN 'test@example.com' AS email"
        expect:
          contains:
            - "test@example.com"

  - name: "shell-output-unicode"
    type: shell_steps
    description: "Output with unicode characters"
    steps:
      - type: command
        text: "\\format table"
      - type: query
        text: "RETURN 'hello' AS text"
        expect:
          contains:
            - "hello"

  - name: "shell-output-empty-string"
    type: shell_steps
    description: "Output with empty string"
    steps:
      - type: command
        text: "\\format table"
      - type: query
        text: "RETURN '' AS empty"
        expect:
          contains:
            - "empty"

  # ============================================
  # DATA TYPE OUTPUT
  # ============================================

  - name: "shell-output-integer-types"
    type: shell_steps
    description: "Output various integer values"
    steps:
      - type: command
        text: "\\format table"
      - type: query
        text: "RETURN 0 AS zero, -42 AS negative, 9999999 AS large"
        expect:
          contains:
            - "zero"
            - "negative"
            - "large"
            - "0"
            - "-42"
            - "9999999"

  - name: "shell-output-float-precision"
    type: shell_steps
    description: "Output floating point with precision"
    steps:
      - type: command
        text: "\\format table"
      - type: query
        text: "RETURN 3.14159265359 AS pi"
        expect:
          contains:
            - "pi"
            - "3.14"

  - name: "shell-output-list-values"
    type: shell_steps
    description: "Output list values"
    steps:
      - type: command
        text: "\\format json"
      - type: query
        text: "RETURN [1, 2, 3] AS nums"
        expect:
          contains:
            - "nums"
            - "1"
            - "2"
            - "3"

  - name: "shell-output-map-values"
    type: shell_steps
    description: "Output map values"
    steps:
      - type: command
        text: "\\format json"
      - type: query
        text: "RETURN {key: 'value', num: 42} AS obj"
        expect:
          contains:
            - "obj"
