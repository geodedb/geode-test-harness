version: "1.0"
name: "Shell Basic Tests"
description: "Basic shell tests without server management"

# Don't manage server - use external server
manage_server: true

tests:
  # Test 1: Simple query
  - name: "shell-return-query"
    type: shell_query
    description: "Verify simple RETURN query works"
    query: "RETURN 1 AS x"
    expect:
      rows: 1

  # Test 2: CREATE and query
  - name: "shell-create-query"
    type: shell_steps
    description: "Create node and query it"
    steps:
      - type: query
        text: "CREATE (n:ShellBasicTest {id: 1, name: 'test'})"

      - type: query
        text: "MATCH (n:ShellBasicTest) RETURN n.id AS id"

  # Test 3: /source command
  - name: "shell-source-command"
    type: shell_source
    description: "Test /source command"
    source_content: |
      CREATE (n:SourceTest {id: 1});
      CREATE (n:SourceTest {id: 2});
    expect:
      success: true

  # Test 4: /help command
  - name: "shell-help-command"
    type: shell_steps
    description: "Verify /help command works"
    steps:
      - type: command
        text: "/help"
        expect:
          contains:
            - "help"
