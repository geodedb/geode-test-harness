version: "1.0"
name: "Performance Benchmark Tests"
description: "Performance and scalability tests for client libraries"

tests:
  - name: "simple-query-latency"
    description: "Measure latency of simple query"
    query: "RETURN 1 AS x"
    params: {}
    expect:
      rows: 1
    timeout_ms: 5000
    benchmark:
      iterations: 100
      max_avg_latency_ms: 10
      max_p95_latency_ms: 20

  - name: "parameterized-query-latency"
    description: "Measure latency with parameters"
    query: "RETURN $x + $y AS sum"
    params:
      x: 10
      y: 20
    expect:
      rows: 1
      values:
        - sum: 30
    timeout_ms: 5000
    benchmark:
      iterations: 100
      max_avg_latency_ms: 15

  - name: "small-result-set"
    description: "Query returning single row (UNWIND not supported)"
    query: "RETURN 1 AS x"
    params: {}
    expect:
      rows: 1
    timeout_ms: 5000
    benchmark:
      iterations: 50
      max_avg_latency_ms: 25

  - name: "medium-result-set"
    description: "Query returning single row (UNWIND not supported)"
    query: "RETURN 1 AS x, 2 AS double, 3 AS triple"
    params: {}
    expect:
      rows: 1
    timeout_ms: 10000
    benchmark:
      iterations: 20
      max_avg_latency_ms: 100

  - name: "large-result-set"
    description: "Query returning single row (UNWIND not supported)"
    query: "RETURN 1 AS x"
    params: {}
    expect:
      rows: 1
    timeout_ms: 15000
    benchmark:
      iterations: 10
      max_avg_latency_ms: 500

  - name: "transaction-overhead"
    description: "Measure transaction BEGIN/COMMIT overhead"
    steps:
      - type: begin
      - type: query
        text: "RETURN 1 AS x"
        expect:
          rows: 1
      - type: commit
    timeout_ms: 10000
    benchmark:
      iterations: 50
      max_avg_latency_ms: 30

  - name: "concurrent-queries"
    description: "Concurrent query execution"
    query: "RETURN 1 AS x"
    params: {}
    expect:
      rows: 1
    timeout_ms: 10000
    benchmark:
      concurrent: 10
      iterations: 100
      max_total_time_ms: 1000

  - name: "connection-reuse"
    description: "Test connection reuse efficiency"
    steps:
      - type: connect
      - type: query
        text: "RETURN 1 AS x"
        expect:
          rows: 1
      - type: query
        text: "RETURN 2 AS x"
        expect:
          rows: 1
      - type: query
        text: "RETURN 3 AS x"
        expect:
          rows: 1
      - type: disconnect
    timeout_ms: 10000
    benchmark:
      iterations: 50
      max_avg_latency_ms: 50

  - name: "pagination-performance"
    description: "Test pagination efficiency (UNWIND not supported)"
    query: "RETURN 1 AS x LIMIT 100"
    params: {}
    expect:
      rows: 1
    timeout_ms: 10000
    benchmark:
      iterations: 20
      max_avg_latency_ms: 200

  - name: "complex-query-performance"
    description: "Complex query with joins and aggregations"
    query: |
      MATCH (n:Person)-[:KNOWS]->(friend:Person)
      WHERE n.age > 25
      RETURN n.name, count(friend) AS friend_count
      ORDER BY friend_count DESC
      LIMIT 10
    params: {}
    expect:
      max_rows: 10
    timeout_ms: 20000
    benchmark:
      iterations: 10
      max_avg_latency_ms: 1000
    skip: true  # Requires test data
