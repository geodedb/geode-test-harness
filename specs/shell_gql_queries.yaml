version: "1.0"
name: "Shell GQL Query Tests"
description: "Comprehensive tests for GQL queries executed in the shell"

# NOTE ON GQL COMPLIANCE:
# This file tests query features. Some features are:
# - GQL Standard: RETURN, basic operators, comparisons, AND/OR/NOT, IS NULL, aggregations
# - Implementation-Specific: Built-in functions (toUpper, toLower, trim, head, tail, coalesce, etc.)
#   These functions are commonly implemented but not defined in the ISO/IEC 39075:2024 EBNF.
#
# String concatenation:
# - GQL Standard uses '||' operator
# - Cypher uses '+' operator
# Tests marked with "impl_specific:" indicate implementation-specific features.

manage_server: true

tests:
  # ============================================
  # BASIC RETURN QUERIES
  # ============================================

  - name: "shell-gql-return-integer"
    type: shell_query
    description: "Test RETURN with integer"
    query: "RETURN 42 AS num"
    expect:
      rows: 1
      contains:
        - "42"
        - "num"

  - name: "shell-gql-return-string"
    type: shell_query
    description: "Test RETURN with string"
    query: "RETURN 'hello' AS msg"
    expect:
      rows: 1
      contains:
        - "hello"
        - "msg"

  - name: "shell-gql-return-float"
    type: shell_query
    description: "Test RETURN with float"
    query: "RETURN 3.14159 AS pi"
    expect:
      rows: 1
      contains:
        - "3.14"
        - "pi"

  - name: "shell-gql-return-boolean-true"
    type: shell_query
    description: "Test RETURN with true"
    query: "RETURN true AS flag"
    expect:
      rows: 1
      contains:
        - "flag"

  - name: "shell-gql-return-boolean-false"
    type: shell_query
    description: "Test RETURN with false"
    query: "RETURN false AS flag"
    expect:
      rows: 1
      contains:
        - "flag"

  - name: "shell-gql-return-null"
    type: shell_query
    description: "Test RETURN with null"
    query: "RETURN null AS nothing"
    expect:
      rows: 1
      contains:
        - "nothing"

  - name: "shell-gql-return-multiple-columns"
    type: shell_query
    description: "Test RETURN with multiple columns"
    query: "RETURN 1 AS a, 2 AS b, 3 AS c, 4 AS d"
    expect:
      rows: 1
      contains:
        - "a"
        - "b"
        - "c"
        - "d"

  # ============================================
  # ARITHMETIC OPERATIONS
  # ============================================

  - name: "shell-gql-arithmetic-add"
    type: shell_query
    description: "Test addition"
    query: "RETURN 10 + 5 AS result"
    expect:
      rows: 1
      contains:
        - "15"

  - name: "shell-gql-arithmetic-subtract"
    type: shell_query
    description: "Test subtraction"
    query: "RETURN 10 - 3 AS result"
    expect:
      rows: 1
      contains:
        - "7"

  - name: "shell-gql-arithmetic-multiply"
    type: shell_query
    description: "Test multiplication"
    query: "RETURN 6 * 7 AS result"
    expect:
      rows: 1
      contains:
        - "42"

  - name: "shell-gql-arithmetic-divide"
    type: shell_query
    description: "Test division"
    query: "RETURN 100 / 4 AS result"
    expect:
      rows: 1
      contains:
        - "25"

  - name: "shell-gql-arithmetic-modulo"
    type: shell_query
    description: "Test modulo"
    query: "RETURN 17 % 5 AS result"
    expect:
      rows: 1
      contains:
        - "2"

  # ============================================
  # STRING OPERATIONS
  # Note: String functions (length, toUpper, toLower, trim, substring) are
  # implementation-specific - commonly supported but not in GQL EBNF.
  # ============================================

  - name: "shell-gql-string-concat-standard"
    type: shell_query
    description: "Test string concatenation with || (GQL standard)"
    query: "RETURN 'Hello' || ' ' || 'World' AS greeting"
    expect:
      rows: 1
      contains:
        - "Hello World"

  # Note: '+' for string concat is Cypher-specific, not GQL standard
  - name: "shell-cypher_compat-string-concat-plus"
    type: shell_query
    description: "Test string concatenation with + (Cypher compatibility)"
    query: "RETURN 'Hello' + ' ' + 'World' AS greeting"
    expect:
      rows: 1
      contains:
        - "Hello World"

  - name: "shell-impl_specific-string-length"
    type: shell_query
    description: "Test string length function (implementation-specific)"
    query: "RETURN length('testing') AS len"
    expect:
      rows: 1
      contains:
        - "7"

  - name: "shell-impl_specific-string-upper"
    type: shell_query
    description: "Test toUpper function (implementation-specific)"
    query: "RETURN toUpper('hello') AS upper"
    expect:
      rows: 1
      contains:
        - "HELLO"

  - name: "shell-impl_specific-string-lower"
    type: shell_query
    description: "Test toLower function (implementation-specific)"
    query: "RETURN toLower('HELLO') AS lower"
    expect:
      rows: 1
      contains:
        - "hello"

  - name: "shell-impl_specific-string-trim"
    type: shell_query
    description: "Test trim function (implementation-specific)"
    query: "RETURN trim('  spaces  ') AS trimmed"
    expect:
      rows: 1
      contains:
        - "spaces"

  - name: "shell-impl_specific-string-substring"
    type: shell_query
    description: "Test substring function (implementation-specific)"
    query: "RETURN substring('hello world', 0, 5) AS sub"
    expect:
      rows: 1
      contains:
        - "hello"

  # ============================================
  # LIST OPERATIONS
  # Note: List functions (size, head, tail) are implementation-specific.
  # List literals and index access are commonly supported.
  # ============================================

  - name: "shell-gql-list-literal"
    type: shell_query
    description: "Test list literal"
    query: "RETURN [1, 2, 3] AS nums"
    expect:
      rows: 1
      contains:
        - "1"
        - "2"
        - "3"

  - name: "shell-impl_specific-list-size"
    type: shell_query
    description: "Test list size function (implementation-specific)"
    query: "RETURN size([1, 2, 3, 4, 5]) AS len"
    expect:
      rows: 1
      contains:
        - "5"

  - name: "shell-impl_specific-list-head"
    type: shell_query
    description: "Test list head function (implementation-specific)"
    query: "RETURN head([1, 2, 3]) AS first"
    expect:
      rows: 1
      contains:
        - "1"

  - name: "shell-impl_specific-list-tail"
    type: shell_query
    description: "Test list tail function (implementation-specific)"
    query: "RETURN tail([1, 2, 3]) AS rest"
    expect:
      rows: 1

  - name: "shell-gql-list-index-access"
    type: shell_query
    description: "Test list index access"
    query: "RETURN [10, 20, 30][1] AS second"
    expect:
      rows: 1
      contains:
        - "20"

  # ============================================
  # MAP OPERATIONS
  # ============================================

  - name: "shell-gql-map-literal"
    type: shell_query
    description: "Test map literal"
    query: "RETURN {name: 'test', value: 42} AS obj"
    expect:
      rows: 1
      contains:
        - "name"

  - name: "shell-gql-map-property-access"
    type: shell_query
    description: "Test map property access"
    query: "RETURN {name: 'Alice', age: 30}.name AS n"
    expect:
      rows: 1
      contains:
        - "Alice"

  # ============================================
  # COMPARISON OPERATORS
  # ============================================

  - name: "shell-gql-compare-equal"
    type: shell_query
    description: "Test equality comparison"
    query: "RETURN 5 = 5 AS result"
    expect:
      rows: 1

  - name: "shell-gql-compare-not-equal"
    type: shell_query
    description: "Test inequality comparison"
    query: "RETURN 5 <> 3 AS result"
    expect:
      rows: 1

  - name: "shell-gql-compare-less-than"
    type: shell_query
    description: "Test less than comparison"
    query: "RETURN 3 < 5 AS result"
    expect:
      rows: 1

  - name: "shell-gql-compare-greater-than"
    type: shell_query
    description: "Test greater than comparison"
    query: "RETURN 5 > 3 AS result"
    expect:
      rows: 1

  # ============================================
  # LOGICAL OPERATORS
  # ============================================

  - name: "shell-gql-logical-and"
    type: shell_query
    description: "Test AND operator"
    query: "RETURN true AND true AS result"
    expect:
      rows: 1

  - name: "shell-gql-logical-or"
    type: shell_query
    description: "Test OR operator"
    query: "RETURN true OR false AS result"
    expect:
      rows: 1

  - name: "shell-gql-logical-not"
    type: shell_query
    description: "Test NOT operator"
    query: "RETURN NOT false AS result"
    expect:
      rows: 1

  # ============================================
  # CASE EXPRESSIONS
  # ============================================

  - name: "shell-gql-case-simple"
    type: shell_query
    description: "Test simple CASE expression"
    query: "RETURN CASE WHEN 1 > 0 THEN 'positive' ELSE 'non-positive' END AS sign"
    expect:
      rows: 1
      contains:
        - "positive"

  - name: "shell-gql-case-multiple"
    type: shell_query
    description: "Test CASE with multiple conditions"
    query: |
      RETURN CASE
        WHEN 5 > 10 THEN 'big'
        WHEN 5 > 3 THEN 'medium'
        ELSE 'small'
      END AS size
    expect:
      rows: 1
      contains:
        - "medium"

  # ============================================
  # NULL HANDLING
  # ============================================

  - name: "shell-gql-null-is-null"
    type: shell_query
    description: "Test IS NULL"
    query: "RETURN null IS NULL AS result"
    expect:
      rows: 1

  - name: "shell-gql-null-is-not-null"
    type: shell_query
    description: "Test IS NOT NULL"
    query: "RETURN 42 IS NOT NULL AS result"
    expect:
      rows: 1

  - name: "shell-impl_specific-null-coalesce"
    type: shell_query
    description: "Test COALESCE function (implementation-specific)"
    query: "RETURN coalesce(null, 'default') AS val"
    expect:
      rows: 1
      contains:
        - "default"

  # ============================================
  # AGGREGATION FUNCTIONS
  # ============================================

  - name: "shell-gql-aggregate-count"
    type: shell_steps
    description: "Test COUNT aggregation"
    steps:
      - type: query
        text: "CREATE (n:CountTest {id: 1})"
      - type: query
        text: "CREATE (n:CountTest {id: 2})"
      - type: query
        text: "CREATE (n:CountTest {id: 3})"
      - type: query
        text: "MATCH (n:CountTest) RETURN count(n) AS cnt"
        expect:
          contains:
            - "3"

  - name: "shell-gql-aggregate-sum"
    type: shell_steps
    description: "Test SUM aggregation"
    steps:
      - type: query
        text: "CREATE (n:SumTest {value: 10})"
      - type: query
        text: "CREATE (n:SumTest {value: 20})"
      - type: query
        text: "CREATE (n:SumTest {value: 30})"
      - type: query
        text: "MATCH (n:SumTest) RETURN sum(n.value) AS total"
        expect:
          contains:
            - "60"

  - name: "shell-gql-aggregate-avg"
    type: shell_steps
    description: "Test AVG aggregation"
    steps:
      - type: query
        text: "CREATE (n:AvgTest {value: 10})"
      - type: query
        text: "CREATE (n:AvgTest {value: 20})"
      - type: query
        text: "CREATE (n:AvgTest {value: 30})"
      - type: query
        text: "MATCH (n:AvgTest) RETURN avg(n.value) AS average"
        expect:
          contains:
            - "20"

  - name: "shell-gql-aggregate-min"
    type: shell_steps
    description: "Test MIN aggregation"
    steps:
      - type: query
        text: "CREATE (n:MinTest {value: 5})"
      - type: query
        text: "CREATE (n:MinTest {value: 15})"
      - type: query
        text: "CREATE (n:MinTest {value: 25})"
      - type: query
        text: "MATCH (n:MinTest) RETURN min(n.value) AS minimum"
        expect:
          contains:
            - "5"

  - name: "shell-gql-aggregate-max"
    type: shell_steps
    description: "Test MAX aggregation"
    steps:
      - type: query
        text: "CREATE (n:MaxTest {value: 5})"
      - type: query
        text: "CREATE (n:MaxTest {value: 15})"
      - type: query
        text: "CREATE (n:MaxTest {value: 25})"
      - type: query
        text: "MATCH (n:MaxTest) RETURN max(n.value) AS maximum"
        expect:
          contains:
            - "25"

  # ============================================
  # ORDER BY AND LIMIT
  # ============================================

  - name: "shell-gql-order-by-asc"
    type: shell_steps
    description: "Test ORDER BY ascending"
    steps:
      - type: query
        text: "CREATE (n:OrderTest {name: 'Charlie'})"
      - type: query
        text: "CREATE (n:OrderTest {name: 'Alice'})"
      - type: query
        text: "CREATE (n:OrderTest {name: 'Bob'})"
      - type: query
        text: "MATCH (n:OrderTest) RETURN n.name AS name ORDER BY n.name"
        expect:
          contains:
            - "Alice"
            - "Bob"
            - "Charlie"

  - name: "shell-gql-order-by-desc"
    type: shell_steps
    description: "Test ORDER BY descending"
    steps:
      - type: query
        text: "CREATE (n:OrderDescTest {value: 1})"
      - type: query
        text: "CREATE (n:OrderDescTest {value: 2})"
      - type: query
        text: "CREATE (n:OrderDescTest {value: 3})"
      - type: query
        text: "MATCH (n:OrderDescTest) RETURN n.value AS v ORDER BY n.value DESC LIMIT 1"
        expect:
          contains:
            - "3"

  - name: "shell-gql-limit"
    type: shell_steps
    description: "Test LIMIT clause"
    steps:
      - type: query
        text: "CREATE (n:LimitTest {id: 1})"
      - type: query
        text: "CREATE (n:LimitTest {id: 2})"
      - type: query
        text: "CREATE (n:LimitTest {id: 3})"
      - type: query
        text: "CREATE (n:LimitTest {id: 4})"
      - type: query
        text: "CREATE (n:LimitTest {id: 5})"
      - type: query
        text: "MATCH (n:LimitTest) RETURN n.id AS id LIMIT 3"
        expect:
          rows: 3

  - name: "shell-gql-skip"
    type: shell_steps
    description: "Test SKIP clause"
    steps:
      - type: query
        text: "CREATE (n:SkipTest {id: 1})"
      - type: query
        text: "CREATE (n:SkipTest {id: 2})"
      - type: query
        text: "CREATE (n:SkipTest {id: 3})"
      - type: query
        text: "MATCH (n:SkipTest) RETURN n.id AS id ORDER BY n.id SKIP 1 LIMIT 2"
        expect:
          rows: 2
