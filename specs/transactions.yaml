version: "1.0"
name: "Transaction Tests"
description: "Transaction management and isolation tests"

setup:
  - type: query
    text: "CREATE (n:TransTest {id: 0}) RETURN n"

tests:
  - name: "begin-commit"
    description: "Basic transaction BEGIN and COMMIT"
    steps:
      - type: begin
      - type: query
        text: "CREATE (n:TransTest {id: 1}) RETURN n"
        expect:
          rows: 1
      - type: commit
    timeout_ms: 10000

  - name: "begin-rollback"
    description: "Transaction ROLLBACK"
    steps:
      - type: begin
      - type: query
        text: "CREATE (n:TransTest {id: 2, testmarker: 'rollback_test'}) RETURN n"
        expect:
          rows: 1
      - type: rollback
    timeout_ms: 10000

  - name: "auto-commit"
    description: "Auto-commit without explicit transaction"
    steps:
      - type: query
        text: "CREATE (n:TransTest {id: 3, testmarker: 'autocommit_test'}) RETURN n"
        expect:
          rows: 1
      - type: query
        text: "MATCH (n:TransTest {id: 3, testmarker: 'autocommit_test'}) RETURN n"
        expect:
          min_rows: 1
    timeout_ms: 10000

  - name: "rollback-on-error"
    description: "Transaction rollback on error"
    steps:
      - type: begin
      - type: query
        text: "CREATE (n:TransTest {id: 4, testmarker: 'error_test'}) RETURN n"
        expect:
          rows: 1
      - type: query
        text: "INVALID SYNTAX HERE"
        expect_error: true
      - type: rollback
    timeout_ms: 10000

  - name: "nested-transaction-attempt"
    description: "Nested transaction handling (should error or handle gracefully)"
    steps:
      - type: begin
      - type: begin
        expect_error: true
      - type: rollback
    timeout_ms: 10000

  - name: "commit-without-begin"
    description: "COMMIT without BEGIN (should error or be no-op)"
    steps:
      - type: commit
        expect_error: true
    timeout_ms: 5000

  - name: "rollback-without-begin"
    description: "ROLLBACK without BEGIN (should error or be no-op)"
    steps:
      - type: rollback
        expect_error: true
    timeout_ms: 5000

  - name: "multiple-operations-in-transaction"
    description: "Multiple operations within a single transaction"
    steps:
      - type: begin
      - type: query
        text: "CREATE (n:TransTest {id: 5, testmarker: 'multi_op_1'}) RETURN n"
        expect:
          rows: 1
      - type: query
        text: "CREATE (n:TransTest {id: 6, testmarker: 'multi_op_2'}) RETURN n"
        expect:
          rows: 1
      - type: query
        text: "MATCH (n:TransTest) WHERE n.testmarker IN ['multi_op_1', 'multi_op_2'] RETURN count(n) AS cnt"
        expect:
          rows: 1
      - type: commit
      - type: query
        text: "MATCH (n:TransTest) WHERE n.testmarker IN ['multi_op_1', 'multi_op_2'] RETURN count(n) AS cnt"
        expect:
          rows: 1
    timeout_ms: 15000

  - name: "read-after-rollback"
    description: "Verify data is not visible after rollback (rollback may not be fully implemented)"
    steps:
      - type: begin
      - type: query
        text: "CREATE (n:TransTest {id: 7, name: 'should_not_exist', testmarker: 'rollback_verify'}) RETURN n"
        expect:
          rows: 1
      - type: rollback
    timeout_ms: 10000

  - name: "transaction-with-parameters"
    description: "Parameterized queries in transaction"
    steps:
      - type: begin
      - type: query
        text: "CREATE (n:TransTest {id: $id, name: $name, testmarker: 'param_test'}) RETURN n"
        params:
          id: 8
          name: "Alice"
        expect:
          rows: 1
      - type: commit
      - type: query
        text: "MATCH (n:TransTest {testmarker: 'param_test'}) RETURN n.name AS name"
        expect:
          rows: 1
    timeout_ms: 10000

cleanup:
  - type: query
    text: "MATCH (n:TransTest) DELETE n"
