version: "1.0"
name: "Shell Meta-Commands Tests"
description: "Comprehensive tests for shell meta-commands (\\command or /command)"

# Don't manage server - use external server
manage_server: true

tests:
  # ============================================
  # HELP COMMANDS
  # ============================================

  - name: "shell-help-slash"
    type: shell_steps
    description: "Test /help command"
    steps:
      - type: command
        text: "/help"
        expect:
          contains:
            - "help"
            - "quit"
            - "source"

  - name: "shell-help-backslash"
    type: shell_steps
    description: "Test \\help command"
    steps:
      - type: command
        text: "\\help"
        expect:
          contains:
            - "help"
            - "quit"

  - name: "shell-help-h"
    type: shell_steps
    description: "Test \\h shortcut"
    steps:
      - type: command
        text: "\\h"
        expect:
          contains:
            - "help"

  - name: "shell-help-question"
    type: shell_steps
    description: "Test \\? shortcut"
    steps:
      - type: command
        text: "\\?"
        expect:
          contains:
            - "help"

  # ============================================
  # ECHO COMMAND
  # ============================================

  - name: "shell-echo-simple"
    type: shell_steps
    description: "Test \\echo with simple text"
    steps:
      - type: command
        text: "\\echo Hello World"
        expect:
          contains:
            - "Hello World"

  - name: "shell-echo-numbers"
    type: shell_steps
    description: "Test \\echo with numbers"
    steps:
      - type: command
        text: "\\echo 12345"
        expect:
          contains:
            - "12345"

  - name: "shell-echo-special-chars"
    type: shell_steps
    description: "Test \\echo with special characters"
    steps:
      - type: command
        text: "\\echo test@example.com"
        expect:
          contains:
            - "test@example.com"

  # ============================================
  # TIMING COMMAND
  # ============================================

  - name: "shell-timing-on"
    type: shell_steps
    description: "Test \\timing on enables query timing"
    steps:
      - type: command
        text: "\\timing on"
        expect:
          contains:
            - "Timing"
      - type: query
        text: "RETURN 1 AS x"
        expect:
          contains:
            - "ms"

  - name: "shell-timing-off"
    type: shell_steps
    description: "Test \\timing off disables query timing"
    steps:
      - type: command
        text: "\\timing off"
        expect:
          contains:
            - "Timing"

  # ============================================
  # FORMAT COMMAND
  # ============================================

  - name: "shell-format-table"
    type: shell_steps
    description: "Test \\format table"
    steps:
      - type: command
        text: "\\format table"
      - type: query
        text: "RETURN 1 AS x"
        expect:
          contains:
            - "|"
            - "x"

  - name: "shell-format-json"
    type: shell_steps
    description: "Test \\format json"
    steps:
      - type: command
        text: "\\format json"
      - type: query
        text: "RETURN 1 AS x"
        expect:
          contains:
            - "{"
            - "x"

  - name: "shell-format-csv"
    type: shell_steps
    description: "Test \\format csv"
    steps:
      - type: command
        text: "\\format csv"
      - type: query
        text: "RETURN 1 AS a, 2 AS b"
        expect:
          contains:
            - "a,b"
            - "1,2"

  # ============================================
  # GRAPH COMMANDS
  # ============================================

  - name: "shell-graph-show-default"
    type: shell_steps
    description: "Test \\graph shows current graph"
    steps:
      - type: command
        text: "\\graph"
        expect:
          # Should show default or no graph
          success: true

  - name: "shell-graphs-list"
    type: shell_steps
    description: "Test \\graphs lists all graphs"
    steps:
      - type: command
        text: "\\graphs"
        expect:
          success: true

  - name: "shell-use-graph"
    type: shell_steps
    description: "Test \\use to switch graphs"
    steps:
      - type: query
        text: "CREATE GRAPH testgraph1"
      - type: command
        text: "\\use testgraph1"
        expect:
          success: true
      - type: command
        text: "\\graph"
        expect:
          contains:
            - "testgraph1"
      - type: query
        text: "DROP GRAPH testgraph1"

  # ============================================
  # HISTORY COMMANDS
  # ============================================

  - name: "shell-history-show"
    type: shell_steps
    description: "Test \\history shows history"
    steps:
      - type: query
        text: "RETURN 1 AS x"
      - type: query
        text: "RETURN 2 AS y"
      - type: command
        text: "\\history"
        expect:
          success: true

  - name: "shell-history-with-count"
    type: shell_steps
    description: "Test \\history n shows last n entries"
    steps:
      - type: query
        text: "RETURN 1 AS a"
      - type: query
        text: "RETURN 2 AS b"
      - type: query
        text: "RETURN 3 AS c"
      - type: command
        text: "\\history 2"
        expect:
          success: true

  # ============================================
  # TRANSACTION COMMANDS
  # ============================================

  - name: "shell-transaction-begin-commit"
    type: shell_steps
    description: "Test \\begin and \\commit"
    steps:
      - type: command
        text: "\\begin"
        expect:
          success: true
      - type: query
        text: "CREATE (n:TxnTest {id: 1})"
      - type: command
        text: "\\commit"
        expect:
          success: true
      - type: query
        text: "MATCH (n:TxnTest {id: 1}) RETURN n.id AS id"
        expect:
          contains:
            - "1"

  - name: "shell-transaction-begin-rollback"
    type: shell_steps
    description: "Test \\begin and \\rollback"
    steps:
      - type: command
        text: "\\begin"
        expect:
          success: true
      - type: query
        text: "CREATE (n:RollbackTest {id: 999})"
      - type: command
        text: "\\rollback"
        expect:
          success: true
      - type: query
        text: "MATCH (n:RollbackTest {id: 999}) RETURN count(n) AS cnt"
        expect:
          contains:
            - "0"

  # ============================================
  # SLASH VS BACKSLASH PREFIX
  # ============================================

  - name: "shell-slash-prefix-works"
    type: shell_steps
    description: "Verify / prefix works for commands"
    steps:
      - type: command
        text: "/echo slash prefix test"
        expect:
          contains:
            - "slash prefix test"

  - name: "shell-backslash-prefix-works"
    type: shell_steps
    description: "Verify \\ prefix works for commands"
    steps:
      - type: command
        text: "\\echo backslash prefix test"
        expect:
          contains:
            - "backslash prefix test"
