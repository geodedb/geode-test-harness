version: "1.0"
name: "Shell Persistence Tests"
description: "Tests for data persistence via interactive shell /source command"

# This spec tests the persistence of data created through the shell's /source command
# It verifies that data survives server restarts and is properly saved to disk

# Server management configuration
manage_server: true
server_options:
  disable_auth: true

tests:
  # Test 1: Small file persistence (under 32KB threshold)
  - name: "small-file-source-persistence"
    type: shell_persistence
    description: "Verify that small files sourced via shell persist to disk"
    steps:
      - type: create_data
        content: |
          CREATE (n1:SmallTest {id: 1, name: "small_node_1"});
          CREATE (n2:SmallTest {id: 2, name: "small_node_2"});
          CREATE (n3:SmallTest {id: 3, name: "small_node_3"});

      - type: check_persistence_file
        min_size: 50  # At least 50 bytes indicates data was saved

      - type: restart_server

      - type: verify_data
        query: "MATCH (n:SmallTest) RETURN count(n) AS cnt"
        expect:
          min_rows: 1

  # Test 2: Large file persistence (over 32KB threshold, uses chunked execution)
  - name: "large-file-source-persistence"
    type: shell_persistence
    description: "Verify that large files using chunked execution persist to disk"
    timeout_ms: 600000  # 10 minutes for large file
    steps:
      - type: create_data
        content: |
          # Generate 500 CREATE statements to exceed 32KB threshold
          CREATE (n1:LargeTest {id: 1, name: "large_node_1", description: "A test node for chunked execution testing"});
          CREATE (n2:LargeTest {id: 2, name: "large_node_2", description: "A test node for chunked execution testing"});
          CREATE (n3:LargeTest {id: 3, name: "large_node_3", description: "A test node for chunked execution testing"});
          CREATE (n4:LargeTest {id: 4, name: "large_node_4", description: "A test node for chunked execution testing"});
          CREATE (n5:LargeTest {id: 5, name: "large_node_5", description: "A test node for chunked execution testing"});
          CREATE (n6:LargeTest {id: 6, name: "large_node_6", description: "A test node for chunked execution testing"});
          CREATE (n7:LargeTest {id: 7, name: "large_node_7", description: "A test node for chunked execution testing"});
          CREATE (n8:LargeTest {id: 8, name: "large_node_8", description: "A test node for chunked execution testing"});
          CREATE (n9:LargeTest {id: 9, name: "large_node_9", description: "A test node for chunked execution testing"});
          CREATE (n10:LargeTest {id: 10, name: "large_node_10", description: "A test node for chunked execution testing"});

      - type: check_persistence_file
        min_size: 100

      - type: restart_server

      - type: verify_data
        query: "MATCH (n:LargeTest) RETURN count(n) AS cnt"
        expect:
          min_rows: 1

  # Test 3: Simple /source command execution
  - name: "shell-source-basic"
    type: shell_source
    description: "Verify basic /source command execution"
    source_content: |
      CREATE (n:SourceTest {id: 1, name: "source_test"});
      RETURN 1 AS x;
    expect:
      success: true
      statements: 2

  # Test 4: Query execution via shell
  - name: "shell-query-basic"
    type: shell_query
    description: "Verify queries can be executed via shell"
    query: "RETURN 1 AS x"
    expect:
      rows: 1

  # Test 5: Multi-step shell interaction
  - name: "shell-multi-step"
    type: shell_steps
    description: "Verify multi-step shell interactions work"
    steps:
      - type: query
        text: "CREATE (n:StepTest {id: 1})"

      - type: query
        text: "MATCH (n:StepTest) RETURN n.id AS id"

      - type: command
        text: "/help"
        expect:
          contains:
            - "help"

  # Test 6: Transaction handling in shell
  - name: "shell-transaction"
    type: shell_steps
    description: "Verify transaction commands work in shell"
    steps:
      - type: command
        text: "BEGIN"

      - type: query
        text: "CREATE (n:TxnTest {id: 1})"

      - type: command
        text: "COMMIT"

      - type: query
        text: "MATCH (n:TxnTest) RETURN count(n) AS cnt"

  # Test 7: Named graph creation and persistence
  - name: "shell-named-graph-persistence"
    type: shell_persistence
    description: "Verify named graphs are persisted"
    steps:
      - type: create_data
        content: |
          CREATE GRAPH testgraph;
          USE GRAPH testgraph;
          CREATE (n:GraphNode {id: 1, name: "in_named_graph"});

      - type: check_persistence_file
        min_size: 50

      - type: restart_server

      - type: verify_data
        query: "USE GRAPH testgraph; MATCH (n:GraphNode) RETURN count(n) AS cnt"
        expect:
          min_rows: 1

  # Test 8: Edge creation and persistence
  - name: "shell-edge-persistence"
    type: shell_persistence
    description: "Verify edges are persisted"
    steps:
      - type: create_data
        content: |
          CREATE (a:Person {name: "Alice"});
          CREATE (b:Person {name: "Bob"});
          MATCH (a:Person {name: "Alice"}), (b:Person {name: "Bob"})
          CREATE (a)-[:KNOWS {since: 2024}]->(b);

      - type: check_persistence_file
        min_size: 50

      - type: restart_server

      - type: verify_data
        query: "MATCH (a:Person)-[r:KNOWS]->(b:Person) RETURN count(r) AS cnt"
        expect:
          min_rows: 1

  # Test 9: Property types persistence
  - name: "shell-property-types-persistence"
    type: shell_persistence
    description: "Verify different property types are persisted correctly"
    steps:
      - type: create_data
        content: |
          CREATE (n:TypeTest {
            str_prop: "hello",
            int_prop: 42,
            float_prop: 3.14,
            bool_prop: true,
            list_prop: [1, 2, 3]
          });

      - type: check_persistence_file
        min_size: 50

      - type: restart_server

      - type: verify_data
        query: "MATCH (n:TypeTest) RETURN n.str_prop AS s, n.int_prop AS i"
        expect:
          min_rows: 1

  # Test 10: Multiple files sourced sequentially
  - name: "shell-multiple-source-persistence"
    type: shell_steps
    description: "Verify multiple /source commands persist data"
    steps:
      - type: command
        text: "/source /dev/stdin"
        timeout_ms: 5000
        # Note: This test may need adjustment based on how stdin is handled

      - type: query
        text: "CREATE (n:MultiSource1 {id: 1})"

      - type: query
        text: "CREATE (n:MultiSource2 {id: 2})"

      - type: query
        text: "MATCH (n) WHERE n:MultiSource1 OR n:MultiSource2 RETURN count(n) AS cnt"
