  # ============================================
  # ARITHMETIC EXPRESSIONS (GQL Standard)
  # ============================================

  - name: "gql-arithmetic-unary-minus"
    type: shell_query
    description: "Unary minus operator"
    query: "RETURN -5 AS neg"
    expect:
      rows: 1
      contains:
        - "-5"

  - name: "gql-arithmetic-unary-plus"
    type: shell_query
    description: "Unary plus operator"
    query: "RETURN +5 AS pos"
    expect:
      rows: 1
      contains:
        - "5"

  - name: "gql-arithmetic-modulo"
    type: shell_query
    description: "Modulo operator %"
    query: "RETURN 17 % 5 AS remainder"
    expect:
      rows: 1
      contains:
        - "2"

  - name: "gql-arithmetic-parentheses"
    type: shell_query
    description: "Parenthesized expressions"
    query: "RETURN (2 + 3) * 4 AS result"
    expect:
      rows: 1
      contains:
        - "20"

  # ============================================
  # PROPERTY ACCESS ON EXPRESSIONS
  # ============================================

  - name: "gql-property-access-map"
    type: shell_query
    description: "Property access on map literal"
    query: "RETURN {name: 'test', value: 42}.value AS v"
    expect:
      rows: 1
      contains:
        - "42"

  # ============================================
  # PATTERN WITH PROPERTIES
  # ============================================

  - name: "gql-pattern-node-properties"
    type: shell_steps
    description: "Node pattern with inline properties"
    steps:
      - type: query
        text: "CREATE (n:InlineProp {a: 1, b: 2, c: 3})"
      - type: query
        text: "MATCH (n:InlineProp {a: 1, b: 2}) RETURN n.c AS c"
        expect:
          contains:
            - "3"

  - name: "gql-pattern-rel-properties"
    type: shell_steps
    description: "Relationship pattern with inline properties"
    steps:
      - type: query
        text: "CREATE (a:RelPropTest {id: 1})-[:HAS {weight: 10}]->(b:RelPropTest {id: 2})"
      - type: query
        text: "MATCH (a)-[r:HAS {weight: 10}]->(b) RETURN r.weight AS w"
        expect:
          contains:
            - "10"

  # ============================================
  # MULTIPLE NODE LABELS
  # ============================================

  - name: "gql-node-multiple-labels-create"
    type: shell_steps
    description: "Create node with multiple labels"
    steps:
      - type: query
        text: "CREATE (n:Label1:Label2:Label3 {id: 1})"
        expect:
          success: true
      - type: query
        text: "MATCH (n:Label1:Label2:Label3) RETURN n.id AS id"
        expect:
          contains:
            - "1"

  - name: "gql-node-multiple-labels-match"
    type: shell_steps
    description: "Match node with multiple labels"
    steps:
      - type: query
        text: "CREATE (n:MatchL1:MatchL2 {id: 1})"
      - type: query
        text: "MATCH (n:MatchL1:MatchL2) RETURN n.id AS id"
        expect:
          contains:
            - "1"

  # ============================================
  # BINDING VARIABLE IN PATTERN
  # ============================================

  - name: "gql-bind-variable-node"
    type: shell_steps
    description: "Bind variable to node in pattern"
    steps:
      - type: query
        text: "CREATE (n:BindNode {id: 1})"
      - type: query
        text: "MATCH (myNode:BindNode) RETURN myNode.id AS id"
        expect:
          contains:
            - "1"

  - name: "gql-bind-variable-relationship"
    type: shell_steps
    description: "Bind variable to relationship in pattern"
    steps:
      - type: query
        text: "CREATE (a:BindRel {id: 1})-[:CONN {weight: 5}]->(b:BindRel {id: 2})"
      - type: query
        text: "MATCH (a)-[myRel:CONN]->(b) RETURN myRel.weight AS w"
        expect:
          contains:
            - "5"

  # ============================================
  # GRAPH PATTERN WITH COMMA (Multiple patterns)
  # ============================================

  - name: "gql-pattern-comma-separated"
    type: shell_steps
    description: "Multiple comma-separated patterns in MATCH"
    steps:
      - type: query
        text: "CREATE (a:CommaP {id: 1}), (b:CommaP {id: 2})"
      - type: query
        text: "MATCH (a:CommaP {id: 1}), (b:CommaP {id: 2}) RETURN a.id AS a_id, b.id AS b_id"
        expect:
          contains:
            - "1"
            - "2"
