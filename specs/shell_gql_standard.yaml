version: "1.0"
name: "Shell GQL Standard Grammar Tests"
description: "Tests for ISO/IEC 39075:2024 GQL standard grammar elements"

# Tests based on official GQL EBNF: specs/gql/gql.ebnf
# This file tests ONLY features that are part of the GQL standard

manage_server: true

tests:
  # ============================================
  # SESSION COMMANDS
  # ============================================

  - name: "gql-session-set-graph"
    type: shell_steps
    description: "SESSION SET PROPERTY GRAPH"
    steps:
      - type: query
        text: "CREATE GRAPH IF NOT EXISTS session_test_graph"
      - type: query
        text: "SESSION SET PROPERTY GRAPH session_test_graph"
        expect:
          success: true

  - name: "gql-session-reset-graph"
    type: shell_steps
    description: "SESSION RESET PROPERTY GRAPH"
    steps:
      - type: query
        text: "SESSION RESET PROPERTY GRAPH"
        expect:
          success: true

  # ============================================
  # TRANSACTION COMMANDS
  # ============================================

  - name: "gql-transaction-start-commit"
    type: shell_steps
    description: "START TRANSACTION ... COMMIT"
    steps:
      - type: query
        text: "START TRANSACTION"
      - type: query
        text: "CREATE (n:TxnStartTest {id: 1})"
      - type: query
        text: "COMMIT"
      - type: query
        text: "MATCH (n:TxnStartTest {id: 1}) RETURN n.id AS id"
        expect:
          contains:
            - "1"

  - name: "gql-transaction-start-rollback"
    type: shell_steps
    description: "START TRANSACTION ... ROLLBACK"
    steps:
      - type: query
        text: "START TRANSACTION"
      - type: query
        text: "CREATE (n:TxnRollTest {id: 999})"
      - type: query
        text: "ROLLBACK"
      - type: query
        text: "MATCH (n:TxnRollTest {id: 999}) RETURN count(n) AS cnt"
        expect:
          contains:
            - "0"

  - name: "gql-transaction-read-only"
    type: shell_steps
    description: "START TRANSACTION READ ONLY"
    steps:
      - type: query
        text: "START TRANSACTION READ ONLY"
      - type: query
        text: "MATCH (n) RETURN count(n) AS cnt"
      - type: query
        text: "COMMIT"
        expect:
          success: true

  - name: "gql-transaction-read-write"
    type: shell_steps
    description: "START TRANSACTION READ WRITE"
    steps:
      - type: query
        text: "START TRANSACTION READ WRITE"
      - type: query
        text: "CREATE (n:TxnReadWriteTest {id: 1})"
      - type: query
        text: "COMMIT"
      - type: query
        text: "MATCH (n:TxnReadWriteTest {id: 1}) RETURN n.id AS id"
        expect:
          contains:
            - "1"

  # ============================================
  # SCHEMA/CATALOG DDL
  # ============================================

  - name: "gql-create-graph"
    type: shell_steps
    description: "CREATE PROPERTY GRAPH"
    steps:
      - type: query
        text: "CREATE GRAPH gql_test_graph_1"
        expect:
          success: true
      - type: query
        text: "DROP GRAPH gql_test_graph_1"

  - name: "gql-create-graph-if-not-exists"
    type: shell_steps
    description: "CREATE GRAPH IF NOT EXISTS"
    steps:
      - type: query
        text: "CREATE GRAPH IF NOT EXISTS gql_test_graph_2"
        expect:
          success: true
      - type: query
        text: "CREATE GRAPH IF NOT EXISTS gql_test_graph_2"
        expect:
          success: true
      - type: query
        text: "DROP GRAPH gql_test_graph_2"

  - name: "gql-drop-graph"
    type: shell_steps
    description: "DROP GRAPH"
    steps:
      - type: query
        text: "CREATE GRAPH gql_drop_test"
      - type: query
        text: "DROP GRAPH gql_drop_test"
        expect:
          success: true

  - name: "gql-use-graph"
    type: shell_steps
    description: "USE GRAPH"
    steps:
      - type: query
        text: "CREATE GRAPH IF NOT EXISTS gql_use_test"
      - type: query
        text: "USE GRAPH gql_use_test"
        expect:
          success: true

  # ============================================
  # MATCH STATEMENT
  # ============================================

  - name: "gql-match-node-pattern"
    type: shell_steps
    description: "MATCH with node pattern"
    steps:
      - type: query
        text: "CREATE (n:GqlMatchTest {id: 1})"
      - type: query
        text: "MATCH (n:GqlMatchTest) RETURN n.id AS id"
        expect:
          contains:
            - "1"

  - name: "gql-match-relationship-pattern"
    type: shell_steps
    description: "MATCH with relationship pattern"
    steps:
      - type: query
        text: "CREATE (a:GqlRelTest {id: 1})-[:CONNECTS]->(b:GqlRelTest {id: 2})"
      - type: query
        text: "MATCH (a:GqlRelTest)-[:CONNECTS]->(b:GqlRelTest) RETURN a.id AS from_id, b.id AS to_id"
        expect:
          contains:
            - "1"
            - "2"

  - name: "gql-match-bidirectional"
    type: shell_steps
    description: "MATCH with bidirectional relationship"
    steps:
      - type: query
        text: "CREATE (a:BiDirTest {id: 1})-[:LINK]->(b:BiDirTest {id: 2})"
      - type: query
        text: "MATCH (a:BiDirTest)-[:LINK]-(b:BiDirTest) WHERE a.id = 2 RETURN b.id AS other"
        expect:
          contains:
            - "1"

  # ============================================
  # WHERE CLAUSE
  # ============================================

  - name: "gql-where-equality"
    type: shell_steps
    description: "WHERE with equality"
    steps:
      - type: query
        text: "CREATE (n:WhereEqTest {id: 1, status: 'active'})"
      - type: query
        text: "MATCH (n:WhereEqTest) WHERE n.status = 'active' RETURN n.id AS id"
        expect:
          contains:
            - "1"

  - name: "gql-where-and"
    type: shell_steps
    description: "WHERE with AND"
    steps:
      - type: query
        text: "CREATE (n:WhereAndTest {a: 1, b: 2})"
      - type: query
        text: "MATCH (n:WhereAndTest) WHERE n.a = 1 AND n.b = 2 RETURN n.a AS a"
        expect:
          contains:
            - "1"

  - name: "gql-where-or"
    type: shell_steps
    description: "WHERE with OR"
    steps:
      - type: query
        text: "CREATE (n:WhereOrTest {x: 5})"
      - type: query
        text: "MATCH (n:WhereOrTest) WHERE n.x = 5 OR n.x = 10 RETURN n.x AS x"
        expect:
          contains:
            - "5"

  - name: "gql-where-not"
    type: shell_steps
    description: "WHERE with NOT"
    steps:
      - type: query
        text: "CREATE (n:WhereNotTest {flag: false})"
      - type: query
        text: "MATCH (n:WhereNotTest) WHERE NOT n.flag RETURN count(n) AS cnt"
        expect:
          success: true

  - name: "gql-where-is-null"
    type: shell_steps
    description: "WHERE with IS NULL"
    steps:
      - type: query
        text: "CREATE (n:NullTest {a: 1})"
      - type: query
        text: "MATCH (n:NullTest) WHERE n.b IS NULL RETURN n.a AS a"
        expect:
          contains:
            - "1"

  - name: "gql-where-is-not-null"
    type: shell_steps
    description: "WHERE with IS NOT NULL"
    steps:
      - type: query
        text: "CREATE (n:NotNullTest {a: 1})"
      - type: query
        text: "MATCH (n:NotNullTest) WHERE n.a IS NOT NULL RETURN n.a AS a"
        expect:
          contains:
            - "1"

  - name: "gql-where-exists"
    type: shell_steps
    description: "WHERE with EXISTS"
    steps:
      - type: query
        text: "CREATE (a:ExTest {id: 1})-[:HAS]->(b:ExTest {id: 2})"
      - type: query
        text: "MATCH (n:ExTest) WHERE EXISTS { (n)-[:HAS]->() } RETURN n.id AS id"
        expect:
          success: true

  - name: "gql-where-like"
    type: shell_steps
    description: "WHERE with LIKE"
    steps:
      - type: query
        text: "CREATE (n:LikeTest {name: 'hello_world'})"
      - type: query
        text: "MATCH (n:LikeTest) WHERE n.name LIKE 'hello%' RETURN n.name AS name"
        expect:
          contains:
            - "hello"

  # ============================================
  # RETURN STATEMENT
  # ============================================

  - name: "gql-return-literal-integer"
    type: shell_query
    description: "RETURN integer literal"
    query: "RETURN 42 AS num"
    expect:
      rows: 1
      contains:
        - "42"

  - name: "gql-return-literal-string"
    type: shell_query
    description: "RETURN string literal"
    query: "RETURN 'hello' AS msg"
    expect:
      rows: 1
      contains:
        - "hello"

  - name: "gql-return-literal-true"
    type: shell_query
    description: "RETURN TRUE literal"
    query: "RETURN TRUE AS val"
    expect:
      rows: 1

  - name: "gql-return-literal-false"
    type: shell_query
    description: "RETURN FALSE literal"
    query: "RETURN FALSE AS val"
    expect:
      rows: 1

  - name: "gql-return-literal-null"
    type: shell_query
    description: "RETURN NULL literal"
    query: "RETURN NULL AS val"
    expect:
      rows: 1

  - name: "gql-return-distinct"
    type: shell_steps
    description: "RETURN DISTINCT"
    steps:
      - type: query
        text: "CREATE (n:DistTest {cat: 'A'})"
      - type: query
        text: "CREATE (n:DistTest {cat: 'A'})"
      - type: query
        text: "CREATE (n:DistTest {cat: 'B'})"
      - type: query
        text: "MATCH (n:DistTest) RETURN DISTINCT n.cat AS cat ORDER BY cat"
        expect:
          rows: 2

  # ============================================
  # ORDER BY CLAUSE
  # ============================================

  - name: "gql-order-by-asc"
    type: shell_steps
    description: "ORDER BY ASC"
    steps:
      - type: query
        text: "CREATE (n:OrderAscTest {v: 3})"
      - type: query
        text: "CREATE (n:OrderAscTest {v: 1})"
      - type: query
        text: "CREATE (n:OrderAscTest {v: 2})"
      - type: query
        text: "MATCH (n:OrderAscTest) RETURN n.v AS v ORDER BY n.v ASC"
        expect:
          success: true

  - name: "gql-order-by-desc"
    type: shell_steps
    description: "ORDER BY DESC"
    steps:
      - type: query
        text: "CREATE (n:OrderDescTest {v: 1})"
      - type: query
        text: "CREATE (n:OrderDescTest {v: 3})"
      - type: query
        text: "CREATE (n:OrderDescTest {v: 2})"
      - type: query
        text: "MATCH (n:OrderDescTest) RETURN n.v AS v ORDER BY n.v DESC LIMIT 1"
        expect:
          contains:
            - "3"

  - name: "gql-order-by-nulls-first"
    type: shell_steps
    description: "ORDER BY NULLS FIRST"
    steps:
      - type: query
        text: "CREATE (n:NullsFirstTest {v: 1})"
      - type: query
        text: "CREATE (n:NullsFirstTest {})"
      - type: query
        text: "MATCH (n:NullsFirstTest) RETURN n.v AS v ORDER BY n.v NULLS FIRST"
        expect:
          success: true

  - name: "gql-order-by-nulls-last"
    type: shell_steps
    description: "ORDER BY NULLS LAST"
    steps:
      - type: query
        text: "CREATE (n:NullsLastTest {v: 1})"
      - type: query
        text: "CREATE (n:NullsLastTest {})"
      - type: query
        text: "MATCH (n:NullsLastTest) RETURN n.v AS v ORDER BY n.v NULLS LAST"
        expect:
          success: true

  # ============================================
  # LIMIT / SKIP / OFFSET
  # ============================================

  - name: "gql-limit"
    type: shell_steps
    description: "LIMIT clause"
    steps:
      - type: query
        text: "CREATE (n:LimitTest {id: 1})"
      - type: query
        text: "CREATE (n:LimitTest {id: 2})"
      - type: query
        text: "CREATE (n:LimitTest {id: 3})"
      - type: query
        text: "MATCH (n:LimitTest) RETURN n.id AS id LIMIT 2"
        expect:
          rows: 2

  - name: "gql-skip"
    type: shell_steps
    description: "SKIP clause"
    steps:
      - type: query
        text: "CREATE (n:SkipTest {id: 1})"
      - type: query
        text: "CREATE (n:SkipTest {id: 2})"
      - type: query
        text: "CREATE (n:SkipTest {id: 3})"
      - type: query
        text: "MATCH (n:SkipTest) RETURN n.id AS id ORDER BY n.id SKIP 1"
        expect:
          rows: 2

  - name: "gql-offset"
    type: shell_steps
    description: "OFFSET clause (alias for SKIP)"
    steps:
      - type: query
        text: "CREATE (n:OffsetTest {id: 1})"
      - type: query
        text: "CREATE (n:OffsetTest {id: 2})"
      - type: query
        text: "MATCH (n:OffsetTest) RETURN n.id AS id ORDER BY n.id OFFSET 1"
        expect:
          rows: 1

  # ============================================
  # CREATE STATEMENT
  # ============================================

  - name: "gql-create-node"
    type: shell_steps
    description: "CREATE node"
    steps:
      - type: query
        text: "CREATE (n:CreateNodeTest {id: 1})"
        expect:
          success: true
      - type: query
        text: "MATCH (n:CreateNodeTest {id: 1}) RETURN n.id AS id"
        expect:
          contains:
            - "1"

  - name: "gql-create-relationship"
    type: shell_steps
    description: "CREATE relationship"
    steps:
      - type: query
        text: "CREATE (a:CreateRelTest {id: 1})-[:KNOWS]->(b:CreateRelTest {id: 2})"
        expect:
          success: true
      - type: query
        text: "MATCH (a)-[:KNOWS]->(b) WHERE a:CreateRelTest RETURN a.id AS from_id"
        expect:
          contains:
            - "1"

  # ============================================
  # DELETE STATEMENT
  # ============================================

  - name: "gql-delete-node"
    type: shell_steps
    description: "DELETE node"
    steps:
      - type: query
        text: "CREATE (n:DeleteNodeTest {id: 1})"
      - type: query
        text: "MATCH (n:DeleteNodeTest {id: 1}) DELETE n"
      - type: query
        text: "MATCH (n:DeleteNodeTest {id: 1}) RETURN count(n) AS cnt"
        expect:
          contains:
            - "0"

  - name: "gql-detach-delete"
    type: shell_steps
    description: "DETACH DELETE node"
    steps:
      - type: query
        text: "CREATE (a:DetachDelTest {id: 1})-[:REL]->(b:DetachDelTest {id: 2})"
      - type: query
        text: "MATCH (n:DetachDelTest {id: 1}) DETACH DELETE n"
      - type: query
        text: "MATCH (n:DetachDelTest {id: 1}) RETURN count(n) AS cnt"
        expect:
          contains:
            - "0"

  # ============================================
  # SET STATEMENT
  # ============================================

  - name: "gql-set-property"
    type: shell_steps
    description: "SET property"
    steps:
      - type: query
        text: "CREATE (n:SetPropTest {id: 1, value: 10})"
      - type: query
        text: "MATCH (n:SetPropTest {id: 1}) SET n.value = 20"
      - type: query
        text: "MATCH (n:SetPropTest {id: 1}) RETURN n.value AS value"
        expect:
          contains:
            - "20"

  - name: "gql-set-multiple"
    type: shell_steps
    description: "SET multiple properties"
    steps:
      - type: query
        text: "CREATE (n:SetMultTest {id: 1})"
      - type: query
        text: "MATCH (n:SetMultTest {id: 1}) SET n.a = 1, n.b = 2"
      - type: query
        text: "MATCH (n:SetMultTest {id: 1}) RETURN n.a AS a, n.b AS b"
        expect:
          contains:
            - "1"
            - "2"

  # ============================================
  # REMOVE STATEMENT
  # ============================================

  - name: "gql-remove-property"
    type: shell_steps
    description: "REMOVE property"
    steps:
      - type: query
        text: "CREATE (n:RemovePropTest {id: 1, temp: 'value'})"
      - type: query
        text: "MATCH (n:RemovePropTest {id: 1}) REMOVE n.temp"
      - type: query
        text: "MATCH (n:RemovePropTest {id: 1}) RETURN n.temp AS temp"
        expect:
          success: true

  # ============================================
  # SET OPERATIONS (UNION, INTERSECT, EXCEPT)
  # ============================================

  - name: "gql-union-all"
    type: shell_query
    description: "UNION ALL"
    query: "RETURN 1 AS x UNION ALL RETURN 1 AS x"
    expect:
      rows: 2

  - name: "gql-union"
    type: shell_query
    description: "UNION (distinct)"
    query: "RETURN 1 AS x UNION RETURN 1 AS x"
    expect:
      rows: 1

  - name: "gql-intersect"
    type: shell_query
    description: "INTERSECT"
    query: "RETURN 1 AS x INTERSECT RETURN 1 AS x"
    expect:
      rows: 1

  - name: "gql-except"
    type: shell_query
    description: "EXCEPT"
    query: "RETURN 1 AS x EXCEPT RETURN 2 AS x"
    expect:
      rows: 1

  # ============================================
  # CALL STATEMENT
  # ============================================

  - name: "gql-call-procedure"
    type: shell_steps
    description: "CALL procedure"
    steps:
      - type: query
        text: "CREATE (n:CallProcTest {id: 1})"
      - type: query
        text: "CALL db.labels() YIELD label RETURN label"
        expect:
          success: true

  # ============================================
  # INSERT STATEMENT
  # ============================================

  - name: "gql-insert-node"
    type: shell_steps
    description: "INSERT node (GQL standard)"
    steps:
      - type: query
        text: "INSERT (n:InsertTest {id: 1})"
        expect:
          success: true

  - name: "gql-insert-relationship"
    type: shell_steps
    description: "INSERT with relationship (GQL standard)"
    steps:
      - type: query
        text: "CREATE (a:InsertRelTest1 {id: 1}), (b:InsertRelTest1 {id: 2})"
      - type: query
        text: "MATCH (a:InsertRelTest1 {id: 1}), (b:InsertRelTest1 {id: 2}) INSERT (a)-[:INSERTED_REL]->(b)"
        expect:
          success: true

  # ============================================
  # FINISH STATEMENT
  # ============================================

  - name: "gql-finish-statement"
    type: shell_steps
    description: "FINISH statement (terminates without returning)"
    steps:
      - type: query
        text: "MATCH (n) FINISH"
        expect:
          success: true

  # ============================================
  # VARIABLE LENGTH PATHS
  # ============================================

  - name: "gql-path-variable-length-range"
    type: shell_steps
    description: "Variable length path with range *1..3"
    steps:
      - type: query
        text: "CREATE (a:VarPath1 {id: 1})-[:STEP]->(b:VarPath1 {id: 2})-[:STEP]->(c:VarPath1 {id: 3})"
      - type: query
        text: "MATCH (a:VarPath1 {id: 1})-[:STEP*1..2]->(n) RETURN n.id AS id ORDER BY n.id"
        expect:
          rows: 2
          contains:
            - "2"
            - "3"

  - name: "gql-path-variable-length-min"
    type: shell_steps
    description: "Variable length path with minimum *2.."
    steps:
      - type: query
        text: "CREATE (a:VarPath2 {id: 1})-[:HOP]->(b:VarPath2 {id: 2})-[:HOP]->(c:VarPath2 {id: 3})"
      - type: query
        text: "MATCH (a:VarPath2 {id: 1})-[:HOP*2..]->(n) RETURN n.id AS id"
        expect:
          contains:
            - "3"

  - name: "gql-path-variable-length-exact"
    type: shell_steps
    description: "Variable length path with exact count *2"
    steps:
      - type: query
        text: "CREATE (a:VarPath3 {id: 1})-[:JUMP]->(b:VarPath3 {id: 2})-[:JUMP]->(c:VarPath3 {id: 3})"
      - type: query
        text: "MATCH (a:VarPath3 {id: 1})-[:JUMP*2]->(n) RETURN n.id AS id"
        expect:
          contains:
            - "3"

  # ============================================
  # MULTIPLE RELATIONSHIP TYPES
  # ============================================

  - name: "gql-rel-multiple-types"
    type: shell_steps
    description: "Match multiple relationship types with |"
    steps:
      - type: query
        text: "CREATE (a:MultiType {id: 1})-[:TYPE_A]->(b:MultiType {id: 2})"
      - type: query
        text: "CREATE (c:MultiType {id: 3})-[:TYPE_B]->(d:MultiType {id: 4})"
      - type: query
        text: "MATCH (a:MultiType)-[:TYPE_A|TYPE_B]->(b:MultiType) RETURN a.id AS from_id ORDER BY a.id"
        expect:
          rows: 2
          contains:
            - "1"
            - "3"

  # ============================================
  # STRING CONCATENATION (GQL uses ||)
  # ============================================

  - name: "gql-string-concat-operator"
    type: shell_query
    description: "String concatenation with || operator"
    query: "RETURN 'Hello' || ' ' || 'World' AS greeting"
    expect:
      rows: 1
      contains:
        - "Hello World"

  # ============================================
  # IS TRUE/FALSE/UNKNOWN
  # ============================================

  - name: "gql-is-true"
    type: shell_query
    description: "IS TRUE expression"
    query: "RETURN (1 > 0) IS TRUE AS result"
    expect:
      rows: 1

  - name: "gql-is-false"
    type: shell_query
    description: "IS FALSE expression"
    query: "RETURN (1 > 10) IS FALSE AS result"
    expect:
      rows: 1

  - name: "gql-is-not-true"
    type: shell_query
    description: "IS NOT TRUE expression"
    query: "RETURN (1 > 10) IS NOT TRUE AS result"
    expect:
      rows: 1

  - name: "gql-is-unknown"
    type: shell_query
    description: "IS UNKNOWN expression (NULL comparisons)"
    query: "RETURN (NULL = 1) IS UNKNOWN AS result"
    expect:
      rows: 1

  # ============================================
  # COMPARISON OPERATORS
  # ============================================

  - name: "gql-compare-not-equal-angle"
    type: shell_query
    description: "Not equal with <>"
    query: "RETURN 5 <> 3 AS result"
    expect:
      rows: 1

  - name: "gql-compare-not-equal-bang"
    type: shell_query
    description: "Not equal with !="
    query: "RETURN 5 != 3 AS result"
    expect:
      rows: 1

  - name: "gql-compare-less-equal"
    type: shell_query
    description: "Less than or equal"
    query: "RETURN 3 <= 5 AS result"
    expect:
      rows: 1

  - name: "gql-compare-greater-equal"
    type: shell_query
    description: "Greater than or equal"
    query: "RETURN 5 >= 3 AS result"
    expect:
      rows: 1

  # ============================================
  # NODETACH DELETE
  # ============================================

  - name: "gql-nodetach-delete"
    type: shell_steps
    description: "NODETACH DELETE (fails if node has relationships)"
    steps:
      - type: query
        text: "CREATE (n:NoDetachTest {id: 1})"
      - type: query
        text: "MATCH (n:NoDetachTest {id: 1}) NODETACH DELETE n"
        expect:
          success: true

  # ============================================
  # SET/REMOVE LABEL
  # ============================================

  - name: "gql-set-label"
    type: shell_steps
    description: "SET label on node"
    steps:
      - type: query
        text: "CREATE (n:SetLabelTest {id: 1})"
      - type: query
        text: "MATCH (n:SetLabelTest {id: 1}) SET n:NewLabel"
      - type: query
        text: "MATCH (n:NewLabel {id: 1}) RETURN n.id AS id"
        expect:
          contains:
            - "1"

  - name: "gql-remove-label"
    type: shell_steps
    description: "REMOVE label from node"
    steps:
      - type: query
        text: "CREATE (n:RemLabel1:RemLabel2 {id: 1})"
      - type: query
        text: "MATCH (n:RemLabel1 {id: 1}) REMOVE n:RemLabel2"
        expect:
          success: true

  # ============================================
  # PARAMETER REFERENCES
  # ============================================

  # Note: Parameter tests require parameter binding support in the shell
  # These tests verify the parser accepts parameter syntax

  - name: "gql-parameter-in-where"
    type: shell_steps
    description: "Parameter reference $param in WHERE"
    steps:
      - type: query
        text: "CREATE (n:ParamTest {id: 1})"
      # Note: Without parameter binding, this may return no results
      # The test verifies syntax acceptance
      - type: query
        text: "MATCH (n:ParamTest) WHERE n.id = $id RETURN n.id AS id"
        expect:
          success: true

  # ============================================
  # CALL WITH YIELD
  # ============================================

  - name: "gql-call-yield-multiple"
    type: shell_steps
    description: "CALL with YIELD and alias"
    steps:
      - type: query
        text: "CREATE (n:YieldTest {id: 1})"
      - type: query
        text: "CALL db.labels() YIELD label AS l RETURN l"
        expect:
          success: true

  # ============================================
  # SESSION COMMANDS (Additional)
  # ============================================

  - name: "gql-session-close"
    type: shell_query
    description: "SESSION CLOSE command"
    query: "SESSION CLOSE"
    expect:
      success: true

