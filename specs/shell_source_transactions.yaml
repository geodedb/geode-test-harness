version: "1.0"
name: "Shell Source File and Transaction Tests"
description: "Tests for /source command and transaction handling"

manage_server: true

tests:
  # ============================================
  # BASIC SOURCE COMMAND
  # ============================================

  - name: "shell-source-single-statement"
    type: shell_source
    description: "Source file with single statement"
    source_content: |
      CREATE (n:SourceSingle {id: 1});
    expect:
      success: true
    verify:
      query: "MATCH (n:SourceSingle {id: 1}) RETURN count(n) AS cnt"
      contains:
        - "1"

  - name: "shell-source-multiple-statements"
    type: shell_source
    description: "Source file with multiple statements"
    source_content: |
      CREATE (n:SourceMulti {id: 1});
      CREATE (n:SourceMulti {id: 2});
      CREATE (n:SourceMulti {id: 3});
    expect:
      success: true
    verify:
      query: "MATCH (n:SourceMulti) RETURN count(n) AS cnt"
      contains:
        - "3"

  - name: "shell-source-with-comments"
    type: shell_source
    description: "Source file with comments"
    source_content: |
      -- This is a comment
      CREATE (n:SourceComment {id: 1});
      # Another comment style
      CREATE (n:SourceComment {id: 2});
      // Third comment style
      CREATE (n:SourceComment {id: 3});
    expect:
      success: true

  - name: "shell-source-with-blank-lines"
    type: shell_source
    description: "Source file with blank lines"
    source_content: |
      CREATE (n:SourceBlank {id: 1});

      CREATE (n:SourceBlank {id: 2});


      CREATE (n:SourceBlank {id: 3});
    expect:
      success: true

  - name: "shell-source-complex-queries"
    type: shell_source
    description: "Source file with complex queries"
    source_content: |
      CREATE (a:SourceComplex {name: 'Alice', age: 30});
      CREATE (b:SourceComplex {name: 'Bob', age: 25});
      MATCH (a:SourceComplex {name: 'Alice'}), (b:SourceComplex {name: 'Bob'})
      CREATE (a)-[:KNOWS {since: 2020}]->(b);
    expect:
      success: true

  # ============================================
  # SOURCE WITH META-COMMANDS
  # ============================================

  - name: "shell-source-with-format"
    type: shell_source
    description: "Source file with format command"
    source_content: |
      \format json
      CREATE (n:SourceFormat {id: 1});
    expect:
      success: true

  - name: "shell-source-with-timing"
    type: shell_source
    description: "Source file with timing command"
    source_content: |
      \timing on
      CREATE (n:SourceTiming {id: 1});
      \timing off
    expect:
      success: true

  - name: "shell-source-with-echo"
    type: shell_source
    description: "Source file with echo command"
    source_content: |
      \echo Starting data load...
      CREATE (n:SourceEcho {id: 1});
      \echo Data load complete!
    expect:
      success: true

  # ============================================
  # BASIC TRANSACTIONS
  # ============================================

  - name: "shell-txn-simple-commit"
    type: shell_steps
    description: "Simple transaction with commit"
    steps:
      - type: command
        text: "\\begin"
        expect:
          success: true
      - type: query
        text: "CREATE (n:TxnCommit {id: 1})"
      - type: command
        text: "\\commit"
        expect:
          success: true
      - type: query
        text: "MATCH (n:TxnCommit {id: 1}) RETURN n.id AS id"
        expect:
          contains:
            - "1"

  - name: "shell-txn-simple-rollback"
    type: shell_steps
    description: "Simple transaction with rollback"
    steps:
      - type: command
        text: "\\begin"
        expect:
          success: true
      - type: query
        text: "CREATE (n:TxnRollback {id: 999})"
      - type: command
        text: "\\rollback"
        expect:
          success: true
      - type: query
        text: "MATCH (n:TxnRollback {id: 999}) RETURN count(n) AS cnt"
        expect:
          contains:
            - "0"

  - name: "shell-txn-multiple-operations"
    type: shell_steps
    description: "Transaction with multiple operations"
    steps:
      - type: command
        text: "\\begin"
      - type: query
        text: "CREATE (n:TxnMulti {id: 1, value: 10})"
      - type: query
        text: "CREATE (n:TxnMulti {id: 2, value: 20})"
      - type: query
        text: "MATCH (n:TxnMulti {id: 1}) SET n.value = 15"
      - type: command
        text: "\\commit"
      - type: query
        text: "MATCH (n:TxnMulti) RETURN sum(n.value) AS total"
        expect:
          contains:
            - "35"

  # ============================================
  # TRANSACTION WITH GQL KEYWORDS
  # ============================================

  - name: "shell-txn-begin-gql"
    type: shell_steps
    description: "Transaction using BEGIN GQL keyword"
    steps:
      - type: query
        text: "BEGIN;"
      - type: query
        text: "CREATE (n:TxnBeginGql {id: 1})"
      - type: query
        text: "COMMIT;"
      - type: query
        text: "MATCH (n:TxnBeginGql {id: 1}) RETURN n.id AS id"
        expect:
          contains:
            - "1"

  - name: "shell-txn-rollback-gql"
    type: shell_steps
    description: "Transaction rollback using ROLLBACK GQL keyword"
    steps:
      - type: query
        text: "BEGIN;"
      - type: query
        text: "CREATE (n:TxnRollbackGql {id: 999})"
      - type: query
        text: "ROLLBACK;"
      - type: query
        text: "MATCH (n:TxnRollbackGql {id: 999}) RETURN count(n) AS cnt"
        expect:
          contains:
            - "0"

  # ============================================
  # TRANSACTION ERROR HANDLING
  # ============================================

  - name: "shell-txn-error-recovery"
    type: shell_steps
    description: "Transaction error allows rollback"
    steps:
      - type: command
        text: "\\begin"
      - type: query
        text: "CREATE (n:TxnError {id: 1})"
      - type: query
        text: "INVALID SYNTAX"
        expect:
          error: true
      - type: command
        text: "\\rollback"
        expect:
          success: true

  - name: "shell-txn-commit-without-begin"
    type: shell_steps
    description: "Commit without begin might error"
    steps:
      - type: command
        text: "\\commit"
        expect:
          # Might error or be no-op
          success: true

  - name: "shell-txn-rollback-without-begin"
    type: shell_steps
    description: "Rollback without begin might error"
    steps:
      - type: command
        text: "\\rollback"
        expect:
          # Might error or be no-op
          success: true

  - name: "shell-txn-nested-begin"
    type: shell_steps
    description: "Nested begin might error"
    steps:
      - type: command
        text: "\\begin"
      - type: command
        text: "\\begin"
        expect:
          # Might error or be no-op
          success: true
      - type: command
        text: "\\rollback"

  # ============================================
  # SOURCE WITH TRANSACTIONS
  # ============================================

  - name: "shell-source-with-transaction"
    type: shell_source
    description: "Source file with transaction"
    source_content: |
      BEGIN;
      CREATE (n:SourceTxn {id: 1});
      CREATE (n:SourceTxn {id: 2});
      COMMIT;
    expect:
      success: true
    verify:
      query: "MATCH (n:SourceTxn) RETURN count(n) AS cnt"
      contains:
        - "2"

  - name: "shell-source-rollback-on-error"
    type: shell_source
    description: "Source file rolls back on error"
    source_content: |
      BEGIN;
      CREATE (n:SourceRollbackErr {id: 1});
      INVALID SYNTAX HERE;
      COMMIT;
    expect:
      error: true

  # ============================================
  # MULTI-STATEMENT QUERIES
  # ============================================

  - name: "shell-multi-statement-inline"
    type: shell_steps
    description: "Multiple statements in one line"
    steps:
      - type: query
        text: "CREATE (n:MultiInline {id: 1}); CREATE (n:MultiInline {id: 2})"
      - type: query
        text: "MATCH (n:MultiInline) RETURN count(n) AS cnt"
        expect:
          contains:
            - "2"

  - name: "shell-multi-statement-return"
    type: shell_steps
    description: "Multiple RETURN statements"
    steps:
      - type: query
        text: "RETURN 1 AS a; RETURN 2 AS b"
        expect:
          success: true

  # ============================================
  # ISOLATION TEST
  # ============================================

  - name: "shell-txn-isolation-uncommitted"
    type: shell_steps
    description: "Verify uncommitted changes are visible within transaction"
    steps:
      - type: command
        text: "\\begin"
      - type: query
        text: "CREATE (n:IsolationTest {id: 1})"
      - type: query
        text: "MATCH (n:IsolationTest {id: 1}) RETURN n.id AS id"
        expect:
          contains:
            - "1"
      - type: command
        text: "\\rollback"
