version: "1.0"
name: "Basic Client Tests"
description: "Fundamental client library functionality tests"

tests:
  - name: "simple-return"
    description: "Execute a simple RETURN statement"
    query: "RETURN 1 AS x"
    params: {}
    expect:
      rows: 1
      columns: ["x"]
      values:
        - x: 1
    timeout_ms: 5000

  - name: "multiple-columns"
    description: "Return multiple columns"
    query: "RETURN 1 AS x, 'Hello' AS greeting, true AS flag"
    params: {}
    expect:
      rows: 1
      columns: ["x", "greeting", "flag"]
      values:
        - x: 1
          greeting: "Hello"
          flag: true
    timeout_ms: 5000

  - name: "parameterized-query"
    description: "Test query with parameters"
    query: "RETURN $name AS name, $age AS age"
    params:
      name: "Alice"
      age: 30
    expect:
      rows: 1
      columns: ["name", "age"]
      values:
        - name: "Alice"
          age: 30
    timeout_ms: 5000

  - name: "multiple-parameters"
    description: "Query with multiple parameter types"
    query: "RETURN $str AS str, $int AS int, $bool AS bool, $null AS null_val"
    params:
      str: "test"
      int: 42
      bool: true
      null: null
    expect:
      rows: 1
      columns: ["str", "int", "bool", "null_val"]
    timeout_ms: 5000

  - name: "arithmetic"
    description: "Arithmetic operations"
    query: "RETURN 1 + 2 AS sum, 10 - 3 AS diff, 4 * 5 AS product, 20 / 4 AS quotient"
    params: {}
    expect:
      rows: 1
      columns: ["sum", "diff", "product", "quotient"]
      values:
        - sum: 3
          diff: 7
          product: 20
          quotient: 5
    timeout_ms: 5000

  - name: "string-operations"
    description: "String concatenation and operations"
    query: "RETURN 'Hello' + ' ' + 'World' AS greeting"
    params: {}
    expect:
      rows: 1
      columns: ["greeting"]
      values:
        - greeting: "Hello World"
    timeout_ms: 5000

  - name: "null-handling"
    description: "NULL value handling"
    query: "RETURN NULL AS null_value, 1 AS not_null"
    params: {}
    expect:
      rows: 1
      columns: ["null_value", "not_null"]
    timeout_ms: 5000

  - name: "array-literal"
    description: "Array literal support"
    query: "RETURN [1, 2, 3, 4, 5] AS numbers"
    params: {}
    expect:
      rows: 1
      columns: ["numbers"]
    timeout_ms: 5000

  - name: "object-literal"
    description: "Object literal support"
    query: "RETURN {name: 'Alice', age: 30} AS person"
    params: {}
    expect:
      rows: 1
      columns: ["person"]
    timeout_ms: 5000

  - name: "empty-result"
    description: "Query returning no rows"
    query: "MATCH (n:NonExistent) RETURN n"
    params: {}
    expect:
      rows: 0
      columns: ["n"]
    timeout_ms: 5000

  - name: "decimal-values"
    description: "Decimal value handling"
    query: "RETURN 3.14159 AS pi, 2.71828 AS e"
    params: {}
    expect:
      rows: 1
      columns: ["pi", "e"]
    timeout_ms: 5000

  - name: "boolean-logic"
    description: "Boolean operations"
    query: "RETURN true AND false AS and_result, true OR false AS or_result, NOT true AS not_result"
    params: {}
    expect:
      rows: 1
      columns: ["and_result", "or_result", "not_result"]
      values:
        - and_result: false
          or_result: true
          not_result: false
    timeout_ms: 5000

  - name: "comparison-operators"
    description: "Comparison operators"
    query: "RETURN 5 > 3 AS gt, 5 < 3 AS lt, 5 = 5 AS eq, 5 <> 3 AS ne"
    params: {}
    expect:
      rows: 1
      columns: ["gt", "lt", "eq", "ne"]
      values:
        - gt: true
          lt: false
          eq: true
          ne: true
    timeout_ms: 5000

  - name: "case-expression"
    description: "CASE expression support"
    query: |
      RETURN
        CASE
          WHEN 1 > 0 THEN 'positive'
          ELSE 'negative'
        END AS result
    params: {}
    expect:
      rows: 1
      columns: ["result"]
      values:
        - result: "positive"
    timeout_ms: 5000

  - name: "coalesce-function"
    description: "COALESCE function"
    query: "RETURN COALESCE(NULL, NULL, 'default') AS result"
    params: {}
    expect:
      rows: 1
      columns: ["result"]
      values:
        - result: "default"
    timeout_ms: 5000
