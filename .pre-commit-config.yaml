default_language_version:
  golang: 1.27.3
# Pre-commit configuration for Geode Test Harness
# https://pre-commit.com/

default_stages: [pre-commit]
fail_fast: false

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: trailing-whitespace
    args: [--markdown-linebreak-ext=md]
  - id: end-of-file-fixer
  - id: mixed-line-ending
    args: [--fix=lf]
  - id: check-yaml
  - id: check-json
  - id: check-toml
  - id: detect-private-key
  - id: check-added-large-files
    args: [--maxkb=1024]
  - id: check-merge-conflict
  - id: check-case-conflict
  - id: check-symlinks
  - id: destroyed-symlinks
  - id: check-executables-have-shebangs
  - id: check-shebang-scripts-are-executable

- repo: https://github.com/shellcheck-py/shellcheck-py
  rev: v0.11.0.1
  hooks:
  - id: shellcheck
    args: [--severity=error, --shell=bash]

- repo: https://github.com/igorshubovych/markdownlint-cli
  rev: v0.49.1
  hooks:
  - id: markdownlint
    args: [--fix, --disable, MD013, MD033, MD041, MD024, --]
    exclude: ^(CHANGELOG\.md)

- repo: https://github.com/macisamuele/language-formatters-pre-commit-hooks
  rev: v2.16.0
  hooks:
  - id: pretty-format-yaml
    args: [--autofix, --indent, '2']
    exclude: ^(\.gitlab-ci\.yml)

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.17.1
  hooks:
  - id: ruff
    args: [--fix]
  - id: ruff-format

- repo: https://github.com/commitizen-tools/commitizen
  rev: v4.19.2
  hooks:
  - id: commitizen
    stages: [commit-msg]

- repo: local
  hooks:
  - id: check-todos
    name: check for TODOs/FIXMEs
    entry: bash
    args:
    - -c
    - |
      files=$(git diff --cached --name-only | grep -v '\.pre-commit-config\.yaml' | xargs grep -l -E "(TODO|FIXME|XXX|HACK)" 2>/dev/null)
      if [ -n "$files" ]; then echo "Warning: Found TODO/FIXME markers in staged files:" && echo "$files" && exit 1; fi
      exit 0
    language: system
    pass_filenames: false
    verbose: true

ci:
  autofix_prs: true
  autofix_commit_msg: '[pre-commit.ci] auto fixes'
  autoupdate_schedule: weekly
  submodules: false
